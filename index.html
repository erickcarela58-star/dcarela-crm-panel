// y salio mal: faltaban 'abierto', 'en_revision' y 'desinteresado' de estado, y
// 'reservado' de reserva, y sobraba un 'esperando_nosotros' que no existe. Un valor
// que no esta en la lista no se puede volver a elegir desde el panel, asi que las
// fichas que ya lo tenian quedan atrapadas en un estado que nadie puede cambiar.
const ETAPAS = ['nuevo','interesado','cotizando','pendiente_reserva','reservado',
  'cliente','desinteresado','perdido'];
const ESTADOS = ['abierto','en_revision','esperando_cliente','requiere_humano',
  'desinteresado','cerrado'];
const RESERVA = ['sin_fecha','fecha_tentativa','reservado','confirmado','cancelado'];
const CATEGORIAS = ['XV','Infantil','Graduación','Cumpleaños','Embarazadas','Boda','Sesiones/Retratos','Maquillaje'];
const PRIORIDADES = ['urgente','alta','media','baja'];
const MAQUILLAJE = [
  ['','Pendiente'],['incluido','Incluido'],['extra','Extra desde RD$2,500'],['no_solicitado','No solicitado'],
];
const opciones = (lista, actual) => lista.map(v =>
  '<option value="' + v + '"' + (actual === v ? ' selected' : '') + '>' + v.replace(/_/g,' ') + '</option>').join('');
const opcionesPares = (lista, actual, vacia = false) =>
  (vacia ? '<option value="">—</option>' : '') + lista.map(([v,l]) =>
    '<option value="' + esc(v) + '"' + (actual === v ? ' selected' : '') + '>' + esc(l) + '</option>').join('');
function fechaLocal(v){
  if (!v) return '';
  const d = new Date(v); if (Number.isNaN(d.getTime())) return '';
  const dos = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + dos(d.getMonth()+1) + '-' + dos(d.getDate())
    + 'T' + dos(d.getHours()) + ':' + dos(d.getMinutes());
}
function valorCampoFicha(el){
  const campo = el.dataset.c;
  if (el.type === 'checkbox') return el.checked;
  if (!el.value) return null;
  if (campo === 'selected_combo_price' || campo === 'makeup_price') {
    const n = Number(el.value); return Number.isFinite(n) ? n : null;
  }
  if (campo === 'scheduled_at' || campo === 'follow_up_at') {
    const d = new Date(el.value); return Number.isNaN(d.getTime()) ? null : d.toISOString();
  }
  return el.value;
}

async function pintaTablaTpl(forzar){

  if (!lista.length) {
    cont.innerHTML = '<p class="bajada">Todavía no hay plantillas. Pulsa «Sincronizar con Meta».</p>';
    return;
  }
  cont.innerHTML = '<div class="tabla"><div class="fila cabecera">'
    + '<span>Plantilla</span><span>Estado en Meta</span><span>Variables</span><span>Activa</span></div>'
    + lista.map((t,i) => {
      const estado = String(t.meta_status || '').toUpperCase() || 'DESCONOCIDO';
      const cls = estado === 'APPROVED' ? 'ok' : estado === 'REJECTED' ? 'mal' : 'medio';
      return '<div class="fila">'

        + '<span><i class="chip ' + cls + '">' + esc(estado) + '</i></span>'
        + '<span>' + ((t.parameter_keys || []).join(', ') || '—') + '</span>'
        + '<span><button class="interruptor' + (t.active !== false ? ' on' : '') + '" data-tpl="' + i + '">'
        +   (t.active !== false ? 'sí' : 'no') + '</button></span>'
        + '</div>';
    }).join('') + '</div>';
  cont.onclick = async ev => {
    const b = ev.target.closest('[data-tpl]'); if (!b) return;
    const t = lista[Number(b.dataset.tpl)], siguiente = !(t.active !== false);
    b.disabled = true;

  };

/* ---- Informes internos: supervisor de atención --------------------------- */
let CALIDAD = { reports:[], notifications:[], unread:0 };
let CALIDAD_INICIADA = false, CALIDAD_TIMER = null;
let CALIDAD_CONOCIDOS = new Set();

function pintaCuentaCalidad(){
  const cuenta = document.querySelector('[data-cuenta="informes"]');
  if (!cuenta) return;
  cuenta.textContent = CALIDAD.unread || '';
  cuenta.hidden = !CALIDAD.unread;
}

// ---- Informes: filtros (piezas puras)
// Cada hallazgo del supervisor pertenece a un tema. Este mapa se repite en el servidor
// (service-quality.js, THEME_OF_CATEGORY) y una prueba comprueba que coinciden.
const TEMAS_INFORME = [
  { id:'demora', nombre:'Sin respuesta', categorias:['slow_response','unanswered','repeated_customer_messages'] },
  { id:'trato', nombre:'Mal tono o servicio', categorias:['operator_tone','customer_concern'] },
  { id:'informacion', nombre:'Mala información', categorias:['wrong_info'] },
  { id:'deficiencias', nombre:'Deficiencias', categorias:['deficiency'] },
  { id:'delicado', nombre:'Temas delicados', categorias:['sensitive'] },
  { id:'eliminados', nombre:'Eliminados', categorias:['deleted_message'] },
];
const DURACIONES_INFORME = [[0,'Cualquier duración'],[15,'15 min o más'],[60,'1 h o más'],[120,'2 h o más'],[240,'4 h o más'],[720,'12 h o más']];
function temaDeAlerta(a){
  if (a && a.theme) return a.theme;
  const t = TEMAS_INFORME.find(x => x.categorias.includes(a && a.category));
  return t ? t.id : 'otros';
}
function minutosDeAlerta(a){
  const n = Number(a && (a.response_minutes != null ? a.response_minutes : a.waiting_minutes));
  return Number.isFinite(n) ? n : null;
}
function textoDuracion(min){
  if (min == null) return '';
  if (min < 60) return min + ' min';
  const h = Math.floor(min / 60), m = min % 60;
  return h + ' h' + (m ? ' ' + m + ' min' : '');
}
// f = { tema, gravedad, minutos, operador }. gravedad 'relevantes' (lo normal) oculta lo de gravedad
// baja SOLO mientras se mira «Todos»: elegir el tema Eliminados tiene que enseñar los eliminados.
function filtraAlertas(alertas, f){
  return (alertas || []).filter(a => {
    if (f.tema && f.tema !== 'todos' && temaDeAlerta(a) !== f.tema) return false;
    if (f.gravedad === 'relevantes') { if ((!f.tema || f.tema === 'todos') && a.severity === 'low') return false; }
    else if (f.gravedad && a.severity !== f.gravedad) return false;
    if (f.operador && String(a.operator_name || a.operator_uid || '') !== f.operador) return false;
    if (f.minutos) { const m = minutosDeAlerta(a); if (m == null || m < f.minutos) return false; }
    return true;
  });
}
// Cuantos hay por tema con los DEMAS filtros puestos (no el del propio tema).
function contadoresPorTema(alertas, f){
  const base = filtraAlertas(alertas, Object.assign({}, f, { tema:'todos' }));
  const c = { todos: base.length };
  for (const t of TEMAS_INFORME) c[t.id] = base.filter(a => temaDeAlerta(a) === t.id).length;
  return c;
}
function ordenaAlertas(alertas){
  const peso = { high:0, medium:1, low:2 };
  return alertas.slice().sort((a, b) => (peso[a.severity] != null ? peso[a.severity] : 3) - (peso[b.severity] != null ? peso[b.severity] : 3)
    || String(b.message_at || '').localeCompare(String(a.message_at || '')));
}
// ---- Informes: fin de las piezas puras
let FILTRO_INFORMES = { tema:'todos', gravedad:'relevantes', minutos:0, operador:'' };
let INFORMES_LIMITE = 30;

function pintaInformes(){
  const cont = $('calidadCuerpo');
  if (!cont) return;
  const reports = CALIDAD.reports || [], avisos = CALIDAD.notifications || [];
  const abiertos = avisos.filter(a => a.status === 'unread');
  const conRiesgo = reports.filter(r => r.risk === 'high').length;
  const promedio = reports.length ? Math.round(reports.reduce((s,r) => s + Number(r.score || 0), 0) / reports.length) : 0;
  const porOperador = new Map();
  for (const report of reports) for (const metric of (report.operator_metrics || [])) {
    const uid = metric.operator_uid || metric.operator_name;
    if (!uid) continue;
    const row = porOperador.get(uid) || { nombre:metric.operator_name || 'Sin identificar', replies:0,
      response_count:0, response_total:0, slow:0, tone:0 };
    row.replies += Number(metric.replies || 0);
    row.response_count += Number(metric.response_count || 0);
    row.response_total += Number(metric.average_response_minutes || 0) * Number(metric.response_count || 0);
    row.slow += Number(metric.slow_responses || 0);
    row.tone += Number(metric.tone_alerts || 0);
    porOperador.set(uid, row);
  }
  const operadores = [...porOperador.values()].sort((a,b) => b.tone - a.tone || b.slow - a.slow || b.replies - a.replies);
  // Todos los hallazgos de todas las conversaciones, con su cliente y, si existe, el aviso por revisar.
  const hallazgos = reports.flatMap(r => (r.alerts || []).map(a => Object.assign({}, a, {
    conversation_id: r.conversation_id, customer_name: r.customer_name || r.customer_phone || 'Cliente',
    aviso: abiertos.find(n => n.conversation_id === r.conversation_id && n.category === a.category && n.message_id === a.message_id) || null,
  })));
  const filtrados = ordenaAlertas(filtraAlertas(hallazgos, FILTRO_INFORMES));
  const conteo = contadoresPorTema(hallazgos, FILTRO_INFORMES);
  const nombresOperador = [...new Set(hallazgos.map(a => a.operator_name || a.operator_uid).filter(Boolean).map(String))].sort();
  const filtrosActivos = FILTRO_INFORMES.tema !== 'todos' || FILTRO_INFORMES.minutos || FILTRO_INFORMES.operador
    || FILTRO_INFORMES.gravedad !== 'relevantes';
  const conversacionesFiltradas = filtrosActivos
    ? reports.filter(r => filtrados.some(a => a.conversation_id === r.conversation_id)) : reports;
  const chip = (id, nombre) => '<button class="chip-tema' + (FILTRO_INFORMES.tema === id ? ' on' : '') + '" data-calidad-tema="' + id + '">'
    + esc(nombre) + ' <span class="n">' + (conteo[id] || 0) + '</span></button>';
  const opciones2 = (lista, actual) => lista.map(([v, l]) => '<option value="' + esc(v) + '"' + (String(actual) === String(v) ? ' selected' : '') + '>' + esc(l) + '</option>').join('');
  cont.innerHTML = '<div class="calidad-resumen">'
    + '<div class="calidad-kpi"><b>' + abiertos.length + '</b><span>avisos por revisar</span></div>'
    + '<div class="calidad-kpi"><b>' + conRiesgo + '</b><span>conversaciones de riesgo alto</span></div>'
    + '<div class="calidad-kpi"><b>' + (reports.length ? promedio : '—') + '</b><span>nota media de atención / 100</span></div>'
    + '<div class="calidad-kpi"><b>' + reports.length + '</b><span>conversaciones analizadas</span></div></div>'
    + '<div class="calidad-filtros">'
    +   '<div class="chips-tema">' + chip('todos', 'Todos') + TEMAS_INFORME.map(t => chip(t.id, t.nombre)).join('') + '</div>'
    +   '<div class="selects-filtro">'
    +     '<label>Gravedad<select data-calidad-filtro="gravedad">' + opciones2([['relevantes','Alta y media'],['high','Solo alta'],['medium','Solo media'],['low','Solo informe (baja)']], FILTRO_INFORMES.gravedad) + '</select></label>'
    +     '<label>Sin respuesta<select data-calidad-filtro="minutos">' + opciones2(DURACIONES_INFORME, FILTRO_INFORMES.minutos) + '</select></label>'
    +     '<label>Operador<select data-calidad-filtro="operador"><option value="">Todos</option>' + opciones2(nombresOperador.map(n => [n, n]), FILTRO_INFORMES.operador) + '</select></label>'
    +     (filtrosActivos ? '<button class="btn-linea" data-calidad-limpiar>Quitar filtros</button>' : '')
    +   '</div></div>'
    + '<div class="calidad-lista">' + (filtrados.length ? filtrados.slice(0, INFORMES_LIMITE).map(a => {
      const tema = TEMAS_INFORME.find(t => t.id === temaDeAlerta(a));
      const dur = textoDuracion(minutosDeAlerta(a));
      return '<div class="calidad-aviso ' + (a.severity === 'high' ? 'alta' : a.severity === 'low' ? 'baja' : 'media') + '">'
        + '<div><span class="tema-tag">' + esc(tema ? tema.nombre : 'Otros') + '</span>'
        + (dur ? ' <span class="dur-tag">' + esc(dur) + '</span>' : '')
        + '<b>' + esc(a.customer_name) + ' · ' + esc(a.label || 'Atención requerida') + '</b>'
        + '<p>' + esc(a.evidence || 'Sin fragmento disponible')
        + (a.operator_name ? ' · Operador: ' + esc(a.operator_name) : '')
        + ' · ' + esc(hora(a.message_at)) + '</p></div>'
        + '<div class="acciones"><button class="btn-linea" data-calidad-chat="' + esc(a.conversation_id || '') + '">Ver chat</button> '
        + (a.aviso ? '<button class="btn-solido" data-calidad-revisar="' + esc(a.aviso.id) + '">Revisado</button>' : '') + '</div></div>';
    }).join('') + (filtrados.length > INFORMES_LIMITE
      ? '<button class="btn-linea" data-calidad-mas style="justify-self:center">Mostrar más (' + (filtrados.length - INFORMES_LIMITE) + ')</button>' : '')
      : '<div class="calidad-vacio">' + (hallazgos.length ? 'Nada con esos filtros.' : 'No hay hallazgos. Pulsa «Analizar ahora» para revisar las conversaciones recientes.') + '</div>') + '</div>'
    // Las dos tablas son el detalle, no lo primero que hace falta ver: quedan como tarjetas
    // plegables (el mismo patron .grupo de la ficha del contacto), abierta la de operadores
    // porque es el resumen que le da nombre a esta version, cerrada la de por-conversacion
    // porque es la mas larga y la que menos hace falta a diario.
    + '<details class="grupo" open style="margin-top:20px"><summary>Resumen por operador'
      + (operadores.length ? ' <span class="nota">' + operadores.length + '</span>' : '') + '</summary><div class="dentro">'
    + (operadores.length ? '<div style="overflow:auto"><table class="calidad-tabla"><thead><tr><th>Operador</th><th>Respuestas</th><th>Respuesta media</th><th>Respuestas lentas</th><th>Señales de tono</th></tr></thead><tbody>'
      + operadores.map(o => '<tr><td>' + esc(o.nombre) + '</td><td>' + o.replies + '</td><td>'
        + (o.response_count ? Math.round(o.response_total / o.response_count) + ' min' : '—')
        + '</td><td>' + o.slow + '</td><td>' + o.tone + '</td></tr>').join('')
      + '</tbody></table></div>' : '<div class="calidad-vacio">Aún no hay respuestas humanas atribuibles en la ventana analizada.</div>')
    + '</div></details>'
    + '<details class="grupo"><summary>Evaluación por conversación'
      + (conversacionesFiltradas.length ? ' <span class="nota">' + conversacionesFiltradas.length + '</span>' : '') + '</summary><div class="dentro">'
    + (conversacionesFiltradas.length ? '<div style="overflow:auto"><table class="calidad-tabla"><thead><tr><th>Cliente</th><th>Operador(es)</th><th>Nota</th><th>Estado</th><th>Respuesta media</th><th>Señales</th><th>Último análisis</th></tr></thead><tbody>'
      + conversacionesFiltradas.map(r => '<tr><td>' + esc(r.customer_name || r.customer_phone || 'Cliente') + '</td>'
        + '<td>' + esc((r.operator_names || []).join(', ') || 'Sin identificar') + '</td>'
        + '<td><span class="calidad-score">' + Number(r.score || 0) + '</span></td>'
        + '<td>' + esc(r.risk === 'high' ? 'Riesgo alto' : r.risk === 'attention' ? 'Atención' : 'Correcto') + '</td>'
        + '<td>' + (r.average_response_minutes == null ? '—' : esc(r.average_response_minutes + ' min')) + '</td>'
        + '<td>' + Number(r.alert_count || 0) + '</td><td>' + esc(hora(r.scanned_at)) + '</td></tr>').join('')
      + '</tbody></table></div>' : '<div class="calidad-vacio">Pulsa «Analizar ahora» para crear el primer informe.</div>')
    + '</div></details>';
}

async function cargaCalidad({ scan = false, silencioso = false } = {}){
  if (!['admin','supervisor'].includes(ROL_ACTUAL) || !auth.currentUser) return;
  const r = await llama({ action:'serviceQuality', operation: scan ? 'scan' : 'list', max:40, force:scan }, { endpoint:API_CALIDAD });
  if (!r.ok) {
    if (!silencioso) avisa('No se pudo cargar el informe', r.error || 'error');
    return;
  }
  CALIDAD = { reports:r.reports || [], notifications:r.notifications || [], unread:Number(r.unread || 0) };
  pintaCuentaCalidad();
  pintaInformes();
  const nuevo = CALIDAD.notifications.find(a => a.status === 'unread' && !CALIDAD_CONOCIDOS.has(a.id));
  if (CALIDAD_INICIADA && nuevo) {
    avisa('Atención al cliente', nuevo.customer_name + ': ' + nuevo.title);
    if (typeof Notification !== 'undefined' && Notification.permission === 'granted' && document.hidden) {
      try { new Notification('CRM · atención requiere revisión', { body:nuevo.customer_name + ': ' + nuevo.title }); } catch (error) {}
    }
  }
  CALIDAD_CONOCIDOS = new Set(CALIDAD.notifications.map(a => a.id));
  CALIDAD_INICIADA = true;
  if (scan && !silencioso) avisa('Análisis actualizado', r.analyzed + ' conversación(es) revisadas · ' + Number(r.new_notifications || 0) + ' aviso(s) nuevo(s).');
}

function montaInformes(){
  if (!['admin','supervisor'].includes(ROL_ACTUAL)) return ve('conversations');
  if (!montadas.has('informes')) {
    montadas.add('informes');
    hueco('informes', '<div class="hoja"><h1>Informes internos</h1>'
      + '<p class="bajada">Supervisor privado de la atención. Filtra por tema —sin respuesta, mal tono o servicio, mala información, deficiencias, temas delicados y mensajes eliminados—, por gravedad, por cuánto tardó la respuesta y por operador. Solo administración y supervisión pueden verlo.</p>'
      + '<div class="acciones"><button class="btn-solido" id="calidadAnalizar">Analizar ahora</button>'
      + '<button class="btn-linea" id="calidadRecargar">Recargar</button></div><div id="calidadCuerpo"><span class="cargando"></span></div></div>');
    $('calidadAnalizar').onclick = async () => {
      const b = $('calidadAnalizar'); b.disabled = true; b.textContent = 'Analizando…';
      await cargaCalidad({ scan:true });
      b.disabled = false; b.textContent = 'Analizar ahora';
    };
    $('calidadRecargar').onclick = () => cargaCalidad();
    $('calidadCuerpo').addEventListener('change', ev => {
      const sel = ev.target.closest('[data-calidad-filtro]');
      if (!sel) return;
      const campo = sel.dataset.calidadFiltro;
      FILTRO_INFORMES[campo] = campo === 'minutos' ? Number(sel.value) : sel.value;
      INFORMES_LIMITE = 30;
      pintaInformes();
    });
    $('calidadCuerpo').addEventListener('click', async ev => {
      const tema = ev.target.closest('[data-calidad-tema]');
      if (tema) { FILTRO_INFORMES.tema = tema.dataset.calidadTema; INFORMES_LIMITE = 30; return pintaInformes(); }
      if (ev.target.closest('[data-calidad-limpiar]')) {
        FILTRO_INFORMES = { tema:'todos', gravedad:'relevantes', minutos:0, operador:'' }; INFORMES_LIMITE = 30; return pintaInformes();
      }
      if (ev.target.closest('[data-calidad-mas]')) { INFORMES_LIMITE += 30; return pintaInformes(); }
      const revisar = ev.target.closest('[data-calidad-revisar]');
      if (revisar) {
        revisar.disabled = true;
        const r = await llama({ action:'serviceQuality', operation:'review', notification_id:revisar.dataset.calidadRevisar }, { endpoint:API_CALIDAD });
        if (!r.ok) { revisar.disabled = false; return avisa('No se pudo marcar', r.error); }
        await cargaCalidad({ silencioso:true });
        return;
      }
      const abrir = ev.target.closest('[data-calidad-chat]');
      if (abrir) {
        const c = buscaConv(abrir.dataset.calidadChat);
        if (!c) return avisa('No encuentro ese chat', 'Puede estar oculto por su canal o haber sido archivado.');
        ve('conversations'); abre(c);
      }
    });
  }
  void cargaCalidad();
  if (!CALIDAD_TIMER) CALIDAD_TIMER = setInterval(() => cargaCalidad({ silencioso:true }), 60000);
}

      { t:'Satisfacción', p:(r)=> estrellas(r.rating_satisfaction) },
      { t:'Comentario', p:(r)=> r.comment || '—' },
      { t:'Fecha', p:(r)=> String(r.created_at || '').slice(0,10) },
    ],
  },
  prospecting: {
    titulo: 'Prospección',
    bajada: 'Negocios localizados para contactar. Ojo: no te han escrito, así que WhatsApp '
      + 'solo permite llegarles con plantilla aprobada.',
    tabla: 'crm_prospects',
    queLoLlena: 'Se llena con el buscador de arriba. Escribe un tipo de negocio y una ciudad — por ejemplo «colegio» en «La Romana» — y los importa desde OpenStreetMap.',
    // Esta vista era de solo lectura y decia que las busquedas "corren fuera del panel".
    // Era falso: la accion 'prospect' del servidor busca e importa desde hace tiempo, y lo
    // que faltaba era el buscador. La tabla salia vacia para siempre y no habia forma de
    // llenarla desde aqui.
    buscador: true,

    cols: [
      { t:'Negocio', p:(r)=> r.business_name || '—' },

      { t:'Categoría', p:(r)=> r.category || '—' },
      { t:'Ciudad', p:(r)=> r.city || '—' },
      { t:'Estado', p:(r)=> r.status || 'nuevo' },
      { t:'Intentos', p:(r)=> r.contact_attempts ?? 0 },

};
const TABLEROS_CARGADOS = new Set();

function pesos(centavos){
  const n = Number(centavos || 0);
  if (!n) return 'RD$0';
  return 'RD$' + (n / 100).toLocaleString('es-DO', { maximumFractionDigits: 0 });
}
function estrellas(n){
  const v = Number(n || 0);
  return v ? '★'.repeat(Math.min(5, v)) + '☆'.repeat(Math.max(0, 5 - v)) : '—';
}

// Nota media por persona, con su conteo. La media sin el numero de reseñas engaña: un
// 5 de una sola opinion no es mejor que un 4,6 de treinta.
async function pintaScorecard(filas){
  const equipo = await cargaColaboradores();
  const porPersona = new Map();
  let huerfanas = 0;
  for (const r of filas) {
    const id = r.collaborator_id;
    if (!id) { huerfanas++; continue; }
    const notas = [r.rating_service, r.rating_satisfaction].map(Number).filter(n => n > 0);
    if (!notas.length) continue;
    const media = notas.reduce((a,b) => a+b, 0) / notas.length;
    const p = porPersona.get(id) || { suma:0, n:0 };
    p.suma += media; p.n += 1;
    porPersona.set(id, p);
  }
  // cargaColaboradores devuelve null cuando la lectura FALLA --distinto de "no hay nadie"--
  // y aqui se desreferenciaba sin mirar: un 403 por rol o un arranque en frio de la funcion
  // tiraba un TypeError y la tarjeta entera desaparecia sin decir nada. El ranking se puede
  // pintar igual: lo unico que falta son los nombres.
  const nombreDe2 = id => {
    const x = (equipo || []).find(e => String(e.id) === String(id));
    return x ? (x.name || x.display_name || x.email || 'sin nombre') : 'colaborador ' + String(id).slice(0,6);
  };
  const rank = [...porPersona.entries()]
    .map(([id,p]) => ({ id, nombre: nombreDe2(id), media: p.suma / p.n, n: p.n }))
    .sort((a,b) => b.media - a.media);

  if (!rank.length && !huerfanas) return '';
  const sinEquipo = equipo === null;
  return '<div class="pgraf" style="max-width:1000px;margin-bottom:16px">'
    + '<div class="pgcab"><b>Por colaborador</b><span>nota media · nº de opiniones</span></div>'
    + (rank.length
      ? '<div class="barras">' + rank.map(x =>
          '<div class="barra"><span class="be">' + esc(x.nombre) + '</span>'
          + '<span class="bp"><i style="width:' + Math.round(x.media / 5 * 100) + '%"></i></span>'
          + '<span class="bn">' + x.media.toFixed(1) + ' <em style="font-style:normal;color:var(--mut);font-weight:400">('
          + x.n + ')</em></span></div>').join('') + '</div>'
      : '')
    // Se dice cuantas no cuentan y por que. Un ranking incompleto sin avisar hace creer
    // que alguien atiende poco cuando lo que pasa es que no se anoto quien atendio.
    + (huerfanas ? '<p class="cfgnota" style="margin:' + (rank.length ? '12px 0 0' : '0') + '">'
        + huerfanas + ' opinión(es) sin colaborador asignado: no cuentan aquí. '
        + 'Al enviar la encuesta desde el chat, elige quién atendió.</p>' : '')
    // Sin esto, "colaborador 4f2a1b" en vez de un nombre parece un dato roto en la base.
    + (sinEquipo ? '<p class="cfgnota" style="margin:12px 0 0">No se pudo leer la lista del '
        + 'equipo, así que arriba salen códigos en vez de nombres. Las notas sí son correctas.</p>' : '')
    + '</div>';
}

// La ficha comercial de un prospecto. Se abre pulsando su fila: sin esto la lista solo
// servia para mirarla, y no habia donde apuntar en que estado esta, cuanto puede valer ni
// cuando toca volver a llamar.
const ESTADOS_PROSPECTO = ['nuevo','contactado','interesado','propuesta','ganado','perdido','do_not_contact'];

function cableaProspectos(id){
  const cal = $('pbCalificar');
  if (cal) cal.onclick = async () => {
    const filas = (TABLERO[id]._filas || []);
    if (!filas.length) return avisa('No hay prospectos', 'Busca negocios primero.');
    // Se califican de 100 en 100: es el tope que acepta el servidor, y mandarle mas
    // significaria perder los que sobran sin decirlo.
    const ids = filas.map(f => f.id).filter(Boolean).slice(0, 100);
    cal.disabled = true; cal.textContent = 'Calificando…';
    const r = await llama({ action:'prospect', operation:'qualify', prospect_ids: ids });
    cal.disabled = false; cal.textContent = 'Calificar los importados';
    if (!r.ok) return avisa('No se pudo calificar', r.error);
    const bien = (r.results || []).filter(x => !x.error).length;
    avisa('Calificados', bien + ' de ' + ids.length + '. Ya salen ordenados por prioridad.'
      + (filas.length > 100 ? ' Quedan ' + (filas.length - 100) + ' sin calificar: vuelve a pulsar.' : ''));
    pintaTablero(id);
  };

  const csv = $('pbCsv');
  if (csv) csv.onclick = () => {
    const filas = (TABLERO[id]._filas || []);
    if (!filas.length) return avisa('No hay nada que exportar');
    const cols = ['business_name','phone_primary','category','city','sector','status',
      'qualification_score','qualification_tier','priority','contact_attempts','next_action_at'];
    // Las comillas dobles se escapan doblandolas: un nombre con comillas rompia el archivo
    // entero y Excel lo abria descuadrado a partir de esa fila.
    const escapa = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csvTexto = [cols.join(',')]
      .concat(filas.map(f => cols.map(c => escapa(f[c])).join(','))).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + csvTexto], { type:'text/csv;charset=utf-8' }));
    a.download = 'prospectos.csv'; a.click(); URL.revokeObjectURL(a.href);
  };
}

async function montaTablero(id){
  const d = TABLERO[id];
  if (!montadas.has(id)) {
    montadas.add(id);
    hueco(id, '<div class="hoja"><h1>' + esc(d.titulo) + '</h1>'
      + '<p class="bajada">' + esc(d.bajada) + '</p>'
      + (d.buscador
          ? '<div class="buscaprospectos">'
            + '<input id="pbQue" placeholder="Qué buscar — colegio, salón, hotel…">'
            + '<input id="pbDonde" placeholder="Ciudad" value="La Romana">'
            + '<button class="btn-solido" id="pbIr">Buscar negocios</button>'
            + '</div>'
            + '<p class="bajada" id="pbEstado" hidden></p>'
          : '')
      + '<div class="acciones" style="margin-bottom:16px"><button class="btn-linea" data-recarga>Recargar</button>'
      // Prospeccion era una tabla de solo mirar: buscaba, importaba, y ahi se acababa. Sin
      // calificar no hay por donde empezar --200 negocios sin orden son 200 negocios que
      // nadie llama-- y sin exportar no se puede trabajar la lista fuera del panel.
      + (d.prospectos
          ? '<button class="btn-linea" id="pbCalificar">Calificar los importados</button>'
            + '<button class="btn-linea" id="pbCsv">Exportar CSV</button>'
          : '')
      + '</div>'
      + (d.prospectos ? '<div id="pbFicha"></div>' : '')
      + '<div id="tb-' + id + '"></div></div>');
    document.querySelector('#vista-' + id + ' [data-recarga]').onclick = () => pintaTablero(id);
    if (d.prospectos) cableaProspectos(id);
    if (d.buscador) {
      const lanzar = () => buscaProspectos(id);
      $('pbIr').onclick = lanzar;
      // Enter en cualquiera de los dos campos: escribir la ciudad y tener que ir al raton
      // para buscar es de las cosas que hacen que una herramienta no se use.
      ['pbQue', 'pbDonde'].forEach(k => $(k).addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); lanzar(); }
      }));
    }
  }
  if (!TABLEROS_CARGADOS.has(id)) pintaTablero(id);
}

// Busca negocios en OpenStreetMap y los importa como prospectos. El servidor ya hacia
// todo el trabajo -- accion 'prospect' -- y descarta los repetidos por source_external_id,
// asi que buscar dos veces lo mismo no duplica nada.
async function buscaProspectos(id){
  const que = ($('pbQue')?.value || '').trim();
  const donde = ($('pbDonde')?.value || '').trim();
  const est = $('pbEstado'), boton = $('pbIr');
  // El servidor exige cuatro caracteres. Decirlo aqui evita un viaje y un error seco.
  if (que.length < 4) { est.hidden = false; est.textContent = 'Escribe al menos 4 letras de lo que buscas.'; return; }
  boton.disabled = true;
  est.hidden = false;
  est.innerHTML = '<span class="cargando"></span> Buscando en OpenStreetMap…';
  const r = await llama({ action:'prospect', query: que, city: donde, category: que, max: 20 });
  boton.disabled = false;
  if (!r.ok) { est.textContent = 'No se pudo buscar: ' + (r.error || 'error'); return; }
  // Se dice cuantos eran repetidos, no solo cuantos entraron: si no, buscar lo mismo dos
  // veces parece que la segunda no funciono.
  est.textContent = r.imported + ' negocio(s) importado(s)'
    + (r.duplicates ? ' · ' + r.duplicates + ' ya estaban' : '')
    + (r.found === 0 ? ' · OpenStreetMap no encontró nada con esas palabras' : '');
  pintaTablero(id);
}

async function pintaTablero(id){
  const d = TABLERO[id], cont = $('tb-' + id);
  if (!cont) return;
  cont.innerHTML = '<p class="bajada"><span class="cargando"></span> Cargando…</p>';
  const r = d.accion
    ? await llama({ action:d.accion })
    : await llama({ action:'data', table:d.tabla, operation:'select',
        filters: d.filtros || [], order: d.orden || [], limit: 300 });
  if (!r.ok) {
    cont.innerHTML = '<p class="bajada">No se pudo cargar: ' + esc(r.error || 'error') + '</p>';
    return;
  }
  let filas = r.data || r.rows || [];
  TABLEROS_CARGADOS.add(id);
  // Se guardan para que las acciones de la barra --calificar, exportar-- trabajen sobre lo
  // que el dueno esta viendo, y no sobre otra consulta que podria devolver algo distinto.
  d._filas = filas;
  if (d.soloConRespuesta) filas = filas.filter(f => f.rating_service || f.rating_satisfaction || f.comment);
  if (!filas.length) {
    // Vacio y roto se ven igual si solo se dice "no hay nada". Aqui se explica QUE
    // llena esta tabla, que es lo que permite saber si falta un dato o falta un enlace.
    cont.innerHTML = vacioApple('<rect x="3.500" y="5" width="17" height="14" rx="3"/><path d="M3.500 10h17"/>',
      'Todavía no hay nada aquí', d.queLoLlena || 'Se llena desde el propio CRM.');
    return;
  }
  const anchos = d.cols.map(() => 'minmax(0,1fr)').join(' ');
  cont.innerHTML = (d.encabezado ? await d.encabezado(filas) : '')
    + '<div class="tabla" style="max-width:1000px">'
    + '<div class="fila cabecera" style="grid-template-columns:' + anchos + '">'
    +   d.cols.map(c => '<span>' + esc(c.t) + '</span>').join('') + '</div>'
    + filas.map((f, i) => '<div class="fila"' + (d.prospectos ? ' data-fila="' + i + '" style="cursor:pointer;'
          : ' style="') + 'grid-template-columns:' + anchos + '">'
        + d.cols.map(c => '<span>' + esc(String(c.p(f))) + '</span>').join('') + '</div>').join('')
    + '</div><p class="bajada" style="margin-top:12px">' + filas.length + ' registro(s).'
    + (d.prospectos ? ' Pulsa uno para abrir su ficha comercial.' : '') + '</p>';

  if (d.prospectos) {
    cont.onclick = ev => {
      const fila = ev.target.closest('[data-fila]'); if (!fila) return;
      abreFichaProspecto(id, filas[Number(fila.dataset.fila)]);
    };
  }
}

// No hay tabla de recordatorios: son conversaciones con follow_up_at puesto. Buscarlos
// en crm_planning_tasks, como hacia la primera version, devolvia siempre vacio.
// ---- Tareas del equipo ------------------------------------------------------------------------------------------------------------------
// El servidor (equipo-tareas-store.js) decide cuando avisar y preguntar; aqui solo se ponen, se ven y se cierran. Los avisos van por WhatsApp, dentro del horario de cada persona.
const TAR = { tareas: [], personas: [], plantilla: null, hechas: false, cargado: false };
const DIAS_TAR = [['1', 'L'], ['2', 'M'], ['3', 'X'], ['4', 'J'], ['5', 'V'], ['6', 'S'], ['0', 'D']];
const hoyRD = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Santo_Domingo' });
const nombreDePersona = id => (TAR.personas.find(x => x.id === id) || {}).nombre || 'Sin asignar';
async function cargaTareasEquipo(){
  const r = await llama({ action: 'tareasLista', estados: TAR.hechas ? ['completada'] : ['pendiente'] });
  if (!r.ok) { const a = $('tarAviso'); if (a) a.innerHTML = '<p class="aviso">No se pudieron leer las tareas: ' + esc(r.error || 'error') + '</p>'; return; }
  TAR.tareas = r.tareas || []; TAR.personas = r.personas || []; TAR.plantilla = r.plantilla_aprobada; TAR.cargado = true;
  pintaTareasEquipo();
}
function estadoAvisoTarea(t){
  const n = t.notif || {}, hechos = (n.seguimientos || []).length;
  if (t.estado === 'completada') return 'completada';
  const quien = t.asignado_telefono ? '' : ' · sin persona: no se avisa';
  if (!t.asignado_telefono) return 'sin persona' + quien;
  if (n.escalada_at) return 'sin respuesta tras 2 preguntas; ya se te avisó';
  if (n.silenciada_hasta && Date.parse(n.silenciada_hasta) > Date.now()) return 'en proceso o con ayuda pedida';
  if (hechos) return 'preguntada ' + hechos + ' de 2 veces';
  if (n.asignacion_at) return 'avisada';
  return 'aún sin avisar (sale en su horario)';
}
function pintaTareasEquipo(){
  const cont = $('tarLista'); if (!cont) return;
  const sel = $('tarPersona');
  if (sel && !sel.dataset.listo || (sel && sel.options.length !== TAR.personas.length + 1)) {
    sel.innerHTML = '<option value="">Sin asignar (solo anotar)</option>' + TAR.personas.map(x => '<option value="' + esc(x.id) + '">' + esc(x.nombre) + (x.es_dueno ? ' (yo)' : '') + '</option>').join('');
    sel.dataset.listo = '1';
  }
  const aviso = $('tarAviso');
  if (aviso) aviso.innerHTML = TAR.plantilla === false
    ? '<p class="aviso" style="margin:0 0 12px">La plantilla de Meta para avisar a tu equipo <b>fuera de las 24 horas</b> todavía no está aprobada. Hasta entonces solo recibe el aviso quien te haya escrito en las últimas 24 horas; el resto espera y se reintenta solo. '
      + 'Créala en <b>Campañas</b> (propuesta «Crear la plantilla dcarela_tarea_equipo») o con «crear N» por WhatsApp.</p>' : '';
  const hoy = hoyRD();
  const grupos = TAR.hechas ? [['Completadas', 'ok', TAR.tareas]] : [
    ['Vencidas', 'vencida', TAR.tareas.filter(t => t.fecha_limite && t.fecha_limite < hoy)],
    ['Para hoy', '', TAR.tareas.filter(t => t.fecha_limite === hoy)],
    ['Próximas', '', TAR.tareas.filter(t => t.fecha_limite && t.fecha_limite > hoy)],
    ['Sin fecha', '', TAR.tareas.filter(t => !t.fecha_limite)],
  ];
  const fila = t => '<div class="tar-fila" data-tid="' + esc(t.id) + '"><div><b>' + esc(t.titulo) + '</b>'
    + '<small>' + esc(nombreDePersona(t.empleado_id)) + (t.fecha_limite ? ' · ' + esc(t.fecha_limite) + (t.hora_limite ? ' ' + esc(t.hora_limite) : '') : ' · sin fecha')
    + (t.prioridad === 'alta' ? ' · <b style="display:inline;color:var(--rojo,#b3312a)">alta</b>' : '')
    + ' · ' + esc(estadoAvisoTarea(t)) + (t.asignada_por && t.asignada_por.nombre ? ' · puesta por ' + esc(t.asignada_por.nombre) : '') + '</small></div>'
    + '<div class="tar-acc">' + (t.estado === 'completada'
      ? '<button class="btn-linea" data-tar="reabrir">Reabrir</button>'
      : '<button class="btn-solido" data-tar="hecha">Hecha ✓</button><button class="btn-linea" data-tar="manana">Mañana</button>'
        + (t.asignado_telefono ? '<button class="btn-linea" data-tar="avisar" title="Volver a avisar a la persona (sale en su horario)">Avisar de nuevo</button>' : '')
        + '<button class="btn-linea" data-tar="cancelar">Quitar</button>') + '</div></div>';
  const cuerpo = grupos.filter(g => g[2].length).map(g => '<div class="tar-sec ' + g[1] + '">' + g[0] + ' · ' + g[2].length + '</div>' + g[2].map(fila).join('')).join('');
  cont.innerHTML = cuerpo || '<div class="vacio-apple" style="margin:22px auto"><b>' + (TAR.hechas ? 'Todavía no hay tareas completadas' : 'Sin tareas pendientes') + '</b><p>'

  const bt = $('tarVerHechas'); if (bt) bt.textContent = TAR.hechas ? 'Ver las pendientes' : 'Ver las completadas';

/* ---- Recordatorios del iPhone -------------------------------------------- */
// El dueño pidio que lo que apunta en Recordatorios del iPhone se viera aqui, y al reves,
// "porque conecte Recordatorios con mi cuenta de Gmail". Hay que decirlo: Recordatorios de
// Apple NO sincroniza con una cuenta de Google --iOS solo sincroniza recordatorios por
// iCloud, CalDAV o Exchange, y Google Tasks no se publica por CalDAV--, y entrar en su iCloud
// exigiria su contraseña de Apple, que no se pide ni se guarda.
//
// Lo que si se puede es que hable el propio telefono: un Atajo manda su lista al CRM
// (crmRecordatorios, con llave) y se trae lo que falta. El panel solo LEE ese espejo y
// escribe el lado del CRM --marcar hecha, volver a mandarla--: lo que viene del telefono lo
// escribe el servidor.
let TAREAS_IPHONE = [];
let TAREAS_IPHONE_LEIDAS = 0;

async function cargaTareasIphone(){
  const r = await llama({ action:'data', table:'iphone_tasks', operation:'select', limit:500 });
  if (!r.ok) return false;
  TAREAS_IPHONE = (r.data || r.rows || []).filter(t => t && t.id);
  TAREAS_IPHONE_LEIDAS = Date.now();
  return true;
}

// El id de la tarea del CRM es el MISMO que usa el servidor y el calendario
// (seguimiento-<ficha>): si aqui se calculara de otra forma, el panel diria que un
// seguimiento no esta en el telefono cuando si lo esta.
const idSeguimientoIphone = (c) => 'seguimiento-' + String(c?.id || c?._id || '');
const espejoIphoneDe = (c) => TAREAS_IPHONE.find(t => t.origen === 'crm'
  && t.crm_task_id === idSeguimientoIphone(c)) || null;

// El estado de una fila, en las palabras del dueño. 'hecha' solo cuando alguien la dio por
// hecha; 'ausente' cuando desaparecio del telefono, que NO es lo mismo que borrada del CRM.
function estadoTareaIphone(t){
  if (t.iphone_completada_at) return { clave:'hecha', chip:'ok', texto:'hecha en el iPhone' };
  if (t.crm_completada_at) return { clave:'hecha', chip:'ok', texto:'hecha en el CRM' };
  // Esta la apago el sistema, no una persona: el seguimiento dejo de estar pendiente (se ignoro
  // al contacto, se le quito la fecha, se cerro). Se deshace sola en cuanto vuelva a estarlo, y
  // por eso NO se dice "hecha": decirlo invitaba a darla por cerrada cuando solo esta en pausa.
  if (t.crm_inactiva_at) return { clave:'inactiva', chip:'medio', texto:'sin seguimiento pendiente' };
  if (t.iphone_ausente_at) return { clave:'ausente', chip:'medio', texto:'ya no está en el iPhone' };
  if (t.iphone_id) return { clave:'viva', chip:'', texto:'en el iPhone' };
  return { clave:'pendiente', chip:'medio', texto:'pendiente de llegar al iPhone' };
}

function pintaTareasIphone(){
  const cont = $('recIphone'); if (!cont) return;
  const estado = $('recIphoneEstado');
  if (estado) {
    const vivas = TAREAS_IPHONE.filter(t => !t.iphone_completada_at && !t.crm_completada_at).length;
    estado.textContent = !TAREAS_IPHONE_LEIDAS
      ? 'Leyendo…'
      : (!TAREAS_IPHONE.length
        ? 'Todavía no ha llegado ningún recordatorio del iPhone. Pulsa «Conectar el iPhone»: '
          + 'son dos minutos y no hace falta ninguna contraseña de Apple.'
        : TAREAS_IPHONE.length + ' tarea(s) sincronizadas, ' + vivas + ' sin terminar. '
          + 'Lo que se marque aquí se le pide al iPhone en su próxima ejecución.');
  }
  if (!TAREAS_IPHONE.length) { cont.innerHTML = ''; return; }
  // Sin terminar primero y por fecha: es el orden en que se trabaja el dia.
  const filas = [...TAREAS_IPHONE].sort((a, b) => {
    const ea = estadoTareaIphone(a).clave === 'hecha' ? 1 : 0;
    const eb = estadoTareaIphone(b).clave === 'hecha' ? 1 : 0;
    if (ea !== eb) return ea - eb;
    return String(a.vence || a.created_at || '').localeCompare(String(b.vence || b.created_at || ''));
  });
  cont.innerHTML = '<div class="tabla" style="max-width:900px">'
    + '<div class="fila cabecera"><span>Cuándo</span><span>Tarea</span><span>Origen</span><span></span></div>'
    + filas.map(t => {
      const e = estadoTareaIphone(t);
      const cuando = String(t.vence || '').slice(0,16).replace('T',' ');
      return '<div class="fila">'
        + '<span><b>' + esc(cuando || 'sin fecha') + '</b>'
        +   '<small>' + esc(e.texto) + '</small></span>'
        + '<span>' + esc(String(t.titulo || '(sin título)').slice(0,80))
        +   (t.nota ? '<small>' + esc(String(t.nota).slice(0,70)) + '</small>' : '') + '</span>'
        + '<span>' + (t.origen === 'iphone'
            ? '<i class="chip">iPhone</i>'
            : '<i class="chip">CRM</i>' + (t.conversacion_id
                ? ' <button class="btn-linea" data-tifi="' + esc(t.conversacion_id) + '">Ver ficha</button>' : ''))
        +   (e.chip ? ' <i class="chip ' + e.chip + '">' + esc(e.texto) + '</i>' : '') + '</span>'
        + '<span>' + accionesTareaIphone(t, e) + '</span>'
        + '</div>';
    }).join('') + '</div>'
    // Lo que el CRM NO hace solo, dicho donde se decide: el telefono no borra seguimientos.
    + '<p class="cfgnota" style="max-width:900px">Marcar algo hecho en el iPhone <b>no borra</b> '
    +   'el seguimiento del CRM: se enseña marcado y la fecha se quita desde la ficha, a mano. '
    +   'Así un Atajo a medias no puede vaciar la agenda.</p>';
}

function accionesTareaIphone(t, e){
  // Una hecha EN EL IPHONE de una tarea del CRM si se puede volver a mandar: pasa cuando el CRM
  // le pidio al telefono que la cerrara --porque el seguimiento dejo de estar pendiente-- y
  // despues el seguimiento volvio. Sin este boton, ese recordatorio no regresaba nunca.
  if (e.clave === 'hecha' && t.origen === 'crm' && t.iphone_completada_at && !t.crm_completada_at) {
    return '<button class="btn-linea" data-tivuelve="' + esc(t.id) + '">Volver a mandarla</button>';
  }
  if (e.clave === 'hecha') return '';
  const botones = [];
  if (!t.crm_completada_at) botones.push('<button class="btn-linea" data-tihecha="' + esc(t.id) + '">Marcar hecha</button>');
  // Volver a mandarla solo tiene sentido en las del CRM: una tarea nacida en el iPhone que el
  // dueño borro alli no se le devuelve sola.
  if (e.clave === 'ausente' && t.origen === 'crm') {
    botones.push('<button class="btn-linea" data-tivuelve="' + esc(t.id) + '">Volver a mandarla</button>');
  }
  return botones.join(' ');
}

async function accionTareaIphone(ev){
  const ver = ev.target.closest('[data-tifi]');
  if (ver) { const c = buscaConv(ver.dataset.tifi); if (c) { ve('conversations'); abre(c); } return; }
  const hecha = ev.target.closest('[data-tihecha]');
  const vuelve = ev.target.closest('[data-tivuelve]');
  const boton = hecha || vuelve; if (!boton) return;
  const id = boton.dataset.tihecha || boton.dataset.tivuelve;
  const tarea = TAREAS_IPHONE.find(t => t.id === id); if (!tarea) return;
  // Parches, nunca borrados: esta pantalla no puede quitar una tarea de la base.
  // Volver a mandarla limpia TODO lo que la sacaba de la lista de pendientes: si no se limpia
  // tambien lo de "hecha en el iPhone" y el vinculo, el plan la sigue saltando y el boton no
  // hace nada visible.
  const campos = hecha
    ? { crm_completada_at: new Date().toISOString(), completada_por: 'panel' }
    : { iphone_ausente_at: null, iphone_completada_at: null, crm_inactiva_at: null, iphone_id: null };
  boton.disabled = true;
  const r = await llama({ action:'data', table:'iphone_tasks', operation:'update',
    filters:[{ kind:'eq', field:'id', value:id }], payload: campos });
  boton.disabled = false;
  if (!r.ok) return avisa('No se pudo guardar', r.error);
  Object.assign(tarea, campos);
  avisa(hecha ? 'Marcada hecha' : 'Vuelve al iPhone',
    hecha ? 'El iPhone la marcará hecha en su próxima ejecución.'
      : 'Se volverá a añadir en la próxima ejecución del Atajo.');
  pintaTareasIphone();
}

// Se piden los numeros y se ensenan TODOS, incluidos los omitidos. Un "listo" a secas
// esconde lo que no salio, y lo que no salio es justo lo que hay que mirar.
async function procesaRecordatorios(){
  if (!await confirmaAqui('¿Procesar ahora los seguimientos y recordatorios vencidos?\n\n'
    + 'Dentro de 24 horas se manda texto libre; fuera, solo una plantilla aprobada. '
    + 'Quien haya pedido la baja no recibe nada.')) return;
  const b = $('recProcesar'); const antes = b.textContent;
  b.disabled = true; b.textContent = 'Procesando…';
  const r = await llama({ action:'followup', mode:'scheduled' });
  b.disabled = false; b.textContent = antes;
  if (!r.ok) return avisa('No se pudo procesar', r.error);
  const partes = [
    'Seguimientos: ' + (r.followUps || 0),
    'Recordatorios de sesión: ' + (r.reminders || 0),
  ];
  if (r.optOutSkipped) partes.push(r.optOutSkipped + ' omitidos por baja');
  if (r.humanSkipped) partes.push(r.humanSkipped + ' omitidos por llevarlos una persona');
  if (r.templateBlocked) partes.push(r.templateBlocked + ' bloqueados: la plantilla no lleva baja/STOP');
  if (r.errors?.length) partes.push(r.errors.length + ' con error');
  avisa('Procesado', partes.join('. ') + '.');
  // La lista se refresca sola: CONVS lo mantiene al dia el escuchador de Firestore.
  pintaRecordatorios();
}
function pintaRecordatorios(){
  pintaTareasIphone();
  const cont = $('recLista'); if (!cont) return;
  const ahora = Date.now();
  const filas = CONVS
    .filter(c => c.follow_up_at && !['cerrado','perdido','desinteresado'].includes(c.lifecycle_stage))
    .map(c => ({ c, cuando: new Date(c.follow_up_at).getTime(), iso: String(c.follow_up_at) }))
    .sort((a,b) => a.cuando - b.cuando);
  if (!filas.length) {
    cont.innerHTML = '<p class="bajada">No hay ningún seguimiento con fecha. '
      + 'Se pone desde la ficha del lead o desde el Planificador.</p>';
    return;
  }
  // El acercamiento de Limpieza guarda el mensaje personalizado en pending_questions y
  // promete que "aparecera en Recordatorios para revisarlo antes de enviarlo". No aparecia
  // en ningun sitio: se escribia y se perdia de vista. Aqui se enseña.
  const vencidos = filas.filter(f => f.cuando <= ahora).length;
  cont.innerHTML = (vencidos
      ? '<p class="bajada"><b>' + vencidos + ' vencido(s)</b> — ya tocaba.</p>' : '')
    + '<div class="tabla" style="max-width:900px">'
    + '<div class="fila cabecera"><span>Cuándo</span><span>Contacto</span><span>Etapa</span>'
    +   '<span>Mensaje preparado</span></div>'
    + filas.map(({c, cuando, iso}) => {
        const vencido = cuando <= ahora;
        // Lo que el iPhone ya sabe de este seguimiento, en la MISMA fila: sin esto habria que
        // comparar dos listas a mano para saber si uno ya se hizo fuera del CRM.
        const esp = espejoIphoneDe(c);
        const marca = !esp ? ''
          : esp.iphone_completada_at ? ' <i class="chip ok" title="Marcado hecho desde el iPhone. '
              + 'La fecha del CRM no se quita sola: se quita en la ficha">hecho en el iPhone</i>'
          : esp.iphone_ausente_at ? ' <i class="chip medio" title="Estaba en el iPhone y ya no está. '
              + 'El seguimiento del CRM sigue vivo">borrado en el iPhone</i>'
          : esp.iphone_id ? ' <i class="chip">en el iPhone</i>' : '';
        return '<div class="fila">'
        + '<span><b>' + esc(iso.slice(0,16).replace('T',' ')) + '</b>'
        +   (vencido ? '<small style="color:var(--bad)">vencido</small>' : '<small>pendiente</small>') + '</span>'
        + '<span>' + esc(nombreDe(c)) + marca + '</span>'
        + '<span>' + esc((c.lifecycle_stage || 'nuevo').replace(/_/g,' ')) + '</span>'
        // El acercamiento de Limpieza guarda aqui el mensaje ya personalizado, y la pantalla
        // promete que se podra revisar en Recordatorios. No se enseñaba en ninguna parte: se
        // escribia y se perdia. Si no hay mensaje preparado, se cae al proximo paso.
        + '<span>' + esc(String(c.pending_questions || c.next_step_suggested || '—').slice(0,90)) + '</span>'
        + '</div>';
      }).join('') + '</div>';
}

/* ---- Agenda -------------------------------------------------------------- */
// La version anterior solo LEIA: no habia forma de meter una cita desde el panel, que
// para una agenda es no servir. Ahora se agenda, se ve el mes y se filtra.
//
// La fecha vive en la ficha del contacto (scheduled_at confirmada, tentative_date
// tentativa), no en una tabla aparte: una cita sin cliente no existe, y dos sitios donde
// vive la misma fecha acaban discrepando.
let agVista = 'cal';         // 'cal' | 'lista'
let agFiltro = 'proximas';   // proximas | hoy | pasadas | todas
let agMes = new Date();      // mes que se esta mirando
let agDia = null;            // dia seleccionado en el calendario

// La agenda y los recordatorios eran dos listas que no se hablaban: la cita vive en
// scheduled_at/tentative_date y el seguimiento en follow_up_at, los dos en la MISMA ficha.
// El resultado era que se podia tener un recordatorio para el martes sin que apareciera en
// la agenda del martes, y planificar la semana mirando solo la mitad.
//
// Ahora los dos entran en la agenda. Se distinguen por tipo, no se mezclan: una sesion es
// un compromiso con el cliente y un recordatorio es una tarea nuestra.
function citasDe(){
  const filas = [];
  // Una sesion agendada con alguien de una linea desvinculada sigue siendo un compromiso real: sale
  // en la Agenda, marcada, aunque su chat no salga en la bandeja. Sus recordatorios no: son tareas
  // nuestras sobre un chat al que ahora no se puede escribir.
  for (const c of CONVS_OCULTAS) {
    if (c.scheduled_at || c.tentative_date) {
      filas.push({ c, iso: String(c.scheduled_at || c.tentative_date), firme: !!c.scheduled_at, tipo: 'sesion', desvinculada: true });
    }
  }
  // Y lo mismo con Instagram y Messenger ocultos: la sesion que se acordo con alguien que escribio
  // por Messenger es una cita real en el estudio. Que su chat ya no se atienda aqui no la borra de
  // la agenda; sus recordatorios si se van, como los de una linea desvinculada.
  for (const c of CONVS_REDES) {
    if (c.scheduled_at || c.tentative_date) {
      filas.push({ c, iso: String(c.scheduled_at || c.tentative_date), firme: !!c.scheduled_at, tipo: 'sesion', redOculta: true });
    }
  }
  for (const c of CONVS) {
    if (c.scheduled_at || c.tentative_date) {
      filas.push({ c, iso: String(c.scheduled_at || c.tentative_date), firme: !!c.scheduled_at, tipo: 'sesion' });
    }
    // Un seguimiento de un contacto ya cerrado o desinteresado no es una tarea pendiente:
    // se excluye igual que en la vista de Recordatorios, para que las dos cuenten lo mismo.
    if (c.follow_up_at && !['cerrado', 'perdido', 'desinteresado'].includes(c.lifecycle_stage)) {
      filas.push({ c, iso: String(c.follow_up_at), firme: false, tipo: 'recordatorio' });
    }
  }
  return filas.sort((a, b) => a.iso.localeCompare(b.iso));
}

// Exportacion a Recordatorios de Apple.
//
// El dueño pidio conectar la agenda con su carpeta de iCloud. Escribir DIRECTAMENTE en
// iCloud exigiria su contraseña de Apple (CalDAV con clave especifica de aplicacion), y
// eso no lo toco. Un .ics hace el mismo trabajo sin que nadie tenga que darme una clave:
// se abre y Recordatorios lo importa.
//
// Van como VTODO, no como VEVENT: VEVENT aterriza en Calendario, VTODO en Recordatorios,
// que es la carpeta que pidio.
function escapaICS(v){
  return String(v || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,')
    .replace(/\r?\n/g, '\\n');
}
function selloICS(iso){
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
}
// Dos exportaciones, no una sustituyendo a la otra. La de Recordatorios la pidio el dueno
// asi y se queda intacta: son VTODO y aterrizan en la app Recordatorios. Esta otra son
// VEVENT --Calendario-- que es donde se mira una agenda de sesiones, con aviso el dia antes.
// Cambiar la primera por esta habria sido decidir por el en vez de darle las dos.
function exportaAgendaEventos(){
  const filas = citasDe().filter(f => f.tipo === 'sesion' && selloICS(f.iso));
  if (!filas.length) return avisa('No hay sesiones', 'Solo se exportan las sesiones con fecha.');
  const ahora = selloICS(new Date().toISOString());
  const lineas = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//DCarela CRM//ES', 'CALSCALE:GREGORIAN'];
  for (const f of filas) {
    const quien = nombreDe(f.c);
    const titulo = (f.firme ? 'Sesión · ' : 'Sesión tentativa · ') + quien;
    const detalle = [
      f.c.wa_phone ? 'Teléfono: +' + f.c.wa_phone : '',
      f.c.interested_category ? 'Categoría: ' + f.c.interested_category : '',
      f.c.selected_combo_name ? 'Combo: ' + f.c.selected_combo_name : '',
    ].filter(Boolean).join('\n');
    // Dos horas por defecto: un evento sin duracion se pinta como una raya en el calendario
    // y no se ve al lado de los demas.
    const fin = new Date(new Date(f.iso).getTime() + 2 * 3600 * 1000).toISOString();
    lineas.push('BEGIN:VEVENT',
      'UID:evento-' + (f.c._id || f.c.id) + '@dcarela',
      'DTSTAMP:' + ahora,
      'DTSTART:' + selloICS(f.iso),
      'DTEND:' + selloICS(fin),
      'SUMMARY:' + escapaICS(titulo),
      detalle ? 'DESCRIPTION:' + escapaICS(detalle) : '',
      'BEGIN:VALARM', 'TRIGGER:-P1D', 'ACTION:DISPLAY',
      'DESCRIPTION:' + escapaICS('Mañana: ' + titulo), 'END:VALARM',
      'END:VEVENT');
  }
  lineas.push('END:VCALENDAR');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lineas.filter(Boolean).join('\r\n')],
    { type:'text/calendar;charset=utf-8' }));
  a.download = 'agenda-dcarela.ics'; a.click(); URL.revokeObjectURL(a.href);
  avisa('Agenda exportada', filas.length + ' sesión(es) con aviso el día antes.');
}

function exportaAgendaICS(){
  const filas = citasDe().filter(f => selloICS(f.iso));
  if (!filas.length) return avisa('Nada que exportar', 'No hay sesiones ni recordatorios con fecha.');
  const ahora = selloICS(new Date().toISOString());
  const lineas = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//DCarela CRM//ES', 'CALSCALE:GREGORIAN'];
  for (const f of filas) {
    const quien = nombreDe(f.c);
    const titulo = f.tipo === 'sesion'
      ? (f.firme ? 'Sesión · ' : 'Sesión tentativa · ') + quien
      : 'Seguimiento · ' + quien;
    const detalle = [
      f.c.wa_phone ? 'Teléfono: +' + f.c.wa_phone : '',
      f.c.interested_category ? 'Categoría: ' + f.c.interested_category : '',
      f.c.selected_combo_name ? 'Combo: ' + f.c.selected_combo_name : '',
      f.c.next_step_suggested ? 'Próximo paso: ' + f.c.next_step_suggested : '',
    ].filter(Boolean).join('\n');
    lineas.push('BEGIN:VTODO',
      'UID:' + f.tipo + '-' + (f.c._id || f.c.id) + '@dcarela',
      'DTSTAMP:' + ahora,
      'DUE:' + selloICS(f.iso),
      'SUMMARY:' + escapaICS(titulo),
      detalle ? 'DESCRIPTION:' + escapaICS(detalle) : '',
      'END:VTODO');
  }
  lineas.push('END:VCALENDAR');
  const blob = new Blob([lineas.filter(Boolean).join('\r\n')], { type:'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dcarela-agenda.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  avisa('Descargado', filas.length + ' tarea(s). Ábrelo y elige tu carpeta de Recordatorios.');
}
function mismoDia(iso, d){
  return !!diaAg(iso) && diaAg(iso) === claveDiaAg(d);
}

// --- El Google Calendar del dueño dentro de la Agenda -----------------------------------
//
// La Agenda enseñaba SOLO lo del CRM, y el dueño apunta media vida en su propio Google: un
// viaje, una boda de un familiar, el dentista. Agendar una sesion encima de eso no se veia
// hasta que ya estaba prometida. Los eventos de Google entran aqui marcados y de solo
// lectura: se ven para no pisarlos, pero se siguen agendando sesiones en el CRM.
//
// Vienen del servidor (crmGoogleCalendar), no del navegador: la direccion iCal privada abre
// el calendario entero sin contraseña y vive solo en Secret Manager. Llegan sin descripcion
// y sin asistentes, a proposito.
//
// LA HORA Y EL DIA SE CALCULAN CON LA ZONA ESCRITA. Hasta aqui la Agenda partia el texto ISO
// (iso.slice(11,16) y iso.slice(0,10)), que es la hora UTC: una sesion de las 10:00 de La
// Romana salia como «14:00», y una de las 9 de la noche se agrupaba en el dia siguiente. Se
// arregla para todo, no solo para Google, porque si no las dos fuentes no cuadran en la misma
// rejilla. Lo que se ve cambia; lo guardado no se toca.
const ZONA_AG = 'America/Santo_Domingo';
let GOOGLE_AG = { estado:'sin-cargar', configurado:null, eventos:[], calendario:null, leido:0, stale:false, error:'' };
let GOOGLE_AG_PEDIDO = 0;
let GOOGLE_AG_RELOJ = null;

const soloDiaAg = (v) => /^\d{4}-\d{2}-\d{2}$/.test(String(v || '').trim());

// 'YYYY-MM-DD' del dia en que cae ese instante en La Romana. Una fecha ya sin hora --las
// tentativas viejas se guardaron asi-- se devuelve tal cual: leerla con new Date() seria la
// medianoche UTC, o sea las 8 de la noche del DIA ANTERIOR aqui.
function diaAg(iso){
  const t = String(iso || '').trim();
  if (!t) return '';
  if (soloDiaAg(t)) return t;
  const d = new Date(t);
  if (isNaN(d.getTime())) return '';
  try {
    return new Intl.DateTimeFormat('en-CA', { timeZone: ZONA_AG, year:'numeric', month:'2-digit', day:'2-digit' }).format(d);
  } catch (e) { return d.toISOString().slice(0, 10); }
}
// La misma clave, pero de un Date que ya representa una celda del calendario en hora local.
function claveDiaAg(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function horaAg(iso){
  const t = String(iso || '').trim();
  if (!t || soloDiaAg(t)) return '';
  const d = new Date(t);
  if (isNaN(d.getTime())) return '';
  try {
    return new Intl.DateTimeFormat('es-DO', { timeZone: ZONA_AG, hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).format(d);
  } catch (e) { return t.slice(11, 16); }
}
// Instante con el que se ordena. Un dia suelto cuenta desde el principio de ESE dia en La
// Romana (-04:00 todo el año, aqui no hay cambio de horario), no desde la medianoche UTC.
function instanteAg(iso){
  const t = String(iso || '').trim();
  const n = soloDiaAg(t) ? Date.parse(t + 'T00:00:00-04:00') : Date.parse(t);
  return isNaN(n) ? Infinity : n;
}
function sumaDiaAg(dia, n){
  const d = new Date(dia + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

// ---- Menu flotante: una lista de opciones bajo un boton, como los de Apple ----------------------
// Sirve para filtros, exportar y reorganizar. Se cierra al pulsar fuera, con Escape o al elegir.
// opciones: [{ id, texto, nota? }, { rotulo }, { sep:true }]; elegida marca una con un visto.
function cierraMenusFlotantes(){
  document.querySelectorAll('.menu-flotante').forEach(m => m.remove());
}
// `elegidas` puede ser una funcion (se vuelve a leer al repintar). Con `mantener` el menu sigue abierto
// tras elegir (filtros y reorganizar se eligen varias a la vez); si no, se cierra al elegir.
function menuFlotante(boton, opciones, { elegida = null, elegidas = null, alElegir, mantener = false } = {}){
  const abierto = document.querySelector('.menu-flotante[data-de="' + (boton.id || '') + '"]');
  cierraMenusFlotantes();
  if (abierto) return;                       // pulsar el boton otra vez lo cierra
  const m = document.createElement('div');
  m.className = 'menu-flotante'; m.setAttribute('role', 'menu'); m.dataset.de = boton.id || '';
  const pinta = () => {
    const marcadas = new Set(typeof elegidas === 'function' ? elegidas() : (elegidas || (elegida != null ? [elegida] : [])));
    m.innerHTML = opciones.map(o => o.sep ? '<hr>' : o.rotulo ? '<div class="mf-rot">' + esc(o.rotulo) + '</div>'
      : '<button type="button" role="menuitem" data-mf="' + esc(o.id) + '"' + (marcadas.has(o.id) ? ' class="on"' : '') + '>'
        + '<i class="mf-visto">' + (marcadas.has(o.id) ? '✓' : '') + '</i><span>' + esc(o.texto)
        + (o.nota ? '<small>' + esc(o.nota) + '</small>' : '') + '</span></button>').join('');
  };
  pinta();
  document.body.appendChild(m);
  const r = boton.getBoundingClientRect();
  m.style.top = Math.round(r.bottom + 8) + 'px';
  m.style.left = Math.max(12, Math.min(r.left, window.innerWidth - m.offsetWidth - 12)) + 'px';
  m.addEventListener('click', ev => {
    const b = ev.target.closest('[data-mf]');
    if (!b) return;
    if (!mantener) cierraMenusFlotantes();
    if (alElegir) alElegir(b.dataset.mf);
    if (mantener && m.isConnected) pinta();
  });
}
document.addEventListener('click', ev => {
  if (ev.target.closest('.menu-flotante') || ev.target.closest('[data-menu-flotante]')) return;
  cierraMenusFlotantes();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') cierraMenusFlotantes(); });

async function cargaGoogleAgenda(forzar){
  const u = typeof auth !== 'undefined' && auth.currentUser;
  if (!u) return;
  const ahora = Date.now();
  // Sin este freno, cada repintado de la Agenda seria una peticion a Google.
  if (!forzar && GOOGLE_AG.estado !== 'sin-cargar' && ahora - GOOGLE_AG_PEDIDO < 60000) return;
  GOOGLE_AG_PEDIDO = ahora;
  try {
    const token = await u.getIdToken();
    const r = await fetch(BASE_FN + '/crmGoogleCalendar' + (forzar ? '?forzar=1' : ''),
      { headers: { Authorization: 'Bearer ' + token } });
    // Un 404 o un 501 es el servidor todavia sin desplegar: esta mitad aun no existe, no es un
    // error que nadie pueda arreglar desde el panel. La Agenda sigue igual que siempre y solo
    // dice que Google no esta conectado, sin un aviso en rojo.
    if (!r.ok) {
      const sinDesplegar = r.status === 404 || r.status === 501;
      GOOGLE_AG = { ...GOOGLE_AG, estado: sinDesplegar ? 'ok' : 'error', eventos: [],
        configurado: sinDesplegar ? false : GOOGLE_AG.configurado, error: sinDesplegar ? '' : 'no disponible' };
    }
    else {
      const d = await r.json();
      GOOGLE_AG = {
        estado:'ok',
        configurado: d.configured === true,
        eventos: Array.isArray(d.eventos) ? d.eventos : [],
        calendario: d.calendario || null,
        leido: Date.parse(d.leido_at || '') || ahora,
        stale: d.stale === true,
        error: d.error_code || '',
      };
    }
  } catch (e) {
    GOOGLE_AG = { ...GOOGLE_AG, estado:'error', error:'sin conexión' };
  }
  if (vistaActual === 'agenda') pintaAgenda();
}

// La Agenda se repinta sola con cada cambio de las fichas, porque eso llega por onSnapshot.
// Google no manda nada: si no se vuelve a preguntar, un evento creado en el telefono no
// aparece hasta recargar la pagina a mano.
function relojGoogleAgenda(){
  if (GOOGLE_AG_RELOJ) return;
  GOOGLE_AG_RELOJ = setInterval(() => {
    if (vistaActual === 'agenda' && !document.hidden) cargaGoogleAgenda();
  }, 120000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && vistaActual === 'agenda') cargaGoogleAgenda();
  });
}

// Eventos de Google -> filas de la Agenda. Van aparte de citasDe() a proposito: las dos
// exportaciones a .ics salen de citasDe(), y meter aqui lo que viene de Google lo devolveria
// a Google convertido en un evento del CRM.
function citasGoogle(){
  const filas = [];
  for (const e of (GOOGLE_AG.eventos || [])) {
    if (!e) continue;
    const firme = e.estado !== 'tentative';
    if (e.todo_el_dia && e.dia_inicio) {
      // Un evento de varios dias se parte en una fila por dia. Enseñar solo el primero haria
      // creer que el estudio esta libre el resto del viaje.
      let dia = e.dia_inicio;
      const fin = e.dia_fin_exclusivo && e.dia_fin_exclusivo > e.dia_inicio ? e.dia_fin_exclusivo : sumaDiaAg(e.dia_inicio, 1);
      for (let i = 0; i < 31 && dia < fin; i++) {
        filas.push({ g:e, c:null, iso:dia, firme, tipo:'google', todoElDia:true });
        dia = sumaDiaAg(dia, 1);
      }
    } else if (e.inicio) {
      filas.push({ g:e, c:null, iso:e.inicio, firme, tipo:'google' });
    }
  }
  return filas;
}

// Lo del CRM y lo de Google en una sola lista, en orden real. Se compara por instante y no
// por texto: un dia suelto ('2026-11-20') y un ISO en UTC no se ordenan bien con localeCompare.
function filasAgenda(){
  return citasDe().concat(citasGoogle()).sort((a, b) => instanteAg(a.iso) - instanteAg(b.iso));
}

function textoGoogleAgenda(){
  const g = GOOGLE_AG;
  if (g.estado === 'sin-cargar') return 'Google Calendar: leyendo…';
  if (g.configurado === false) return 'Google Calendar: no conectado';
  if (g.estado === 'error' || g.error === 'google_unreachable') return 'Google Calendar: no se pudo leer ahora mismo';
  const n = (g.eventos || []).length;
  const min = Math.max(0, Math.round((Date.now() - g.leido) / 60000));
  return 'Google Calendar: ' + n + ' evento' + (n === 1 ? '' : 's')
    + (g.stale ? ' · copia de hace ' + min + ' min, Google no respondió' : ' · leído hace ' + min + ' min');
}

const ID_CAL_GOOGLE = /^[a-z0-9._%+-]+@(group\.calendar\.google\.com|import\.calendar\.google\.com|gmail\.com|googlemail\.com)$/i;
function idsCalendarioGoogle(){
  return [AJUSTES.google_calendar_embed_id, AJUSTES.google_calendar_embed_extra_id]
    .map(v => String(v || '').trim()).filter(v => ID_CAL_GOOGLE.test(v));
}
// La vista embebida de Google. Se ve SOLO con la sesion de Google del dueño en ese navegador
// y con cookies de terceros permitidas: en Safari, en el iPhone o de incognito sale la
// pantalla de acceso de Google. Por eso es la vista secundaria; la fiable es la lista, que
// llega del servidor. El id del calendario no es una credencial --sin permiso Google no abre
// un calendario privado-- pero se guarda en los ajustes del CRM, nunca en crm-config.js.
function iframeGoogleCalendar(ids){
  const buenos = (Array.isArray(ids) ? ids : [ids]).map(v => String(v || '').trim()).filter(v => ID_CAL_GOOGLE.test(v));
  if (!buenos.length) return '';
  const src = 'https://calendar.google.com/calendar/embed?'
    + buenos.map(v => 'src=' + encodeURIComponent(v)).join('&')
    + '&ctz=America%2FSanto_Domingo&mode=MONTH&hl=es&showPrint=0&showTitle=0';
  return '<iframe src="' + esc(src) + '" title="Google Calendar" loading="lazy" referrerpolicy="no-referrer" '
    + 'style="width:100%;height:70vh;border:0;border-radius:12px;background:var(--panel)"></iframe>'
    + '<p class="cfgnota" style="margin-top:10px">Esta vista es de Google: solo se ve con tu sesión de Google '
    + 'abierta en este navegador. Si sale la pantalla de acceso, usa «Calendario» o «Lista», que salen del CRM. '
    + '<a href="https://calendar.google.com/" target="_blank" rel="noopener">Abrir Google Calendar</a></p>';
}

function montaAgenda(){
  if (!montadas.has('agenda')) {
    montadas.add('agenda');
    hueco('agenda', '<div class="hoja"><h1>Agenda</h1>'
      + '<p class="bajada">Sesiones con fecha. Las confirmadas llevan hora cerrada; '
      +   'las tentativas todavía no.</p>'

      +   '<div class="agtog"><button data-agv="cal" class="on">Calendario</button>'
      +     '<button data-agv="lista">Lista</button>'

      // de Google no puede pintar nada y un botón que no lleva a ningún sitio estorba.
      +     '<button data-agv="google" id="agVistaGoogle" style="display:none">Google</button></div>'
      // Un solo boton de filtro (con su icono) y «Agendar» a su lado; lo demas, recogido.
      +   '<button class="btn-linea btn-filtro" id="agFiltroBtn" data-menu-flotante title="Filtrar la lista">'
      +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.500h16M7 12h10M10.500 17.500h3"/></svg><span id="agFiltroTxt">Próximas</span></button>'
      +   '<button class="btn-solido" id="agNueva">＋ Agendar</button>'
      +   '<button class="btn-linea" id="agExportar" data-menu-flotante style="margin-left:auto" title="Descargar la agenda">Exportar</button>'
      + '</div>'
      // El estado de Google solo se ve cuando algo falla; la lectura es automatica.
      + '<div class="agbar agbar-estado" id="agEstadoBarra" hidden>'

// Los filtros de la lista, recogidos en un solo boton.
const AG_FILTROS = [['proximas','Próximas'],['hoy','Hoy'],['pasadas','Pasadas'],['todas','Todas']];

function pintaAgenda(){
  const cont = $('agCuerpo'); if (!cont) return;
  const todas = filasAgenda();
  const claveHoy = diaAg(new Date().toISOString());

  // El filtro solo tiene sentido en la lista: el mes ya es su propio filtro.
  const fb = $('agFiltroBtn');
  if (fb) {
    fb.hidden = agVista !== 'lista';
    $('agFiltroTxt').textContent = (AG_FILTROS.find(f => f[0] === agFiltro) || AG_FILTROS[0])[1];
    fb.classList.toggle('activo', agFiltro !== 'proximas');
  }
  // La lectura de Google es automatica: el estado solo se enseña si hay algo que decir.
  const est = $('agGoogleEstado');
  if (est) est.textContent = textoGoogleAgenda();
  const g = GOOGLE_AG;
  const problema = g.estado === 'error' || g.error === 'google_unreachable' || g.stale === true;
  const barra = $('agEstadoBarra');
  if (barra) barra.hidden = !problema;
  const reintento = $('agGoogleRefresca');
  if (reintento) reintento.hidden = !problema;
  const ids = idsCalendarioGoogle();
  const bg = $('agVistaGoogle');
  if (bg) bg.style.display = ids.length ? '' : 'none';
  // Si se quita el id estando en esa vista, no se puede quedar la Agenda en blanco.
  if (agVista === 'google' && !ids.length) agVista = 'cal';
  document.querySelectorAll('[data-agv]').forEach(b => b.classList.toggle('on', b.dataset.agv === agVista));

  if (agVista === 'google') { cont.innerHTML = iframeGoogleCalendar(ids); return; }
  if (agVista === 'cal') return pintaAgendaCalendario(todas);

  const filtradas = todas.filter(({iso}) => {
    const k = diaAg(iso);
    if (!k) return false;
    if (agFiltro === 'hoy') return k === claveHoy;
    if (agFiltro === 'proximas') return k >= claveHoy;
    if (agFiltro === 'pasadas') return k < claveHoy;
    return true;
  });
  if (!filtradas.length) {
    cont.innerHTML = '<p class="bajada">Nada con este filtro. Pulsa «＋ Agendar» para meter una cita.</p>';
    return;
  }
  // Agrupadas por dia con su encabezado: una lista corrida de treinta citas no deja ver
  // como viene la semana. El dia sale de diaAg, no de cortar el ISO: cortarlo daba el dia UTC
  // y una cita de las 9 de la noche se agrupaba con las del dia siguiente.
  const porDia = {};
  filtradas.forEach(x => { const k = diaAg(x.iso); (porDia[k] = porDia[k] || []).push(x); });
  cont.innerHTML = Object.keys(porDia).sort().map(k => {
    const d = new Date(k + 'T12:00:00');
    return '<div class="agdia"><div class="agdcab">'
      + esc(d.toLocaleDateString('es-DO', { weekday:'long', day:'numeric', month:'long' }))
      + '<b>' + porDia[k].length + '</b></div>'
      + porDia[k].map(x => filaCita(x)).join('') + '</div>';
  }).join('');
}

function filaCita(fila){
  if (fila && fila.tipo === 'google') return filaGoogle(fila);
  const {c, iso, firme, desvinculada, redOculta: deRedOculta} = fila;
  return '<div class="agcita" data-agconv="' + esc(c._id) + '">'
    + '<span class="agh">' + esc(horaAg(iso) || '—') + '</span>'
    + '<span class="agn"><b>' + esc(nombreDe(c)) + '</b>'
    +   '<small>' + esc(c.interested_category || 'sin categoría')
    +   (c.selected_combo_name ? ' · ' + esc(c.selected_combo_name) : '') + '</small></span>'
    + (desvinculada ? '<i class="chip mal" title="Su chat es de la línea ' + esc(telefonoLegible(c.business_number))
        + ', que ya no está vinculada">línea desvinculada</i>' : '')
    // La cita se conserva, pero hay que decir por donde se le escribe a esa persona: su chat se
    // atiende en la bandeja de Meta, no aqui.
    + (deRedOculta ? '<i class="chip medio" title="Su chat entró por una red oculta en el CRM: '
        + 'se le contesta desde la bandeja de Meta">' + esc(CANALES[canalDe(c)]?.corto || 'red') + ' · oculto</i>' : '')
    + '<i class="chip ' + (firme ? 'ok' : 'medio') + '">' + (firme ? 'confirmada' : 'tentativa') + '</i>'
    + '</div>';
}

// Un evento del Google del dueño. SIN data-agconv: no hay ninguna ficha detrás que abrir, y
// una fila que parece pinchable y no hace nada se lee como que el CRM está roto.
function filaGoogle(x){
  const e = x.g || {};
  return '<div class="agcita aggoogle">'
    + '<span class="agh">' + esc(x.todoElDia ? 'día' : (horaAg(x.iso) || '—')) + '</span>'
    + '<span class="agn"><b>' + esc(e.titulo || '(sin título)') + '</b>'

    + (e.recurrencia_incompleta
        ? '<i class="chip medio" title="Esta serie usa una regla de repetición que el CRM no sabe calcular: '
          + 'solo se enseña la primera fecha. Míralo en Google">repetición parcial</i>' : '')
    + (e.estado === 'tentative' ? '<i class="chip medio">tentativa</i>' : '')

function pintaAgendaCalendario(todas){
  const cont = $('agCuerpo');
  const primero = new Date(agMes.getFullYear(), agMes.getMonth(), 1);
  const arranque = new Date(primero);
  arranque.setDate(1 - ((primero.getDay() + 6) % 7));   // la semana empieza en lunes
  const hoy = new Date(); hoy.setHours(0,0,0,0);

  let celdas = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(arranque); d.setDate(arranque.getDate() + i);
    const delMes = d.getMonth() === agMes.getMonth();
    const citas = todas.filter(x => mismoDia(x.iso, d));
    const esHoy = d.getTime() === hoy.getTime();
    const elegido = agDia && d.toDateString() === agDia.toDateString();
    celdas += '<button class="agcel' + (delMes ? '' : ' fuera') + (esHoy ? ' hoy' : '')
      // claveDiaAg y no toISOString: el ISO es UTC y en un navegador al este de Greenwich la
      // celda del 25 se marcaba como el 24.
      + (elegido ? ' sel' : '') + '" data-agdia="' + claveDiaAg(d) + 'T12:00:00">'
      + '<span class="agnum">' + d.getDate() + '</span>'
      + (citas.length
          ? '<span class="agpuntos">' + citas.slice(0,4).map(x =>
              '<i class="' + (x.tipo === 'google' ? 'gcal' : (x.firme ? 'firme' : 'tent')) + '"></i>').join('')
            + (citas.length > 4 ? '<em>+' + (citas.length-4) + '</em>' : '') + '</span>'
          : '')
      + '</button>';
  }

  const delDia = agDia ? todas.filter(x => mismoDia(x.iso, agDia)) : [];
  cont.innerHTML = '<div class="agnav">'
    + '<button class="btn-linea" data-agmes="-1">‹</button>'
    + '<b>' + esc(agMes.toLocaleDateString('es-DO', { month:'long', year:'numeric' })) + '</b>'
    + '<button class="btn-linea" data-agmes="hoy">Hoy</button>'
    + '<button class="btn-linea" data-agmes="1">›</button></div>'
    + '<div class="agsem">' + ['lun','mar','mié','jue','vie','sáb','dom']
        .map(d => '<span>' + d + '</span>').join('') + '</div>'
    + '<div class="agcal">' + celdas + '</div>'
    + (agDia
        ? '<div class="agpanel"><div class="agdcab">'
          + esc(agDia.toLocaleDateString('es-DO', { weekday:'long', day:'numeric', month:'long' }))
          + '<b>' + delDia.length + '</b></div>'
          + (delDia.length ? delDia.map(filaCita).join('')
             : '<p class="cfgnota" style="padding:10px 0">Nada este día.</p>')
          + '</div>'
        : '<p class="bajada" style="margin-top:14px">Pulsa un día para ver sus sesiones.</p>');
}

// Agendar. Busca el contacto entre los que ya existen en vez de crear uno nuevo: agendar
// a alguien que ya escribio y crearle una ficha aparte parte su historial en dos.
function abreAgendar(c){
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  const cuando = new Date(); cuando.setDate(cuando.getDate() + 1); cuando.setHours(10,0,0,0);
  abreModal('<div class="mtapa"><b>Agendar sesión</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo">'
    + (c ? '<p class="aviso">Para <b>' + esc(nombreDe(c)) + '</b></p>'
         : '<div class="campo"><label>Contacto</label><input id="agBusca" placeholder="Buscar por nombre o teléfono…">'
           + '<div id="agRes"></div></div>')
    + '<div class="par">'
    +   '<div class="campo"><label>Cuándo</label><input type="datetime-local" id="agCuando" value="' + iso(cuando) + '"></div>'
    +   '<div class="campo"><label>Categoría</label><input id="agCat" value="' + esc(c?.interested_category || '') + '" placeholder="xv, boda…"></div>'
    + '</div>'
    + '<div class="campo"><label>Combo</label><input id="agCombo" value="' + esc(c?.selected_combo_name || '') + '"></div>'
    + '<label class="cfgsw"><input type="checkbox" id="agFirme" checked><span><b>Confirmada</b>'
    +   '<i>Sin marcar queda como fecha tentativa, que no bloquea el hueco.</i></span></label>'
    + '</div>'
    + '<div class="mpatas"><button class="btn-linea" data-cerrar>Cancelar</button>'
    +   '<button class="btn-solido" id="agGuardar">Agendar</button></div>');
  $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });

  let elegido = c;
  if (!c) {
    const pinta = () => {
      const q = ($('agBusca').value || '').trim();
      $('agRes').innerHTML = !q ? '' : CONVS
        .filter(x => coincideContacto(x, q))
        .slice(0, 6)
        .map(x => '<button class="tpl" data-ag="' + esc(x._id) + '"><b>' + esc(nombreDe(x)) + '</b>'
          + '<span class="tplmeta">+' + esc(x.wa_phone||'') + '</span></button>').join('')
        || '<p class="cfgnota">Sin resultados. Solo se agenda a contactos que ya escribieron.</p>';
    };
    $('agBusca').oninput = pinta;
    $('agRes').onclick = ev => {
      const b = ev.target.closest('[data-ag]'); if (!b) return;
      elegido = buscaConv(b.dataset.ag);
      $('agBusca').value = nombreDe(elegido);
      $('agRes').innerHTML = '<p class="cfgnota">Elegido: <b>' + esc(nombreDe(elegido)) + '</b></p>';
      if (elegido.interested_category) $('agCat').value = elegido.interested_category;
    };
  }

  $('agGuardar').onclick = async () => {
    if (!elegido) return avisa('Elige a quién agendar');
    const v = $('agCuando').value;
    if (!v) return avisa('Falta la fecha');
    const campos = { interested_category: $('agCat').value.trim() || elegido.interested_category || '' };
    if ($('agFirme').checked) {
      campos.scheduled_at = new Date(v).toISOString();
      campos.reservation_status = 'confirmado';
      campos.lifecycle_stage = ['cliente','reservado'].includes(elegido.lifecycle_stage)
        ? elegido.lifecycle_stage : 'reservado';
    } else {
      campos.tentative_date = new Date(v).toISOString();
      campos.reservation_status = 'fecha_tentativa';
    }
    if ($('agCombo').value.trim()) campos.selected_combo_name = $('agCombo').value.trim();
    $('agGuardar').disabled = true;
    const r = await llama({ action:'updateLead', conversation_id: elegido.id || elegido._id, fields: campos });
    $('agGuardar').disabled = false;
    if (!r.ok) return avisa('No se pudo agendar', r.error);
    Object.assign(elegido, campos);
    cierraModal();
    avisa('Agendada', nombreDe(elegido) + ' · ' + new Date(v).toLocaleString('es-DO', { dateStyle:'medium', timeStyle:'short' }));
    pintaAgenda(); pintaChats();
  };
}
