/* ---- Agenda -------------------------------------------------------------- */
// La version anterior solo LEIA: no habia forma de meter una cita desde el panel, que
// para una agenda es no servir. Ahora se agenda, se ve el mes y se filtra.
//
// La fecha vive en la ficha del contacto (scheduled_at confirmada, tentative_date
// tentativa), no en una tabla aparte: una cita sin cliente no existe, y dos sitios donde
// vive la misma fecha acaban discrepando.
let agVista = 'cal';         // 'cal' | 'lista'
let agFiltro = 'proximas';   // proximas | hoy | pasadas | todas
let agMes = new Date();      // mes que se esta mirando
let agDia = null;            // dia seleccionado en el calendario

function citasDe(){
  return CONVS
    .filter(c => c.scheduled_at || c.tentative_date)
    .map(c => ({ c, iso: String(c.scheduled_at || c.tentative_date), firme: !!c.scheduled_at }))
    .sort((a,b) => a.iso.localeCompare(b.iso));
}
function mismoDia(iso, d){
  const x = new Date(iso);
  return x.getFullYear() === d.getFullYear() && x.getMonth() === d.getMonth() && x.getDate() === d.getDate();
}

function montaAgenda(){
  if (!montadas.has('agenda')) {
    montadas.add('agenda');
    hueco('agenda', '<div class="hoja"><h1>Agenda</h1>'
      + '<p class="bajada">Sesiones con fecha. Las confirmadas llevan hora cerrada; '
      +   'las tentativas todavía no.</p>'
      + '<div class="agbar">'
      +   '<div class="agtog"><button data-agv="cal" class="on">Calendario</button>'
      +     '<button data-agv="lista">Lista</button></div>'
      +   '<div class="agfil" id="agFil"></div>'
      +   '<button class="btn-solido" id="agNueva">＋ Agendar</button>'
      + '</div>'
      + '<div id="agCuerpo"></div></div>');
    $('vista-agenda').addEventListener('click', ev => {
      const v = ev.target.closest('[data-agv]');
      if (v) { agVista = v.dataset.agv; pintaAgenda(); return; }
      const f = ev.target.closest('[data-agf]');
      if (f) { agFiltro = f.dataset.agf; pintaAgenda(); return; }
      const m = ev.target.closest('[data-agmes]');
      if (m) {
        const d = m.dataset.agmes;
        if (d === 'hoy') agMes = new Date();
        else agMes = new Date(agMes.getFullYear(), agMes.getMonth() + Number(d), 1);
        agDia = null; pintaAgenda(); return;
      }
      const c = ev.target.closest('[data-agdia]');
      if (c) { agDia = new Date(c.dataset.agdia); pintaAgenda(); return; }
      const ab = ev.target.closest('[data-agconv]');
      if (ab) { const cv = CONVS.find(x => x._id === ab.dataset.agconv); if (cv) { abre(cv); ve('conversations'); } }
    });
    $('agNueva').onclick = () => abreAgendar(null);
  }
  pintaAgenda();
}

function pintaAgenda(){
  const cont = $('agCuerpo'); if (!cont) return;
  const todas = citasDe();
  const hoy = new Date(); hoy.setHours(0,0,0,0);

  const fil = $('agFil');
  if (fil) fil.innerHTML = [['proximas','Próximas'],['hoy','Hoy'],['pasadas','Pasadas'],['todas','Todas']]
    .map(([k,n]) => '<button class="filtro' + (agFiltro===k?' on':'') + '" data-agf="' + k + '">'
      + n + '</button>').join('');
  document.querySelectorAll('[data-agv]').forEach(b => b.classList.toggle('on', b.dataset.agv === agVista));

  if (agVista === 'cal') return pintaAgendaCalendario(todas);

  const filtradas = todas.filter(({iso}) => {
    const d = new Date(iso); const soloDia = new Date(d); soloDia.setHours(0,0,0,0);
    if (agFiltro === 'hoy') return soloDia.getTime() === hoy.getTime();
    if (agFiltro === 'proximas') return soloDia >= hoy;
    if (agFiltro === 'pasadas') return soloDia < hoy;
    return true;
  });
  if (!filtradas.length) {
    cont.innerHTML = '<p class="bajada">Nada con este filtro. Pulsa «＋ Agendar» para meter una cita.</p>';
    return;
  }
  // Agrupadas por dia con su encabezado: una lista corrida de treinta citas no deja ver
  // como viene la semana.
  const porDia = {};
  filtradas.forEach(x => { const k = x.iso.slice(0,10); (porDia[k] = porDia[k] || []).push(x); });
  cont.innerHTML = Object.keys(porDia).sort().map(k => {
    const d = new Date(k + 'T12:00:00');
    return '<div class="agdia"><div class="agdcab">'
      + esc(d.toLocaleDateString('es-DO', { weekday:'long', day:'numeric', month:'long' }))
      + '<b>' + porDia[k].length + '</b></div>'
      + porDia[k].map(x => filaCita(x)).join('') + '</div>';
  }).join('');
}

function filaCita({c, iso, firme}){
  return '<div class="agcita" data-agconv="' + esc(c._id) + '">'
    + '<span class="agh">' + esc(iso.slice(11,16) || '—') + '</span>'
    + '<span class="agn"><b>' + esc(nombreDe(c)) + '</b>'
    +   '<small>' + esc(c.interested_category || 'sin categoría')
    +   (c.selected_combo_name ? ' · ' + esc(c.selected_combo_name) : '') + '</small></span>'
    + '<i class="chip ' + (firme ? 'ok' : 'medio') + '">' + (firme ? 'confirmada' : 'tentativa') + '</i>'
    + '</div>';
}

function pintaAgendaCalendario(todas){
  const cont = $('agCuerpo');
  const primero = new Date(agMes.getFullYear(), agMes.getMonth(), 1);
  const arranque = new Date(primero);
  arranque.setDate(1 - ((primero.getDay() + 6) % 7));   // la semana empieza en lunes
  const hoy = new Date(); hoy.setHours(0,0,0,0);

  let celdas = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(arranque); d.setDate(arranque.getDate() + i);
    const delMes = d.getMonth() === agMes.getMonth();
    const citas = todas.filter(x => mismoDia(x.iso, d));
    const esHoy = d.getTime() === hoy.getTime();
    const elegido = agDia && d.toDateString() === agDia.toDateString();
    celdas += '<button class="agcel' + (delMes ? '' : ' fuera') + (esHoy ? ' hoy' : '')
      + (elegido ? ' sel' : '') + '" data-agdia="' + d.toISOString().slice(0,10) + 'T12:00:00">'
      + '<span class="agnum">' + d.getDate() + '</span>'
      + (citas.length
          ? '<span class="agpuntos">' + citas.slice(0,4).map(x =>
              '<i class="' + (x.firme ? 'firme' : 'tent') + '"></i>').join('')
            + (citas.length > 4 ? '<em>+' + (citas.length-4) + '</em>' : '') + '</span>'
          : '')
      + '</button>';
  }

  const delDia = agDia ? todas.filter(x => mismoDia(x.iso, agDia)) : [];
  cont.innerHTML = '<div class="agnav">'
    + '<button class="btn-linea" data-agmes="-1">‹</button>'
    + '<b>' + esc(agMes.toLocaleDateString('es-DO', { month:'long', year:'numeric' })) + '</b>'
    + '<button class="btn-linea" data-agmes="hoy">Hoy</button>'
    + '<button class="btn-linea" data-agmes="1">›</button></div>'
    + '<div class="agsem">' + ['lun','mar','mié','jue','vie','sáb','dom']
        .map(d => '<span>' + d + '</span>').join('') + '</div>'
    + '<div class="agcal">' + celdas + '</div>'
    + (agDia
        ? '<div class="agpanel"><div class="agdcab">'
          + esc(agDia.toLocaleDateString('es-DO', { weekday:'long', day:'numeric', month:'long' }))
          + '<b>' + delDia.length + '</b></div>'
          + (delDia.length ? delDia.map(filaCita).join('')
             : '<p class="cfgnota" style="padding:10px 0">Nada este día.</p>')
          + '</div>'
        : '<p class="bajada" style="margin-top:14px">Pulsa un día para ver sus sesiones.</p>');
}

// Agendar. Busca el contacto entre los que ya existen en vez de crear uno nuevo: agendar
// a alguien que ya escribio y crearle una ficha aparte parte su historial en dos.
function abreAgendar(c){
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  const cuando = new Date(); cuando.setDate(cuando.getDate() + 1); cuando.setHours(10,0,0,0);
  abreModal('<div class="mtapa"><b>Agendar sesión</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo">'
    + (c ? '<p class="aviso">Para <b>' + esc(nombreDe(c)) + '</b></p>'
         : '<div class="campo"><label>Contacto</label><input id="agBusca" placeholder="Buscar por nombre o teléfono…">'
           + '<div id="agRes"></div></div>')
    + '<div class="par">'
    +   '<div class="campo"><label>Cuándo</label><input type="datetime-local" id="agCuando" value="' + iso(cuando) + '"></div>'
    +   '<div class="campo"><label>Categoría</label><input id="agCat" value="' + esc(c?.interested_category || '') + '" placeholder="xv, boda…"></div>'
    + '</div>'
    + '<div class="campo"><label>Combo</label><input id="agCombo" value="' + esc(c?.selected_combo_name || '') + '"></div>'
    + '<label class="cfgsw"><input type="checkbox" id="agFirme" checked><span><b>Confirmada</b>'
    +   '<i>Sin marcar queda como fecha tentativa, que no bloquea el hueco.</i></span></label>'
    + '</div>'
    + '<div class="mpatas"><button class="btn-linea" data-cerrar>Cancelar</button>'
    +   '<button class="btn-solido" id="agGuardar">Agendar</button></div>');
  $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });

  let elegido = c;
  if (!c) {
    const pinta = () => {
      const q = ($('agBusca').value || '').trim().toLowerCase();
      $('agRes').innerHTML = !q ? '' : CONVS
        .filter(x => (nombreDe(x) + ' ' + (x.wa_phone||'')).toLowerCase().includes(q))
        .slice(0, 6)
        .map(x => '<button class="tpl" data-ag="' + esc(x._id) + '"><b>' + esc(nombreDe(x)) + '</b>'
          + '<span class="tplmeta">+' + esc(x.wa_phone||'') + '</span></button>').join('')
        || '<p class="cfgnota">Sin resultados. Solo se agenda a contactos que ya escribieron.</p>';
    };
    $('agBusca').oninput = pinta;
    $('agRes').onclick = ev => {
      const b = ev.target.closest('[data-ag]'); if (!b) return;
      elegido = CONVS.find(x => x._id === b.dataset.ag);
      $('agBusca').value = nombreDe(elegido);
      $('agRes').innerHTML = '<p class="cfgnota">Elegido: <b>' + esc(nombreDe(elegido)) + '</b></p>';
      if (elegido.interested_category) $('agCat').value = elegido.interested_category;
    };
  }

  $('agGuardar').onclick = async () => {
    if (!elegido) return avisa('Elige a quién agendar');
    const v = $('agCuando').value;
    if (!v) return avisa('Falta la fecha');
    const campos = { interested_category: $('agCat').value.trim() || elegido.interested_category || '' };
    if ($('agFirme').checked) {
      campos.scheduled_at = new Date(v).toISOString();
      campos.reservation_status = 'confirmado';
      campos.lifecycle_stage = ['cliente','reservado'].includes(elegido.lifecycle_stage)
        ? elegido.lifecycle_stage : 'reservado';
    } else {
      campos.tentative_date = new Date(v).toISOString();
      campos.reservation_status = 'fecha_tentativa';
    }
    if ($('agCombo').value.trim()) campos.selected_combo_name = $('agCombo').value.trim();
    $('agGuardar').disabled = true;
    const r = await llama({ action:'updateLead', conversation_id: elegido.id || elegido._id, fields: campos });
    $('agGuardar').disabled = false;
    if (!r.ok) return avisa('No se pudo agendar', r.error);
    Object.assign(elegido, campos);
    cierraModal();
    avisa('Agendada', nombreDe(elegido) + ' · ' + new Date(v).toLocaleString('es-DO', { dateStyle:'medium', timeStyle:'short' }));
    pintaAgenda(); pintaChats();
  };
}

/* ---- Canales ------------------------------------------------------------- */
// Un sitio para todas las vias por las que escribe un cliente. Antes solo existia
// "Conexión WhatsApp" y el segundo numero estaba mezclado con el oficial sin distinguirse,
// que es como se acaba contestando por el canal equivocado.
//
// Cada canal se identifica por como llego la conversacion: el API oficial marca
// source='whatsapp_cloud', el puente de WhatsApp Web marca source='whatsapp_qr', y las
// redes traen el suyo. Ese campo ya existe en los datos; lo que faltaba era enseñarlo.
const CANALES = {
  whatsapp_cloud: { nombre:'WhatsApp oficial (API)', corto:'WhatsApp', logo:'🟢', color:'#25d366' },
  whatsapp_qr:    { nombre:'WhatsApp Web (2.º número)', corto:'WA Web', logo:'🔵', color:'#128c7e' },
  instagram:      { nombre:'Instagram Direct', corto:'Instagram', logo:'🟣', color:'#c13584' },
  facebook:       { nombre:'Facebook Messenger', corto:'Messenger', logo:'🔷', color:'#0084ff' },
};
function canalDe(c){
  const s = String(c?.source || '').toLowerCase();
  if (CANALES[s]) return s;
  if (s.includes('qr') || s.includes('bridge')) return 'whatsapp_qr';
  if (s.includes('instagram') || s.includes('ig')) return 'instagram';
  if (s.includes('facebook') || s.includes('messenger') || s.includes('fb')) return 'facebook';
  return 'whatsapp_cloud';
}

let bridgeControlState = {};

function bridgeStatusLabel(status){
  return ({
    offline:'Puente apagado', idle:'Listo para vincular', requested:'Solicitud recibida',
    generating:'Generando código', code_ready:'Esperando el teléfono',
    connecting:'Finalizando vinculación', rebuild_requested:'Preparando reconstrucción',
    rebuild_clearing:'Renovando dispositivo', connected:'WhatsApp conectado',
    disconnected:'WhatsApp desconectado', canceled:'Vinculación cancelada',
    expired:'Código vencido', error:'Requiere atención',
  })[status] || 'Estado desconocido';
}

function formatBridgeCode(value){
  const raw = String(value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  return (raw.match(/.{1,4}/g) || []).join('-');
}

async function callBridgeControl(action, payload = {}){
  const actionMap = {
    status:'bridgeStatus', request_pairing:'requestBridgePairing', cancel:'cancelBridgePairing',
    pause:'pauseBridge', resume:'resumeBridge', logout:'logoutBridge',
    sync_history:'syncBridgeHistory', rebuild_link:'rebuildBridge',
    enable_photo_bot:'setPhotoBot', disable_photo_bot:'setPhotoBot',
  };
  const mapped = actionMap[action];
  if (!mapped) return { ok:false, error:'acción de puente no disponible' };
  const body = { action:mapped, ...payload };
  if (action === 'enable_photo_bot') body.enabled = true;
  if (action === 'disable_photo_bot') body.enabled = false;
  return llama(body);
}

function bridgeControlsHtml(p){
  const botEnabled = p.bot_enabled === true;
  return '<div class="bridge-tools">'
    + '<button class="btn-linea" id="bridgeRefreshBtn">Actualizar estado</button>'
    + '<button class="btn-linea" id="bridgePairBtn">Generar código</button>'
    + '<button class="btn-linea" id="bridgePauseBtn">Pausar envíos</button>'
    + '<button class="btn-linea" id="bridgeHistoryBtn">Sincronizar historial</button>'
    + '<button class="btn-linea" id="bridgeRebuildBtn">Reconstruir vínculo e historial</button>'
    + '<button class="btn-linea danger" id="bridgeLogoutBtn">Cerrar sesión de WhatsApp</button>'
    + '<button class="btn-linea" id="photoBotGlobalBtn" data-photo-bot-toggle '
    +   'data-permission="manage_settings">Bot de este canal: '
    +   (botEnabled ? 'encendido' : 'apagado') + '</button>'
    + '<div class="bridge-code-panel" id="bridgeCodePanel">'
    +   '<div class="codigo" id="bridgePairCode">--</div>'
    +   '<p class="bridge-meta" id="bridgeCodeMeta">Preparando el código seguro…</p>'
    +   '<button class="btn-linea danger" id="bridgeCancelPair">Cancelar</button>'
    + '</div>'
    + '<p class="bridge-meta" id="bridgeHistoryState"></p>'
    + '<p class="bridge-meta" id="bridgeRebuildState"></p>'
    + '<p class="bridge-meta mal" id="bridgeError"></p>'
    + '</div>';
}

function renderBridgeControlState(state, explicitError = ''){
  bridgeControlState = state || {};
  const status = String(bridgeControlState.status || bridgeControlState.state || 'offline').toLowerCase();
  const active = ['requested','generating','code_ready','connecting','rebuild_requested','rebuild_clearing'].includes(status);
  const code = formatBridgeCode(bridgeControlState.pairing_code);
  const codePanel = $('bridgeCodePanel');
  if (codePanel) codePanel.classList.toggle('on', !!code || active);
  if ($('bridgePairCode')) $('bridgePairCode').textContent = code || '--';
  if ($('bridgeCancelPair')) $('bridgeCancelPair').disabled = !active;

  const hostOnline = bridgeControlState.host_online === true;
  const connected = status === 'connected';
  const historyStatus = String(bridgeControlState.history_sync_status || 'idle');
  const historyActive = ['requested','running','waiting'].includes(historyStatus);
  const pair = $('bridgePairBtn');
  if (pair) {
    pair.disabled = !hostOnline || active || connected;
    pair.textContent = active ? 'Procesando…' : (connected ? 'Ya vinculado' : 'Generar código');
  }
  const pause = $('bridgePauseBtn');
  if (pause) {
    pause.disabled = !hostOnline && bridgeControlState.paused !== true;
    pause.textContent = bridgeControlState.paused ? 'Reanudar envíos' : 'Pausar envíos';
  }
  const history = $('bridgeHistoryBtn');
  if (history) {
    history.disabled = !connected || !hostOnline || historyActive;
    history.textContent = historyActive ? 'Sincronizando…' : 'Sincronizar historial';
  }
  const rebuild = $('bridgeRebuildBtn');
  if (rebuild) rebuild.disabled = !connected || !hostOnline || historyActive;
  const logout = $('bridgeLogoutBtn');
  if (logout) logout.disabled = !connected && !bridgeControlState.connected_phone;

  if ($('bridgeCodeMeta')) $('bridgeCodeMeta').textContent = code
    ? 'Escribe este código en WhatsApp → Dispositivos vinculados.'
    : (active ? bridgeStatusLabel(status) + '…' : 'Solicita un código nuevo cuando el puente esté en línea.');
  if ($('bridgeHistoryState')) {
    const imported = Number(bridgeControlState.history_sync_imported || 0);
    const duplicates = Number(bridgeControlState.history_sync_duplicates || 0);
    $('bridgeHistoryState').textContent = historyStatus === 'completed'
      ? 'Historial completado: ' + imported + ' nuevos; ' + duplicates + ' duplicados omitidos.'
      : historyActive ? 'Historial en proceso: ' + Number(bridgeControlState.history_sync_progress || 0) + '%.'
        : 'Historial: ' + historyStatus + '.';
  }
  if ($('bridgeRebuildState')) $('bridgeRebuildState').textContent =
    'Reconstruir renueva solo el vínculo local; conserva conversaciones y mensajes del CRM.';
  if ($('bridgeError')) $('bridgeError').textContent = explicitError || bridgeControlState.last_error || '';
  const bot = $('photoBotGlobalBtn');
  if (bot) {
    const enabled = bridgeControlState.bot_enabled === true;
    bot.textContent = 'Bot de este canal: ' + (enabled ? 'encendido' : 'apagado');
    bot.dataset.enabled = String(enabled);
    bot.disabled = !enabled && (!connected || !hostOnline || bridgeControlState.transport_mode !== 'active');
  }
}

async function refreshBridgeStatus(){
  const result = await callBridgeControl('status');
  if (result.bridge) renderBridgeControlState(result.bridge, result.ok ? '' : result.error);
  else renderBridgeControlState(bridgeControlState, result.error || 'No se pudo consultar el puente.');
}

async function requestBridgePairing(){
  const phone = NUMERO_FOTOS || '18094785620';
  const result = await callBridgeControl('request_pairing', { phone });
  if (result.bridge) renderBridgeControlState(result.bridge, result.ok ? '' : result.error);
  else renderBridgeControlState(bridgeControlState, result.error || 'No se pudo pedir el código.');
}

async function cancelBridgePairing(){
  const result = await callBridgeControl('cancel');
  if (result.bridge) renderBridgeControlState(result.bridge, result.ok ? '' : result.error);
  else renderBridgeControlState(bridgeControlState, result.error || 'No se pudo cancelar.');
}

async function toggleBridgePause(){
  const result = await callBridgeControl(bridgeControlState.paused ? 'resume' : 'pause');
  if (result.bridge) renderBridgeControlState(result.bridge, result.ok ? '' : result.error);
  else renderBridgeControlState(bridgeControlState, result.error || 'No se pudo cambiar la pausa.');
}

async function requestBridgeHistorySync(){
  const result = await callBridgeControl('sync_history');
  if (result.bridge) renderBridgeControlState(result.bridge, result.ok ? '' : result.error);
  else if ($('bridgeHistoryState')) $('bridgeHistoryState').textContent = result.error || 'No se pudo solicitar el historial.';
}

async function logoutBridgeWhatsApp(){
  if (!window.confirm('Se cerrará solamente la sesión del segundo número. Las conversaciones guardadas no se borrarán. ¿Continuar?')) return;
  const result = await callBridgeControl('logout');
  if (result.bridge) renderBridgeControlState(result.bridge, result.ok ? '' : result.error);
  else renderBridgeControlState(bridgeControlState, result.error || 'No se pudo cerrar la sesión.');
}

async function rebuildBridgeLinkAndHistory(){
  if (!window.confirm('Se renovará solo el dispositivo local para solicitar historial. Los chats y mensajes guardados NO se borrarán. ¿Continuar?')) return;
  const result = await callBridgeControl('rebuild_link');
  if (result.bridge) renderBridgeControlState(result.bridge, result.ok ? '' : result.error);
  else renderBridgeControlState(bridgeControlState, result.error || 'No se pudo reconstruir el vínculo.');
}

async function togglePhotoBot(){
  const enabled = bridgeControlState.bot_enabled === true;
  if (!window.confirm('¿Quieres ' + (enabled ? 'desactivar' : 'activar')
    + ' las respuestas automáticas del WhatsApp Fotos? Las campañas son independientes del bot.')) return;
  const result = await callBridgeControl(enabled ? 'disable_photo_bot' : 'enable_photo_bot',
    { confirmation:enabled ? '' : 'ACTIVAR BOT FOTOS' });
  if (result.bridge) renderBridgeControlState(result.bridge, result.ok ? '' : result.error);
  else renderBridgeControlState(bridgeControlState, result.error || 'No se pudo cambiar el bot.');
}

function bindBridgeControls(){
  if ($('bridgePairBtn')) $('bridgePairBtn').onclick = requestBridgePairing;
  if ($('bridgeCancelPair')) $('bridgeCancelPair').onclick = cancelBridgePairing;
  if ($('bridgePauseBtn')) $('bridgePauseBtn').onclick = toggleBridgePause;
  if ($('bridgeRefreshBtn')) $('bridgeRefreshBtn').onclick = refreshBridgeStatus;
  if ($('bridgeHistoryBtn')) $('bridgeHistoryBtn').onclick = requestBridgeHistorySync;
  if ($('bridgeRebuildBtn')) $('bridgeRebuildBtn').onclick = rebuildBridgeLinkAndHistory;
  if ($('bridgeLogoutBtn')) $('bridgeLogoutBtn').onclick = logoutBridgeWhatsApp;
  if ($('photoBotGlobalBtn')) $('photoBotGlobalBtn').onclick = togglePhotoBot;
}

function montaCanales(){
  if (!montadas.has('canales')) {
    montadas.add('canales');
    hueco('canales', '<div class="hoja"><h1>Canales</h1>'
      + '<p class="bajada">Por dónde te escriben los clientes. Si un canal no está en verde, '
      +   'lo que escribas por ahí no le llega a nadie aunque el panel diga que se envió.</p>'
      + '<div id="canalesLista"></div></div>');
  }
  pintaCanales();
}

async function pintaCanales(){
  const cont = $('canalesLista'); if (!cont) return;
  cont.innerHTML = '<p class="bajada"><span class="cargando"></span> Comprobando…</p>';

  const [estado, puente] = await Promise.all([
    llama({ action:'transportStatus' }),
    llama({ action:'bridgeStatus' }),
  ]);
  const t = estado.ok ? (estado.transport || estado) : {};
  const p = puente.ok ? (puente.bridge || puente) : {};
  bridgeControlState = p;

  const cuenta = clave => CONVS.filter(c => canalDe(c) === clave).length;
  const tarjeta = (clave, listo, detalle, acciones) => {
    const d = CANALES[clave];
    return '<div class="canal">'
      + '<div class="cabecera-canal">'
      +   '<span class="clogo" style="background:' + d.color + '22;color:' + d.color + '">' + d.logo + '</span>'
      +   '<div class="cinfo"><b>' + esc(d.nombre) + '</b>'
      +     '<span>' + cuenta(clave) + ' conversación(es)</span></div>'
      +   '<i class="chip ' + (listo === true ? 'ok' : listo === false ? 'mal' : 'medio') + '">'
      +     (listo === true ? 'conectado' : listo === false ? 'sin conectar' : 'sin usar') + '</i>'
      + '</div>'
      + '<p class="cdetalle">' + detalle + '</p>'
      + (acciones ? '<div class="cacciones">' + acciones + '</div>' : '')
      + '</div>';
  };

  const oficialListo = t.ready === true || t.state === 'ready';
  const estadoPuente = String(p.state || p.status || '').toLowerCase();
  const puenteListo = (p.connected === true || estadoPuente === 'connected' || estadoPuente === 'ready')
    && p.paused !== true && p.host_online !== false;

  cont.innerHTML =
    tarjeta('whatsapp_cloud', oficialListo,
      oficialListo
        ? 'Número ' + esc(CFG.businessDisplayNumber || CFG.businessNumber || '') + '. Entregando mensajes.'
        : 'Meta no está conectada al transporte' + (t.last_error_code ? ' (error ' + esc(String(t.last_error_code)) + ')' : '')
          + '. Reconectar exige el App Secret y se hace con scripts/conectar_meta_firebase.ps1, no desde aquí.',
      '<button class="btn-linea" data-canal-bot="official">Bot de este canal: '
        + (estado.bot_enabled ? 'encendido' : 'apagado') + '</button>')

    + tarjeta('whatsapp_qr', puenteListo ? true : (cuenta('whatsapp_qr') ? false : null),
      puenteListo
        ? 'Segundo número conectado por WhatsApp Web. <b>Era el de pruebas</b>: si ya no se usa, desconéctalo.'
        : 'Sin sesión activa. Este canal usa WhatsApp Web, no el API: no admite plantillas '
          + 'ni difusiones, solo conversación dentro de la ventana normal.',
      bridgeControlsHtml(p))

    + tarjeta('instagram', cuenta('instagram') ? true : null,
      'Se conecta iniciando sesión con Facebook y aceptando los permisos de la cuenta: '
      + '<code>instagram_manage_messages</code> y <code>pages_manage_metadata</code>. '
      + 'La cuenta de Instagram tiene que ser profesional y estar enlazada a la página.',
      '<button class="btn-linea" data-conecta="instagram">Iniciar sesión y dar permisos</button>')

    + tarjeta('facebook', cuenta('facebook') ? true : null,
      'Mismo inicio de sesión que Instagram, con <code>pages_messaging</code>. Al aceptar, la '
      + 'página queda suscrita y sus mensajes entran aquí como una conversación más.',
      '<button class="btn-linea" data-conecta="facebook">Iniciar sesión y dar permisos</button>');

  cont.onclick = async ev => {
    const bot = ev.target.closest('[data-canal-bot]');
    if (bot) {
      // El bot se enciende y se apaga POR CANAL. Antes era un interruptor unico: apagarlo
      // para el segundo numero apagaba tambien el oficial, y al reves.
      const cual = bot.dataset.canalBot;
      const encendido = /encendido/.test(bot.textContent);
      if (!confirm((encendido ? 'Apagar' : 'Encender') + ' el bot SOLO en '
        + (cual === 'official' ? 'WhatsApp oficial' : 'WhatsApp Web') + '.\n\n¿Seguro?')) return;
      bot.disabled = true;
      const r = cual === 'official'
        ? await llama({ action:'setOfficialBot', enabled: !encendido })
        : await llama({ action:'setPhotoBot', enabled: !encendido });
      bot.disabled = false;
      if (!r.ok) return avisa('No se pudo cambiar', r.error);
      avisa('Bot ' + (encendido ? 'apagado' : 'encendido'),
        'Solo en ' + (cual === 'official' ? 'WhatsApp oficial' : 'WhatsApp Web') + '.');
      pintaCanales();
      return;
    }
    if (ev.target.closest('[data-desconecta-puente]')) {
      if (!confirm('Se cerrará la sesión de WhatsApp Web del segundo número.\n\n'
        + 'Los chats que entraron por ahí se conservan, pero dejarás de recibir mensajes nuevos '
        + 'por ese número hasta volver a conectarlo.\n\n¿Desconectar?')) return;
      const r = await llama({ action:'logoutBridge' });
      avisa(r.ok ? 'WhatsApp Web desconectado' : 'No se pudo desconectar', r.ok ? '' : r.error);
      pintaCanales();
      return;
    }
    const red = ev.target.closest('[data-conecta]');
    if (red) {
      // El inicio de sesion de Meta se abre en su propia ventana y devuelve el permiso
      // a la funcion, que es donde vive el App Secret. La clave nunca pasa por aqui: el
      // panel solo abre la ventana y espera a que la funcion diga que quedo conectado.
      const cual = red.dataset.conecta;
      const base = String(CFG.firebaseFunctionsBase || '').replace(/\/$/, '');
      const url = base + '/crmOauth?red=' + encodeURIComponent(cual);
      const w = window.open(url, 'conectar_' + cual, 'width=620,height=740');
      if (!w) return avisa('El navegador bloqueó la ventana', 'Permite las ventanas emergentes para este sitio.');
      avisa('Inicia sesión en la ventana', 'Acepta los permisos y vuelve aquí.');
      // Se refresca al cerrarse la ventana: es cuando el permiso ya esta dado o no.
      const vigila = setInterval(() => {
        if (!w.closed) return;
        clearInterval(vigila);
        pintaCanales();
      }, 1200);
      return;
    }
    if (ev.target.closest('[data-conecta-puente]')) {
      const r = await llama({ action:'requestBridgePairing' });
      if (!r.ok) return avisa('No se pudo pedir el código', r.error);
      abreModal('<div class="mtapa"><b>Conectar WhatsApp Web</b><button class="cerrarm" data-cerrar>×</button></div>'
        + '<div class="mcuerpo"><p class="aviso">En el teléfono del segundo número: '
        + 'WhatsApp → Dispositivos vinculados → Vincular con número de teléfono.</p>'
        + '<div class="codigo">' + esc(r.code || r.pairing_code || '—') + '</div></div>');
      $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });
    }
  };
  renderBridgeControlState(p);
  bindBridgeControls();
}

/* ---- Configuración ------------------------------------------------------- */
// Doce tarjetas, las mismas que tenia el panel anterior. Se releyo su vista de
// configuracion una a una para no dejarse ninguna fuera; la primera version de v2 solo
// enseñaba el rol y el equipo.
//
// Los ajustes viven en la tabla settings del servidor, no en el navegador: son del
// negocio. Si viven en localStorage, cada persona tiene los suyos y el CRM se comporta
// distinto segun quien lo abra.
const AJUSTES = {};

async function cargaAjustes(){
  const r = await llama({ action:'data', table:'settings', operation:'select', limit: 200 });
  if (!r.ok) return false;
  (r.data || r.rows || []).forEach(f => { if (f?.key) AJUSTES[f.key] = f.value; });
  return true;
}
async function guardaAjuste(clave, valor){
  const r = await llama({ action:'data', table:'settings', operation:'upsert',
    payload:{ id: clave, key: clave, value: String(valor), updated_at: new Date().toISOString() },
    on_conflict:'id' });
  if (!r.ok) { avisa('No se pudo guardar', r.error); return false; }
  AJUSTES[clave] = String(valor);
  return true;
}

function tarjetaCfg(titulo, nota, cuerpo){
  return '<div class="cfgc"><h3>' + esc(titulo) + '</h3>'
    + (nota ? '<p class="cfgnota">' + nota + '</p>' : '') + cuerpo + '</div>';
}
// Interruptor con su explicacion al lado. Un interruptor suelto no dice que pasa al
// encenderlo, y estos cambian lo que se le manda a clientes reales.
function interruptorCfg(clave, etiqueta, explica, pordefecto){
  const on = AJUSTES[clave] !== undefined ? AJUSTES[clave] === 'true' : !!pordefecto;

async function pintaUsuarios(esAdmin){
  const cont = $('cfgUsuarios'); if (!cont) return;
  cont.innerHTML = '<p class="cfgnota"><span class="cargando"></span> Cargando…</p>';
  const r = await llama({ action:'panelUsers', operation:'list' });

    cont.innerHTML = '<p class="cfgnota">' + (String(r.error||'').includes('administrador')
      ? 'Solo un administrador puede ver el equipo.' : esc(r.error || 'No se pudo cargar.')) + '</p>';
    return;
  }
  const filas = r.users || r.members || r.data || [];
  if (!filas.length) { cont.innerHTML = '<p class="cfgnota">No hay nadie más.</p>'; return; }
  cont.innerHTML = '<div class="tabla">'
    + '<div class="fila cabecera" style="grid-template-columns:minmax(0,2fr) 1fr auto">'
    +   '<span>Persona</span><span>Rol</span><span>Estado</span></div>'
    + filas.map((x,i) => '<div class="fila" style="grid-template-columns:minmax(0,2fr) 1fr auto">'
      + '<span><b>' + esc(x.display_name || x.email || '—') + '</b><small>' + esc(x.email || '') + '</small></span>'
      + '<span>' + (esAdmin
          ? '<select data-rol="' + esc(x.uid || x.id || '') + '">'
            + ['agent','supervisor','admin'].map(rr => '<option value="' + rr + '"'
              + (x.role === rr ? ' selected' : '') + '>' + rr + '</option>').join('') + '</select>'
          : esc(x.role || '—')) + '</span>'
      + '<span><button class="interruptor' + (x.active === false ? '' : ' on') + '"'
      +   (esAdmin ? ' data-activo="' + esc(x.uid || x.id || '') + '"' : ' disabled')
      +   '>' + (x.active === false ? 'inactivo' : 'activo') + '</button></span></div>').join('')
    + '</div>';

  if (!esAdmin) return;
  cont.onchange = async ev => {
    const s = ev.target.closest('[data-rol]'); if (!s) return;
    const r2 = await llama({ action:'panelUsers', operation:'update', user_id:s.dataset.rol, role:s.value });
    avisa(r2.ok ? 'Rol cambiado' : 'No se pudo cambiar', r2.ok ? s.value : r2.error);
  };

    const b = ev.target.closest('[data-activo]'); if (!b) return;
    const activar = !b.classList.contains('on');
    // Desactivar a alguien le corta tambien los envios y las automatizaciones, no solo
    // la pantalla. Por eso se pregunta.
    if (!activar && !confirm('Se desactiva la cuenta. Dejará de poder entrar, enviar y difundir.\n\n¿Seguro?')) return;

    if (!r2.ok) return avisa('No se pudo cambiar', r2.error);

  };

function cableaUsuarios(){
  const b = $('uAdd'); if (!b) return;
  b.onclick = async () => {
    const email = $('uEmail').value.trim();
    const clave = $('uClave').value;
    if (!email || !clave) return avisa('Faltan el correo o la contraseña temporal');
    if (clave.length < 8) return avisa('Contraseña demasiado corta', 'Ocho caracteres como mínimo.');
    b.disabled = true;
    const r = await llama({ action:'panelUsers', operation:'create', email,
      display_name: $('uNombre').value.trim(), role: $('uRol').value, temporary_password: clave });
    b.disabled = false;
    if (!r.ok) return avisa('No se pudo crear', r.error);
    $('uEmail').value = ''; $('uNombre').value = ''; $('uClave').value = '';
    avisa('Cuenta creada', 'Dile que cambie la contraseña al entrar.');
    pintaUsuarios(true);
  };

// Arrastrar una tarjeta cambia la etapa del lead de verdad. Por eso la tarjeta vuelve
// a su sitio si el servidor rechaza el cambio: dejarla en la columna nueva la haria
// mentir hasta el siguiente refresco, y quien la movio se iria creyendo que se guardo.
function montaFunnel(){
  if (!montadas.has('funnel')) {
    montadas.add('funnel');

      + '<div class="seccion" style="margin:30px 0 4px">Leads parados</div>'
      + '<p class="bajada">Por qué no avanzan y qué hacer con cada uno. Nada se mueve solo: '
      +   'cambiar de etapa cambia lo que el sistema le mandará después.</p>'
      + '<div id="movil"></div></div>');
  }
  pintaKanban();
  pintaMovilizacion();
}

function pintaKanban(){
  const cont = $('kanban'); if (!cont) return;
  cont.innerHTML = ETAPAS.map(e => {
    const filas = CONVS.filter(c => (c.lifecycle_stage || 'nuevo') === e);
    return '<div class="columna" data-etapa="' + e + '">'
      + '<div class="ctitulo">' + esc(e.replace(/_/g,' ')) + '<b>' + filas.length + '</b></div>'
      + '<div class="ccuerpo">'
      + filas.slice(0, 60).map(c => '<div class="ktarjeta" draggable="true" data-conv="' + esc(c._id) + '">'
          + '<b>' + esc(nombreDe(c)) + '</b>'
          + '<span>' + esc(c.last_message_preview || '') + '</span>'
          + '<i>' + esc(hora(c.last_message_at)) + (c.interested_category ? ' · ' + esc(c.interested_category) : '') + '</i>'
        + '</div>').join('')
      + (filas.length > 60 ? '<div class="kmas">… y ' + (filas.length - 60) + ' más</div>' : '')
      + '</div></div>';
  }).join('');

  let arrastrando = null;
  cont.querySelectorAll('.ktarjeta').forEach(t => {
    t.addEventListener('dragstart', ev => {
      arrastrando = t;
      t.classList.add('moviendo');
      // Firefox no inicia el arrastre sin datos en el portapapeles del evento.
      ev.dataTransfer.setData('text/plain', t.dataset.conv);
      ev.dataTransfer.effectAllowed = 'move';
    });
    t.addEventListener('dragend', () => { t.classList.remove('moviendo'); arrastrando = null;
      cont.querySelectorAll('.columna').forEach(c => c.classList.remove('encima')); });
  });
  cont.querySelectorAll('.columna').forEach(col => {
    col.addEventListener('dragover', ev => { ev.preventDefault(); col.classList.add('encima'); });
    col.addEventListener('dragleave', () => col.classList.remove('encima'));
    col.addEventListener('drop', async ev => {
      ev.preventDefault();
      col.classList.remove('encima');
      const id = ev.dataTransfer.getData('text/plain') || arrastrando?.dataset.conv;
      const c = CONVS.find(x => x._id === id);
      const etapa = col.dataset.etapa;
      if (!c || (c.lifecycle_stage || 'nuevo') === etapa) return;
      const anterior = c.lifecycle_stage;
      c.lifecycle_stage = etapa;      // se mueve ya, para que se sienta inmediato
      pintaKanban();
      const r = await llama({ action:'updateLead', conversation_id: c.id || c._id,
        fields:{ lifecycle_stage: etapa } });
      if (!r.ok) {
        c.lifecycle_stage = anterior; // y vuelve si el servidor dijo que no
        pintaKanban();
        return avisa('No se pudo mover', r.error);
      }
      avisa(nombreDe(c), 'ahora está en ' + etapa.replace(/_/g,' '));
      pintaChats();
    });
  });
}

// --- Piezas de dibujo -------------------------------------------------------
function grafArea(puntos, etiquetas){
  const an = 640, al = 170, pad = { i:34, d:10, s:14, b:24 };
  const max = Math.max(1, ...puntos);
  const x = i => pad.i + i * (an - pad.i - pad.d) / Math.max(1, puntos.length - 1);
  const y = v => pad.s + (1 - v / max) * (al - pad.s - pad.b);
  const linea = puntos.map((v,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const area = linea + ' L' + x(puntos.length-1).toFixed(1) + ' ' + (al-pad.b) + ' L' + x(0) + ' ' + (al-pad.b) + ' Z';
  // Tres lineas de referencia, no diez: mas rayas no ayudan a leer, estorban.
  const guias = [0, .5, 1].map(p => {
    const v = Math.round(max * p);
    return '<line x1="' + pad.i + '" x2="' + (an-pad.d) + '" y1="' + y(v) + '" y2="' + y(v) + '" class="gguia"/>'
      + '<text x="' + (pad.i-7) + '" y="' + (y(v)+3.5) + '" class="gnum" text-anchor="end">' + v + '</text>';
  }).join('');
  const marcas = puntos.map((v,i) => (i % 3 === 0 || i === puntos.length-1)
    ? '<text x="' + x(i) + '" y="' + (al-7) + '" class="gnum" text-anchor="middle">' + esc(etiquetas[i]) + '</text>' : '').join('');
  const picos = puntos.map((v,i) => '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="2.5" class="gpunto">'
    + '<title>' + esc(etiquetas[i]) + ': ' + v + '</title></circle>').join('');
  return '<svg viewBox="0 0 ' + an + ' ' + al + '" class="graf" preserveAspectRatio="none">'
    + guias + '<path d="' + area + '" class="garea"/><path d="' + linea + '" class="glinea"/>'
    + picos + marcas + '</svg>';
}

function grafBarras(filas){
  const max = Math.max(1, ...filas.map(f => f.v));
  return '<div class="barras">' + filas.map(f =>
    '<div class="barra"><span class="be">' + esc(f.n) + '</span>'
    + '<span class="bp"><i style="width:' + Math.round(f.v / max * 100) + '%"></i></span>'
    + '<span class="bn">' + f.v + '</span></div>').join('') + '</div>';
}

function grafAnillo(filas){
  const total = filas.reduce((a,f) => a + f.v, 0) || 1;
  const R = 54, C = 2 * Math.PI * R;
  let acumulado = 0;
  const arcos = filas.filter(f => f.v).map(f => {
    const trozo = f.v / total * C;
    const el = '<circle cx="70" cy="70" r="' + R + '" class="ganillo" stroke="' + f.c + '" '
      + 'stroke-dasharray="' + trozo.toFixed(2) + ' ' + (C - trozo).toFixed(2) + '" '
      + 'stroke-dashoffset="' + (-acumulado).toFixed(2) + '"><title>' + esc(f.n) + ': ' + f.v + '</title></circle>';
    acumulado += trozo;
    return el;
  }).join('');
  return '<div class="anillo"><svg viewBox="0 0 140 140">' + arcos
    + '<text x="70" y="66" class="gtot" text-anchor="middle">' + total + '</text>'
    + '<text x="70" y="84" class="gnum" text-anchor="middle">total</text></svg>'
    + '<div class="leyenda">' + filas.filter(f => f.v).map(f =>
        '<span><i style="background:' + f.c + '"></i>' + esc(f.n) + ' <b>' + f.v + '</b></span>').join('')
    + '</div></div>';
}

function pintaDashboard(){
  const c = $('cifras'); if (!c) return;
  const hoy = new Date().toDateString();
  const sinLeer = CONVS.filter(x => Number(x.unread||0) > 0).length;
  const humano = CONVS.filter(x => x.mode === 'human' || x.human_handoff_required).length;
  const deHoy = CONVS.filter(x => new Date(x.last_message_at || 0).toDateString() === hoy).length;
  const clientes = CONVS.filter(x => x.lifecycle_stage === 'cliente').length;
  const desint = CONVS.filter(x => x.lifecycle_stage === 'desinteresado').length;
  const excluidos = CONVS.filter(x => x.proactive_blocked_at).length;
  const vencidos = CONVS.filter(x => x.follow_up_at && new Date(x.follow_up_at) <= new Date()
    && !['cerrado','perdido','desinteresado'].includes(x.lifecycle_stage)).length;

  // Las cifras que piden accion se marcan; el resto es contexto. Si todo grita, nada grita.
  const cifra = (n, t, nota, tono) => '<button class="cifra' + (tono ? ' ' + tono : '')
    + '" data-ir="' + esc(t) + '"><b>' + n + '</b><span>' + esc(t) + '</span>'
    + (nota ? '<i>' + esc(nota) + '</i>' : '') + '</button>';

  // Los dormidos se cuentan aparte. Meterlos en "Conversaciones" infla el numero con
  // gente que lleva meses sin escribir y hace parecer que hay mas trabajo del que hay.
  const dormidos = CONVS.filter(enElOlvido).length;
  const vivas = CONVS.length - dormidos;

  c.innerHTML = cifra(vivas, 'Conversaciones', dormidos ? dormidos + ' dormidas aparte' : 'en total')
    + cifra(sinLeer, 'Sin leer', sinLeer ? 'esperando respuesta' : 'al día', sinLeer ? 'ojo' : '')
    + cifra(vencidos, 'Seguimientos vencidos', vencidos ? 'ya tocaba' : 'ninguno', vencidos ? 'mal' : '')
    + cifra(humano, 'Esperando a una persona')
    + cifra(deHoy, 'Activas hoy')
    + cifra(clientes, 'Clientes', 'ya compraron', clientes ? 'bien' : '')
    + cifra(desint + excluidos, 'Fuera de marketing', desint + ' desinteresados · ' + excluidos + ' excluidos')
    + cifra(dormidos, 'Dormidos', dormidos ? 'más de ' + DIAS_INACTIVO + ' días · pendientes de limpiar' : 'ninguno',
        dormidos ? 'ojo' : '');

  // Pulsar una cifra lleva a verla, no solo la enseña. Un numero sin a donde ir obliga
  // a rehacer el filtro a mano en la otra pantalla.
  c.onclick = ev => {
    const b = ev.target.closest('[data-ir]'); if (!b) return;
    const a = b.dataset.ir;
    if (a === 'Seguimientos vencidos') return ve('reminders');
    if (a === 'Clientes') { filtro = 'todos'; ve('funnel'); return; }
    if (a === 'Sin leer') { filtro = 'sinleer'; ve('conversations'); pintaChats(); return; }
    if (a === 'Esperando a una persona') { filtro = 'humano'; ve('conversations'); pintaChats(); return; }
    if (a === 'Dormidos') return ve('limpieza');
    ve('conversations');
  };

  // --- Actividad de los ultimos 14 dias
  const dias = [], etiq = [];
  for (let i = 13; i >= 0; i--) {
    const d = diasAtras(i), sig = diasAtras(i-1);
    dias.push(CONVS.filter(x => {
      const t = new Date(x.last_message_at || 0);
      return t >= d && t < sig;
    }).length);
    etiq.push(d.getDate() + '/' + (d.getMonth()+1));
  }

  const porEtapa = ETAPAS.map(e => ({ n: e.replace(/_/g,' '),
    v: CONVS.filter(x => (x.lifecycle_stage || 'nuevo') === e).length }));

  const porCanal = Object.keys(CANALES)
    .map(k => ({ n: CANALES[k].corto, v: CONVS.filter(x => canalDe(x) === k).length, c: CANALES[k].color }))
    .filter(f => f.v);

  // Embudo: cada etapa como porcentaje de las que llegaron a la anterior. Es la unica
  // cifra que dice DONDE se pierde la gente, que es lo que se quiere arreglar.
  const orden = ['nuevo','interesado','cotizando','pendiente_reserva','reservado','cliente'];
  const cuentaEtapa = e => CONVS.filter(x => (x.lifecycle_stage || 'nuevo') === e).length;
  const acumulado = orden.map((e,i) => orden.slice(i).reduce((a,x) => a + cuentaEtapa(x), 0));
  const embudo = orden.map((e,i) => {
    const de = acumulado[i], antes = i ? acumulado[i-1] : de;
    return { n: e.replace(/_/g,' '), v: de, pct: antes ? Math.round(de / antes * 100) : 100 };
  });

  $('tablero').innerHTML =
    panel('Actividad', 'últimos 14 días', grafArea(dias, etiq))
    + panel('Por etapa', CONVS.length + ' contactos', grafBarras(porEtapa))
    + panel('Por canal', 'de dónde escriben', grafAnillo(porCanal))
    + panel('Embudo', 'cuánta gente pasa de una etapa a la siguiente',
        '<div class="embudo">' + embudo.map((f,i) =>
          '<div class="epaso"><span class="en">' + esc(f.n) + '</span>'
          + '<span class="eb"><i style="width:' + (embudo[0].v ? Math.round(f.v / embudo[0].v * 100) : 0) + '%"></i></span>'
          + '<span class="ev">' + f.v + (i ? ' <em>' + f.pct + '%</em>' : '') + '</span></div>').join('')
        + '</div>');
}


/* ---- Movilización de leads ----------------------------------------------- */
// Un lead se queda parado por razones concretas y casi siempre las mismas. Esto las
// detecta y dice QUE hacer, con el boton al lado. No mueve nada solo: mover a alguien
// de etapa cambia lo que el sistema le va a mandar despues.
const REGLAS_LEAD = [
  {
    id: 'sin_categoria',
    aplica: c => ['nuevo','interesado'].includes(c.lifecycle_stage) && !c.interested_category,
    titulo: 'No sabemos qué quiere',
    porque: 'Está interesado pero no hay categoría. Sin eso no se le puede mandar el combo correcto '
      + 'ni entrar en ninguna campaña segmentada.',
    hacer: 'Preguntar categoría',
    prompt: 'Este contacto no tiene categoría. Redacta un mensaje corto y natural para averiguar '
      + 'qué tipo de sesión quiere, sin que parezca un formulario.',
  },
  {
    id: 'cotiza_sin_fecha',
    aplica: c => ['interesado','cotizando'].includes(c.lifecycle_stage) && !c.tentative_date,
    titulo: 'Cotiza pero no pone fecha',
    porque: 'Sin fecha tentativa no se puede confirmar disponibilidad, y es donde más se cae la venta.',
    hacer: 'Pedir fecha',
    etapa: 'cotizando',
    siguiente: 'Conseguir una fecha tentativa para verificar disponibilidad.',
    prompt: 'Este contacto está cotizando pero no ha dado fecha. Redacta un mensaje que le pida una '
      + 'fecha tentativa dándole una razón para darla (disponibilidad limitada, sin presionar).',
  },
  {
    id: 'fecha_sin_reserva',
    aplica: c => c.tentative_date && !['reservado','cliente'].includes(c.lifecycle_stage)
      && c.reservation_status !== 'confirmado',
    titulo: 'Tiene fecha pero no ha reservado',
    porque: 'Ya eligió cuándo. Lo único que falta es el abono, y esta es la etapa que más se enfría.',
    hacer: 'Pedir el abono',
    etapa: 'pendiente_reserva',
    siguiente: 'Enviar las condiciones del abono y esperar comprobante.',
    prompt: 'Este contacto ya tiene fecha tentativa pero no ha reservado. Prepara la reserva y '
      + 'redacta el mensaje del abono con las condiciones de las reglas del negocio.',
  },
  {
    id: 'nos_toca',
    aplica: c => c.lead_status === 'esperando_nosotros' || (c.human_handoff_required && Number(c.unread||0) > 0),
    titulo: 'La pelota está de nuestro lado',
    porque: 'Escribió y sigue esperando respuesta. Cada hora que pasa se enfría.',
    hacer: 'Abrir el chat',
    prompt: '',
  },
  {
    id: 'reservado_sin_agenda',
    aplica: c => c.lifecycle_stage === 'reservado' && !c.scheduled_at,
    titulo: 'Reservado pero sin hora en agenda',
    porque: 'Pagó y no está agendado. Es el fallo más caro: el cliente aparece y no hay nadie.',
    hacer: 'Agendar',
    prompt: 'Este contacto ya reservó pero no tiene sesión agendada. Redacta el mensaje para cerrar '
      + 'día y hora concretos.',
  },
];

function leadsParados(){
  const vivos = CONVS.filter(c => !enElOlvido(c)
    && !['cliente','perdido','desinteresado'].includes(c.lifecycle_stage)
    && !c.proactive_blocked_at);
  return REGLAS_LEAD.map(r => ({ regla: r, filas: vivos.filter(r.aplica) })).filter(x => x.filas.length);
}

function pintaMovilizacion(){
  const cont = $('movil'); if (!cont) return;
  const grupos = leadsParados();
  if (!grupos.length) {
    cont.innerHTML = '<p class="bajada">Ningún lead está parado por las razones habituales. '
      + 'Todos tienen categoría, fecha y el siguiente paso claro.</p>';
    return;
  }
  cont.innerHTML = grupos.map(g =>
    '<div class="pgraf" style="margin-bottom:14px"><div class="pgcab">'
    + '<b>' + esc(g.regla.titulo) + '</b><span>' + g.filas.length + ' contacto(s)</span></div>'
    + '<p class="cfgnota">' + esc(g.regla.porque) + '</p>'
    + '<div class="tabla" style="max-width:none">'
    + g.filas.slice(0, 25).map(c => '<div class="fila" style="grid-template-columns:minmax(0,2fr) 1fr auto">'
      + '<span><b>' + esc(nombreDe(c)) + '</b><small>' + esc((c.lifecycle_stage||'nuevo').replace(/_/g,' '))
      +   ' · ' + llevaDormido(c) + ' días</small></span>'
      + '<span>' + esc(c.interested_category || '—') + '</span>'
      + '<span><button class="btn-linea" data-mov="' + esc(g.regla.id) + '" data-conv="' + esc(c._id || c.id) + '">'
      +   esc(g.regla.hacer) + '</button>'
      + (g.regla.etapa && c.lifecycle_stage !== g.regla.etapa
        ? '<button class="btn-linea" style="margin-left:6px" data-avanza="' + esc(g.regla.id)
          + '" data-conv="' + esc(c._id || c.id) + '">Avanzar a ' + esc(g.regla.etapa.replace(/_/g,' ')) + '</button>' : '')
      + '</span></div>').join('')
    + '</div>'
    + (g.filas.length > 25 ? '<p class="cfgnota" style="margin-top:8px">y ' + (g.filas.length-25) + ' más</p>' : '')
    + '</div>').join('');

  cont.onclick = async ev => {
    const avanzar = ev.target.closest('[data-avanza]');
    if (avanzar) {
      const c = CONVS.find(x => String(x._id || x.id) === avanzar.dataset.conv);
      const r = REGLAS_LEAD.find(x => x.id === avanzar.dataset.avanza);
      if (!c || !r?.etapa) return;
      if (!confirm('Mover a ' + nombreDe(c) + ' de «' + (c.lifecycle_stage || 'nuevo').replace(/_/g,' ')
        + '» a «' + r.etapa.replace(/_/g,' ') + '».\n\nCriterio: ' + r.porque + '\n\n'
        + 'No se enviará ningún mensaje automáticamente.')) return;
      avanzar.disabled = true;
      const campos = { lifecycle_stage:r.etapa, next_step_suggested:r.siguiente || r.porque };
      const respuesta = await llama({ action:'updateLead', conversation_id:c.id || c._id, fields:campos });
      avanzar.disabled = false;
      if (!respuesta.ok) return avisa('No se pudo avanzar', respuesta.error);
      Object.assign(c, campos);
      avisa('Lead avanzado', 'El siguiente paso quedó documentado; no se envió ningún mensaje.');
      pintaMovilizacion(); pintaChats();
      return;
    }
    const b = ev.target.closest('[data-mov]'); if (!b) return;
    const c = CONVS.find(x => String(x._id || x.id) === b.dataset.conv);
    const r = REGLAS_LEAD.find(x => x.id === b.dataset.mov);
    if (!c) return;
    // Se abre la conversacion SIEMPRE, aunque haya prompt: hay que ver con quien se
    // habla antes de mandarle nada.
    abre(c);
    ve('conversations');
    if (!r?.prompt) return;
    // Y el prompt se deja preparado en el asistente, no se ejecuta solo.
    setTimeout(() => {
      ve('planning');
      const caja = $('pedido');
      if (caja) { caja.value = r.prompt; caja.dispatchEvent(new Event('input')); caja.focus(); }
    }, 250);
  };
}

/* ---- Limpieza del histórico ---------------------------------------------- */
// El dueño lo dijo claro: los que escribieron al WhatsApp API llevan MESES sin
// interes, no deben contar para nada hasta que demuestren lo contrario, y se les hace
// UN acercamiento -- uno, no una secuencia -- programado para mañana. Si no responden,
// desinteresados.
//
// Dos decisiones deliberadas:
//   · Se excluye el canal de WhatsApp Web, como pidio. Ese numero tiene otra historia.
//   · Nada sale hoy. Se programa. Doscientos mensajes de golpe a gente dormida hace
//     meses es exactamente el patron que hace que Meta degrade el numero.
const DIAS_INACTIVO = 60;

function llevaDormido(c){
  const t = Date.parse(String(c.last_message_at || '')) || 0;
  return t ? Math.floor((Date.now() - t) / 86400000) : 9999;
}
// Un contacto "en el olvido" no cuenta para las metricas del dia a dia. No es lo mismo
// que desinteresado: a este todavia no se le ha preguntado.
function enElOlvido(c){
  if (['cliente','reservado','desinteresado','perdido'].includes(c.lifecycle_stage)) return false;
  if (c.proactive_blocked_at) return false;
  if (canalDe(c) === 'whatsapp_qr') return false;      // el segundo numero queda fuera
  return llevaDormido(c) >= DIAS_INACTIVO;
}

function montaLimpieza(){
  if (!montadas.has('limpieza')) {
    montadas.add('limpieza');
    hueco('limpieza', '<div class="hoja"><h1>Limpieza del histórico</h1>'
      + '<p class="bajada">Contactos que llevan más de ' + DIAS_INACTIVO + ' días sin escribir. '
      +   'Se les hace <b>un solo acercamiento</b>, personalizado y <b>programado para mañana</b>. '
      +   'Quien ya recibió dos seguimientos sin contestar pasa directo a desinteresado. '
      +   'El segundo número queda fuera.</p>'
      + '<div id="limpiezaCuerpo"></div></div>');
  }
  pintaLimpieza();
}

function pintaLimpieza(){
  const cont = $('limpiezaCuerpo'); if (!cont) return;
  const olvidados = CONVS.filter(enElOlvido);
  // Los que ya se cansaron de no recibir respuesta no merecen otro intento: la norma de
  // los dos seguimientos ya dijo que no.
  const aDescartar = olvidados.filter(c => Number(c.followup_attempts || 0) >= 2);
  const aTocar = olvidados.filter(c => Number(c.followup_attempts || 0) < 2);

  if (!olvidados.length) {
    cont.innerHTML = '<p class="bajada">No hay ningún contacto dormido más de '
      + DIAS_INACTIVO + ' días. Nada que limpiar.</p>';
    return;
  }

  cont.innerHTML = '<div class="cifras" style="max-width:760px">'
    + '<div class="cifra"><b>' + olvidados.length + '</b><span>dormidos</span>'
    +   '<i>más de ' + DIAS_INACTIVO + ' días</i></div>'
    + '<div class="cifra"><b>' + aTocar.length + '</b><span>merecen un intento</span>'
    +   '<i>se programa para mañana</i></div>'
    + '<div class="cifra mal"><b>' + aDescartar.length + '</b><span>ya se les insistió dos veces</span>'
    +   '<i>pasan a desinteresados</i></div></div>'

    + '<div class="acciones" style="margin:18px 0">'
    +   (aTocar.length ? '<button class="btn-solido" id="limProgramar">Programar ' + aTocar.length
        + ' acercamiento(s) para mañana</button>' : '')
    +   (aDescartar.length ? '<button class="btn-linea" id="limDescartar">Marcar ' + aDescartar.length
        + ' como desinteresados</button>' : '')
    + '</div>'

    + '<div class="campo" style="max-width:760px"><label>Mensaje base (se personaliza por contacto)</label>'
    +   '<textarea id="limTexto" rows="3">¿Sigues interesada en tu sesión de fotos? '
    +   'Si quieres retomarlo dime y te ayudo; si no, no te escribo más.</textarea>'
    +   '<p class="aviso" style="margin:6px 0 0">Se le antepone su nombre y se le añade la salida. '
    +     'Si han pasado más de 24 h desde su último mensaje, solo llegará con plantilla aprobada: '
    +     'el envío lo dirá al intentarlo mañana.</p></div>'

    + '<div class="seccion" style="margin:22px 0 8px">A quién le tocaría</div>'
    + '<div class="tabla" style="max-width:900px">'
    + '<div class="fila cabecera"><span>Contacto</span><span>Dormido</span><span>Etapa</span><span>Qué se hace</span></div>'
    + olvidados.slice(0, 200).map(c => {
        const desc = Number(c.followup_attempts || 0) >= 2;
        return '<div class="fila"><span><b>' + esc(nombreDe(c)) + '</b><small>+'
          + esc(c.wa_phone || '') + '</small></span>'
          + '<span>' + llevaDormido(c) + ' días</span>'
          + '<span>' + esc((c.lifecycle_stage || 'nuevo').replace(/_/g,' ')) + '</span>'
          + '<span><i class="chip ' + (desc ? 'mal' : 'medio') + '">'
          + (desc ? 'desinteresado' : 'un acercamiento') + '</i></span></div>';
      }).join('')
    + '</div>'
    + (olvidados.length > 200 ? '<p class="bajada" style="margin-top:10px">Se listan los primeros 200 de '
        + olvidados.length + '; la acción se aplica a todos.</p>' : '');

  if (aTocar.length) $('limProgramar').onclick = () => programaAcercamiento(aTocar);
  if (aDescartar.length) $('limDescartar').onclick = () => descartaOlvidados(aDescartar);
}

async function programaAcercamiento(lista){
  const base = $('limTexto').value.trim();
  if (!base) return avisa('Escribe el mensaje base');
  const mañana = new Date(); mañana.setDate(mañana.getDate() + 1); mañana.setHours(10, 0, 0, 0);
  if (!confirm('Se programa UN acercamiento para ' + lista.length + ' contactos, mañana a las 10:00.\n\n'
    + 'No sale nada hoy. Cada mensaje va personalizado y aparecerá en Recordatorios para '
    + 'revisarlo antes de enviarlo.\n\n¿Continuar?')) return;
  const b = $('limProgramar');
  b.disabled = true;
  let hechos = 0; const fallos = [];
  for (const c of lista) {
    b.textContent = 'Programando ' + (hechos + 1) + ' de ' + lista.length + '…';
    const r = await llama({ action:'updateLead', conversation_id: c.id || c._id, fields:{
      follow_up_at: mañana.toISOString(),
      pending_questions: personaliza(base, c),
      next_step_suggested: 'Último acercamiento antes de darlo por desinteresado.',
    }});
    if (r.ok) { hechos++; Object.assign(c, { follow_up_at: mañana.toISOString() }); }
    else fallos.push(nombreDe(c) + ': ' + r.error);
  }
  b.disabled = false;
  avisa('Programados ' + hechos + ' de ' + lista.length,
    fallos.length ? fallos.slice(0,2).join(' · ') : 'Mañana a las 10:00, en Recordatorios.');
  pintaLimpieza();
}

async function descartaOlvidados(lista){
  if (!confirm('Se marcan ' + lista.length + ' contactos como desinteresados.\n\n'
    + 'Ya recibieron dos seguimientos sin contestar. Dejan de recibir marketing y '
    + 'seguimientos, y dejan de contar en las métricas. Pueden seguir escribiendo.\n\n'
    + '¿Continuar?')) return;
  const b = $('limDescartar');
  b.disabled = true;
  let hechos = 0;
  for (const c of lista) {
    b.textContent = 'Marcando ' + (hechos + 1) + ' de ' + lista.length + '…';
    const r = await llama({ action:'disinterest', operation:'mark', conversation_id: c.id || c._id,
      reason: 'sin respuesta tras dos seguimientos, más de ' + DIAS_INACTIVO + ' días dormido' });
    if (r.ok) { hechos++; c.lifecycle_stage = 'desinteresado'; }
  }
  b.disabled = false;
  avisa('Marcados ' + hechos + ' de ' + lista.length, 'Ya no cuentan en las métricas.');
  pintaLimpieza();
  pintaChats();
}

/* ---- Broadcast ----------------------------------------------------------- */
// Enviar a mucha gente a la vez es lo mas facil de arruinar de todo el CRM. Por eso
// aqui no hay boton de "enviar" directo: primero se simula (dry) y se ve la lista de
// personas por nombre y telefono, y solo despues se confirma sobre ESOS ids. El
// servidor tambien exige que una plantilla de difusion incluya salida de baja: sin
// eso Meta degrada la calidad del numero, y esa penalizacion tarda semanas en irse.
let AUDIENCIA = null;

function montaBroadcast(){
  if (montadas.has('campanas')) return;
  montadas.add('campanas');
  hueco('campanas',
    '<div class="hoja"><h1>Campañas</h1>'
    + '<p class="bajada">Escribe una vez y sale a muchos. Primero se simula: verás exactamente '
    +   'a quién le llegaría antes de que salga nada.</p>'
    + '<div class="prompt">'
    +   '<div class="par">'
    +     '<div class="campo"><label>Tipo de envío</label><select id="bcModo">'
    +       '<option value="freeform">Mensaje libre (solo a quien escribió en las últimas 24 h)</option>'
    +       '<option value="template">Plantilla aprobada (llega aunque lleve días callado)</option>'
    +     '</select></div>'
    +     '<div class="campo"><label>Propósito</label><select id="bcProposito">'
    +       '<option value="marketing">Marketing</option>'
    +       '<option value="followup">Seguimiento</option>'
    +       '<option value="session_reminder">Recordatorio de sesión</option>'
    +     '</select></div>'
    +   '</div>'
    +   '<div id="bcLibre">'
    +     '<div class="campo"><label>Mensaje</label>'
    +       '<textarea id="bcTexto" rows="4" placeholder="Lo que le llegará a cada contacto"></textarea></div>'
    +   '</div>'
    +   '<div id="bcPlantilla" hidden><div class="campo"><label>Plantilla</label>'
    +     '<select id="bcTpl"></select></div>'
    +     '<p class="aviso" id="bcTplAviso"></p></div>'
    +   '<div class="par">'
    +     '<div class="campo"><label>Etapa (opcional)</label><select id="bcEtapa">'
    +       '<option value="">Todas</option>' + ETAPAS.map(e => '<option value="' + e + '">' + e.replace(/_/g,' ') + '</option>').join('')
    +     '</select></div>'
    +     '<div class="campo"><label>Categoría (opcional)</label>'
    +       '<input id="bcCategoria" placeholder="xv, boda, infantil…"></div>'
    +   '</div>'
    +   '<div class="acciones"><button class="btn-solido" id="bcSimular">Simular envío</button></div>'
    + '</div><div id="bcSalida"></div></div>');

  $('bcModo').onchange = async () => {
    const plantilla = $('bcModo').value === 'template';
    $('bcLibre').hidden = plantilla;
    $('bcPlantilla').hidden = !plantilla;
    AUDIENCIA = null; $('bcSalida').innerHTML = '';
    if (plantilla) await llenaPlantillasBc();
  };
  $('bcSimular').onclick = simulaBroadcast;
}

async function llenaPlantillasBc(){
  const sel2 = $('bcTpl');
  sel2.innerHTML = '<option>Cargando…</option>';
  const lista = await cargaPlantillas(false) || [];
  // Solo las que Meta aprobo Y que llevan salida de baja: el servidor rechaza el resto,
  // y es mejor no ofrecerlas que dejar que el operador elija una que sera rechazada.
  const validas = lista.filter(t => String(t.meta_status||'').toUpperCase() === 'APPROVED'
    && t.contains_opt_out === true && t.active !== false);
  if (!validas.length) {
    sel2.innerHTML = '<option value="">— ninguna disponible —</option>';
    $('bcTplAviso').textContent = 'No hay ninguna plantilla aprobada que incluya opción de baja (STOP). '
      + 'Meta degrada la calidad del número si se difunde sin ella, así que el servidor lo rechaza. '
      + 'Añade la línea de baja a la plantilla en Meta y vuelve a sincronizar.';
    return;
  }
  sel2.innerHTML = validas.map((t,i) =>
    '<option value="' + i + '">' + esc(t.display_name || t.template_name) + '</option>').join('');
  sel2._validas = validas;
  $('bcTplAviso').textContent = validas.length + ' plantilla(s) aptas para difusión.';
}

function filtroBc(){
  const f = {};
  if ($('bcEtapa').value) f.lifecycle_stage = $('bcEtapa').value;
  if ($('bcCategoria').value.trim()) f.interested_category = $('bcCategoria').value.trim();
  return f;
}
function cuerpoBc(dry){
  const modo = $('bcModo').value;
  const c = { action:'broadcast', send_mode:modo, purpose:$('bcProposito').value,
    filter:filtroBc(), dry };
  if (modo === 'freeform') c.text = $('bcTexto').value.trim();
  else {
    const v = $('bcTpl')._validas || [];
    const t = v[Number($('bcTpl').value)];
    if (!t) return null;
    c.template = { name:t.template_name, language_code:t.language_code || 'es',
      contains_opt_out:true, parameter_keys:t.parameter_keys || [] };
  }
  return c;
}

async function simulaBroadcast(){
  const cuerpo = cuerpoBc(true);
  if (!cuerpo) return avisa('Elige una plantilla');
  if (cuerpo.send_mode === 'freeform' && !cuerpo.text) return avisa('Escribe el mensaje');
  $('bcSimular').disabled = true;
  $('bcSalida').innerHTML = '<p class="bajada"><span class="cargando"></span> Calculando audiencia…</p>';
  const r = await llama(cuerpo);
  $('bcSimular').disabled = false;
  if (!r.ok) { $('bcSalida').innerHTML = ''; return avisa('No se pudo simular', r.error); }
  AUDIENCIA = r;
  const destinos = r.targets || r.sample || [];
  $('bcSalida').innerHTML = '<div class="propuesta">'
    + '<div class="tapa"><b>' + Number(r.found || 0) + ' contactos recibirían este mensaje</b></div>'
    + '<div class="cuerpo">'
    +   '<div class="cambio"><div class="k">Revisados</div>' + Number(r.scanned || 0) + '</div>'
    +   '<div class="cambio"><div class="k">Excluidos por baja o permiso</div>' + Number(r.skippedOptOut || 0) + '</div>'
    +   (destinos.length
        ? '<div class="cambio"><div class="k">A quién le llega</div><div class="destinos">'

          + (destinos.length > 60 ? '<span>… y ' + (destinos.length - 60) + ' más</span>' : '')
          + '</div></div>'
        : '<p class="aviso" style="margin:0">Nadie cumple estos filtros. Con «mensaje libre» solo entran '
          + 'quienes escribieron en las últimas 24 horas.</p>')
    + '</div>'
    + (Number(r.found || 0) > 0
      ? '<div class="patas"><button class="btn-solido" id="bcEnviar">Enviar a ' + Number(r.found) + '</button>'

      : '')
    + '</div>';
  if (Number(r.found || 0) > 0) {
    $('bcCancelar').onclick = () => { AUDIENCIA = null; $('bcSalida').innerHTML = ''; };
    $('bcEnviar').onclick = enviaBroadcast;
  }
}

// ===== ANTI-BLOQUEO =====
// Esto no es prudencia excesiva. Cuando Meta degrada la calidad de un numero, la
// penalizacion tarda SEMANAS en irse y no hay a quien reclamar: el negocio se queda sin
// su via principal de venta. Las cuatro cosas que mas la disparan son mandar el mismo
// texto a mucha gente, mandar mucho de golpe, mandar a horas raras, y seguir mandando
// cuando ya empezaron a fallar los envios.
const ANTIBLOQUEO = {
  topeDiario: 250,        // por encima de esto un numero nuevo empieza a marcarse
  porMinuto: 12,          // ritmo humano, no rafaga
  horaDesde: 8,           // no se escribe de madrugada: molesta y se reporta
  horaHasta: 21,
  fallosSeguidosParaCortar: 5,
};

function ventanaHorariaOk(){
  const h = new Date().getHours();
  return h >= ANTIBLOQUEO.horaDesde && h < ANTIBLOQUEO.horaHasta;
}

// Personaliza el texto por contacto. Meta no compara textos literalmente, pero mandar
// el MISMO mensaje a doscientas personas es el patron mas facil de detectar y el que
// mas reportes de spam genera.
function personaliza(texto, c){
  const nombre = (c.customer_name || c.contact_name || '').trim().split(/\s+/)[0] || '';
  let t = String(texto || '')
    .replace(/\{nombre\}/gi, nombre)
    .replace(/\{categoria\}/gi, c.interested_category || '')
    .replace(/\{combo\}/gi, c.selected_combo_name || '');
  // Si el texto no trae ningun hueco, se le antepone el saludo con su nombre: sin esto
  // todos recibirian una copia identica.
  if (nombre && !/\{nombre\}/i.test(texto) && !t.toLowerCase().startsWith('hola')) {
    t = 'Hola ' + nombre + ', ' + t.charAt(0).toLowerCase() + t.slice(1);
  }
  return t.replace(/\s{2,}/g, ' ').trim();
}

function avisoAntibloqueo(cuantos){
  const problemas = [];
  if (!ventanaHorariaOk()) problemas.push('Son las ' + new Date().getHours() + 'h. '
    + 'Fuera de ' + ANTIBLOQUEO.horaDesde + '–' + ANTIBLOQUEO.horaHasta + 'h la gente reporta más.');
  if (cuantos > ANTIBLOQUEO.topeDiario) problemas.push(cuantos + ' supera el tope diario de '
    + ANTIBLOQUEO.topeDiario + '. Divídelo en varios días.');
  const minutos = Math.ceil(cuantos / ANTIBLOQUEO.porMinuto);
  return { problemas, minutos };
}

async function enviaBroadcast(){
  if (!AUDIENCIA) return;
  const cuantos = Number(AUDIENCIA.found || 0);
  const { problemas, minutos } = avisoAntibloqueo(cuantos);
  if (problemas.length && !confirm('Ojo antes de enviar:\n\n• ' + problemas.join('\n• ')
    + '\n\nUna penalización de Meta tarda semanas en irse.\n\n¿Enviar igualmente?')) return;
  if (!confirm('Se enviará a ' + cuantos + ' contactos reales, personalizando cada mensaje.\n'
    + 'Tardará unos ' + minutos + ' minuto(s) para no ir en ráfaga.\n\n'
    + 'Esto no se puede deshacer. ¿Confirmas?')) return;
  const cuerpo = cuerpoBc(false);
  cuerpo.personalizar = true;
  cuerpo.ritmo_por_minuto = ANTIBLOQUEO.porMinuto;
  // Se envia sobre los ids QUE SE ENSEÑARON, no sobre una audiencia recalculada: entre
  // la simulacion y la confirmacion puede haber entrado gente nueva que nadie reviso.
  if (Array.isArray(AUDIENCIA.ids) && AUDIENCIA.ids.length) cuerpo.only_ids = AUDIENCIA.ids;
  $('bcEnviar').disabled = true;
  $('bcEnviar').textContent = 'Enviando…';
  const r = await llama(cuerpo);
  if (!r.ok) { $('bcEnviar').disabled = false; $('bcEnviar').textContent = 'Enviar a ' + cuantos;
    return avisa('No se pudo enviar', r.error); }
  AUDIENCIA = null;
  $('bcSalida').innerHTML = '<div class="propuesta"><div class="tapa"><b>Envío terminado</b></div>'
    + '<div class="cuerpo">'
    +   '<div class="cambio"><div class="k">Enviados</div>' + Number(r.sent || 0) + '</div>'
    +   '<div class="cambio"><div class="k">Fallidos</div>' + Number(r.failed || 0) + '</div>'
    +   ((r.errors || []).length
        ? '<div class="cambio"><div class="k">Motivos</div>'
          + (r.errors || []).slice(0,10).map(e => esc(e.error)).join('<br>') + '</div>' : '')
    + '</div></div>';
  avisa('Broadcast enviado', Number(r.sent || 0) + ' de ' + cuantos);
}

/* ---- Acciones en lote ---------------------------------------------------- */
// Apagarle las comunicaciones a cien personas de una vez tiene que ser dificil de
// hacer sin querer y facil de entender: se dice cuantos, que les pasa, y hay que
// escribir la palabra. Y va de uno en uno con su motivo, porque si falla en el 40 hay
// que saber cuales quedaron hechos.
const LOTE = new Set();

function pintaLote(){
  const b = $('barraLote'); if (!b) return;
  b.hidden = LOTE.size === 0;
  if (!LOTE.size) return;
  b.innerHTML = '<span><b>' + LOTE.size + '</b> seleccionado(s)</span>'
    + '<button class="btn-linea" data-lote="etq">Etiquetar</button>'
    + '<button class="btn-linea" data-lote="desinteres">Desinteresado</button>'
    + '<button class="btn-linea danger" data-lote="apagar">Apagar bot y marketing</button>'
    + '<button class="btn-linea" data-lote="nada">Quitar selección</button>';
}

function cableaLote(){
  const b = $('barraLote'); if (!b) return;
  b.onclick = async ev => {
    const btn = ev.target.closest('[data-lote]'); if (!btn) return;
    const op = btn.dataset.lote;
    const ids = [...LOTE];
    if (op === 'nada') { LOTE.clear(); pintaLote(); pintaChats(); return; }

    if (op === 'etq') {
      const e = (window.prompt('Etiqueta para los ' + ids.length + ' seleccionados:') || '').trim().toLowerCase();
      if (!e) return;
      return corridaLote(ids, async c => llama({ action:'updateLead', conversation_id:c.id || c._id,
        fields:{ labels: [...new Set([...etiquetasDe(c), e])] } }), 'Etiquetados');
    }

    if (op === 'desinteres') {
      if (!confirm('Se marcarán ' + ids.length + ' contactos como desinteresados.\n\n'
        + 'Dejan de recibir marketing, seguimientos y auto-plantillas. Pueden seguir escribiendo '
        + 'y se les puede contestar a mano.\n\n¿Seguro?')) return;
      return corridaLote(ids, async c => llama({ action:'disinterest', operation:'mark',
        conversation_id:c.id || c._id, reason:'marcado en lote desde la lista' }), 'Marcados');
    }

    if (op === 'apagar') {
      // Exclusion permanente: la mas grave de todas, y en lote. Por eso se escribe.
      const frase = 'APAGAR ' + ids.length;
      const escrito = window.prompt('Se apagarán bot, promociones y seguimientos para '
        + ids.length + ' contactos, de forma permanente.\n\n'
        + 'Los mensajes que ellos manden se seguirán recibiendo.\n\n'
        + 'Escribe ' + frase + ' para confirmar:') || '';
      if (escrito !== frase) return;
      return corridaLote(ids, async c => llama({ action:'communicationPolicy', operation:'block',
        conversation_id:c.id || c._id, confirmation:'DESACTIVAR CONTACTO',
        reason:'exclusión en lote desde la lista' }), 'Apagados');
    }
  };
}

async function corridaLote(ids, hacer, verbo){
  const b = $('barraLote');
  let hechos = 0; const fallos = [];
  for (const id of ids) {
    const c = CONVS.find(x => x._id === id);
    if (!c) continue;
    b.innerHTML = '<span><span class="cargando"></span> ' + verbo.toLowerCase() + ' '
      + (hechos + 1) + ' de ' + ids.length + '…</span>';
    const r = await hacer(c);
    if (r?.ok) hechos++; else fallos.push(nombreDe(c) + ': ' + (r?.error || 'error'));
  }
  LOTE.clear(); pintaLote(); pintaChats();
  // Se dice cuantos salieron y cuantos no. Un "listo" a secas esconde los que fallaron.
  avisa(verbo + ' ' + hechos + ' de ' + ids.length,
    fallos.length ? fallos.slice(0,3).join(' · ') : '');
}

// acordarse de algo, o que el cliente reciba algo. La fecha se guarda en follow_up_at,
// que es de donde sale la vista de Recordatorios y lo que mira el motor de seguimientos.
function abreRecordatorio(c){

  const en = h => { const d = new Date(Date.now() + h*3600000); d.setMinutes(0,0,0); return d; };
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);

    + '<button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo">'
    + '<div class="pdfs" style="margin-bottom:12px">'
    +   '<button class="tplchip" data-en="4">En 4 horas</button>'
    +   '<button class="tplchip" data-en="24">Mañana</button>'
    +   '<button class="tplchip" data-en="72">En 3 días</button>'
    +   '<button class="tplchip" data-en="168">En una semana</button>'
    + '</div>'
    + '<div class="campo"><label>Cuándo</label>'
    +   '<input type="datetime-local" id="recCuando" value="' + iso(en(24)) + '"></div>'
    + '<div class="campo"><label>Para acordarme de…</label>'
    +   '<textarea id="recNota" rows="2" placeholder="Ej. confirmar si consiguió la fecha">'
    +   esc(c.next_step_suggested || '') + '</textarea></div>'
    + '<div class="checkrow" style="display:flex;gap:8px;align-items:flex-start;margin-bottom:10px">'
    +   '<input type="checkbox" id="recEnviar2" style="width:auto;margin-top:3px">'
    +   '<label for="recEnviar2" style="text-transform:none;letter-spacing:0;font-size:12.5px;'
    +     'font-weight:400;color:var(--mut)">Además, prepararle un mensaje al cliente para ese día '
    +     '<b>(no sale solo: llegado el momento aparece aquí para revisarlo y enviarlo)</b></label>'
    + '</div>'
    + '<div class="campo" id="recMsgCampo" hidden><label>Mensaje</label>'
    +   '<textarea id="recMensaje" rows="3" placeholder="Hola {nombre}, ¿pudiste ver lo que te mandé?"></textarea>'
    +   '<p class="aviso" style="margin:6px 0 0">Si han pasado más de 24 h desde su último mensaje, '
    +     'solo llegará con plantilla aprobada. Se avisará entonces.</p></div>'
    + '</div>'
    + '<div class="mpatas"><button class="btn-linea" data-cerrar>Cancelar</button>'
    +   '<button class="btn-solido" id="recGuardar">Guardar recordatorio</button></div>');
  $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });
  $('modal').querySelector('.pdfs').onclick = ev => {
    const b = ev.target.closest('[data-en]'); if (!b) return;
    $('recCuando').value = iso(en(Number(b.dataset.en)));
  };
  $('recEnviar2').onchange = ev => { $('recMsgCampo').hidden = !ev.target.checked; };
  $('recGuardar').onclick = async () => {
    const cuando = $('recCuando').value;
    if (!cuando) return avisa('Falta la fecha');
    const campos = {
      follow_up_at: new Date(cuando).toISOString(),
      next_step_suggested: $('recNota').value.trim() || c.next_step_suggested || '',
    };
    // El mensaje se guarda como borrador en la ficha, no se programa un envio ciego.
    // Un mensaje que sale solo dentro de tres dias puede llegar cuando ya no aplica.
    if ($('recEnviar2').checked && $('recMensaje').value.trim()) {
      campos.pending_questions = $('recMensaje').value.trim();
    }
    $('recGuardar').disabled = true;
    const r = await llama({ action:'updateLead', conversation_id: c.id || c._id, fields: campos });
    $('recGuardar').disabled = false;
    if (!r.ok) return avisa('No se pudo guardar', r.error);
    Object.assign(c, campos);
    cierraModal();
    avisa('Recordatorio guardado', new Date(cuando).toLocaleString('es-DO', { dateStyle:'medium', timeStyle:'short' }));
    if (vistaActual === 'reminders') pintaRecordatorios();
  };
}

/* ---- Etiquetas manuales -------------------------------------------------- */
// Van en el campo 'labels' de la conversacion, que updateLead ya permite escribir. No
// hay catalogo aparte a proposito: una etiqueta existe porque alguien la escribio en
// algun contacto, y las sugerencias salen de lo que ya se usa. Un catalogo separado se
// llena de etiquetas muertas que nadie borra.
function etiquetasDe(c){
  const v = c?.labels;
  if (Array.isArray(v)) return v.map(String).filter(Boolean);
  if (typeof v === 'string' && v.trim()) return v.split(',').map(s => s.trim()).filter(Boolean);
  return [];
}
function etiquetasEnUso(){
  const set = new Set();
  CONVS.forEach(c => etiquetasDe(c).forEach(e => set.add(e)));
  return [...set].sort();
}

function cableaEtiquetas(c){
  const caja = $('etiquetas'); if (!caja) return;
  const pinta = () => {
    const mias = etiquetasDe(c);
    const sugeridas = etiquetasEnUso().filter(e => !mias.includes(e)).slice(0, 8);
    caja.innerHTML = mias.map(e => '<span class="etq puesta">' + esc(e)
        + '<button data-quita-etq="' + esc(e) + '" aria-label="Quitar">×</button></span>').join('')
      + sugeridas.map(e => '<button class="etq sug" data-pon-etq="' + esc(e) + '">+ ' + esc(e) + '</button>').join('')
      + (mias.length || sugeridas.length ? '' : '<span class="quien">Todavía no hay ninguna.</span>');
  };
  pinta();

  const guarda = async lista => {
    const antes = etiquetasDe(c);
    c.labels = lista;
    pinta();
    const r = await llama({ action:'updateLead', conversation_id: c.id || c._id, fields:{ labels: lista } });
    if (!r.ok) { c.labels = antes; pinta(); return avisa('No se guardó la etiqueta', r.error); }
    pintaChats();
  };

  caja.onclick = ev => {
    const quita = ev.target.closest('[data-quita-etq]');
    if (quita) return guarda(etiquetasDe(c).filter(e => e !== quita.dataset.quitaEtq));
    const pon = ev.target.closest('[data-pon-etq]');
    if (pon) return guarda([...etiquetasDe(c), pon.dataset.ponEtq]);
  };
  $('etqNueva').onkeydown = ev => {
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    const e = ev.target.value.trim().toLowerCase();
    if (!e) return;
    if (etiquetasDe(c).includes(e)) { ev.target.value = ''; return; }
    ev.target.value = '';
    guarda([...etiquetasDe(c), e]);
  };
}

// Las reglas viven en el servidor, no en el navegador: son del negocio, no de quien
// esta sentado delante. Si viven en localStorage, cada persona tiene las suyas y el
// asistente contesta distinto segun quien pregunte.
async function cargaReglas(){
  const r = await llama({ action:'data', table:'settings', operation:'select',
    filters:[{ kind:'eq', field:'key', value:'reglas_asistente' }], limit:1 });
  if (!r.ok) return;
  const fila = (r.data || r.rows || [])[0];
  REGLAS = fila?.value || '';

}
async function guardaReglas(){
  const valor = $('reglas').value.trim();
  $('btnReglas').disabled = true;
  const r = await llama({ action:'data', table:'settings', operation:'upsert',
    payload:{ id:'reglas_asistente', key:'reglas_asistente', value:valor,
      updated_at:new Date().toISOString() }, on_conflict:'id' });
  $('btnReglas').disabled = false;
  if (!r.ok) return avisa('No se pudieron guardar', r.error);

  $('reglasNota').textContent = 'Guardadas. Se usan en cada propuesta.';
