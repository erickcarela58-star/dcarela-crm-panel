// La cabecera del chat abierto, repintada sin volver a montarlo. `sel` es una copia de la ficha
// tomada al abrir y ningun snapshot la tocaba: la foto de perfil que el puente acababa de
// guardar, el nombre corregido desde la ficha o el aviso de atencion humana solo aparecian al
// cambiar de chat y volver. Se repinta SOLO lo que cambia, no el chat entero: rehacerlo perderia
// el texto a medio escribir, los adjuntos en cola y la posicion del hilo.
// ===== SILENCIAR Y ANCLAR =====
//
// No son etiquetas del panel: son el silencio y el anclaje de WhatsApp. Silenciar aquí hace
// que el teléfono del negocio deje de sonar con ese chat, y lo que se ancle en el teléfono
// sube aquí. Lo aplica el puente; el CRM guarda cómo quedó en la ficha.
const SILENCIOS = [['8h', '8 horas'], ['1sem', 'Una semana'], ['siempre', 'Siempre']];

// Silenciado quiere decir «hasta una fecha». Pasada, vuelve a sonar solo, como en WhatsApp:
// sin mirar la hora, un silencio de 8 horas duraría para siempre dentro del panel.
function silenciado(c){
  const hasta = Date.parse(String(c?.muted_until || ''));
  return Number.isFinite(hasta) && hasta > Date.now();
}

function anclado(c){
  return !!c?.pinned_at;
}

function pintaMarcasChat(){
  if (!sel) return;
  const s = $('masSilenciar'), a = $('masAnclar');
  if (s) s.textContent = silenciado(sel) ? 'Quitar el silencio' : 'Silenciar…';
  if (a) a.textContent = anclado(sel) ? 'Desanclar' : 'Anclar arriba';
}

async function marcaChat(c, cambio, texto){
  const r = await llama({ action:'chatFlags', conversation_id: c.id || c._id, ...cambio });
  if (!r.ok) return avisa('No se pudo cambiar', r.error);
  // El snapshot lo traerá igual, pero la lista no puede quedarse quieta hasta entonces.
  if ('muted_until' in r) c.muted_until = r.muted_until;
  if ('pinned_at' in r) c.pinned_at = r.pinned_at;
  pintaChats();
  pintaMarcasChat();
  avisa(texto);
}

function abreSilencio(c){
  if (silenciado(c)) return marcaChat(c, { mute: '' }, 'Este chat vuelve a sonar');
  abreModal('<div class="mtapa"><b>Silenciar este chat</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo" id="silCaja">'
    + SILENCIOS.map(([k, n]) => '<button class="tpl" data-sil="' + k + '">' + n + '</button>').join('')
    + '<p class="aviso">Es el silencio de WhatsApp: el teléfono del negocio también deja de '
    + 'sonar con este chat, y aquí no salta el aviso de mensaje nuevo. Los mensajes siguen '
    + 'llegando igual.</p></div>');
  $('silCaja').onclick = ev => {
    const boton = ev.target.closest('[data-sil]'); if (!boton) return;
    cierraModal();
    marcaChat(c, { mute: boton.dataset.sil }, 'Chat silenciado');
  };
}

function pintaCabeceraChat(){
  const cab = $('conversacion')?.querySelector('.cabecera');
  if (!cab || !sel) return;
  const n = nombreDe(sel), k = canalDe(sel);
  const av = cab.querySelector('.avwrap');
  if (av) av.innerHTML = avatarDe(sel, n)
    + '<span class="canalpin" title="' + esc(CANALES[k].nombre) + '" '
    + 'style="background:' + CANALES[k].color + '">' + CANALES[k].logo + '</span>';
  const quien = cab.querySelector('.quien-chat');
  if (quien) quien.innerHTML = '<b>' + esc(n) + '</b>' + subtituloChat(sel);
  const previo = cab.querySelector('[data-aviso-handoff]');
  const estado = sel.human_handoff_notification_status;
  if (!estado) { if (previo) previo.remove(); }
  else {
    const et = previo || document.createElement('span');
    et.className = 'etiqueta';
    et.dataset.avisoHandoff = '1';
    et.title = 'Aviso interno al teléfono de avisos (Configuración), por la línea de WhatsApp Web conectada. Enviado no significa leído.';
    et.textContent = ({pending:'Aviso pendiente',sent:'Aviso enviado',failed:'Aviso fallido',skipped:'Aviso no enviado'})[estado] || 'Aviso pendiente';
    if (!previo && quien) quien.after(et);
  }
  // La foto nueva se pide en cuanto se ve, igual que en la lista.
  resuelveAvatares();
}

// El boton de modo dice quien atiende. Lo pinta el chat al abrirse y tambien el snapshot: si el
// servidor pasa la conversacion a humano --lo hace solo cuando el cliente pide una persona-- el
// boton seguia diciendo "Bot atiende", y pulsarlo la devolvia al bot, que es lo contrario de lo
// que esperaba quien lo pulso.
function pintaModoChat(){
  const modo = $('btnModo');
  if (!modo || !sel) return;
  modo.textContent = (sel.mode === 'human' || sel.human_handoff_required) ? 'Humano atiende' : 'Bot atiende';
}

// Lo que cambia en la conversacion abierta, sin recargar y sin volver a montar el chat. Se llama
// desde el snapshot de conversaciones.
//
// No se repinta en cada snapshot: la lista se repinta constantemente (cada vista previa, cada
// contador) y repintar la ficha en cada una tiraria el desplegable abierto. Se compara una firma
// de los campos que se VEN, sin los que cambian por cualquier mensaje.
const CAMPOS_VOLATILES = new Set(['last_message_at', 'last_message_preview', 'last_inbound_preview',
  'updated_at', 'unread']);
function firmaConv(c){
  return JSON.stringify(Object.keys(c || {}).filter(k => !CAMPOS_VOLATILES.has(k)).sort()
    .map(k => [k, c[k]]));
}
function refrescaSeleccion(){
  if (!sel) return;
  const fresco = buscaConv(sel._id || sel.id);
  if (!fresco || fresco === sel) return;
  const cambia = firmaConv(fresco) !== firmaConv(sel);
  // El panel baja el "sin leer" al abrir el chat y el servidor lo confirma despues: sin esto, el
  // primer snapshot devolveria el globito que ya se habia apagado.
  const leido = !Number(sel.unread || 0);
  // El MISMO objeto, para que los cierres del compositor y del boton de modo sigan valiendo.
  Object.assign(sel, fresco);
  if (leido) sel.unread = 0;
  if (!cambia) return;
  pintaCabeceraChat();
  pintaModoChat();
  pintaMarcasChat();
  pintaVentana24();
  pintaAvisoLinea();
  // La ficha NO se repinta mientras alguien escribe en ella: le borraria lo tecleado a media
  // frase. Queda pendiente y se repinta al salir del campo.
  const ficha = $('ficha');
  if (ficha && ficha.contains(document.activeElement)) {
    if (!refrescaSeleccion.esperando) {
      refrescaSeleccion.esperando = true;
      ficha.addEventListener('focusout', () => {
        refrescaSeleccion.esperando = false;
        if (sel) pintaFicha(sel);
      }, { once: true });
    }
    return;
  }
  pintaFicha(sel);
}

// El compositor dice por que no se puede escribir en este chat y no deja intentarlo. Antes se
// pintaba siempre, se escribia, y el rechazo llegaba despues traducido por "pulsa Reanudar",
// tambien en fichas de una linea que ya no esta vinculada, donde Reanudar no arregla nada.
// Se repinta sola cuando cambia la linea (fijaLineaQr).
function pintaAvisoLinea(){
  const caja = $('avisoLinea'); if (!caja || !sel) return;
  // La red oculta manda ANTES que la linea: un chat de Instagram no tiene linea de WhatsApp Web
  // que mirar, y avisoLineaQr diria que todo esta bien.
  const red = avisoRedOculta(sel);
  const av = red.bloquea ? red : avisoLineaQr(sel, LINEA_QR);
  for (const id of ['texto', 'btnEnviar', 'adjImg', 'adjHd', 'adjDoc', 'adjRapida', 'adjCombo', 'adjTpl', 'adjMic']) {
    const e = $(id); if (e) e.disabled = av.bloquea;
  }
  if (!av.bloquea) { caja.hidden = true; caja.innerHTML = ''; return; }
  caja.hidden = false;
  caja.innerHTML = '<div><b>' + esc(av.titulo) + '</b> ' + esc(av.texto) + '</div>'
    // El enlace a la bandeja de Meta va en el mismo aviso: decir "contesta en Meta" sin dar la
    // puerta obliga a buscarla, y quien busca acaba escribiendo por donde no debe.
    + (av.red ? enlaceMeta(av.red === 'Instagram' ? 'ig' : 'fb', 'Abrir ' + av.red + ' en Meta') : '')
    + (av.reanudar ? '<button id="avisoLineaReanudar">Reanudar envíos</button>' : '');
  const b = $('avisoLineaReanudar');
  if (b) b.onclick = async () => {
    b.disabled = true;
    const r = await llama({ action:'resumeBridge' });
    b.disabled = false;
    if (!r.ok) return avisa('No se pudo reanudar', r.error);
    if (r.bridge) fijaLineaQr(r.bridge, { enVivo:false });
    avisa('Envíos reanudados', 'Ya se puede escribir por esta línea.');
  };
}

// Abrir un chat lo marca como leido. Sin esto el globito y el contador del menu no bajan
// nunca: despues de trabajar toda la bandeja sigue diciendo que hay cinco pendientes, y
// el filtro "sin leer" deja de servir para saber que falta.
async function marcaLeido(c){
  if (!Number(c.unread || 0)) return;
  const antes = c.unread;
  c.unread = 0;             // baja ya, para que se sienta inmediato
  pintaCuentas();
  const r = await llama({ action:'updateLead', conversation_id: c.id || c._id, fields:{ unread: 0 } });
  // Si el servidor dijo que no, se devuelve el numero: un contador que miente es peor
  // que uno alto.
  if (!r.ok) { c.unread = antes; pintaCuentas(); pintaChats(); return; }

  // Y la paloma azul del cliente. Va justo aqui porque es el mismo hecho: acabas de ver
  // esos mensajes. Si falla no se avisa de nada --el chat queda leido igual y el cliente
  // ve lo de siempre--; lo que no puede es frenar la bandeja.
  if (canalDe(c) === 'whatsapp_qr' && AJUSTES.confirmar_lectura !== 'false') {
    llama({ action:'readReceipt', conversation_id: c.id || c._id }).catch(() => {});
  }
}

function cableaChat(c){
  const modo = $('btnModo');
  pintaModoChat();
  pintaMarcasChat();
  modo.onclick = async () => {
    const chatEnabled = sel?.mode === 'bot';
    const newMode = chatEnabled ? 'human' : 'bot';
    if (!sel.id && sel._id) sel.id = sel._id;
    modo.disabled = true;
    const r = await callFn({ action: 'mode', conversation_id: sel.id, mode: newMode });
    modo.disabled = false;
    if (!r.ok) return avisa('No se pudo cambiar', r.error);
    sel.mode = newMode; pintaModoChat();
    avisa(newMode === 'human' ? 'La atiendes tú' : 'Vuelve al bot',
      'El cambio se aplicará únicamente a esta conversación.');
  };
  const mas = $('mas');
  mas.querySelector('button').onclick = ev => { ev.stopPropagation(); mas.classList.toggle('on'); };
  // Antes se añadia un listener de documento en CADA apertura de conversacion, y cada
  // uno quedaba apuntando a un nodo ya destruido. Tras un rato de trabajo eran cientos.
  // Uno solo, delegado, y busca el menu que exista en ese momento.
  if (!cableaChat.cerrarMenu) {
    cableaChat.cerrarMenu = () => document.getElementById('mas')?.classList.remove('on');
    document.addEventListener('click', cableaChat.cerrarMenu);
  }
  mas.querySelector('.menu').onclick = async ev => {
    const b = ev.target.closest('[data-mas]'); if (!b) return;
    mas.classList.remove('on');
    if (b.dataset.mas === 'recordar') return abreRecordatorio(sel);
    // Abre un hilo del asistente sobre ESTE contacto. Es la unica forma en que el chat abierto
    // llega a Planificacion: abrir un chat ya no cambia el contacto de ningun hilo.
    if (b.dataset.mas === 'asistente') return preguntaAlAsistente(sel);
    if (b.dataset.mas === 'contacto') return abreGuardarContacto(sel);
    if (b.dataset.mas === 'ubicacion') return abreEnviarUbicacion(sel);
    if (b.dataset.mas === 'tarjeta') return abreEnviarContacto(sel);
    if (b.dataset.mas === 'silenciar') return abreSilencio(sel);
    if (b.dataset.mas === 'anclar') return marcaChat(sel, { pin: !anclado(sel) },
      anclado(sel) ? 'Chat desanclado' : 'Chat anclado arriba');
    if (b.dataset.mas === 'encuesta') { abreEncuesta(sel); } else {
      if (!await confirmaAqui('¿Cerrar esta conversación?')) return;
      const r = await llama({ action:'updateLead', conversation_id: sel.id || sel._id,
        fields:{ status:'closed', lead_status:'cerrado' } });
      avisa(r.ok ? 'Conversación cerrada' : 'No se pudo cerrar', r.ok ? '' : r.error);
    }
  };
  const agendar = $('btnAgendar');
  if (agendar) agendar.onclick = () => abreRecordatorio(sel);
  cableaAdjuntos();
  cancelaCita();
  $('citaX').onclick = cancelaCita;
  pintaBarraSeleccion();
  $('barraSeleccion').querySelector('.bscancelar').onclick = saleSeleccion;
  $('barraSeleccion').querySelector('.bsreenviar').onclick = () => abreReenviar([...SEL_MSGS]);
  const caja = $('texto'), env = $('btnEnviar');
  caja.addEventListener('input', () => {
    caja.style.height = 'auto';
    caja.style.height = Math.min(caja.scrollHeight, 150) + 'px';
    avisaEscribiendo(sel, !!caja.value.trim());
  });
  caja.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); env.click(); }
  });
  env.onclick = async () => {
    const t = caja.value.trim();
    if (!t && !COLA.length) return;
    // La linea manda antes que nada: si por este chat no puede salir nada, se dice la causa real
    // y no se llama al servidor. El servidor lo rechazaria igual, con su propio codigo.
    const lineaChat = avisoLineaQr(sel, LINEA_QR);
    if (lineaChat.bloquea) return avisa('No se puede enviar', lineaChat.texto);
    // Lo mismo con Instagram y Messenger mientras esten ocultos: por ahi no sale nada. El
    // servidor lo rechaza igual con un 409 'social_oculto', pero enterarse despues de pulsar
    // Enviar es exactamente lo que ya paso con la linea desvinculada.
    const redChat = avisoRedOculta(sel);
    if (redChat.bloquea) return avisa('No se puede enviar', redChat.texto);
    // Fuera de la ventana de 24 h el envio no falla aqui: Meta lo acepta y lo rechaza
    // despues. Preguntar cuesta un clic; no preguntar costo cuatro mensajes que el
    // dueño creyo enviados. La plantilla es la unica via que si llega.
    if (canalDe(sel) !== 'whatsapp_qr' && (() => {
      const u = ultimoDelCliente();
      return !u || (Date.now() - u) / 3600000 >= 24;
    })()) {
      // El aviso tiene que hablar del canal que se esta usando. Decia "WhatsApp" y mandaba
      // al boton de Plantillas estando en un chat de Instagram, donde las plantillas NO
      // EXISTEN: son un producto de WhatsApp. Quien lo leia probaba la plantilla, no
      // funcionaba, y el CRM parecia roto cuando lo que fallaba era el consejo.
      const nombreRed = redSocial(sel);
      if (!await confirmaAqui(nombreRed
        ? 'Han pasado más de 24 horas desde su último mensaje.'+'\n\n'
          + 'En ' + nombreRed + ' no hay plantillas. Se intentará por la vía de atención '
          + 'humana, que Meta permite hasta 7 días; con más tiempo lo va a rechazar.'
          + '\n\n'+'¿Intentarlo?'
        : 'Han pasado más de 24 horas desde su último mensaje.'+'\n\n'
          + 'WhatsApp no le va a entregar esto: saldrá con ⚠. Solo llega una plantilla '
          + 'aprobada (botón de Plantillas).'+'\n\n'+'¿Enviarlo de todas formas?')) {
        return;
      }
    }
    env.disabled = true;
    let fallo = null;
    // Los nombres de estas claves NO son opcionales: uploadMetaMedia lee media_b64 y
    // media_filename (firebase-functions/src/index.js:179-183). Con media_base64 la
    // subida devuelve null, outboundPayload cae a la rama de texto, y con una foto mas
    // texto sale SOLO el texto mientras el panel dice "enviado". Un fallo silencioso
    // hacia un cliente real.
    const conv = sel.id || sel._id;
    // El canal decide POR DONDE sale. Un chat que entro por WhatsApp Web no puede salir
    // por el API oficial: el servidor lo rechaza con "canal incorrecto".
    //
    // Y ya manda archivos. Este bloque decia "WhatsApp Web todavía no envía archivos" y
    // cortaba el envio, pero el puente sabia mandar imagen, audio y documento desde hacia
    // tiempo, y el almacenamiento existe desde el 09/09: el bloqueo se habia quedado solo.
    // Van por la misma cola, uno por mensaje, con el texto como pie del ultimo que lo admite.
    const porPuente = canalDe(sel) === 'whatsapp_qr';
    if (porPuente) {
      const pieEnQr = COLA.map(a => a.tipo).lastIndexOf('image') >= 0
        ? COLA.map(a => a.tipo).lastIndexOf('image')
        : COLA.map(a => a.tipo).lastIndexOf('document');
      let salieronQr = 0, falloQr = null;
      for (let i = 0; i < COLA.length && !falloQr; i++) {
        const a = COLA[i];
        const r = await llama({
          action:'bridgeQueue', conversation_id: conv,
          media_kind: a.tipo, media_b64: a.datos, media_filename: a.nombre, media_mime: a.mime,
          // Se manda la vista previa junto al archivo: el archivo se borra al enviarse y esto
          // es lo que deja el mensaje visible en el hilo. Ver miniaturaParaEnviar.
          ...(a.thumb ? { media_thumb_b64: a.thumb } : {}),
          body: (t && i === pieEnQr) ? t : '',
        });
        if (r.ok) {
          salieronQr++;
          // El servidor ya lo acepto: el globo se pinta AHORA, con reloj, en vez de esperar
          // a que el puente lo mande y lo guarde.
          apuntaEnviando({ conv, tipo: a.tipo, body: (t && i === pieEnQr) ? t : '', mime: a.mime, datos: a.datos });
        } else falloQr = r;
      }
      // Los que ya salieron se quitan, igual que en el oficial: reintentar no los repite.
      COLA.splice(0, salieronQr);
      pintaCola();
      if (!falloQr && t && pieEnQr < 0) {
        const r = await llama({ action:'bridgeQueue', conversation_id: conv, body: t });
        if (!r.ok) falloQr = r; else apuntaEnviando({ conv, tipo:'text', body: t });
      }
      env.disabled = false;
      // Con el codigo: el servidor dice si es otra linea, la PC, la pausa o el modo seguro.
      if (falloQr) return avisa('No se pudo enviar', traduceErrorMeta(falloQr.error, falloQr.code));
      caja.value = ''; caja.style.height = 'auto';
      // El mensaje ya salio: dejar el «escribiendo…» encendido despues de enviarlo es
      // justo lo que hace que el cliente se quede esperando otra cosa.
      apagaEscribiendo();
      cancelaCita();
      return;
    }
    // Instagram y Messenger ya reciben archivos: el servidor los guarda y le da a Meta un enlace
    // temporal para que los descargue. Lo que la red NO admite se dice ANTES de subir nada --el
    // servidor tambien lo rechaza, pero descubrirlo despues de esperar la subida es peor--, con
    // la misma tabla que usa el servidor (FORMATOS_RED).
    const claveRed = redSocial(sel) ? canalDe(sel) : null;
    if (claveRed) {
      const pega = COLA.map(a => problemaAdjuntoRed(claveRed, a)).find(Boolean);
      if (pega) {
        env.disabled = false;
        return avisa('No se puede enviar por ' + redSocial(sel), pega);
      }
    }
    // Por esas dos redes no salen botones (el servidor los rechaza con social_sin_botones), y
    // los combos los llevan. Perderlos sin decirlo es lo que ya se quito una vez: las opciones
    // se escriben al final del texto, que el cliente si recibe.
    const botonesRed = claveRed ? COLA.flatMap(a => Array.isArray(a.botones) ? a.botones : []) : [];
    const opcionesRed = [...new Set(botonesRed.map(b => String(b?.titulo || '').trim()).filter(Boolean))];
    const texto = opcionesRed.length
      ? [t, 'Responde: ' + opcionesRed.join(' / ')].filter(Boolean).join('\n\n')
      : t;
    // El audio no admite pie de foto en la API de WhatsApp: si va texto con una nota de
    // voz, el texto se pierde. Por eso el texto viaja con el ultimo adjunto que SI
    // admite pie, y si no hay ninguno se manda aparte.
    //
    // En Instagram y Messenger el archivo y el texto no pueden ir juntos: Meta no los admite en
    // el mismo mensaje. Con -1 todos los adjuntos salen sin pie ni botones, y el texto va
    // despues, aparte, por sendText.
    const ultimoConPie = claveRed ? -1 : (COLA.map(a => a.tipo).lastIndexOf('image') >= 0
      ? COLA.map(a => a.tipo).lastIndexOf('image')
      : COLA.map(a => a.tipo).lastIndexOf('document'));
    // Los que ya salieron se quitan de la cola SOBRE LA MARCHA. Si el tercero falla y
    // se reintenta sin esto, los dos primeros se le mandan al cliente otra vez.
    let enviados = 0;
    for (let i = 0; i < COLA.length && !fallo; i++) {
      const a = COLA[i];
      const r = await llama({
        action:'send', conversation_id: conv,
        media_kind: a.tipo, media_b64: a.datos, media_filename: a.nombre, media_mime: a.mime,
        body: (t && i === ultimoConPie) ? t : '',
        // Los botones exigen texto: si el pie fue a otro adjunto, este va sin nada que
        // decir y Meta rechazaria el mensaje entero. En ese caso se manda sin botones.
        ...(a.botones && t && i === ultimoConPie ? { botones: a.botones } : {}),
      });
      if (r.ok) enviados++; else fallo = r.error;
    }
    COLA.splice(0, enviados);
    pintaCola();
    const textoYaFue = t && ultimoConPie >= 0 && !fallo;
    if (!fallo && texto && !textoYaFue) {
      const cuerpo = { action:'sendText', conversation_id: conv, body:texto };
      // La cita se manda con el wamid del original: asi WhatsApp la enlaza de verdad
      // en el telefono del cliente, en vez de pegar el texto citado a mano.
      if (citando?.wamid) {
        cuerpo.reply_to_wamid = citando.wamid;
        cuerpo.reply_snippet = String(citando.body || '').slice(0, 200);
        cuerpo.reply_sender = citando.direction === 'in' ? 'customer' : 'agent';
      }
      const r = await llama(cuerpo);
      if (!r.ok) fallo = r.error;
    }
    if (!fallo) cancelaCita();
    env.disabled = false;
    // La cola ya se vacio de lo que SI salio, arriba. Aqui solo se limpia el texto.
    //
    // Los errores de Instagram y Messenger ya vienen explicados por el servidor, en español.
    // traduceErrorMeta convierte cualquier texto con "24" en el consejo de las plantillas de
    // WhatsApp, que en esas redes no existen.
    if (fallo) return avisa('No se pudo enviar', claveRed ? fallo : traduceErrorMeta(fallo));
    caja.value = ''; caja.style.height = 'auto';
  };
}

// "Meta rechazo el envio" no le dice a nadie que hacer. Los motivos que de verdad se
// repiten se explican, y con la salida: casi siempre es la ventana de 24 h cerrada,
// que se resuelve con una plantilla.
function traduceErrorMeta(e, codigo){
  const t = String(e || '');
  // Los rechazos del puente van PRIMERO y por codigo. Antes caian en /pausado|modo seguro/ y todos
  // decian "pulsa Reanudar", tambien con la ficha de otra linea o con la PC apagada. Y el filtro
  // de las 24 h de abajo se come cualquier texto con un "24" (el 849-524-5620, por ejemplo).
  const puente = /^bridge_/.test(String(codigo || '')) ? String(codigo)
    : (t.match(/\bbridge_(?:other_number|host_offline|disconnected|paused|reconnect_only)\b/) || [''])[0];
  if (puente === 'bridge_other_number') return /l[ií]nea/i.test(t)
    ? t : 'Esta conversación es de otra línea de WhatsApp Web, que ya no está vinculada: por aquí no se le puede contestar.';
  if (puente === 'bridge_host_offline') return 'La PC del puente no responde: el mensaje saldría tarde, así que no '
    + 'se envió. Revisa que el programa del puente esté abierto en la PC del negocio.';
  if (puente === 'bridge_disconnected') return 'El WhatsApp Web no está conectado. Vincúlalo en Canales.';
  if (puente === 'bridge_paused') return 'Los envíos del WhatsApp Web están en pausa. Pulsa "Reanudar envíos" en Canales.';
  if (puente === 'bridge_reconnect_only') return 'El WhatsApp Web sigue en modo seguro: activa los envíos de este número en Canales.';
  // El 409 de una red oculta llega con su codigo y con un texto ya claro. Va aqui arriba para que
  // no lo pise la regla de las 24 h de mas abajo, que se queda con cualquier texto que lleve
  // un "24" y recomienda una plantilla donde no existen las plantillas.
  if (String(codigo || '') === 'social_oculto') return t
    || 'Esa red está oculta en el CRM: se contesta desde la bandeja de Meta.';
  // 'conversacion ... no existe' es del CRM, no de Meta. Con /no existe/ en la regla de abajo se
  // leia como "ese numero no tiene WhatsApp", que manda a dudar del cliente en vez de recargar.
  if (/conversaci[oó]n[\s\S]*no existe/i.test(t)) return 'Esta conversación ya no existe en el CRM. '
    + 'Recarga la lista: puede que se haya cerrado o fusionado.';
  // La ventana de 24 h es del API oficial. Antes bastaba un "24" en cualquier parte del texto
  // --el propio numero oficial, 18495245620, lo lleva-- para que el panel recomendara una
  // plantilla en un chat donde no hay ni ventana ni plantillas.
  if (/131047|re-?engagement|\b24\s?-?\s?(?:h|horas?|hours?)\b|ventana de 24/i.test(t))
    return 'Pasaron más de 24 h desde su último mensaje. Solo llega con una plantilla aprobada '
      + '(el botón de plantillas del compositor, en el número oficial).';
  if (/131026|not.*whatsapp/i.test(t)) return 'Ese número no tiene WhatsApp.';
  if (/131049|calidad|quality/i.test(t)) return 'Meta está limitando este número por calidad. '
    + 'Revisa Conexión WhatsApp.';
  if (/excluido|blocked/i.test(t)) return 'Este contacto está excluido de comunicaciones.';
  if (/seguimientos|followup_exhausted/i.test(t)) return 'Lleva dos seguimientos sin responder: '
    + 'quedó como desinteresado y no se le insiste más.';
  if (/transport|reconect/i.test(t)) return 'Meta no está conectada al transporte. Mira Canales.';
  if (/canal incorrecto/i.test(t)) return 'Este chat entró por otro canal. Se está enviando por la vía '
    + 'equivocada; mira Canales.';
  // "Pausado" y "desconectado" NO son lo mismo, y decirlo mal manda a arreglar lo que ya
  // funciona. Vinculado y en pausa se ve exactamente igual que sin vincular, y la salida es
  // distinta: uno se reanuda con un boton, el otro hay que volver a vincularlo entero.
  if (/pausado|modo seguro/i.test(t)) return 'El segundo WhatsApp está vinculado pero con los '
    + 'envíos en pausa. Pulsa "Reanudar envíos" en Canales.';
  if (/desconectado/i.test(t)) return 'El segundo WhatsApp no está conectado. Conéctalo en Canales.';
  if (/almacenamiento dedicado|bridge_media/i.test(t)) return 'WhatsApp Web todavía no envía archivos, '
    + 'solo texto.';
  return t;
}

/* ---- Adjuntos ------------------------------------------------------------ */
// Cola visible antes de enviar: lo que se manda a un cliente real se ve primero.
const COLA = [];
// HD siempre, por defecto. Lo pidio el dueno: «las fotos se deben subir en HD siempre». El
// boton sigue ahi por si alguna vez hace falta mandar algo ligero, pero arranca encendido.
let modoHd = true;
// El tope de ADJUNTAR depende del canal, no es el mismo numero para los dos:
//  - Meta (Cloud API, el numero oficial): uploadMetaMedia rechaza por encima de 16 MB ya
//    decodificado (firebase-functions/src/index.js, uploadMetaMedia). Poner mas aqui solo
//    conseguiria que el archivo se subiera entero para morir alla, asi que se corta antes.
//  - WhatsApp Web (el puente, 5644): la foto se comprime AQUI antes de mandarla
//    (comprimeHdPuente, tope real 7,5 MB) sin importar cuanto pese el original, asi que el
//    tope de Meta no tiene nada que ver: bloqueaba fotos HD de telefono (12-20 MB) que la
//    compresion iba a bajar de sobra. Solo los documentos van intactos por el puente, y ahi
//    si manda el tope del servidor (TOPE_MEDIO_PUENTE, 8 MB).
function LIMITE_MB(porPuente, tipo){
  if (porPuente) return tipo === 'document' ? 8 : 60;
  return modoHd ? 15 : 12;
}

// Lo que admite cada red social. Es una COPIA de FORMATOS_SOCIAL
// (firebase-functions/src/transport-core.js): decide el servidor, y esto solo sirve para avisar
// antes de subir el archivo entero. Va en JSON estricto porque test/v2-adjuntos-redes.test.js
// la lee y exige que sea igual a la del servidor: si cambias una, cambia la otra.
//
// El tope de las redes es 8 MB, no LIMITE_MB: es donde corta Storage, y un archivo de 9 a 15 MB
// se subiria entero para acabar en un 413.
const TOPE_ADJUNTO_RED = 8 * 1024 * 1024;
const FORMATOS_RED = {
  "instagram": {
    "image": ["image/jpeg", "image/png"],
    "video": ["video/mp4", "video/quicktime", "video/webm", "video/ogg", "video/x-msvideo"],
    "audio": ["audio/aac", "audio/mp4", "audio/m4a", "audio/x-m4a", "audio/wav", "audio/x-wav", "audio/wave"],
    "document": ["application/pdf"]
  },
  "facebook": {
    "image": ["image/jpeg", "image/png", "image/gif"],
    "video": ["video/mp4", "video/quicktime", "video/webm"],
    "audio": ["audio/aac", "audio/mp4", "audio/m4a", "audio/x-m4a", "audio/wav", "audio/x-wav", "audio/wave", "audio/mpeg"],
    "document": []
  }
};

// Por que un adjunto de la cola NO puede salir por esa red, o '' si puede. Mismas reglas que
// adjuntoSocial en el servidor: un video o audio que entra por "documento" sale como lo que es,
// y Messenger manda como archivo lo que no reconoce (asi le llega la nota de voz OGG).
function problemaAdjuntoRed(red, a){
  const tabla = FORMATOS_RED[red];
  if (!tabla) return '';
  const nombre = red === 'instagram' ? 'Instagram' : 'Messenger';
  const peso = a.datos ? Math.floor(String(a.datos).length * 3 / 4) : Number(a.archivo?.size || 0);
  if (peso > TOPE_ADJUNTO_RED) return (a.nombre || 'El archivo') + ' pesa más de 8 MB, el máximo por ' + nombre + '.';
  const mime = String(a.mime || '').split(';')[0].trim().toLowerCase();
  const lista = tabla[a.tipo];
  if (!lista) return nombre + ' no admite ese tipo de archivo.';
  if (lista.includes(mime)) return '';
  if (a.tipo === 'document' && ['image', 'video', 'audio'].some(k => tabla[k].includes(mime))) return '';
  if (red === 'facebook') return '';
  if (a.tipo === 'audio') return 'Instagram no acepta las notas de voz grabadas aquí (son OGG). '
    + 'Grábala desde la app de Instagram, o adjunta un audio M4A, AAC o WAV.';
  return 'Instagram no acepta ' + (a.nombre || 'ese archivo') + ': solo imágenes JPEG o PNG, vídeo MP4, '
    + 'MOV o WEBM, audio M4A, AAC o WAV y documentos PDF.';
}

// Comprime cada imagen de la cola con el modo ACTUAL y actualiza su peso. Se llama al
// adjuntar y cada vez que se pulsa HD, para que el tamaño que se ve sea el que va a
// salir de verdad y no el del original.
async function recalculaCola(){
  for (const a of COLA) {
    if (a.tipo !== 'image' || !a.archivo) {
      if (!a.datos && a.archivo) { a.datos = await leeBase64(a.archivo); a.kb = Math.round(a.archivo.size/1024); }
      continue;
    }
    if (a.hd === modoHd && a.datos) continue;      // ya esta en el modo pedido
    const porPuente = canalDe(sel) === 'whatsapp_qr';
    let blob = modoHd ? await (porPuente ? comprimeHdPuente(a.archivo) : comprimeHd(a.archivo)) : await comprimeNormal(a.archivo);
    // WhatsApp Cloud API solo acepta JPEG y PNG como imagen. Una WebP pequeña pasaba sin
    // recomprimir y Meta rechazaba el mensaje: asi salian los vestidos del catalogo, que la
    // web publica en WebP, y la clienta no veia ninguno.
    if (!/^image\/(jpe?g|png)$/i.test(blob.type || '')) {
      blob = (await aJpeg(await cargaImagen(blob), modoHd ? (porPuente ? LADO_HD_PUENTE : 2560) : 1600, 0.9)) || blob;
    }
    a.datos = await leeBase64(blob);
    a.mime = blob.type || a.archivo.type || 'image/jpeg';
    // Si se reencodeo, el nombre tiene que decir jpg: algunos visores se lian con un
    // .png que por dentro es jpeg.
    a.nombre = blob !== a.archivo
      ? String(a.archivo.name || 'imagen').replace(/\.[^.]+$/, '') + '.jpg'
      : a.archivo.name;
    a.kb = Math.round(blob.size / 1024);
    // La vista previa que se guarda con el mensaje enviado. El archivo que sale del CRM se
    // borra en cuanto el cliente lo recibe --no se guarda nada en la nube-- asi que sin esta
    // miniatura el hilo ensenaria una tarjeta sin imagen de lo que uno mismo acaba de mandar.
    // Baileys genera la suya al enviar si la PC tiene sharp; esta es el respaldo.
    a.thumb = await miniaturaParaEnviar(blob);
    a.hd = modoHd;
  }
  pintaCola();
}

// 96 px de lado largo y calidad media: unos 3-6 KB, que es lo que puede viajar en cada
// mensaje sin engordar el hilo (el panel escucha los ultimos 400). El tope se mide sobre el
// data URI entero, que es lo que se guarda y lo que miden el puente y el servidor: 12 KB de
// JPEG son 16 KB en base64, y el servidor los descartaria sin decir nada.
async function miniaturaParaEnviar(blob){
  try {
    const mini = await aJpeg(await cargaImagen(blob), 96, 0.5);
    if (!mini) return '';
    const uri = 'data:image/jpeg;base64,' + await leeBase64(mini);
    return uri.length <= 12 * 1024 ? uri : '';
  } catch (e) { return ''; }
}

function pintaCola(){
  const c = $('cola'); if (!c) return;
  c.hidden = !COLA.length;
  // Se ve la foto, no su nombre. Lo que va a salir hacia un cliente real hay que
  // poder mirarlo antes: un nombre de archivo no dice si adjuntaste la que querias.
  c.innerHTML = COLA.map((a,i) => {
    // Iconos dibujados, no emoji: en Windows varias fuentes no traen 🎙 ni 🖼 y sale la
    // cajita vacia del glifo que falta, que es lo que se veia en la cola.
    const ICONO = {
      audio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/></svg>',
      image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
      document: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>',
    };
    const previa = a.tipo === 'image' && a.datos
      ? '<img src="data:' + esc(a.mime || 'image/jpeg') + ';base64,' + a.datos + '" alt="">'
      : '<span class="ico">' + (ICONO[a.tipo] || ICONO.document) + '</span>';
    const peso = a.kb || (a.datos ? Math.round(a.datos.length * 0.75 / 1024) : 0);
    const marca = a.tipo === 'image' ? (a.hd ? ' · HD' : '') : '';
    return '<span class="pieza">' + previa
      + '<span class="pnom">' + esc(a.nombre)
      +   (peso ? '<i>' + peso + ' KB' + marca + '</i>' : '') + '</span>'
      + '<button data-quita="' + i + '" aria-label="Quitar">×</button></span>';
  }).join('');
}
function leeBase64(f){
  return new Promise((res, rej) => {
    const l = new FileReader();
    l.onload = () => res(String(l.result).split(',')[1] || '');
    l.onerror = () => rej(new Error('no se pudo leer ' + f.name));
    l.readAsDataURL(f);
  });
}
// WhatsApp sube imagenes hasta ~5 MB por id, que es el metodo fiable; por encima cae
// al envio por enlace y falla con #131053. Y recomprime a ~2560 px de lado largo de
// todas formas, asi que mandar mas resolucion no mejora nada y arriesga el envio.
//
// HD = la mejor calidad que WhatsApp entrega DE VERDAD: si el JPEG ya cabe se manda
// intacto, y si no se baja hasta que quepa, siempre como imagen y no como documento.
const TOPE_FIABLE = 4.8 * 1024 * 1024;

function cargaImagen(file){
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('no se pudo abrir la imagen'));
    i.src = URL.createObjectURL(file);
  });
}
async function aJpeg(img, lado, calidad){
  const r = Math.min(1, lado / Math.max(img.width, img.height));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(img.width * r));
  cv.height = Math.max(1, Math.round(img.height * r));
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return new Promise(res => cv.toBlob(res, 'image/jpeg', calidad));
}
// Por la linea de WhatsApp Web (el puente) no hay recompresion de Meta: lo que se sube es lo que
// le llega al cliente. Ahi HD es HD de verdad, como el de WhatsApp: hasta 4096 px de lado largo
// y 7,5 MB (el servidor acepta 8; se deja margen). Por la linea oficial sigue valiendo lo de
// arriba: 4,8 MB y 2560 px, porque Meta recomprime igual.
const TOPE_HD_PUENTE = 7.5 * 1024 * 1024;
const LADO_HD_PUENTE = 4096;

async function comprimeHd(file, tope = TOPE_FIABLE, ladoMax = 2560){
  if (!file.type?.startsWith('image/')) return file;
  try {
    // Ya cabe y no se pasa de lado: intacta, sin tocar un pixel.
    if (/jpe?g/i.test(file.type) && file.size <= tope) {
      if (ladoMax >= LADO_HD_PUENTE) {
        const img0 = await cargaImagen(file);
        if (Math.max(img0.width, img0.height) <= ladoMax) return file;
      } else return file;
    }
    const img = await cargaImagen(file);
    const mayor = Math.max(img.width, img.height);
    const lados = [Math.min(mayor, ladoMax), 3600, 3200, 2800, 2560, 2400, 2200, 2000, 1800, 1600]
      .filter((lado, i, todos) => lado <= Math.min(mayor, ladoMax) && todos.indexOf(lado) === i);
    for (const lado of lados) {
      const b = await aJpeg(img, lado, 0.92);
      if (b && b.size <= tope) return b;
    }
    return (await aJpeg(img, 1600, 0.85)) || file;
  } catch (e) { return file; }
}

// La foto en HD para la linea del puente: chats de WhatsApp Web y Estados.
const comprimeHdPuente = file => comprimeHd(file, TOPE_HD_PUENTE, LADO_HD_PUENTE);
async function comprimeNormal(file){
  if (!file.type?.startsWith('image/')) return file;
  if (file.size <= 1.8 * 1024 * 1024) return file;
  try { return (await aJpeg(await cargaImagen(file), 1600, 0.85)) || file; }
  catch (e) { return file; }
}

async function encola(files, tipo){
  let fuera = 0;
  const porPuente = canalDe(sel) === 'whatsapp_qr';
  const tope = LIMITE_MB(porPuente, tipo);
  for (const f of files) {
    // HEIC no lo acepta WhatsApp por esta via y se rechaza aqui, no a mitad del envio.
    if (tipo === 'image' && /heic|heif/i.test(f.type + f.name)) { fuera++; continue; }
    if (f.size > tope * 1024 * 1024) { fuera++; continue; }
    // Se guarda el ORIGINAL. La compresion se decide al enviar, no al adjuntar: antes,
    // adjuntar y despues pulsar HD no servia de nada porque la foto ya venia comprimida
    // en calidad normal, y no habia forma de darse cuenta.
    COLA.push({ tipo, nombre: f.name, mime: f.type || 'application/octet-stream', archivo: f });
  }
  await recalculaCola();
  if (fuera) avisa(fuera + (fuera === 1 ? ' archivo se omitió' : ' archivos se omitieron'),
    'HEIC o mayor de ' + tope + ' MB.');
  pintaCola();
}
function cableaAdjuntos(){
  COLA.length = 0; pintaCola();
  $('adjImg').onclick = () => $('fImg').click();
  $('adjDoc').onclick = () => $('fDoc').click();
  $('fImg').onchange = e => { const f = [...e.target.files]; e.target.value = ''; encola(f, 'image'); };
  $('fDoc').onchange = e => { const f = [...e.target.files]; e.target.value = ''; encola(f, 'document'); };
  $('adjHd').onclick = async () => {
    modoHd = !modoHd;
    $('adjHd').setAttribute('aria-pressed', modoHd ? 'true' : 'false');
    $('adjHd').classList.toggle('on', modoHd);
    // Se recomprime lo que YA esta adjuntado. Antes el interruptor solo valia para las
    // fotos que se adjuntaran despues, sin decirlo en ninguna parte.
    if (COLA.some(a => a.tipo === 'image')) {
      $('adjHd').disabled = true;
      await recalculaCola();
      $('adjHd').disabled = false;
    }
    avisa(modoHd ? 'HD activado' : 'HD desactivado',
      modoHd ? 'Máxima calidad que WhatsApp entrega de verdad.' : 'Calidad normal, más ligeras.');
  };
  $('cola').onclick = ev => {
    const b = ev.target.closest('[data-quita]'); if (!b) return;
    COLA.splice(Number(b.dataset.quita), 1); pintaCola();
  };
  cableaMicrofono();
  // Solo existe en el chat del numero oficial (ver esOficial).
  if ($('adjTpl')) $('adjTpl').onclick = abrePlantillas;
  $('adjCombo').onclick = abreCombos;
  $('adjRapida').onclick = abreRapidas;
  $('adjEmoji').onclick = abreEmojis;
}

// Insertar EN EL CURSOR, no al final: es lo que hace WhatsApp Web, y lo que se
// esperaria si a uno se le ocurre poner un emoji a mitad de frase.
function insertaEnCaja(texto){
  const caja = $('texto');
  const ini = caja.selectionStart ?? caja.value.length;
  const fin = caja.selectionEnd ?? caja.value.length;
  caja.value = caja.value.slice(0, ini) + texto + caja.value.slice(fin);
  const pos = ini + texto.length;
  caja.focus();
  caja.setSelectionRange(pos, pos);
  caja.dispatchEvent(new Event('input'));
}

// Meta manda el anuncio solo en el primer mensaje; el servidor lo guarda en la ficha.
// Aqui solo se pinta: sin esto, quien atiende no sabe si contesta a graduacion o a XV.
const CAT_ANUNCIO = { xv:'XV', infantil:'Infantil', graduacion:'Graduación',
  cumpleanos:'Cumpleaños', embarazadas:'Maternidad' };

function insigniaAnuncio(c){
  if (!c || !(c.anuncio_id || c.anuncio_clid || c.anuncio_titular)) return '';
  const cat = CAT_ANUNCIO[String(c.anuncio_categoria || '').toLowerCase()] || '';
  const etiqueta = c.anuncio_titular || (c.anuncio_id ? 'Anuncio ' + c.anuncio_id : 'Anuncio');

/* ---- Respuestas rapidas -------------------------------------------------- */
// Frases del equipo, guardadas en el servidor y no en el navegador: si viven en
// localStorage, cada persona tiene las suyas y lo que escribe el negocio deja de
// sonar igual segun quien conteste.
let RAPIDAS = null;

async function cargaRapidas(forzar){
  if (RAPIDAS && !forzar) return RAPIDAS;
  const r = await llama({ action:'data', table:'quick_replies', operation:'select',
    order:[{ field:'created_at', ascending:false }], limit: 200 });
  if (!r.ok) { avisa('No se pudieron cargar', r.error); return null; }
  RAPIDAS = r.data || r.rows || [];
  return RAPIDAS;
}

async function abreRapidas(){
  if (!sel) return avisa('Abre una conversación primero');
  abreModal('<div class="mtapa"><b>Respuestas rápidas</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo"><span class="cargando"></span> Cargando…</div>');
  $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });
  const todas = await cargaRapidas(true);
  if (!todas) return cierraModal();
  // Si la persona llego por un anuncio, primero las frases de esa categoria. Quien
  // atiende no deberia tener que buscar la respuesta de graduacion entre las de bodas.
  const catSel = String((sel && sel.anuncio_categoria) || '').toLowerCase();
  const filas = !catSel ? todas : todas.slice().sort((a, b) => {
    const ca = String(a.categoria || '').toLowerCase() === catSel ? 0 : 1;
    const cb = String(b.categoria || '').toLowerCase() === catSel ? 0 : 1;
    return ca - cb;
  });
  if (catSel) {
    const cuantas = filas.filter(q => String(q.categoria || '').toLowerCase() === catSel).length;
    if (cuantas) avisa('Vino de ' + (CAT_ANUNCIO[catSel] || catSel), cuantas + ' respuesta(s) de esa categoría, primero');
  }
  const cuerpo = $('modal').querySelector('.mcuerpo');
  const pinta = () => {
    cuerpo.innerHTML = (!filas.length
        ? '<p class="aviso">Todavía no hay ninguna. Puedes escribir la tuya abajo, o '
          + '<button class="btn-linea" id="rqSemilla" style="padding:4px 10px;margin-left:4px">'
          + 'empezar con seis frases habituales</button></p>'
        : '')
      + (filas.length
        ? filas.map((q,i) => {
            const cq = String(q.categoria || '').toLowerCase();
            return '<div class="rapida"><button data-usar="' + i + '">'
            + '<b>' + esc(q.title || q.name || 'Sin título')
            + (cq && CAT_ANUNCIO[cq] ? ' <span class="insig-anuncio">' + esc(CAT_ANUNCIO[cq]) + '</span>' : '') + '</b>'
            + '<span>' + esc(String(q.body || q.text || '').slice(0,110)) + '</span></button>'
            + '<button class="rx" data-borrar="' + i + '" aria-label="Borrar">×</button></div>';
          }).join('')
        : '')
      + '<div class="seccion" style="margin:16px 0 8px">Añadir una nueva</div>'
      + '<div class="campo"><label>Título</label><input id="rqT" placeholder="Ej. Horario"></div>'
      + '<div class="campo"><label>Categoría</label><select id="rqCat">'
      +   '<option value="">Para cualquier sesión</option>'
      +   Object.keys(CAT_ANUNCIO).map(k => '<option value="' + k + '"'
          + (catSel === k ? ' selected' : '') + '>' + esc(CAT_ANUNCIO[k]) + '</option>').join('')
      + '</select></div>'
      + '<div class="campo"><label>Texto</label><textarea id="rqB" rows="3"></textarea></div>'
      + '<button class="btn-solido" id="rqAdd">Guardar</button>';
    // Seis frases que se repiten veinte veces al dia en un estudio fotografico. Son un
    // punto de partida editable, no una imposicion: se guardan como cualquier otra y se
    // borran igual.
    const semilla = $('rqSemilla');
    if (semilla) semilla.onclick = async () => {
      semilla.disabled = true;
      const base = [
        ['Horario', 'Estamos de lunes a sábado, de 9:00 a 6:00. Los domingos no trabajamos.'],
        ['Ubicación', (CFG.addressText || '') + ' ' + (CFG.mapsUrl || '')],
        ['Abono', 'Para apartar la fecha se deja un abono. El resto se paga el día de la sesión.'],
        ['Pedir comprobante', 'Cuando hagas el abono mándame el comprobante por aquí y el nombre de quien pagó, y te confirmo la fecha.'],
        ['Entrega', 'Las fotos editadas se entregan en unos días y te aviso por aquí en cuanto estén listas.'],
        ['Confirmar fecha', 'Déjame revisar la disponibilidad real de ese día y te confirmo enseguida.'],
      ];
      // Se cuenta lo que de verdad se guardo. Un agente no tiene permiso de escritura aqui, y
      // antes fallaban las seis y el panel decia igual "Seis respuestas creadas".
      let creadas = 0, motivo = '';
      for (const [title, body] of base) {
        const r = await llama({ action:'data', table:'quick_replies', operation:'insert',
          payload:{ title, body: body.trim(), created_at: new Date().toISOString() } });
        if (r.ok) creadas++; else motivo = r.error || motivo;
      }
      semilla.disabled = false;
      RAPIDAS = null;
      const nuevas = await cargaRapidas(true);
      filas.length = 0; filas.push(...(nuevas || []));
      pinta();
      if (!creadas) return avisa('No se creó ninguna', motivo || 'No tienes permiso para crear respuestas rápidas.');
      avisa(creadas === base.length ? 'Seis respuestas creadas' : creadas + ' de ' + base.length + ' creadas',
        creadas === base.length ? 'Edítalas o bórralas como quieras.' : (motivo || 'Algunas no se pudieron guardar.'));
    };
    $('rqAdd').onclick = async () => {
      const title = $('rqT').value.trim(), body = $('rqB').value.trim();
      if (!title || !body) return avisa('Faltan el título o el texto');
      $('rqAdd').disabled = true;
      const categoria = ($('rqCat') && $('rqCat').value) || '';
      const r = await llama({ action:'data', table:'quick_replies', operation:'insert',
        payload:{ title, body, categoria: categoria || null, created_at: new Date().toISOString() }, returning:true });
      $('rqAdd').disabled = false;
      if (!r.ok) return avisa('No se pudo guardar', r.error);
      RAPIDAS = null;
      const nuevas = await cargaRapidas(true);
      filas.length = 0; filas.push(...(nuevas || []));
      pinta();
      avisa('Guardada');
    };
  };
  pinta();
  cuerpo.onclick = async ev => {
    const usar = ev.target.closest('[data-usar]');
    if (usar) {
      const q = filas[Number(usar.dataset.usar)];
      const caja = $('texto');
      const t = q.body || q.text || '';
      caja.value = caja.value.trim() ? caja.value.trim() + '\n\n' + t : t;
      caja.dispatchEvent(new Event('input'));
      cierraModal(); caja.focus();
      return;
    }
    const borrar = ev.target.closest('[data-borrar]');
    if (borrar) {
      const q = filas[Number(borrar.dataset.borrar)];
      if (!await confirmaAqui('¿Borrar «' + (q.title || q.name) + '»?')) return;
      const r = await llama({ action:'data', table:'quick_replies', operation:'delete',
        filters:[{ kind:'eq', field:'id', value:q.id }] });
      if (!r.ok) return avisa('No se pudo borrar', r.error);
      filas.splice(Number(borrar.dataset.borrar), 1);
      RAPIDAS = null; pinta();
    }
  };
}

/* ---- Biblioteca de combos ------------------------------------------------ */
// El catalogo no vive en el CRM: se lee de la pagina publica, que es la que el
// negocio actualiza. Asi el precio que se le manda al cliente es exactamente el que
// ve en la web, sin una segunda lista que se quede vieja sin que nadie lo note.
const COMBO_PAGINA = CFG.publicCatalogUrl || 'https://dcarelacompufoto.com/combos.html';
const COMBO_IMG = 'https://dcarelacompufoto.com/combos-img/';
const COMBO_PDF = 'https://dcarelacompufoto.com/pdf/';
const COMBO_CATEGORIAS = { xv:'XV', infantil:'Infantil', graduacion:'Graduación',
  cumpleanos:'Cumpleaños', embarazadas:'Embarazadas' };
const COMBO_PDFS = [
  { cat:'xv', label:'XV', n:5 }, { cat:'infantil', label:'Infantil', n:8 },
  { cat:'graduacion', label:'Graduación', n:3 }, { cat:'cumpleanos', label:'Cumpleaños', n:15 },
  { cat:'embarazadas', label:'Embarazadas', n:8 },
];
let COMBOS = null;

function combosSlug(cat, nombre){
  return cat + '-' + String(nombre || '').toLowerCase().replace(/[^a-z0-9\s-]/g,'')
    .trim().replace(/\s+/g,'-').replace(/-+/g,'-');
}
async function cargaCombos(forzar){
  if (COMBOS && !forzar) return COMBOS;
  const r = await fetch(COMBO_PAGINA, { cache: forzar ? 'reload' : 'default' });
  if (!r.ok) throw new Error('catálogo HTTP ' + r.status);
  const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
  const filas = [];
  for (const sec of doc.querySelectorAll('section.sec[id]')) {
    const cat = String(sec.id || '').toLowerCase();
    if (!COMBO_CATEGORIAS[cat]) continue;
    for (const card of sec.querySelectorAll('article.combo')) {
      const nombre = String(card.querySelector('.cname')?.textContent || '').trim();
      if (!nombre) continue;
      const precioTxt = String(card.querySelector('.cprice b')?.textContent
        || card.querySelector('.cprice')?.textContent || '').trim();
      filas.push({
        cat, catLabel: COMBO_CATEGORIAS[cat], nombre,
        precio: precioTxt ? (precioTxt.startsWith('RD$') ? precioTxt : 'RD$' + precioTxt) : '',
        digital: String(card.querySelector('.cinc-total')?.textContent || '').trim(),
        items: [...card.querySelectorAll('.cinc li')].map(n => String(n.textContent||'').trim()).filter(Boolean),
        incluyeLabel: String(card.querySelector('.incbox .il')?.textContent || 'Incluye').trim(),
        incluye: String(card.querySelector('.incbox .iv')?.textContent || '').trim(),
        acento: String(card.dataset.accent || '').trim(),
        insignia: String(card.querySelector('.badge')?.textContent || '').trim(),
        nota: String(card.querySelector('.cinc-note')?.textContent || '').trim(),
        imagenCruda: card.querySelector('.ph')?.dataset.bg
          ? new URL(card.querySelector('.ph').dataset.bg, COMBO_PAGINA).href : '',
        tarjeta: COMBO_IMG + combosSlug(cat, nombre) + '.png',
      });
    }
  }
  COMBOS = filas;
  return filas;
}
/* ---- Tarjeta del combo y vestidos ---------------------------------------- */
// La tarjeta NO se dibuja aqui: se extrae de la web, que ya publica una por combo en
// /combos-img/<slug>.png. Son las buenas -- 1080x1350, con la marca, el precio y el
// ITBIS. Van sin telefono a proposito: la tarjeta se manda DENTRO de este chat, donde
// quien la recibe ya esta escribiendo al estudio, y el numero grabado en 39 PNG caduca
// solo (ya paso una vez).
//
// Las genera carela-compufoto-publish/scripts/generar_tarjetas_combo.mjs leyendo el MISMO
// combos.html que lee esta funcion, y catalog-v33.test.js exige que exista una tarjeta
// para cada uno de los 39 nombres usando este mismo combosSlug(). Si se cambia la regla
// del slug de aqui abajo, esa prueba y el generador avisan.
//
// El panel de texto de la tarjeta va encajado abajo y su alto lo decide el contenido: se
// eligio asi para no taparle la cara ni el vestuario al sujeto, que es lo que vende.
//
// Redibujarlas aqui seria mantener un segundo diseño que se separa del real en cuanto
// alguien toque la web.

// Los vestidos viven en la misma pagina, en .dress-block. Son la pregunta que mas repite
// una clienta de XV despues de ver el precio, y hasta ahora habia que buscarlos a mano.
let VESTIDOS = null;
async function cargaVestidos(forzar){
  if (VESTIDOS && !forzar) return VESTIDOS;
  const r = await fetch(COMBO_PAGINA, { cache: forzar ? 'reload' : 'default' });
  if (!r.ok) throw new Error('catálogo HTTP ' + r.status);
  const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
  VESTIDOS = [...doc.querySelectorAll('.dress-block .dcard img')].map(img => ({
    nombre: String(img.getAttribute('alt') || 'Vestido').trim(),
    url: new URL(img.getAttribute('src'), COMBO_PAGINA).href,
  })).filter(v => v.url);
  return VESTIDOS;
}

// Adjunta los vestidos como album. Se mandan comprimidos: son siete imagenes y el limite
// fiable de subida a Meta esta cerca de 5 MB por archivo -- pasarse devuelve el error
// #131053 despues de haber tardado en subir.
async function adjuntaVestidos(boton){
  const antes = boton ? boton.innerHTML : '';
  if (boton) { boton.disabled = true; boton.textContent = 'Preparando…'; }
  try {
    const lista = await cargaVestidos(false);
    if (!lista.length) throw new Error('el catálogo no trae vestidos');
    for (const v of lista) {
      const r = await fetch(v.url, { cache:'no-cache' });
      if (!r.ok) continue;
      const bruto = new File([await r.blob()], v.nombre + '.webp', { type:'image/webp' });
      // A JPEG siempre: los vestidos se publican en WebP y WhatsApp no acepta WebP como imagen.
      const blob = (await aJpeg(await cargaImagen(bruto), 1600, 0.88)) || bruto;
      COLA.push({ tipo:'image', mime: blob.type || 'image/jpeg',
        nombre: v.nombre + ' - DCarela.jpg', datos: await leeBase64(blob) });
    }
    pintaCola();
    const caja = $('texto');
    const t = 'Estos son los vestidos disponibles para la sesión. '
      + 'Dime cuál te gusta y lo reservamos para tu fecha.';
    caja.value = caja.value.trim() ? caja.value.trim() + '\n\n' + t : t;
    caja.dispatchEvent(new Event('input'));
    cierraModal();
    avisa('Vestidos listos', lista.length + ' imágenes en la cola. Revisa y pulsa enviar.');
  } catch (e) {
    if (boton) { boton.disabled = false; boton.innerHTML = antes; }
    avisa('No se pudieron preparar los vestidos', e?.message || String(e));
  }
}

// El pie de la tarjeta. Cuando va la tarjeta, el detalle YA esta dibujado dentro de la
// imagen: repetirlo aqui le llena la pantalla al cliente con la misma lista dos veces.
//
// Y no lleva URL. El dueño lo pidio explicito: si se manda la imagen, no se manda el
// enlace. Ademas la unica URL que llego a salir por aqui fue una vieja de netlify que el
// bot copio del historial, asi que cuanto menos enlace suelto ande por los mensajes, mejor.
function textoDeCombo(c, conTarjeta){
  const l = ['Te comparto el combo ' + c.nombre + (c.precio ? ' — ' + c.precio : '') + '.'];
  if (!conTarjeta) {
    if (c.digital) l.push('', c.digital + '.');
    if (c.items.length) l.push(...c.items.map(i => '• ' + i));
    if (c.incluye) l.push('', c.incluyeLabel + ': ' + c.incluye + '.');
  } else if (c.digital) {
    l.push('', c.digital + '. Todo el detalle está en la tarjeta.');
  }
  l.push('', 'Si te interesa, dime tu fecha tentativa y te confirmamos disponibilidad.');
  return l.join('\n');
}

async function adjuntaCombo(c, boton){
  if (!c) return;
  const antes = boton.innerHTML;
  boton.disabled = true; boton.textContent = 'Preparando…';
  try {
    // La tarjeta publicada del combo. Si por lo que sea no esta, se cae a la foto del
    // catalogo antes que dejar al agente sin nada que mandar -- pero se avisa, porque una
    // foto suelta no lleva el precio ni lo que incluye.
    let url = c.tarjeta, r = await fetch(url, { cache:'no-cache' });
    if (!r.ok && c.imagenCruda) {
      url = c.imagenCruda; r = await fetch(url, { cache:'no-cache' });
      if (r.ok) avisa('Sin tarjeta publicada', 'Va la foto del catálogo, sin el detalle del combo.');
    }
    if (!r.ok) throw new Error('imagen HTTP ' + r.status);
    const blob = await r.blob();
    const ext = url.split('.').pop().split('?')[0] || 'png';
    const datos = await leeBase64(blob);
    // Los combos salen con botones: el cliente toca en vez de escribir, y su respuesta
    // vuelve identificada -- se sabe QUE combo le intereso, no un "si" suelto que hay
    // que ir a buscar tres mensajes mas arriba.
    //
    // WhatsApp admite TRES botones como maximo, asi que se eligen segun el combo: los
    // vestidos son de sesiones XV, y ofrecerlos en un combo de graduacion seria prometer
    // algo que no existe.
    const esXV = c.cat === 'xv';
    COLA.push({ tipo:'image', mime: blob.type || 'image/jpeg',
      nombre: c.nombre + ' - DCarela.' + ext,
      datos,
      botones: [
        { id: 'combo_interesa:' + c.cat, titulo: 'Me interesa' },
        esXV ? { id: 'combo_vestidos', titulo: 'Ver vestidos' }
             : { id: 'combo_fecha:' + c.cat, titulo: 'Ver disponibilidad' },
        { id: 'combo_otros',             titulo: 'Ver otros combos' },
      ] });
    pintaCola();
    const caja = $('texto');
    const t = textoDeCombo(c, true);
    caja.value = caja.value.trim() ? caja.value.trim() + '\n\n' + t : t;
    caja.dispatchEvent(new Event('input'));
    cierraModal();
    avisa(c.nombre, 'Imagen y texto listos. Revisa y pulsa enviar.');
  } catch (e) {
    boton.disabled = false; boton.innerHTML = antes;
    avisa('No se pudo preparar ' + c.nombre, e?.message || String(e));
  }
}

async function adjuntaPdfCombos(cat, boton){
  const p = COMBO_PDFS.find(x => x.cat === cat); if (!p) return;
  const antes = boton.textContent;
  boton.disabled = true; boton.textContent = 'Preparando…';
  try {
    const url = COMBO_PDF + 'combos-' + cat + '.pdf';
    const r = await fetch(url, { cache:'force-cache' });
    if (!r.ok) throw new Error('PDF HTTP ' + r.status);
    const blob = await r.blob();
    const datos = await new Promise((res, rej) => {
      const l = new FileReader();
      l.onload = () => res(String(l.result).split(',')[1] || '');
      // Sin onerror la promesa no se resuelve NUNCA si la lectura falla, y el envio
      // se queda colgado con el boton deshabilitado y sin decir nada.
      l.onerror = () => rej(new Error('no se pudo leer el archivo'));
      l.readAsDataURL(blob);
    });
    COLA.push({ tipo:'document', mime:'application/pdf',
      nombre:'Combos ' + p.label + ' - DCarela.pdf', datos });
    pintaCola();
    const caja = $('texto');
    if (!caja.value.trim()) {
      caja.value = 'Te comparto nuestros combos de ' + p.label + '. Cualquier duda me dices, '
        + 'y si te interesa alguno dime tu fecha tentativa para confirmarte disponibilidad.';
      caja.dispatchEvent(new Event('input'));
    }
    cierraModal();
    avisa('Combos ' + p.label, 'PDF listo. Revisa y pulsa enviar.');
  } catch (e) {
    boton.disabled = false; boton.textContent = antes;
    avisa('No se pudo preparar el PDF', e?.message || String(e));
  }
}

// Lo unico que WhatsApp entrega con la ventana de 24 h cerrada. Sin esto no se
// puede reactivar a nadie, y por eso es lo primero que necesita una campaña.
//
// El servidor NO resuelve template_id: outboundPayload (transport-core.js:73-87) lee
// template_name, language_code y variables. Mandar el id, como hacia el panel
// anterior, se contesta con "plantilla requerida".
let PLANTILLAS = null;

async function cargaPlantillas(forzar){
  if (PLANTILLAS && !forzar) return PLANTILLAS;
  const r = await llama({ action:'templates', operation:'list',
    business_number: CFG.businessNumber || '' });
  if (!r.ok) { avisa('No se pudieron cargar las plantillas', r.error); return null; }
  PLANTILLAS = (r.templates || r.rows || r.items || []).filter(t => t && t.template_name);

function abreModal(html){
  let m = $('modal');
  if (!m) { m = document.createElement('div'); m.id = 'modal'; document.body.appendChild(m); }
  m.className = 'modal on';
  m.innerHTML = '<div class="caja">' + html + '</div>';
  m.onclick = ev => { if (ev.target === m) cierraModal(); };
  // Cerrar por defecto TODO lo que lleve data-cerrar. Antes lo cableaba cada cuadro por su
  // cuenta --diecinueve veces la misma linea-- y el que se olvidaba salia con un «Cancelar» que
  // no hacia nada: el dueño lo pulsaba y el cuadro se quedaba ahi. Quien necesite otra cosa al
  // cancelar (devolver null a una promesa, por ejemplo) lo sigue pudiendo pisar despues, porque
  // su asignacion corre cuando esta ya se hizo.
  m.querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });
  return m;
}
function cierraModal(){ const m = $('modal'); if (m) m.className = 'modal'; }
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { cierraModal(); cierraLupa(); } });

/* ---- Lupa: nombre con el que se descarga ---------------------------------- */
// ---- Lupa: piezas puras
const EXT_DE_MIME = {
  'image/jpeg':'jpg', 'image/png':'png', 'image/webp':'webp', 'image/gif':'gif',
  'video/mp4':'mp4', 'video/quicktime':'mov', 'video/webm':'webm', 'video/3gpp':'3gp',
  'audio/ogg':'ogg', 'audio/mpeg':'mp3', 'audio/mp4':'m4a', 'application/pdf':'pdf',
};
// El nombre con el que se guarda lo que se descarga desde la lupa: el del archivo si lo tiene
// (un documento), y si no uno que dice que es y cuando --imagen-20260928-153045.jpg--, como
// hace WhatsApp Web. Sin caracteres que Windows no admita en un nombre de archivo.
function nombreDeDescarga(m, mime, ahora = new Date()){
  const dado = String((m && (m.media_filename || m.attachments?.[0]?.fileName)) || '')
    .replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').trim().slice(0, 120);
  if (dado) return dado;
  const t = String(mime || '').split(';')[0].trim().toLowerCase();
  const tipo = t.startsWith('video/') ? 'video' : t.startsWith('audio/') ? 'audio'
    : t.startsWith('image/') ? 'imagen' : 'archivo';
  const p = n => String(n).padStart(2, '0');
  return tipo + '-' + ahora.getFullYear() + p(ahora.getMonth() + 1) + p(ahora.getDate())
    + '-' + p(ahora.getHours()) + p(ahora.getMinutes()) + p(ahora.getSeconds())
    + '.' + (EXT_DE_MIME[t] || 'bin');
}
// ---- Lupa: fin de las piezas puras

/* ---- Lupa de imagenes, videos y stickers ---------------------------------- */
// Que mensaje esta abierto en la lupa: de ahi salen Responder, Reenviar y el nombre al descargar.
let LUPA_ACTUAL = { msgId: '' };
function fijaLupa(msgId){ LUPA_ACTUAL = { msgId: String(msgId || '') }; }
function mensajeDeLupa(){
  return LUPA_ACTUAL.msgId ? (MSGS.find(x => (x.id || x.wamid) === LUPA_ACTUAL.msgId) || null) : null;
}
function cierraLupa(){
  const l = $('lupa');
  l.classList.remove('on', 'esperando', 'con-imagen', 'con-video');
  l.querySelector('img').src = '';
  const v = l.querySelector('video');
  v.pause(); v.removeAttribute('src'); v.load();
  LUPA_ACTUAL = { msgId: '' };
}
// Se abre YA, antes de tener el archivo: pedirlo bajo demanda puede tardar unos segundos
// y esto no es una ventana nueva, asi que no la alcanza el bloqueo de popups de Chrome.
function abreLupaCargando(){
  const l = $('lupa');
  l.classList.remove('con-imagen', 'con-video');
  l.classList.add('on', 'esperando');
  l.querySelector('[data-lupa="descargar"]').disabled = true;
}
function muestraLupa(tipo, src){
  const l = $('lupa');
  l.classList.remove('esperando');
  l.querySelector('[data-lupa="descargar"]').disabled = false;
  l.classList.add('on');
  if (tipo === 'video') {
    l.classList.remove('con-imagen'); l.classList.add('con-video');
    const v = l.querySelector('video'); v.src = src; v.play().catch(() => {});
  } else {
    l.classList.remove('con-video'); l.classList.add('con-imagen');
    l.querySelector('img').src = src;
  }
}
$('lupa').onclick = cierraLupa;
// El video no cierra la lupa al tocarlo: hacen falta los controles nativos (pausa, avance,
// volumen) sin que cada toque cierre la vista.
$('lupa').querySelector('video').onclick = ev => ev.stopPropagation();
// Responder, Reenviar y Descargar sobre el mensaje que esta abierto. Reenviar y Responder
// cierran la lupa: lo que sigue (elegir chat, escribir) pasa en el panel, no encima de la foto.
$('lupaBarra').onclick = async ev => {
  ev.stopPropagation();
  const boton = ev.target.closest('[data-lupa]');
  if (!boton || boton.disabled) return;
  const op = boton.dataset.lupa;
  if (op === 'cerrar') return cierraLupa();
  const m = mensajeDeLupa();
  if (op === 'descargar') {
    const l = $('lupa');
    const src = (l.classList.contains('con-video') ? l.querySelector('video') : l.querySelector('img')).getAttribute('src');
    if (!src) return;
    try {
      const blob = await (await fetch(src)).blob();
      descargaComoArchivo(blob, nombreDeDescarga(m, blob.type));
    } catch (e) { avisa('No se pudo descargar el archivo'); }
    return;
  }
  if (!m) return avisa('Ese mensaje ya no está abierto', 'Ciérralo y ábrelo de nuevo desde el chat.');
  cierraLupa();
  if (op === 'citar') { citando = m; pintaCita(); $('texto')?.focus(); }
  else if (op === 'reenviar') abreReenviar([m.id || m.wamid]);
};
// Delegado en el documento: los globos se repintan en cada mensaje nuevo y un
// manejador puesto sobre cada imagen se perderia en el siguiente repintado. Los stickers
// (.msticker) entran igual que las fotos: antes no tenian lupa y no habia otra forma de
// verlos de cerca.
document.addEventListener('click', ev => {
  const img = ev.target;
  if (img?.tagName === 'IMG' && (img.classList.contains('mmedia') || img.classList.contains('msticker'))) {
    fijaLupa(img.closest('[data-msg]')?.dataset.msg);
    muestraLupa('img', img.src);
  }
});

// Meta entrega la plantilla con los {{1}} {{2}} ya sustituidos, pero el panel los
// enseñaba en crudo: el agente veia "Hola {{1}}" y tenia que imaginarse el resultado. Y el
// historial guardaba "[plantilla saludo_corto_dcarela]" en vez del mensaje, asi que
// despues nadie podia saber que le habia llegado al cliente.
//
// La sustitucion es POSICIONAL, igual que la hace Meta: {{1}} es la primera variable.
function rellenaPlantilla(texto, variables, marcaHuecos){
  return String(texto || '').replace(/\{\{\s*(\d+)\s*\}\}/g, (m, n) => {
    const v = variables[Number(n) - 1];
    if (v) return v;
    // Un hueco sin rellenar se marca en vez de desaparecer: WhatsApp RECHAZA la plantilla
    // entera si falta una variable, y un hueco invisible parece un texto correcto.
    return marcaHuecos ? '\u0001' + n + '\u0002' : m;
  });
}
function previoPlantilla(texto, variables){
  return esc(rellenaPlantilla(texto, variables, true))
    .replace(/\u0001(\d+)\u0002/g, (m, n) => '<span class="hueco">falta ' + esc(n) + '</span>');
}

function pideVariables(t){
  const claves = Array.isArray(t.parameter_keys) ? t.parameter_keys : [];
  // Se rellena de la ficha lo que se pueda: el agente corrige, no teclea de cero.
  const dePrimeras = k => {
    // Las claves salen de PARAM_KEYS del servidor (templates-core.js) y ahi hay varias que
    // este mapa no cubria -- 'interes', 'hora', 'impresiones', 'dato', 'pedido' -- asi que
    // el campo salia vacio y habia que escribirlo a mano cada vez.
    const mapa = {
      nombre: nombreReal(sel),
      cliente: nombreReal(sel),
      combo: sel.selected_combo_name || '',
      precio: sel.selected_combo_price ? 'RD$' + sel.selected_combo_price : '',
      fecha: sel.tentative_date || '',
      categoria: sel.interested_category || '',
      interes: sel.interested_category || sel.selected_combo_name || '',
      hora: sel.tentative_time || '',
      pedido: sel.selected_combo_name || '',
      dato: sel.next_step_suggested || '',
    };
    return mapa[String(k).toLowerCase()] || '';
  };
  abreModal('<div class="mtapa"><b>' + esc(t.display_name || t.template_name) + '</b>'
    + '<button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo">'
    + '<div class="tplprevio-t">Así le va a llegar</div>'
    + '<div class="tplprevio" id="tplPrevio"></div>'
    + (claves.length
        ? claves.map((k,i) => '<div class="campo"><label>' + esc(k) + '</label>'
            + '<input data-var="' + i + '" value="' + esc(dePrimeras(k)) + '"></div>').join('')
        : '<p class="aviso">Esta plantilla no lleva variables.</p>')
    + '</div>'
    + '<div class="mpatas"><button class="btn-linea" data-cerrar>Cancelar</button>'
    +   '<button class="btn-solido" id="btnEnviarTpl">Enviar plantilla</button></div>');
  $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });

  const campos = [...$('modal').querySelectorAll('[data-var]')];
  const repintaPrevio = () => {
    const caja = $('tplPrevio'); if (!caja) return;
    if (!t.preview_text) { caja.textContent = 'Meta no devolvió el texto de esta plantilla.'; return; }
    caja.innerHTML = previoPlantilla(t.preview_text, campos.map(i => i.value.trim()));
  };
  campos.forEach(i => i.addEventListener('input', repintaPrevio));
  repintaPrevio();

  $('btnEnviarTpl').onclick = async () => {
    if (!esOficial(sel)) return avisa('Aquí no hacen falta plantillas',
      'Las plantillas son del número oficial (API); por este canal se escribe texto libre.');
    const variables = campos.map(i => i.value.trim());
    if (variables.some(v => !v)) return avisa('Faltan variables', 'WhatsApp rechaza la plantilla si alguna va vacía.');
    $('btnEnviarTpl').disabled = true;
    const r = await llama({
      action:'sendTemplate', conversation_id: sel.id || sel._id,
      template_name: t.template_name, language_code: t.language_code || 'es',
      variables,
      // El texto ya armado viaja para que el historial guarde el MENSAJE, no
      // "[plantilla nombre]". outboundPayload ignora este campo cuando la accion es
      // sendTemplate (transport-core.js:73), asi que no altera lo que se le manda a Meta:
      // solo arregla lo que queda escrito en la conversacion.
      text: t.preview_text ? rellenaPlantilla(t.preview_text, variables, false) : '',
    });
    $('btnEnviarTpl').disabled = false;
    if (!r.ok) return avisa('No se pudo enviar la plantilla', r.error);
    cierraModal();
    avisa('Plantilla enviada', t.display_name || t.template_name);
  };
}

/* ---- Audio --------------------------------------------------------------- */
// Portado tal cual del panel anterior, incluida la eleccion de libreria: ver el
// comentario del <script> de opus-recorder arriba. Cambiar esto por MediaRecorder
// hace que los audios "se envien" sin que nadie los reciba.
let grabadora = null, relojT = null, cancelada = false, enviarAlParar = false;

// Aborta y DESCARTA lo grabado. Se llama al cambiar de conversacion: marcar cancelada
// hace que el callback del encoder tire el audio en vez de encolarlo en el chat nuevo.
function abortaGrabacion(){
  if (!grabadora) { paraOndas(); return; }
  cancelada = true; enviarAlParar = false;
  try { grabadora.stop(); } catch (e) {}
  grabadora = null;
  clearInterval(relojT);
  paraOndas();
  const caja = document.getElementById('grabando');
  if (caja) caja.hidden = true;
}
let ctxAudio = null, analizador = null, dibujoT = null, fuenteMic = null;

// Dibuja el nivel REAL del microfono. Una animacion fija mentiria: con el microfono
// silenciado o tomado por otra aplicacion se veria igual de viva, y el audio saldria
// mudo sin que nadie lo notara hasta que el cliente lo dijera.
function arrancaOndas(rec){
  const lienzo = $('ondas'); if (!lienzo) return;
  // Se engancha al AudioContext del PROPIO grabador. La version anterior pedia un
  // segundo micrófono con getUserMedia porque opus-recorder no expone .stream, y abrir
  // una segunda captura mientras el grabador tiene la suya falla en Windows: ese era el
  // error que obligaba a recargar la pagina. Aqui no se abre nada nuevo, solo se
  // escucha el nodo que el grabador ya tiene montado.
  try {
    ctxAudio = rec?.audioContext;
    const nodo = rec?.recordingGainNode || rec?.monitorGainNode;
    if (!ctxAudio || !nodo) return;
    analizador = ctxAudio.createAnalyser();
    analizador.fftSize = 256;
    analizador.smoothingTimeConstant = 0.75;
    nodo.connect(analizador);
    fuenteMic = nodo;
  } catch (e) { analizador = null; return; }

  const datos = new Uint8Array(analizador.frequencyBinCount);
  const g = lienzo.getContext('2d');
  const historia = [];
  const pinta = () => {
    const escala = window.devicePixelRatio || 1;
    const an = lienzo.clientWidth, al = lienzo.clientHeight;
    if (lienzo.width !== an * escala) { lienzo.width = an * escala; lienzo.height = al * escala; }
    g.setTransform(escala, 0, 0, escala, 0, 0);
    g.clearRect(0, 0, an, al);

    analizador.getByteTimeDomainData(datos);
    // Valor eficaz de la onda: sube con la voz y se queda casi plano en silencio.
    let suma = 0;
    for (let i = 0; i < datos.length; i++) { const v = (datos[i] - 128) / 128; suma += v * v; }
    historia.push(Math.min(1, Math.sqrt(suma / datos.length) * 3.2));

    const ancho = 3, hueco = 2, cabe = Math.floor(an / (ancho + hueco));
    while (historia.length > cabe) historia.shift();
    g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--mut').trim() || '#667781';
    historia.forEach((n, i) => {
      const h = Math.max(2, n * (al - 4));
      g.fillRect(i * (ancho + hueco), (al - h) / 2, ancho, h);
    });
    dibujoT = requestAnimationFrame(pinta);
  };
  pinta();
}
function paraOndas(){
  if (dibujoT) cancelAnimationFrame(dibujoT);
  dibujoT = null;
  // Se desconecta SOLO el analizador. El contexto es del grabador, no mio: cerrarlo
  // aqui le cortaria la grabacion por debajo justo cuando esta terminando de codificar.
  try { if (fuenteMic && analizador) fuenteMic.disconnect(analizador); } catch (e) {}
  ctxAudio = analizador = fuenteMic = null;
}

function cableaMicrofono(){
  const caja = $('grabando'), boton = $('adjMic');
  const parar = () => { caja.hidden = true; clearInterval(relojT); grabadora = null; paraOndas(); };

  boton.onclick = async () => {
    if (!sel || !caja.hidden) return;
    // Instagram no acepta la nota de voz que graba el panel: opus-recorder solo sabe OGG/Opus y
    // Instagram no admite OGG. Se dice ANTES de grabar: descubrirlo al enviar es haber hablado
    // para nada. Messenger si la recibe (como archivo).
    if (canalDe(sel) === 'instagram') {
      return avisa('Instagram no acepta notas de voz grabadas aquí',
        'Grábala desde la app de Instagram, o adjunta un audio M4A, AAC o WAV como documento.');
    }
    if (!window.Recorder) return avisa('La grabación aún no está lista', 'Espera dos segundos y vuelve a tocar.');
    cancelada = false; enviarAlParar = false;
    try {
      grabadora = new Recorder({
        encoderPath:'https://cdn.jsdelivr.net/npm/opus-recorder@8.0.5/dist/encoderWorker.min.js',
        streamPages:false, numberOfChannels:1,
        encoderSampleRate:24000, encoderBitRate:24000,
        recordingGain:1, monitorGain:0,
      });
      grabadora.ondataavailable = async typed => {
        if (cancelada) return;
        const blob = new Blob([typed], { type:'audio/ogg' });
        // Por debajo de este tamaño no hay voz, solo el ruido de pulsar el boton.
        if (blob.size < 800) return avisa('Grabación demasiado corta', 'Vuelve a intentarlo.');
        const datos = await new Promise((res, rej) => {
          const l = new FileReader();
          l.onload = () => res(String(l.result).split(',')[1] || '');
          // Sin onerror la promesa nunca se resuelve y la nota de voz se pierde en
          // silencio: ni se envia ni se avisa.
          l.onerror = () => rej(new Error('no se pudo leer la grabación'));
          l.readAsDataURL(blob);
        }).catch(e => { avisa('No se pudo preparar el audio', e.message); return null; });
        if (!datos) return;
        COLA.push({ tipo:'audio', nombre:'nota-de-voz.ogg', mime:'audio/ogg', datos,
          kb: Math.round(blob.size / 1024) });
        pintaCola();
        // El envio se dispara AQUI, cuando el audio esta listo de verdad. Y va dentro de
        // try: si algo revienta en esta callback, el error queda fuera de cualquier
        // manejador (viene del worker del encoder) y deja el panel colgado hasta
        // recargar, que es justo lo que paso.
        if (enviarAlParar) {
          enviarAlParar = false;
          try { $('btnEnviar')?.click(); }
          catch (e) { avisa('No se pudo enviar la nota', e?.message || String(e)); }
        }
      };
      await grabadora.start();
    } catch (e) {
      // Se suelta la grabadora fallida: si se queda puesta, el siguiente intento cree
      // que hay una grabacion en curso y no arranca.
      grabadora = null;
      paraOndas();
      caja.hidden = true;
      const m = String(e?.message || e);
      return avisa('No se pudo grabar',
        /permission|denied|notallowed/i.test(m)
          ? 'El navegador bloqueó el micrófono. Permítelo en el candado de la barra de direcciones.'
          : m);
    }

    caja.hidden = false;
    // Las ondas salen del contexto del propio grabador. Si en alguna version no
    // estuviera, se graba igual: la onda es ayuda visual, no puede tumbar la grabacion.
    arrancaOndas(grabadora);
    const desde = Date.now();
    $('reloj').textContent = '0:00';
    relojT = setInterval(() => {
      const s = Math.floor((Date.now() - desde) / 1000);
      $('reloj').textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
      if (s >= 300) $('recEnviar').click();   // tope de cinco minutos
    }, 200);
  };

  $('recEnviar').onclick = () => {
    if (!grabadora) return;
    // El encoder termina en asincrono: se marca el envio y lo dispara ondataavailable
    // cuando el audio esta realmente listo. Enviar aqui mandaria un blob vacio.
    enviarAlParar = true;
    try { grabadora.stop(); } catch (e) {}
    parar();
  };
  $('recCancelar').onclick = () => {
    if (grabadora) { cancelada = true; try { grabadora.stop(); } catch (e) {} }
    parar();
  };
}

/* ---- Acciones sobre un mensaje ------------------------------------------- */
let citando = null;

function pintaCita(){
  const barra = $('barraCita'); if (!barra) return;
  barra.hidden = !citando;
  if (citando) barra.querySelector('.ctexto').textContent =
    String(citando.body || '').slice(0, 120) || '[archivo]';
}
function cancelaCita(){ citando = null; pintaCita(); }

/* ---- Selección múltiple de mensajes, para reenviar varios de una vez -------
   Como en WhatsApp Web: "Seleccionar" en el menú de un mensaje entra en el modo, aparece
   una casilla en cada globo, y una barra abajo deja añadir más y reenviarlos juntos. */
let modoSeleccion = false;
const SEL_MSGS = new Set();

function entraSeleccion(idInicial){
  modoSeleccion = true;
  SEL_MSGS.clear();
  if (idInicial) SEL_MSGS.add(idInicial);
  $('mensajes')?.classList.add('modo-seleccion');
  pintaMensajes();
  pintaBarraSeleccion();
}
function saleSeleccion(){
  modoSeleccion = false;
  SEL_MSGS.clear();
  $('mensajes')?.classList.remove('modo-seleccion');
  pintaMensajes();
  pintaBarraSeleccion();
}
function alternaSeleccion(id){
  if (SEL_MSGS.has(id)) SEL_MSGS.delete(id); else SEL_MSGS.add(id);
  if (!SEL_MSGS.size) return saleSeleccion();
  pintaMensajes();
  pintaBarraSeleccion();
}
function pintaBarraSeleccion(){
  const barra = $('barraSeleccion'); if (!barra) return;
  barra.hidden = !modoSeleccion;
  if (!modoSeleccion) return;
  const n = SEL_MSGS.size;
  barra.querySelector('.bstexto').textContent = n === 1 ? '1 mensaje seleccionado' : n + ' mensajes seleccionados';
  barra.querySelector('.bsreenviar').disabled = !n;
}

// Delegado en el documento: los globos se repintan con cada mensaje nuevo, y un
// manejador puesto sobre cada boton se perderia en el siguiente repintado.
document.addEventListener('click', async ev => {
  const casilla = ev.target.closest('.msel[data-msel]');
  if (casilla) { ev.stopPropagation(); alternaSeleccion(casilla.dataset.msel); return; }
  // Responder y Reenviar desde la propia tarjeta de un archivo (ver opsArchivo).
  const opArchivo = ev.target.closest('[data-gop]');
  if (opArchivo) {
    ev.stopPropagation();
    const m = MSGS.find(x => (x.id || x.wamid) === opArchivo.dataset.gmsg);
    if (!m) return;
