.interruptor.on{background:var(--ok);border-color:var(--ok);color:#fff}
/* La lista de destinatarios se enseña entera y con scroll propio: si no cabe, es
   preferible desplazarse que enviar a ciegas a gente que no se ha visto. */
.destinos{display:flex;flex-direction:column;gap:3px;max-height:230px;overflow-y:auto;
  margin-top:5px;font-size:12px;color:var(--mut)}
.destinos span{padding:3px 0;border-bottom:1px solid var(--line)}
.destinos span:last-child{border-bottom:0}

/* --- Agenda ------------------------------------------------------------------ */
.agbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.agtog{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.agtog button{padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--mut)}
.agtog button.on{background:var(--ink);color:var(--on-ink)}
.agfil{display:flex;gap:6px}
.agnav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.agnav b{flex:1;font-size:14px;text-transform:capitalize}
.agnav .btn-linea{padding:6px 12px}
.agsem{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:820px;margin-bottom:5px}
.agsem span{text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.6px;
  text-transform:uppercase;color:var(--mut)}
.agcal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:820px}
.agcel{min-height:62px;padding:6px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel);display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.agcel:hover{border-color:var(--line2);background:var(--hover)}
.agcel.fuera{opacity:.35}
.agcel.hoy{border-color:var(--ink)}
.agcel.sel{background:var(--ink)}
.agcel.sel .agnum{color:var(--on-ink)}
.agnum{font-size:12px;font-weight:600}
.agpuntos{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.agpuntos i{width:6px;height:6px;border-radius:50%}
.agpuntos i.firme{background:var(--ok)}
.agpuntos i.tent{background:var(--warn)}
/* Azul de Google: en el mes hay que distinguir de un vistazo lo que es del CRM --y se puede
   abrir-- de lo que solo esta apuntado en el calendario del dueño. */
.agpuntos i.gcal{background:#1a73e8}
.agpuntos em{font-style:normal;font-size:9px;color:var(--mut)}
.agpanel{margin-top:18px;max-width:820px}
.agdia{margin-bottom:18px;max-width:820px}
.agdcab{display:flex;justify-content:space-between;align-items:baseline;padding:0 0 7px;
  border-bottom:1px solid var(--line);margin-bottom:7px;font-size:12.5px;font-weight:650;
  text-transform:capitalize}
.agdcab b{font-size:11px;color:var(--mut)}
.agcita{display:flex;align-items:center;gap:12px;width:100%;padding:9px 11px;margin-bottom:5px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);cursor:pointer;text-align:left}
.agcita:hover{border-color:var(--line2);background:var(--hover)}
/* Un evento de Google no abre ninguna conversacion: no se puede pinchar y se dice con el
   cursor, no solo con el color. */
.agcita.aggoogle{border-left:3px solid #1a73e8;cursor:default}
.chip.gcal{background:rgba(26,115,232,.12);color:#1a73e8}
.agestado{font-size:11.5px;color:var(--mut)}
.agh{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:42px}
.agn{flex:1;min-width:0}
.agn b{display:block;font-size:13px}
.agn small{display:block;font-size:11px;color:var(--mut);margin-top:1px}

/* --- Configuración ----------------------------------------------------------- */
.cfggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;
  max-width:1180px;align-items:start}
.cfgc{padding:16px 18px 18px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel)}
.cfgc h3{margin:0 0 6px;font-size:13.5px;font-weight:650}
.cb-estado{padding:9px 12px;border-radius:10px;font-size:12.5px;margin-bottom:12px;background:var(--hover)}
.cb-estado.listo{background:rgba(37,211,102,.14)}
.cb-estado.apagado{background:rgba(209,75,75,.10)}
.cb-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.cb-kpis div{padding:9px 10px;border:1px solid var(--line);border-radius:10px}
.cb-kpis b{display:block;font-size:18px;font-weight:700}
.cb-kpis span{font-size:10.5px;color:var(--mut)}
.cb-fila{display:grid;grid-template-columns:130px 1fr 62px;gap:2px 10px;align-items:center;padding:5px 0;font-size:12.5px}
.cb-fila small{grid-column:2 / 4;color:var(--mut);font-size:10.5px}
.cb-barra{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.cb-barra i{display:block;height:100%;background:var(--ink);border-radius:99px}
.cb-conoc{display:grid;gap:1px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.cb-conoc span{color:var(--mut)}
.cb-conoc small{opacity:.7}
.cfgnota{margin:0 0 12px;font-size:12px;line-height:1.5;color:var(--mut)}
.cfgc .dato{margin-bottom:6px}
/* El interruptor lleva su explicacion al lado: uno suelto no dice que pasa al
   encenderlo, y estos cambian lo que se le manda a clientes reales. */
.cfgsw{display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:8px 0}
.cfgsw input{width:17px;height:17px;flex:0 0 auto;margin-top:2px;accent-color:var(--ink)}
.cfgsw b{display:block;font-size:13px;font-weight:600}
.cfgsw i{display:block;font-style:normal;font-size:11.5px;color:var(--mut);margin-top:2px}
.cfgc .tabla{max-width:none}
.cfgc select{padding:5px 7px;border:1px solid var(--line);border-radius:6px;
  background:var(--bg);color:var(--fg);font-size:12px}

/* --- Kanban ---------------------------------------------------------------- */
.kanban{display:flex;gap:11px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.columna{flex:0 0 246px;display:flex;flex-direction:column;max-height:calc(100dvh - 230px);
  border:1px solid var(--line);border-radius:var(--r2);background:var(--panel)}
.columna.encima{border-color:var(--ink);background:var(--hover)}
.ctitulo{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;
  border-bottom:1px solid var(--line);font-size:10px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;color:var(--mut)}

.ccuerpo{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;min-height:70px}
.ktarjeta{padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--bg);cursor:grab}
.ktarjeta:active{cursor:grabbing}
.ktarjeta.moviendo{opacity:.4}
.ktarjeta b{display:block;font-size:13px;font-weight:600}
.ktarjeta span{display:block;font-size:11.5px;color:var(--mut);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ktarjeta i{display:block;font-style:normal;font-size:10.5px;color:var(--meta);margin-top:3px}
.kmas{padding:7px;text-align:center;font-size:11.5px;color:var(--mut)}

/* --- Dashboard ------------------------------------------------------------- */
.cifras{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:11px;max-width:1180px}
.cifra{padding:15px 16px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);
  text-align:left;width:100%}
.cifra:hover{border-color:var(--line2);background:var(--hover)}
/* Solo se marcan las cifras que piden accion. Si todo grita, nada grita. */
.cifra.ojo b{color:var(--warn)}
.cifra.mal b{color:var(--bad)}
.cifra.bien b{color:var(--ok)}

/* --- Graficas --------------------------------------------------------------- */
.tablero{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;
  max-width:1180px;margin-top:22px}
.pgraf{padding:16px 18px 18px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel)}
.pgcab{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.pgcab b{font-size:13.5px}
.pgcab span{font-size:11px;color:var(--mut)}
.graf{width:100%;height:170px;overflow:visible}
.gguia{stroke:var(--line);stroke-width:1}
.gnum{fill:var(--mut);font-size:9px}
.garea{fill:var(--ink);opacity:.08}
.glinea{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.gpunto{fill:var(--panel);stroke:var(--ink);stroke-width:1.6}
.ganillo{fill:none;stroke-width:16;transform:rotate(-90deg);transform-origin:70px 70px}
.gtot{fill:var(--fg);font-size:21px;font-weight:700}
.anillo{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.anillo svg{width:140px;height:140px;flex:0 0 auto}
.leyenda{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mut)}
.leyenda span{display:flex;align-items:center;gap:7px}
.leyenda i{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.leyenda b{color:var(--fg)}
.embudo{display:flex;flex-direction:column;gap:9px}
.epaso{display:grid;grid-template-columns:118px minmax(0,1fr) 74px;gap:10px;align-items:center;font-size:12.5px}
.epaso .en{color:var(--mut);text-transform:capitalize}
.epaso .eb{height:20px;border-radius:5px;background:var(--hover);overflow:hidden}
.epaso .eb i{display:block;height:100%;background:var(--ink);opacity:.85}
.epaso .ev{text-align:right;font-weight:650}
.epaso .ev em{font-style:normal;font-weight:500;color:var(--mut);font-size:11px}
.cifra b{display:block;font-size:27px;font-weight:700;line-height:1.1;letter-spacing:-.5px}
.cifra span{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.cifra i{display:block;font-style:normal;font-size:10.5px;color:var(--meta);margin-top:2px}
.barras{display:flex;flex-direction:column;gap:7px;max-width:560px}
.barra{display:grid;grid-template-columns:132px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:12.5px}
.barra .be{color:var(--mut);text-transform:capitalize}
.barra .bp{height:8px;border-radius:4px;background:var(--hover);overflow:hidden}
.barra .bp i{display:block;height:100%;background:var(--ink);border-radius:4px}
.barra .bn{text-align:right;font-weight:650}

/* --- Login ----------------------------------------------------------------- */
#acceso{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:22px}
#acceso.oculto{display:none}
.tarjeta-acceso{width:100%;max-width:376px;padding:32px 30px;background:var(--panel);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--sombra)}
.tarjeta-acceso h1{margin:16px 0 4px;font-size:20px;font-weight:700}
.tarjeta-acceso p{margin:0 0 22px;color:var(--mut);font-size:13px}
.tarjeta-acceso .campo{margin-bottom:13px}
.tarjeta-acceso button{width:100%;margin-top:7px;padding:12px;border-radius:var(--r2);
  background:var(--ink);color:var(--on-ink);font-size:14px;font-weight:650}
.error{margin-top:13px;padding:10px 12px;border-radius:var(--r);font-size:12.5px;
  background:rgba(178,26,26,.1);color:var(--bad);display:none}
.error.on{display:block}

/* --- Aviso flotante -------------------------------------------------------- */
/* El aviso se apartaba con translate(-50%,140%): 140% de SU alto, que en un aviso de
   una linea no basta para sacarlo de la pantalla. Quedaba asomando por abajo como un
   punto negro permanente. Ahora se esconde de verdad, y visibility evita ademas que
   siga capturando clicks mientras esta fuera. */
#aviso{position:fixed;left:50%;bottom:26px;transform:translate(-50%,calc(100% + 40px));
  z-index:90;visibility:hidden;pointer-events:none;
  max-width:min(430px,92vw);padding:12px 17px;border-radius:var(--r2);
  background:var(--ink);color:var(--on-ink);font-size:13px;box-shadow:var(--sombra);
  transition:transform .24s ease,visibility 0s linear .24s}
#aviso.on{transform:translate(-50%,0);visibility:visible;transition-delay:0s}
#aviso b{display:block;margin-bottom:2px}

/* --- Estrecho -------------------------------------------------------------- */
@media(max-width:1080px){
  /* La ficha se cuelga de la altura REAL de la barra, no de un 60 escrito a mano. Al
     hacer que la barra crezca a dos filas en el telefono, este 60px la dejaba metida
     30px por debajo del borde: la cabecera del contacto quedaba tapada por la barra. */
  .ficha{position:fixed;right:0;top:var(--alto-barra);bottom:0;width:min(330px,92vw);z-index:30;
    display:none;box-shadow:var(--sombra)}
  .ficha.on{display:flex}
}
@media(max-width:760px){
  .lateral{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);
    transition:transform .2s;box-shadow:var(--sombra)}
  body.menu-abierto .lateral{transform:none}
  .hamb{display:flex}
  /* La barra crece en vez de recortarse. A 375px no caben hamburguesa, titulo, "Modo
     oscuro" y "Manual" en una fila, y como .der lleva flex:0 0 auto a proposito --para que
     "Manual" no se recorte cuando el titulo es largo-- lo que sobra no encogia: se salia de
     la pantalla, y esos dos botones no se podian ni leer ni pulsar. Ya pasaba antes de tocar
     el menu. */
  /* 'header.barra', no '.barra' a secas: esa clase la usa TAMBIEN cada barra de nota del
     panel de colaboradores (v2.html:3551 y 5248, dentro de .barras). Sin acotar, estas
     reglas les cambiaban el hueco y el relleno, y la de mas abajo les rompia la rejilla
     de tres columnas. */
  header.barra{gap:8px;padding:0 10px;min-width:0}
  header.barra .quien{display:none}
  header.barra .der{margin-left:auto;min-width:0}
  /* Estas nueve reglas son el movil de toda la vida: una sola columna, la lista a pantalla
     completa y el chat encima al abrirlo. Estuvieron un dia dentro del bloque de 430px por
     una llave que cerre de mas al anadirlo, asi que entre 431 y 760 --tablets pequenas y
     telefonos grandes en horizontal-- el panel se quedaba con la rejilla de escritorio y
     abrir un chat no ocultaba la lista. */
  #app.on{grid-template-columns:minmax(0,1fr)}
  header.barra,.lienzo{grid-column:1}
  .lista{width:100%}
  body.chat-abierto .lista{display:none}
  .conversacion,.vacio{display:none}
  body.chat-abierto .conversacion{display:flex}
  .hoja{padding:18px 16px}
  .agbarra strong{order:-1;width:100%;text-align:left}
  .agbarra .ag-suscribe{margin-left:0}
}
@media(max-width:430px){
  /* Solo aqui, y solo la barra. Con grid en vez de flex: envolver con flex no basta porque
     el titulo lleva flex:1 --base 0-- asi que la suma de las bases siempre cabe y la fila
     nunca se parte; lo que se salia era el reparto del sobrante, con la fila ya cerrada. En
     grid la segunda fila esta declarada, no deducida. */
  /* Dos filas, asi que la barra mide mas: se dice aqui para que la ficha la siga. */
  :root{--alto-barra:90px}
  header.barra{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;
    height:var(--alto-barra);padding:8px 10px;row-gap:8px;column-gap:8px}
  header.barra .der{grid-column:1/-1;justify-content:flex-end;margin-left:0}
}
.calidad-resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.calidad-kpi{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:14px}
.calidad-kpi b{display:block;font-size:25px}.calidad-kpi span{color:var(--mut);font-size:12px}
.calidad-lista{display:grid;gap:9px;margin-top:12px}
.calidad-filtros{display:grid;gap:10px;margin-top:14px}
.chips-tema{display:flex;flex-wrap:wrap;gap:6px}
.chip-tema{padding:6px 12px;border:1px solid var(--line2);border-radius:999px;font-size:12.5px;font-weight:600;background:var(--panel);color:var(--fg)}
.chip-tema:hover{background:var(--hover)}
.chip-tema.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.chip-tema .n{font-weight:700;opacity:.65;margin-left:2px}
.selects-filtro{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.selects-filtro label{display:grid;gap:3px;font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
.selects-filtro select{padding:6px 9px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);color:var(--fg);font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none}
.tema-tag,.dur-tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--hover);color:var(--mut);margin:0 6px 3px 0}
.dur-tag{background:rgba(217,154,37,.16);color:#8a5a00}
:root[data-tema="oscuro"] .dur-tag{color:#ffb454}
.calidad-aviso.baja{border-left:4px solid var(--line2)}
.calidad-aviso{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;
  background:var(--panel);border:1px solid var(--line2);border-radius:13px;padding:12px 14px}
.calidad-aviso.alta{border-left:4px solid #d14b4b}.calidad-aviso.media{border-left:4px solid #d99a25}
.calidad-aviso p{margin:4px 0;color:var(--mut);font-size:12px}.calidad-aviso .acciones{grid-column:2;grid-row:1/3}
.calidad-tabla{width:100%;border-collapse:collapse;margin-top:10px}.calidad-tabla th,.calidad-tabla td{
  text-align:left;padding:10px;border-bottom:1px solid var(--line2);font-size:13px}.calidad-tabla th{color:var(--mut);font-size:11px}
.calidad-score{display:inline-flex;min-width:38px;justify-content:center;border-radius:999px;padding:4px 8px;
  background:var(--hover);font-weight:700}.calidad-vacio{color:var(--mut);padding:18px 0}

/* =============================================================================
   CAPA APPLE (28/09/2026)
   Sustituye a la «capa moderna»: una sola capa, al final, que da a TODO el panel el lenguaje de
   Apple sin tocar el marcado ni el comportamiento --lo que cambia de estructura vive en el
   codigo de cada vista--. Quitar este bloque devuelve el aspecto anterior.

   Principios (los de las guias de Apple, no una imitacion de colores):
   - Color de sistema: azul de accion (#007AFF), grises de etiqueta (primario/secundario/terciario)
     y fondos agrupados (#F2F2F7 detras, blanco delante). El verde es solo para «bien» y para el
     chat, que conserva la pared y las burbujas de WhatsApp.
   - Superficies: tarjetas blancas de esquinas continuas (18-20 px), sin borde duro: una sombra
     doble muy suave y una linea de medio pixel. Las listas son «agrupadas»: filas con separador
     inset dentro de una sola tarjeta.
   - Tipografia: la del sistema (SF en Apple, Segoe UI Variable en Windows), titulos grandes con
     tracking negativo, rotulos en minuscula legible, nunca 9 px en mayusculas.
   - Controles: botones en pildora (azul el principal, gris tintado el resto), interruptores
     de iOS, campos con foco en anillo azul, barras y menus translucidos con desenfoque.
   - Iconos: baldosas de color con glifo blanco de trazo fino y uniforme, como los Ajustes del sistema.
   - Movimiento corto y con curva de Apple; se apaga con «reducir movimiento».
   ============================================================================= */
:root{
  --bg:#eef0f6; --panel:#ffffff; --line:rgba(60,60,67,.11); --line2:rgba(60,60,67,.24);
  --fg:#1c1c1e; --mut:#6c6c70; --ink:#1c1c1e; --on-ink:#ffffff;
  --hover:rgba(120,120,128,.10);
  --accent:#4a86e8; --accent-fuerte:#3a6fcb; --accent-suave:rgba(74,134,232,.13);
  --ok:#3f8f5a; --warn:#b0702f; --bad:#c8524a;
  --verde:#5fbf7a; --rojo:#e2665e; --naranja:#e3a35c; --amarillo:#e6c25a; --morado:#a98ad4;
  --r:10px; --r2:14px; --r3:20px;
  --sombra:0 24px 70px rgba(0,0,0,.28);
  --sombra-suave:0 1px 2px rgba(20,30,60,.04),0 12px 32px rgba(20,30,60,.06);
  --foco:0 0 0 4px rgba(74,134,232,.28);
  --cristal:rgba(255,255,255,.46);
  --vidrio:rgba(255,255,255,.58); --vidrio-fuerte:rgba(255,255,255,.80); --vidrio-borde:rgba(255,255,255,.75);
  --vidrio-luz:inset 0 1px 0 rgba(255,255,255,.9);
  --desenfoque:blur(24px) saturate(1.6);
  --boton:rgba(120,120,128,.10); --boton-hover:rgba(120,120,128,.18); --segmento:rgba(120,120,128,.12);
  --campo:rgba(255,255,255,.55);
  color-scheme:light;
  --curva:cubic-bezier(.25,.1,.25,1);
  --tipo:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI Variable Text","Segoe UI Variable",Inter,"Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;
}
:root[data-tema="oscuro"]{
  --bg:#0b0b0e; --panel:#1c1c1f; --line:rgba(84,84,88,.55); --line2:rgba(84,84,88,.8);
  --fg:#f5f5f7; --mut:#98989f; --ink:#f5f5f7; --on-ink:#000000;
  --hover:rgba(120,120,128,.24);
  --accent:#6ea4f4; --accent-fuerte:#8fb9f7; --accent-suave:rgba(110,164,244,.20);
  --ok:#63bf7c; --warn:#e3a35c; --bad:#e2766e;
  --sombra:0 24px 70px rgba(0,0,0,.7);
  --sombra-suave:0 0 0 .5px rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.4);
  --foco:0 0 0 4px rgba(110,164,244,.40);
  --cristal:rgba(30,30,34,.42);
  --vidrio:rgba(58,58,64,.40); --vidrio-fuerte:rgba(44,44,50,.78); --vidrio-borde:rgba(255,255,255,.09);
  --vidrio-luz:inset 0 1px 0 rgba(255,255,255,.08);
  --boton:rgba(255,255,255,.09); --boton-hover:rgba(255,255,255,.16); --segmento:rgba(255,255,255,.08);
  --campo:rgba(255,255,255,.07);
  color-scheme:dark;
}
body{font-family:var(--tipo);font-size:14px;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility}
::selection{background:var(--accent-suave)}
/* Barras de desplazamiento finas y discretas, como las de macOS. */
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:rgba(120,120,128,.38);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(120,120,128,.6);background-clip:content-box;border:3px solid transparent}

/* Foco: un anillo azul, como los campos de Apple. */
button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:0;box-shadow:var(--foco)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:0}

/* --- Lateral: lista lateral de macOS --------------------------------------------- */
.lateral{width:264px;background:var(--cristal);
  -webkit-backdrop-filter:blur(32px) saturate(1.7);backdrop-filter:blur(32px) saturate(1.7);
  border-right:0;box-shadow:inset -.5px 0 0 var(--line)}
.marca{padding:20px 16px 14px;border-bottom:0;gap:12px}
.marca img,.marca .sigla{width:40px;height:40px;border-radius:11px}
.marca .sigla{background:linear-gradient(160deg,#9cc4f5,#6f9be4 62%,#8d8fe0);color:#fff;font-weight:700;
  font-size:14px;letter-spacing:.2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px rgba(80,120,200,.22)}
.marca b{font-size:15px;font-weight:650;letter-spacing:-.02em}
.marca span{font-size:11.5px}
.nav{padding:4px 10px 10px}
.nav a{padding:5px 8px;margin-bottom:1px;border-radius:9px;gap:10px;font-size:13.5px;font-weight:500;
  color:var(--fg);transition:background .15s var(--curva)}
.nav a:hover{background:var(--hover)}
.nav a.on{background:var(--vidrio-fuerte);color:var(--fg);font-weight:600;box-shadow:var(--vidrio-luz),0 0 0 .5px var(--vidrio-borde),0 2px 8px rgba(20,30,60,.06)}
/* La baldosa de color con el glifo blanco: el icono de cada apartado. */
.nav a svg{--tint:#8e94a0;width:28px;height:28px;padding:6px;border-radius:9px;stroke-width:1.65;
  color:color-mix(in srgb,var(--tint) 80%,#20232b);
  background:color-mix(in srgb,var(--tint) 15%,rgba(255,255,255,.35));
  box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--tint) 26%,transparent),inset 0 1px 0 rgba(255,255,255,.7)}
:root[data-tema="oscuro"] .nav a svg{color:color-mix(in srgb,var(--tint) 78%,#fff);background:color-mix(in srgb,var(--tint) 22%,rgba(255,255,255,.04));
  box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--tint) 34%,transparent),inset 0 1px 0 rgba(255,255,255,.10)}
.nav a[data-vista="planning"] svg{--tint:#6c95e8}
.nav a[data-vista="conversations"] svg{--tint:#5fb47d}
.nav a[data-vista="estados"] svg{--tint:#df7a92}
.nav a[data-vista="hoy"] svg{--tint:#e0a94e}
.nav a[data-vista="agenda"] svg{--tint:#df766e}
.nav a[data-vista="dashboard"] svg{--tint:#8b8bdf}
.nav a[data-vista="funnel"] svg{--tint:#dfa25c}
.nav a[data-vista="prospecting"] svg{--tint:#b08ad6}
.nav a[data-vista="poscustomers"] svg{--tint:#5cb6ab}
.nav a[data-vista="satisfaccion"] svg{--tint:#dcb256}
.nav a[data-vista="informes"] svg{--tint:#8b8bdf}
.nav a[data-vista="limpieza"] svg{--tint:#8e94a0}
.nav a[data-vista="anuncios"] svg{--tint:#df7890}
.nav a[data-vista="campanas"] svg{--tint:#6fafdf}
.nav a[data-vista="plantillas"] svg{--tint:#8a97ad}
.nav a[data-vista="reminders"] svg{--tint:#e2a35a}
.nav a[data-vista="canales"] svg{--tint:#62b1b6}
.nav a[data-vista="config"] svg{--tint:#8a8f99}
.nav a .cuenta{padding:1px 7px;font-size:11px;font-weight:650;border-radius:999px;background:color-mix(in srgb,var(--rojo) 88%,#fff);color:#fff}
.nav a.on .cuenta{background:var(--rojo);color:#fff}
.nav .secundarias{border-top:0;margin-top:6px;padding-top:2px}
.nav .rotulo{font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;padding:12px 8px 4px;color:var(--mut)}
/* Los accesos a Instagram, Messenger y Marketplace: mas pequenos y sangrados, como subelementos. */
.nav .accesos{margin:0 0 4px}
.nav .accesos a{padding:3px 8px 3px 40px;font-size:12.5px;color:var(--mut)}
.nav .accesos a svg{width:20px;height:20px;padding:4px;border-radius:6px}
.nav .accesos-cuerpo a:nth-child(1) svg{--tint:#d9698f}
.nav .accesos-cuerpo a:nth-child(2) svg{--tint:#6a9be0}
.nav .accesos-cuerpo a:nth-child(3) svg{--tint:#5fb47d}
/* Acordeon: las redes no se ven siempre; una fila con flecha las abre y se acuerda de como quedo. */
.nav .accesos-cab{display:flex;align-items:center;justify-content:space-between;width:100%;padding:3px 10px 3px 40px;border:0;background:none;
  font:inherit;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;border-radius:8px;text-align:left}
.nav .accesos-cab:hover{color:var(--fg)}
.nav .accesos-cab .chev{display:inline-block;transition:transform .18s;font-size:15px;line-height:1}
.nav .accesos-cab[aria-expanded="true"] .chev{transform:rotate(90deg)}
.nav .accesos-cuerpo[hidden]{display:none}
.nav .nav-fila{display:flex;align-items:center;gap:2px}
.nav .nav-fila>a{flex:1 1 auto;min-width:0}
.nav .nav-flecha{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;background:none;border-radius:8px;color:var(--mut);cursor:pointer;margin-right:4px}
.nav .nav-flecha:hover{background:var(--hover);color:var(--fg)}
.nav .nav-flecha svg{transition:transform .18s}
.nav .nav-flecha[aria-expanded="true"] svg{transform:rotate(180deg)}
.pie{border-top:0;padding:10px 14px 14px}
.pie .estado{font-size:11.5px}
.pie button{border:0;background:var(--hover);border-radius:10px;font-weight:600;padding:9px;
  transition:background .15s var(--curva)}
.pie button:hover{background:rgba(120,120,128,.2)}

/* --- Barra superior: translucida ---------------------------------------------------- */
header.barra{padding:0 20px;background:var(--cristal);
  -webkit-backdrop-filter:blur(32px) saturate(1.7);backdrop-filter:blur(32px) saturate(1.7);
  border-bottom:0;box-shadow:0 .5px 0 var(--line)}
.titulo{font-size:17px;font-weight:650;letter-spacing:-.022em}
.quien{font-size:12px}
header.barra .der .btn-linea{padding:7px 14px}

/* --- Botones: pildoras ---------------------------------------------------------------------- */
.btn-linea{padding:8px 15px;border:0;border-radius:999px;background:var(--hover);color:var(--fg);
  font-size:13px;font-weight:600;letter-spacing:-.006em;
  transition:background .15s var(--curva),transform .1s var(--curva),opacity .15s}
.btn-linea:hover:not(:disabled){background:rgba(120,120,128,.2)}
.btn-linea:active:not(:disabled){transform:scale(.97)}
.btn-linea.danger{background:rgba(255,59,48,.12);color:var(--bad)}
.btn-linea.danger:hover:not(:disabled){background:rgba(255,59,48,.2)}
.btn-solido{padding:9px 18px;border-radius:999px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;
  box-shadow:none;transition:background .15s var(--curva),transform .1s var(--curva),opacity .15s}
.btn-solido:hover:not(:disabled){background:var(--accent-fuerte);box-shadow:none;transform:none}
.btn-solido:active:not(:disabled){transform:scale(.97)}
.btn-solido.peligro{background:var(--rojo);color:#fff}
.filtro{padding:6px 13px;border-radius:999px;background:var(--hover);color:var(--fg);font-weight:600;font-size:12.5px;
  transition:background .15s var(--curva),color .15s}
.filtro:hover{background:rgba(120,120,128,.2)}
.filtro.on{background:var(--ink);color:var(--on-ink)}
.tplchip,.ejemplo{border:0;border-radius:999px;background:var(--hover);padding:7px 13px;font-weight:600}
.tplchip:hover,.ejemplo:hover{background:rgba(120,120,128,.2)}
.chip-tema{border:0;background:var(--hover);border-radius:999px;padding:7px 14px;font-weight:600;color:var(--fg)}
.chip-tema:hover{background:rgba(120,120,128,.2)}
.chip-tema.on,:root[data-tema="oscuro"] .chip-tema.on{background:var(--accent);color:#fff}
.etq{border-radius:999px}
.chip{border-radius:999px;padding:3px 9px;font-size:11px;letter-spacing:0}

/* --- Campos ---------------------------------------------------------------------------------- */
.campo label,.seccion,.dato .k,.selects-filtro label{font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--mut)}
.campo label{margin-bottom:6px}
.campo input,.campo select,.campo textarea,.entrada-linea,.selects-filtro select,.buscaprospectos input,
.lista .cabeza input,.lista .cabeza select{padding:10px 13px;border:0;border-radius:11px;background:var(--hover);color:var(--fg);
  box-shadow:inset 0 0 0 .5px var(--line);transition:box-shadow .15s var(--curva),background .15s var(--curva)}
.lista .cabeza input,.lista .cabeza select{height:38px;padding:0 13px}
.campo input:hover,.campo select:hover,.campo textarea:hover{background:rgba(120,120,128,.16)}
.campo input:focus,.campo select:focus,.campo textarea:focus,.entrada-linea:focus,.selects-filtro select:focus,
.buscaprospectos input:focus,.lista .cabeza input:focus,.prompt textarea:focus{background:var(--panel);
  box-shadow:0 0 0 1.5px var(--accent),var(--foco);outline:0}
.prompt textarea{border-radius:var(--r3);box-shadow:var(--sombra-suave)}
::placeholder{color:rgba(120,120,128,.8)}
/* Interruptor de iOS. */
.cfgsw{flex-direction:row-reverse;align-items:center;justify-content:space-between;padding:11px 0;gap:14px}
.cfgsw>span{flex:1;min-width:0}
.cfgsw input{-webkit-appearance:none;appearance:none;width:44px;height:27px;margin:0;border-radius:999px;position:relative;
  background:rgba(120,120,128,.32);flex:0 0 auto;cursor:pointer;transition:background .22s var(--curva)}
.cfgsw input::after{content:"";position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.04);transition:transform .22s var(--curva)}
.cfgsw input:checked{background:var(--verde)}
.cfgsw input:checked::after{transform:translateX(17px)}
.cfgsw input:focus-visible{box-shadow:var(--foco)}
input[type="checkbox"],input[type="radio"]{accent-color:var(--accent)}

/* --- Paginas ------------------------------------------------------------------------------------ */
.hoja{padding:34px clamp(20px,4vw,48px) 56px}
.hoja h1{font-size:32px;font-weight:700;letter-spacing:-.035em;margin-bottom:6px}
.hoja .bajada{font-size:14px;line-height:1.5;margin-bottom:26px;max-width:680px}
.seccion{margin:0 0 10px}
.hoja>.seccion{font-size:20px;font-weight:700;letter-spacing:-.025em;color:var(--fg);margin:36px 0 6px}

/* --- Tarjetas: superficies blancas de esquinas continuas --------------------------------- */
.cfggrid{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px;max-width:1240px}
.cfgc{padding:22px 24px 24px;border:0;border-radius:var(--r3);box-shadow:var(--sombra-suave)}
.cfgc h3{font-size:17px;font-weight:650;letter-spacing:-.022em;margin-bottom:8px}
.cfgnota{font-size:13px;line-height:1.55}
.grupo{border:0;border-radius:var(--r3);background:var(--panel);box-shadow:var(--sombra-suave);margin-bottom:14px}
.grupo>summary{padding:15px 18px;font-size:14px;font-weight:600;letter-spacing:-.01em;text-transform:none}
.grupo>summary:hover{background:var(--hover)}
.grupo .dentro{padding:2px 18px 18px}
.grupo .nota{font-size:12px}
.canal{border:0;border-radius:var(--r3);box-shadow:var(--sombra-suave);max-width:820px}
.dato{border:0;border-radius:12px;background:var(--hover)}
.propuesta{border:0;border-radius:var(--r3);box-shadow:var(--sombra-suave)}
.tpl{border:0;border-radius:16px;background:var(--panel);box-shadow:var(--sombra-suave)}
.tpl:hover{background:var(--panel);box-shadow:0 0 0 1.5px var(--accent-suave),var(--sombra-suave)}
.calidad-kpi,.calidad-aviso{border:0;border-radius:var(--r3);box-shadow:var(--sombra-suave)}
.calidad-kpi b{font-size:30px;letter-spacing:-.03em}
.cb-kpis div,.cb-estado{border:0;background:var(--hover);border-radius:12px}

/* Cifras del Dashboard: la misma medida para todas (auto-fill, no auto-fit: con auto-fit la ultima
   fila se estira y salen tarjetas de anchos distintos). */
.cifras{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;max-width:1240px}
.cifra{padding:20px 20px 18px;border:0;border-radius:var(--r3);box-shadow:var(--sombra-suave);
  transition:transform .2s var(--curva),box-shadow .2s var(--curva)}
.cifra:hover{background:var(--panel);transform:translateY(-2px);
  box-shadow:0 0 0 .5px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.04),0 16px 36px rgba(0,0,0,.09)}
.cifra b{font-size:34px;font-weight:700;letter-spacing:-.04em}
.cifra span{font-size:13px}
.cifra i{font-size:11.5px}
.tablero{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px;max-width:1240px}
.pgraf{padding:20px 22px 22px;border:0;border-radius:var(--r3);box-shadow:var(--sombra-suave)}
.pgcab b{font-size:16px;font-weight:650;letter-spacing:-.02em}
.pgcab span{font-size:12px}
.glinea{stroke:var(--accent);stroke-width:2.4}
.garea{fill:var(--accent);opacity:.10}
.gpunto{stroke:var(--accent)}
.epaso .eb{height:10px;border-radius:999px}
.epaso .eb i{background:var(--accent);opacity:1;border-radius:999px}
.bp{border-radius:999px}
.calidad-resumen{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}

/* --- Listas agrupadas (tablas): una tarjeta, filas con separador inset ------------------ */
.tabla{border:0;border-radius:var(--r3);background:var(--panel);box-shadow:var(--sombra-suave);max-width:1240px}
.fila{padding:13px 18px;border-bottom:0;box-shadow:inset 0 -.5px 0 var(--line);margin-left:0;
  transition:background .12s var(--curva)}
.fila:not(.cabecera):hover{background:var(--hover)}
.fila:last-child{box-shadow:none}
.fila.cabecera{background:transparent;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--mut);
  padding-top:15px;padding-bottom:9px}
.calidad-tabla{border:0}
.calidad-tabla th{font-size:12px;font-weight:600;letter-spacing:0;text-transform:none}

/* --- Funnel: carriles y tarjetas -------------------------------------------------------------- */
.kanban{gap:16px;padding:2px 2px 18px}
.columna{flex:0 0 300px;max-height:calc(100dvh - 240px);border:0;border-radius:var(--r3);background:rgba(120,120,128,.09)}
.columna.encima{background:var(--accent-suave);box-shadow:inset 0 0 0 2px var(--accent)}
.ctitulo{padding:15px 16px 11px;border-bottom:0;font-size:13.5px;font-weight:650;letter-spacing:-.01em;text-transform:capitalize;color:var(--fg)}
.ctitulo b{font-size:12px;font-weight:650;padding:2px 9px;border-radius:999px;background:var(--hover);color:var(--mut)}
.ccuerpo{padding:2px 10px 12px;gap:9px}
.ktarjeta{padding:12px 14px;border:0;border-radius:14px;background:var(--panel);
  box-shadow:0 0 0 .5px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.06);
  transition:transform .15s var(--curva),box-shadow .15s var(--curva)}
.ktarjeta:hover{transform:translateY(-1px);box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.10)}
.ktarjeta b{font-size:14px;font-weight:600;letter-spacing:-.012em}
.ktarjeta span{font-size:12.5px;margin-top:3px}
.ktarjeta i{font-size:11.5px;margin-top:5px}
.kmas{font-size:12.5px;padding:9px}
/* Leads parados: una rejilla de tarjetas de la misma medida, no una fila por cada regla. */
.lp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px;max-width:1240px;align-items:start}
.lp-card{background:var(--panel);border-radius:var(--r3);box-shadow:var(--sombra-suave);padding:20px 22px 12px;min-width:0}
.lp-cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lp-cab b{font-size:16px;font-weight:650;letter-spacing:-.02em}
.lp-num{font-size:12px;font-weight:650;padding:3px 10px;border-radius:999px;background:var(--accent-suave);color:var(--accent);flex:0 0 auto}
.lp-porque{margin:6px 0 10px;font-size:13px;line-height:1.5;color:var(--mut)}
.lp-fila{display:flex;align-items:center;gap:10px;padding:10px 0;box-shadow:inset 0 .5px 0 var(--line)}
.lp-quien{flex:1;min-width:0}
.lp-quien b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-quien small{display:block;font-size:12px;color:var(--mut);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-acc{display:flex;gap:6px;flex:0 0 auto}
.lp-acc .btn-linea{padding:6px 12px;font-size:12.5px}
.lp-mas{display:block;width:100%;padding:12px 0 8px;font-size:13px;font-weight:600;color:var(--accent);text-align:center;
  box-shadow:inset 0 .5px 0 var(--line)}
.lp-mas:hover{color:var(--accent-fuerte)}
@media(max-width:520px){.lp-grid{grid-template-columns:1fr}}

/* --- Lista de chats y ficha -------------------------------------------------------------------- */
.lista{border-right:0;box-shadow:inset -.5px 0 0 var(--line)}
.chat{padding:11px 16px;transition:background .12s var(--curva)}
.chat:hover{background:var(--hover)}
.chat.on{background:var(--accent-suave);box-shadow:none}
.chat .nom{font-weight:600;letter-spacing:-.012em}
.ficha{border-left:0;box-shadow:inset .5px 0 0 var(--line)}
.escribir textarea{border-radius:20px}
.cabecera{box-shadow:0 .5px 0 var(--line);border-bottom:0}

/* --- Cuadros de dialogo: hojas de Apple ------------------------------------------------------ */
.modal{background:rgba(0,0,0,.36);-webkit-backdrop-filter:blur(8px) saturate(1.2);backdrop-filter:blur(8px) saturate(1.2)}
.modal .caja{border-radius:22px;border:0;box-shadow:var(--sombra);background:var(--panel)}
.mtapa{padding:18px 22px 14px;border-bottom:0;font-size:17px;letter-spacing:-.02em}
.mtapa b{font-weight:650}
.mcuerpo{padding:4px 22px 16px}
.mpatas{padding:14px 22px 18px;border-top:0;background:transparent}
.cerrarm{width:28px;height:28px;border-radius:50%;background:var(--hover);font-size:18px;line-height:28px;text-align:center}
.cerrarm:hover{background:rgba(120,120,128,.24)}
.gmenu,.mas .menu,.st-menu,.anuevomenu,.amenu{border:0;border-radius:14px;box-shadow:var(--sombra),0 0 0 .5px var(--line);
  background:var(--cristal);-webkit-backdrop-filter:saturate(1.8) blur(24px);backdrop-filter:saturate(1.8) blur(24px)}

/* --- Acceso ------------------------------------------------------------------------------------- */
.tarjeta-acceso{border:0;border-radius:26px;box-shadow:var(--sombra)}
.tarjeta-acceso button{border-radius:999px;background:var(--accent);color:#fff;font-weight:600}

/* --- Estados: lista y visor ----------------------------------------------------------------- */
.st-cab h2{font-size:22px;font-weight:700;letter-spacing:-.03em}
.st-fila{border-radius:12px;transition:background .12s var(--curva)}
.st-sec{font-size:12px;font-weight:600;letter-spacing:0;text-transform:none}
.st-vermas{display:block;width:calc(100% - 24px);margin:8px 12px 16px;padding:11px;border-radius:12px;background:var(--hover);
  color:var(--accent);font-size:13px;font-weight:600;transition:background .15s var(--curva)}
.st-vermas:hover{background:rgba(120,120,128,.2)}

/* --- Estados vacios ----------------------------------------------------------------------------- */
.vacio-apple{display:flex;flex-direction:column;align-items:center;text-align:center;padding:52px 28px;max-width:640px;
  background:var(--panel);border-radius:var(--r3);box-shadow:var(--sombra-suave);color:var(--mut)}
.vacio-apple svg{width:46px;height:46px;stroke-width:1.35;color:rgba(120,120,128,.55);margin-bottom:14px}
.vacio-apple b{font-size:17px;font-weight:650;letter-spacing:-.02em;color:var(--fg)}
.vacio-apple p{margin:6px 0 0;max-width:420px;font-size:13.5px;line-height:1.5}
/* «Ningun ajuste coincide» salia siempre al final de Configuracion: display:flex le ganaba al atributo hidden. */
.vacio-apple[hidden]{display:none}

/* --- Controles segmentados: los filtros de una pagina (Anuncios y otros) -------------------- */
.hoja .filtros{display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:var(--hover);cursor:default;
  -webkit-mask-image:none;mask-image:none;overflow:visible}
.hoja .filtros .filtro{border-radius:9px;background:transparent;padding:6px 16px;font-weight:600;color:var(--fg)}
.hoja .filtros .filtro:hover{background:rgba(120,120,128,.14)}
.hoja .filtros .filtro.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.05)}
:root[data-tema="oscuro"] .hoja .filtros .filtro.on{background:#636366;color:#fff}

/* --- Formularios de una pagina dentro de una tarjeta ----------------------------------------- */
#vista-campanas .prompt{max-width:820px;padding:24px 26px 26px;background:var(--panel);border-radius:var(--r3);box-shadow:var(--sombra-suave)}
#vista-campanas .prompt textarea{box-shadow:none}
#vista-campanas .grupo{max-width:820px}
.hoja .prompt .aviso{margin-bottom:16px}

/* --- Barras y medidores en el azul de accion --------------------------------------------------- */
.bp i,.cb-barra i{background:var(--accent)}
.cb-barra{background:var(--hover)}

/* --- Compositor del chat: pildora y boton redondo azul ----------------------------------------- */
.escribir{border-top:0;box-shadow:0 -.5px 0 var(--line);padding:10px 16px;gap:8px}
.escribir textarea{border:0;border-radius:20px;background:var(--hover);padding:10px 16px;box-shadow:none}
.escribir textarea:focus{background:var(--panel);box-shadow:0 0 0 1.5px var(--accent),var(--foco)}
.enviar{width:36px;height:36px;background:var(--accent);color:#fff;transition:background .15s var(--curva),transform .1s var(--curva)}
.enviar:hover:not(:disabled){background:var(--accent-fuerte)}
.enviar:active:not(:disabled){transform:scale(.94)}
.enviar svg{width:18px;height:18px}
.adj{width:34px;height:34px;color:var(--mut)}
.adj svg{width:21px;height:21px;stroke-width:1.75}
.adj:hover{background:var(--hover);color:var(--fg)}
.adj.hd{border:0;background:var(--hover);font-size:11px;font-weight:700;width:auto;padding:0 9px;border-radius:9px}
.adj.hd.on{background:var(--accent);color:#fff}

/* --- Cabecera del chat --------------------------------------------------------------------------- */
.cabecera .modo{border:0;border-radius:999px;background:var(--hover);padding:7px 14px;font-weight:600;font-size:12.5px}
.cabecera .modo:hover{background:rgba(120,120,128,.2)}
.mas>button{color:var(--mut)}

/* Todos los iconos con el mismo trazo. */
.adj svg,.st-icono svg,.st-ctl svg,.hamb svg{stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* --- Agenda: un calendario como el de Apple, una sola tarjeta con lineas finas --------------- */
.agbar{gap:10px;margin-bottom:18px}
.agtog{display:inline-flex;padding:3px;gap:2px;border:0;border-radius:11px;background:var(--hover)}
.agtog button{padding:6px 16px;border-radius:9px;color:var(--fg);font-weight:600}
.agtog button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.05)}
:root[data-tema="oscuro"] .agtog button.on{background:#636366;color:#fff}
.agfil{gap:4px}
.agnav{margin-bottom:14px}
.agnav b{font-size:22px;font-weight:700;letter-spacing:-.03em}
.agnav .btn-linea{padding:6px 14px}
.agsem{max-width:1000px;gap:0;margin-bottom:6px}
.agsem span{font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;padding-left:10px;text-align:left}
.agcal{max-width:1000px;gap:0;background:var(--panel);border-radius:var(--r3);box-shadow:var(--sombra-suave);overflow:hidden}
.agcel{min-height:92px;padding:9px 10px;border:0;border-radius:0;background:transparent;
  box-shadow:inset -.5px -.5px 0 var(--line);transition:background .12s var(--curva)}
.agcel:hover{background:var(--hover);border:0}
.agcel.fuera{opacity:.4}
.agcel .agnum{font-size:14px;font-weight:600;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%}
.agcel.hoy{border:0}
.agcel.hoy .agnum{background:var(--rojo);color:#fff}
.agcel.sel{background:var(--accent-suave)}
.agcel.sel .agnum{color:var(--fg)}
.agcel.sel.hoy .agnum{color:#fff}
.agpanel,.agdia,.agproximas{max-width:1000px}
.agcita{border:0;border-radius:14px;background:var(--panel);box-shadow:var(--sombra-suave)}
.agcita:hover{background:var(--panel);box-shadow:0 0 0 1.5px var(--accent-suave),var(--sombra-suave)}
.agdcab{font-size:15px;font-weight:650;letter-spacing:-.015em;border-bottom:0}

/* =============================================================================
   VIDRIO. Las superficies son translucidas y desenfocan lo que hay detras, sobre un fondo de
   luz suave y apagada (tres manchas de color muy tenues) para que el vidrio se note. Colores en
   tono mate, sin degradados de color fuertes: el color solo lo pone el contenido.
   ============================================================================= */
#app{background:
  radial-gradient(1100px 620px at 8% -12%,rgba(140,165,235,.30),transparent 62%),
  radial-gradient(900px 520px at 100% 0%,rgba(232,190,210,.26),transparent 58%),
  radial-gradient(1000px 640px at 55% 112%,rgba(150,215,205,.26),transparent 62%),
  var(--bg);background-attachment:fixed}
:root[data-tema="oscuro"] #app{background:
  radial-gradient(1100px 620px at 8% -12%,rgba(90,110,200,.20),transparent 62%),
  radial-gradient(900px 520px at 100% 0%,rgba(150,90,140,.14),transparent 58%),
  radial-gradient(1000px 640px at 55% 112%,rgba(60,130,120,.16),transparent 62%),
  var(--bg);background-attachment:fixed}
.lienzo,.vista,.hoja{background:transparent}

/* Superficies de vidrio. El DESENFOQUE (backdrop-filter) solo va en los contenedores grandes y pocos
   --tarjetas de pagina, carriles, calendario--: es lo mas caro de pintar, y con 200 tarjetas del funnel
   cada una con su desenfoque el navegador se arrastraba. Lo repetido (tarjetas del funnel, citas,
   plantillas, avisos) lleva el mismo aspecto con un relleno translucido y sin filtro. */
.cfgc,.cifra,.pgraf,.tabla,.grupo,.canal,.lp-card,.vacio-apple,.agcal,.columna,#vista-campanas .prompt,.st-panel{
  background:var(--vidrio);-webkit-backdrop-filter:var(--desenfoque);backdrop-filter:var(--desenfoque);
  box-shadow:var(--vidrio-luz),0 0 0 .5px var(--vidrio-borde),var(--sombra-suave)}
.propuesta,.tpl,.calidad-kpi,.calidad-aviso,.agcita,.mk-card,.cb-kpis div{
  background:var(--vidrio-fuerte);-webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:var(--vidrio-luz),0 0 0 .5px var(--vidrio-borde),var(--sombra-suave)}
.cifra:hover,.tpl:hover,.agcita:hover{background:var(--vidrio-fuerte);
  box-shadow:var(--vidrio-luz),0 0 0 .5px var(--vidrio-borde),0 2px 4px rgba(20,30,60,.04),0 18px 40px rgba(20,30,60,.10)}
.columna{box-shadow:var(--vidrio-luz),0 0 0 .5px var(--vidrio-borde)}
.columna.encima{background:var(--accent-suave);box-shadow:inset 0 0 0 2px var(--accent)}
.ktarjeta{background:var(--vidrio-fuerte);-webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:var(--vidrio-luz),0 0 0 .5px var(--vidrio-borde),0 1px 2px rgba(20,30,60,.05)}
.ktarjeta:hover{box-shadow:var(--vidrio-luz),0 0 0 .5px var(--vidrio-borde),0 8px 20px rgba(20,30,60,.10)}
.dato,.cb-estado{background:rgba(120,120,128,.08);box-shadow:none}
.fila{box-shadow:inset 0 -.5px 0 var(--line)}
.fila:last-child{box-shadow:none}

/* Chat: la lista y la ficha son de vidrio; la conversacion conserva la pared de WhatsApp. */
.lista,.ficha{background:var(--vidrio);-webkit-backdrop-filter:var(--desenfoque);backdrop-filter:var(--desenfoque)}
.chat.on{background:var(--accent-suave)}
.escribir,.cabecera,.barra-cita,.barra-seleccion{background:var(--vidrio-fuerte);-webkit-backdrop-filter:var(--desenfoque);backdrop-filter:var(--desenfoque)}
.escribir textarea{background:rgba(120,120,128,.10)}

/* Botones y campos: translucidos con un filo de luz. */
.btn-linea{background:var(--boton);box-shadow:inset 0 0 0 .5px var(--line),inset 0 1px 0 rgba(255,255,255,.18)}
.btn-linea:hover:not(:disabled){background:var(--boton-hover)}
.btn-solido{background:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 4px 12px rgba(74,134,232,.22)}
.btn-solido:hover:not(:disabled){box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 16px rgba(74,134,232,.28)}
.filtro.on{background:var(--vidrio-fuerte);color:var(--fg);box-shadow:var(--vidrio-luz),0 0 0 .5px var(--vidrio-borde),0 1px 3px rgba(20,30,60,.10)}
.campo input,.campo select,.campo textarea,.entrada-linea,.selects-filtro select,.buscaprospectos input,
.lista .cabeza input,.lista .cabeza select{background:var(--campo);box-shadow:inset 0 0 0 .5px var(--line),inset 0 1px 2px rgba(20,30,60,.04)}
.chip-tema.on,:root[data-tema="oscuro"] .chip-tema.on{background:var(--accent-suave);color:var(--accent-fuerte);box-shadow:inset 0 0 0 .5px var(--accent)}
.hoja .filtros,.agtog{background:var(--segmento);box-shadow:inset 0 0 0 .5px var(--line)}
.hoja .filtros .filtro.on,.agtog button.on{background:var(--vidrio-fuerte)}
/* Una fila de botones suelta no es un selector segmentado: sin caja gris detras (Recordatorios). */
.hoja .filtros:not(:has(> .filtro)){background:transparent;box-shadow:none;border-radius:0;padding:0;gap:8px;flex-wrap:wrap}

/* Menus, hojas de dialogo y visores: vidrio mas denso, con el fondo desenfocado detras. */
.modal{background:rgba(30,35,55,.22);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.modal .caja{background:var(--vidrio-fuerte);-webkit-backdrop-filter:blur(40px) saturate(1.7);backdrop-filter:blur(40px) saturate(1.7);
  box-shadow:var(--vidrio-luz),0 0 0 .5px var(--vidrio-borde),var(--sombra)}
.gmenu,.mas .menu,.st-menu,.anuevomenu,.amenu{background:var(--vidrio-fuerte);
  -webkit-backdrop-filter:blur(40px) saturate(1.7);backdrop-filter:blur(40px) saturate(1.7);
  box-shadow:var(--vidrio-luz),0 0 0 .5px var(--vidrio-borde),var(--sombra)}
.pie button{background:var(--boton);box-shadow:inset 0 0 0 .5px var(--line),inset 0 1px 0 rgba(255,255,255,.18)}

/* Graficas en tonos apagados. */
.glinea{stroke:var(--accent);stroke-width:2.2}
.garea{fill:var(--accent);opacity:.09}

/* --- Menu flotante, botones de filtro, categorias de Configuracion y Funnel compacto -------------- */
.menu-flotante{position:fixed;z-index:90;min-width:240px;max-width:min(330px,calc(100vw - 24px));max-height:min(72vh,540px);overflow-y:auto;
  padding:6px;border-radius:16px;background:var(--vidrio-fuerte);-webkit-backdrop-filter:blur(40px) saturate(1.7);backdrop-filter:blur(40px) saturate(1.7);
  box-shadow:var(--vidrio-luz),0 0 0 .5px var(--vidrio-borde),var(--sombra)}
@media(prefers-reduced-motion:no-preference){.menu-flotante{animation:menuEntra .16s var(--curva)}
  @keyframes menuEntra{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}}
.menu-flotante button{display:flex;align-items:flex-start;gap:8px;width:100%;padding:8px 10px;border-radius:10px;text-align:left;
  font-size:13.5px;transition:background .12s var(--curva)}
.menu-flotante button:hover{background:var(--accent-suave)}
.menu-flotante .mf-visto{flex:0 0 14px;width:14px;font-style:normal;font-weight:700;font-size:12px;line-height:20px;color:var(--accent)}
.menu-flotante small{display:block;margin-top:1px;font-size:11.5px;color:var(--mut)}
.menu-flotante hr{border:0;height:.5px;margin:6px 8px;background:var(--line)}
.mf-rot{padding:8px 10px 4px;font-size:11.5px;font-weight:600;color:var(--mut)}
.btn-filtro{display:inline-flex;align-items:center;gap:7px}
.btn-filtro svg{width:16px;height:16px;flex:0 0 auto}
.btn-filtro.activo{background:var(--accent-suave);color:var(--accent-fuerte);box-shadow:inset 0 0 0 .5px var(--accent)}
.btn-filtro[hidden],.agbar[hidden]{display:none}

.cfg-barra{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 22px;max-width:1240px}
.cfg-tabs{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:12px;background:var(--segmento);box-shadow:inset 0 0 0 .5px var(--line)}
.cfg-tab{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--fg);
  transition:background .15s var(--curva)}
.cfg-tab i{font-style:normal;font-size:11px;font-weight:600;color:var(--mut)}
.cfg-tab:hover{background:rgba(120,120,128,.14)}
.cfg-tab.on{background:var(--vidrio-fuerte);box-shadow:var(--vidrio-luz),0 0 0 .5px var(--vidrio-borde),0 1px 3px rgba(20,30,60,.10)}
.cfg-tabs.en-busqueda .cfg-tab{opacity:.45}
.cfg-buscar,.fun-buscar{padding:9px 14px;border:0;border-radius:11px;background:var(--campo);color:var(--fg);
  box-shadow:inset 0 0 0 .5px var(--line);outline:0}
.cfg-buscar{margin-left:auto;width:min(270px,100%)}
.cfg-buscar:focus,.fun-buscar:focus{background:var(--panel);box-shadow:0 0 0 1.5px var(--accent),var(--foco)}
.cfgc[hidden]{display:none}

.fun-barra{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 12px}
.fun-buscar{flex:1 1 220px;max-width:340px}
.fun-fichas{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.fun-fichas:empty{display:none}
.fun-ficha{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--accent-suave);
  color:var(--accent-fuerte);font-size:12.5px;font-weight:600}
.fun-ficha i{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(74,134,232,.2);font-style:normal;font-size:12px}
.kanban.compacto .columna{flex-basis:268px}
.columna .ctitulo{display:flex;width:100%;text-align:left;cursor:pointer;border-radius:var(--r3) var(--r3) 0 0}
.columna .ctitulo:hover{background:rgba(120,120,128,.07)}
.columna.plegada{flex:0 0 190px;max-height:none}
.columna.plegada .ctitulo{border-radius:var(--r3);opacity:.75}
.kanban.compacto .ccuerpo{gap:6px;padding:2px 8px 10px}
.ktarjeta.compacta{padding:8px 11px;border-radius:12px}
.kt-fila{display:flex;align-items:center;gap:6px}
.kt-fila b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;letter-spacing:-.01em}
.kt-fila i{flex:0 0 auto;margin:0;font-size:11px;font-style:normal;color:var(--meta)}
.ktarjeta.compacta span{margin-top:1px;font-size:12px}
.ktarjeta.compacta em{float:right;margin:1px 0 0 8px;padding:1px 7px;border-radius:999px;background:var(--hover);font-style:normal;font-size:10.5px;color:var(--mut)}
.kt-punto{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--accent);display:block}
.kmas-btn{display:block;width:100%;border-radius:10px;color:var(--accent);font-weight:600}
.kmas-btn:hover{background:var(--hover)}

/* --- Agente de marketing ------------------------------------------------------------------------ */
.mk{margin:0 0 34px;max-width:1240px}
.mk-cabecera{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:0 0 16px}
.mk-cabecera h2{margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.03em}
.mk-cabecera p{margin:0;max-width:640px;font-size:13.5px;line-height:1.5;color:var(--mut)}
.mk-est{display:block;margin-top:6px;font-size:12px;color:var(--mut)}
.mk-resumen{margin:0 0 18px;padding:14px 18px;border-radius:16px;background:var(--accent-suave)}
.mk-resumen b{font-size:12px;font-weight:650;color:var(--accent-fuerte)}
.mk-resumen p{margin:4px 0 0;font-size:13.5px;line-height:1.5}
.mk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px;align-items:start;margin:0 0 14px}
.mk-card{padding:20px 22px 18px;border-radius:var(--r3);min-width:0}
.mk-card.decidida{opacity:.72}
.mk-cab{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
.mk-prio{padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:650;background:var(--boton);color:var(--mut)}
.mk-prio.alta{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.mk-prio.media{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.mk-tipo{font-size:11.5px;color:var(--mut)}
.mk-ia{padding:2px 8px;border-radius:999px;background:var(--accent-suave);color:var(--accent-fuerte);font-size:11px;font-weight:700}
.mk-card h4{margin:0 0 6px;font-size:16px;font-weight:650;letter-spacing:-.02em}
.mk-motivo{margin:0 0 12px;font-size:13px;line-height:1.5;color:var(--mut)}
.mk-datos{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px;font-size:13px}
.mk-aud b{margin-right:4px;font-size:24px;font-weight:700;letter-spacing:-.03em}
.mk-aud small{color:var(--mut)}
.mk-canal{flex:0 0 auto;padding:3px 10px;border-radius:999px;background:var(--boton);font-size:11.5px;color:var(--mut);white-space:nowrap}
.mk-texto{margin:0 0 14px;padding:11px 14px;border:0;border-radius:12px;background:rgba(120,120,128,.09);font-size:13px;line-height:1.5}
.mk-acc{display:flex;align-items:center;gap:8px}
.mk-estado{margin-right:auto;font-size:12.5px;font-weight:600;color:var(--mut)}
.mk-ver{margin:2px 0 14px;font-size:13px;font-weight:600;color:var(--accent)}
.mk-sugerido{margin:0 0 18px;padding:14px 16px;border-radius:14px;background:var(--accent-suave)}
.mk-sugerido[hidden]{display:none}
.mk-sugerido b{font-size:12px;font-weight:650;color:var(--accent-fuerte)}
.mk-sug-texto{margin:6px 0 10px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
.mk-sug-nota{margin:0 0 10px;font-size:12px;line-height:1.5;color:var(--mut)}
.mk-sug-nota[hidden]{display:none}
@media(max-width:520px){.mk-grid{grid-template-columns:1fr}.mk-cabecera{flex-direction:column}}

/* --- Telefono: el cajon del menu es opaco (no se ve la app a traves) y las paginas respiran menos ---- */
@media(max-width:760px){
  .lateral{background:var(--vidrio-fuerte);-webkit-backdrop-filter:blur(40px) saturate(1.7);backdrop-filter:blur(40px) saturate(1.7);box-shadow:var(--sombra)}
  .hoja{padding:20px 16px 44px}
  .hoja h1{font-size:28px}
  header.barra{padding:0 12px}
}
@media(max-width:430px){header.barra{padding:8px 10px}}

/* --- Un poco de vida: las paginas aparecen con suavidad -------------------------------------- */
@media(prefers-reduced-motion:no-preference){
  .vista.on>.hoja{animation:entra .28s var(--curva)}
  @keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
/* ---- Funnel: vista de embudo ---- */
.kanban[hidden],.fun-embudo[hidden]{display:none}
.fun-sw{display:inline-flex;padding:3px;border-radius:12px;background:var(--segmento);box-shadow:inset 0 0 0 .5px var(--line)}
.fun-sw button{padding:7px 14px;border:0;border-radius:9px;background:transparent;font-size:13px;font-weight:600;color:var(--fg);cursor:pointer}
.fun-sw button.on{background:var(--vidrio-fuerte);box-shadow:var(--vidrio-luz),0 0 0 .5px var(--vidrio-borde),0 1px 3px rgba(20,30,60,.10)}
.fe-etapas{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin:2px 0 18px;max-width:1240px}
.fe-etapa{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px 14px 12px;border:0;border-radius:var(--r3);text-align:left;cursor:pointer;
  background:var(--vidrio);box-shadow:var(--vidrio-luz),0 0 0 .5px var(--vidrio-borde);color:var(--fg);transition:transform .15s,box-shadow .15s}
.fe-etapa:hover{transform:translateY(-1px)}
.fe-etapa.on{background:var(--vidrio-fuerte);box-shadow:var(--vidrio-luz),0 0 0 2px var(--accent)}
.fe-etapa.encima{background:var(--accent-suave);box-shadow:inset 0 0 0 2px var(--accent)}
.fe-n{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1}
.fe-t{font-size:12.5px;font-weight:600;text-transform:capitalize}

<body>

<div id="app">

  <!-- Sin hamburguesa y sin buscador aqui. Habia dos buscadores en pantalla, y el menu

<div id="aviso"></div>
<div id="lupa"><div class="lupa-barra" id="lupaBarra">
  <button type="button" data-lupa="citar" title="Responder a este mensaje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M20 20v-7a4 4 0 00-4-4H4"/></svg><span>Responder</span></button>
  <button type="button" data-lupa="reenviar" title="Reenviar a otro chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M4 20v-7a4 4 0 014-4h12"/></svg><span>Reenviar</span></button>
  <button type="button" data-lupa="descargar" title="Descargar el archivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg><span>Descargar</span></button>
  <button type="button" class="lupa-x" data-lupa="cerrar" aria-label="Cerrar" title="Cerrar (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div class="lupa-espera"><span class="lupa-rueda"></span><p class="lupa-carga">Pidiendo el archivo a WhatsApp…</p></div><img alt="imagen ampliada"><video controls></video></div>

<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, query, where, onSnapshot, doc, setDoc, getDoc, getDocs, limit, orderBy }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const CFG = window.CRM_CONFIG || window.DCARELA_CRM_CONFIG || {};
const FB  = window.__DCARELA_FIREBASE_CONFIG || {};
const API = String(CFG.firebaseFunctionsBase || '').replace(/\/$/, '') + '/crmApi';
const API_CALIDAD = String(CFG.firebaseFunctionsBase || '').replace(/\/$/, '') + '/crmServiceQualityApi';
const NEGOCIO = 'dcarela';

const app  = getApps().length ? getApps()[0] : initializeApp(FB);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- Tema ---------------------------------------------------------------- */
// Se guarda por navegador. El boton dice a donde vas, no donde estas.
function aplicaTema(t){
  document.documentElement.setAttribute('data-tema', t);
  $('btnTema').textContent = t === 'oscuro' ? 'Modo claro' : 'Modo oscuro';
  try { localStorage.setItem('crm2_tema', t); } catch (e) {}
}
try { aplicaTema(localStorage.getItem('crm2_tema') || 'claro'); } catch (e) { aplicaTema('claro'); }
$('btnTema').onclick = () =>
  aplicaTema(document.documentElement.getAttribute('data-tema') === 'oscuro' ? 'claro' : 'oscuro');

/* ---- Aviso --------------------------------------------------------------- */
let avisoT;
function avisa(titulo, detalle){
  const a = $('aviso');
  a.innerHTML = '<b>' + esc(titulo) + '</b>' + (detalle ? esc(detalle) : '');
  a.classList.add('on');
  clearTimeout(avisoT);
  avisoT = setTimeout(() => a.classList.remove('on'), 4200);
}

/* ---- Confirmar dentro de la pagina ------------------------------------------
   Los dialogos nativos (confirm) no se pueden confiar: el navegador integrado de Claude, el modo app del iPhone o un bloqueador los
   descartan sin avisar y el boton parecia muerto («se queda estancado»). Esta version vive en la pagina, siempre se ve y devuelve una
   promesa: true si pulsan Aceptar, false con Cancelar, Escape o tocando fuera. */
function confirmaAqui(texto, { si = 'Aceptar', no = 'Cancelar' } = {}){
  return new Promise(resolve => {
    const previo = document.activeElement;
    const m = document.createElement('div');
    m.className = 'modal on'; m.style.zIndex = '95';
    m.setAttribute('role', 'alertdialog'); m.setAttribute('aria-modal', 'true');
    m.innerHTML = '<div class="caja" style="max-width:420px"><div class="mcuerpo" style="white-space:pre-line;font-size:14px;line-height:1.55"></div>'
      + '<div class="mpatas"><button class="btn-linea" data-cf-no></button><button class="btn-solido" data-cf-si></button></div></div>';
    m.querySelector('.mcuerpo').textContent = String(texto);
    const bNo = m.querySelector('[data-cf-no]'), bSi = m.querySelector('[data-cf-si]');
    bNo.textContent = no; bSi.textContent = si;
    const fin = (valor) => {
      document.removeEventListener('keydown', tecla, true);
      m.remove();
      if (previo && typeof previo.focus === 'function') { try { previo.focus(); } catch (e) {} }
      resolve(valor);
    };
    const tecla = (ev) => { if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); fin(false); } };
    document.addEventListener('keydown', tecla, true);
    bNo.onclick = () => fin(false);
    bSi.onclick = () => fin(true);
    m.addEventListener('mousedown', ev => { if (ev.target === m) fin(false); });
    document.body.appendChild(m);
    bSi.focus();
  });
}

/* ---- Marca --------------------------------------------------------------- */
const sigla = CFG.logoText || 'DC';
const CANAL_FOTOS = CFG.lockNumFilter === true || CFG.defaultNumFilter === 'qr';
const soloDigitos = value => String(value || '').replace(/\D/g, '');
const NUMERO_FOTOS = soloDigitos(CFG.bridgeBusinessNumber || CFG.bridgeBusinessDisplayNumber);
// Dos numeros de la casa terminan en 5620 (el oficial 18495245620 y la linea vieja de WhatsApp
// Web). "***5620" no dice cual es, asi que los numeros de linea se ensenan siempre enteros.
const telefonoLegible = value => { const d = soloDigitos(value); const m = d.match(/^1(\d{3})(\d{3})(\d{4})$/); return m ? m[1] + '-' + m[2] + '-' + m[3] : d; };
// El numero de la linea de WhatsApp Web ya NO va escrito aqui. Era 18094785620 de respaldo, y al
// vincular el 18097575644 el campo de vinculacion seguia proponiendo la linea vieja. Desde el
// 09/09/2026 el dueno vincula el que le conviene: el campo sale con el numero conectado (o el
// pedido), y esto solo cuenta si crm-config.js declara uno a proposito.
const TELEFONO_PUENTE = NUMERO_FOTOS;
function perteneceAlCanal(c){
  const fuente = String(c?.source || '').toLowerCase();
  const numero = soloDigitos(c?.business_number);
  const esFotos = fuente === 'whatsapp_qr' || fuente === 'photos'
    || (NUMERO_FOTOS && numero === NUMERO_FOTOS);
  // El panel de Fotos atiende SOLO su linea: ahi el filtro sigue siendo excluyente.
  //
  // Este, el comercial, enseña LOS DOS numeros. Antes excluia el del puente, y por eso se
  // podia vincular y sincronizar el historial desde aqui sin que apareciera un solo mensaje:
  // la barra llegaba al 100% y la pantalla seguia vacia. El dueño lo quiere en este CRM, con
  // sus frenos anti-bloqueo, asi que aqui no se esconde nada.
  return CANAL_FOTOS ? esFotos : true;
}
['sigla','siglaAcceso'].forEach(id => { $(id).textContent = sigla; });
$('marca').textContent = CFG.productName || 'CRM';
$('submarca').textContent = CFG.subtitle || '';
$('marcaAcceso').textContent = CFG.brandName || "D'Carela";
$('subAcceso').textContent = CFG.subtitle || '';
// Se guarda aparte porque pintaCuentas le antepone el numero de conversaciones sin leer.
const TITULO_BASE = CFG.appTitle || "D'Carela CRM";
document.title = TITULO_BASE;

/* ---- Menu ---------------------------------------------------------------- */
// Tres entradas siempre a la vista y el resto tras la hamburguesa. Ojo: quien
// esconde es CSS puro (.secundarias sin body.menu-abierto), no un script que
// reordene nodos. Si el modulo no arranca, se ven TODAS. Un menu de mas no es
// tan grave como un menu vacio, que es como quedo el panel anterior.
const ico = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
// Un estado vacio como los de Apple: un glifo grande y apagado, un titulo y una linea que dice que
// llena esta pantalla. `glifo` son las rutas SVG (como en ico()).
function vacioApple(glifo, titulo, texto){
  return '<div class="vacio-apple">' + ico(glifo) + '<b>' + esc(titulo) + '</b>'
    + (texto ? '<p>' + esc(texto) + '</p>' : '') + '</div>';
}
let ROL_ACTUAL = '';
const VISTAS = [
  { id:'planning',      nombre:'Planificación', fija:true,  icono:ico('<rect x="4.5" y="3.5" width="15" height="17.5" rx="3.2"/><path d="M9 3.5V3a.9.9 0 01.9-.9h4.2A.9.9 0 0115 3v.5"/><path d="M8.4 10.2l1.7 1.7 3-3.2"/><path d="M8.4 16h7.2"/>') },
  { id:'conversations', nombre:'Conversaciones',fija:true,  icono:ico('<path d="M12 3.4c-4.9 0-8.6 3.2-8.6 7.3 0 2.3 1.2 4.3 3.1 5.6-.1 1.3-.7 2.5-1.7 3.5 2.100-.1 3.800-.8 5-1.900.7.200 1.400.3 2.200.3 4.900 0 8.600-3.200 8.600-7.300S16.900 3.400 12 3.400z"/>') },
  // Justo debajo de Conversaciones, como en la barra de WhatsApp Web.
  { id:'estados',       nombre:'Estados',       fija:true,  icono:ico('<circle cx="12" cy="12" r="8.6" stroke-dasharray="3.4 2.5"/><circle cx="12" cy="12" r="3.4"/>') },

// Todo pasa por crmApi con el token de Firebase. Ninguna escritura sale de aqui
// directa a Firestore: el servidor es quien valida permisos y reglas de negocio.
async function llama(cuerpo, opciones = {}){
  const u = auth.currentUser;
  if (!u) return { ok:false, error:'sesión no iniciada', status:401 };
  let token;
  try { token = await u.getIdToken(); }
  catch (e) { return { ok:false, error: e?.message || String(e), status:401 }; }
  let r;
  try {
    r = await fetch(opciones.endpoint || API, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + token },
      body: JSON.stringify(cuerpo),
      signal: senalDeLlamada(cuerpo, opciones.signal),
    });
  } catch (e) {
    // Tres fallos distintos que antes se veian iguales: lo paro la persona (Detener), se
    // agoto el tope de tiempo, o no hubo red. El asistente dice cual fue y ofrece reintentar.
    const nombre = e?.name || '';
    return { ok:false, error: e?.message || String(e), abortado: nombre === 'AbortError',
      tiempo: nombre === 'TimeoutError', red: nombre !== 'AbortError' && nombre !== 'TimeoutError' };
  }
  const j = await r.json().catch(() => ({}));
  // El codigo viaja con el error: los rechazos del puente se distinguen por el (otra linea,
  // desconectado, PC sin latido, pausa, modo seguro), no por el texto. El asistente usa ademas
  // el estado HTTP, el codigo del proveedor de IA y si el servidor dice que se puede reintentar.
  if (!r.ok) return { ok:false, error: j?.error || ('error ' + r.status), code: j?.code || null,
    status: r.status, provider_code: j?.provider_code || null, retryable: j?.retryable ?? null, detail: j?.detail || null };
  return { ok:true, ...j };
}
// Las llamadas a la IA tienen tope de 90 s; las del asistente ademas se pueden detener, asi
// que su señal se combina con ese tope.
const LLAMADAS_LENTAS = new Set(['assistantPlan', 'assistantChat']);
function senalDeLlamada(cuerpo, propia){
  const tope = LLAMADAS_LENTAS.has(cuerpo.action) ? AbortSignal.timeout(90000) : null;
  if (!propia) return tope || undefined;
  if (!tope) return propia;
  return typeof AbortSignal.any === 'function' ? AbortSignal.any([propia, tope]) : propia;
}
const callFn = cuerpo => llama(cuerpo);

// CONVS son las conversaciones VIVAS: de ahi leen la bandeja, los contadores, los avisos, el
// Dashboard, el Kanban, Limpieza y el asistente. CONVS_TODAS es todo lo que llega de Firestore, y
// CONVS_OCULTAS lo que sale de la bandeja porque su linea de WhatsApp Web no esta conectada. Se
// esconde, no se borra: el filtro de la linea las trae y vuelven solas si ese numero se vincula.
// CONVS_IGNORADAS son las que el dueno saco del CRM (familia, numeros propios, colegas): fuera de
// CONVS y de CONVS_OCULTAS, asi que ninguna vista ni contador las cuenta; el chip 'Ignorados' las
// trae y desde ahi se deshace.
let CONVS = [], CONVS_TODAS = [], CONVS_OCULTAS = [], CONVS_IGNORADAS = [], MSGS = [], sel = null;
let paraConvs = null, sondeoConvs = null, reintentoConvs = null;

// Los mismos tipos que firebase-functions/src/ignore-core.js (TIPOS): solo dicen POR QUE se ignora.
const TIPOS_IGNORAR = { propio:'número propio', linea_negocio:'línea del negocio', familia:'familia',
  fotografo:'fotógrafo', delivery:'delivery', personal:'personal', proveedor:'proveedor', otro:'otro' };
// Globos de lo que el servidor ya acepto y el puente todavia no ha mandado. Ver apuntaEnviando.
let ENVIANDO = [];

// El nombre de la CAJA es el nombre real de la persona; el del contacto de WhatsApp suele ser un
// apodo, un usuario o emojis. Manda el de la caja, salvo los genericos del mostrador («Cliente»,
// «Contado»...), que no son nadie. (El servidor tambien lo escribe en customer_name al atar la
// ficha, pero esto se ve ya, sin esperar a esa pasada.)
const NOMBRES_GENERICOS_CAJA = ['cliente', 'cliente general', 'cliente mostrador', 'mostrador', 'publico general',
  'publico', 'contado', 'varios', 'general', 'sin nombre', 'anonimo', 'na', 'n/a'];
function nombreDeCaja(c){
  const t = String((c && c.pos_client_nombre) || '').replace(/\s+/g, ' ').trim();
  if (t.length < 2 || !/\p{L}/u.test(t)) return '';
  const plano = t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  return NOMBRES_GENERICOS_CAJA.includes(plano) ? '' : t;
}
function nombreReal(c){
  return nombreDeCaja(c) || (c && (c.customer_name || c.contact_name)) || '';
}
function nombreDe(c){
  const real = nombreReal(c);
  if (real) return real;
  // Instagram y Messenger no traen telefono. Sin este respaldo salia un '+' suelto, IGUAL
  // en todas, y diez conversaciones distintas se veian como diez filas identicas. Se
  // ensenan los ultimos digitos del id para poder distinguirlas mientras no haya nombre.
  if (c.wa_phone) return '+' + c.wa_phone;
  const id = String(c.social_id || '');
  return id ? 'Sin nombre · ' + id.slice(-6) : 'Sin nombre';
}
// Foto de perfil si el canal la trae; si no, las iniciales.
//
// La API de WhatsApp Cloud (numero oficial) no manda la foto del cliente en el webhook, asi
// que ahi sale la inicial y no hay de donde sacar otra cosa. Instagram y Messenger SI la
// exponen como URL directa (profile_pic_url), y esa manda siempre.
//
// El 2.o numero (whatsapp_qr) si la tiene: el puente la pide a WhatsApp con calma, guarda los
// bytes en bridge-media y deja en la ficha profile_pic_media_id. Ese id no es una URL: se pide
// a crmMedia con la sesion, igual que las fotos de los mensajes, y un <img src> no puede
// llevar la cabecera Authorization. Por eso sale primero con iniciales y data-avatar, y
// resuelveAvatares cambia el circulo por la foto cuando llega. NO usa data-medio: resuelveMedios
// convierte los fallos en la tarjeta "Archivo · no se pudo recuperar", que en un avatar romperia
// la fila; aqui un fallo deja las iniciales.
//
// referrerpolicy no-referrer porque los CDN de Meta rechazan la peticion si ven el
// origen, y sin eso saldria un hueco roto en vez de las iniciales.
function avatarDe(c, n){
  const url = c?.profile_pic_url || c?.avatar_url || c?.metadata?.profile_pic_url || '';
  const ini = esc(iniciales(n));
  const vuelveAIniciales = 'onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),'
    + '{className:\'av\',textContent:this.dataset.ini}))" data-ini="' + ini + '"';
  if (url) return '<img class="av" src="' + esc(url) + '" alt="" loading="lazy" '
    + 'referrerpolicy="no-referrer" ' + vuelveAIniciales + '>';
  const medio = String(c?.profile_pic_media_id || '');
  if (medio.startsWith('fbs:')) {
    const yaBajada = MEDIOS.get(medio);
    // Ya en cache: se pinta directa, sin parpadeo, en cada snapshot que repinta la lista.
    if (yaBajada) return '<img class="av" src="' + esc(yaBajada) + '" alt="" ' + vuelveAIniciales + '>';
    // No se ha intentado todavia, o el fallo anterior ya toca reintentarlo. Un 404 o un corte de
    // red dejaban las iniciales para toda la sesion, y solo recargar la pagina las arreglaba.
    if (yaBajada !== '' || medioReintentable(medio))
      return '<div class="av" data-avatar="' + esc(medio) + '" data-avconv="'
        + esc(c?._id || c?.id || '') + '" data-ini="' + ini + '">' + ini + '</div>';
  }
  // Ficha de WhatsApp Web que todavia no tiene foto guardada. Se marca para pedirsela al puente
  // cuando de verdad se vea en pantalla: es lo que hace que la bandeja recien vinculada tenga
  // caras en segundos en vez de esperar dias al ritmo de fondo. 'sin_foto' y 'privada' son
  // respuestas definitivas de WhatsApp y no se vuelven a pedir.
  if (String(c?.source || '') === 'whatsapp_qr' && !medio
    && !['sin_foto', 'privada'].includes(String(c?.profile_pic_status || ''))) {
    return '<div class="av" data-avpend="' + esc(c?._id || c?.id || '') + '">' + ini + '</div>';
  }
  return '<div class="av">' + ini + '</div>';
}

function iniciales(n){
  return String(n || '?').replace(/[^\p{L}\p{N} ]/gu,'').trim().split(/\s+/)
    .slice(0,2).map(p => p[0] || '').join('').toUpperCase() || '#';
}
// Instante de un valor de fecha, en milisegundos, o NaN si no se puede leer. Acepta la cadena
// ISO que escriben casi todos los caminos, el Timestamp de Firestore y un numero.
function instante(v){
  if (v == null || v === '') return NaN;
  if (typeof v === 'number') return v < 10_000_000_000 ? v * 1000 : v;
  if (typeof v === 'object' && typeof v.seconds === 'number') return v.seconds * 1000;
  return Date.parse(String(v));
}
// Un mensaje sin fecha legible se ordena AL FINAL, no al principio. Llego sin ella porque
// alguien lo acababa de escribir -- ese era el caso real: los envios del 2.o numero -- asi
// que el final es donde casi seguro va. Al principio lo dejaba el orden por texto, y ahi
// parecia un mensaje de hace meses.
function instanteMsg(m){
  for (const v of [m.created_at, m.synced_at, m.delivery_updated_at, m.updated_at]) {
    const t = instante(v);
    if (Number.isFinite(t)) return t;
  }
  return Number.MAX_SAFE_INTEGER;
}

function hora(v){
  if (!v) return '';
  if (!Number.isFinite(instante(v))) return '';
  const d = new Date(instante(v)), hoy = new Date();
  if (d.toDateString() === hoy.toDateString())
    return d.toLocaleTimeString('es-DO', { hour:'2-digit', minute:'2-digit' });
  const ayer = new Date(hoy); ayer.setDate(hoy.getDate() - 1);
  if (d.toDateString() === ayer.toDateString()) return 'ayer';
  return d.toLocaleDateString('es-DO', { day:'numeric', month:'short' });
}

    ? 'Datos actualizados · respaldo ' + respaldo.join(' y ')
    : 'Datos sincronizados · en vivo');
}

async function sondeaConversaciones(){

    aplicaConversaciones(await getDocs(q), 'respaldo cada 8 s');
  } catch (error) {
    convsDesdeServidor = false;
    marcaEstado(false, 'Sincronización interrumpida: ' + (error?.code || 'sin red'));

}
function activaRespaldoConvs(){

    void sondeaConversaciones();
    sondeoConvs = setInterval(() => { if (!document.hidden) void sondeaConversaciones(); }, 8000);
  }

function escuchaConversaciones(){
  if (paraConvs) { paraConvs(); paraConvs = null; }
  const q = query(collection(db,'crm_conversations'), where('business_id','==',NEGOCIO));
  // El primer snapshot puede venir de IndexedDB. No lo confundimos con una conexión viva:
  // mientras siga siendo local, dejamos activo el sondeo y esperamos el cambio de metadata.
  paraConvs = onSnapshot(q, { includeMetadataChanges: true }, s => {
    if (s?.metadata?.fromCache === true) activaRespaldoConvs();
    else detieneRespaldoConvs();
    aplicaConversaciones(s, s?.metadata?.fromCache === true ? 'copia local' : 'en vivo');
  }, err => {
    paraConvs = null;
    convsDesdeServidor = false;
    marcaEstado(false, 'En vivo interrumpido: ' + (err?.code || 'error') + ' · usando respaldo');
    activaRespaldoConvs();
  });
}
function detieneRespaldoMsgs(){
