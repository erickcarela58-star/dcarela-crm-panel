const CANALES = {
  whatsapp_cloud: { nombre:'WhatsApp oficial (API)',    corto:'WhatsApp',  logo:LOGO_WA, color:'#25d366' },
  whatsapp_qr:    { nombre:'WhatsApp Web (2.º número)', corto:'WA Web',    logo:LOGO_WA, color:'#0b7f6b' },
  instagram:      { nombre:'Instagram Direct',          corto:'Instagram', logo:LOGO_IG, color:'#c13584' },
  facebook:       { nombre:'Facebook Messenger',        corto:'Messenger', logo:LOGO_FB, color:'#0084ff' },
};
// Las plantillas y la ventana de 24 h son del API oficial de Meta, no de WhatsApp. Por WhatsApp
// Web se escribe cuando se quiera y como se quiera, igual que desde el telefono, e Instagram y
// Messenger no tienen plantillas en absoluto. El panel las ofrecia en los cuatro canales: el
// servidor contestaba "canal incorrecto" y el dueno leia "No se pudo enviar la plantilla", que
// no explica que ahi no hacia ninguna falta.
function esOficial(c){ return canalDe(c) === 'whatsapp_cloud'; }
function canalDe(c){
  const s = String(c?.source || '').toLowerCase();
  if (CANALES[s]) return s;
  if (s.includes('qr') || s.includes('bridge')) return 'whatsapp_qr';
  if (s.includes('instagram') || s.includes('ig')) return 'instagram';
  if (s.includes('facebook') || s.includes('messenger') || s.includes('fb')) return 'facebook';
  return 'whatsapp_cloud';
}

let bridgeControlState = {};

function bridgeStatusLabel(status){
  return ({
    offline:'Puente apagado', idle:'Listo para vincular', requested:'Solicitud recibida',
    generating:'Generando código', code_ready:'Esperando el teléfono',
    connecting:'Finalizando vinculación', rebuild_requested:'Preparando reconstrucción',
    rebuild_clearing:'Renovando dispositivo', connected:'WhatsApp conectado',
    disconnected:'WhatsApp desconectado', canceled:'Vinculación cancelada',
    expired:'Código vencido', error:'Requiere atención',
  })[status] || 'Estado desconocido';
}

function formatBridgeCode(value){
  const raw = String(value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  return (raw.match(/.{1,4}/g) || []).join('-');
}

async function callBridgeControl(action, payload = {}){
  const actionMap = {
    status:'bridgeStatus', request_pairing:'requestBridgePairing', cancel:'cancelBridgePairing',
    activate:'activateBridgeTransport',
    pause:'pauseBridge', resume:'resumeBridge', logout:'logoutBridge',
    sync_history:'syncBridgeHistory', rebuild_link:'rebuildBridge',
    enable_photo_bot:'setPhotoBot', disable_photo_bot:'setPhotoBot',
  };
  const mapped = actionMap[action];
  if (!mapped) return { ok:false, error:'acción de puente no disponible' };
  const body = { action:mapped, ...payload };
  if (action === 'enable_photo_bot') body.enabled = true;
  if (action === 'disable_photo_bot') body.enabled = false;
  return llama(body);
}

function renderBridgeControlState(state, explicitError = ''){
  bridgeControlState = state || {};
  // Lo que devuelve cada accion del puente cuenta tambien para la bandeja, por la misma formula.
  if (state && (state.status || state.state)) fijaLineaQr(state, { enVivo:false });
  // Arranca o para el sondeo segun lo que acabe de llegar. Va aqui y no en el boton porque el
  // estado tambien cambia al pedir codigo, al sincronizar y al reconstruir.
  setTimeout(vigilaPuente, 0);
  setTimeout(continuaHistorialSiFaltan, 0);
  const status = String(bridgeControlState.status || bridgeControlState.state || 'offline').toLowerCase();
  const active = ['requested','generating','code_ready','connecting','rebuild_requested','rebuild_clearing'].includes(status);
  const code = formatBridgeCode(bridgeControlState.pairing_code);
  const codePanel = $('bridgeCodePanel');
  if (codePanel) codePanel.classList.toggle('on', !!code || active);
  if ($('bridgePairCode')) $('bridgePairCode').textContent = code || '--';
  if ($('bridgeCancelPair')) $('bridgeCancelPair').disabled = !active;

  const hostOnline = bridgeControlState.host_online === true;
  const connected = status === 'connected';
  const historyStatus = String(bridgeControlState.history_sync_status || 'idle');
  const historyActive = ['requested','running','waiting'].includes(historyStatus);
  const pair = $('bridgePairBtn');
  if (pair) {
    pair.disabled = !hostOnline || active || connected;
    pair.textContent = active ? 'Procesando…' : (connected ? 'Ya vinculado' : 'Generar código');
  }
  const activar = $('bridgeActivateBtn');
  if (activar) {
    const bloqueado = String(bridgeControlState.transport_mode || 'reconnect_only') !== 'active';
    activar.hidden = !(connected && bloqueado);
    activar.disabled = !hostOnline;
  }
  const pause = $('bridgePauseBtn');
  if (pause) {
    pause.disabled = !hostOnline && bridgeControlState.paused !== true;
    pause.textContent = bridgeControlState.paused ? 'Reanudar envíos' : 'Pausar envíos';
  }
  const history = $('bridgeHistoryBtn');
  if (history) {
    history.disabled = !connected || !hostOnline || historyActive;
    history.textContent = historyActive ? 'Sincronizando…' : 'Sincronizar historial';
  }
  const rebuild = $('bridgeRebuildBtn');
  if (rebuild) rebuild.disabled = !connected || !hostOnline || historyActive;
  const logout = $('bridgeLogoutBtn');
  if (logout) logout.disabled = !connected && !bridgeControlState.connected_phone;

  if ($('bridgeCodeMeta')) $('bridgeCodeMeta').textContent = code
    ? 'Escribe este código en WhatsApp → Dispositivos vinculados.'
    : (active ? bridgeStatusLabel(status) + '…' : 'Solicita un código nuevo cuando el puente esté en línea.');
  if ($('bridgeHistoryState')) {
    const imported = Number(bridgeControlState.history_sync_imported || 0);
    const duplicates = Number(bridgeControlState.history_sync_duplicates || 0);
    // El puente guarda el MOTIVO en history_sync_last_error, y el panel enseñaba solo
    // "Historial: error." -- una palabra que no se puede investigar. "WhatsApp no esta
    // conectado" y "se corto a mitad" piden cosas distintas, y aqui se veian igual.
    const motivo = String(bridgeControlState.history_sync_last_error || '').trim();
    $('bridgeHistoryState').textContent = historyStatus === 'completed'
      ? 'Historial completado: ' + imported + ' nuevos; ' + duplicates + ' duplicados omitidos.'
      : historyActive ? 'Historial en proceso: ' + Number(bridgeControlState.history_sync_progress || 0) + '%.'
        // Cualquier estado que no sea 'completed' ni 'idle' lleva motivo, no solo 'error'.
        // 'unavailable' es el peor de todos para dejarlo en una palabra: significa que esta
        // vinculacion quedo registrada como NAVEGADOR y WhatsApp no le entrega los bloques
        // historicos -- y la salida es concreta (cerrar sesion y vincular una vez mas), pero
        // el panel enseñaba "Historial: unavailable." y ahi se acababa la informacion.
        : (motivo || historyStatus === 'error')
          ? 'Historial: ' + (motivo || 'se cortó sin decir por qué')
            + (imported ? ' Se guardaron ' + imported + ' antes de cortarse.' : '')
          : 'Historial: ' + historyStatus + '.';
  }
  // Todo lo de este canal --cerrar sesion, generar codigo, sincronizar-- lo ejecuta el
  // programa del puente en la PC. El panel solo deja el encargo escrito y espera. Si ese
  // programa no esta corriendo, no pasa nada de nada: los botones se quedan mudos y no habia
  // forma de saber por que. Al dueno le parecio que "cerrar sesion no hizo nada", que
  // "generar codigo se quedaba esperando" y que el historial fallaba -- tres sintomas, una
  // sola causa, y ninguno lo decia. El panel SABE si el host responde: solo faltaba decirlo.
  if ($('bridgeRebuildState')) $('bridgeRebuildState').textContent = hostOnline
    ? 'Reconstruir renueva solo el vínculo local; conserva conversaciones y mensajes del CRM.'
    : 'El programa del puente no está respondiendo en la PC. Hasta que se abra, lo que pulses '
      + 'aquí queda anotado pero no lo ejecuta nadie.';
  if ($('bridgeRebuildState')) $('bridgeRebuildState').classList.toggle('mal', !hostOnline);
  if ($('bridgeError')) $('bridgeError').textContent = explicitError || bridgeControlState.last_error || '';
  const bot = $('photoBotGlobalBtn');
  if (bot) {
    const enabled = bridgeControlState.bot_enabled === true;
    bot.textContent = 'Bot de este canal: ' + (enabled ? 'encendido' : 'apagado');
    bot.dataset.enabled = String(enabled);
    bot.disabled = !enabled && (!connected || !hostOnline || bridgeControlState.transport_mode !== 'active');
  }
}

async function refreshBridgeStatus(){
  const result = await callBridgeControl('status');

// El puente tarda: el codigo aparece unos segundos despues de pedirlo, y el historial sube de
// porcentaje durante minutos. Nada de eso se refrescaba solo, asi que habia que recargar la
// pagina para ver si algo se movia -- y quien no recarga concluye que se ha quedado colgado.
// Paso de verdad dos veces seguidas: el codigo "no salia" y el historial "se quedo en 0".
//
// Se consulta solo MIENTRAS hay algo en marcha, y se para en cuanto termina: un sondeo que no
// se apaga es una peticion cada pocos segundos para siempre, tambien de madrugada.
// Una sincronizacion PARCIAL no es un fallo: es progreso a medias. El puente lo dice --"se
// conservaron N mensajes; vuelve a sincronizar para continuar"-- pero eso deja el trabajo
// colgando de que alguien se acuerde de pulsar otra vez, y con 182 conversaciones hacen falta
// varias vueltas. Es el mismo patron que ya se quito de los seguimientos.
//
// Se continua solo, con dos frenos: como mucho 3 vueltas seguidas, y solo si la vuelta
// anterior trajo mensajes NUEVOS. Si deja de avanzar se para, porque insistir sobre algo que
// no progresa es golpear a WhatsApp sin ganar nada.
const CONTINUA_MAX = 3;
let vueltasHistorial = 0;
let importadosPrevios = -1;
async function continuaHistorialSiFaltan(){
  const estado = String(bridgeControlState.history_sync_status || '');
  const importados = Number(bridgeControlState.history_sync_imported || 0);
  if (estado !== 'error') { if (estado === 'completed') { vueltasHistorial = 0; importadosPrevios = -1; } return; }
  // 'error' con cero importados no es parcial: es que no entro nada. Ahi reintentar solo
  // repite el mismo fallo, y el motivo ya esta escrito en pantalla para poder mirarlo.
  if (!importados || importados === importadosPrevios || vueltasHistorial >= CONTINUA_MAX) return;
  importadosPrevios = importados;
  vueltasHistorial += 1;
  const nota = $('bridgeHistoryState');
  if (nota) nota.textContent = 'Historial incompleto: continuando solo (vuelta '
    + vueltasHistorial + ' de ' + CONTINUA_MAX + '). Se guardaron ' + importados + ' hasta ahora.';
  await requestBridgeHistorySync();
}

let relojPuente = null;
function vigilaPuente(){
  const estado = String(bridgeControlState.status || '').toLowerCase();
  const historial = String(bridgeControlState.history_sync_status || 'idle');
  const enMarcha = ['requested','generating','code_ready','connecting','rebuild_requested','rebuild_clearing'].includes(estado)
    || ['requested','running','waiting'].includes(historial);
  if (!enMarcha || relojPuente) { if (!enMarcha && relojPuente) { clearInterval(relojPuente); relojPuente = null; } return; }
  relojPuente = setInterval(async () => {
    // Si se cambio de vista, el panel del puente ya no existe: se corta y no se deja el
    // sondeo huerfano consumiendo peticiones.
    if (!$('bridgePairBtn')) { clearInterval(relojPuente); relojPuente = null; return; }
    await refreshBridgeStatus();
  }, 4000);
}

async function requestBridgePairing(){
  // El numero lo escribe el dueno. Antes estaba fijo en el codigo y el servidor ademas solo
  // aceptaba uno: no habia donde teclearlo, y el codigo salia siempre para otra linea. Metido
  // en el telefono equivocado, WhatsApp responde "no se puede vincular dispositivo" y no
  // explica nada -- ese rato ya se perdio una vez.
  const campo = $('bridgePairPhone');
  const phone = soloDigitos(campo ? campo.value : TELEFONO_PUENTE);
  if (!/^[1-9][0-9]{7,14}$/.test(phone)) {
    if (campo) campo.focus();
    return renderBridgeControlState(bridgeControlState,
      'Escribe el número con código de país y solo dígitos. Por ejemplo 18091234567.');
  }
  // Se deja dicho ANTES de que salga el codigo: es lo unico que evita teclearlo donde no va.
  const bonito = phone.replace(/^1(\d{3})(\d{3})(\d{4})$/, '$1-$2-$3');
  const para = $('bridgeCodeFor');
  if (para) para.innerHTML = '<b>Este código es solo para el ' + esc(bonito) + '</b>'
    + ' — en cualquier otro teléfono WhatsApp lo rechaza.';
  const result = await callBridgeControl('request_pairing', { phone });
  if (result.bridge) renderBridgeControlState(result.bridge, result.ok ? '' : result.error);
  else renderBridgeControlState(bridgeControlState, result.error || 'No se pudo pedir el código.');
}

// Tarjeta unica de Instagram y Messenger mientras estan ocultos. Dice lo que hay GUARDADO --que no
// se borro nada--, por donde se atienden ahora y como traerlos de vuelta. Los recuentos salen de
// CONVS_REDES, que es exactamente lo que se escondio por ser de una red: esta tarjeta es el unico
// sitio del panel donde se ve que hay ahi dentro.
function notaRedesOcultas(){
  const resumen = clave => {
    const todas = CONVS_REDES.filter(c => canalDe(c) === clave);
    if (!todas.length) return null;
    const sinLeer = todas.filter(c => Number(c.unread || 0) > 0).length;
    const fechas = todas.map(c => String(c.last_customer_reply_at || '')).filter(Boolean).sort();
    const ultima = fechas[fechas.length - 1];
    const dias = ultima ? Math.floor((Date.now() - Date.parse(ultima)) / 86400000) : NaN;
    return { clave, total: todas.length, sinLeer,
      cuando: Number.isFinite(dias) ? (dias <= 0 ? 'hoy' : dias === 1 ? 'ayer' : 'hace ' + dias + ' días') : '' };
  };
  const filas = ['instagram', 'facebook'].map(resumen).filter(Boolean);
  // Que se guarde en silencio algo que nadie mira es el riesgo de esconder: por eso el "sin leer"
  // y el "último recibido" se dicen aqui, aunque no suenen en ningun otro sitio.
  const detalle = filas.length
    ? filas.map(f => '<b>' + esc(CANALES[f.clave].nombre) + ':</b> ' + f.total + ' conversación(es) guardadas'
        + (f.sinLeer ? ', ' + f.sinLeer + ' sin leer' : '')
        + (f.cuando ? ' · último recibido ' + esc(f.cuando) : '')
        + ' <button class="btn-linea" data-ver-ocultas="' + esc(f.clave) + '">Ver las ' + f.total + '</button>').join('<br>')
    : 'No hay ninguna conversación guardada de estas dos redes.';
  return '<div class="canal">'
    + '<div class="cabecera-canal">'
    +   '<span class="clogo" style="background:' + CANALES.instagram.color + '22;color:'
    +     CANALES.instagram.color + '">' + CANALES.instagram.logo + '</span>'
    +   '<div class="cinfo"><b>Instagram y Messenger</b><span>Se atienden en la bandeja de Meta</span></div>'
    +   '<i class="chip medio">ocultos</i>'
    + '</div>'
    + '<p class="cdetalle">' + detalle
    + '<br><b>No se borró nada.</b> Sus chats siguen guardados; lo que se quitó es la bandeja, los '
    + 'filtros, los contadores, el Dashboard y el poder escribir por ahí. La importación cada 6 h '
    + 'también está en pausa, así que al reactivarlos hay que pulsar «Importar historial».'
    + '<br>Para volver a atenderlos desde el CRM: <b>Configuración → Instagram y Messenger dentro '
    + 'del CRM</b>.</p>'
    + '<div class="cacciones">'
    +   ACCESOS_META.filter(a => a.id !== 'mp')
          .map(a => '<a class="btn-linea" href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">'
            + 'Abrir ' + esc(a.nombre) + ' en Meta ↗</a>').join('')
    // Las rutas de la bandeja de Business Suite no estan documentadas por Meta y pueden cambiar.
    // Si alguna deja de abrir donde debe, esto es la salida sin tener que publicar nada.
    +   (ACCESOS_META.length
          ? '<a class="btn-linea" href="' + esc(BANDEJA_META) + '" target="_blank" rel="noopener noreferrer">'
            + '¿No abrió la bandeja correcta? Bandeja general ↗</a>' : '')
    + '</div></div>';
}

async function pintaCanales(){
  const cont = $('canalesLista'); if (!cont) return;
  cont.innerHTML = '<p class="bajada"><span class="cargando"></span> Comprobando…</p>';

  const [estado, puente] = await Promise.all([
    llama({ action:'transportStatus' }),
    llama({ action:'bridgeStatus' }),
  ]);
  const t = estado.ok ? (estado.transport || estado) : {};
  const p = puente.ok ? (puente.bridge || puente) : {};
  bridgeControlState = p;
  // Esta vista ya sabe como esta la linea: se comparte con la bandeja por la MISMA formula que usa
  // la escucha en vivo. Antes aqui habia otra (con la pausa), que escondia las 580 fichas del
  // numero conectado solo por tener los envios en pausa.
  if (puente.ok) fijaLineaQr(p, { enVivo:false });

  // Las cuentas incluyen las ocultas: esta tarjeta es donde se mira que hay en cada canal.
  const cuenta = clave => CONVS_TODAS.filter(c => canalDe(c) === clave).length;
  // WhatsApp Web se cuenta por linea: "580 de 809-757-5644 · 37 ocultas de 809-478-5620". Junto,
  // un 617 no dice que 37 son de un numero que ya no esta vinculado.
  const resumenCuenta = clave => {
    if (clave !== 'whatsapp_qr' || !cuenta(clave)) return cuenta(clave) + ' conversación(es)';
    const agrupa = lista => {
      const m = new Map();
      lista.filter(c => canalDe(c) === clave).forEach(c => m.set(claveOculta(c), (m.get(claveOculta(c)) || 0) + 1));
      return [...m.entries()];
    };
    const nombre = k => k === 'sin_numero' ? 'sin número' : telefonoLegible(k);
    return [...agrupa(CONVS).map(([k, n]) => n + ' de ' + nombre(k)),
      ...agrupa(CONVS_OCULTAS).map(([k, n]) => n + ' ocultas de ' + nombre(k))].join(' · ');
  };
  // "Conectado" no quiere decir que llegue nada. Una red puede estar suscrita, con su token
  // vivo y su historial importado, y aun asi no entregar un solo mensaje nuevo -- que es
  // exactamente lo que pasa con Instagram y Messenger mientras la app siga sin publicar en
  // Meta. La tarjeta se veia en verde igual, y eso hace creer que el canal esta atendiendo
  // clientes cuando lleva meses mudo.
  //
  // La fecha del ultimo mensaje ENTRANTE no se puede discutir ni se queda vieja: si hoy
  // entra uno, se actualiza sola. Vale para los cuatro canales, no solo para las redes: un
  // WhatsApp callado tres semanas tambien es algo que hay que ver.
  const ultimoEntrante = (clave) => {
    const fechas = CONVS.filter(c => canalDe(c) === clave)
      .map(c => String(c.last_customer_reply_at || '')).filter(Boolean).sort();
    const ultima = fechas[fechas.length - 1];
    if (!ultima) return '';
    const dias = Math.floor((Date.now() - Date.parse(ultima)) / 86400000);
    if (!Number.isFinite(dias)) return '';
    return ' · último recibido ' + (dias <= 0 ? 'hoy' : dias === 1 ? 'ayer' : 'hace ' + dias + ' días');
  };

  // 'etiqueta' permite un cuarto estado cuando 'conectado / sin conectar / sin usar' no
  // alcanza. El caso real: vinculado pero en pausa, que salia como "sin conectar" -- y por eso
  // se volvia a vincular una y otra vez algo que solo necesitaba pulsar Reanudar.
  const tarjeta = (clave, listo, detalle, acciones, etiqueta) => {
    const d = CANALES[clave];
    return '<div class="canal">'
      + '<div class="cabecera-canal">'
      +   '<span class="clogo" style="background:' + d.color + '22;color:' + d.color + '">' + d.logo + '</span>'
      +   '<div class="cinfo"><b>' + esc(d.nombre) + '</b>'
      +     '<span>' + esc(resumenCuenta(clave)) + ultimoEntrante(clave) + '</span></div>'
      +   '<i class="chip ' + (etiqueta ? etiqueta.clase
      :     (listo === true ? 'ok' : listo === false ? 'mal' : 'medio')) + '">'
      +     (etiqueta ? esc(etiqueta.texto)
      :     (listo === true ? 'conectado' : listo === false ? 'sin conectar' : 'sin usar')) + '</i>'
      + '</div>'
      + '<p class="cdetalle">' + detalle + '</p>'
      + (acciones ? '<div class="cacciones">' + acciones + '</div>' : '')
      + '</div>';
  };

  // El estado de una red no es "hay conversaciones": es si la pagina esta suscrita. Sin
  // suscripcion Meta no manda un solo webhook, y la tarjeta decia "conectado" igual.
  // El estado viene de socialStatus, que devuelve solo lo que se puede enseñar. Los
  // tokens de usuario y de pagina se quedan en el servidor: sacarlos por la via generica
  // de datos habria puesto dos credenciales en el navegador.
  const est = await llama({ action:'socialStatus' });
  const redes = est.ok ? (est.redes || {}) : {};
  // El mismo interruptor que ve la bandeja. Si alguien lo cambio en otra pestana, entrar aqui lo
  // trae y la lista se rehace sola, igual que hace fijaLineaQr con el puente.
  if (est.ok) fijaRedesActivas(est.activas === true);
  // El resultado de una importacion vivia SOLO en un aviso que se borra a los 4,2 segundos,
  // y la importacion tarda unos veinte. O sea que quien pulsa el boton, mira a otro lado
  // mientras espera --que es lo que se hace-- y vuelve, no encuentra el resultado en ninguna
  // parte. Y si no entro ningun mensaje, la pantalla queda exactamente igual que antes: la
  // unica lectura posible es "no hizo nada". Paso de verdad, tres veces seguidas.
  //
  // Ahora el resultado se queda escrito en la tarjeta del canal hasta la siguiente.
  const tarjetaRed = (clave, estadoGuardado, detalle) => {
    const hay = cuenta(clave);
    const suscrita = estadoGuardado?.suscrita === true;
    const conectada = estadoGuardado?.conectado === true;
    const listo = suscrita ? true : (conectada || hay ? false : null);
    // Facebook invalida la sesion (p. ej. al cambiar la contrasena): el CRM lo detecta solo y lo dice aqui, con el remedio.
    const caida = estadoGuardado?.token_caido === true;
    return tarjeta(clave, caida ? false : listo,
      detalle
      + (caida
          ? '<br><b>La sesión se cerró:</b> Facebook la invalidó (suele pasar al cambiar la contraseña). Pulsa '
            + '«Volver a iniciar sesión»: es un toque y queda guardada en el servidor, así que en cualquier '
            + 'navegador o dispositivo ya entra iniciada.'
          : '')
      + (conectada && !suscrita
          ? '<br><b>Conectado pero sin suscribir:</b> Meta no va a mandar mensajes hasta que '
            + 'la página quede suscrita. Vuelve a iniciar sesión.'
          : suscrita
            ? '<br>Página <b>' + esc(estadoGuardado.page_name || estadoGuardado.page_id || '') + '</b> suscrita.'
              + (estadoGuardado.ultimo_sync_at
                  ? ' Último historial importado: ' + esc(String(estadoGuardado.ultimo_sync_at).slice(0,16).replace('T',' ')) + '.'
                  : ' Todavía no se ha importado el historial.')
              + (ULTIMA_IMPORTACION[clave] ? '<br>' + ULTIMA_IMPORTACION[clave] : '')
            : ''),
      '<button class="btn-linea" data-conecta="' + clave + '">'
      + (conectada || caida ? 'Volver a iniciar sesión' : 'Iniciar sesión y dar permisos') + '</button>'
      + (conectada ? '<button class="btn-linea" data-sync="' + clave + '">Importar historial</button>' : ''));
  };

  const oficialListo = t.ready === true || t.state === 'ready';
  const estadoPuente = String(p.state || p.status || '').toLowerCase();
  const puenteVinculado = (p.connected === true || estadoPuente === 'connected' || estadoPuente === 'ready')
    && p.host_online !== false;
  const puenteVinculadoEnPausa = puenteVinculado && p.paused === true;
  const puenteListo = puenteVinculado && p.paused !== true;

  cont.innerHTML =
    tarjeta('whatsapp_cloud', oficialListo,
      oficialListo
        ? 'Número ' + esc(CFG.businessDisplayNumber || CFG.businessNumber || '') + '. Entregando mensajes.'
        : 'Meta no está conectada al transporte' + (t.last_error_code ? ' (error ' + esc(String(t.last_error_code)) + ')' : '')
          + '. Reconectar exige el App Secret y se hace con scripts/conectar_meta_firebase.ps1, no desde aquí.',
      '<button class="btn-linea" data-canal-bot="official">Bot de este canal: '
        + (estado.bot_enabled ? 'encendido' : 'apagado') + '</button>')

    // Vinculado-pero-en-pausa salia como "sin conectar", igual que sin vincular. El dueno
    // cerraba sesion y volvia a vincular una y otra vez para arreglar algo que solo necesitaba
    // un boton. Se distingue.
    + tarjeta('whatsapp_qr', puenteListo ? true : (cuenta('whatsapp_qr') ? false : null),
      (puenteListo
        ? 'Segundo número conectado por WhatsApp Web. <b>No hay ventana de 24 h ni plantillas</b>: '
          + 'se escribe como desde el teléfono, a cualquier contacto y en cualquier momento.'
        : puenteVinculadoEnPausa
        // El motivo lo guarda quien pausa (pause_reason). Sin el, la pausa de vincular --que se
        // levanta sola al quedar estable-- se veia igual que una por calidad, que no debe quitarse
        // sin revisar el numero.
        ? '<b>Vinculado, pero con los envíos en pausa.</b> '
          + esc(MOTIVO_PAUSA[p.pause_reason] || 'No consta el motivo: la pausa es de antes de que se guardara.') + ' '
          + 'Pulsa <b>Reanudar envíos</b> y ya se puede escribir por este número.'
        // Decia "no admite difusiones, solo conversacion dentro de la ventana normal". Las
        // dos cosas eran falsas y se contradecian con los frenos de difusion de dos lineas
        // mas abajo: WhatsApp Web SI hace envios masivos (wa-bridge/src/bulk.js) y NO tiene
        // ventana de 24 h -- esa es una regla del API oficial, no de WhatsApp Web. Quien lo
        // leia daba por hecho que no podia escribirle a un cliente de hace un mes.
        : 'Sin sesión activa. Este canal usa WhatsApp Web, no el API: <b>no hay ventana de '
          + '24 h ni plantillas</b>, se escribe como desde el teléfono.')
      // Los frenos no son un detalle: son la diferencia entre una campana y un numero
      // bloqueado. Se dicen aqui porque es donde se decide usar este canal.
      + '<br>Sus conversaciones <b>sí</b> se ven aquí, junto a las del número oficial. '
      + 'En envíos masivos va con freno: <b>40 a 120 s entre mensajes</b>, pausa de '
      + '<b>10 min cada 20</b>, tope de <b>80 al día</b>, texto variado por destinatario y '
      + 'solo a quien ya te escribió y no se dio de baja.',
      bridgeControlsHtml(p),
      puenteVinculadoEnPausa ? { clase: 'medio', texto: 'en pausa' } : null)

    // Con las redes ocultas, en vez de dos tarjetas abiertas --que invitan a atender por ahi--
    // va una sola nota con lo guardado y la conexion tecnica PLEGADA debajo. Las dos llamadas a
    // tarjetaRed no se tocan ni se borran: siguen ahi, a un clic, con sus botones de iniciar
    // sesion e importar historial intactos para el dia que se reactiven.
    + (REDES_ACTIVAS === true ? '' : notaRedesOcultas()
        + '<details class="plegado"><summary>Conexión técnica de Instagram y Messenger</summary>')

    + tarjetaRed('instagram', redes.instagram,
      'Se conecta iniciando sesión con Facebook y aceptando los permisos de la cuenta: '
      + '<code>instagram_manage_messages</code> y <code>pages_manage_metadata</code>. '
      + 'La cuenta de Instagram tiene que ser profesional y estar enlazada a la página.')

    + tarjetaRed('facebook', redes.facebook,
      'Mismo inicio de sesión que Instagram, con <code>pages_messaging</code>.')

    + (REDES_ACTIVAS === true ? '' : '</details>');

  cont.onclick = async ev => {
    // La salida de las redes ocultas: pone su filtro de canal y abre Conversaciones. Sin esto,
    // esconder seria borrar -- no quedaria ninguna forma de llegar a esos chats desde el panel.
    const verOcultas = ev.target.closest('[data-ver-ocultas]');
    if (verOcultas) {
      filtro = 'can:' + verOcultas.dataset.verOcultas;
      ve('conversations');
      return;
    }
    const sinc = ev.target.closest('[data-sync]');
    if (sinc) {
      const antes = sinc.textContent;
      sinc.disabled = true; sinc.textContent = 'Importando…';
      // Con el contador corriendo se ve que sigue viva. Una importacion de Instagram tarda
      // unos veinte segundos --Meta responde despacio y hay que reintentar-- y un boton que
      // dice "Importando…" sin moverse durante ese rato es indistinguible de uno colgado.
      // Pulsarlo otra vez es lo natural, y es justo lo peor: Meta ya esta limitando.
      let seg = 0;
      const reloj = setInterval(() => { seg += 1; sinc.textContent = 'Importando… ' + seg + ' s'; }, 1000);
      const r = await llama({ action:'syncSocial', red: sinc.dataset.sync, paginas: 25 });
      clearInterval(reloj);
      sinc.disabled = false; sinc.textContent = antes;
      if (!r.ok) return avisa('No se pudo importar', r.error);
      // Se dicen los dos numeros: si hay hilos pero cero mensajes nuevos, es que ya
      // estaban importados, no que la importacion fallara.
      //
      // Y se dice lo que NO se pudo traer. El servidor ya lo calculaba --corto, errores,
      // fallidos-- y el panel lo tiraba: quien importaba 250 de 400 leia "250
      // conversación(es)" y se quedaba pensando que ya estaban todas. Una importacion
      // incompleta que se anuncia como completa es peor que una que falla.
      const pegas = [];
      if (r.corto) pegas.push('quedaron más sin traer: vuelve a pulsar para seguir');
      if (r.errores?.length) pegas.push('Meta falló en: ' + r.errores.map(e => e.folder).join(', '));
      if (r.fallidos) pegas.push(r.fallidos + ' conversación(es) no se pudieron leer');
      if (r.truncados) pegas.push(r.truncados + ' conversación(es) son tan largas que se '
        + 'trajeron solo sus últimos mensajes');
      // Cuando NO falta nada, hay que decirlo con todas las letras. El mensaje anterior
      // solo daba un numero, y un numero pequeno se lee como fallo: se importaban las 3
      // conversaciones que Meta expone de Instagram y la conclusion era "el CRM no sube los
      // mensajes". No lo era -- comprobado contra la API el 04/09/2026: Instagram devuelve 3
      // hilos y Messenger 47, que es exactamente lo que hay en el CRM. Lo que faltaba era
      // decir de quien es el limite.
      const limite = pegas.length ? '' : ' Meta no tiene más que enseñar por su API: esto es '
        + 'todo lo que deja ver de este canal.'
        + (sinc.dataset.sync === 'instagram'
          // La ruta lleva un nivel mas del que se puso al principio: "Controles de mensajes"
          // va entre medias, y sin ese paso no aparece "Herramientas conectadas". Verificado
          // contra la ayuda de Meta el 05/09/2026, despues de que el dueno no la encontrara.
          ? ' Si en el teléfono ves más chats, quien no los comparte es la app de Instagram: '
            + 'Configuración y privacidad → Mensajes y respuestas a historias → Controles de '
            + 'mensajes → Herramientas conectadas → Permitir acceso a los mensajes. '
            // Y aunque se active, hay una parte que no volvera nunca: conviene saberlo antes
            // de dar por hecho que el CRM esta roto.
            + 'Aun así, los mensajes de la carpeta Solicitudes con más de 30 días Meta no los '
            + 'devuelve nunca, por mucho que se active el permiso.'
          : ' Los chats de Marketplace que vendes desde tu perfil personal no pasan por aquí: '
            + 'Meta retiró hace años el permiso que los leía. Solo entran los de Marketplace '
            + 'vendidos desde la página.');
      const red = sinc.dataset.sync;
      const cuando = new Date().toLocaleTimeString('es-DO', { hour:'2-digit', minute:'2-digit' });
      // "0 mensajes nuevos" NO es un fallo, y hay que decirlo con esas palabras: significa
      // que ya estaban todos. Sin eso se lee como que la importacion no funciono.
      const resumen = r.mensajes === 0
        ? '<b>' + cuando + ':</b> ' + r.hilos + ' conversación(es), ninguna novedad — ya estaban '
          + 'todas importadas.'
        : '<b>' + cuando + ':</b> ' + r.hilos + ' conversación(es), ' + r.mensajes + ' mensaje(s) nuevo(s).';
      ULTIMA_IMPORTACION[red] = resumen
        + (pegas.length ? ' ' + esc(pegas.join('. ')) + '.' : '')
        // El tope de Meta se repite aqui porque es donde se mira despues, no en el aviso.
        + (!pegas.length && red === 'instagram'
            ? ' Instagram no expone más: volver a pulsar no va a traer nada.' : '');
      avisa(pegas.length ? 'Historial importado a medias' : 'Historial importado',
        r.hilos + ' conversación(es), ' + r.mensajes + ' mensaje(s) nuevo(s).'
        + (pegas.length ? ' ' + pegas.join('. ') + '.' : limite));
      return pintaCanales();
    }
    const bot = ev.target.closest('[data-canal-bot]');
    if (bot) {
      // El bot se enciende y se apaga POR CANAL. Antes era un interruptor unico: apagarlo
      // para el segundo numero apagaba tambien el oficial, y al reves.
      const cual = bot.dataset.canalBot;
      const encendido = /encendido/.test(bot.textContent);
      if (!await confirmaAqui((encendido ? 'Apagar' : 'Encender') + ' el bot SOLO en '
        + (cual === 'official' ? 'WhatsApp oficial' : 'WhatsApp Web') + '.\n\n¿Seguro?')) return;
      bot.disabled = true;
      // Encender el bot del puente exige la frase exacta (index.js:1710). Sin ella el
      // interruptor era de una sola direccion: apagaba y no volvia a encender nunca.
      const r = cual === 'official'
        ? await llama({ action:'setOfficialBot', enabled: !encendido })
        : await llama({ action:'setPhotoBot', enabled: !encendido,
            ...(encendido ? {} : { confirmation: 'ACTIVAR BOT FOTOS' }) });
      bot.disabled = false;
      if (!r.ok) return avisa('No se pudo cambiar', r.error);
      avisa('Bot ' + (encendido ? 'apagado' : 'encendido'),
        'Solo en ' + (cual === 'official' ? 'WhatsApp oficial' : 'WhatsApp Web') + '.');
      pintaCanales();
      return;
    }
    if (ev.target.closest('[data-desconecta-puente]')) {
      if (!await confirmaAqui('Se cerrará la sesión de WhatsApp Web del segundo número.\n\n'
        + 'Los chats que entraron por ahí se conservan, pero dejarás de recibir mensajes nuevos '
        + 'por ese número hasta volver a conectarlo.\n\n¿Desconectar?')) return;
      const r = await llama({ action:'logoutBridge' });
      avisa(r.ok ? 'WhatsApp Web desconectado' : 'No se pudo desconectar', r.ok ? '' : r.error);
      pintaCanales();
      return;
    }
    const red = ev.target.closest('[data-conecta]');
    if (red) {
      // El inicio de sesion de Meta se abre en su propia ventana y devuelve el permiso
      // a la funcion, que es donde vive el App Secret. La clave nunca pasa por aqui: el
      // panel solo abre la ventana y espera a que la funcion diga que quedo conectado.
      const cual = red.dataset.conecta;
      // La ventana se abre AQUI MISMO, antes de cualquier await.
      //
      // Esto no es un detalle de estilo: el navegador solo deja abrir una ventana mientras
      // dura el gesto del usuario, y ese permiso se consume en el primer await. Al pedir
      // el pase primero y abrir despues, Chrome bloqueaba la ventana -- o la abria en
      // blanco sin navegar nunca. Desde fuera se ve como "se quedó cargando", que es
      // exactamente lo que paso. La funcion no llego a recibir ni una peticion.
      // Se intenta la ventana aparte, que es mas comodo: el panel se queda donde estaba.
      // Pero NO se depende de ella. Si el navegador la bloquea -- y con este flujo la
      // bloquea a menudo -- se navega la pestaña actual, que no hay bloqueador que lo
      // impida. Antes ahi terminaba el camino y el dueño se quedaba mirando una ventana
      // que no iba a cargar nunca.
      const w = window.open('', 'conectar_' + cual, 'width=620,height=740');
      // Algo en la ventana mientras se pide el pase: una ventana en blanco es
      // indistinguible de una que se colgo.
      if (w) {
        // Algo en la ventana mientras se pide el pase: una ventana en blanco es
        // indistinguible de una colgada.
        try {
          w.document.write('<!doctype html><meta charset="utf-8">'
            + '<title>Conectando…</title><body style="margin:0;display:flex;align-items:center;'
            + 'justify-content:center;height:100vh;font:15px system-ui;color:#111b21">'
            + 'Abriendo el inicio de sesión de Meta…</body>');
        } catch (e) { /* si el navegador no deja escribir, la ventana sigue sirviendo */ }
      }

      // El pase es de un solo uso: crmOauth no arranca sin el, asi que la conexion solo
      // la puede iniciar alguien con sesion en el panel.
      const p = await llama({ action:'oauthPase', red: cual });
      if (!p.ok) { try { if (w) w.close(); } catch (e) {} return avisa('No se pudo iniciar la conexión', p.error); }
      const base = String(CFG.firebaseFunctionsBase || '').replace(/\/$/, '');
      // 'red' sigue viajando aqui porque esta es NUESTRA url de arranque, no el
      // redirect_uri que Meta compara. El pase tambien la lleva, por si acaso.
      const url = base + '/crmOauth?red=' + encodeURIComponent(cual)
        + '&pase=' + encodeURIComponent(p.pase)
        // A donde volver cuando Meta termine. Sin esto la persona acaba en una pagina
        // suelta de Cloud Functions sin forma de regresar al panel.
        + '&volver=' + encodeURIComponent(location.origin + location.pathname + '#canales');
      let enVentana = false;
      if (w) { try { w.location.href = url; enVentana = true; } catch (e) { try { w.close(); } catch (e2) {} } }
      if (enVentana) {
        avisa('Inicia sesión en la ventana', 'Acepta los permisos y vuelve aquí.');
      } else {
        // Sin ventana: va la pestaña entera. Es menos comodo, pero funciona siempre, y
        // crmOauth trae de vuelta al panel al terminar.
        avisa('Abriendo el inicio de sesión de Meta', 'Al aceptar los permisos vuelves aquí solo.');
        location.href = url;
        return;
      }
      // Se refresca al cerrarse la ventana: es cuando el permiso ya esta dado o no.
      const vigila = setInterval(() => {
        if (!w.closed) return;
        clearInterval(vigila);
        pintaCanales();
      }, 1200);
      return;
    }
    if (ev.target.closest('[data-conecta-puente]')) {
      // El servidor exige el numero. Iba 18094785620 escrito a mano, asi que con otra linea
      // vinculada este boton pedia el codigo para el telefono equivocado. Sale del estado del
      // puente: el conectado, el ultimo pedido o el ultimo que estuvo vinculado.
      const phone = soloDigitos(bridgeControlState.connected_phone || bridgeControlState.requested_phone
        || bridgeControlState.last_linked_phone || TELEFONO_PUENTE);
      if (!/^[1-9][0-9]{7,14}$/.test(phone)) {
        return avisa('Falta el número', 'Escribe el número a vincular en el campo de la tarjeta de WhatsApp Web.');
      }
      const r = await llama({ action:'requestBridgePairing', phone });
      if (!r.ok) return avisa('No se pudo pedir el código', r.error);
      abreModal('<div class="mtapa"><b>Conectar WhatsApp Web</b><button class="cerrarm" data-cerrar>×</button></div>'
        + '<div class="mcuerpo"><p class="aviso">En el teléfono del segundo número: '
        + 'WhatsApp → Dispositivos vinculados → Vincular con número de teléfono.</p>'
        + '<div class="codigo" id="codPuente"><span class="cargando"></span></div>'
        + '<p class="cfgnota" id="codNota">Pidiendo el código al puente…</p></div>');
      $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });
      // El codigo no viene en esta respuesta: el anfitrion lo escribe despues, y llega
      // anidado en bridge.pairing_code. Se sondea hasta que aparezca en vez de pintar un
      // guion y quedarse ahi.
      let intentos = 0;
      const reloj = setInterval(async () => {
        if (!document.getElementById('codPuente')) return clearInterval(reloj);
        const e = await llama({ action:'bridgeStatus' });
        const cod = e.ok ? (e.bridge?.pairing_code || e.pairing_code) : null;
        if (cod) {
          clearInterval(reloj);
          $('codPuente').textContent = cod;
          $('codNota').textContent = 'Escríbelo en el teléfono. Caduca en unos minutos.';
        } else if (++intentos > 40) {
          clearInterval(reloj);
          $('codPuente').textContent = '—';
          $('codNota').textContent = 'El puente no devolvió código. Comprueba que el servicio '
            + 'del segundo número está corriendo en la máquina del negocio.';
        }
      }, 3000);
    }
  };
  renderBridgeControlState(p);
  bindBridgeControls();
}

/* ---- Configuración ------------------------------------------------------- */
// Doce tarjetas, las mismas que tenia el panel anterior. Se releyo su vista de
// configuracion una a una para no dejarse ninguna fuera; la primera version de v2 solo
// enseñaba el rol y el equipo.
//
// Los ajustes viven en la tabla settings del servidor, no en el navegador: son del
// negocio. Si viven en localStorage, cada persona tiene los suyos y el CRM se comporta
// distinto segun quien lo abra.
const AJUSTES = {};

async function cargaAjustes(){
  const r = await llama({ action:'data', table:'settings', operation:'select', limit: 200 });
  if (!r.ok) return false;
  (r.data || r.rows || []).forEach(f => { if (f?.key) AJUSTES[f.key] = f.value; });
  return true;
}
async function guardaAjuste(clave, valor){
  const r = await llama({ action:'data', table:'settings', operation:'upsert',
    payload:{ id: clave, key: clave, value: String(valor), updated_at: new Date().toISOString() },
    on_conflict:'id' });
  if (!r.ok) { avisa('No se pudo guardar', r.error); return false; }
  AJUSTES[clave] = String(valor);
  return true;
}

// Donde va una tarjeta: su categoria, su seccion y su lugar dentro de ella.
function lugarDeCfg(titulo){
  const cat = categoriaDeCfg(titulo);
  const secciones = SECCIONES_CFG[cat] || [];
  for (let i = 0; i < secciones.length; i++) {
    const k = secciones[i].tarjetas.indexOf(titulo);
    if (k >= 0) return { cat, sec: secciones[i].id, rango: i * 100 + k };
  }
  return { cat, sec: 'otros', rango: 9999 };
}
// Un texto largo se parte en su primera frase (que se ve) y el resto (plegado). Nunca corta una negrita a medias.
function partesNotaCfg(nota){
  const t = String(nota || '');
  if (t.length <= 190) return { resumen: t, resto: '' };
  const re = /([.!?])\s+(?=[A-ZÁÉÍÓÚ¿¡<])/g;
  let m;
  while ((m = re.exec(t))) {
    const corte = m.index + 1, cabeza = t.slice(0, corte);
    if (corte >= 40 && (cabeza.match(/<b>/g) || []).length === (cabeza.match(/<\/b>/g) || []).length) return { resumen: cabeza, resto: t.slice(corte).replace(/^(\s|<br>)+/, '') };
  }
  return { resumen: t, resto: '' };
}
// Sin acentos ni mayusculas: «configuracion» encuentra «Configuración».
function planoCfg(t){ return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
// Que tarjetas se ven: con texto en el buscador, las que lo contienen (de cualquier categoria); sin el,
// las de la categoria elegida.
function visibleEnCfg(tarjeta, categoria, busqueda){
  const q = planoCfg(busqueda).trim();
  if (q) return planoCfg(tarjeta.texto).includes(q);
  return tarjeta.cat === categoria;
}

let CFG_CAT = 'cuenta';
try { CFG_CAT = localStorage.getItem('crm_cfg_cat') || 'cuenta'; } catch (e) {}
let CFG_BUSCA = '';

function aplicaCfgFiltro(){
  const g = $('cfgGrid'); if (!g) return;
  const tarjetas = [...g.querySelectorAll('.cfgc')];
  const cuenta = {};
  for (const t of tarjetas) cuenta[t.dataset.cat] = (cuenta[t.dataset.cat] || 0) + 1;
  // Una categoria elegida que ya no existe (o sin tarjetas para este rol) no deja la pagina en blanco.
  const hay = c => (cuenta[c] || 0) > 0;
  if (!hay(CFG_CAT)) CFG_CAT = (CATEGORIAS_CFG.find(c => hay(c.id)) || { id: 'otros' }).id;
  let visibles = 0;
  for (const t of tarjetas) {
    const ver = visibleEnCfg({ cat: t.dataset.cat, texto: t.textContent }, CFG_CAT, CFG_BUSCA);
    t.hidden = !ver;
    if (ver) visibles++;
  }
  const tabs = $('cfgTabs');
  if (tabs) {
    const lista = CATEGORIAS_CFG.concat(cuenta.otros ? [{ id: 'otros', nombre: 'Otros' }] : []).filter(c => hay(c.id));
    tabs.innerHTML = lista.map(c => '<button class="cfg-tab' + (!CFG_BUSCA && CFG_CAT === c.id ? ' on' : '') + '" data-cfgcat="' + c.id + '">'
      + esc(c.nombre) + '<i>' + cuenta[c.id] + '</i></button>').join('');
    tabs.classList.toggle('en-busqueda', !!CFG_BUSCA.trim());
  }
  const vacio = $('cfgVacio');
  if (vacio) vacio.hidden = visibles > 0;
  for (const h of g.querySelectorAll('.cfg-sec')) {
    h.hidden = ![...g.querySelectorAll('.cfgc')].some(t => t.dataset.cat === h.dataset.cat && t.dataset.sec === h.dataset.sec && !t.hidden);
  }
}

function tarjetaCfg(titulo, nota, cuerpo, ancla){
  const l = lugarDeCfg(titulo), n = partesNotaCfg(nota);
  return '<div class="cfgc" data-cat="' + l.cat + '" data-sec="' + l.sec + '" data-rango="' + l.rango + '"' + (ancla ? ' id="' + esc(ancla) + '"' : '') + '><h3>' + esc(titulo) + '</h3>'
    + (n.resumen ? '<p class="cfgnota">' + n.resumen + '</p>' : '')
    + (n.resto ? '<details class="cfg-mas"><summary>Más detalles</summary><p class="cfgnota">' + n.resto + '</p></details>' : '')
    + cuerpo + '</div>';
}
// Pone las tarjetas en el orden de sus secciones y antepone a cada seccion su titulo. Se hace una vez, al pintar.
function ordenaCfg(g){
  const tarjetas = [...g.querySelectorAll('.cfgc')];
  const cat = t => t.dataset.cat;
  const pos = c => { const i = CATEGORIAS_CFG.findIndex(x => x.id === c); return i < 0 ? 99 : i; };
  tarjetas.sort((a, b) => pos(cat(a)) - pos(cat(b)) || Number(a.dataset.rango) - Number(b.dataset.rango));
  g.querySelectorAll('.cfg-sec').forEach(x => x.remove());
  let previa = '';
  for (const t of tarjetas) {
    const clave = cat(t) + ':' + t.dataset.sec;
    if (clave !== previa) {
      previa = clave;
      const def = (SECCIONES_CFG[cat(t)] || []).find(x => x.id === t.dataset.sec) || { nombre: 'Otros ajustes', nota: '' };
      const h = document.createElement('div');
      h.className = 'cfg-sec'; h.dataset.cat = cat(t); h.dataset.sec = t.dataset.sec;
      h.innerHTML = '<h2>' + esc(def.nombre) + '</h2>' + (def.nota ? '<p>' + esc(def.nota) + '</p>' : '');
      g.appendChild(h);
    }
    g.appendChild(t);
  }
}

// Lleva a una tarjeta de Configuracion y la resalta. La vista se pinta sola y tarda (pide
// ajustes, whoami y el estado de Google), asi que se espera a que exista en vez de dar por
// hecho que ya esta.
function vaATarjetaCfg(ancla){
  ve('config');
  let vueltas = 0;
  const busca = () => {
    const el = document.getElementById(ancla);
    if (!el) { if (vueltas++ < 60) setTimeout(busca, 100); return; }
    // La tarjeta puede estar en otra categoria (oculta): se cambia a esa y se limpia el buscador.
    if (el.dataset.cat && (el.hidden || CFG_BUSCA)) {
      CFG_CAT = el.dataset.cat; CFG_BUSCA = '';
      const b = $('cfgBuscar'); if (b) b.value = '';
      aplicaCfgFiltro();
    }
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('resaltado');
    setTimeout(() => el.classList.remove('resaltado'), 1800);
  };
  setTimeout(busca, 60);
}

// El enlace del calendario LLEVA SU LLAVE, y esa es toda la historia de por que la agenda
// nunca aparecio en Google. crmAgenda exige ?key= y contesta 401 sin ella; el panel ensenaba
// la URL pelada, se pegaba en Google, Google recibia un 401 y se quedaba callado. Desde
// fuera: "el calendario no conecta".
function urlAgenda(){
  const base = CFG.firebaseAgendaUrl || '';
  const llave = AJUSTES.agenda_feed_key || '';
  if (!base || !llave) return '';
  return base + (base.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(llave);
}
// La llave viaja dentro de una URL que se pega en Google, o sea que no puede ser adivinable:
// quien la acierte ve la agenda entera --nombre del cliente, telefono y notas--. 32 bytes del
// generador del navegador, en hexadecimal.
function nuevaLlaveAgenda(){
  const bytes = new Uint8Array(32);
  crypto.getRandomValues(bytes);
  return [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
}
// La otra puerta con llave: la del Atajo del iPhone. Es DISTINTA de la del calendario a
// proposito --cambiar una no puede dejar muda a la otra-- y se guarda en los ajustes del CRM,
// no en crm-config.js, que es publico. Si algun dia crmRecordatorios responde 404 en la base
// de funciones, se pone su URL propia en crm-config.js (firebaseRecordatoriosUrl), como hubo
// que hacer con el calendario.
function urlRecordatoriosIphone(){
  const base = String(CFG.firebaseRecordatoriosUrl
    || (CFG.firebaseFunctionsBase ? String(CFG.firebaseFunctionsBase).replace(/\/$/, '') + '/crmRecordatorios' : ''));
  const llave = AJUSTES.iphone_tasks_key || '';
  if (!base || !llave) return '';
  return base + (base.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(llave);
}

// El cerebro local etiqueta con reglas y con un clasificador que aprende de lo ya decidido (personas,
// Gemini, compras de caja), y acumula preguntas frecuentes y precios reales. Esta tarjeta dice en que

const TAREAS_CEREBRO = { categoria:'Categoría', etapa:'Etapa del embudo', interes:'Nivel de interés', humano:'Necesita a una persona' };
const SERVICIOS_CEREBRO = { general:'Sin servicio claro' };
function estadoCerebro(e){
  if (!e || !e.ok) return { id:'sin', texto:'No se pudo leer el estado del cerebro.' };
  if (!e.activo) return { id:'apagado', texto:'Apagado: no etiqueta ni aprende.' };
  if (e.madurez && e.madurez.listo) return { id:'listo', texto:'Listo: coincide con la IA lo suficiente para dejar de usarla.' };
  const cat = e.madurez && e.madurez.tareas && e.madurez.tareas.categoria;
  const medidos = cat ? cat.total : 0;
  return { id:'aprendiendo', texto: medidos < 150
    ? 'Aprendiendo: ha medido ' + medidos + ' de 150 casos para poder compararse con la IA.'
    : 'Aprendiendo: coincide ' + (cat.coincidencia == null ? '—' : cat.coincidencia) + ' % con la IA en categoría; necesita 90 %.' };
}
function textoPrecio(monto){
  return 'RD$' + Number(monto || 0).toLocaleString('en-US');
}

function cerebroCuerpo(e){
  const est = estadoCerebro(e);
  const filas = Object.keys(TAREAS_CEREBRO).map(t => {
    const m = e.madurez && e.madurez.tareas && e.madurez.tareas[t];
    const pct = m && m.coincidencia != null ? m.coincidencia : null;
    return '<div class="cb-fila"><span>' + esc(TAREAS_CEREBRO[t]) + '</span>'
      + '<span class="cb-barra"><i style="width:' + (pct == null ? 0 : pct) + '%"></i></span>'
      + '<b>' + (pct == null ? 'sin medir' : pct + ' %') + '</b>'
      + '<small>' + Number((e.muestras && e.muestras[t]) || 0) + ' ejemplos</small></div>';
  }).join('');
  const precios = Object.entries(e.precios || {}).filter(([, v]) => v && v.length).slice(0, 6).map(([servicio, v]) =>
    '<div class="cb-conoc"><b>' + esc(SERVICIOS_CEREBRO[servicio] || servicio) + '</b><span>'
    + v.map(x => esc(textoPrecio(x.monto)) + ' <small>×' + x.veces + '</small>').join(' · ') + '</span></div>').join('');
  const faq = Object.entries(e.faq || {}).filter(([, v]) => v && v.length).slice(0, 4).map(([intencion, v]) =>
    '<div class="cb-conoc"><b>' + esc(intencion.replace(/_/g, ' ')) + '</b><span>' + esc(v[0].respuesta) + ' <small>×' + v[0].veces + '</small></span></div>').join('');
  return '<div class="cb-estado ' + est.id + '"><b>' + esc(est.texto) + '</b></div>'
    + '<div class="cb-kpis"><div><b>' + Number(e.aprendidas || 0) + '</b><span>conversaciones aprendidas</span></div>'
    + '<div><b>' + Number(e.analizadas || 0) + '</b><span>analizadas y etiquetadas</span></div>'
    + '<div><b>' + Number(e.aplicadas || 0) + '</b><span>con cambios aplicados</span></div></div>'
    + '<div class="cb-tabla">' + filas + '</div>'
    + (precios ? '<div class="seccion" style="margin-top:14px">Precios que se han dicho</div>' + precios : '')
    + (faq ? '<div class="seccion" style="margin-top:14px">Lo que se responde a lo más preguntado</div>' + faq : '')
    + '<label class="cfgsw"><input type="checkbox" data-cerebro="activo"' + (e.activo ? ' checked' : '') + '><span><b>Cerebro encendido</b>'
    + '<i>Cada 30 minutos etiqueta y aprende. No llama a ninguna API y no escribe a nadie.</i></span></label>'
    + '<label class="cfgsw"><input type="checkbox" data-cerebro="api"' + (e.api_apagada ? ' checked' : '') + '><span><b>Dejar de usar la API para etiquetar</b>'
    + '<i>' + (est.id === 'listo' ? 'Ya coincide con la IA: puedes apagarla y ahorrar esa cuota.' : 'Solo se recomienda cuando coincide con la IA. Puedes forzarlo, pero perderías esa comparación.') + '</i></span></label>';
}

/* ---- Funnel / Kanban ----------------------------------------------------- */
// Arrastrar una tarjeta cambia la etapa del lead de verdad. Por eso la tarjeta vuelve
// a su sitio si el servidor rechaza el cambio: dejarla en la columna nueva la haria
// mentir hasta el siguiente refresco, y quien la movio se iria creyendo que se guardo.
// ---- Funnel: piezas puras
// El funnel tenia una columna «Nuevo» con mas de mil tarjetas de tres lineas: para llegar a algo
// habia que desplazarse sin fin. Ahora se filtra, se ordena, las tarjetas son compactas y cada
// columna se puede plegar o esconder. Nada de esto toca a los contactos: solo cambia lo que se ve.
const FUN_DEFECTO = { q: '', sinLeer: false, humano: false, cat: '', dias: 0, orden: 'reciente',
  densidad: 'compacta', ocultarVacias: false, ocultas: [], plegadas: [], vista: 'embudo', etapa: 'cotizando' };
const FUN_ORDENES = [['reciente', 'Más reciente primero'], ['antiguo', 'Más antiguo primero'],
  ['nombre', 'Nombre (A–Z)'], ['sinleer', 'Sin leer primero']];
const FUN_DIAS = [[0, 'Cualquier fecha'], [1, 'Hoy'], [7, 'Últimos 7 días'], [30, 'Últimos 30 días']];
const FUN_TANDA = 40;
function planoFun(t){ return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function instanteFun(c){ const t = Date.parse(String(c && c.last_message_at || '')); return Number.isFinite(t) ? t : 0; }
// `nombre` es nombreDe: se recibe para poder probar esto sin el resto del panel.
function filtraFunnel(convs, F, ahora, nombre){
  const q = planoFun(F.q).trim();
  const desde = F.dias > 0 ? ahora - F.dias * 86400000 : 0;
  return (convs || []).filter(c => {
    if (F.sinLeer && !(Number(c.unread) > 0)) return false;
    if (F.humano && !(c.human_handoff_required || c.lead_status === 'esperando_nosotros')) return false;
    if (F.cat && String(c.interested_category || '') !== F.cat) return false;
    if (desde && instanteFun(c) < desde) return false;
    if (q && !planoFun([nombre(c), c.last_message_preview, c.interested_category].join(' ')).includes(q)) return false;
    return true;
  });
}
function ordenaFunnel(lista, orden, nombre){
  const l = lista.slice();
  if (orden === 'antiguo') return l.sort((a, b) => instanteFun(a) - instanteFun(b));
  if (orden === 'nombre') return l.sort((a, b) => nombre(a).localeCompare(nombre(b), 'es', { sensitivity: 'base' }));
  if (orden === 'sinleer') return l.sort((a, b) => (Number(b.unread) > 0) - (Number(a.unread) > 0) || instanteFun(b) - instanteFun(a));
  return l.sort((a, b) => instanteFun(b) - instanteFun(a));
}
// Los filtros activos como fichas que se quitan de una en una.
function fichasFunnel(F){
  const f = [];
  if (F.q.trim()) f.push({ clave: 'q', texto: '«' + F.q.trim() + '»' });
  if (F.sinLeer) f.push({ clave: 'sinLeer', texto: 'Sin leer' });
  if (F.humano) f.push({ clave: 'humano', texto: 'Esperando a una persona' });
  if (F.cat) f.push({ clave: 'cat', texto: F.cat });
  if (F.dias) f.push({ clave: 'dias', texto: (FUN_DIAS.find(d => d[0] === F.dias) || [0, ''])[1] });
  return f;
}
// El embudo en cifras: por etapa, cuantos hay (con los filtros puestos), cuantos son en total y que parte
// del total representa. `ancho` es el largo de la barra respecto a la etapa mas llena.
function resumenEmbudo(convs, filtradas, etapas){
  const de = c => c.lifecycle_stage || 'nuevo';
  const total = Math.max(1, (convs || []).length);
  const cuenta = (lista, e) => (lista || []).filter(c => de(c) === e).length;
  const max = Math.max(1, ...etapas.map(e => cuenta(filtradas, e)));
  return etapas.map(e => {
    const todas = cuenta(convs, e), n = cuenta(filtradas, e);
    return { e, todas, n, pct: Math.round(todas / total * 100), ancho: n ? Math.max(6, Math.round(n / max * 100)) : 0 };
  });
}
// La etapa que se enseña: la elegida si sigue visible; si no, la primera de las que suelen trabajarse que tenga gente.
function etapaDelEmbudo(resumen, elegida){
  if (resumen.some(r => r.e === elegida)) return elegida;
  for (const e of ['cotizando', 'pendiente_reserva', 'interesado', 'nuevo']) {
    const r = resumen.find(x => x.e === e); if (r && r.n) return e;
  }
  return resumen.length ? resumen[0].e : '';
}
// ---- Funnel: fin de las piezas puras

let FUN = Object.assign({}, FUN_DEFECTO);
try { FUN = Object.assign({}, FUN_DEFECTO, JSON.parse(localStorage.getItem('crm_funnel') || '{}')); FUN.q = ''; } catch (e) {}
const FUN_LIMITE = {};       // cuantas tarjetas se ven por columna (se amplia con «Ver más»)
function guardaFun(){ try { localStorage.setItem('crm_funnel', JSON.stringify(FUN)); } catch (e) {} }

function categoriasFunnel(){
  const n = new Map();
  for (const c of CONVS) { const k = String(c.interested_category || '').trim(); if (k) n.set(k, (n.get(k) || 0) + 1); }
  return [...n.entries()].sort((a, b) => b[1] - a[1]).slice(0, 12);
}

      ...FUN_DIAS.map(([d, t]) => ({ id: 'dias:' + d, texto: t })),
    ], {
      mantener: true,
      elegidas: () => [FUN.sinLeer ? 'sinLeer' : '', FUN.humano ? 'humano' : '', 'cat:' + FUN.cat, 'dias:' + FUN.dias],
      alElegir: id => {
        if (id === 'sinLeer' || id === 'humano') FUN[id] = !FUN[id];
        else if (id.startsWith('cat:')) FUN.cat = id.slice(4);
        else if (id.startsWith('dias:')) FUN.dias = Number(id.slice(5));
        guardaFun(); pintaKanban();
      },
    });
    $('funReorg').onclick = () => menuFlotante($('funReorg'), [
      { rotulo: 'Ordenar por' },
      ...FUN_ORDENES.map(([k, t]) => ({ id: 'o:' + k, texto: t })),
      { sep: true }, { rotulo: 'Tarjetas' },
      { id: 'd:compacta', texto: 'Compactas' }, { id: 'd:comoda', texto: 'Cómodas' },
      { sep: true }, { rotulo: 'Etapas visibles' },
      ...ETAPAS.map(e => ({ id: 'e:' + e, texto: e.replace(/_/g, ' '), nota: CONVS.filter(c => (c.lifecycle_stage || 'nuevo') === e).length + '' })),
      { id: 'vacias', texto: 'Ocultar las etapas vacías' },
      { sep: true }, { id: 'reset', texto: 'Restablecer' },
    ], {
      mantener: true,
      elegidas: () => ['o:' + FUN.orden, 'd:' + FUN.densidad, FUN.ocultarVacias ? 'vacias' : '',
        ...ETAPAS.filter(e => !FUN.ocultas.includes(e)).map(e => 'e:' + e)],
      alElegir: id => {

        else if (id.startsWith('d:')) FUN.densidad = id.slice(2);
        else if (id === 'vacias') FUN.ocultarVacias = !FUN.ocultarVacias;
        else if (id.startsWith('e:')) {
          const e = id.slice(2);

        } else if (id === 'reset') { FUN = Object.assign({}, FUN_DEFECTO); $('funBusca').value = ''; for (const k in FUN_LIMITE) delete FUN_LIMITE[k]; }
        guardaFun(); pintaKanban();
      },
    });
    $('funSw').addEventListener('click', ev => {
      const b = ev.target.closest('[data-fvista]'); if (!b) return;
      FUN.vista = b.dataset.fvista; guardaFun(); pintaKanban();
    });
    $('funEmbudo').addEventListener('click', ev => {
      const et = ev.target.closest('[data-fetapa]');
      if (et) { FUN.etapa = et.dataset.fetapa; guardaFun(); pintaKanban(); return; }
      const mv = ev.target.closest('[data-fmover]');
      if (mv) {
        const c = buscaConv(mv.dataset.fmover); if (!c) return;
        menuFlotante(mv, ETAPAS.map(e => ({ id: 'm:' + e, texto: e.replace(/_/g, ' ') })), {
          elegida: 'm:' + (c.lifecycle_stage || 'nuevo'), alElegir: k => mueveLeadDeEtapa(c, k.slice(2)) });
        return;
      }
      const mas = ev.target.closest('[data-kmas]');
      if (mas) { FUN_LIMITE[mas.dataset.kmas] = (FUN_LIMITE[mas.dataset.kmas] || FUN_TANDA) + FUN_TANDA; pintaKanban(); return; }
      const fila = ev.target.closest('[data-fabre]');
      if (fila) { const c = buscaConv(fila.dataset.fabre); if (c) { ve('conversations'); abre(c); } }
    });
    $('kanban').addEventListener('click', ev => {
      const mas = ev.target.closest('[data-kmas]');
      if (mas) { FUN_LIMITE[mas.dataset.kmas] = (FUN_LIMITE[mas.dataset.kmas] || FUN_TANDA) + FUN_TANDA; pintaKanban(); return; }
      const cab = ev.target.closest('[data-kplega]');
      if (cab) {
        const e = cab.dataset.kplega;
        FUN.plegadas = FUN.plegadas.includes(e) ? FUN.plegadas.filter(x => x !== e) : FUN.plegadas.concat(e);
        guardaFun(); pintaKanban();
      }
    });
  }
  pintaKanban();
  pintaMovilizacion();
}

// Cambia la etapa de un lead. Se mueve ya (para que se sienta inmediato) y vuelve si el servidor dice que no.
async function mueveLeadDeEtapa(c, etapa){
  if (!c || (c.lifecycle_stage || 'nuevo') === etapa) return;
  const anterior = c.lifecycle_stage;
  c.lifecycle_stage = etapa;
  pintaKanban();
  const r = await llama({ action:'updateLead', conversation_id: c.id || c._id, fields:{ lifecycle_stage: etapa } });
  if (!r.ok) {
    c.lifecycle_stage = anterior;
    pintaKanban();
    return avisa('No se pudo mover', r.error);
  }
  avisa(nombreDe(c), 'ahora está en ' + etapa.replace(/_/g,' '));
  pintaChats();
}

// La vista de embudo: una fila de etapas (cifra, parte del total y barra) y debajo la gente de la etapa elegida.
function pintaEmbudo(filtradas, hayFiltro){
  const cont = $('funEmbudo'); if (!cont) return;
  const etapas = ETAPAS.filter(e => !FUN.ocultas.includes(e));
  let resumen = resumenEmbudo(CONVS, filtradas, etapas);
  if (FUN.ocultarVacias) resumen = resumen.filter(r => r.n);
  if (!resumen.length) { cont.innerHTML = vacioApple('<path d="M4.200 5.500h15.600L14 12.800v5.900l-4-2v-3.900z"/>', 'No hay etapas visibles', 'Actívalas en «Reorganizar».'); return; }
  const sel = etapaDelEmbudo(resumen, FUN.etapa);
  const fila = c => '<div class="fe-fila" data-fabre="' + esc(c._id) + '" draggable="true" data-conv="' + esc(c._id) + '">'
    + '<span class="fe-avatar">' + esc((nombreDe(c).trim()[0] || '?').toUpperCase()) + '</span>'
    + '<span class="fe-txt"><b>' + esc(nombreDe(c)) + (Number(c.unread) > 0 ? '<u class="kt-punto" title="Sin leer"></u>' : '') + '</b>'
    +   '<small>' + esc(c.last_message_preview || 'Sin mensajes') + '</small></span>'
    + (c.interested_category ? '<em class="fe-cat">' + esc(c.interested_category) + '</em>' : '<em class="fe-cat vacia"></em>')
    + '<i class="fe-hora">' + esc(hora(c.last_message_at)) + '</i>'
    + '<button class="btn-linea fe-mover" id="fm-' + esc(c._id) + '" data-fmover="' + esc(c._id) + '" data-menu-flotante>Mover a…</button></div>';
  const filas = ordenaFunnel(filtradas.filter(c => (c.lifecycle_stage || 'nuevo') === sel), FUN.orden, nombreDe);
  const tope = FUN_LIMITE[sel] || FUN_TANDA;
  const r = resumen.find(x => x.e === sel) || { n: 0, todas: 0 };
  cont.innerHTML = '<div class="fe-etapas">' + resumen.map(x => '<button class="fe-etapa' + (x.e === sel ? ' on' : '') + '" data-fetapa="' + x.e + '" data-etapa="' + x.e + '">'
      + '<span class="fe-n">' + x.n + '</span>'
      + '<span class="fe-t">' + esc(x.e.replace(/_/g, ' ')) + '</span>'
      + '<span class="fe-barra"><i style="width:' + x.ancho + '%"></i></span>'
      + '<small>' + (hayFiltro ? x.n + ' de ' + x.todas : x.pct + '% del total') + '</small></button>').join('') + '</div>'
    + '<div class="fe-lista" data-etapa="' + esc(sel) + '">'
    + '<div class="fe-cab"><h2>' + esc(sel.replace(/_/g, ' ')) + '</h2><span>' + (hayFiltro ? r.n + ' de ' + r.todas : r.n) + (r.n === 1 ? ' contacto' : ' contactos') + '</span></div>'
    + (filas.length ? filas.slice(0, tope).map(fila).join('')
      : '<div class="fe-vacia">' + (hayFiltro ? 'Ninguno con estos filtros.' : 'No hay nadie en esta etapa.') + '</div>')
    + (filas.length > tope ? '<button class="kmas kmas-btn" data-kmas="' + esc(sel) + '">Ver ' + Math.min(FUN_TANDA, filas.length - tope) + ' más · quedan ' + (filas.length - tope) + '</button>' : '')
    + '</div>';
  // Arrastrar a alguien sobre una etapa de arriba, o sobre la lista, le cambia la etapa.
  let arrastrado = null;
  cont.querySelectorAll('.fe-fila').forEach(t => {
    t.addEventListener('dragstart', ev => { arrastrado = t; t.classList.add('moviendo'); ev.dataTransfer.setData('text/plain', t.dataset.conv); ev.dataTransfer.effectAllowed = 'move'; });
    t.addEventListener('dragend', () => { t.classList.remove('moviendo'); arrastrado = null; cont.querySelectorAll('.fe-etapa').forEach(x => x.classList.remove('encima')); });
  });
  cont.querySelectorAll('.fe-etapa').forEach(b => {
    b.addEventListener('dragover', ev => { ev.preventDefault(); b.classList.add('encima'); });
    b.addEventListener('dragleave', () => b.classList.remove('encima'));
    b.addEventListener('drop', ev => {
      ev.preventDefault(); b.classList.remove('encima');
      const id = ev.dataTransfer.getData('text/plain') || (arrastrado && arrastrado.dataset.conv);
      mueveLeadDeEtapa(buscaConv(id), b.dataset.etapa);
    });
  });
}

function pintaKanban(){
  const cont = $('kanban'); if (!cont) return;
  const ahora = Date.now();
  const filtradas = filtraFunnel(CONVS, FUN, ahora, nombreDe);
  const hayFiltro = fichasFunnel(FUN).length > 0;
  const fichas = $('funFichas');
  if (fichas) fichas.innerHTML = fichasFunnel(FUN).map(f => '<button class="fun-ficha" data-quita="' + f.clave + '" title="Quitar este filtro">'
    + esc(f.texto) + '<i>×</i></button>').join('');
  for (const id of ['funFiltro', 'funReorg']) {
    const b = $(id); if (!b) continue;
    b.classList.toggle('activo', id === 'funFiltro' ? hayFiltro
      : (FUN.orden !== 'reciente' || FUN.densidad !== 'compacta' || FUN.ocultarVacias || FUN.ocultas.length > 0));
  }
  const sw = $('funSw');
  if (sw) sw.querySelectorAll('[data-fvista]').forEach(b => b.classList.toggle('on', b.dataset.fvista === FUN.vista));
  const enEmbudo = FUN.vista !== 'tablero';
  cont.hidden = enEmbudo;
  const emb = $('funEmbudo'); if (emb) emb.hidden = !enEmbudo;
  if (enEmbudo) { pintaEmbudo(filtradas, hayFiltro); return; }
  if (emb) emb.innerHTML = '';
  const compacta = FUN.densidad === 'compacta';
  const columnas = ETAPAS.filter(e => !FUN.ocultas.includes(e)).map(e => {
    const todas = CONVS.filter(c => (c.lifecycle_stage || 'nuevo') === e);
    const filas = ordenaFunnel(filtradas.filter(c => (c.lifecycle_stage || 'nuevo') === e), FUN.orden, nombreDe);
    return { e, todas: todas.length, filas };
  }).filter(col => !(FUN.ocultarVacias && !col.filas.length));
  cont.classList.toggle('compacto', compacta);
  cont.innerHTML = columnas.map(({ e, todas, filas }) => {
    const plegada = FUN.plegadas.includes(e);
    const tope = FUN_LIMITE[e] || FUN_TANDA;
    const tarjeta = c => compacta
      ? '<div class="ktarjeta compacta" draggable="true" data-conv="' + esc(c._id) + '">'
        + '<div class="kt-fila"><b>' + esc(nombreDe(c)) + '</b>'
        + (Number(c.unread) > 0 ? '<u class="kt-punto" title="Sin leer"></u>' : '')
        + '<i>' + esc(hora(c.last_message_at)) + '</i></div>'
        + '<span>' + (c.interested_category ? '<em>' + esc(c.interested_category) + '</em>' : '') + esc(c.last_message_preview || '') + '</span></div>'
      : '<div class="ktarjeta" draggable="true" data-conv="' + esc(c._id) + '">'
        + '<b>' + esc(nombreDe(c)) + '</b>'
        + '<span>' + esc(c.last_message_preview || '') + '</span>'
        + '<i>' + esc(hora(c.last_message_at)) + (c.interested_category ? ' · ' + esc(c.interested_category) : '') + '</i></div>';
    return '<div class="columna' + (plegada ? ' plegada' : '') + '" data-etapa="' + e + '">'
      + '<button class="ctitulo" data-kplega="' + e + '" title="' + (plegada ? 'Desplegar' : 'Plegar') + ' esta etapa">'
      +   '<span>' + esc(e.replace(/_/g, ' ')) + '</span>'
      +   '<b>' + (hayFiltro ? filas.length + ' de ' + todas : filas.length) + '</b></button>'
      + (plegada ? '' : '<div class="ccuerpo">'
        + filas.slice(0, tope).map(tarjeta).join('')
        + (!filas.length ? '<div class="kmas">' + (hayFiltro ? 'Ninguno con estos filtros' : 'Vacía') + '</div>' : '')
        + (filas.length > tope ? '<button class="kmas kmas-btn" data-kmas="' + e + '">Ver ' + Math.min(FUN_TANDA, filas.length - tope) + ' más · quedan ' + (filas.length - tope) + '</button>' : '')
        + '</div>')
      + '</div>';
  }).join('') || vacioApple('<path d="M4.200 5.500h15.600L14 12.800v5.900l-4-2v-3.900z"/>', 'No hay etapas visibles', 'Actívalas en «Reorganizar».');

  let arrastrando = null;
  cont.querySelectorAll('.ktarjeta').forEach(t => {
    t.addEventListener('dragstart', ev => {
      arrastrando = t;
      t.classList.add('moviendo');
      // Firefox no inicia el arrastre sin datos en el portapapeles del evento.
      ev.dataTransfer.setData('text/plain', t.dataset.conv);
      ev.dataTransfer.effectAllowed = 'move';
    });
    t.addEventListener('dragend', () => { t.classList.remove('moviendo'); arrastrando = null;
      cont.querySelectorAll('.columna').forEach(c => c.classList.remove('encima')); });
  });
  cont.querySelectorAll('.columna').forEach(col => {
    col.addEventListener('dragover', ev => { ev.preventDefault(); col.classList.add('encima'); });
    col.addEventListener('dragleave', () => col.classList.remove('encima'));
    col.addEventListener('drop', async ev => {
      ev.preventDefault();
      col.classList.remove('encima');
      const id = ev.dataTransfer.getData('text/plain') || arrastrando?.dataset.conv;
      await mueveLeadDeEtapa(buscaConv(id), col.dataset.etapa);
    });
  });
}

/* ---- Hoy: la cola de trabajo -------------------------------------------- */
// Salio de mirar como se usa el CRM de verdad: 144 chats «sin leer» que en realidad ya se leyeron en el telefono, y 82 chats
// donde el ULTIMO mensaje es del cliente y nadie contesto (64 con mas de 3 dias). Aqui se ve lo que toca, por importancia.
// Nada se envia desde esta pantalla: abrir el chat, marcar «no requiere respuesta» (vuelve si el cliente escribe otra vez) o
// ponerse un recordatorio.
const HOY_TANDA = 12;
const HOY_LIMITE = {};
const HOY_SECCIONES = [
  ['sin_responder', 'Sin responder', 'El último mensaje es del cliente. Lo más importante primero.'],
  ['se_enfrian', 'Se enfrían', 'Les escribimos, no han contestado y no hay seguimiento puesto.'],
  ['seguimientos', 'Seguimientos', 'Los que tocan hoy o ya vencieron.'],
  ['sesiones', 'Sesiones de hoy y mañana', 'Lo que está agendado.'],
];
function montaHoy(){
  if (!montadas.has('hoy')) {
    montadas.add('hoy');
    hueco('hoy', '<div class="hoja"><h1>Hoy</h1>'
      + '<p class="bajada">Lo que toca atender, por orden de importancia. Desde aquí no se envía nada.</p>'
      + '<div id="hoyCont"></div></div>');
    $('hoyCont').addEventListener('click', ev => {
      const mas = ev.target.closest('[data-hmas]');
      if (mas) { HOY_LIMITE[mas.dataset.hmas] = (HOY_LIMITE[mas.dataset.hmas] || HOY_TANDA) + HOY_TANDA; pintaHoy(); return; }
      const tile = ev.target.closest('[data-hsec]');
      if (tile) { document.getElementById('hoy-' + tile.dataset.hsec)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      const viejos = ev.target.closest('[data-hviejos]');
      if (viejos) { omiteViejosEnHoy(viejos); return; }
      const om = ev.target.closest('[data-hom]');
      if (om) { omiteEnHoy(buscaConv(om.dataset.hom), om); return; }
      const rec = ev.target.closest('[data-hrec]');
      if (rec) { abreRecordatorio(buscaConv(rec.dataset.hrec)); return; }
      const fila = ev.target.closest('[data-habre]');
      if (fila) { const c = buscaConv(fila.dataset.habre); if (c) { ve('conversations'); abre(c); } }
    });
  }
  pintaHoy();
}

// «No requiere respuesta»: se recuerda POR mensaje (cola_omitida_at = el ultimo mensaje), asi que si el cliente vuelve a escribir, reaparece.
async function omiteEnHoy(c, boton){
  if (!c) return;
  const marca = String(c.last_message_at || new Date().toISOString());
  if (boton) boton.disabled = true;
  const r = await llama({ action:'updateLead', conversation_id: c.id || c._id, fields:{ cola_omitida_at: marca } });
  if (!r.ok) { if (boton) boton.disabled = false; return avisa('No se pudo marcar', r.error); }
  c.cola_omitida_at = marca;
  pintaHoy(); pintaCuentas();
}

// Los de mas de 3 dias sin contestar, todos de una vez: se quedan fuera hasta que el cliente vuelva a escribir. No se envia nada.
async function omiteViejosEnHoy(boton){
  const ids = COLA_HOY.colaDeTrabajo(CONVS, { ahora: Date.now() }).sin_responder.viejos_ids;
  if (!ids.length) return;
  if (!await confirmaAqui('Vas a dejar fuera de «Sin responder» ' + ids.length + ' chats de más de 3 días.' + String.fromCharCode(10, 10)
    + 'No se envía nada ni se cambia su etapa, y si el cliente escribe otra vez, vuelve a aparecer.' + String.fromCharCode(10, 10) + '¿Seguimos?')) return;
  boton.disabled = true;
  const r = await llama({ action:'colaOmitir', ids });
  boton.disabled = false;
  if (!r.ok) return avisa('No se pudo', r.error);
  for (const id of ids) { const c = buscaConv(id); if (c) c.cola_omitida_at = String(c.last_message_at || new Date().toISOString()); }
  avisa('Hecho', r.hechas + ' chats fuera de la lista');
  pintaHoy(); pintaCuentas();
}

function pintaHoy(){
  const cont = $('hoyCont'); if (!cont) return;
  const cola = COLA_HOY.colaDeTrabajo(CONVS, { ahora: Date.now() });
  const sr = cola.sin_responder, se = cola.se_enfrian, sg = cola.seguimientos, ss = cola.sesiones;
  const cuando = h => h == null ? '' : h < 1 ? 'ahora' : h < 24 ? 'hace ' + h + ' h' : 'hace ' + Math.round(h / 24) + ' d';
  const hora12 = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString('es-DO', { hour: 'numeric', minute: '2-digit' }); };
  const tiles = [
    ['sin_responder', sr.total, 'Sin responder', sr.total ? sr.hoy + ' de hoy · ' + sr.atrasado + ' atrasados · ' + sr.viejo + ' viejos' : 'todo contestado'],
    ['se_enfrian', se.total, 'Se enfrían', 'sin seguimiento puesto'],
    ['seguimientos', sg.total, 'Seguimientos', sg.vencidos + ' vencidos'],
    ['sesiones', ss.total, 'Sesiones hoy y mañana', ss.hoy + ' hoy'],

  if (!tiles.some(t => t[1])) {

  }
  const chip = x => x.urgencia === 'hoy' ? '<b class="hoy-chip hoy">hoy</b>' : x.urgencia === 'atrasado' ? '<b class="hoy-chip tarde">atrasado</b>' : x.urgencia === 'viejo' ? '<b class="hoy-chip viejo">viejo</b>' : '';
  const acciones = (sec, x) => {
    const id = esc(x.id);
    return '<span class="hoy-acc">'
      + (sec === 'sin_responder' ? '<button class="btn-linea fe-mover" data-hom="' + id + '" title="Se queda fuera hasta que el cliente escriba otra vez">No requiere respuesta</button>' : '')
      + (sec === 'se_enfrian' ? '<button class="btn-linea fe-mover" data-hrec="' + id + '">Recordarme</button><button class="btn-linea fe-mover" data-hom="' + id + '">Omitir</button>' : '')
      + '</span>';
  };
  const fila = (sec, x) => '<div class="fe-fila hoy-fila" data-habre="' + esc(x.id) + '">'
    + '<span class="fe-avatar">' + esc((x.nombre.trim()[0] || '?').toUpperCase()) + '</span>'
    + '<span class="fe-txt"><b>' + esc(x.nombre) + chip(x) + (x.persona ? '<b class="hoy-chip persona">pidió una persona</b>' : '') + '</b>'
    +   '<small>' + esc(x.texto || 'Sin mensajes') + '</small></span>'
    + '<em class="fe-cat">' + esc(x.etapa.replace(/_/g, ' ')) + (x.linea === '5644' ? ' · 5644' : '') + '</em>'
    + '<i class="fe-hora">' + esc(sec === 'sesiones' ? (x.hoy ? 'hoy ' : 'mañana ') + hora12(x.cuando) : sec === 'seguimientos' ? (x.vencido ? 'vencido' : 'hoy ' + hora12(x.cuando)) : cuando(x.edad_h)) + '</i>'
    + acciones(sec, x) + '</div>';
  cont.innerHTML = '<div class="fe-etapas">' + tiles.map(t => '<button class="fe-etapa" data-hsec="' + t[0] + '"><span class="fe-n">' + t[1] + '</span>'
      + '<span class="fe-t">' + esc(t[2]) + '</span><small>' + esc(t[3]) + '</small></button>').join('') + '</div>'
    + HOY_SECCIONES.map(([sec, titulo, nota]) => {
      const b = cola[sec]; if (!b.total) return '';
      const tope = HOY_LIMITE[sec] || HOY_TANDA;
      return '<section class="fe-lista hoy-sec" id="hoy-' + sec + '"><div class="fe-cab"><h2>' + esc(titulo) + '</h2><span>' + b.total + ' · ' + esc(nota) + '</span>'
        + (sec === 'sin_responder' && sr.viejo ? '<button class="btn-linea fe-mover hoy-viejos" data-hviejos title="Deja fuera los de más de 3 días hasta que el cliente vuelva a escribir">Marcar los ' + sr.viejo + ' viejos como atendidos</button>' : '') + '</div>'
        + b.items.slice(0, tope).map(x => fila(sec, x)).join('')
        + (b.items.length > tope ? '<button class="kmas kmas-btn" data-hmas="' + sec + '">Ver ' + Math.min(HOY_TANDA, b.items.length - tope) + ' más · quedan ' + (b.items.length - tope) + '</button>' : '')
        + '</section>';
    }).join('');
}
