    if (opArchivo.dataset.gop === 'citar') { citando = m; pintaCita(); $('texto')?.focus(); }
    else abreReenviar([m.id || m.wamid]);
    return;
  }
  const verVersiones = ev.target.closest('[data-versiones]');
  if (verVersiones) {
    ev.stopPropagation();
    const editado = MSGS.find(x => (x.id || x.wamid) === verVersiones.dataset.versiones);
    if (editado) abreVersiones(editado);
    return;
  }
  // Pulsar la cita salta al mensaje citado, como en WhatsApp. Si ese mensaje no esta cargado
  // --el hilo trae los ultimos 400-- no se hace nada: mejor eso que un salto a otro sitio.
  const cita = ev.target.closest('.cita[data-cita]');
  if (cita) {
    ev.stopPropagation();
    const original = document.querySelector('.globo[data-msg="' + CSS.escape(cita.dataset.cita) + '"]');
    if (!original) return avisa('Ese mensaje no está cargado', 'Es más antiguo que los que tiene abiertos el chat.');
    original.scrollIntoView({ behavior: 'smooth', block: 'center' });
    original.classList.add('resaltado');
    setTimeout(() => original.classList.remove('resaltado'), 1400);
    return;
  }
  const b = ev.target.closest('.gaccion');
  if (!b) { document.querySelectorAll('.gmenu').forEach(m => m.remove()); return; }
  ev.stopPropagation();
  document.querySelectorAll('.gmenu').forEach(m => m.remove());
  const globo = b.closest('[data-msg]');
  const m = MSGS.find(x => (x.id || x.wamid) === globo.dataset.msg);
  if (!m) return;
  const menu = document.createElement('div');
  menu.className = 'gmenu';
  // Reaccionar solo por la linea de WhatsApp Web, y solo a algo que exista en WhatsApp:
  // una nota interna del panel no tiene wamid y no hay a que reaccionar.
  const puedeReaccionar = canalDe(sel) === 'whatsapp_qr' && !!m.wamid;
  const destacado = !!m.metadata?.starred;
  // Editar y eliminar-para-todos: solo lo que el negocio mando por WhatsApp Web, y dentro de los
  // plazos que pone WhatsApp (15 min para editar, 2 dias para retirar). Fuera de plazo no se
  // ofrece: pulsarlo solo para que salga un error es peor que no verlo.
  const edadMs = Date.now() - (Date.parse(String(m.created_at || '')) || 0);
  const esPropioEnWa = canalDe(sel) === 'whatsapp_qr' && m.direction === 'out' && !!m.wamid;
  const puedeEditar = esPropioEnWa && (m.msg_type || 'text') === 'text' && edadMs <= 15 * 60000;
  const puedeRetirar = esPropioEnWa && edadMs <= 48 * 3600000;
  const yaEliminado = !!infoEliminado(m);
  menu.innerHTML = yaEliminado ? '<button data-op="copiar">Copiar texto</button>' : '<button data-op="citar">Responder</button>'
    + (yaEliminado ? '' : (puedeReaccionar ? '<button data-op="reaccionar">Reaccionar</button>' : '')
    + '<button data-op="reenviar">Reenviar</button>'
    + '<button data-op="seleccionar">Seleccionar</button>'
    + '<button data-op="destacar">' + (destacado ? 'Quitar destacado' : 'Destacar') + '</button>'
    + '<button data-op="copiar">Copiar texto</button>'
    + (puedeEditar ? '<button data-op="editar">Editar</button>' : '')
    + (puedeRetirar ? '<button data-op="retirar" class="peligro">Eliminar para todos</button>' : '')
    + '<button data-op="borrar" class="peligro">Eliminar</button>');
  globo.appendChild(menu);
  menu.onclick = async e2 => {
    e2.stopPropagation();
    const op = e2.target.closest('[data-op]')?.dataset.op;
    menu.remove();
    if (op === 'citar') { citando = m; pintaCita(); $('texto')?.focus(); }
    else if (op === 'copiar') {
      try { await navigator.clipboard.writeText(m.body || ''); avisa('Copiado'); }
      catch (e) { avisa('No se pudo copiar'); }
    }
    else if (op === 'reaccionar') abreReaccion(m);
    else if (op === 'reenviar') abreReenviar([m.id || m.wamid]);
    else if (op === 'seleccionar') entraSeleccion(m.id || m.wamid);
    else if (op === 'destacar') {
      // Destacar es solo del CRM: no le llega nada al cliente ni al puente, asi que no
      // hace falta esperar confirmacion como con reenviar o borrar.
      const r = await llama({ action:'star', message_id: m.id, starred: !destacado });
      if (!r.ok) avisa('No se pudo destacar', r.error);
    }
    else if (op === 'editar') abreEditar(m);
    else if (op === 'retirar') {
      const motivo = await pideMotivo({
        titulo: 'Eliminar para todos',
        aviso: 'El cliente verá «Se eliminó este mensaje» en su WhatsApp. Aquí NO se borra: queda marcado como eliminado, con tu nombre y este motivo.',
        boton: 'Eliminar para todos' });
      if (!motivo) return;
      const r = await llama({ action:'ownMsg', operation:'revoke', message_id: m.id, reason: motivo });
      if (!r.ok) return avisa('No se pudo eliminar', r.error);
      // El mensaje sigue en el hilo hasta que WhatsApp lo acepta: el puente lo marca entonces.
      avisa(r.enviado === false ? 'No se envió nada' : 'Eliminando para todos…',
        r.enviado === false ? 'Ese chat está ignorado.' : 'Quedará marcado como eliminado en cuanto WhatsApp lo confirme.');
    }
    else if (op === 'borrar') {
      // Borrado blando: WhatsApp no permite quitarlo del telefono del cliente, y aqui tampoco
      // desaparece: se marca como eliminado, con quien y por que.
      const motivo = await pideMotivo({
        titulo: 'Eliminar mensaje',
        aviso: 'El cliente lo seguirá viendo en su WhatsApp. Aquí NO se borra: queda marcado como eliminado, con tu nombre y este motivo.',
        boton: 'Eliminar' });
      if (!motivo) return;
      const r = await llama({ action:'deleteMsg', message_id: m.id, reason: motivo });
      avisa(r.ok ? 'Mensaje marcado como eliminado' : 'No se pudo eliminar', r.ok ? '' : r.error);
    }
  };
});

/* ---- Mensajes eliminados y editados: nada se pierde ------------------------ */
// Un mensaje eliminado --por el cliente, por el equipo desde el CRM o desde el telefono del negocio--
// no desaparece: se queda en el hilo con un aviso que dice quien, cuando y por que. Un mensaje
// editado conserva lo que decia antes (metadata.versiones, lo guarda el puente). Las piezas puras
// van entre los marcadores para que las pruebas las ejecuten de verdad.
// ---- Mensajes eliminados: piezas puras
function infoEliminado(m){
  const md = m?.metadata || {};
  if (!md.deleted && !md.deleted_at) return null;
  const cuando = md.deleted_at || null;
  // Lo que llega del cliente y se retira: el puente lo marca con deleted_by 'whatsapp'.
  if (m.direction !== 'out') return { quien: 'cliente', alcance: 'todos', cuando, nombre: '', motivo: '' };
  // Un mensaje NUESTRO retirado con deleted_by 'whatsapp' se elimino desde el telefono del negocio,
  // no desde el CRM: nadie escribio un motivo.
  if (md.deleted_by === 'whatsapp') return { quien: 'telefono', alcance: 'todos', cuando, nombre: '', motivo: '' };
  if (md.deleted_by === 'crm_para_todos') {
    const pedido = md.delete_request || {};
    return { quien: 'equipo', alcance: 'todos', cuando, nombre: String(pedido.by_name || ''), motivo: String(pedido.reason || '') };
  }
  return { quien: 'equipo', alcance: 'crm', cuando, nombre: String(md.deleted_by_name || ''), motivo: String(md.deleted_reason || '') };
}
function tituloEliminado(info){
  if (info.quien === 'cliente') return 'El cliente eliminó este mensaje';
  if (info.quien === 'telefono') return 'Eliminado desde el teléfono del negocio';
  const por = info.nombre ? ' por ' + info.nombre : '';
  return info.alcance === 'todos' ? 'Eliminado para todos' + por : 'Eliminado' + por + ' · el cliente aún lo ve';
}
function versionesDe(m){
  const l = m?.metadata?.versiones;
  return Array.isArray(l) ? l.filter(v => v && typeof v.texto === 'string' && v.texto.trim()) : [];
}
// ---- Mensajes eliminados: fin de las piezas puras

function avisoDeEliminado(info){
  const d = info.cuando ? new Date(info.cuando) : null;
  const hora = d && !Number.isNaN(d.getTime())
    ? d.toLocaleString('es-DO', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
  const detalle = info.quien === 'equipo'
    ? (info.motivo ? 'Motivo: ' + info.motivo : 'Sin motivo registrado') : '';
  return '<div class="meliminado"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'
    + '<span><b>' + esc(tituloEliminado(info)) + (hora ? ' · ' + esc(hora) : '') + '</b>'
    + (detalle ? '<small>' + esc(detalle) + '</small>' : '') + '</span></div>';
}

// Pide el motivo de una eliminacion. Devuelve el texto, o null si se cancela. Sin motivo (minimo
// tres letras) no se puede continuar: la idea es que quede escrito por que faltara una frase.
function pideMotivo({ titulo, aviso, boton }){
  return new Promise(resolve => {
    const rapidos = ['Lo escribí por error', 'Chat equivocado', 'Información que no debía enviarse', 'Mensaje duplicado'];
    const m = abreModal('<div class="mtapa"><b>' + esc(titulo) + '</b><button class="cerrarm" data-cerrar>×</button></div>'
      + '<div class="mcuerpo"><p class="aviso">' + esc(aviso) + '</p>'
      + '<div class="pdfs" style="margin:10px 0">'
      +   rapidos.map(t => '<button class="tplchip" data-rapido="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div>'
      + '<div class="campo"><label>Motivo (obligatorio)</label>'
      +   '<textarea id="mvTexto" rows="3" maxlength="300" placeholder="Escribe por qué se elimina"></textarea></div></div>'
      + '<div class="mpatas"><button class="btn-linea" data-cerrar>Cancelar</button>'
      +   '<button class="btn-solido peligro" id="mvOk" disabled>' + esc(boton) + '</button></div>');
    const caja = $('mvTexto'), ok = $('mvOk');
    const valido = () => { ok.disabled = caja.value.trim().length < 3; };
    caja.oninput = valido;
    m.querySelectorAll('[data-rapido]').forEach(b => { b.onclick = () => { caja.value = b.dataset.rapido; valido(); caja.focus(); }; });
    m.querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = () => { cierraModal(); resolve(null); }; });
    ok.onclick = () => { const t = caja.value.trim(); if (t.length < 3) return; cierraModal(); resolve(t); };
    caja.focus();
  });
}

// Lo que decia un mensaje antes de editarse, de la mas nueva a la mas vieja.
function abreVersiones(m){
  const v = versionesDe(m).slice().reverse();
  abreModal('<div class="mtapa"><b>Versiones anteriores</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo"><p class="aviso">Este mensaje se editó. Esto es lo que decía antes; el texto actual es el que se ve en el chat.</p>'
    + v.map(x => {
      const d = new Date(x.hasta);
      return '<div class="mversion"><small>' + (Number.isNaN(d.getTime()) ? '' : 'Hasta ' + esc(d.toLocaleString('es-DO', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })))
        + '</small><div class="mpie">' + esc(x.texto) + '</div></div>';
    }).join('') + '</div>');
}

// Editar un mensaje propio ya enviado. El texto cambia aqui solo cuando WhatsApp lo acepta (lo
// marca el puente, con «Editado»): mientras tanto se sigue viendo el original.
function abreEditar(m){
  abreModal('<div class="mtapa"><b>Editar mensaje</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo"><div class="campo"><textarea id="edTexto" rows="5" maxlength="4096"></textarea></div>'
    + '<p class="aviso">Al cliente le aparecerá «Editado». WhatsApp solo deja editar durante los primeros 15 minutos.</p>'
    + '<div class="acciones"><button class="btn-solido" id="edGuardar">Guardar</button></div></div>');
  const caja = $('edTexto');
  caja.value = m.body || '';
  caja.focus();
  $('edGuardar').onclick = async () => {
    const texto = caja.value.trim();
    if (!texto) return avisa('El mensaje no puede quedar vacío');
    if (texto === String(m.body || '').trim()) { cierraModal(); return; }
    const b = $('edGuardar'); b.disabled = true;
    const r = await llama({ action:'ownMsg', operation:'edit', message_id: m.id, text: texto });
    if (!r.ok) { b.disabled = false; return avisa('No se pudo editar', r.error); }
    cierraModal();
    avisa(r.enviado === false ? 'No se envió nada' : 'Editando…',
      r.enviado === false ? 'Ese chat está ignorado.' : 'Se actualiza aquí en cuanto WhatsApp lo confirme.');
  };
}

// Las seis de WhatsApp. Un selector de emojis entero no cabe aquí y tampoco hace falta:
// reaccionar es para contestar sin escribir, y el que quiera decir algo escribe.
const REACCIONES = ['👍', '❤️', '😂', '😮', '😢', '🙏'];

function abreReaccion(m){
  abreModal('<div class="mtapa"><b>Reaccionar</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo" id="reacCaja"><div class="reacfila">'
    + REACCIONES.map(e => '<button class="reac" data-emoji="' + esc(e) + '">' + e + '</button>').join('')
    + '</div>'
    + '<p class="aviso">Le llega al cliente sobre ese mensaje, igual que si reaccionaras desde el teléfono.</p>'
    + '<button class="tpl" data-emoji="">Quitar la reacción</button></div>');
  $('reacCaja').onclick = async ev => {
    const boton = ev.target.closest('[data-emoji]'); if (!boton) return;
    boton.disabled = true;
    const r = await llama({ action:'react', message_id: m.id, emoji: boton.dataset.emoji });
    if (!r.ok) { boton.disabled = false; return avisa('No se pudo reaccionar', r.error); }
    cierraModal();
    avisa(boton.dataset.emoji ? 'Reacción enviada' : 'Reacción quitada');
  };
}

// Los tipos de mensaje que llevan archivo. Se reenvian enteros --foto, vídeo, nota de voz,
// documento o sticker-- sin que el archivo vuelva a pasar por la nube: el servidor le pasa al
// puente la referencia del original y WhatsApp copia el mismo objeto, igual que al reenviar
// desde el teléfono.
const TIPOS_CON_ARCHIVO = ['image', 'video', 'audio', 'voice', 'document', 'file', 'sticker'];

// Cuantos chats recientes entran en "Frecuentes" antes de separar el resto. CONVS ya viene
// ordenada por last_message_at: los primeros de esa lista SON con quien mas se habla.
const FWD_FRECUENTES_N = 8;

// `ids` es un arreglo de ids de mensaje (uno solo, desde "Reenviar" en el menu de un
// mensaje; varios, desde la barra de seleccion). Los destinos tambien se eligen de a
// varios, como el modo de reenviar de WhatsApp Web: marcar chats y despues pulsar Enviar.
function abreReenviar(ids){
  const lista = (Array.isArray(ids) ? ids : [ids]).filter(Boolean);
  const msgs = lista.map(id => MSGS.find(x => (x.id || x.wamid) === id)).filter(Boolean);
  const validos = msgs.filter(m => {
    const texto = String(m.body || '').trim();
    const conArchivoM = TIPOS_CON_ARCHIVO.includes(String(m.msg_type || '').toLowerCase());
    return conArchivoM || (texto && !/^\[[a-z]+\]$/i.test(texto));
  });
  if (!validos.length)
    return avisa('Nada que reenviar', 'Ninguno de esos mensajes tiene texto ni archivo.');
  const conArchivo = validos.some(m => TIPOS_CON_ARCHIVO.includes(String(m.msg_type || '').toLowerCase()));
  const destinos = new Set();
  const titulo = validos.length > 1 ? 'Reenviar ' + validos.length + ' mensajes a…' : 'Reenviar a…';
  abreModal('<div class="mtapa"><b>' + esc(titulo) + '</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo">'
    // Un archivo solo puede salir por la línea de WhatsApp Web. Por la línea oficial haría
    // falta una dirección pública del archivo, y los archivos ya no se guardan en la nube.
    + (conArchivo ? '<p class="aviso">' + (validos.length > 1 ? 'Los archivos se reenvían tal cual. ' : 'Se reenvía el archivo. ')
        + 'Solo aparecen los chats de la línea de WhatsApp Web.</p>' : '')
    + '<div class="campo"><input id="fwdBusca" placeholder="Buscar conversación…"></div>'
    + '<div id="fwdLista"></div></div>'
    + '<div class="mpatas"><button class="fwd-enviar btn-solido" id="fwdEnviar" disabled>Enviar</button></div>');
  const fila = c => '<button class="tpl' + (destinos.has(c.id || c._id) ? ' marcado' : '') + '" data-dest="'
    + esc(c.id || c._id) + '"><span class="tplcheck"></span><b>' + esc(nombreDe(c)) + '</b>'
    + '<span class="tplmeta">+' + esc(c.wa_phone || '') + '</span></button>';
  const pinta = () => {
    const q = ($('fwdBusca').value || '').trim();
    const todas = CONVS.filter(c => c._id !== (sel?._id))
      .filter(c => !conArchivo || canalDe(c) === 'whatsapp_qr')
      .filter(c => coincideContacto(c, q));
    if (!todas.length) { $('fwdLista').innerHTML = '<p class="aviso">Sin resultados.</p>'; return; }
    // Sin buscar nada, separar los primeros (los mas recientes: con quien mas se habla) del
    // resto, con el mismo rotulo que usa WhatsApp Web. Buscando, la lista ya es corta y
    // separarla en dos grupos solo estorba.
    if (!q && todas.length > FWD_FRECUENTES_N) {
      $('fwdLista').innerHTML = '<div class="fwd-grupo">Frecuentes</div>'
        + todas.slice(0, FWD_FRECUENTES_N).map(fila).join('')
        + '<div class="fwd-grupo">Todos los chats</div>'
        + todas.slice(FWD_FRECUENTES_N, 40).map(fila).join('');
    } else {
      $('fwdLista').innerHTML = todas.slice(0, 40).map(fila).join('');
    }
  };
  pinta();
  $('fwdBusca').oninput = pinta;
  $('fwdLista').onclick = ev => {
    const b = ev.target.closest('[data-dest]'); if (!b) return;
    const id = b.dataset.dest;
    if (destinos.has(id)) destinos.delete(id); else destinos.add(id);
    b.classList.toggle('marcado', destinos.has(id));
    $('fwdEnviar').disabled = !destinos.size;
    $('fwdEnviar').textContent = destinos.size > 1 ? 'Enviar a ' + destinos.size + ' chats' : 'Enviar';
  };
  $('fwdEnviar').onclick = async () => {
    $('fwdEnviar').disabled = true;
    $('fwdEnviar').textContent = 'Enviando…';
    let fallos = 0;
    // De uno en uno: es la misma cola del puente para todo, y mandar muchos a la vez
    // solo la atasca sin que nada llegue antes.
    for (const destId of destinos) {
      for (const m of validos) {
        const r = await llama({ action:'forward', source_message_id: m.id, target_conversation_id: destId });
        if (!r.ok) fallos++;
      }
    }
    cierraModal();
    saleSeleccion();
    const total = destinos.size * validos.length;
    // Un archivo no sale al instante: entra en la cola del puente con su ritmo. Decir
    // «Reenviado» a secas haría buscarlo en el chat del cliente antes de que esté.
    if (!fallos) avisa(total > 1 ? 'Reenviados' : 'Reenviado',
      conArchivo ? 'Sale por la línea de WhatsApp Web en unos segundos.' : '');
    else avisa('Reenviado con fallos', fallos + ' de ' + total + ' no se pudieron mandar.');
  };
}

/* ---- Multimedia dentro del globo ----------------------------------------- */
// El enlace del archivo puede venir en media_url o dentro de attachments, y
// attachments unas veces es objeto, otras un array, y otras una cadena JSON. Se
// normaliza aqui para que el resto no tenga que saberlo.
// Meta no da URL publica del archivo: da un id que hay que canjear con el token del
// negocio, y ese token no puede vivir en el navegador. Se pide a crmMedia con la
// cabecera Authorization y se pinta desde un blob local. La cache evita volver a
// bajarlo cada vez que se repintan los globos, que es en cada mensaje nuevo.
const MEDIOS = new Map();
// Peticiones en curso, por id. La lista se repinta con cada snapshot de Firestore, y sin esto
// cada repintado volvia a pedir la misma foto mientras la primera seguia en camino: dos
// llamadas a crmMedia y un blob que se quedaba sin liberar.
const MEDIOS_EN_CURSO = new Map();
// Fallos con hora, para poder reintentarlos. Guardar '' para siempre --lo que se hacia-- convierte
// un 404 pasajero o un corte de red en iniciales hasta que alguien recarga la pagina. Se reintenta
// a los 60 s, a los 5 min y a la media hora; despues ya no, que insistir no lo va a arreglar.
const MEDIOS_FALLO = new Map();
const ESPERAS_MEDIO = [60_000, 5 * 60_000, 30 * 60_000];
function apuntaFalloMedio(id){
  const n = (MEDIOS_FALLO.get(id)?.n || 0) + 1;
  MEDIOS_FALLO.set(id, { n, hasta: Date.now() + ESPERAS_MEDIO[Math.min(n, ESPERAS_MEDIO.length) - 1] });
  MEDIOS.set(id, '');
}
function medioReintentable(id, ahora = Date.now()){
  const f = MEDIOS_FALLO.get(id);
  if (!f) return true;
  if (f.n > ESPERAS_MEDIO.length) return false;
  return ahora >= f.hasta;
}
const BASE_FN = String(CFG.firebaseFunctionsBase || '').replace(/\/$/, '');

// `conv` solo lo pasan las fotos de perfil: le dice a crmMedia de que ficha es el archivo, que
// no esta en ningun mensaje. Los medios de los mensajes lo piden igual que siempre.
// `msg` lo pasan los archivos pedidos bajo demanda: esos no estan en ningun mensaje --el
// mensaje no guarda media_id-- asi que crmMedia comprueba la peticion que los encargo.
async function urlDeMedio(id, conv, msg){
  if (!id) return '';
  if (MEDIOS.get(id)) return MEDIOS.get(id);
  // Un fallo guardado vale hasta que toque reintentarlo; mientras tanto no se vuelve a pedir en
  // cada repintado, que era el motivo de guardarlo.
  if (MEDIOS.has(id) && !medioReintentable(id)) return '';
  if (MEDIOS_EN_CURSO.has(id)) return MEDIOS_EN_CURSO.get(id);
  const u = auth.currentUser; if (!u) return '';
  const pedido = (async () => {
    try {
      const token = await u.getIdToken();
      const r = await fetch(BASE_FN + '/crmMedia?id=' + encodeURIComponent(id)
        + (conv ? '&conv=' + encodeURIComponent(conv) : '')
        + (msg ? '&msg=' + encodeURIComponent(msg) : ''),
        { headers: { Authorization: 'Bearer ' + token } });
      if (!r.ok) { apuntaFalloMedio(id); return ''; }
      const url = URL.createObjectURL(await r.blob());
      MEDIOS.set(id, url);
      MEDIOS_FALLO.delete(id);
      return url;
    } catch (e) { apuntaFalloMedio(id); return ''; }
  })();
  MEDIOS_EN_CURSO.set(id, pedido);
  try { return await pedido; } finally { MEDIOS_EN_CURSO.delete(id); }
}

// Fotos de perfil del 2.o numero (ver avatarDe). Solo se piden las que se ven: pintaChats pinta
// TODAS las conversaciones, y pedir cien fotos para ensenar quince seria pagar cien llamadas a
// crmMedia por sesion. Como mucho cuatro a la vez. Si una no llega, se quedan las iniciales:
// nunca la tarjeta "Archivo" de los mensajes.
let OBS_AVATARES = null;
const COLA_AVATARES = [];
let avataresEnCurso = 0;

// Dos cosas a la vez, y las dos solo para lo que se VE: bajar del servidor la foto que ya esta
// guardada (data-avatar) y pedirle al puente la que todavia no existe (data-avpend).
function atiendeAvatar(el){
  if (el.dataset.avatar) return encolaAvatar(el);
  if (el.dataset.avpend) pideAvatarVisible(el.dataset.avpend);
}
function resuelveAvatares(){
  const pendientes = [...document.querySelectorAll('[data-avatar],[data-avpend]')];
  if (!('IntersectionObserver' in window)) {
    pendientes.slice(0, 40).forEach(atiendeAvatar);
    return;
  }
  OBS_AVATARES ||= new IntersectionObserver(entradas => {
    for (const e of entradas) {
      if (!e.isIntersecting) continue;
      OBS_AVATARES.unobserve(e.target);
      atiendeAvatar(e.target);
    }
  }, { rootMargin: '200px' });
  // Cada repintado sustituye las filas: se deja de observar lo anterior (ya fuera del documento)
  // y se observa lo que hay ahora, cabecera del chat incluida.
  OBS_AVATARES.disconnect();
  pendientes.forEach(el => OBS_AVATARES.observe(el));
}

function encolaAvatar(el){
  COLA_AVATARES.push(el);
  bombeaAvatares();
}

function bombeaAvatares(){
  while (avataresEnCurso < 4 && COLA_AVATARES.length) {
    const el = COLA_AVATARES.shift();
    if (!el.isConnected || !el.dataset.avatar) continue;
    avataresEnCurso++;
    pintaAvatar(el).finally(() => { avataresEnCurso--; bombeaAvatares(); });
  }
}

// Fotos de perfil que el puente todavia no tiene, de los chats que el panel esta ENSENANDO.
//
// El trabajador del puente va despacio a proposito, asi que una bandeja recien vinculada tardaria
// dias en tener caras. WhatsApp Web, en cambio, pide la foto de cada chat que entra en pantalla.
// Esto es ese atajo: se juntan los ids que se han visto, se mandan de 20 en 20 y el puente los
// adelanta en su cola. Cada ficha se pide UNA vez por sesion: bajar y subir por la lista no
// puede convertirse en cien llamadas.
const AVATARES_PEDIDOS = new Set();
const AVATARES_POR_PEDIR = new Set();
let avataresTimer = null;
function pideAvatarVisible(id){
  const k = String(id || '');
  if (!k || AVATARES_PEDIDOS.has(k)) return;
  AVATARES_PEDIDOS.add(k);
  AVATARES_POR_PEDIR.add(k);
  // Se espera a que el desplazamiento pare: mandarlas de una en una seria una llamada por fila.
  clearTimeout(avataresTimer);
  avataresTimer = setTimeout(enviaAvataresVisibles, 1500);
}
async function enviaAvataresVisibles(){
  avataresTimer = null;
  while (AVATARES_POR_PEDIR.size) {
    const lote = [...AVATARES_POR_PEDIR].slice(0, 20);
    for (const id of lote) AVATARES_POR_PEDIR.delete(id);
    const r = await llama({ action:'bridgeAvatarVisible', conversation_ids: lote });
    // Si el servidor dice que no (puente apagado, sesion caida) no se insiste: es un adorno, no
    // puede convertirse en un bucle de peticiones.
    if (!r.ok) return;
  }
}

async function pintaAvatar(el){
  const id = el.dataset.avatar, conv = el.dataset.avconv, ini = el.dataset.ini || el.textContent;
  el.removeAttribute('data-avatar');
  const url = await urlDeMedio(id, conv);
  // Sin foto, o la fila ya se repinto mientras llegaba: se queda como esta. El siguiente
  // repintado la encuentra en MEDIOS y la pinta directa.
  if (!url || !el.isConnected) return;
  const img = Object.assign(document.createElement('img'), { className: 'av', alt: '', src: url });
  img.dataset.ini = ini;
  img.onerror = () => img.replaceWith(Object.assign(document.createElement('div'), { className: 'av', textContent: ini }));
  el.replaceWith(img);
}

// Se resuelven despues de pintar: el globo sale ya, y la imagen aparece cuando llega.
// Bloquear el pintado hasta tenerlas dejaria el chat en blanco varios segundos.
// ===== Reproductor de notas de voz =====
// Uno solo para todo el hilo: si cada globo tuviera el suyo, empezar una nota dejaria
// sonando la anterior encima.
let audioActivo = null, vozActiva = null;

function cableaVoz(){
  document.querySelectorAll('.voz').forEach(v => {
    if (v.dataset.listo) return;
    v.dataset.listo = '1';
    const play = v.querySelector('.vplay');
    const vel = v.querySelector('.vvel');
    const tiempo = v.querySelector('.vtiempo');
    const prog = v.querySelector('.vprog');

    const pinta = () => {
      const a = audioActivo;
      const sonando = vozActiva === v && a && !a.paused;
      play.textContent = sonando ? '❚❚' : '▶';
      if (vozActiva === v && a) {
        const t = a.currentTime || 0;
        tiempo.textContent = Math.floor(t/60) + ':' + String(Math.floor(t%60)).padStart(2,'0');
        prog.style.width = a.duration ? (t / a.duration * 100) + '%' : '0%';
      }
    };

    play.onclick = async () => {
      if (vozActiva === v && audioActivo) {
        if (audioActivo.paused) { audioActivo.play(); } else { audioActivo.pause(); }
        pinta();
        return;
      }
      if (audioActivo) { audioActivo.pause(); const p = vozActiva?.querySelector('.vplay'); if (p) p.textContent = '▶'; }
      // Bajo demanda la nota de voz se le pide a la PC del negocio, igual que antes se pedia
      // al almacen: solo al pulsar play, nunca al pintar el hilo.
      const src = v.dataset.src
        || (v.dataset.bajo ? await pideMedioCompleto(v.dataset.bajo) : '')
        || (v.dataset.medioAudio ? await urlDeMedio(v.dataset.medioAudio) : '');
      if (!src) return v.dataset.bajo ? undefined : avisa('No se pudo recuperar la nota de voz');
      audioActivo = new Audio(src);
      audioActivo.playbackRate = Number(vel.dataset.v || 1);
      vozActiva = v;
      audioActivo.ontimeupdate = pinta;
      audioActivo.onended = () => { prog.style.width = '0%'; tiempo.textContent = '0:00'; play.textContent = '▶'; };
      audioActivo.onerror = () => avisa('No se pudo reproducir la nota de voz');
      audioActivo.play().then(pinta).catch(() => avisa('No se pudo reproducir'));
    };

    // Velocidad: 1× → 1.5× → 2×. Escuchar una nota de dos minutos al doble es la
    // diferencia entre revisarlas todas o dejarlas sin oir.
    vel.onclick = () => {
      const ciclo = [1, 1.5, 2];
      const actual = Number(vel.dataset.v || 1);
      const siguiente = ciclo[(ciclo.indexOf(actual) + 1) % ciclo.length];
      vel.dataset.v = siguiente;
      vel.textContent = siguiente + '×';
      if (vozActiva === v && audioActivo) audioActivo.playbackRate = siguiente;
    };

    // Pinchar en la onda salta a ese punto.
    v.querySelector('.vonda').onclick = ev => {
      if (vozActiva !== v || !audioActivo?.duration) return;
      const r = ev.currentTarget.getBoundingClientRect();
      audioActivo.currentTime = ((ev.clientX - r.left) / r.width) * audioActivo.duration;
      pinta();
    };
  });
}

// ---- pedir el archivo completo de un mensaje ---------------------------------------------
//
// Los archivos del 2.º número ya no se guardan en la nube. Cuando alguien quiere ver uno, el
// servidor se lo encarga a la PC del negocio, que lo baja de WhatsApp y lo deja unas horas en
// una carpeta temporal. Aquí solo se pide y se espera: puede tardar unos segundos, y hay que
// decir POR QUÉ cuando no se puede, porque cada causa se arregla de una forma distinta.
const MOTIVO_MEDIO = {
  sin_referencia: 'Este mensaje no guardó el archivo; solo queda la vista previa.',
  puente_desconectado: 'WhatsApp Web está desconectado: solo se ve la vista previa.',
  otra_linea: 'El archivo está en el teléfono del número anterior; con este no se puede pedir.',
  demasiado_grande: 'Pasa de 8 MB: ábrelo en el teléfono.',
  caducado_en_el_telefono: 'El teléfono ya no tiene este archivo.',
  telefono_sin_respuesta: 'El teléfono no contestó. Inténtalo dentro de un rato.',
  demasiados_reenvios: 'Se han pedido muchos archivos viejos al teléfono en la última hora. Inténtalo más tarde.',
  error: 'No se pudo recuperar el archivo.',
};
const MEDIO_ESPERA_MS = 1500;
const MEDIO_INTENTOS = 40;          // unos 60 s: el reenvio al telefono puede tardar
const MEDIO_INTENTOS_AUTO = 30;     // pedido por el panel solo (unos 45 s): si tarda mas, se reintenta solo o se pide con Ver
const MEDIOS_BAJO_CURSO = new Map();
const CURSO_AUTO = new Set();       // los que van en camino pedidos por el panel, no por una persona
// Lo que ya llego, por id de mensaje: abrir un archivo que el panel pidio por adelantado es
// instantaneo, sin volver a preguntar. La cache de blobs (MEDIOS) es la que guarda los bytes.
const LISTOS_BAJO = new Map();

// `auto`: lo pide el propio panel al ver el mensaje, sin que nadie pulsara nada. Va callado (un
// fallo no es un aviso para nadie: el archivo se sigue pudiendo pedir con Ver), no reintenta
// lo que fallo y, si el servidor dice que ya pidio demasiados, avisa con `alLimite`.
async function pideMedioCompleto(msgId, { auto = false, alLimite = null } = {}){
  if (!msgId) return '';
  if (LISTOS_BAJO.get(msgId)) return LISTOS_BAJO.get(msgId);
  if (MEDIOS_BAJO_CURSO.has(msgId)) {
    const previo = MEDIOS_BAJO_CURSO.get(msgId);
    if (auto || !CURSO_AUTO.has(msgId)) return previo;
    // Alguien pulso Ver mientras el panel lo pedia por adelantado: se espera a ese pedido y, si
    // fallo callado, se intenta ahora en serio (con aviso), que es lo que la persona espera.
    const url = await previo;
    if (url) return url;
    if (MEDIOS_BAJO_CURSO.has(msgId)) return MEDIOS_BAJO_CURSO.get(msgId);
  }
  const pedido = (async () => {
    for (let intento = 0; intento < (auto ? MEDIO_INTENTOS_AUTO : MEDIO_INTENTOS); intento++) {
      // Solo la PRIMERA llamada de cada pulsacion puede volver a pedir algo que fallo: las
      // demas solo preguntan si ya esta. Si no, un fallo pasajero se convertia en una peticion
      // nueva al telefono cada segundo y medio mientras el panel esperaba.
      const r = await llama({ action: 'mediaFull', message_id: msgId, ...(intento === 0 && !auto ? { reintentar: true } : {}) });
      if (!r.ok) {
        if (auto) { if (r.status === 429 && alLimite) alLimite(); return ''; }
        avisa('No se pudo pedir el archivo', r.error || '');
        return '';
      }
      if (r.estado === 'listo') {
        // La cache de blobs es la de siempre; la clave es el id del archivo temporal, que
        // cambia cada vez que se vuelve a pedir, asi que nunca se sirve uno caducado.
        const url = await urlDeMedio(r.media_id, null, msgId);
        if (!url) { if (!auto) avisa('No se pudo abrir el archivo'); }
        else LISTOS_BAJO.set(msgId, url);
        return url;
      }
      if (r.estado === 'no_disponible') { if (!auto) avisa(MOTIVO_MEDIO[r.motivo] || MOTIVO_MEDIO.error); return ''; }
      await new Promise(res => setTimeout(res, MEDIO_ESPERA_MS));
    }
    if (!auto) avisa('El archivo está tardando demasiado', 'La PC del negocio no lo ha entregado todavía.');
    return '';
  })();
  MEDIOS_BAJO_CURSO.set(msgId, pedido);
  if (auto) CURSO_AUTO.add(msgId);
  try { return await pedido; } finally { MEDIOS_BAJO_CURSO.delete(msgId); CURSO_AUTO.delete(msgId); }
}

// Lo unico que se ABRE en una pestana. Un blob: creado aqui hereda el origen del panel, y el
// tipo del archivo lo decide quien lo mando: un "documento" con mime text/html, o una "imagen"
// SVG, abierto en una pestana correria su codigo con la sesion del panel. Todo lo que no este en
// esta lista se DESCARGA como binario, que ningun navegador ejecuta. (El servidor ya lo filtra
// al guardarlo en la cache; esto es la segunda llave.)
const TIPO_VISIBLE = /^(?:image\/(?:jpeg|png|webp|gif)|video\/[a-z0-9.+-]+|audio\/[a-z0-9.+-]+|application\/pdf)$/i;

function descargaComoArchivo(blob, nombre){
  const seguro = new Blob([blob], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(seguro);
  const enlace = Object.assign(document.createElement('a'), { href: url, download: nombre || 'archivo', rel: 'noopener' });
  document.body.appendChild(enlace);
  enlace.click();
  enlace.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60_000);
}

// El boton que pide el archivo. Se cablea una vez por globo: el hilo se repinta con cada
// mensaje nuevo y volver a atarlo dispararia la peticion dos veces.
function cableaBajoDemanda(){
  document.querySelectorAll('[data-bajo]').forEach(el => {
    if (el.tagName !== 'BUTTON' || el.dataset.listo) return;
    el.dataset.listo = '1';
    // Con miniatura es una foto, un sticker o un video que WhatsApp pudo previsualizar: se
    // ve dentro del panel, en la lupa. Sin miniatura es un documento (o algo que WhatsApp no
    // pudo previsualizar) y sigue yendo por pestaña nueva o descarga directa, como antes.
    const conMiniatura = el.classList.contains('mthumb');
    el.onclick = async () => {
      const etiqueta = el.querySelector('.vertag') || el;
      const antes = etiqueta.textContent;
      const yaEsta = LISTOS_BAJO.has(el.dataset.bajo);
      // Si el panel ya lo pidio por adelantado no hay nada que esperar: ni «Pidiendo…» ni lupa en
      // blanco, se abre con la foto.
      if (!yaEsta) etiqueta.textContent = 'Pidiendo…';
      el.classList.add('pidiendo');
      if (conMiniatura) { fijaLupa(el.dataset.bajo); if (!yaEsta) abreLupaCargando(); }
      // La pestana se abre YA, dentro del clic, solo para lo que no tiene miniatura. Pedirle
      // el archivo al telefono tarda unos segundos, y Chrome bloquea sin avisar una ventana
      // que se abre mas de cinco segundos despues de pulsar: "Ver" no hacia nada. Un documento
      // con nombre va directo a descarga: no hace falta pestaña.
      const ventana = (conMiniatura || el.dataset.nombre) ? null : window.open('', '_blank');
      try { ventana?.document.write('<p style="font:14px system-ui;padding:24px;color:#54656f">Pidiendo el archivo a WhatsApp…</p>'); } catch (e) {}
      try {
        const url = await pideMedioCompleto(el.dataset.bajo);
        if (!url) { ventana?.close(); if (conMiniatura) cierraLupa(); return; }
        const blob = await (await fetch(url)).blob();
        const tipo = String(blob.type || '').split(';')[0].trim();
        if (conMiniatura && /^image\//i.test(tipo)) return muestraLupa('img', url);
        if (conMiniatura && /^video\//i.test(tipo)) return muestraLupa('video', url);
        if (conMiniatura) cierraLupa();
        if (ventana && !ventana.closed && TIPO_VISIBLE.test(tipo)) {
          ventana.opener = null;
          ventana.location.href = url;
          return;
        }
        ventana?.close();
        descargaComoArchivo(blob, el.dataset.nombre || 'archivo');
      } catch (e) {
        ventana?.close();
        if (conMiniatura) cierraLupa();
        avisa('No se pudo abrir el archivo');
      } finally {
        etiqueta.textContent = antes;
        el.classList.remove('pidiendo');
      }
    };
  });
  cableaAutoBajo();
}

// ---- Pedir por adelantado lo que se ve ------------------------------------------------------
//
// Hasta aqui una foto de WhatsApp Web se veia como una miniatura borrosa con «Ver», y el
// archivo entero se le pedia al telefono al pulsar: unos segundos de espera cada vez. WhatsApp
// Web no funciona asi: baja lo que entra en pantalla y ya esta cuando lo miras.
//
// Ahora el panel lo pide solo, en cuanto el mensaje entra en pantalla, y sustituye la miniatura
// por la foto nitida. Lo hace con limites, porque cada archivo es una peticion al telefono del
// negocio desde un numero personal vinculado:
//   - fotos y stickers de los ultimos 7 dias; voz, video y documentos de las ultimas 12 horas (la copia temporal dura 6;
//     si el CDN ya no lo tiene, el puente NO le pide reenvio al telefono: falla callado y queda la miniatura);
//   - solo archivos razonables (fotos hasta 6 MB, notas de voz y documentos hasta 2 MB);
//   - dos a la vez, y como mucho 40 cada 10 minutos: de los 60 que da el servidor, el resto se
//     queda para quien pulse Ver;
//   - si el servidor dice que ya pidieron demasiados, se para 10 minutos sin avisar a nadie.
// Lo que no se pida solo sigue como antes: se pide al pulsar Ver.
// ---- Medios automaticos: piezas puras
// Fotos y stickers mas atras: la miniatura que manda WhatsApp mide 31-100 px y se ve borrosa; el archivo real baja del CDN en 1-3 s
// (sin molestar al telefono) mientras la referencia siga viva. Voz, video y documentos, que pesan, siguen en 12 h.
const AUTO_EDAD_MAX_MS = 12 * 3600_000;
const AUTO_EDAD_IMAGEN_MS = 7 * 24 * 3600_000;
const AUTO_TOPE_BYTES = {
  image: 6 * 1048576, sticker: 1048576, video: 6 * 1048576, audio: 2 * 1048576, document: 2 * 1048576,
};
const AUTO_CUPO = 40;
const AUTO_CUPO_MS = 10 * 60_000;
const AUTO_A_LA_VEZ = 2;
const AUTO_REINTENTOS_MS = [20_000, 60_000, 300_000];   // tras un fallo: a los 20 s, al minuto y a los 5 min; despues, con Ver
const AUTO_PRECARGA = 12;         // las mas recientes del chat abierto se piden ya, sin esperar a que entren en pantalla
function tipoDeAuto(m){
  const t = String(m?.msg_type || '').toLowerCase();
  if (t === 'image' || t === 'sticker' || t === 'video') return t;
  if (t === 'audio' || t === 'voice' || t === 'ptt') return 'audio';
  if (t === 'document' || t === 'file') return 'document';
  return '';
}
function elegibleParaAuto(m, ahora = Date.now()){
  if (!m || String(m.media_store || '') !== 'bajo_demanda') return false;
  const md = m.metadata && typeof m.metadata === 'object' ? m.metadata : {};
  if (md.deleted || md.deleted_at || md.whatsapp_history_sync) return false;
  const tipo = tipoDeAuto(m);
  if (!tipo) return false;
  const creado = Date.parse(String(m.created_at || ''));
  // Sin fecha legible no se adivina la edad: se deja para cuando alguien pulse Ver.
  const limite = (tipo === 'image' || tipo === 'sticker') ? AUTO_EDAD_IMAGEN_MS : AUTO_EDAD_MAX_MS;
  if (!Number.isFinite(creado) || ahora - creado > limite) return false;
  // Sin peso conocido pasa (la miniatura de un video puede no traerlo); con peso, dentro del tope.
  return !((Number(m.media_size) || 0) > AUTO_TOPE_BYTES[tipo]);
}
function cupoAuto(marcas, ahora = Date.now()){
  const recientes = (Array.isArray(marcas) ? marcas : []).filter(t => Number.isFinite(t) && ahora - t < AUTO_CUPO_MS && t <= ahora);
  return { permitido: recientes.length < AUTO_CUPO, recientes };
}
// ---- Medios automaticos: fin de las piezas puras

const NITIDAS = new Map();        // id de mensaje -> foto nitida (image y sticker), para pintarla en el globo
const COLA_AUTO = [];
const AUTO_VISTOS = new Set();    // ya encolados: un repintado no los vuelve a pedir
const AUTO_FALLOS = new Map();    // id -> cuando fallo, para no insistir antes de tiempo
const AUTO_INTENTOS = new Map();  // id -> cuantas veces fallo
let autoTimer = null;
let OBS_AUTO = null, RAIZ_AUTO = null;
let autoActivos = 0, autoMarcas = [], autoPausaHasta = 0;

function cableaAutoBajo(){
  const raiz = $('mensajes');
  if (!raiz || typeof sel === 'undefined' || !sel) return;
  const ahora = Date.now();
  let porId = null;
  const candidatos = [];
  for (const el of raiz.querySelectorAll('[data-bajo]')) {
    const id = el.dataset.bajo;
    if (!id || AUTO_VISTOS.has(id) || LISTOS_BAJO.has(id)) continue;
    const falloEn = AUTO_FALLOS.get(id), fallos = AUTO_INTENTOS.get(id) || 0;
    if (fallos > AUTO_REINTENTOS_MS.length) continue;
    if (falloEn && ahora - falloEn < AUTO_REINTENTOS_MS[Math.min(fallos, AUTO_REINTENTOS_MS.length) - 1]) continue;
    porId = porId || new Map(MSGS.map(x => [String(x.id || x.wamid || ''), x]));
    if (elegibleParaAuto(porId.get(id), ahora)) candidatos.push(el);
  }
  if (!candidatos.length) return;
  // Lo mas reciente del chat se pide ya (la mas nueva primero): antes solo se pedia lo que estaba a la vista y las fotos de mas arriba se
  // quedaban borrosas hasta desplazarse, que es lo que parecia «a veces carga y a veces no».
  candidatos.slice(-AUTO_PRECARGA).reverse().forEach(el => encolaAuto(el.dataset.bajo));
  if (!('IntersectionObserver' in window)) {
    // Sin saber que se ve, solo los ultimos: son los que quedan a la vista al abrir un chat.
    candidatos.slice(-8).forEach(el => encolaAuto(el.dataset.bajo));
    return;
  }
  if (!OBS_AUTO || RAIZ_AUTO !== raiz) {
    if (OBS_AUTO) OBS_AUTO.disconnect();
    RAIZ_AUTO = raiz;
    OBS_AUTO = new IntersectionObserver(entradas => {
      for (const e of entradas) {
        if (!e.isIntersecting) continue;
        OBS_AUTO.unobserve(e.target);
        encolaAuto(e.target.dataset.bajo);
      }
    }, { root: raiz, rootMargin: '200px 0px' });
  }
  candidatos.forEach(el => OBS_AUTO.observe(el));
}

function encolaAuto(id){
  if (!id || AUTO_VISTOS.has(id)) return;
  AUTO_VISTOS.add(id);
  COLA_AUTO.push(id);
  bombeaAuto();
}

function bombeaAuto(){
  while (autoActivos < AUTO_A_LA_VEZ && COLA_AUTO.length) {
    const cupo = cupoAuto(autoMarcas);
    autoMarcas = cupo.recientes;
    if (Date.now() < autoPausaHasta || !cupo.permitido) {
      // Sin cupo o en pausa: lo que esperaba SE QUEDA en la cola y se reintenta en cuanto haya cupo (antes se tiraba y la foto seguia
      // borrosa hasta que alguien la pulsaba).
      const libre = Math.max(autoPausaHasta, autoMarcas.length ? Math.min(...autoMarcas) + AUTO_CUPO_MS : 0);
      clearTimeout(autoTimer);
      autoTimer = setTimeout(bombeaAuto, Math.max(2000, libre - Date.now() + 500));
      return;
    }
    const id = COLA_AUTO.shift();
    if (LISTOS_BAJO.has(id)) continue;
    autoMarcas.push(Date.now());
    autoActivos++;
    pideAuto(id).catch(() => {}).finally(() => { autoActivos--; bombeaAuto(); });
  }
}

async function pideAuto(id){
  const url = await pideMedioCompleto(id, { auto: true, alLimite: () => { autoPausaHasta = Date.now() + AUTO_CUPO_MS; } });
  if (!url) {
    AUTO_VISTOS.delete(id); AUTO_FALLOS.set(id, Date.now());
    const fallos = (AUTO_INTENTOS.get(id) || 0) + 1; AUTO_INTENTOS.set(id, fallos);
    if (fallos <= AUTO_REINTENTOS_MS.length) setTimeout(cableaAutoBajo, AUTO_REINTENTOS_MS[fallos - 1] + 500);
    return;
  }
  const m = MSGS.find(x => String(x.id || x.wamid || '') === id);
  const tipo = tipoDeAuto(m);
  if (tipo !== 'image' && tipo !== 'sticker') return;
  // Solo una imagen de las que el navegador pinta sin ejecutar nada sustituye a la miniatura.
  try {
    const blob = await (await fetch(url)).blob();
    if (!/^image\/(?:jpeg|png|webp|gif)$/i.test(String(blob.type || '').split(';')[0].trim())) return;
    NITIDAS.set(id, url);
    pintaMensajes();
  } catch (e) { /* se queda la miniatura */ }
}

// Pedir ahora un archivo concreto por adelantado (lo usa Estados: lo que sigue en el visor y lo
// primero de la lista), con el mismo cupo y la misma pausa que lo demas que el panel pide solo.
// Devuelve la url si llego, o '' sin avisar de nada.
function pideAdelantado(id){
  if (!id) return Promise.resolve('');
  if (LISTOS_BAJO.has(id)) return Promise.resolve(LISTOS_BAJO.get(id));
  if (MEDIOS_BAJO_CURSO.has(id)) return MEDIOS_BAJO_CURSO.get(id);
  const cupo = cupoAuto(autoMarcas);
  autoMarcas = cupo.recientes;
  if (Date.now() < autoPausaHasta || !cupo.permitido) return Promise.resolve('');
  autoMarcas.push(Date.now());
  return pideMedioCompleto(id, { auto: true, alLimite: () => { autoPausaHasta = Date.now() + AUTO_CUPO_MS; } });
}

// ---- archivos que SI estan guardados ---------------------------------------------------
//
// Lo de antes del bloque de medios, las fotos de la API oficial y lo que sale por Instagram y
// Messenger sigue teniendo su archivo, y se baja de crmMedia. Hasta ahora se bajaba TODO al
// pintar el hilo, uno detras de otro: abrir un chat de 400 mensajes con fotos eran cientos de
// llamadas y megas de datos para ensenar las cinco de abajo, y la foto que se estaba mirando
// esperaba a que bajaran todas las de encima.
//
// Ahora solo se pide lo que entra en pantalla (con un margen, para que al desplazarse ya este),
// tres a la vez como mucho. Los documentos no se piden nunca solos: se bajan al pulsar
// Descargar, porque dentro del globo no se ven. Las notas de voz, al pulsar play, como siempre.
const MEDIOS_A_LA_VEZ = 3;
// Sin IntersectionObserver (navegador muy viejo) no se sabe que se ve: solo se piden los
// ultimos, que son los que quedan a la vista al abrir un chat, porque se abre pegado abajo.
const MEDIOS_SIN_OBSERVADOR = 12;
let OBS_MEDIOS = null, RAIZ_MEDIOS = null;
const COLA_MEDIOS = [];
let mediosEnCurso = 0;

function resuelveMedios(){
  cableaVoz();
  cableaBajoDemanda();
  cableaDescargas();
  const pendientes = [...document.querySelectorAll('[data-medio]:not([data-medio-cola])')];
  if (!pendientes.length) return;
  // Lo que ya esta en la cache se pinta en el acto: no cuesta ninguna llamada.
  const porPedir = [];
  for (const el of pendientes) {
    const hecho = MEDIOS.get(el.dataset.medio);
    if (hecho) ponMedio(el, hecho); else porPedir.push(el);
  }
  if (!('IntersectionObserver' in window)) {
    porPedir.slice(-MEDIOS_SIN_OBSERVADOR).forEach(encolaMedio);
    return;
  }
  // El hilo se crea de nuevo al abrir otro chat: un observador atado al contenedor viejo no
  // veria entrar nada nunca.
  const raiz = $('mensajes');
  if (!OBS_MEDIOS || RAIZ_MEDIOS !== raiz) {
    if (OBS_MEDIOS) OBS_MEDIOS.disconnect();
    RAIZ_MEDIOS = raiz;
    OBS_MEDIOS = new IntersectionObserver(entradas => {
      for (const e of entradas) {
        if (!e.isIntersecting) continue;
        OBS_MEDIOS.unobserve(e.target);
        encolaMedio(e.target);
      }
    }, { root: raiz || null, rootMargin: '400px 0px' });
  }
  porPedir.forEach(el => OBS_MEDIOS.observe(el));
}

function encolaMedio(el){
  if (!el.isConnected || el.dataset.medioCola) return;
  // Marcado y no desmarcado: el data-medio se queda hasta que llega la imagen, y es lo que le
  // da al hueco su alto mientras tanto (ver la regla CSS de [data-medio]).
  el.dataset.medioCola = '1';
  COLA_MEDIOS.push(el);
  bombeaMedios();
}

function bombeaMedios(){
  while (mediosEnCurso < MEDIOS_A_LA_VEZ && COLA_MEDIOS.length) {
    const el = COLA_MEDIOS.shift();
    // Un globo que se repinto mientras esperaba turno ya no esta en el documento: pedirlo
    // seria bajar un archivo que nadie va a ver.
    if (!el.isConnected || !el.dataset.medio) continue;
    mediosEnCurso++;
    pintaMedio(el).finally(() => { mediosEnCurso--; bombeaMedios(); });
  }
}

async function pintaMedio(el){
  const url = await urlDeMedio(el.dataset.medio);
  if (!el.isConnected) return;
  if (!url) {
    el.replaceWith(Object.assign(document.createElement('div'),
      { className:'marchivo', innerHTML:'<b>Archivo</b><span>no se pudo recuperar de WhatsApp</span>' }));
    return;
  }
  ponMedio(el, url);
}

function ponMedio(el, url){
  el.removeAttribute('data-medio');
  el.removeAttribute('data-medio-cola');
  el.src = url;
}

// Documentos guardados: se bajan al pulsar, no al pintar. El boton se cablea una vez por globo:
// el hilo se repinta con cada mensaje nuevo y volver a atarlo bajaria el archivo dos veces.
function cableaDescargas(){
  document.querySelectorAll('[data-descarga]').forEach(el => {
    if (el.dataset.listo) return;
    el.dataset.listo = '1';
    el.onclick = async () => {
      const antes = el.textContent;
      el.textContent = 'Descargando…';
      el.disabled = true;
      try {
        const url = await urlDeMedio(el.dataset.descarga);
        if (!url) return avisa('No se pudo recuperar el archivo');
        const enlace = Object.assign(document.createElement('a'),
          { href: url, download: el.dataset.nombre || 'archivo', rel: 'noopener' });
        document.body.appendChild(enlace);
        enlace.click();
        enlace.remove();
      } finally {
        el.textContent = antes;
        el.disabled = false;
      }
    };
  });
}

function adjuntoDe(m){
  let bruto = m && m.attachments;
  if (typeof bruto === 'string') { try { bruto = JSON.parse(bruto); } catch (e) { bruto = null; } }
  const a = Array.isArray(bruto) ? (bruto.find(x => x && typeof x === 'object') || {})
    : (bruto && typeof bruto === 'object' ? bruto : {});
  return {
    nombre: a.fileName || a.file_name || a.filename || '',
    mime: a.mimeType || a.mime_type || a.mimetype || '',
    peso: Number(a.size || 0) || 0,
    url: (m && m.media_url) || a.url || '',
  };
}
// El detalle de la llamada viaja en metadata, que segun de donde venga la fila llega como
// objeto o como texto JSON. Se acepta lo que sea: perder el estado dejaria todas las llamadas
// pintadas igual, y "perdida" y "contestada" son justo lo que hay que distinguir.
function llamadaDe(m){
  let meta = m && m.metadata;
  if (typeof meta === 'string') { try { meta = JSON.parse(meta); } catch (e) { meta = null; } }
  const l = (meta && typeof meta === 'object' && meta.llamada) || {};
  return { estado: String(l.estado || 'perdida'), video: l.video === true, duracion: Number(l.duracion) || 0 };
}
const ESTADO_LLAMADA = {
  perdida: 'perdida', rechazada: 'rechazada', fallida: 'fallida', silenciada: 'silenciada',
  en_curso: 'en curso', contestada_en_otro_dispositivo: 'contestada en otro dispositivo',
  contestada: 'contestada',
};
function pesoLegible(n){
  if (!n) return '';
  const u = ['B','KB','MB','GB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0) + ' ' + u[i];
}
// De un mensaje traido por la sincronizacion del historial no se bajo el archivo A PROPOSITO:
// el dueno pidio que el historial viejo entrara SOLO como texto para no llenar la nube. Ese
// archivo no se perdio --sigue en el telefono, en el chat de WhatsApp-- y decirle "no se
// guardo", igual que a los de antes del 09/09/2026, se lee como una averia. Son dos cosas
// distintas y ahora se dicen distinto.
function esDelHistorial(m){
  let meta = m && m.metadata;
  if (typeof meta === 'string') { try { meta = JSON.parse(meta); } catch (e) { meta = null; } }
  return !!(meta && typeof meta === 'object' && meta.whatsapp_history_sync);
}
function tarjetaArchivo(a, etiqueta, m){
  const nombre = a.nombre || etiqueta;
  const detalle = [a.mime, pesoLegible(a.peso)].filter(Boolean).join(' · ');
  if (!a.url && esDelHistorial(m)) {
    return '<div class="marchivo"><b>' + esc(nombre) + '</b>'
      + '<span>' + esc(detalle ? detalle + ' · ' : '') + 'solo se trajo el texto; el archivo sigue en el teléfono'
      + '</span></div>';
  }
  // Sin url no se inventa un enlace roto, y se dice lo que de verdad pasa. Llegar aqui
  // significa que el mensaje no trae ni enlace ni id: el archivo no existe en ningun sitio,
  // no es que no se encuentre. Le pasa a todo lo que entro antes del 09/09/2026 --hasta ese
  // dia el puente descargaba la foto o la nota de voz y la tiraba, porque el bucket donde
  // debia guardarla no existia-- y a lo que pase de 8 MB, que el servidor no acepta.
  // Ya no se separa por canal: desde ese dia los dos numeros guardan igual y el motivo del
  // hueco es el mismo. Decir que el 2.º número todavía no guarda seria mentira ahora, y
  // hablar de un enlace que falta se leia como que se habia perdido algo. No se perdio nada:
  // nunca se guardo.
  if (!a.url) {
    return '<div class="marchivo"><b>' + esc(nombre) + '</b>'
      + '<span>' + esc(detalle ? detalle + ' · ' : '') + 'el archivo no se guardó'
      + '</span></div>';
  }
  return '<div class="marchivo"><b>' + esc(nombre) + '</b>'
    + '<span>' + esc(detalle || 'archivo') + '</span>'
    + '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">Abrir</a>' + opsArchivo(m) + '</div>';
}
// ---- archivos que NO estan guardados en la nube -----------------------------------------
// Las fotos, los videos, las notas de voz y los documentos que entran por WhatsApp Web ya no
// se guardan: del mensaje quedan la vista previa que manda el propio WhatsApp (unos pocos KB)
// y sus datos --peso, duracion, paginas--, y el archivo entero se le pide al telefono solo
// cuando alguien pulsa Ver. Por eso estos mensajes NO llevan data-medio: marcarlos haria que
// resuelveMedios bajara el hilo entero al pintarlo, que es justo lo que se vino a quitar.
function esBajoDemanda(m){
  return String(m && m.media_store || '') === 'bajo_demanda';
}
// La miniatura llega como data URI dentro del mensaje. Se valida antes de pintarla: va a un
// src de <img>, y ahi un 'javascript:' o un data:text/html serian codigo, no una imagen.
function miniaturaMensaje(m){
  const uri = String(m && m.media_thumb_b64 || '');
  return /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$/.test(uri) && uri.length <= 16384 ? uri : '';
}
function detalleBajoDemanda(m, a){
  return [m.media_mime || a.mime, pesoLegible(Number(m.media_size) || a.peso),
    Number(m.media_pages) > 0 ? m.media_pages + (Number(m.media_pages) === 1 ? ' página' : ' páginas') : '',
  ].filter(Boolean).join(' · ');
}
// La foto nitida que el panel ya pidio por adelantado (ver «Pedir por adelantado lo que se ve»).
// El typeof es para que este trozo se pueda ejecutar suelto en las pruebas, sin ese bloque.
function nitidaDe(id){
  return typeof NITIDAS !== 'undefined' ? (NITIDAS.get(id) || '') : '';
}
// Responder y Reenviar sobre un archivo, dentro de su propia tarjeta: en un documento no hay
// lupa donde ponerlos, y el menu del globo (⌄) no se descubre solo.
function opsArchivo(m){
  const id = String(m?.id || '');
  if (!id || m._enviando) return '';
  return '<div class="marchivo-op"><button data-gop="citar" data-gmsg="' + esc(id) + '">Responder</button>'
    + '<button data-gop="reenviar" data-gmsg="' + esc(id) + '">Reenviar</button></div>';
}
function tarjetaBajoDemanda(m, a, etiqueta){
  const ident = esc(String(m.id || ''));
  const nitida = nitidaDe(String(m.id || ''));
  if (nitida) {
    return '<button class="mthumb nitida" data-bajo="' + ident + '" title="Abrir">'
      + '<img src="' + esc(nitida) + '" alt="' + esc(etiqueta) + '"></button>';
  }
  const thumb = miniaturaMensaje(m);
  if (thumb) {
    return '<button class="mthumb" data-bajo="' + ident + '" title="Ver el archivo completo">'
      + '<img src="' + esc(thumb) + '" alt="' + esc(etiqueta) + '" loading="lazy">'
      + '<span class="vertag">Ver</span></button>';
  }
  // Sin vista previa no se inventa una imagen gris: se dice que hay y se ofrece pedirlo. Con
  // nombre de archivo (un documento) se descarga con ese nombre en vez de abrirse.
  const detalle = detalleBajoDemanda(m, a);
  const nombre = a.nombre || m.media_filename || '';
  return '<div class="marchivo"><b>' + esc(nombre || etiqueta) + '</b>'
    + '<span>' + esc(detalle || 'archivo') + '</span>'
    + '<button data-bajo="' + ident + '"' + (nombre ? ' data-nombre="' + esc(nombre) + '"' : '') + '>'
    + (nombre ? 'Descargar' : 'Ver') + '</button>' + opsArchivo(m) + '</div>';
}
// La onda REAL de la nota de voz. WhatsApp la manda dentro del mensaje (64 valores de 0 a
// 100) y hasta ahora se tiraba: el panel dibujaba una inventada a partir del wamid. Con la
// de verdad, los silencios y los golpes de voz se ven donde estan.
function ondaReal(b64){
  let bin = '';
  try { bin = atob(String(b64 || '')); } catch (e) { return ''; }
  if (bin.length < 8) return '';
  // 34 barras repartidas por TODA la nota. Con un paso entero, 64 puntos daban paso 1 y se
  // dibujaba solo la primera mitad: el final de la nota no salia nunca.
  const barras = Math.min(34, bin.length);
  let s = '';
  for (let k = 0; k < barras; k++) {
    const i = Math.floor(k * bin.length / barras);
    // WhatsApp manda cada punto ya en porcentaje (0-100); se acota por si llegara otra cosa.
    s += '<i style="height:' + Math.max(12, Math.min(100, bin.charCodeAt(i))) + '%"></i>';
  }
  return s;
}
// La onda de una nota de voz que NO trae la real (lo guardado antes del bloque de medios y lo
// de la API oficial). Dibujarla de verdad exigiria descargar y decodificar TODOS los audios
// del hilo solo para pintar barritas, asi que se genera a partir del wamid: siempre la misma
// para el mismo mensaje, distinta entre mensajes, y sin coste. Es decoracion honesta -- no
// pretende representar el sonido, marca el avance.
function ondaFalsa(semilla){
  let h = 0;
  for (let i = 0; i < String(semilla).length; i++) h = (h * 31 + String(semilla).charCodeAt(i)) % 100000;
  let s = '';
  for (let i = 0; i < 34; i++) {
    h = (h * 1103515245 + 12345) % 2147483648;
    s += '<i style="height:' + (22 + (h % 68)) + '%"></i>';
  }
  return s;
}

// La ventana de servicio de 24 h. WhatsApp solo entrega texto libre mientras no hayan
// pasado 24 h desde el ULTIMO mensaje del cliente. Pasado el plazo, Meta ACEPTA la
// llamada y devuelve un wamid -- y despues marca el mensaje como fallido por webhook. Por
// eso el panel decia "enviado" y al cliente no le llegaba nada: el fallo llega tarde y
// por otra via. Aqui se avisa antes de escribir, que es cuando todavia sirve de algo.
function ultimoDelCliente(){
  if (!sel) return null;
  // La ficha lleva la fecha aunque el mensaje sea viejisimo; MSGS solo trae los ultimos
  // 400. Se usa la mas reciente de las dos, no una sola.
  const deLosMsgs = MSGS.filter(m => m.direction === 'in').map(m => m.created_at).sort().pop();
  const v = [sel.last_customer_reply_at, deLosMsgs].filter(Boolean).sort().pop();
  const t = v ? Date.parse(v) : NaN;
  return isNaN(t) ? null : t;
}
// Instagram y Messenger comparten la ventana de 24 h con WhatsApp, pero NO su remedio: las
// plantillas son de WhatsApp. Lo que Meta ofrece ahi es la etiqueta de atencion humana, que
// amplia el plazo a siete dias, y el servidor ya la intenta solo. Devuelve el nombre que ve
// el dueno, o null si no es una red social.
function redSocial(c){
  const k = canalDe(c);
  return k === 'instagram' ? 'Instagram' : k === 'facebook' ? 'Messenger' : null;
}
function pintaVentana24(){
  const caja = $('ventana24'); if (!caja) return;
  // El puente de WhatsApp Web no pasa por el API oficial y no tiene esta limitacion.
  if (!sel || canalDe(sel) === 'whatsapp_qr') { caja.hidden = true; return; }
  const t = ultimoDelCliente();
  const horas = t ? (Date.now() - t) / 3600000 : Infinity;
  if (horas < 24) { caja.hidden = true; return; }
  const cuanto = !isFinite(horas) ? 'Nunca ha escrito por este canal'
    : horas < 48 ? 'Escribió hace ' + Math.round(horas) + ' horas'
    : 'Escribió hace ' + Math.round(horas / 24) + ' días';
  caja.hidden = false;
  const nombreRed = redSocial(sel);
  if (nombreRed) {
    // Sin boton de plantilla: ofrecer lo que no existe es peor que no ofrecer nada.
    caja.innerHTML = '<div><b>Fuera de la ventana de 24 horas</b> ' + esc(cuanto)
      + '. En ' + nombreRed + ' no hay plantillas. Se intenta por atención humana, que Meta '
      + 'permite hasta 7 días; con más tiempo solo se reabre si escribe la persona.</div>';
    return;
  }
  caja.innerHTML = '<div><b>Fuera de la ventana de 24 horas</b>' + esc(cuanto)
    + '. WhatsApp solo le entrega una plantilla aprobada; un mensaje normal sale con ⚠ '
    + 'y no lo recibe.</div><button id="v24tpl">Usar plantilla</button>';
  $('v24tpl').onclick = () => $('adjTpl')?.click();
}

// Por la extension, cuando el mime no viene o viene en blanco.
const EXT_DE_MEDIO = {
  jpg:'image', jpeg:'image', png:'image', gif:'image', webp:'image', bmp:'image', heic:'image', heif:'image',
  mp4:'video', mov:'video', m4v:'video', webm:'video', mkv:'video', '3gp':'video',
  ogg:'audio', oga:'audio', opus:'audio', mp3:'audio', m4a:'audio', aac:'audio', wav:'audio',
};

// Que hay DE VERDAD en el mensaje. El tipo guardado no siempre lo dice: una foto que sale del
// CRM puede quedar como 'document' o 'file' --asi la manda WhatsApp cuando se adjunta por el
// boton de documento, y asi llegan tambien las importadas-- y entonces el hilo pintaba una
// tarjeta gris con "Descargar" para una imagen que se puede ver ahi mismo. Quien atiende
// tenia que bajarse su propia foto para comprobar cual habia mandado.
//
// Solo se corrige lo generico: un tipo que ya dice imagen, video, nota de voz o llamada manda
// siempre, y sin archivo no hay nada que adivinar.
function tipoRealMedio(m, a){
  const declarado = String(m.msg_type || 'text').toLowerCase();
  // 'text' entra en la lista porque un mensaje guardado sin tipo cae aqui como texto, y con
  // un archivo dentro el hilo lo pintaba como un parrafo vacio.
  if (!['text', 'file', 'document', 'media', 'archivo'].includes(declarado)) return declarado;
  if (!(m.media_id || m.media_url || a.url)) return declarado;
  const mime = String(m.media_mime || a.mime || '').toLowerCase();
  if (mime.startsWith('image/')) return 'image';
  if (mime.startsWith('video/')) return 'video';
  if (mime.startsWith('audio/')) return 'audio';
  const ext = (String(a.nombre || m.media_filename || '').match(/\.([a-z0-9]{1,5})$/i) || ['',''])[1].toLowerCase();
  return EXT_DE_MEDIO[ext] || declarado || 'file';
}

function cuerpoMensaje(m){
  const a = adjuntoDe(m);
  const t = tipoRealMedio(m, a);
  const pie = m.body && !/^\[[a-z]+\]$/i.test(m.body) ? '<div class="mpie">' + conTelefonos(esc(m.body)) + '</div>' : '';
  const id = m.media_id || '';
  const bajo = esBajoDemanda(m);
  // Si hay url directa se usa; si solo hay id, se marca el hueco y lo rellena
  // resuelveMedios() con lo que devuelva crmMedia. Bajo demanda no se marca ningun hueco:
  // el hilo se pinta con lo que ya trae el mensaje y no se descarga NADA hasta que alguien
  // pulsa Ver. Abrir un chat de 400 mensajes bajaba antes todas sus fotos, una a una.
  const medio = (etiqueta, html) => bajo ? tarjetaBajoDemanda(m, a, etiqueta)
    : a.url ? html(esc(a.url))
    : id ? html('', true) : tarjetaArchivo(a, etiqueta, m);

  // Mensaje con botones de accion. El servidor lo guarda como 'interactive', y sin esta
  // rama caia al final de la funcion -- que solo pinta texto. Resultado: en el historial
  // el combo aparecia como un parrafo suelto, sin la foto de cabecera y sin rastro de los
  // botones, aunque el cliente si los hubiera recibido.
  if (t === 'interactive' || t === 'button') {
    const btns = (Array.isArray(m.metadata?.botones) ? m.metadata.botones : []).filter(Boolean);
    const cabeza = (a.url || id)
      ? medio('Imagen', (src, porId) => '<img class="mmedia" alt="imagen" loading="lazy"'
          + (porId ? ' data-medio="' + esc(id) + '"' : ' src="' + src + '"') + '>')
      : '';
    return cabeza + '<div class="mpie">' + esc(m.body || '') + '</div>'
      + (btns.length ? '<div class="mbotones">'
          + btns.map(b => '<span>' + esc(b) + '</span>').join('') + '</div>' : '');
  }

  if (t === 'image') {
    return medio('Imagen', (src, porId) =>
      '<img class="mmedia" alt="imagen" loading="lazy"'
      + (porId ? ' data-medio="' + esc(id) + '"' : ' src="' + src + '"') + '>')
      + (m.image_description ? '<div class="mpie">' + esc(m.image_description) + '</div>' : '') + pie;
  }
  if (t === 'sticker') {
    return medio('Sticker', (src, porId) =>
      '<img class="msticker" alt="sticker" loading="lazy"'
      + (porId ? ' data-medio="' + esc(id) + '"' : ' src="' + src + '"') + '>');
  }
  // Las llamadas del 2.º número. No se pueden atender desde el CRM --esto no es un teléfono--
  // pero sin verlas la conversación parecía muerta el día que el cliente llamó tres veces.
  if (t === 'call') {
    const l = llamadaDe(m);
    const sinAtender = ['perdida', 'rechazada', 'fallida'].includes(l.estado);
    const clase = l.video ? 'Videollamada' : 'Llamada';
    const dur = l.duracion > 0
      ? ' · ' + Math.floor(l.duracion / 60) + ':' + String(l.duracion % 60).padStart(2, '0') : '';
    const icono = l.video
      ? '<path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>'
      : '<path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 1.9.6 2.8a2 2 0 01-.5 2.1L8.1 9.7a16 16 0 006 6l1.1-1.1a2 2 0 012.1-.5c.9.3 1.8.5 2.8.6a2 2 0 011.9 2.1z"/>'
        + (sinAtender ? '<path d="M23 1L17 7M17 1l6 6"/>' : '');
    return '<div class="mllamada' + (sinAtender ? ' perdida' : '') + '">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">'
      + icono + '</svg>'
      + '<span>' + esc(clase + ' ' + (ESTADO_LLAMADA[l.estado] || 'contestada') + dur) + '</span></div>';
  }
  // Ubicacion y contacto llegaban como un parrafo con coordenadas o con BEGIN:VCARD. Ahora son
  // tarjetas, como en WhatsApp: el mapa se abre con un toque y el telefono abre el chat.
  if (t === 'location' || t === 'live_location') {
    const u = ubicacionDeCuerpo(m.body);
    if (u) {
      return '<a class="mubic" href="' + esc(urlDeMapa(u.lat, u.lng)) + '" target="_blank" rel="noopener">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">'
        + '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0119 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'
        + '<span><b>' + esc(u.nombre || (t === 'live_location' ? 'Ubicación en vivo' : 'Ubicación')) + '</b>'
        + '<small>' + esc(u.lat + ', ' + u.lng) + ' · Abrir en Google Maps</small></span></a>';
    }
  }
  if (t === 'contact' || t === 'contacts') {
    const tarjetas = tarjetasDeContacto(m.body);
    if (tarjetas.length) {
      return tarjetas.map(x => '<div class="mtarjeta"><div class="av">' + esc(iniciales(x.nombre)) + '</div>'
        + '<span><b>' + esc(x.nombre) + '</b>'
        + x.telefonos.map(tel => '<small>' + conTelefonos(esc(tel)) + '</small>').join('')
        + '</span></div>').join('');
    }
  }
  if (t === 'video') {
    return medio('Video', (src, porId) =>
      '<video class="mmedia" controls preload="none"'
      + (porId ? ' data-medio="' + esc(id) + '"' : ' src="' + src + '"') + '></video>') + pie;
  }
  if (t === 'audio' || t === 'voice') {
    const trans = m.audio_transcript || m.transcription || '';
    const segundos = Number(m.media_seconds) || 0;
    const onda = ondaReal(m.media_waveform_b64) || ondaFalsa(m.wamid || m.id || '');
    // Reproductor propio con la forma de WhatsApp: boton redondo, onda, duracion y
    // velocidad. El <audio controls> del navegador ocupa el doble, cambia de aspecto en
    // cada navegador y dentro de un globo de chat se ve como un parche.
    //
    // La nota de voz nunca se descargo al pintar el hilo --solo al pulsar play-- asi que
    // bajo demanda cambia poco: el audio se pide igual, pero la onda y la duracion ya salen
    // de lo que mando WhatsApp en vez de inventarse.
    const reproductor = (attr) => '<div class="voz"' + attr + '>'
      + '<button class="vplay" aria-label="Reproducir">▶</button>'
      + '<div class="vonda">' + onda + '<span class="vprog"></span></div>'
      + '<span class="vtiempo">' + (segundos > 0
        ? Math.floor(segundos / 60) + ':' + String(Math.floor(segundos % 60)).padStart(2, '0') : '0:00') + '</span>'
      + '<button class="vvel" aria-label="Velocidad">1×</button>'
      + '</div>';
    const cuerpo = bajo ? reproductor(' data-bajo="' + esc(String(m.id || '')) + '"')
      : (a.url ? reproductor(' data-src="' + esc(a.url) + '"')
        : id ? reproductor(' data-medio-audio="' + esc(id) + '"')
        : tarjetaArchivo(a, 'Nota de voz', m));
    return cuerpo + (trans ? '<div class="mpie">“' + esc(trans) + '”</div>' : '');
  }
  if (t === 'document' || t === 'file') {
    if (!a.url && bajo) return tarjetaBajoDemanda(m, a, 'Documento') + pie;
    // Un documento guardado no se ve dentro del globo: se baja al pulsar, no al pintar el hilo.
    if (!a.url && id) return '<div class="marchivo"><b>' + esc(a.nombre || m.media_filename || 'Documento') + '</b>'
      + '<span>' + esc(m.media_mime || a.mime || 'archivo') + '</span>'
      + '<button data-descarga="' + esc(id) + '" data-nombre="' + esc(a.nombre || m.media_filename || 'archivo') + '">Descargar</button>'
      + opsArchivo(m) + '</div>' + pie;
    return tarjetaArchivo(a, 'Archivo', m) + pie;
  }

  // Los números que manda el cliente se pueden pulsar para abrir un chat con ellos.
  return conTelefonos(esc(m.body || ''));
}

/* ---- Lo que acaba de salir, antes de que exista el globo de verdad ------- */
// Por WhatsApp Web el mensaje NO se envia en la llamada del panel: se deja en una cola que
// lee el puente de la PC del negocio, y el globo no aparece hasta que el puente lo manda y lo
// guarda. Entre una cosa y la otra el chat se quedaba exactamente igual que antes de pulsar
// Enviar --ni globo, ni reloj, ni nada--, asi que lo normal era volver a escribirlo.
//
// Esto NO da por enviado nada: pinta lo que el servidor YA acepto, con reloj de "enviando",
// y el globo real de Firestore lo sustituye en cuanto el puente lo guarda.
// (ENVIANDO se declara arriba, junto a MSGS: escuchaMensajes lo vacia al cambiar de chat.)
const VIDA_ENVIANDO_MS = 10 * 60 * 1000;

function apuntaEnviando({ conv, tipo, body, mime, datos }){
  if (!conv) return;
  ENVIANDO.push({
    _enviando: true,
    id: 'enviando:' + conv + ':' + Date.now() + ':' + ENVIANDO.length,
    conversation_id: conv,
    direction: 'out', sender: 'agent',
    msg_type: tipo || 'text',
    body: body || '',
    media_mime: mime || null,
    // La vista previa sale del archivo que ya esta en el navegador: no hay que esperar a que
    // el puente lo suba para ver QUE foto se mando.
    media_url: datos && mime ? 'data:' + mime + ';base64,' + datos : '',
    conMedio: !!datos,
    created_at: new Date().toISOString(),
    delivery_status: 'enviando',
    // Con cinco segundos de margen por si el reloj del servidor va por detras del navegador.
    desde: Date.now() - 5000,
  });
  pintaMensajes();
}

// Un globo optimista desaparece en cuanto llega el de verdad. Solo cuenta lo que se guardo
// DESPUES de pulsar Enviar: sin esa condicion, un mensaje identico mandado ayer lo borraria
// de la pantalla al instante y el reloj no se veria nunca.
function globosEnviando(conv){
  const ahora = Date.now();
  // Lo que sale por WhatsApp Web ya no trae media_id --el archivo de transito se borra al
  // enviarse-- sino su vista previa (media_store 'bajo_demanda'). Sin mirarlo, el globo
  // provisional de una foto se quedaba diez minutos al lado del real: la misma foto dos veces.
  ENVIANDO = ENVIANDO.filter(o => ahora - o.desde < VIDA_ENVIANDO_MS && !MSGS.some(m =>
    m.direction === 'out' && instanteMsg(m) >= o.desde &&
    (o.conMedio
      ? !!(m.media_id || m.media_url || esBajoDemanda(m))
      : String(m.body || '').trim() === String(o.body || '').trim())));
  return ENVIANDO.filter(o => o.conversation_id === conv);
}

// A que mensaje contesta este. WhatsApp manda la cita dentro del mensaje y el puente la guarda
// en metadata.responde_a; reply_snippet es el campo viejo del bot oficial y se sigue leyendo.
// Sin esto, la respuesta de un cliente llegaba suelta --"si, ese"-- y no habia manera de saber
// a cual de los tres combos decia que si. En WhatsApp Web eso se ve siempre.
function citaDelMensaje(m){
  const r = m.metadata?.responde_a;
  const texto = r?.texto || m.reply_snippet || '';
  if (!texto) return '';
  const mio = r ? r.mio === true : m.reply_sender !== 'customer';
  // El id del mensaje citado va en el atributo: pulsando la cita se salta al original, como en
  // WhatsApp. Si ese mensaje no esta cargado (el hilo trae los ultimos 400), no pasa nada.
  const destino = r?.wamid ? ' data-cita="' + esc(r.wamid) + '"' : '';
  return '<div class="cita"' + destino + '><b>' + esc(mio ? 'Tú' : nombreDe(sel)) + '</b>'
    + esc(String(texto).slice(0, 140)) + '</div>';
}

function pintaMensajes(){
  const cont = $('mensajes'); if (!cont) return;
  const pegado = cont.scrollHeight - cont.scrollTop - cont.clientHeight < 90;
  let dia = '', antes = '';
  // Un mensaje eliminado NO desaparece del hilo: se queda, marcado, con quien lo elimino y por
  // que (ver infoEliminado). Antes se filtraba y quien borraba algo no dejaba rastro. La marca
  // vive DENTRO de metadata, no en el primer nivel.
  const html = MSGS.concat(globosEnviando(sel && (sel.id || sel._id)))
    .sort((a, b) => instanteMsg(a) - instanteMsg(b))
    .map(m => {
    const t = instanteMsg(m);
    const conFecha = t !== Number.MAX_SAFE_INTEGER;
    const d = new Date(conFecha ? t : Date.now());
    // Sin fecha no se inventa un separador: se queda bajo el dia anterior. Pintar "Invalid
    // Date" como separador era lo que lo delataba, pero tambien lo que confundia.
    const etiquetaDia = conFecha ? d.toLocaleDateString('es-DO', { day:'numeric', month:'short' }) : dia;
    let cabeza = '';
    if (etiquetaDia !== dia) { dia = etiquetaDia; cabeza = '<div class="dia">' + esc(etiquetaDia) + '</div>'; antes = ''; }
    const sale = m.direction === 'out';
    const emisor = sale ? (m.sender || 'agent') : 'in';
    const primero = emisor !== antes; antes = emisor;
    // El ternario anterior daba ✓ a TODO lo que no fuera leido o entregado, incluido
    // 'failed'. Un mensaje que Meta rechazo se veia igual que uno que salio bien, que
    // es exactamente cuando hace falta enterarse.
    // Cuando lo leyo el cliente, si el puente lo apunto (read_at): al pasar el raton por las
    // palomitas azules. Es lo que hace WhatsApp en «Info. del mensaje».
    const leidoA = m.read_at ? new Date(m.read_at) : null;
    const leidoTitulo = leidoA && !Number.isNaN(leidoA.getTime())
      ? ' title="Leído ' + esc(leidoA.toLocaleString('es-DO', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })) + '"' : '';
    const ticks = sale ? ({
      read: ' <b class="leido"' + leidoTitulo + '>✓✓</b>', delivered: ' ✓✓', sent: ' ✓',
      failed: ' <b class="fallo">⚠</b>',
      // Todavia en la cola del puente: ni un ✓, que seria decir que ya salio.
      enviando: ' <span title="En cola, saliendo">🕓</span>',
    }[String(m.delivery_status || 'sent')] ?? ' ·') : '';
    const autor = (sale && m.sender === 'bot' && primero) ? '<div class="autor">Bot</div>' : '';
    const cita = citaDelMensaje(m);
    const idMsg = m.id || m.wamid || '';
    const marcado = modoSeleccion && SEL_MSGS.has(idMsg);
    // El puente reescribe el body con el texto nuevo (index.js:aplicaCambioDeMensaje), asi que
    // el hilo YA mostraba la version editada; lo unico que faltaba era decirlo, como WhatsApp
    // Web ("Editado" antes de la hora). Sin esto se leia como que el cliente escribio eso
    // desde el principio.
    const editado = m.metadata?.editado
      ? (versionesDe(m).length
          ? '<button class="editado-tag ver-versiones" data-versiones="' + esc(idMsg) + '" title="Ver lo que decía antes">Editado</button> '
          : '<span class="editado-tag">Editado</span> ')
      : '';
    // Destacar no le llega al cliente ni al puente (ver starMessageAction): es una marca
    // solo del CRM, igual que en WhatsApp Web se destaca solo para quien lo pulsa.
    const destacadoTag = m.metadata?.starred ? '<span class="destacado-tag" title="Destacado">★</span> ' : '';
    const eliminado = infoEliminado(m);
    const avisoElim = eliminado ? avisoDeEliminado(eliminado) : '';
    return cabeza + '<div class="globo ' + (sale ? 'sale' : 'entra') + ' ' + (primero ? 'primero' : 'seguido')
      + (marcado ? ' marcado' : '') + (eliminado ? ' eliminado' : '') + '"'
      + ' data-msg="' + esc(idMsg) + '">'
      + '<input type="checkbox" class="msel" data-msel="' + esc(idMsg) + '"' + (marcado ? ' checked' : '') + '>'
      + '<button class="gaccion" aria-label="Opciones del mensaje">⌄</button>'
      + avisoElim + autor + cita + cuerpoMensaje(m)
      + '<span class="pie-globo">' + destacadoTag + editado + (conFecha ? esc(d.toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'})) : '') + ticks + '</span>'
      + '</div>';
  }).join('') || '<div style="margin:auto;color:var(--mut);font-size:13px">Sin mensajes todavía.</div>';

  // Repintado INCREMENTAL. Antes se reconstruia el hilo entero en cada snapshot, y un
  // snapshot llega con cada mensaje nuevo Y con cada cambio de estado de entrega. Eso
  // cortaba la nota de voz que estuvieras escuchando, cerraba el menu de mensaje que
  // tuvieras abierto y hacia volver a pedir todas las imagenes.
  //
  // Se compara el html generado con el anterior; si no cambio, no se toca el DOM. Si
  // cambio, se sustituyen SOLO los globos distintos, y nunca uno con audio sonando.
  pintaVentana24();
  if (cont.dataset.firma === html) { resuelveMedios(); return; }
  const previo = cont.dataset.firma;
  cont.dataset.firma = html;

  if (!previo) {
    cont.innerHTML = html;
  } else {
    const nuevo = document.createElement('div');
    nuevo.innerHTML = html;
    const viejos = [...cont.children], nuevos = [...nuevo.children];
    // Si la estructura cambio de largo, se reconstruye; comparar posicion a posicion con
    // longitudes distintas mezclaria mensajes que no se corresponden.
    if (viejos.length !== nuevos.length) {
      const sonando = cont.querySelector('.voz') && audioActivo && !audioActivo.paused;
      if (sonando) {
        // Llego un mensaje mientras se escuchaba una nota: se AÑADE lo que falta al
        // final en vez de rehacer el hilo, para no cortar el audio.
        nuevos.slice(viejos.length).forEach(n => cont.appendChild(n));
      } else {
        cont.innerHTML = html;
      }
    } else {
      viejos.forEach((v, i) => {
        if (v.outerHTML === nuevos[i].outerHTML) return;
        if (v.querySelector?.('.voz') && vozActiva && v.contains(vozActiva)) return;  // suena: no se toca
        v.replaceWith(nuevos[i]);
      });
    }
  }
  if (pegado) cont.scrollTop = cont.scrollHeight;
  resuelveMedios();
}
