  const a = c.ai_analysis;
  const casilla = (clave, html, marcada) => '<label class="campo" style="display:flex;gap:7px;align-items:flex-start;'
    + 'text-transform:none;letter-spacing:0;font-weight:400"><input type="checkbox" data-anap="' + clave + '"'
    + (marcada ? ' checked' : '') + ' style="width:auto;margin-top:3px"><span>' + html + '</span></label>';
  let html = '';
  if (a && a.status === 'pendiente') {
    html += '<p class="aviso" style="margin:0 0 8px">Propuesta del ' + esc(fechaCorta(a.at))
      + (a.mensajes ? ' · ' + Number(a.mensajes) + ' mensajes' : '')
      + (a.basado_en && a.basado_en !== c.last_message_at ? ' · <b>entraron mensajes después: conviene volver a analizar</b>' : '') + '</p>';
    if (a.resumen) html += casilla('resumen', '<b>Resumen:</b> ' + esc(a.resumen), true);
    if ((a.etiquetas || []).length) {
      html += '<div class="campo"><label>Etiquetas propuestas</label><div style="display:flex;flex-wrap:wrap;gap:10px">'
        + a.etiquetas.map(e => '<label style="display:flex;gap:4px;align-items:center;text-transform:none;letter-spacing:0;font-weight:400">'
          + '<input type="checkbox" data-anetq="' + esc(e) + '" checked style="width:auto">' + esc(e) + '</label>').join('')
        + '</div></div>';
    }
    if (a.categoria) html += casilla('categoria', '<b>Categoría:</b> ' + esc(a.categoria)
      + (c.interested_category && c.interested_category !== a.categoria ? ' (ahora ' + esc(c.interested_category) + ')' : ''), !c.interested_category);
    // La etapa y el ignorar salen sin marcar: mueven el embudo o esconden la ficha.
    if (a.etapa) html += casilla('etapa', '<b>Etapa:</b> ' + esc(a.etapa) + ' (ahora ' + esc(c.lifecycle_stage || 'nuevo') + ')', false);
    if (a.interes) html += '<p class="aviso" style="margin:0 0 8px">Interés: <b>' + esc(a.interes) + '</b></p>';
    if (a.ignorar) html += casilla('ignorar', '<b>Ignorar como ' + esc(TIPOS_IGNORAR[a.ignorar.kind] || 'otro') + '</b>'
      + (a.ignorar.motivo ? ' — ' + esc(a.ignorar.motivo) : ''), false);
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px"><button class="btn-solido" id="anAplicar">Aplicar lo marcado</button>'
      + '<button class="btn-linea" id="anDescartar">Descartar</button></div>';
  } else if (a && a.status) {
    html += '<p class="aviso" style="margin:0 0 8px">Último análisis ' + (a.status === 'aplicada' ? 'aplicado' : 'descartado')
      + (a.decidido_at ? ' el ' + esc(fechaCorta(a.decidido_at)) : '')
      + ((a.aplicado || []).length ? ' (' + a.aplicado.map(k => esc(NOMBRE_CAMPO_AN[k] || k)).join(', ') + ')' : '') + '.</p>';
  }
  return html + '<button class="btn-linea" id="anUna">' + (a ? 'Volver a analizar' : 'Analizar esta conversación') + '</button>'
    + '<p class="aviso" style="margin:7px 0 0">Gemini lee el texto de los últimos mensajes, sin teléfonos, y propone. '
    + 'Nada cambia hasta que pulses Aplicar.</p>';
}

function cableaAnalisisFicha(c){
  const id = c.id || c._id;
  const repinta = () => { const f = $('fichaAnalisis'); if (f) { f.innerHTML = cuerpoAnalisisFicha(c); cableaAnalisisFicha(c); } };
  const una = $('anUna');
  if (una) una.onclick = async () => {
    una.disabled = true; una.textContent = 'Analizando…';
    const r = await llama({ action:'analyze', operation:'one', conversation_id:id });
    una.disabled = false; una.textContent = 'Volver a analizar';
    if (!r.ok) return avisa('No se pudo analizar', r.error);
    if (r.sin_texto) return avisa('Nada que analizar', 'El cliente no ha escrito texto en esta conversación.');
    // El snapshot trae la propuesta guardada; se pinta ya para no esperarlo.
    c.ai_analysis = r.analisis;
    repinta();
  };
  const ap = $('anAplicar');
  if (ap) ap.onclick = async () => {
    const f = $('fichaAnalisis');
    const campos = { etiquetas: [...f.querySelectorAll('[data-anetq]')].filter(x => x.checked).map(x => x.dataset.anetq) };
    f.querySelectorAll('[data-anap]').forEach(x => { campos[x.dataset.anap] = x.checked; });
    if (campos.ignorar && !await confirmaAqui('También se ignorará esta conversación y las demás fichas de su número. ¿Seguro?')) return;
    ap.disabled = true;
    const r = await llama({ action:'analyze', operation:'apply', conversation_id:id, campos });
    ap.disabled = false;
    if (!r.ok) return avisa('No se aplicó', r.error);
    avisa('Aplicado', [(r.aplicado || []).map(k => NOMBRE_CAMPO_AN[k] || k).join(', '), ...(r.omitido || [])].filter(Boolean).join(' · '));
  };
  const de = $('anDescartar');
  if (de) de.onclick = async () => {
    de.disabled = true;
    const r = await llama({ action:'analyze', operation:'discard', conversation_id:id });
    de.disabled = false;
    if (!r.ok) return avisa('No se pudo', r.error);
    avisa('Propuesta descartada');
  };
}

function resumenCorridaAnalisis(r){
  return [Number(r.analizadas || 0) + ' analizadas',
    r.omitidas_ignoradas ? r.omitidas_ignoradas + (r.omitidas_ignoradas === 1 ? ' ignorada no enviada' : ' ignoradas no enviadas') : '',
    r.sin_texto ? r.sin_texto + ' sin texto del cliente' : '',
    (r.fallidas || []).length ? r.fallidas.length + (r.fallidas.length === 1 ? ' fallida' : ' fallidas') : '',
    r.parado_por === 'tope_diario' ? 'se alcanzó el tope del día'
      : r.parado_por === 'cuota_google' ? 'Google pidió esperar: reintenta en unos minutos'
      : r.parado_por === 'tiempo' ? 'se acabó el tiempo de la petición: continúa con otra tanda' : '',
  ].filter(Boolean).join(' · ');
}

function pintaResultadosAnalisis(cont, r){
  if (!cont) return;
  const filas = r.resultados || [];
  cont.innerHTML = '<div class="propuesta" style="margin-top:10px"><div class="cuerpo">'
    + '<p class="aviso"><b>' + esc(resumenCorridaAnalisis(r)) + '</b></p>'
    + filas.map(x => {
      const a = x.analisis || {};
      return '<div class="cambio" style="margin-bottom:8px">'
        + '<div class="k">' + esc(x.nombre || x.id) + '</div>'
        + (a.resumen ? '<div>' + esc(a.resumen) + '</div>' : '')
        + '<div style="font-size:12px;color:var(--mut);margin-top:4px">'
        +   [a.categoria, a.etapa ? 'etapa ' + a.etapa : '', a.interes ? 'interés ' + a.interes : '', (a.etiquetas || []).join(', ')]
            .filter(Boolean).map(esc).join(' · ')
        + '</div>'
        + (a.ignorar ? '<div style="font-size:12px;color:var(--warn);margin-top:4px">Propone ignorar como '
          + esc(TIPOS_IGNORAR[a.ignorar.kind] || 'otro') + (a.ignorar.motivo ? ': ' + esc(a.ignorar.motivo) : '') + '</div>' : '')
        + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:7px">'
        +   '<button class="btn-linea" data-anaplica="' + esc(x.id) + '">Aplicar resumen, etiquetas y categoría</button>'
        +   '<button class="btn-linea" data-anabre="' + esc(x.id) + '">Abrir</button>'
        + '</div></div>';
    }).join('') + '</div></div>';
  cont.onclick = async ev => {
    const ap = ev.target.closest('[data-anaplica]');
    if (ap) {
      const fila = filas.find(f => f.id === ap.dataset.anaplica);
      ap.disabled = true;
      const res = await llama({ action:'analyze', operation:'apply', conversation_id:ap.dataset.anaplica,
        campos:{ resumen:true, categoria:true, etiquetas:fila?.analisis?.etiquetas || [] } });
      if (!res.ok) { ap.disabled = false; return avisa('No se aplicó', res.error); }
      ap.textContent = 'Aplicado';
      return;
    }
    const ab = ev.target.closest('[data-anabre]');
    if (ab) { const c = buscaConv(ab.dataset.anabre); if (!c) return; cierraModal(); ve('conversations'); abre(c); }
  };
}

    +   '<button class="btn-solido" id="ignAplicar" disabled>Aplicar</button></div>'

async function pintaListaIgnorados(){
  const cont = $('ignLista'); if (!cont) return;
  const r = await llama({ action:'ignore', operation:'list' });
  if (!r.ok) {
    cont.innerHTML = '<p class="cfgnota">' + esc(r.status === 403 ? 'Tu rol no puede ver la lista de ignorados.'
      : 'No se pudo leer la lista: ' + (r.error || 'error')) + '</p>';
    return;
  }
  const activas = (r.entradas || []).filter(e => e.active);
  cont.innerHTML = activas.length
    ? '<div class="tabla"><div class="fila cabecera"><span>Teléfono</span><span>Tipo</span><span>Nota</span><span></span></div>'
      + activas.map(e => '<div class="fila"><span>' + esc(telefonoLegible(e.wa_phone)) + '</span>'
        + '<span>' + esc(TIPOS_IGNORAR[e.kind] || e.kind) + '</span><span>' + esc(e.nota || '—') + '</span>'
        + '<span><button class="btn-linea" data-ignquita="' + esc(e.wa_phone) + '">Quitar</button></span></div>').join('')
      + '</div>'
    : '<p class="cfgnota">Todavía no hay ningún número en la lista.</p>';
  cont.onclick = async ev => {
    const b = ev.target.closest('[data-ignquita]'); if (!b) return;
    if (!await confirmaAqui('Dejar de ignorar el ' + telefonoLegible(b.dataset.ignquita) + '. Sus fichas vuelven a la bandeja. ¿Seguro?')) return;
    b.disabled = true;
    const q = await llama({ action:'ignore', operation:'remove_number', phone:b.dataset.ignquita });
    if (!q.ok) { b.disabled = false; return avisa('No se pudo', q.error); }
    avisa('Número quitado de la lista', q.fichas ? q.fichas + ' ficha(s) vuelven a la bandeja' : '');
    pintaListaIgnorados();
  };
}

function planIgnorarHtml(r, { propuestas = false } = {}){
  const fila = x => esc(x.nombre) + ' · ' + esc(x.canal || '');
  const lista = (arr, fmt) => arr.slice(0, 40).map(fmt).join('<br>') + (arr.length > 40 ? '<br>y ' + (arr.length - 40) + ' más' : '');
  const ocultas = r.fichas_que_se_ocultan || [];
  const props = r.propuestas || [];
  return '<div class="propuesta" style="margin-top:10px"><div class="cuerpo">'
    + (propuestas || !ocultas.length ? '' : '<div class="cambio"><div class="k">Se ocultan ' + ocultas.length + '</div>' + lista(ocultas, fila) + '</div>')
    + (!propuestas && !ocultas.length ? '<div class="cambio"><div class="k">Se ocultan</div>ninguna ficha</div>' : '')
    + (propuestas ? '<div class="cambio"><div class="k">Propuestas ' + props.length + '</div>'
      + (props.length ? lista(props, x => fila(x) + ' · «' + esc(x.patron) + '»' + (x.con_senales_cliente ? ' · <b>señales de cliente</b>' : '')) : 'ninguna coincidencia')
      + '</div>' : '')
    + (r.ya_ignoradas ? '<div class="cambio"><div class="k">Ya ignoradas</div>' + Number(r.ya_ignoradas) + '</div>' : '')
    + ((r.invalidos || []).length ? '<div class="cambio"><div class="k">Números no válidos</div>' + r.invalidos.map(esc).join(', ') + '</div>' : '')
    + (r.respetados ? '<div class="cambio"><div class="k">Deshechos antes por el dueño (no se tocan)</div>' + Number(r.respetados) + '</div>' : '')
    + '</div></div>';
}

function pintaPropuestasIgnorar(){
  const cont = $('ignPropuestas'); if (!cont) return;
  const lista = CONVS_TODAS.filter(c => !ignorada(c) && c.ignore_suggestion?.status === 'pendiente');
  if (!lista.length) { cont.innerHTML = '<p class="cfgnota">Ninguna propuesta pendiente.</p>'; cont.onclick = null; return; }
  cont.innerHTML = lista.slice(0, 200).map(c => {
    const s = c.ignore_suggestion;
    return '<label class="cfgsw" style="align-items:flex-start"><input type="checkbox" data-ignprop="' + esc(c.id || c._id) + '"'
      + (s.confianza === 'alta' && !s.con_senales_cliente ? ' checked' : '') + '><span><b>' + esc(nombreDe(c)) + ' · '
      + esc(TIPOS_IGNORAR[s.kind] || 'otro') + '</b><i>' + esc((s.via === 'ia' ? 'Análisis' : 'Nombre') + ' · confianza '
      + (s.confianza || '—') + (s.motivo ? ' · ' + s.motivo : '') + (s.con_senales_cliente ? ' · OJO: tiene señales de cliente' : ''))
      + '</i></span></label>';
  }).join('')
    + '<div class="acciones" style="margin-top:8px"><button class="btn-solido" id="ignPropIgnorar">Ignorar las marcadas</button> '
    + '<button class="btn-linea" id="ignPropCliente">Las marcadas son clientes</button></div>';
  const decide = async decision => {
    const ids = [...cont.querySelectorAll('[data-ignprop]')].filter(x => x.checked).map(x => x.dataset.ignprop);
    if (!ids.length) return avisa('Marca al menos una');
    let hechas = 0; const fallos = [];
    for (let i = 0; i < ids.length; i += 50) {
      const r = await llama({ action:'ignore', operation:'decide', conversation_ids:ids.slice(i, i + 50), decision });
      if (!r.ok) { fallos.push(r.error); break; }
      hechas += Number(r.hechas || 0);
      fallos.push(...(r.fallos || []).map(f => f.error));
    }
    avisa((decision === 'ignorar' ? 'Ignoradas ' : 'Marcadas como clientes ') + hechas + ' de ' + ids.length, fallos.slice(0, 2).join(' · '));
    // El snapshot trae los cambios en un momento; se repinta cuando ya estan.
    setTimeout(pintaPropuestasIgnorar, 900);
  };
  $('ignPropIgnorar').onclick = () => decide('ignorar');
  $('ignPropCliente').onclick = () => decide('es_cliente');
}

function cableaIgnoradosCfg(){
  if (!$('ignLista')) return;
  pintaListaIgnorados();
  pintaPropuestasIgnorar();
  const entradas = () => lineasCfg($('ignNumeros')?.value).map(([phone, kind, ...nota]) => ({ phone, kind: kind || 'otro', nota: nota.join(' ') }));
  const sim = $('ignSimular'), apl = $('ignAplicar');
  // Lo simulado deja de valer en cuanto se toca la lista: aplicar tiene que ser lo que se vio.
  $('ignNumeros').oninput = () => { apl.disabled = true; };
  sim.onclick = async () => {
    const e = entradas(); if (!e.length) return avisa('Escribe al menos un número');
    sim.disabled = true;
    const r = await llama({ action:'ignore', operation:'add_numbers', entradas:e });
    sim.disabled = false;
    if (!r.ok) return avisa('No se pudo simular', r.error);
    $('ignSalida').innerHTML = planIgnorarHtml(r);
    apl.disabled = !(r.telefonos_en_lista || (r.fichas_que_se_ocultan || []).length);
  };
  apl.onclick = async () => {
    apl.disabled = true;
    const r = await llama({ action:'ignore', operation:'add_numbers', entradas:entradas(), dry:false });
    if (!r.ok) { apl.disabled = false; return avisa('No se aplicó', r.error); }
    avisa('Lista actualizada', (r.fichas_que_se_ocultan || []).length + ' ficha(s) ocultas');
    $('ignSalida').innerHTML = planIgnorarHtml(r);
    $('ignNumeros').value = '';
    pintaListaIgnorados();
  };
  const nombres = () => lineasCfg($('ignNombres')?.value).map(([nombre, kind]) => ({ nombre, kind: kind || 'otro' }));
  const bus = $('ignNombresBuscar'), gua = $('ignNombresGuardar');
  $('ignNombres').oninput = () => { gua.disabled = true; };
  bus.onclick = async () => {
    const n = nombres(); if (!n.length) return avisa('Escribe al menos un nombre');
    bus.disabled = true;
    const r = await llama({ action:'ignore', operation:'propose_names', nombres:n });
    bus.disabled = false;
    if (!r.ok) return avisa('No se pudo buscar', r.error);
    $('ignNombresSalida').innerHTML = planIgnorarHtml(r, { propuestas:true });
    gua.disabled = !(r.propuestas || []).length;
  };
  gua.onclick = async () => {
    gua.disabled = true;
    const r = await llama({ action:'ignore', operation:'propose_names', nombres:nombres(), dry:false });
    if (!r.ok) { gua.disabled = false; return avisa('No se guardaron', r.error); }
    avisa('Propuestas guardadas', (r.propuestas || []).length + ' para revisar abajo');
    $('ignNombres').value = '';
    $('ignNombresSalida').innerHTML = '';
    setTimeout(pintaPropuestasIgnorar, 900);
  };
}

// ---- Configuracion: Analisis de conversaciones con IA
function analisisCfg(){
  return '<div id="anUso"><p class="cfgnota"><span class="cargando"></span> Cargando…</p></div>'

}

async function pintaUsoAnalisis(){
  const cont = $('anUso'); if (!cont) return;
  const r = await llama({ action:'analyze', operation:'usage' });
  if (!r.ok) {
    cont.innerHTML = '<p class="cfgnota">' + esc(r.status === 403 ? 'Tu rol no puede usar el análisis.' : (r.error || 'No se pudo leer el uso')) + '</p>';

  }
  const n = v => Number(v || 0).toLocaleString('es-DO');

function cableaAnalisisCfg(){
  const pre = $('anPrevia'), lot = $('anLoteCfg'), sal = $('anSalidaCfg');
  if (!pre) return;
  pintaUsoAnalisis();
  let ids = [];
  pre.onclick = async () => {
    pre.disabled = true;
    const r = await llama({ action:'analyze', operation:'preview' });
    pre.disabled = false;
    if (!r.ok) return avisa('No se pudo preparar', r.error);
    const convs = r.conversaciones || [];
    ids = convs.map(x => x.id);
    sal.innerHTML = '<div class="propuesta"><div class="cuerpo">'
      + '<div class="cambio"><div class="k">Se mandarían ' + ids.length + '</div>'
      +   (convs.map(x => esc(x.nombre) + ' · ' + esc(x.canal)).join('<br>') || 'ninguna: todo está analizado') + '</div>'
      + (r.quedan_sin_analizar ? '<div class="cambio"><div class="k">Quedan después</div>' + Number(r.quedan_sin_analizar) + '</div>' : '')
      + (r.omitidas_ignoradas ? '<div class="cambio"><div class="k">Ignoradas (no se mandan)</div>' + Number(r.omitidas_ignoradas) + '</div>' : '')
      + '<div class="cambio"><div class="k">Coste orientativo</div>~' + Number(r.tokens_estimados || 0).toLocaleString('es-DO')
      +   ' tokens de entrada · hoy van ' + Number(r.cupo?.hoy || 0) + ' de ' + Number(r.cupo?.por_dia || 0) + '</div>'
      + '</div></div>';
    lot.disabled = !ids.length;
    lot.textContent = 'Analizar ' + ids.length;
  };
  lot.onclick = async () => {
    if (!ids.length) return;
    lot.disabled = true; lot.textContent = 'Analizando…';
    const r = await llama({ action:'analyze', operation:'batch', conversation_ids:ids });
    lot.textContent = 'Analizar';
    if (!r.ok) { lot.disabled = false; return avisa('No se pudo analizar', r.error); }
    ids = [];
    pintaResultadosAnalisis(sal, r);
    pintaUsoAnalisis();
  };
}

/* ---- Encuesta de satisfacción -------------------------------------------- */
// Se pregunta QUIEN atendio antes de mandarla. Sin eso la reseña se guarda sin
// collaborator_id y el scorecard por colaborador sale vacio para siempre: el dato no se
// puede reconstruir despues, porque nadie se acuerda de quien atendio hace tres semanas.
let COLABORADORES = null;

async function cargaColaboradores(){
  if (COLABORADORES) return COLABORADORES;
  const r = await llama({ action:'data', table:'collaborators', operation:'select', limit:100 });
  // Un fallo de red NO se cachea. Antes se guardaba [] y quedaba fijo toda la sesion: el
  // panel decia "no hay nadie dado de alta" para siempre, que es indistinguible de la
  // verdad y hace pensar que el equipo se borro.
  if (!r.ok) return null;
  COLABORADORES = r.data || r.rows || [];
  return COLABORADORES;
}

function abreEncuesta(c){
  if (!c) return;
  const nombre = String(nombreReal(c)).trim().split(/\s+/)[0] || '';
  const porDefecto = (nombre ? 'Hola ' + nombre + '. ' : 'Hola. ')
    + '¿Nos regalas un minuto para contarnos cómo te fue con nosotros? '
    + 'Nos ayuda muchísimo a mejorar.';
  abreModal('<div class="mtapa"><b>Encuesta de satisfacción</b>'
    + '<button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo">'
    + '<div class="dato"><div class="k">Para</div><div class="v">' + esc(nombreDe(c))
    +   ' · +' + esc(c.wa_phone || '') + ' · ' + esc(CANALES[canalDe(c)].corto) + '</div></div>'
    + '<div class="campo"><label>¿Quién atendió a este cliente?</label>'
    +   '<select id="encColab"><option value="">— sin especificar —</option></select>'
    +   '<p class="aviso" style="margin:6px 0 0">Si no se elige, la reseña no cuenta para nadie en el '
    +     'ranking del equipo, y eso no se puede arreglar después.</p></div>'
    + '<div class="campo"><label>Mensaje</label>'
    +   '<textarea id="encMsg" rows="4">' + esc(porDefecto) + '</textarea></div>'
    + '</div>'
    + '<div class="mpatas"><button class="btn-linea" data-cerrar>Cancelar</button>'
    +   '<button class="btn-solido" id="encEnviar">Enviar encuesta</button></div>');
  $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });

  cargaColaboradores().then(lista => {
    const s = $('encColab'); if (!s) return;
    // lista.map sobre null reventaba dentro del .then: la promesa quedaba rechazada sin que
    // nadie la mirara y el desplegable se quedaba con "— sin especificar —" y nada mas. El
    // agente mandaba la encuesta sin colaborador, y esa opinion no cuenta en el ranking.
    if (lista === null) {
      s.innerHTML = '<option value="">— sin especificar —</option>'
        + '<option disabled>(no se pudo leer el equipo: la nota no se le asignará a nadie)</option>';
      return;
    }
    s.innerHTML = '<option value="">— sin especificar —</option>'
      + lista.map(x => '<option value="' + esc(x.id || '') + '">'
        + esc(x.name || x.display_name || x.email || 'sin nombre') + '</option>').join('');
    if (!lista.length) s.innerHTML += '<option disabled>(no hay equipo dado de alta)</option>';
  });

  $('encEnviar').onclick = async () => {
    const b = $('encEnviar');
    b.disabled = true;
    // El canal decide la via, igual que al enviar un mensaje normal. El segundo numero
    // no pasa por la Cloud API: mandarlo por ahi responde "canal incorrecto".
    // Siempre surveyInvite: es quien crea la reseña, pone el enlace y guarda el colaborador,
    // y ya sabe mandarla por el 2.o numero. Por WhatsApp Web se encolaba solo la
    // introduccion, sin enlace, y el aviso prometia un enlace que nada creaba.
    const porPuente = canalDe(c) === 'whatsapp_qr';
    const r = await llama({ action:'surveyInvite', conversation_id: c.id || c._id,
      collaborator_id: $('encColab').value || null, intro: $('encMsg').value.trim() });
    b.disabled = false;
    if (!r.ok) return avisa('No se pudo enviar', traduceErrorMeta(r.error, r.code));
    cierraModal();
    avisa('Encuesta enviada', (porPuente ? 'Va por WhatsApp Web, con su enlace. ' : '')
      + 'Cuando conteste aparecerá en Satisfacción.');
  };
}

/* ---- Recordatorios desde el chat ----------------------------------------- */
// Dos cosas distintas con la misma pantalla, porque en la practica son la misma:
// acordarse de algo, o que el cliente reciba algo. La fecha se guarda en follow_up_at,
// que es de donde sale la vista de Recordatorios y lo que mira el motor de seguimientos.
/* ---- Guardar contacto ----------------------------------------------------- */
// Una conversacion y un cliente eran dos mundos: el CRM sabia el telefono y el nombre, y la base
// de clientes --la que llena la caja-- no se enteraba. Para apuntar a alguien como cliente habia
// que escribirlo otra vez, a mano, en la caja.
//
// Lo que NO se puede hacer, y por eso no se promete: escribir en la agenda del telefono. Ni
// Baileys ni la API oficial de WhatsApp lo permiten. El camino honesto es el de siempre --un
// .vcf que se abre en el movil y entra en Contactos--, y entonces WhatsApp, que lee esa agenda,
// enseña el nombre solo.
function abreGuardarContacto(c){
  if (!c) return;
  if (ignorada(c)) return avisa('Esa conversación está ignorada',
    'Déjala de ignorar antes de guardarla como cliente.');
  const tel = String(c.wa_phone || '');
  if (!tel) return avisa('Sin teléfono', 'Esta conversación no tiene un número con el que crear un cliente.');
  const sugerido = nombreReal(c) || c.display_name || '';
  abreModal('<div class="mtapa"><b>Guardar contacto</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo">'
    +   '<div class="campo"><label>Nombre</label><input id="gcNombre" maxlength="120" value="' + esc(sugerido) + '"></div>'
    +   '<div class="dato"><div class="k">Teléfono</div><div class="v">+' + esc(tel) + '</div></div>'
    +   '<ul class="mlista">'
    +     '<li>Va a <b>Clientes de caja</b>. Si ese número ya es cliente, se actualiza el suyo.</li>'
    +     '<li><b>Su saldo y su crédito no se tocan</b>: eso lo lleva la caja.</li>'
    +     '<li>Te bajas su tarjeta <b>.vcf</b>. Ábrela en el móvil y WhatsApp le pone el nombre solo: '
    +       'ningún programa puede escribir en la agenda del teléfono.</li>'
    +   '</ul>'
    + '</div>'
    + '<div class="mpatas"><button class="btn-linea" data-cerrar>Cancelar</button>'
    +   '<button class="btn-solido" id="gcGuardar">Guardar</button></div>');
  const campo = $('gcNombre');
  campo.focus();
  $('gcGuardar').onclick = async ev => {
    const nombre = campo.value.trim();
    if (!nombre) { campo.focus(); return avisa('Falta el nombre', 'Sin nombre no se puede guardar el contacto.'); }
    const boton = ev.currentTarget; boton.disabled = true;
    const r = await llama({ action:'saveContact', conversation_id: c.id || c._id, nombre });
    boton.disabled = false;
    if (!r.ok) return avisa('No se pudo guardar', r.error);
    cierraModal();
    if (r.vcard) bajaVcard(r.vcard, nombre);
    avisa(r.creado ? 'Cliente creado' : 'Cliente actualizado',
      nombre + ' quedó en Clientes de caja. Te bajaste su tarjeta: ábrela en el teléfono para '
      + 'que WhatsApp le ponga el nombre.');
  };
}

// El .vcf. Se arma aqui con lo que devolvio el servidor: asi el archivo dice exactamente lo que
// quedo guardado, y no lo que el navegador creia tener.
function bajaVcard(texto, nombre){
  try {
    const url = URL.createObjectURL(new Blob([texto], { type: 'text/vcard;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = (String(nombre || 'contacto').replace(/[^\wáéíóúñÁÉÍÓÚÑ -]/g, '').trim() || 'contacto') + '.vcf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (error) { /* si el navegador lo bloquea, el cliente ya quedo guardado igual */ }
}

/* ---- Enviar ubicación y tarjeta de contacto ------------------------------- */
// Lo que WhatsApp Web deja hacer desde el clip y aquí faltaba: mandar la direccion del estudio o
// el numero de otra persona sin sacar el telefono. Solo por la linea de WhatsApp Web, que es la
// que manda el puente. Las piezas puras van entre los dos marcadores para que las pruebas las
// ejecuten de verdad, sin abrir el panel.
// ---- Ubicación y contacto: piezas puras
const NUM_COORD = '(-?\\d{1,3}(?:\\.\\d+)?)';
const RES_COORDENADAS = [
  // El pin real de un enlace largo de Google Maps. Va primero: la '@' es el centro del mapa, que
  // puede estar a varias cuadras del punto marcado.
  new RegExp('!3d' + NUM_COORD + '!4d' + NUM_COORD),
  new RegExp('[?&](?:q|ll|query|destination|daddr)=' + NUM_COORD + '(?:,|%2C)\\s*' + NUM_COORD, 'i'),
  new RegExp('@' + NUM_COORD + ',' + NUM_COORD),
  // Dos numeros sueltos: lo que se copia al mantener pulsado un punto del mapa.
  new RegExp('^\\s*' + NUM_COORD + '\\s*[,;\\s]\\s*' + NUM_COORD + '\\s*$'),
];
function coordenadasValidas(lat, lng){
  return typeof lat === 'number' && typeof lng === 'number' && Number.isFinite(lat) && Number.isFinite(lng)
    && Math.abs(lat) <= 90 && Math.abs(lng) <= 180;
}
// De un enlace o de "18.48, -69.93" a { lat, lng }, o null. Los enlaces cortos (maps.app.goo.gl)
// no traen coordenadas: hay que abrirlos, y desde aqui no se puede.
function coordenadasDeTexto(texto){
  const t = String(texto || '');
  for (const re of RES_COORDENADAS) {
    const m = t.match(re);
    if (!m) continue;
    const lat = Number(m[1]), lng = Number(m[2]);
    if (coordenadasValidas(lat, lng)) return { lat, lng };
  }
  return null;
}
// Un campo suelto: solo un numero de verdad. Number('') es 0, y eso mandaria al cliente al golfo
// de Guinea sin que nadie se diera cuenta.
function numeroDeCampo(valor){
  const t = String(valor ?? '').trim().replace(',', '.');
  return /^-?\d+(?:\.\d+)?$/.test(t) ? Number(t) : null;
}
function urlDeMapa(lat, lng){
  return 'https://www.google.com/maps?q=' + encodeURIComponent(lat + ',' + lng);
}
// El cuerpo guardado de una ubicacion: "nombre\nlat,lng" (asi entra del cliente y asi lo guarda
// el puente al mandarla). El nombre puede faltar.
function ubicacionDeCuerpo(cuerpo){
  const lineas = String(cuerpo || '').split('\n').map(l => l.trim()).filter(Boolean);
  const ult = lineas[lineas.length - 1] || '';
  const m = ult.match(/^(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)$/);
  if (!m) return null;
  const lat = Number(m[1]), lng = Number(m[2]);
  return coordenadasValidas(lat, lng) ? { lat, lng, nombre: lineas.slice(0, -1).join(' · ') } : null;
}
const desescapaVcard = t => String(t || '').replace(/\\([,;\\])/g, '$1').replace(/\\n/gi, ' ').trim();
// Las tarjetas de un mensaje 'contact' / 'contacts': nombre y telefonos de cada vCard. Sin vCard
// legible se cae al nombre de la primera linea, para no pintar nada vacio.
function tarjetasDeContacto(cuerpo){
  const texto = String(cuerpo || '').replace(/\r/g, '');
  const tarjetas = [];
  for (const m of texto.matchAll(/BEGIN:VCARD([\s\S]*?)END:VCARD/gi)) {
    const bloque = m[1];
    const nombre = desescapaVcard((bloque.match(/^FN[^:\n]*:(.+)$/mi) || [])[1]);
    const telefonos = [...bloque.matchAll(/^(?:item\d+\.)?TEL[^:\n]*:(.+)$/gmi)]
      .map(t => t[1].trim()).filter(Boolean);
    if (nombre || telefonos.length) tarjetas.push({ nombre: nombre || 'Contacto', telefonos });
  }
  if (!tarjetas.length) {
    const nombre = texto.split('\n').map(l => l.trim()).find(Boolean);
    if (nombre) tarjetas.push({ nombre, telefonos: [] });
  }
  return tarjetas;
}
// ---- Ubicación y contacto: fin de las piezas puras

const CLAVE_LUGARES = 'dcarela_lugares_v1';
function lugaresGuardados(){
  try {
    const l = JSON.parse(localStorage.getItem(CLAVE_LUGARES) || '[]');
    return Array.isArray(l) ? l.filter(x => x && coordenadasValidas(x.lat, x.lng)).slice(0, 6) : [];
  } catch (error) { return []; }
}
function recuerdaLugar(lugar){
  try {
    const otros = lugaresGuardados().filter(x => !(x.lat === lugar.lat && x.lng === lugar.lng));
    localStorage.setItem(CLAVE_LUGARES, JSON.stringify([lugar, ...otros].slice(0, 6)));
  } catch (error) { /* sin almacenamiento: se manda igual, solo no queda recordado */ }
}

function abreEnviarUbicacion(c){
  if (!c) return;
  const lugares = lugaresGuardados();
  abreModal('<div class="mtapa"><b>Enviar ubicación · ' + esc(nombreDe(c)) + '</b>'
    + '<button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo">'
    + (lugares.length
        ? '<div class="pdfs" style="margin-bottom:12px">'
          + lugares.map((l, i) => '<button class="tplchip" data-lugar="' + i + '">' + esc(l.name || l.address || l.lat + ', ' + l.lng) + '</button>').join('')
          + '</div>'
        : '')
    + '<div class="campo"><label>Enlace de Google Maps o coordenadas</label>'
    +   '<input id="ubEnlace" placeholder="Pega el enlace largo, o 18.4861, -69.9312" autocomplete="off">'
    +   '<div class="ayuda" id="ubAyuda"></div></div>'
    + '<div class="campo"><label>Nombre del lugar</label><input id="ubNombre" maxlength="100" placeholder="Ej. Estudio D\' Carela"></div>'
    + '<div class="campo"><label>Dirección</label><input id="ubDireccion" maxlength="200"></div>'
    + '<div class="fila2">'
    +   '<div class="campo"><label>Latitud</label><input id="ubLat" inputmode="decimal" autocomplete="off"></div>'
    +   '<div class="campo"><label>Longitud</label><input id="ubLng" inputmode="decimal" autocomplete="off"></div>'
    + '</div>'
    + '<a id="ubVer" class="ayuda" target="_blank" rel="noopener" hidden>Ver en el mapa</a>'
    + '<label class="checkrow" style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12.5px">'
    +   '<input type="checkbox" id="ubRecordar" checked> Recordar este lugar para la próxima vez</label>'
    + '</div>'
    + '<div class="mpatas"><button class="btn-linea" data-cerrar>Cancelar</button>'
    +   '<button class="btn-solido" id="ubEnviar">Enviar</button></div>');
  const lat = $('ubLat'), lng = $('ubLng'), ayuda = $('ubAyuda'), ver = $('ubVer');
  const actual = () => ({ lat: numeroDeCampo(lat.value), lng: numeroDeCampo(lng.value) });
  const refresca = () => {
    const p = actual();
    const ok = coordenadasValidas(p.lat, p.lng);
    ver.hidden = !ok;
    if (ok) ver.href = urlDeMapa(p.lat, p.lng);
  };
  $('ubEnlace').oninput = ev => {
    const texto = ev.target.value.trim();
    if (!texto) { ayuda.textContent = ''; return; }
    const p = coordenadasDeTexto(texto);
    if (p) { lat.value = p.lat; lng.value = p.lng; ayuda.textContent = 'Coordenadas encontradas.'; }
    else ayuda.textContent = /goo\.gl|maps\.app/i.test(texto)
      ? 'Ese enlace corto no trae las coordenadas. Ábrelo y copia el enlace largo, o pega aquí las coordenadas.'
      : 'No encuentro coordenadas ahí. Pega el enlace largo de Google Maps o escribe latitud y longitud abajo.';
    refresca();
  };
  lat.oninput = lng.oninput = refresca;
  document.querySelectorAll('#modal [data-lugar]').forEach(b => {
    b.onclick = () => {
      const l = lugares[Number(b.dataset.lugar)];
      if (!l) return;
      $('ubNombre').value = l.name || ''; $('ubDireccion').value = l.address || '';
      lat.value = l.lat; lng.value = l.lng; ayuda.textContent = ''; refresca();
    };
  });
  $('ubEnlace').focus();
  $('ubEnviar').onclick = async ev => {
    const p = actual();
    if (!coordenadasValidas(p.lat, p.lng)) {
      return avisa('Faltan las coordenadas', 'Pega un enlace de Google Maps o escribe latitud y longitud (ej. 18.4861 y -69.9312).');
    }
    const lugar = { lat: p.lat, lng: p.lng, name: $('ubNombre').value.trim(), address: $('ubDireccion').value.trim() };
    const boton = ev.currentTarget; boton.disabled = true;
    const conv = c.id || c._id;
    const r = await llama({ action:'bridgeQueue', conversation_id: conv, location: lugar });
    boton.disabled = false;
    if (!r.ok) return avisa('No se pudo enviar', traduceErrorMeta(r.error, r.code));
    if ($('ubRecordar').checked) recuerdaLugar(lugar);
    cierraModal();
    apuntaEnviando({ conv, tipo:'location', body: [lugar.name || lugar.address, lugar.lat + ',' + lugar.lng].filter(Boolean).join('\n') });
  };
}

function abreEnviarContacto(c){
  if (!c) return;
  // CONVS ya deja fuera las ignoradas y las de lineas ocultas: no se le ofrece a nadie la
  // tarjeta de la familia ni la de un numero que se dejo de usar.
  const candidatos = CONVS.filter(x => x.wa_phone);
  abreModal('<div class="mtapa"><b>Enviar contacto · ' + esc(nombreDe(c)) + '</b>'
    + '<button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo">'
    + '<div class="campo"><label>Buscar entre tus contactos</label>'
    +   '<input id="tcBusca" placeholder="Nombre o número" autocomplete="off"></div>'
    + '<div class="lista-elegir" id="tcLista"></div>'
    + '<div class="campo"><label>Nombre</label><input id="tcNombre" maxlength="100"></div>'
    + '<div class="campo"><label>Teléfono</label><input id="tcTel" inputmode="tel" placeholder="Con código de país, ej. 1 809 555 0100" autocomplete="off"></div>'
    + '<div class="ayuda">Al cliente le llega la tarjeta de contacto de WhatsApp, con el botón para escribirle.</div>'
    + '</div>'
    + '<div class="mpatas"><button class="btn-linea" data-cerrar>Cancelar</button>'
    +   '<button class="btn-solido" id="tcEnviar">Enviar</button></div>');
  const lista = $('tcLista');
  const pintaLista = () => {
    const q = $('tcBusca').value.trim();
    const hallados = (q ? candidatos.filter(x => coincideContacto(x, q)) : candidatos).slice(0, 6);
    lista.innerHTML = hallados.map((x, i) => '<button class="elegir" data-i="' + i + '"><b>' + esc(nombreDe(x))
      + '</b><span>+' + esc(x.wa_phone) + '</span></button>').join('')
      || '<div class="ayuda">Nadie coincide. Escribe el nombre y el número abajo.</div>';
    lista.querySelectorAll('.elegir').forEach(b => {
      b.onclick = () => {
        const x = hallados[Number(b.dataset.i)];
        $('tcNombre').value = nombreReal(x) || x.display_name || '';
        $('tcTel').value = '+' + x.wa_phone;
      };
    });
  };
  $('tcBusca').oninput = pintaLista;
  pintaLista();
  $('tcBusca').focus();
  $('tcEnviar').onclick = async ev => {
    const nombre = $('tcNombre').value.trim();
    const digitos = $('tcTel').value.replace(/[^0-9]/g, '');

    if (!/^[0-9]{7,15}$/.test(digitos)) { $('tcTel').focus(); return avisa('Teléfono no válido', 'Escríbelo con el código de país, de 7 a 15 números.'); }
    const boton = ev.currentTarget; boton.disabled = true;
    const conv = c.id || c._id;
    const r = await llama({ action:'bridgeQueue', conversation_id: conv, contact: { name: nombre, phone: digitos } });
    boton.disabled = false;
    if (!r.ok) return avisa('No se pudo enviar', traduceErrorMeta(r.error, r.code));
    cierraModal();
    apuntaEnviando({ conv, tipo:'contact', body: nombre + '\nBEGIN:VCARD\nFN:' + nombre + '\nTEL:+' + digitos + '\nEND:VCARD' });
  };
}

function abreRecordatorio(c){
  if (!c) return;
  const en = h => { const d = new Date(Date.now() + h*3600000); d.setMinutes(0,0,0); return d; };
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  abreModal('<div class="mtapa"><b>Recordatorio · ' + esc(nombreDe(c)) + '</b>'
    + '<button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo">'
    + '<div class="pdfs" style="margin-bottom:12px">'
    +   '<button class="tplchip" data-en="4">En 4 horas</button>'
    +   '<button class="tplchip" data-en="24">Mañana</button>'
    +   '<button class="tplchip" data-en="72">En 3 días</button>'
    +   '<button class="tplchip" data-en="168">En una semana</button>'
    + '</div>'
    + '<div class="campo"><label>Cuándo</label>'
    +   '<input type="datetime-local" id="recCuando" value="' + iso(en(24)) + '"></div>'
    + '<div class="campo"><label>Para acordarme de…</label>'
    +   '<textarea id="recNota" rows="2" placeholder="Ej. confirmar si consiguió la fecha">'
    +   esc(c.next_step_suggested || '') + '</textarea></div>'
    + '<div class="checkrow" style="display:flex;gap:8px;align-items:flex-start;margin-bottom:10px">'
    +   '<input type="checkbox" id="recEnviar2" style="width:auto;margin-top:3px">'
    +   '<label for="recEnviar2" style="text-transform:none;letter-spacing:0;font-size:12.5px;'
    +     'font-weight:400;color:var(--mut)">Además, prepararle un mensaje al cliente para ese día '
    +     '<b>(no sale solo: llegado el momento aparece aquí para revisarlo y enviarlo)</b></label>'
    + '</div>'
    + '<div class="campo" id="recMsgCampo" hidden><label>Mensaje</label>'
    +   '<textarea id="recMensaje" rows="3" placeholder="Hola {nombre}, ¿pudiste ver lo que te mandé?"></textarea>'
    // La ventana de 24 h solo existe en el numero oficial. Por WhatsApp Web el mensaje sale
    // como desde el telefono, y decir ahi "hace falta plantilla aprobada" es mandar a buscar
    // algo que no existe en ese canal.
    +   (esOficial(c)
        ? '<p class="aviso" style="margin:6px 0 0">Si han pasado más de 24 h desde su último mensaje, '
          + 'solo llegará con plantilla aprobada. Se avisará entonces.</p>'
        : redSocial(c)
          ? '<p class="aviso" style="margin:6px 0 0">Si han pasado más de 24 h desde su último mensaje, '
            + 'se intentará por atención humana, que ' + redSocial(c) + ' permite hasta 7 días.</p>'
          : '<p class="aviso" style="margin:6px 0 0">Sale por WhatsApp Web: texto libre, sin ventana '
            + 'de 24 horas ni plantillas.</p>')
    + '</div>'
    + '</div>'
    + '<div class="mpatas"><button class="btn-linea" data-cerrar>Cancelar</button>'
    +   '<button class="btn-solido" id="recGuardar">Guardar recordatorio</button></div>');
  $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });
  $('modal').querySelector('.pdfs').onclick = ev => {
    const b = ev.target.closest('[data-en]'); if (!b) return;
    $('recCuando').value = iso(en(Number(b.dataset.en)));
  };
  $('recEnviar2').onchange = ev => { $('recMsgCampo').hidden = !ev.target.checked; };
  $('recGuardar').onclick = async () => {
    const cuando = $('recCuando').value;
    if (!cuando) return avisa('Falta la fecha');
    const campos = {
      follow_up_at: new Date(cuando).toISOString(),
      next_step_suggested: $('recNota').value.trim() || c.next_step_suggested || '',
    };
    // El mensaje se guarda como borrador en la ficha, no se programa un envio ciego.
    // Un mensaje que sale solo dentro de tres dias puede llegar cuando ya no aplica.
    if ($('recEnviar2').checked && $('recMensaje').value.trim()) {
      campos.pending_questions = $('recMensaje').value.trim();
    }
    $('recGuardar').disabled = true;
    const r = await llama({ action:'updateLead', conversation_id: c.id || c._id, fields: campos });
    $('recGuardar').disabled = false;
    if (!r.ok) return avisa('No se pudo guardar', r.error);
    Object.assign(c, campos);
    cierraModal();
    avisa('Recordatorio guardado', new Date(cuando).toLocaleString('es-DO', { dateStyle:'medium', timeStyle:'short' }));
    if (vistaActual === 'reminders') pintaRecordatorios();
  };
}

/* ---- Etiquetas manuales -------------------------------------------------- */
// Van en el campo 'labels' de la conversacion, que updateLead ya permite escribir. No
// hay catalogo aparte a proposito: una etiqueta existe porque alguien la escribio en
// algun contacto, y las sugerencias salen de lo que ya se usa. Un catalogo separado se
// llena de etiquetas muertas que nadie borra.
function etiquetasDe(c){
  const v = c?.labels;
  if (Array.isArray(v)) return v.map(String).filter(Boolean);
  if (typeof v === 'string' && v.trim()) return v.split(',').map(s => s.trim()).filter(Boolean);
  return [];
}
// Por USO, no por alfabeto. El orden alfabetico hacia inservibles las sugerencias de la
// ficha: solo caben ocho, y siempre salian las mismas ocho del principio del abecedario
// --24_septiembre, 8_anos, abierto, agosto-- mientras las que el equipo escribe de verdad
// no aparecian jamas. Se cuentan solo las conversaciones VISIBLES, para que el numero que
// pinta el filtro sea el mismo que se ve al pulsarlo.
function etiquetasContadas(){
  const cuenta = new Map();
  // CONVS ya son solo las visibles (recalculaVisibles): una etiqueta que contara las de una linea
  // oculta diria 2 en el filtro y abriria 1.
  CONVS
    .forEach(c => etiquetasDe(c).forEach(e => cuenta.set(e, (cuenta.get(e) || 0) + 1)));
  return [...cuenta.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
function etiquetasEnUso(){
  return etiquetasContadas().map(([e]) => e);
}
// Las de la barra las elige el negocio en Configuracion, y por eso viven en el servidor y
// no en localStorage: si cada persona tuviera las suyas, dos personas mirando el mismo CRM
// verian filtros distintos y ninguna sabria por que. Vacio significa automatico.
function etiquetasElegidas(){
  return String(AJUSTES.etiquetas_filtro || '').split(',').map(s => s.trim()).filter(Boolean);
}
// Las que la barra enseña AHORA, haya lista elegida o no. La calculaban por separado el
// pintado y el manejador de la x, en ambitos distintos: el segundo no veia la variable del
// primero y quitar una etiqueta en modo automatico reventaba. Una sola fuente para los dos.
function etiquetasEnLaBarra(){
  const elegidas = etiquetasElegidas();
  return elegidas.length
    ? elegidas
    : etiquetasContadas().filter(([, n]) => n >= 2).slice(0, 8).map(([e]) => e);
}

// El recuadro del boton +. Elegir que etiquetas se ven estaba solo en Configuracion, a cuatro
// clics de donde se usan: quien esta filtrando mira la barra, no los ajustes. Es la misma
// lista y el mismo ajuste del servidor -- no una copia local -- asi que lo que se marque aqui
// se ve igual en Configuracion y para todo el equipo.
function abreEtiquetasBarra(){
  const todas = etiquetasContadas();
  const elegidas = new Set(etiquetasElegidas());
  if (!todas.length) {
    return avisa('Todavía no hay etiquetas', 'Se crean solas al etiquetar conversaciones.');
  }
  abreModal('<div class="mtapa"><b>Etiquetas de la barra</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo">'
    + '<p class="aviso">Marca las que quieres ver arriba. El número es en cuántas '
    +   'conversaciones está cada una. Si no marcas ninguna, la barra enseña sola las más usadas.</p>'
    + '<div class="etqlista">' + todas.map(([e, n]) =>
        '<label class="etqop"><input type="checkbox" value="' + esc(e) + '"'
        + (elegidas.has(e) ? ' checked' : '') + '> <span>' + esc(e) + '</span>'
        + '<b>' + n + '</b></label>').join('')
    + '</div></div>'
    + '<div class="mpatas"><span class="quien" id="etqNota"></span>'
    +   '<button class="btn-solido" id="etqGuardar">Guardar</button></div>');
  $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });
  $('etqGuardar').onclick = async () => {
    const marcadas = [...$('modal').querySelectorAll('.etqlista input:checked')].map(i => i.value);
    const boton = $('etqGuardar');
    boton.disabled = true;
    const ok = await guardaAjuste('etiquetas_filtro', marcadas.join(','));
    boton.disabled = false;
    // Solo se cierra si guardo. Cerrar pase lo que pase es lo que hizo creer que las reglas
    // del negocio se habian guardado cuando no.
    if (!ok) return;
    if (filtro.startsWith('etq:') && marcadas.length && !marcadas.includes(filtro.slice(4))) filtro = 'todos';
    cierraModal();
    pintaChats();
    avisa('Barra actualizada', marcadas.length
      ? marcadas.length + ' etiqueta(s) en la barra.'
      : 'Sin ninguna elegida: la barra vuelve a enseñar sola las más usadas.');
  };
}

// Historial del lead y sus archivos, juntos y fuera del hilo. Los adjuntos salen de los
// mensajes que ya estan cargados --no hace falta otra consulta-- y los eventos de la tabla
// que ya los guarda.
async function cableaHistorial(c){
  const caja = $('fichaHistorial'); if (!caja) return;
  const idConv = c.id || c._id;
  // Se consulta por conversacion en vez de filtrar MSGS. abre() llama a pintaFicha ANTES de
  // escuchaMensajes, asi que aqui MSGS todavia tiene los mensajes del cliente ANTERIOR: la
  // ficha de una clienta listaba las fotos y el comprobante de pago de otra, con enlaces que
  // se abren de verdad. Y en el primer chat tras cargar la pagina, MSGS esta vacio y decia
  // "no ha mandado archivos" aunque hubiera veinte.
  let archivos = [];
  try {
    // Los mas recientes, con el mismo respaldo que el hilo si el indice aun no existe.
    const filtros = [where('business_id','==',NEGOCIO), where('conversation_id','==', idConv)];
    let sm;
    try { sm = await getDocs(query(collection(db,'crm_messages'), ...filtros, orderBy('created_at','desc'), limit(400))); }
    catch (e) {
      if (e?.code !== 'failed-precondition') throw e;
      sm = await getDocs(query(collection(db,'crm_messages'), ...filtros, limit(400)));
    }
    archivos = sm.docs.map(d => d.data())
      .filter(m => m.media_url || (m.msg_type && m.msg_type !== 'text'))
      .sort((a,b) => String(b.created_at||'').localeCompare(String(a.created_at||'')));
  } catch (e) { archivos = null; }
  let eventos = [];
  try {
    const q = query(collection(db,'timeline_events'), where('conversation_id','==', idConv), limit(60));
    const s = await getDocs(q);
    eventos = s.docs.map(d => d.data())
      .sort((a,b) => String(b.created_at||'').localeCompare(String(a.created_at||'')));
  } catch (e) { /* sin historial se sigue: los archivos si valen por si solos */ }

  // Vacio y roto no se enseñan igual: "no ha mandado archivos" cuando en realidad no se
  // pudo consultar es la clase de mentira que hace buscar el fallo en otro sitio.
  //
  // Foto/sticker/video van en una galeria visual, como el panel de info de WhatsApp Web --
  // antes esto era una lista con la fecha y un enlace que en la linea de WhatsApp Web decia
  // siempre "sin enlace", porque ahi los archivos son bajo demanda y nunca tuvieron media_url.
  // Documento y nota de voz se quedan en la lista de texto, que para eso les basta.
  const esVisual = m => ['image', 'video', 'sticker'].includes(tipoRealMedio(m, adjuntoDe(m)));
  const visuales = archivos === null ? [] : archivos.filter(esVisual);
  const otros = archivos === null ? [] : archivos.filter(m => !esVisual(m));
  const celdaGaleria = m => {
    const a = adjuntoDe(m);
    if (esBajoDemanda(m)) return tarjetaBajoDemanda(m, a, 'Archivo');
    if (!a.url) return '<div class="mthumb" style="display:flex;align-items:center;'
      + 'justify-content:center;color:var(--mut);font-size:10px;text-align:center;padding:4px">'
      + 'sin archivo</div>';
    // El video no se pinta como <video>: sin poster sale en negro (ya paso una vez con
    // Estados) y aqui la casilla es demasiado chica para que valga la pena resolverlo.
    // Un enlace directo abre el video de verdad, solo que en pestaña nueva.
    if (tipoRealMedio(m, a) === 'video') return '<a class="mthumb" href="' + esc(a.url) + '" target="_blank" '
      + 'rel="noopener" style="display:flex;align-items:center;justify-content:center;font-size:26px">▶</a>';
    return '<button class="mthumb" data-vergaleria="' + esc(a.url) + '" title="Ver">'
      + '<img src="' + esc(a.url) + '" alt="archivo" loading="lazy"></button>';
  };
  const bloqueGaleria = archivos === null
    ? '<p class="quien">No se pudieron consultar los archivos.</p>'
    : visuales.length
      ? '<div class="ficha-galeria">' + visuales.slice(0, 30).map(celdaGaleria).join('') + '</div>'
      : '<p class="quien">No ha mandado fotos ni videos.</p>';
  const bloqueOtros = archivos === null ? '' : otros.length
      ? otros.slice(0, 40).map(m => '<div class="dato"><div class="k">' + esc(hora(m.created_at)) + '</div>'
          + '<div class="v">' + (m.media_url
              ? '<a href="' + esc(m.media_url) + '" target="_blank" rel="noopener">'
                + esc(m.msg_type || 'archivo') + '</a>'
              : esBajoDemanda(m) ? esc(m.msg_type || 'archivo') + ' · pedir «Ver» en el chat'
              : esc(m.msg_type || 'archivo') + ' · sin enlace') + '</div></div>').join('')
      : '<p class="quien">Sin documentos ni notas de voz.</p>';
  const bloqueEventos = eventos.length
    ? eventos.slice(0, 40).map(e => '<div class="dato"><div class="k">' + esc(hora(e.created_at)) + '</div>'
        + '<div class="v">' + esc(e.title || e.event_type || 'movimiento') + '</div></div>').join('')
    : '<p class="quien">Sin movimientos registrados.</p>';
  caja.innerHTML = '<div class="seccion" style="margin:0 0 6px">Fotos y videos</div>' + bloqueGaleria
    + '<div class="seccion" style="margin:14px 0 6px">Documentos y notas de voz</div>' + bloqueOtros
    + '<div class="seccion" style="margin:14px 0 6px">Movimientos</div>' + bloqueEventos;
  // Las tarjetas bajo demanda de la galeria son las mismas de tarjetaBajoDemanda(): las
  // cablea la misma funcion que ya cablea las del hilo (no vuelve a atar las que ya lo estan).
  cableaBajoDemanda();
  caja.querySelectorAll('[data-vergaleria]').forEach(b => {
    if (b.dataset.listo) return;
    b.dataset.listo = '1';
    b.onclick = () => muestraLupa('img', b.dataset.vergaleria);
  });
}

// Las notas se leen directas de Firestore, como el resto de v2, y se escriben por el
// servidor: addNote deja rastro en la auditoria y deleteNote comprueba el permiso. Escribir
// directo desde el navegador saltaria las dos cosas.
async function cableaNotas(c){
  const lista = $('notasLista'); if (!lista) return;
  const pinta = async () => {
    lista.innerHTML = '<p class="quien">Cargando…</p>';
    let notas = [];
    try {
      const q = query(collection(db,'crm_notes'), where('business_id','==',NEGOCIO),
        where('conversation_id','==', c.id || c._id), limit(50));
      const s = await getDocs(q);
      notas = s.docs.map(d => ({ ...d.data(), _id: d.id }))
        .sort((a,b) => String(b.created_at||'').localeCompare(String(a.created_at||'')));
    } catch (e) { lista.innerHTML = '<p class="quien">No se pudieron leer las notas.</p>'; return; }
    if (!notas.length) { lista.innerHTML = '<p class="quien">Todavía no hay ninguna.</p>'; return; }
    lista.innerHTML = notas.map(n => '<div class="dato" data-nota="' + esc(n._id) + '">'
      + '<div class="k">' + esc(hora(n.created_at)) + '</div>'
      + '<div class="v">' + esc(n.body || '') + '</div>'
      + '<button class="nx" data-borra-nota="' + esc(n._id) + '" aria-label="Borrar nota">×</button></div>').join('');
  };
  await pinta();

  $('notaGuarda').onclick = async () => {
    const caja = $('notaNueva'); const texto = (caja.value || '').trim();
    if (!texto) return;
    const b = $('notaGuarda'); b.disabled = true;
    const r = await llama({ action:'addNote', conversation_id: c.id || c._id, body: texto });
    b.disabled = false;
    if (!r.ok) return avisa('No se pudo guardar', r.error);
    caja.value = ''; await pinta();
  };
  lista.onclick = async ev => {
    const b = ev.target.closest('[data-borra-nota]'); if (!b) return;
    if (!await confirmaAqui('¿Borrar esta nota? No se puede deshacer.')) return;
    const r = await llama({ action:'deleteNote', note_id: b.dataset.borraNota });
    if (!r.ok) return avisa('No se pudo borrar', r.error);
    await pinta();
  };
}

function cableaEtiquetas(c){
  const caja = $('etiquetas'); if (!caja) return;
  const pinta = () => {
    const mias = etiquetasDe(c);
    const sugeridas = etiquetasEnUso().filter(e => !mias.includes(e)).slice(0, 8);
    caja.innerHTML = mias.map(e => '<span class="etq puesta">' + esc(e)
        + '<button data-quita-etq="' + esc(e) + '" aria-label="Quitar">×</button></span>').join('')
      + sugeridas.map(e => '<button class="etq sug" data-pon-etq="' + esc(e) + '">+ ' + esc(e) + '</button>').join('')
      + (mias.length || sugeridas.length ? '' : '<span class="quien">Todavía no hay ninguna.</span>');
  };
  pinta();

  const guarda = async lista => {
    const antes = etiquetasDe(c);
    c.labels = lista;
    pinta();
    const r = await llama({ action:'updateLead', conversation_id: c.id || c._id, fields:{ labels: lista } });
    if (!r.ok) { c.labels = antes; pinta(); return avisa('No se guardó la etiqueta', r.error); }
    pintaChats();
  };

  caja.onclick = ev => {
    const quita = ev.target.closest('[data-quita-etq]');
    if (quita) return guarda(etiquetasDe(c).filter(e => e !== quita.dataset.quitaEtq));
    const pon = ev.target.closest('[data-pon-etq]');
    if (pon) return guarda([...etiquetasDe(c), pon.dataset.ponEtq]);
  };
  $('etqNueva').onkeydown = ev => {
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    const e = ev.target.value.trim().toLowerCase();
    if (!e) return;
    if (etiquetasDe(c).includes(e)) { ev.target.value = ''; return; }
    ev.target.value = '';
    guarda([...etiquetasDe(c), e]);
  };
}

// Un chat de verdad con el asistente del CRM. Hasta el 22/09/2026 todo lo que se escribia
// aqui pasaba por un contrato de "plan" (assistantPlan): un "hola" volvia como una tarjeta con
// titular y una seccion "Riesgos" en naranja, y el dueño lo leia como un error. Ahora:
//   - el asistente contesta en texto (assistantChat) y lee fichas y mensajes EN EL SERVIDOR;
//   - lo que cambia datos llega como PROPUESTA y solo se aplica al aprobarla (assistantDecide),
//     tambien en el servidor, con la misma logica que ya usaban los botones del panel;
//   - cada persona tiene varios hilos, cada uno general o de UN contacto. El contacto lo define
//     el hilo, no el ultimo chat abierto: la variable global `sel` ya no se lee aqui;
//   - un error se enseña con "Reintentar" y NO se guarda como turno ni vuelve al modelo.
const PLAN_IMGS = [];
let REGLAS = '';

function pintaPlanCola(){
  const c = $('planCola'); if (!c) return;
  c.hidden = !PLAN_IMGS.length;
  c.innerHTML = PLAN_IMGS.map((a,i) => '<span class="pieza">'
    + (String(a.mime).startsWith('image/')
      ? '<img src="data:' + esc(a.mime) + ';base64,' + a.datos + '" alt="">'
      : '<span class="pdoc">PDF</span>')

}

// Las reglas viven en el servidor, no en el navegador: son del negocio, no de quien
// esta sentado delante. Si viven en localStorage, cada persona tiene las suyas y el
// asistente contesta distinto segun quien pregunte. El servidor las lee en cada turno.
async function cargaReglas(){
  const r = await llama({ action:'data', table:'settings', operation:'select',
    filters:[{ kind:'eq', field:'key', value:'reglas_asistente' }], limit:1 });
  // Devuelve si se pudo LEER. Quien abre el dialogo necesita saberlo: guardar sin haber
  // leido escribe encima de lo que hubiera.
  if (!r.ok) return false;
  const fila = (r.data || r.rows || [])[0];
  REGLAS = fila?.value || '';
  const caja = $('reglas'); if (caja) caja.value = REGLAS;
  const nota = $('reglasNota');
  if (nota) nota.textContent = REGLAS ? 'Guardadas. Se usan en cada respuesta.' : 'Todavía no hay reglas.';
  return true;
}
async function guardaReglas(){
  const valor = $('reglas').value.trim();
  $('btnReglas').disabled = true;
  const r = await llama({ action:'data', table:'settings', operation:'upsert',
    payload:{ id:'reglas_asistente', key:'reglas_asistente', value:valor,
      updated_at:new Date().toISOString() }, on_conflict:'id' });
  $('btnReglas').disabled = false;
  if (!r.ok) { avisa('No se pudieron guardar', r.error); return false; }
  REGLAS = valor;
  $('reglasNota').textContent = 'Guardadas. Se usan en cada respuesta.';
  avisa('Reglas guardadas', 'El asistente las tendrá en cuenta desde ahora.');
  return true;
}

// ---- Asistente: piezas puras (se prueban sueltas en test/v2-asistente-conversacion.test.js)
// La frase de confirmacion se compara sin mayusculas, sin tildes y sin espacios. Antes era
// exacta, y "desactivar contacto" daba "cancelado" sin decir por que. Sigue haciendo falta
// escribirla; al servidor llega siempre la frase exacta, no lo tecleado.
function fraseCoincide(escrito, frase){
  const n = v => String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '').toUpperCase();
  return !!n(escrito) && n(escrito) === n(frase);
}

function nuevoIdTurno(){
  try {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return 't' + crypto.randomUUID().replace(/-/g, '').slice(0, 24);
  } catch (e) { /* sin crypto se usa el respaldo */ }
  return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
}

// Errores del asistente con traduccion PROPIA. Pasaban por traduceErrorMeta, que es de los
// envios de WhatsApp: un fallo de Google con un "24" en el texto se leia como "pasaron mas de
// 24 h, usa una plantilla". Aqui se decide por el estado HTTP y el codigo del servidor, y el
// codigo del proveedor se enseña tal cual para poder buscarlo en el registro.
function traduceErrorAsistente(r){
  const status = Number(r?.status) || 0;
  const code = String(r?.code || '');
  const prov = String(r?.provider_code || '');
  const cola = prov ? ' (código del proveedor: ' + prov + ')' : '';
  const servidor = String(r?.error || '').trim();
  if (r?.abortado) return { titulo:'Detenido', texto:'Paraste la respuesta. Tu mensaje no se perdió: puedes reintentarlo.', reintentar:true };
  if (r?.tiempo) return { titulo:'Tardó demasiado', texto:'El asistente no respondió en 90 segundos. Reintenta; si ya había contestado, se recupera esa respuesta.', reintentar:true };
  if (r?.red) return { titulo:'Sin conexión', texto:'No se pudo hablar con el servidor. Revisa internet y reintenta.', reintentar:true };
  if (status === 401) return { titulo:'Sesión caducada', texto:'Vuelve a entrar al panel y reintenta.', reintentar:true };
  if (status === 403) return { titulo:'Sin permiso', texto:(servidor || 'Tu usuario no tiene permiso para esto.'), reintentar:false };
  if (status === 429 || code === 'ia_limite' || code === 'asistente_por_minuto' || code === 'asistente_tope_diario' || /RESOURCE_EXHAUSTED/.test(prov)) {
    return { titulo:'Límite del asistente', texto:(servidor || 'Se alcanzó el límite de uso de la IA.') + cola, reintentar: code !== 'asistente_tope_diario' };
  }
  if (code === 'ia_sin_clave' || code === 'ia_clave') return { titulo:'IA no configurada', texto:(servidor || 'Google AI no está configurado en el servidor.') + cola, reintentar:false };
  if (status === 502 || status === 503 || status === 504 || code.startsWith('ia_')) {
    return { titulo:'Google no respondió', texto:(servidor || 'El proveedor de IA no respondió.') + cola, reintentar: r?.retryable !== false };
  }
  if (status === 404) return { titulo:'No encontrado', texto: servidor || 'Esa conversación del asistente ya no existe.', reintentar:false };
  if (status === 409) return { titulo:'No se pudo', texto: servidor || 'Ese cambio ya no se puede hacer así.', reintentar:false };
  return { titulo:'No se pudo responder', texto:(servidor || 'Error ' + (status || 'desconocido')) + cola, reintentar:true };
}

// Formato minimo y seguro para el texto del asistente: primero se escapa TODO y despues se
// ponen las pocas marcas permitidas (parrafos, listas, **negrita**). El texto viene de un
// modelo que lee mensajes de clientes, y nada de eso puede acabar convertido en HTML.
function formatoSeguro(texto){
  const negritas = s => s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  let html = '', lista = '';
  for (const linea of esc(texto).split('\n')) {
    const vineta = linea.match(/^\s*[-•*]\s+(.*)$/);
    const numero = linea.match(/^\s*\d+[.)]\s+(.*)$/);
    const tipo = vineta ? 'ul' : numero ? 'ol' : '';
    if (lista && tipo !== lista) { html += '</' + lista + '>'; lista = ''; }
    if (tipo) {
      if (!lista) { html += '<' + tipo + '>'; lista = tipo; }
      html += '<li>' + negritas((vineta || numero)[1]) + '</li>';
      continue;
    }
    if (linea.trim()) html += '<p>' + negritas(linea) + '</p>';
  }
  if (lista) html += '</' + lista + '>';
  return html;
}

// Busca en las conversaciones que ya estan en memoria (CONVS): nombre, telefono, ultimos 4
// digitos o etiqueta. Sin llamada al servidor: el selector responde al teclear.
// El selector de contacto del asistente. Usa el mismo criterio que la bandeja
// (coincideContacto): antes tenía el suyo, y no encontraba a nadie por su nombre en la caja.
function filtraContactos(lista, q){
  if (!String(q || '').trim()) return lista.slice(0, 30);
  return lista.filter(c => coincideContacto(c, q)).slice(0, 30);
}

function grupoDeFecha(iso, ahoraMs = Date.now()){
  const t = Date.parse(String(iso || ''));
  if (!Number.isFinite(t)) return 'Anteriores';
  const hoy = new Date(ahoraMs); hoy.setHours(0, 0, 0, 0);
  const dia = 86400000;
  if (t >= hoy.getTime()) return 'Hoy';
  if (t >= hoy.getTime() - dia) return 'Ayer';
  if (t >= hoy.getTime() - 6 * dia) return 'Últimos 7 días';
  return 'Anteriores';
}

// Enter envia; Shift+Enter hace salto de linea. Con un metodo de entrada que compone (tildes
// muertas, teclados de movil, dictado) el Enter que confirma la composicion NO es un envio.
function teclaPedido(e, enviar){
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return false;
  e.preventDefault();
  enviar();
  return true;
}

function convPorId(id){
  const k = String(id ?? '');
  if (!k) return null;
  const igual = x => String(x.id) === k || String(x._id) === k;
  // CONVS_REDES tambien: mientras Instagram y Messenger estan ocultos, sus fichas salen de
  // CONVS y viven SOLO en ese cubo. Sin mirarlo, el asistente decia "No encuentro ese chat" de
  // un contacto que existe, y un borrador aprobado sobre el se perdia. buscaConv ya los mira
  // los cuatro; esta se habia quedado en tres.
  return CONVS.find(igual) || CONVS_OCULTAS.find(igual)
    || CONVS_REDES.find(igual) || CONVS_IGNORADAS.find(igual) || null;
}
function etiquetaDe(c){
  return nombreDe(c) + (c?.wa_phone && nombreReal(c) ? ' (+' + c.wa_phone + ')' : '');
}
