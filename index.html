  if (reintentoMsgs) { clearTimeout(reintentoMsgs); reintentoMsgs = null; }
}
function aplicaMensajes(s, idConv){
  if (!sel || (sel.id !== idConv && sel._id !== idConv)) return;
  msgsDesdeServidor = s?.metadata?.fromCache !== true;
  MSGS = s.docs.map(d => ({ ...d.data(), _id:d.id }))
    .sort((a,b) => instanteMsg(a) - instanteMsg(b));
  actualizaEstadoSincronizacion();

async function sondeaMensajes(idConv){
  if (escuchaMsgId !== idConv) return;
  const base = [where('business_id','==',NEGOCIO), where('conversation_id','==',idConv)];
  try {
    let s;
    try { s = await getDocs(query(collection(db,'crm_messages'), ...base, orderBy('created_at','desc'), limit(400))); }
    catch (error) {
      if (error?.code !== 'failed-precondition') throw error;
      s = await getDocs(query(collection(db,'crm_messages'), ...base, limit(400)));
    }
    aplicaMensajes(s, idConv);
  } catch (error) {
    msgsDesdeServidor = false;
    actualizaEstadoSincronizacion();
    const cont = $('mensajes');
    if (cont && !MSGS.length) cont.innerHTML = '<div style="margin:auto;max-width:340px;text-align:center;color:var(--mut);font-size:13px">'
      + 'Reconectando mensajes…<br><b>' + esc(error?.code || 'sin red') + '</b></div>';
  }
}
function activaRespaldoMsgs(idConv){
  if (!sondeoMsgs) {
    void sondeaMensajes(idConv);
    sondeoMsgs = setInterval(() => { if (!document.hidden) void sondeaMensajes(idConv); }, 5000);
  }
  if (!reintentoMsgs) reintentoMsgs = setTimeout(() => {
    reintentoMsgs = null;
    if (escuchaMsgId === idConv) abreEscuchaMensajes(idConv, false);
  }, 30000);
}
function abreEscuchaMensajes(idConv, esRespaldo){
  if (paraMsgs) { paraMsgs(); paraMsgs = null; }
  const base = [where('business_id','==',NEGOCIO), where('conversation_id','==',idConv)];
  const q = esRespaldo
    ? query(collection(db,'crm_messages'), ...base, limit(400))
    : query(collection(db,'crm_messages'), ...base, orderBy('created_at','desc'), limit(400));
  paraMsgs = onSnapshot(q, { includeMetadataChanges: true }, s => {
    if (s?.metadata?.fromCache === true) activaRespaldoMsgs(idConv);
    else detieneRespaldoMsgs();
    aplicaMensajes(s, idConv);
  }, err => {
    paraMsgs = null;
    msgsDesdeServidor = false;
    actualizaEstadoSincronizacion();
    if (!esRespaldo && err?.code === 'failed-precondition' && escuchaMsgId === idConv) {
      abreEscuchaMensajes(idConv, true);
      return;
    }
    if (escuchaMsgId !== idConv) return;
    activaRespaldoMsgs(idConv);
  });
}
function escuchaMensajes(idConv){
  if (paraMsgs) { paraMsgs(); paraMsgs = null; }
  detieneRespaldoMsgs();
  escuchaMsgId = idConv;
  msgsDesdeServidor = false;
  actualizaEstadoSincronizacion();
  MSGS = [];
  // Los globos de "enviando" son de la conversacion que se deja: al cambiar de chat ya no hay
  // MSGS con que confirmarlos, y arrastrarlos seria enseñar un reloj que no se apaga nunca.
  ENVIANDO = [];
  // business_id va SIEMPRE en la consulta, no solo conversation_id: las reglas de
  // Firestore la rechazan sin el, y el rechazo llega por el callback de error. Sin ese
  // callback la conversacion se quedaba en blanco sin decir nada -- pared beige y cero
  // mensajes, indistinguible de un chat vacio de verdad.
  // Con limit: sin el se descarga la conversacion entera, y hay chats con miles de
  // mensajes. Se traen los ultimos 400, que es mas de lo que nadie sube a leer.
  //
  // Con orderBy. Sin el, limit(400) NO trae los ultimos 400: Firestore ordena por id de
  // documento, y los ids son hashes del wamid, asi que devolvia 400 mensajes al azar de toda
  // la historia. En un chat de mas de 400 mensajes, un mensaje nuevo cuyo hash cayera fuera
  // del corte no aparecia nunca en el hilo, aunque la bandeja si enseñara su vista previa.
  //
  // Esa consulta necesita un indice compuesto. Si todavia no existe, Firestore responde
  // failed-precondition y se cae a la consulta vieja: peor orden, pero el chat se ve.
  abreEscuchaMensajes(idConv, false);
}
document.addEventListener('visibilitychange', () => {

// Version cargada y aviso de que hay otra publicada.
//
// El panel se sirve desde GitHub Pages con Cache-Control: max-age=600, asi que una
// pestaña abierta puede quedarse horas con el HTML viejo. Desde fuera eso es
// indistinguible de un despliegue que fallo: el dueño mira, no ve el cambio, y no hay
// forma de saber cual de las dos cosas paso. Las metaetiquetas del <head> evitan que
// vuelva a cachearse; esto ademas avisa cuando ya hay algo mas nuevo publicado.
let VERSION_CARGADA = '';
async function vigilaVersion(){
  const e = $('version'); if (!e) return;
  let publicada = '';
  try {
    const r = await fetch('./app-version.json?t=' + Date.now(), { cache:'no-store' });
    if (r.ok) publicada = String((await r.json()).version || '');
  } catch (err) { return; }
  if (!publicada) return;
  if (!VERSION_CARGADA) VERSION_CARGADA = publicada;
  e.hidden = false;
  if (publicada === VERSION_CARGADA) {
    e.className = 'version';
    e.textContent = 'v ' + VERSION_CARGADA;
    e.onclick = null;
    return;
  }
  // Recarga saltandose la cache: sin el parametro, el navegador puede devolver el mismo
  // HTML viejo y el aviso se quedaria puesto para siempre.
  e.className = 'version hay';
  e.textContent = 'Hay una versión nueva · pulsa para actualizar';
  e.onclick = () => { location.replace(location.pathname + '?v=' + Date.now() + location.hash); };
}

// ---- Hoy: piezas puras (copia exacta de firebase-functions/src/crm-cola.js; v2-hoy.test.js las compara)
const COLA_HOY = (() => {
  const DIA = 86400000;
  const PESO_ETAPA = Object.freeze({ pendiente_reserva: 5, cotizando: 4, reservado: 3, cliente: 3, interesado: 2, nuevo: 1 });
  const CERRADAS = Object.freeze(['desinteresado', 'perdido', 'cerrado']);
  const ETAPAS_QUE_SE_ENFRIAN = Object.freeze(['cotizando', 'pendiente_reserva', 'interesado']);
  const VENTANA_SIN_RESPONDER_DIAS = 14;
  const ACUSE_DIAS = 2;
  const TOPE = 40;

  // Palabras que, solas, cierran una conversacion y no piden respuesta.
  const CORTESIA = new Set(['gracias', 'muchas', 'mil', 'de', 'nada', 'bendiciones', 'dios', 'le', 'te', 'bendiga', 'igualmente', 'cuidate',
    'amiga', 'amigo', 'hermana', 'hermano', 'recibido', 'entendido', 'hasta', 'luego', 'saludos', 'saludo', 'gracia', 'guidate', 'cuidese', 'bb', 'carino', 'amor', 'mi', 'vida', 'y']);
  // Acuses («ok», «perfecto», «esta bien»). Recien llegados pueden ser el «si» a una pregunta nuestra y se dejan a la vista; con ACUSE_DIAS
  // dias o mas sin que nadie los contestara, lo acordado ya se hizo o se dejo, y seguir listandolos es ruido (asi los veia el dueno).
  const ACUSE = new Set(['ok', 'okey', 'okay', 'oki', 'vale', 'bien', 'bn', 'listo', 'dale', 'perfecto', 'excelente', 'bueno', 'buenisimo', 'ya', 'esta',
    'que', 'ah', 'entiendo', 'claro', 'si', 'sip', 'genial']);
  // Lo que decimos NOSOTROS al cerrar («de nada», «siempre a la orden», «buen dia»): no hay nada que perseguir.
  const CIERRE_NUESTRO = new Set(['siempre', 'a', 'la', 'orden', 'con', 'gusto', 'buen', 'buena', 'buenos', 'buenas', 'dia', 'dias', 'tarde', 'tardes',
    'noche', 'noches', 'para', 'servirle', 'servirte', 'favor', 'no', 'hay', 'de', 'problema', 'placer', 'mucho', 'igual', 'igualmente']);

  const ms = (v) => {
    if (v == null || v === '') return NaN;
    if (typeof v?.toMillis === 'function') return v.toMillis();
    if (typeof v?.seconds === 'number') return v.seconds * 1000;
    return Date.parse(String(v));
  };
  const plano = (t) => String(t == null ? '' : t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const recorte = (t, n) => { const v = String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); return v.length > n ? v.slice(0, n - 1) + '…' : v; };

  const palabrasDe = (texto) => plano(texto).replace(/([a-z])\1{2,}/g, '$1').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();

  // «Gracias», «bendiciones», un emoji suelto, un aviso del sistema («mensaje de WhatsApp recibido», sticker): no hace falta contestar.
  // Con edadDias >= ACUSE_DIAS tambien los acuses («ok», «perfecto», «si»).
  function esCortesia(texto, edadDias) {
    if (/^\s*\[(mensaje de whatsapp recibido|sticker|reaccion)/.test(plano(texto))) return true;
    const limpio = palabrasDe(texto);
    if (!limpio) return true;                      // solo emojis o signos
    const palabras = limpio.split(' ');
    if (palabras.length > 6) return false;
    if (palabras.every((p) => CORTESIA.has(p))) return true;
    return edadDias >= ACUSE_DIAS && palabras.every((p) => CORTESIA.has(p) || ACUSE.has(p));
  }

  // El ultimo mensaje NUESTRO cierra la conversacion (no es una cotizacion ni una pregunta): no se cuenta entre los que «se enfrian».
  function esCierreNuestro(texto) {
    const limpio = palabrasDe(texto);
    if (!limpio) return true;
    const palabras = limpio.split(' ');
    return palabras.length <= 6 && palabras.every((p) => CORTESIA.has(p) || ACUSE.has(p) || CIERRE_NUESTRO.has(p));
  }

  // El dia de La Romana (UTC-4): desde cuando hasta cuando cuenta «hoy» y «manana».
  const inicioDeHoy = (ahora) => Date.parse(new Date(ahora - 4 * 3600000).toISOString().slice(0, 10) + 'T04:00:00Z');

  const nombreDe = (c) => String(c.pos_client_nombre || c.customer_name || c.contact_name || '').trim().slice(0, 40) || 'Sin nombre';
  const etapaDe = (c) => String(c.lifecycle_stage || 'nuevo');
  const lineaDe = (c) => (c.source === 'whatsapp_qr' ? '5644' : 'oficial');
  const esViva = (c) => !!c && !c.ignored_at && !c.followup_discarded_at && c.lead_status !== 'desinteresado' && !CERRADAS.includes(etapaDe(c));
  // El ultimo mensaje fue del cliente. Si la ficha guarda cuando escribio por ultima vez (last_customer_reply_at, que se actualiza en
  // CADA mensaje entrante), manda esa hora contra la del ultimo mensaje; en las fichas viejas que no la tienen, se compara el texto.
  const ultimoEsDelCliente = (c) => {
    const r = ms(c.last_customer_reply_at), t = ms(c.last_message_at);
    if (Number.isFinite(r) && Number.isFinite(t)) return r >= t - 1500;
    return !!c.last_inbound_preview && String(c.last_inbound_preview) === String(c.last_message_preview);
  };
  const omitida = (c) => Number.isFinite(ms(c.cola_omitida_at)) && ms(c.cola_omitida_at) >= (ms(c.last_message_at) || 0);

  function item(c, ahora, extra = {}) {
    const t = ms(c.last_message_at);
    return Object.assign({
      id: c.id || c._id, nombre: nombreDe(c), etapa: etapaDe(c), linea: lineaDe(c),
      edad_h: Number.isFinite(t) ? Math.max(0, Math.round((ahora - t) / 3600000)) : null,
      texto: recorte(ultimoEsDelCliente(c) ? c.last_inbound_preview : c.last_message_preview, 80),
      categoria: String(c.interested_category || ''), sin_leer: Number(c.unread) > 0, persona: c.human_handoff_required === true,
    }, extra);
  }

  function colaDeTrabajo(convs, { ahora = Date.now() } = {}) {
    const hoy0 = inicioDeHoy(ahora), manana1 = hoy0 + 2 * DIA;
    const vivas = (convs || []).filter(esViva);
    const sinResponder = [], seEnfrian = [], seguimientos = [], sesiones = [];
    for (const c of vivas) {
      const t = ms(c.last_message_at);
      const edadDias = Number.isFinite(t) ? (ahora - t) / DIA : Infinity;
      if (ultimoEsDelCliente(c)) {
        if (edadDias <= VENTANA_SIN_RESPONDER_DIAS && !omitida(c) && !esCortesia(c.last_inbound_preview, edadDias)) {
          const urgencia = edadDias < 1 ? 'hoy' : edadDias <= 3 ? 'atrasado' : 'viejo';
          const puntos = (PESO_ETAPA[etapaDe(c)] || 1) * 10 + Math.min(edadDias, 7) + (Number(c.unread) > 0 ? 1 : 0) + (c.human_handoff_required ? 3 : 0);
          sinResponder.push(item(c, ahora, { urgencia, puntos }));
        }
      } else if (ETAPAS_QUE_SE_ENFRIAN.includes(etapaDe(c)) && edadDias >= 2 && edadDias <= 21 && !c.follow_up_at && !omitida(c)
        && !c.followups_opt_out_at && c.followups_opt_in !== false && c.last_message_preview && !esCierreNuestro(c.last_message_preview)) {
        seEnfrian.push(item(c, ahora, { puntos: (PESO_ETAPA[etapaDe(c)] || 1) * 10 - edadDias }));
      }
      const f = ms(c.follow_up_at);
      if (Number.isFinite(f) && f < hoy0 + DIA && !c.follow_up_sent_at) {
        seguimientos.push(item(c, ahora, { cuando: c.follow_up_at, vencido: f < hoy0, puntos: -f }));
      }
      const s = ms(c.scheduled_at);
      if (Number.isFinite(s) && s >= hoy0 && s < manana1 && c.session_status !== 'cancelada') {
        sesiones.push(item(c, ahora, { cuando: c.scheduled_at, hoy: s < hoy0 + DIA, puntos: -s }));
      }
    }
    const orden = (a, b) => b.puntos - a.puntos;
    sinResponder.sort(orden); seEnfrian.sort(orden); seguimientos.sort(orden); sesiones.sort(orden);
    const cuenta = (l, k, v) => l.filter((x) => x[k] === v).length;
    return {
      ahora,
      sin_responder: { total: sinResponder.length, hoy: cuenta(sinResponder, 'urgencia', 'hoy'), atrasado: cuenta(sinResponder, 'urgencia', 'atrasado'),
        viejo: cuenta(sinResponder, 'urgencia', 'viejo'), viejos_ids: sinResponder.filter((x) => x.urgencia === 'viejo').map((x) => x.id), con_persona: sinResponder.filter((x) => x.persona).length, items: sinResponder.slice(0, TOPE) },
      se_enfrian: { total: seEnfrian.length, items: seEnfrian.slice(0, TOPE) },
      seguimientos: { total: seguimientos.length, vencidos: cuenta(seguimientos, 'vencido', true), items: seguimientos.slice(0, TOPE) },
      sesiones: { total: sesiones.length, hoy: cuenta(sesiones, 'hoy', true), items: sesiones },
    };
  }
  return { colaDeTrabajo, esCortesia, esCierreNuestro };
})();
// ---- Hoy: fin de las piezas puras
// El numerito de «Hoy» en el menu: chats por contestar (de hoy y atrasados) mas seguimientos que tocan.
function pintaCuentaHoy(){

  // del menu lateral: con el panel en otra pestana --que es donde esta casi siempre-- no
  // habia absolutamente nada que delatara que un cliente habia escrito. En Chrome el titulo
  // se lee sin cambiar de pestana, asi que es el aviso mas barato que existe.
  document.title = (pend ? '(' + pend + ') ' : '') + TITULO_BASE;

/* ---- Avisos de mensaje nuevo --------------------------------------------- */
// Ultima respuesta del cliente ya conocida, por conversacion: es lo que distingue "ha
// entrado un mensaje" de "la lista se ha repintado", que pasa constantemente.
const VISTO_ENTRANTE = new Map();
let primerVistazo = true;

function avisaMensajesNuevos(){
  const nuevos = [];
  // Se toma nota de TODAS, tambien las ocultas: si no, al volver a vincular una linea sus fichas
  // aparecerian como "nunca vistas" y soltarian un aviso por cada chat viejo.
  for (const c of CONVS_TODAS) {
    const id = c.id || c._id;
    const t = String(c.last_customer_reply_at || '');
    if (!t) continue;
    const antes = VISTO_ENTRANTE.get(id);
    VISTO_ENTRANTE.set(id, t);
    // Y solo lo RECIENTE. Una importacion de historial escribe la fecha del ultimo mensaje del
    // cliente --de hace meses o anos-- en fichas que el panel ve por primera vez, y para el
    // bucle eso es indistinguible de un mensaje nuevo: sincronizar el historial con el CRM
    // abierto soltaria una rafaga de avisos de conversaciones muertas. Hasta ahora no pasaba
    // por accidente, porque el puente no escribia ese campo; en cuanto lo escribe, hace falta
    // decirlo aqui. Una fecha ilegible (NaN) no se silencia: ante la duda, se avisa.
    if (Date.now() - Date.parse(t) > 15 * 60000) continue;
    // De una ignorada no se avisa ni suena nada: es la familia o un colega. Se toma nota igual
    // (arriba), para que al dejar de ignorarla no suelte avisos de mensajes viejos.
    if (ignorada(c)) continue;
    // Y de un chat silenciado tampoco, que es lo que significa silenciarlo en WhatsApp. Se
    // toma nota igual (arriba): al quitarle el silencio no tiene que soltar avisos viejos.
    if (silenciado(c)) continue;
    // En el primer vistazo solo se toma nota. Avisar aqui soltaria una notificacion por cada
    // conversacion pendiente que ya existiera, cada vez que se abre el panel.
    if (primerVistazo) continue;
    // Y OJO: 'antes === undefined' significa conversacion NUEVA, no "nada que avisar". Al
    // saltarla se perdia justo el aviso que mas importa -- el primer mensaje de alguien que
    // nunca habia escrito, que es un cliente nuevo llamando a la puerta. Solo se salta
    // cuando ya se conocia y no ha entrado nada mas nuevo.
    if (antes !== undefined && t <= antes) continue;
    // De una linea que ya no esta vinculada no se avisa: no se le puede contestar. Con el puente
    // caido si, porque es la linea que atiende y vuelve en cuanto la PC responda.
    if (estadoQr(c, LINEA_QR) === 'otra_linea') continue;
    nuevos.push(c);
  }
  primerVistazo = false;
  if (!nuevos.length) return;
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  // Del chat que se esta mirando no se avisa: ya se ve.
  const idSel = sel ? (sel.id || sel._id) : null;
  for (const c of nuevos.slice(0, 3)) {
    if (!document.hidden && (c.id || c._id) === idSel) continue;
    try {
      const n = new Notification(nombreDe(c), {
        body: String(c.last_inbound_preview || c.last_message_preview || 'Mensaje nuevo').slice(0, 140),
        // Una etiqueta por conversacion: si alguien manda cinco mensajes seguidos se
        // reemplaza el aviso en vez de apilar cinco.
        tag: 'crm-' + (c.id || c._id),
      });
      n.onclick = () => {
        window.focus();
        // Primero la vista, despues el chat. abre() toca $('sinChat') y $('conversacion'),
        // que solo existen con Conversaciones montada: pulsando el aviso desde Kanban, la
        // Agenda o Configuracion saltaba un TypeError, el chat no se abria, y el mensaje
        // quedaba marcado como leido sin que nadie lo hubiera visto.
        if (vistaActual !== 'conversations') ve('conversations');
        abre(c);
        n.close();
      };
    } catch (error) { /* si el navegador lo bloquea, quedan el titulo y el globito */ }
  }
}

// Web». Tres piezas, las mismas que WhatsApp Web:
//   - la lista: «Mi estado» arriba, luego «Recientes» (lo que falta por ver) y «Vistos», con el
//     anillo partido en tantos trozos como estados tiene cada contacto;
//   - el visor a pantalla completa: barras de avance arriba, quién y cuándo, flechas a los
//     lados, y abajo «Responder» (o, en los tuyos, cuánta gente lo vio y quién);
//   - el compositor: texto sobre un color, o foto con comentario.
//
// De dónde sale cada cosa: los estados de los contactos los guarda el puente en
// crm_status_feed (texto, miniatura y referencia; 24 horas; nunca el archivo --la foto
// completa se pide al abrirla, como «Ver» en un mensaje--); quién vio los tuyos, en

//     la confirmación: el CRM publica a una lista, no a «mis contactos» del teléfono;
//   - abajo no dice «cifrado de extremo a extremo»: los estados pasan por el CRM, y decirlo
//     sería mentir. Dice lo que sí es verdad: que desaparecen a las 24 horas.

// Los colores de un estado de texto. El primero es el verde del estudio (el de siempre).
const ST_PALETA = ['#0b5c3a', '#6e267b', '#c1a03f', '#ae8774', '#792138', '#8294ca', '#a62c71',
  '#90a841', '#c69fcc', '#243640', '#7e90a3', '#54c265', '#fb6533', '#ff7b6b', '#26c4dc',
  '#5696ff', '#7acba5', '#ffa7a4', '#8b6990', '#b6b327'];
// Las letras, en el orden del enum de WhatsApp (FontType: 0 sans, 1 serif, 2 Norican,
// 3 Bryndan, 4 Bebas, 5 Oswald). Se aproximan con fuentes del sistema: el número es lo que
// viaja a WhatsApp y lo que ve el cliente en su teléfono.
const ST_FUENTES = [
  "'Segoe UI',Helvetica,Arial,sans-serif",
  "Georgia,'Times New Roman',serif",
  "'Segoe Script','Brush Script MT',cursive",
  "'Segoe Print','Comic Sans MS',cursive",
  "Impact,'Arial Narrow',sans-serif",
  "'Arial Black','Segoe UI Black',sans-serif",
];
// Cuánto se ve cada foto o texto. Un vídeo dura lo que dura (con tope de un minuto).
const ST_DURACION_MS = 6000;
const ST_DIA_MS = 24 * 3600000;

const ST = { feed: [], vistas: new Map(), mios: [], vistos: new Set(), escuchando: false,
  sel: '', visor: null, comp: null };
// La audiencia de fotografía elegida en el modal, para preseleccionarla al abrir el compositor.
// Aparte de ST porque stCompositor la lee UNA vez y la borra; no es parte del estado del Estado.
let ST_AUDIENCIA_PENDIENTE = '';

function stVisto(e){ return !!(e && (e.seen_at || ST.vistos.has(e._id))); }

// «hoy a las 10:30», «ayer a las 20:15»: como lo escribe WhatsApp.
function stCuando(iso){
  const t = Date.parse(String(iso || ''));
  if (!Number.isFinite(t)) return '';
  const d = new Date(t), hoy = new Date();
  const h = d.toLocaleTimeString('es-DO', { hour:'numeric', minute:'2-digit' });
  if (d.toDateString() === hoy.toDateString()) return 'hoy a las ' + h;
  const ayer = new Date(hoy); ayer.setDate(hoy.getDate() - 1);
  if (d.toDateString() === ayer.toDateString()) return 'ayer a las ' + h;
  return d.toLocaleDateString('es-DO', { day:'numeric', month:'short' }) + ', ' + h;
}

// La ficha de quien publicó, para su nombre y su foto. De las visibles y de la línea anterior;
// de las ignoradas no, que tampoco tienen estados guardados.
// Un mapa telefono -> ficha, armado una vez cada pocos segundos. Antes CADA fila recorria las
// ~1.500 fichas tres veces (nombre y dos veces el avatar): con 700 contactos con estados eran
// millones de comparaciones en cada repintado, y hay uno por cada cambio que llega.
const ST_MAPA = { n: -1, en: 0, m: new Map() };
function stConv(tel){
  const n = CONVS.length + CONVS_OCULTAS.length;
  const ahora = Date.now();
  if (ST_MAPA.n !== n || ahora - ST_MAPA.en > 3000) {
    const m = new Map();
    for (const c of [...CONVS, ...CONVS_OCULTAS]) {
      const t = soloDigitos(c.wa_phone);
      if (!t) continue;
      // Igual que antes: la de la linea de WhatsApp Web gana; si no, la primera.
      if (!m.has(t) || c.source === 'whatsapp_qr') m.set(t, c);
    }
    ST_MAPA.n = n; ST_MAPA.en = ahora; ST_MAPA.m = m;
  }
  return ST_MAPA.m.get(tel) || null;
}
function stNombre(tel, e){
  const c = stConv(tel);
  return c ? nombreDe(c) : (e?.push_name || '+' + telefonoLegible(tel));
}
function stAvatar(tel, e){
  const c = stConv(tel);
  return c ? avatarDe(c, stNombre(tel, e)) : '<div class="av">' + esc(iniciales(stNombre(tel, e))) + '</div>';
}
function stAvatarPropio(){
  return '<div class="av">' + esc(iniciales(CFG.productName || 'Mi estado')) + '</div>';
}

// Los contactos con estados vivos, cada uno con los suyos del más viejo al más nuevo (así se
// ven en WhatsApp), y la lista con el más reciente arriba.
function stGrupos(){
  const ahora = Date.now();
  const porTel = new Map();
  for (const e of ST.feed) {
    if (e.revoked_at || !(Date.parse(String(e.expires_at || '')) > ahora)) continue;
    const tel = soloDigitos(e.wa_phone);
    if (!tel) continue;
    if (!porTel.has(tel)) porTel.set(tel, []);
    porTel.get(tel).push(e);
  }
  return [...porTel.entries()].map(([tel, lista]) => {
    lista.sort((a, b) => String(a.posted_at || '').localeCompare(String(b.posted_at || '')));
    return { tel, lista, ultimo: lista[lista.length - 1], pendientes: lista.filter(e => !stVisto(e)).length };
  }).sort((a, b) => String(b.ultimo.posted_at || '').localeCompare(String(a.ultimo.posted_at || '')));
}

// Los tuyos que siguen vivos: publicados y de hace menos de un día.
function stMios(){
  const ahora = Date.now();
  return ST.mios.filter(p => p.status === 'sent' && ahora - Date.parse(String(p.sent_at || '')) < ST_DIA_MS)
    .sort((a, b) => String(a.sent_at || '').localeCompare(String(b.sent_at || '')));
}

// El anillo: un trozo por estado, verde lo que falta por ver y gris lo visto, empezando arriba.
function stAro(vistos){
  const n = Math.max(1, vistos.length);
  const r = 23.2, C = 2 * Math.PI * r;
  const hueco = n > 1 ? Math.min(3.2, C / n / 3) : 0;
  const seg = C / n;
  let trozos = '';
  for (let i = 0; i < n; i++) {
    trozos += '<circle cx="25" cy="25" r="' + r + '" fill="none" stroke-width="2.4" stroke="'
      + (vistos[i] ? 'var(--st-gris)' : 'var(--st-verde)') + '" stroke-dasharray="'
      + (seg - hueco).toFixed(2) + ' ' + (C - seg + hueco).toFixed(2) + '" stroke-dashoffset="'
      + (-(i * seg) - hueco / 2).toFixed(2) + '"/>';
  }
  return '<svg class="aro" viewBox="0 0 50 50" aria-hidden="true">' + trozos + '</svg>';
}

function stFila(g){
  return '<button class="st-fila' + (ST.sel === g.tel ? ' on' : '') + '" data-sttel="' + esc(g.tel) + '">'
    + '<span class="st-anillo">' + stAro(g.lista.map(stVisto)) + stAvatar(g.tel, g.ultimo) + '</span>'
    + '<span class="st-texto"><b>' + esc(stNombre(g.tel, g.ultimo)) + '</b>'
    + '<i>' + esc(stCuando(g.ultimo.posted_at)) + '</i></span></button>';
}

function stFilaMia(){
  const mios = stMios();
  if (!mios.length) {
    return '<button class="st-fila" data-stmio="nuevo"><span class="st-anillo">' + stAvatarPropio()
      + '<span class="st-mas">+</span></span><span class="st-texto"><b>Mi estado</b>'
      + '<i>Haz clic para añadir una actualización de estado</i></span></button>';
  }
  return '<button class="st-fila" data-stmio="ver"><span class="st-anillo">' + stAro(mios.map(() => true))
    + stAvatarPropio() + '</span><span class="st-texto"><b>Mi estado</b>'
    + '<i>' + esc(stCuando(mios[mios.length - 1].sent_at)) + '</i></span></button>';
}

// La lista sale por tandas. Con 700 contactos con estados, pintarlos todos eran 660 KB de HTML
// y casi 400 ms bloqueados cada vez que llegaba algo; WhatsApp Web tampoco los pinta todos. Al
// llegar al final de la lista salen otros 60 (o con «Mostrar más»).
const ST_TANDA = 60;
// Lo que se pide por adelantado de la lista: el primer estado sin ver de los primeros contactos.
const ST_ADELANTO_LISTA = 10;

function pintaEstados(){
  const cont = $('stScroll');
  if (!cont) return;
  // Con otra vista abierta no se pinta para nadie. Al volver, ve() monta la vista ANTES de
  // hacerla visible, y montaEstados la pinta entonces (vistaActual ya es 'estados').
  if (vistaActual !== 'estados' && cont.dataset.pintado) return;
  const grupos = stGrupos();
  const recientes = grupos.filter(g => g.pendientes > 0);
  const vistos = grupos.filter(g => !g.pendientes);
  const limite = Math.max(ST.mostrar || 0, ST_TANDA);
  let usados = 0;
  const tanda = lista => { const t = lista.slice(0, Math.max(0, limite - usados)); usados += t.length; return t; };
  const r = tanda(recientes), v = tanda(vistos);
  cont.innerHTML = stFilaMia()
    + (r.length ? '<div class="st-sec">Recientes</div>' + r.map(stFila).join('') : '')
    + (v.length ? '<div class="st-sec">Vistos</div>' + v.map(stFila).join('') : '')
    + (usados < grupos.length ? '<button class="st-vermas" data-stvermas>Mostrar más · ' + (grupos.length - usados) + '</button>' : '')
    + (!grupos.length ? '<div class="st-nada">Todavía no hay estados de tus contactos. Salen los de quien '
      + 'tiene guardado el número de la línea de WhatsApp Web; la agenda .vcf de Configuración sirve '
      + 'para que el teléfono del negocio los tenga a todos.</div>' : '');
  cont.dataset.pintado = '1';
  resuelveAvatares();
  // Lo primero que se va a abrir ya va de camino cuando se pulse.
  stAdelanta(recientes.slice(0, ST_ADELANTO_LISTA).map(g => g.lista.find(e => !stVisto(e))).filter(Boolean));
}

// Los cambios llegan en ráfagas (un snapshot por documento que se actualiza): se juntan en un
// solo pintado en vez de rehacer la lista por cada uno.
let ST_PINTA_T = 0;
function pintaEstadosPronto(){
  if (ST_PINTA_T) return;
  ST_PINTA_T = setTimeout(() => { ST_PINTA_T = 0; pintaEstados(); }, 150);
}

// Pide por adelantado el archivo de estos estados (fotos y videos; el texto no tiene, la nota de voz
// pesa poco y va con su estado). Sin avisar de nada si no se puede: al abrirlo se pide como siempre.
// Comparte el cupo de lo que el panel pide solo (pideAdelantado), y cada estado se pide una vez.
ST.adelantados = new Set();
function stAdelanta(estados){
  for (const e of (estados || []).slice(0, 8)) {
    const tipo = String(e.kind || '');
    if (!e._id || tipo === 'texto' || tipo === 'text' || ST.adelantados.has(e._id)) continue;
    if ((Number(e.media_size) || 0) > 6 * 1048576) continue;
    ST.adelantados.add(e._id);
    void stMini(e);
    void pideAdelantado(e._id);
  }
}

// ---- Estados: piezas puras
// Los estados de los contactos eran una escucha de TODA la coleccion: ~3.700 documentos y 14 MB
// (10 MB de miniaturas que la lista ni dibuja) cada vez que se abria el panel. Ahora la lista se
// lee con una consulta que deja fuera la miniatura (solo la API REST de Firestore puede
// proyectar campos) y la miniatura se pide de una en una, cuando se va a ver ese estado.
const ST_CAMPOS_LISTA = ['id', 'wamid', 'wa_phone', 'author_jid', 'business_number', 'kind', 'body', 'push_name',
  'posted_at', 'expires_at', 'received_at', 'media_store', 'media_size', 'media_mime', 'media_w', 'media_h',
  'media_seconds', 'revoked_at', 'bg_color', 'text_color', 'color', 'font', 'media_waveform_b64', 'media_ptt', 'seen_at'];
function valorFirestore(v){
  if (!v || typeof v !== 'object') return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('timestampValue' in v) return v.timestampValue;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(valorFirestore);
  if ('mapValue' in v) return Object.fromEntries(Object.entries(v.mapValue.fields || {}).map(([k, x]) => [k, valorFirestore(x)]));
  return null;
}
function consultaEstados(negocio){
  return { structuredQuery: {
    from: [{ collectionId: 'crm_status_feed' }],
    select: { fields: ST_CAMPOS_LISTA.map(fieldPath => ({ fieldPath })) },
    where: { fieldFilter: { field: { fieldPath: 'business_id' }, op: 'EQUAL', value: { stringValue: negocio } } },
  } };
}
// Lo que devuelve runQuery -> filas planas. Las que ya traian su miniatura la conservan: no se
// vuelve a pedir en cada relectura.
function filasDeEstados(respuesta, anteriores){
  const minis = new Map();
  for (const e of anteriores || []) if (e && e.media_thumb_b64 !== undefined) minis.set(e._id, e.media_thumb_b64);
  return (Array.isArray(respuesta) ? respuesta : []).filter(x => x && x.document).map(x => {
    const fila = {};
    for (const [k, v] of Object.entries(x.document.fields || {})) fila[k] = valorFirestore(v);
    fila._id = String(x.document.name || '').split('/').pop();
    if (minis.has(fila._id)) fila.media_thumb_b64 = minis.get(fila._id);
    return fila;
  });
}
// ---- Estados: fin de las piezas puras

async function stLeeLista(){
  if (ST.leyendo || !auth.currentUser) return;
  ST.leyendo = true;
  try {
    const token = await auth.currentUser.getIdToken();
    const r = await fetch('https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(FB.projectId || 'erikccarela')
      + '/databases/(default)/documents:runQuery', {
      method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(consultaEstados(NEGOCIO)),
    });
    if (!r.ok) throw new Error('http ' + r.status);
    ST.feed = filasDeEstados(await r.json(), ST.feed);
    ST.listaLigera = true; ST.leidoEn = Date.now();
    pintaEstadosPronto();
  } catch (err) {
    console.warn('estados de contactos', err?.message || err);
    // Si la lectura ligera no se puede, se cae a la escucha completa de siempre: mas lenta, pero funciona.
    if (!ST.listaLigera && !ST.escuchaCompleta) {
      ST.escuchaCompleta = true;
      onSnapshot(query(collection(db, 'crm_status_feed'), where('business_id', '==', NEGOCIO)), s => {
        ST.feed = s.docs.map(d => ({ ...d.data(), _id: d.id }));
        pintaEstadosPronto();
      }, e => console.warn('estados de contactos', e?.code || e));
    }
  } finally { ST.leyendo = false; }
}

// La miniatura de un estado, pedida cuando hace falta. Devuelve '' si no la hay.
// La imagen del visor de Estados (una sola definicion: su id no puede repetirse en el panel).
function stImgVisor(src){ return '<img class="st-img cargando" id="stMedio" src="' + esc(src) + '" alt="">'; }
async function stMini(e){
  if (!e) return '';
  if (e.media_thumb_b64 !== undefined) return String(e.media_thumb_b64 || '');
  if (!e._id) return '';
  if (!e._miniPend) {
    e._miniPend = getDoc(doc(db, 'crm_status_feed', e._id))
      .then(s => { e.media_thumb_b64 = s.exists() ? String(s.data().media_thumb_b64 || '') : ''; })
      .catch(() => { e.media_thumb_b64 = ''; })
      .finally(() => { e._miniPend = null; });
  }
  await e._miniPend;
  return String(e.media_thumb_b64 || '');
}

function escuchaEstados(){
  if (ST.escuchando) return;
  ST.escuchando = true;
  stLeeLista();
  // Sin escucha en vivo (la lista ya no se baja entera): se relee mientras Estados esta a la vista, y
  // de vez en cuando por debajo para que el contador de sin ver no se quede atras.
  setInterval(() => { if (vistaActual === 'estados' && !document.hidden) stLeeLista(); }, 45000);
  setInterval(() => { if (vistaActual !== 'estados' && !document.hidden) stLeeLista(); }, 300000);
  stCargaMios();
  // Los tuyos se leen por el servidor (la fila lleva la lista de destinatarios, que no hace
  // falta bajar al navegador): cada minuto mientras la vista está abierta.
  setInterval(() => { if (vistaActual === 'estados') stCargaMios(); }, 60000);
}

// Quien vio cada estado tuyo. Es toda la coleccion de vistas del negocio, y solo hace falta al
// abrir un estado propio: antes se bajaba entera, junto con la lista, al entrar en Estados.
function escuchaVistasEstados(){
  if (ST.escuchandoVistas) return;
  ST.escuchandoVistas = true;
  onSnapshot(query(collection(db, 'crm_status_views'), where('business_id', '==', NEGOCIO)), s => {
    const m = new Map();
    for (const d of s.docs) {
      const v = d.data();
      if (!m.has(v.status_wamid)) m.set(v.status_wamid, []);
      m.get(v.status_wamid).push(v);
    }
    ST.vistas = m;
    stPintaAbajo();
  }, err => console.warn('vistas de estados', err?.code || err));
}

// ---- Audiencias de fotografía ----
// «con los datos de ventas historicas podemos hacer marketing con mas precision, orientado a
// fotografia». Los segmentos salen de lo que la caja YA sabe que compro cada cliente

// quien entra en cada uno vive en audiencias-foto.js, y no se puede saltar: publicar sigue
// pasando por las mismas cuatro reglas de siempre (ignorados, bajas, la linea conectada).

  abreModal('<div class="mtapa"><b>Audiencias de fotografía</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo" id="audCuerpo"><p class="bajada">Contando…</p></div>');

    + 'solo a ese grupo (pasa por las mismas reglas de siempre: nada de ignorados ni de quien '
    + 'pidió baja). <b>Etiquetar</b> les pone una etiqueta en el chat, para encontrarlos después '
