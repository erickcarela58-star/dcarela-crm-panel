  { n:'Campaña de temporada',
    p:'Propón una campaña de temporada. Ten en cuenta: fuera de la ventana de 24 h solo llega '
      + 'plantilla aprobada con salida de baja, cada mensaje tiene que ir personalizado por contacto, '
      + 'y hay que excluir desinteresados y a quien no dio permiso de marketing. Dime a qué segmento '
      + 'y por qué.' },
  { n:'Qué hago hoy',
    p:'Mira el estado del negocio y dime qué tres cosas debería hacer hoy, por orden, y por qué esas '
      + 'y no otras.' },
];

function montaPlanificacion(){
  if (montadas.has('planning')) { pintaContexto(); return; }
  montadas.add('planning');
  hueco('planning',
    '<div class="asistente">'
    + '<div class="acab">'
    +   '<div><b>Asistente</b><span id="contexto"></span></div>'
    +   '<button class="btn-linea" id="btnReglasAbrir">Reglas del negocio</button>'
    + '</div>'
    + '<div class="ahilo" id="ahilo"></div>'
    + '<div class="acola" id="planCola" hidden></div>'
    + '<div class="aentrada">'
    +   '<button class="adj" id="planImg" title="Adjuntar imagen">'
    +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button>'
    +   '<input type="file" id="planFile" accept="image/*" multiple hidden>'
    +   '<textarea id="pedido" rows="1" placeholder="Dime qué necesitas…"></textarea>'
    +   '<button class="enviar" id="btnPedir" aria-label="Enviar">'
    +     '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>'
    +   '</button>'
    + '</div></div>');

  const caja = $('pedido');
  caja.addEventListener('input', () => {
    caja.style.height = 'auto'; caja.style.height = Math.min(caja.scrollHeight, 160) + 'px';
  });
  caja.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('btnPedir').click(); }
  });
  $('btnPedir').onclick = pide;
  pintaContexto();

  // Imagenes para el asistente: un comprobante, la foto de un vestido, la captura de
  // otra cotizacion. Son cosas sobre las que hay que decidir, y sin verlas decide a
  // ciegas.
  $('planImg').onclick = () => $('planFile').click();
  $('planFile').onchange = async e => {
    const files = [...e.target.files]; e.target.value = '';
    for (const f of files) {
      if (!f.type?.startsWith('image/')) continue;
      const blob = await comprimeNormal(f);   // no le hace falta la resolucion completa
      PLAN_IMGS.push({ nombre:f.name, mime: blob.type || 'image/jpeg', datos: await leeBase64(blob) });
    }
    pintaPlanCola();
  };
  $('planCola').onclick = ev => {
    const b = ev.target.closest('[data-quita]'); if (!b) return;
    PLAN_IMGS.splice(Number(b.dataset.quita), 1); pintaPlanCola();
  };
  $('btnReglasAbrir').onclick = abreReglas;

  cargaReglas();
  cargaHilo();
}

function pintaContexto(){
  const c = $('contexto'); if (!c) return;
  c.textContent = contextoTexto();
}

function pintaHilo(){
  const h = $('ahilo'); if (!h) return;
  if (!HILO.length) {
    h.innerHTML = '<div class="abienvenida">'
      + '<b>¿Qué necesitas?</b>'
      + '<p>Leo la conversación que tengas abierta, la ficha del contacto y las reglas del negocio. '
      +   'Propongo, y no se toca nada hasta que lo apruebes.</p>'
      + '<div class="awiz">' + WIZARDS.map((w,i) =>
          '<button class="ejemplo" data-wiz="' + i + '">' + esc(w.n) + '</button>').join('') + '</div>'
      + '</div>';
    h.querySelector('.awiz').onclick = ev => {
      const b = ev.target.closest('[data-wiz]'); if (!b) return;
      $('pedido').value = WIZARDS[Number(b.dataset.wiz)].p;
      $('pedido').dispatchEvent(new Event('input'));
      $('pedido').focus();
    };
    return;
  }
  h.innerHTML = HILO.map((t,i) => t.rol === 'yo'
    ? '<div class="aturno yo"><div class="aburbuja">' + esc(t.texto)
      + (t.imgs ? '<span class="aimgs">' + t.imgs + ' imagen(es)</span>' : '') + '</div></div>'
    : '<div class="aturno ia"><div class="aburbuja">'
      + (t.pensando ? '<span class="cargando"></span> Pensando…' : cuerpoDePlan(t.plan, i))
      + '</div></div>').join('');
  h.scrollTop = h.scrollHeight;
  HILO.forEach((t,i) => {
    if (t.rol !== 'ia' || t.pensando) return;
    const ap = h.querySelector('[data-aprobar="' + i + '"]');
    if (ap) ap.onclick = () => aplica(i);
  });
}

function cuerpoDePlan(p, idx){
  if (!p) return 'No se pudo interpretar la respuesta.';
  const filas = [];
  if (p.objective) filas.push(['Objetivo', p.objective]);
  if (p.rationale) filas.push(['Por qué', p.rationale]);
  if (p.message_text) filas.push(['Mensaje que se prepararía', p.message_text]);
  (p.steps || []).forEach((s,i) => filas.push(['Paso ' + (i+1), s]));
  (p.risks || []).forEach(s => filas.push(['Riesgo', s]));

  const tools = Array.isArray(p.tools) ? p.tools : [];
  const bloque = tools.length
    ? '<div class="aacciones"><b>Se haría esto</b>'
      + tools.map(t => '<div class="aaccion"><span>' + esc(NOMBRE_HERRAMIENTA[t.name] || t.name) + '</span>'
        + (t.preview ? '<i>' + esc(t.preview) + '</i>' : '')
        // Los campos exactos, sin traducir: quien aprueba tiene derecho a ver el cambio
        // literal y no solo el resumen bonito.
        + (t.params?.fields ? '<div class="campos">' + Object.entries(t.params.fields)
            .map(([k,v]) => '<span>' + esc(k) + ' → ' + esc(String(v)) + '</span>').join('') + '</div>' : '')
        + '</div>').join('')
      + '</div>'
    : '';

  return filas.map(([k,v]) => '<div class="afila"><b>' + esc(k) + '</b>' + esc(v) + '</div>').join('')
    + bloque
    + (p.aplicado
        ? '<div class="ahecho">✓ Aplicado</div>'
        : tools.length ? '<button class="btn-solido apr" data-aprobar="' + idx + '">Aprobar y aplicar</button>' : '');
}

async function pide(){
  const t = $('pedido').value.trim();
  if (!t) return;
  $('pedido').value = ''; $('pedido').style.height = 'auto';
  HILO.push({ rol:'yo', texto:t, imgs: PLAN_IMGS.length || 0 });
  HILO.push({ rol:'ia', pensando:true });
  pintaHilo();

  const cuerpo = { action:'assistantPlan', instruction:t };
  const contexto = [];

  // Las reglas del negocio van SIEMPRE, aunque no haya conversacion abierta: son lo que
  // evita que proponga cosas que el estudio no puede cumplir.
  if (REGLAS) contexto.push('Reglas del negocio, de obligado cumplimiento:\n' + REGLAS);

  // Las normas ya cableadas en el servidor se le dicen tambien. Sin conocerlas propone
  // difundir a gente dada de baja, el servidor lo rechaza despues, y hay que explicar
  // por que se rechazo algo que el mismo propuso.
  contexto.push([
    'Reglas del sistema que NO se pueden saltar:',
    '- Fuera de la ventana de 24 h desde el ultimo mensaje del cliente solo llega una plantilla aprobada.',
    '- Un contacto desinteresado, o con exclusion permanente, no recibe marketing ni seguimientos.',
    '- Dos seguimientos sin respuesta y el contacto pasa a desinteresado automaticamente.',
    '- Una difusion con plantilla exige que la plantilla incluya salida de baja (STOP).',
    '- Cada mensaje de una difusion tiene que ir personalizado por contacto: mandar el mismo',
    '  texto a muchos es lo primero que Meta marca como spam y degrada el numero.',
    '- Nada se ejecuta sin que una persona lo apruebe.',
  ].join('\n'));

  contexto.push('Herramientas que puedes proponer, y solo estas:\n'
    + Object.entries(NOMBRE_HERRAMIENTA).map(([k,v]) => '- ' + k + ': ' + v).join('\n'));

  if (sel) {
    contexto.push('Ficha de este contacto:\n' + [
      ['Nombre', nombreDe(sel)], ['Telefono', sel.wa_phone], ['Etapa', sel.lifecycle_stage],
      ['Estado', sel.lead_status], ['Reserva', sel.reservation_status],
      ['Categoria', sel.interested_category], ['Combo', sel.selected_combo_name],
      ['Fecha tentativa', sel.tentative_date], ['Etiquetas', etiquetasDe(sel).join(', ')],
      ['Seguimientos sin respuesta', sel.followup_attempts],
      ['Marketing permitido', sel.marketing_opt_in === false ? 'NO' : 'si'],
      ['Excluido permanentemente', sel.proactive_blocked_at ? 'SI' : 'no'],
      ['Ultimo mensaje', sel.last_message_at],
    ].filter(([,v]) => v !== undefined && v !== null && String(v).trim() !== '')
      .map(([k,v]) => '- ' + k + ': ' + v).join('\n'));
    contexto.push('Ultimos mensajes:\n' + MSGS.slice(-40)
      .map(m => (m.direction === 'out' ? 'Nosotros: ' : 'Cliente: ') + (m.body || '')).join('\n'));
    cuerpo.conversation_id = sel.id || sel._id;
  } else {
    contexto.push('No hay ninguna conversacion abierta: la peticion es sobre el negocio en general. '
      + 'Hay ' + CONVS.length + ' conversaciones, de las cuales '
      + CONVS.filter(c => c.lifecycle_stage === 'desinteresado').length + ' desinteresadas.');
  }

  // El hilo anterior viaja entero: es lo que permite decir "y ahora el de arriba".
  const previos = HILO.filter(x => !x.pensando).slice(-9, -1);
  if (previos.length) {
    contexto.push('Conversacion previa con el asistente:\n' + previos.map(x => x.rol === 'yo'
      ? 'Persona: ' + x.texto
      : 'Asistente: ' + (x.plan?.objective || '') + ' ' + (x.plan?.rationale || '')).join('\n'));
  }

  cuerpo.contact_context = contexto.join('\n\n');
  // assistantAttachmentParts lee item.mime (assistant-plan.js:224), no mime_type, y se
  // queda con las tres primeras.
  if (PLAN_IMGS.length) {
    cuerpo.attachment_payloads = PLAN_IMGS.slice(0, 3).map(a => ({ mime:a.mime, data:a.datos }));
    if (PLAN_IMGS.length > 3) avisa('Solo van las 3 primeras imágenes', 'Es el máximo que acepta el asistente.');
  }

  const r = await llama(cuerpo);
  HILO.pop();                       // fuera el "pensando"
  if (!r.ok) {
    HILO.push({ rol:'ia', plan:{ objective:'No se pudo proponer', rationale: traduceErrorMeta(r.error) } });
    pintaHilo();
    return;
  }
  HILO.push({ rol:'ia', plan: r.plan || null });
  PLAN_IMGS.length = 0; pintaPlanCola();
  pintaHilo();
  guardaHilo();
}

// El hilo se guarda en el servidor para que siga ahi mañana y en otro navegador. Se
// guardan solo los ultimos treinta turnos: mas no aporta y engorda cada peticion.
async function cargaHilo(){
  if (hiloCargado) { pintaHilo(); return; }
  hiloCargado = true;
  const r = await llama({ action:'data', table:'settings', operation:'select',
    filters:[{ kind:'eq', field:'key', value:'plan_hilo' }], limit:1 });
  const fila = r.ok ? (r.data || r.rows || [])[0] : null;
  if (fila?.value) { try { HILO.push(...JSON.parse(fila.value)); } catch (e) {} }
  pintaHilo();
}
async function guardaHilo(){
  const recorte = HILO.filter(t => !t.pensando).slice(-30);
  await llama({ action:'data', table:'settings', operation:'upsert',
    payload:{ id:'plan_hilo', key:'plan_hilo', value: JSON.stringify(recorte),
      updated_at:new Date().toISOString() }, on_conflict:'id' });
}

function abreReglas(){
  abreModal('<div class="mtapa"><b>Reglas del negocio</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo">'
    + '<p class="aviso">Esto se le da al asistente en cada propuesta. Sirve para lo que no está en '
    +   'ninguna ficha: cómo se cobra, qué no se promete, qué fechas están cerradas, cómo se habla.</p>'
    + '<div class="campo"><textarea id="reglas" rows="12" placeholder="- El abono mínimo es de RD$3,000 y no se devuelve.\n'
    +   '- No trabajamos domingos.\n- Nunca prometer una fecha sin confirmarla con el estudio.\n'
    +   '- Tratar de usted a personas mayores.">' + esc(REGLAS) + '</textarea></div></div>'
    + '<div class="mpatas"><span class="quien" id="reglasNota"></span>'
    +   '<button class="btn-solido" id="btnReglas">Guardar</button></div>');
  $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });
  $('btnReglas').onclick = async () => { await guardaReglas(); cierraModal(); };
}

function contextoTexto(){
  return sel ? 'Sobre: ' + nombreDe(sel) + ' (+' + (sel.wa_phone||'') + ')'
             : 'Sin conversación seleccionada — se propondrá sobre el negocio en general.';
}
// Cada herramienta se explica en cristiano ANTES de aprobarla. "create_reservation"
// no le dice nada a nadie; "pasa el lead a pendiente de reserva" sí.
const NOMBRE_HERRAMIENTA = {
  contact_report: 'Leer la conversación y resumirla',
  create_reservation: 'Pasar el lead a pendiente de reserva',
  mark_paid: 'Marcar como pagado y pedir validación humana del comprobante',
  draft_message: 'Preparar un mensaje en el compositor (no lo envía)',
  communication_policy: 'Cambiar la política de comunicación',
  mark_disinterest: 'Marcar desinteresado y apagar el marketing',
  update_lead: 'Cambiar datos de la ficha',
};
const NOMBRE_BORRADOR = {
  receipt: 'pedir el comprobante del abono',
  location: 'enviar la ubicación del estudio',
  portfolio: 'enviar el portafolio',
  privateCombos: 'enviar los combos',
};

async function aplica(idx){
  const turno = HILO[idx];
  const p = turno?.plan; if (!p) return;
  const tools = Array.isArray(p.tools) ? p.tools : [];
  const b = document.querySelector('[data-aprobar="' + idx + '"]');
  if (b) { b.disabled = true; b.textContent = 'Aplicando…'; }
  const hechas = [], fallos = [];

  for (const t of tools) {
    const conv = t.conversation_id || sel?.id || sel?._id;
    let r = { ok:false, error:'herramienta desconocida' };

    if (t.name === 'mark_disinterest') {
      // Marcar desinteresado NO es escribir tres campos: la accion 'disinterest' del
      // servidor ademas apaga los seguimientos programados y deja el motivo en la
      // auditoria. Hacerlo con updateLead dejaria al contacto marcado por fuera y
      // recibiendo seguimientos por dentro.
      r = await llama({ action:'disinterest', operation:'mark', conversation_id: conv,
        reason: t.preview || 'marcado desde el Planificador' });
    } else if (['create_reservation','mark_paid','update_lead'].includes(t.name)) {
      r = await llama({ action:'updateLead', conversation_id: conv, fields: t.params?.fields || {} });
    } else if (t.name === 'contact_report') {
      r = { ok:true };  // el informe ya es el texto que se esta leyendo
    } else if (t.name === 'draft_message') {
      // Un borrador NO se envia: se deja escrito para que una persona lo lea, lo
      // corrija si hace falta, y pulse enviar. Esa es toda la diferencia entre una
      // ayuda y un bot suelto escribiendo a clientes.
      const texto = t.params?.message_text || textoDeBorrador(t.params?.template);
      if (sel && $('texto')) {
        const caja = $('texto');
        caja.value = caja.value.trim() ? caja.value.trim() + '\n\n' + texto : texto;
        r = { ok:true };
      } else r = { ok:false, error:'abre la conversación para dejar el borrador' };
    } else if (t.name === 'communication_policy') {
      // El servidor exige escribir la frase exacta. Aqui se pide igual: apagarle las
      // comunicaciones a un contacto no puede ser un clic de mas.
      const op = t.params.operation;
      const frase = op === 'block' ? 'DESACTIVAR CONTACTO' : 'REACTIVAR';
      const escrito = window.prompt(
        (op === 'block'
          ? 'Se apagarán bot, promociones y seguimientos para este contacto.'
          : 'Se reactivará la automatización. No concede permiso de marketing.')
        + '\n\nEscribe ' + frase + ' para confirmar:') || '';
      if (escrito !== frase) { fallos.push([t.name, 'cancelado']); continue; }
      r = await llama({ action:'communicationPolicy', operation:op, conversation_id:conv,
        confirmation:escrito, reason:t.params.reason || 'Solicitado desde el Planificador' });
    }

    if (r.ok) hechas.push(NOMBRE_HERRAMIENTA[t.name] || t.name);
    else fallos.push([NOMBRE_HERRAMIENTA[t.name] || t.name, r.error || 'error']);
  }

  if (b) { b.disabled = false; b.textContent = 'Aprobar y aplicar'; }
  if (hechas.length && !fallos.length) {
    // Se marca el turno como aplicado en vez de borrarlo: el hilo tiene que conservar
    // que esto ya se hizo, o al releerlo mañana parece pendiente y se aplica dos veces.
    turno.plan.aplicado = true;
    pintaHilo();
    guardaHilo();
    avisa('Aplicado', hechas.length + ' acción(es)');
  } else {
    // Si algo salio, tambien se marca: reintentar repetiria lo que ya se hizo.
    if (hechas.length) { turno.plan.aplicado = true; pintaHilo(); guardaHilo(); }
    avisa(hechas.length ? 'Aplicado a medias' : 'No se pudo aplicar',
      fallos.map(([n,e]) => n + ': ' + traduceErrorMeta(e)).join(' · ').slice(0,180));
  }
  if (sel) { const f = CONVS.find(c => c._id === sel._id); if (f) pintaFicha(f); }
}

function textoDeBorrador(clave){
  if (clave === 'receipt') return 'Para confirmar tu reserva, envíanos por aquí el comprobante del abono '
    + 'y el nombre de la persona que hizo el pago.';
  if (clave === 'location') return [CFG.addressText || 'Te comparto nuestra ubicación.', CFG.mapsUrl || ''].filter(Boolean).join(' ');
  if (clave === 'portfolio') return 'Puedes ver nuestros combos, imágenes y todo lo que incluye cada opción aquí: '
    + (CFG.publicPortfolioUrl || CFG.publicCatalogUrl || '');
  if (clave === 'privateCombos') return CFG.privateCombosMessage
    || 'Te comparto los combos por aquí. Antes de confirmar disponibilidad necesito categoría, fecha tentativa y nombre.';
  return '';
}

/* ---- Sesión -------------------------------------------------------------- */
$('formAcceso').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = $('errorAcceso'); err.classList.remove('on');
  $('btnEntrar').disabled = true;
  try { await signInWithEmailAndPassword(auth, $('correo').value.trim(), $('clave').value); }
  catch (e) {
    err.textContent = e?.code === 'auth/invalid-credential'
      ? 'Correo o contraseña incorrectos.' : (e?.message || 'No se pudo entrar.');
    err.classList.add('on');
  }
  finally { $('btnEntrar').disabled = false; }
});
$('btnSalir').onclick = () => signOut(auth);

onAuthStateChanged(auth, async u => {
  if (!u) {
    $('acceso').classList.remove('oculto');
    $('app').classList.remove('on');
    if (paraMsgs) { paraMsgs(); paraMsgs = null; }
    return;
  }
  $('acceso').classList.add('oculto');
  $('app').classList.add('on');
  $('quien').textContent = u.email || '';
  // El historial se carga solo al entrar. No hay boton de "actualizar": la escucha
  // en vivo trae los cambios sin que nadie tenga que pedirlos.
  escuchaConversaciones();
  ve(location.hash.slice(1) || CFG.defaultView || 'conversations');
});
