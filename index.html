function diasAtras(n){
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - n); return d;
}

// --- Piezas de dibujo -------------------------------------------------------
function grafArea(puntos, etiquetas){
  const an = 640, al = 170, pad = { i:34, d:10, s:14, b:24 };
  const max = Math.max(1, ...puntos);
  const x = i => pad.i + i * (an - pad.i - pad.d) / Math.max(1, puntos.length - 1);
  const y = v => pad.s + (1 - v / max) * (al - pad.s - pad.b);
  const linea = puntos.map((v,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const area = linea + ' L' + x(puntos.length-1).toFixed(1) + ' ' + (al-pad.b) + ' L' + x(0) + ' ' + (al-pad.b) + ' Z';
  // Tres lineas de referencia, no diez: mas rayas no ayudan a leer, estorban.
  const guias = [0, .5, 1].map(p => {
    const v = Math.round(max * p);
    return '<line x1="' + pad.i + '" x2="' + (an-pad.d) + '" y1="' + y(v) + '" y2="' + y(v) + '" class="gguia"/>'
      + '<text x="' + (pad.i-7) + '" y="' + (y(v)+3.5) + '" class="gnum" text-anchor="end">' + v + '</text>';
  }).join('');
  const marcas = puntos.map((v,i) => (i % 3 === 0 || i === puntos.length-1)
    ? '<text x="' + x(i) + '" y="' + (al-7) + '" class="gnum" text-anchor="middle">' + esc(etiquetas[i]) + '</text>' : '').join('');
  const picos = puntos.map((v,i) => '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="2.5" class="gpunto">'
    + '<title>' + esc(etiquetas[i]) + ': ' + v + '</title></circle>').join('');
  return '<svg viewBox="0 0 ' + an + ' ' + al + '" class="graf" preserveAspectRatio="none">'
    + guias + '<path d="' + area + '" class="garea"/><path d="' + linea + '" class="glinea"/>'
    + picos + marcas + '</svg>';
}

function grafBarras(filas){
  const max = Math.max(1, ...filas.map(f => f.v));
  return '<div class="barras">' + filas.map(f =>
    '<div class="barra"><span class="be">' + esc(f.n) + '</span>'
    + '<span class="bp"><i style="width:' + Math.round(f.v / max * 100) + '%"></i></span>'
    + '<span class="bn">' + f.v + '</span></div>').join('') + '</div>';
}

function grafAnillo(filas){
  const total = filas.reduce((a,f) => a + f.v, 0) || 1;
  const R = 54, C = 2 * Math.PI * R;
  let acumulado = 0;
  const arcos = filas.filter(f => f.v).map(f => {
    const trozo = f.v / total * C;
    const el = '<circle cx="70" cy="70" r="' + R + '" class="ganillo" stroke="' + f.c + '" '
      + 'stroke-dasharray="' + trozo.toFixed(2) + ' ' + (C - trozo).toFixed(2) + '" '
      + 'stroke-dashoffset="' + (-acumulado).toFixed(2) + '"><title>' + esc(f.n) + ': ' + f.v + '</title></circle>';
    acumulado += trozo;
    return el;
  }).join('');
  return '<div class="anillo"><svg viewBox="0 0 140 140">' + arcos
    + '<text x="70" y="66" class="gtot" text-anchor="middle">' + total + '</text>'
    + '<text x="70" y="84" class="gnum" text-anchor="middle">total</text></svg>'
    + '<div class="leyenda">' + filas.filter(f => f.v).map(f =>
        '<span><i style="background:' + f.c + '"></i>' + esc(f.n) + ' <b>' + f.v + '</b></span>').join('')
    + '</div></div>';
}

function panel(titulo, nota, cuerpo){
  return '<div class="pgraf"><div class="pgcab"><b>' + esc(titulo) + '</b>'
    + (nota ? '<span>' + esc(nota) + '</span>' : '') + '</div>' + cuerpo + '</div>';
}

// --- Pintado ----------------------------------------------------------------
function pintaDashboard(){
  const c = $('cifras'); if (!c) return;
  const hoy = new Date().toDateString();
  const sinLeer = CONVS.filter(x => Number(x.unread||0) > 0).length;
  const humano = CONVS.filter(x => x.mode === 'human' || x.human_handoff_required).length;
  const deHoy = CONVS.filter(x => new Date(x.last_message_at || 0).toDateString() === hoy).length;
  const clientes = CONVS.filter(x => x.lifecycle_stage === 'cliente').length;
  const desint = CONVS.filter(x => x.lifecycle_stage === 'desinteresado').length;
  const excluidos = CONVS.filter(x => x.proactive_blocked_at).length;
  const vencidos = CONVS.filter(x => x.follow_up_at && new Date(x.follow_up_at) <= new Date()
    && !['cerrado','perdido','desinteresado'].includes(x.lifecycle_stage)).length;

  // Las cifras que piden accion se marcan; el resto es contexto. Si todo grita, nada grita.
  const cifra = (n, t, nota, tono) => '<button class="cifra' + (tono ? ' ' + tono : '')
    + '" data-ir="' + esc(t) + '"><b>' + n + '</b><span>' + esc(t) + '</span>'
    + (nota ? '<i>' + esc(nota) + '</i>' : '') + '</button>';

  // Los dormidos se cuentan aparte. Meterlos en "Conversaciones" infla el numero con
  // gente que lleva meses sin escribir y hace parecer que hay mas trabajo del que hay.
  const dormidos = CONVS.filter(enElOlvido).length;
  const vivas = CONVS.length - dormidos;

  c.innerHTML = cifra(vivas, 'Conversaciones', dormidos ? dormidos + ' dormidas aparte' : 'en total')
    + cifra(sinLeer, 'Sin leer', sinLeer ? 'esperando respuesta' : 'al día', sinLeer ? 'ojo' : '')
    + cifra(vencidos, 'Seguimientos vencidos', vencidos ? 'ya tocaba' : 'ninguno', vencidos ? 'mal' : '')
    + cifra(humano, 'Esperando a una persona')
    + cifra(deHoy, 'Activas hoy')
    + cifra(clientes, 'Clientes', 'ya compraron', clientes ? 'bien' : '')
    + cifra(desint + excluidos, 'Fuera de marketing', desint + ' desinteresados · ' + excluidos + ' excluidos')
    + cifra(dormidos, 'Dormidos', dormidos ? 'más de ' + DIAS_INACTIVO + ' días · pendientes de limpiar' : 'ninguno',
        dormidos ? 'ojo' : '')
    // Aparte y sin sumar en ninguna otra: familia, numeros propios y colegas no son negocio.
    + (CONVS_IGNORADAS.length ? cifra(CONVS_IGNORADAS.length, 'Ignoradas', 'fuera de todas las cifras') : '');

  // Pulsar una cifra lleva a verla, no solo la enseña. Un numero sin a donde ir obliga
  // a rehacer el filtro a mano en la otra pantalla.
  c.onclick = ev => {
    const b = ev.target.closest('[data-ir]'); if (!b) return;
    const a = b.dataset.ir;
    if (a === 'Seguimientos vencidos') return ve('reminders');
    if (a === 'Clientes') { filtro = 'todos'; ve('funnel'); return; }
    if (a === 'Sin leer') { filtro = 'sinleer'; ve('conversations'); pintaChats(); return; }
    if (a === 'Esperando a una persona') { filtro = 'humano'; ve('conversations'); pintaChats(); return; }
    if (a === 'Dormidos') return ve('limpieza');
    if (a === 'Ignoradas') { filtro = 'ignorados'; ve('conversations'); pintaChats(); return; }
    ve('conversations');
  };

  // --- Actividad de los ultimos 14 dias
  const dias = [], etiq = [];
  for (let i = 13; i >= 0; i--) {
    const d = diasAtras(i), sig = diasAtras(i-1);
    dias.push(CONVS.filter(x => {
      const t = new Date(x.last_message_at || 0);
      return t >= d && t < sig;
    }).length);
    etiq.push(d.getDate() + '/' + (d.getMonth()+1));
  }

  const porEtapa = ETAPAS.map(e => ({ n: e.replace(/_/g,' '),
    v: CONVS.filter(x => (x.lifecycle_stage || 'nuevo') === e).length }));

  const porCanal = Object.keys(CANALES)
    .map(k => ({ n: CANALES[k].corto, v: CONVS.filter(x => canalDe(x) === k).length, c: CANALES[k].color }))
    .filter(f => f.v);

  // Embudo: cada etapa como porcentaje de las que llegaron a la anterior. Es la unica
  // cifra que dice DONDE se pierde la gente, que es lo que se quiere arreglar.
  const orden = ['nuevo','interesado','cotizando','pendiente_reserva','reservado','cliente'];
  const cuentaEtapa = e => CONVS.filter(x => (x.lifecycle_stage || 'nuevo') === e).length;
  const acumulado = orden.map((e,i) => orden.slice(i).reduce((a,x) => a + cuentaEtapa(x), 0));
  const embudo = orden.map((e,i) => {
    const de = acumulado[i], antes = i ? acumulado[i-1] : de;
    return { n: e.replace(/_/g,' '), v: de, pct: antes ? Math.round(de / antes * 100) : 100 };
  });

  $('tablero').innerHTML =
    panel('Actividad', 'últimos 14 días', grafArea(dias, etiq))
    + panel('Por etapa', CONVS.length + ' contactos', grafBarras(porEtapa))
    + panel('Por canal', 'de dónde escriben', grafAnillo(porCanal))
    + panel('Embudo', 'cuánta gente pasa de una etapa a la siguiente',
        '<div class="embudo">' + embudo.map((f,i) =>
          '<div class="epaso"><span class="en">' + esc(f.n) + '</span>'
          + '<span class="eb"><i style="width:' + (embudo[0].v ? Math.round(f.v / embudo[0].v * 100) : 0) + '%"></i></span>'
          + '<span class="ev">' + f.v + (i ? ' <em>' + f.pct + '%</em>' : '') + '</span></div>').join('')
        + '</div>');
}

// Un lead se queda parado por razones concretas y casi siempre las mismas. Esto las
// detecta y dice QUE hacer, con el boton al lado. No mueve nada solo: mover a alguien
// de etapa cambia lo que el sistema le va a mandar despues.
const REGLAS_LEAD = [
  {

      + 'qué tipo de sesión quiere, sin que parezca un formulario.',
  },
  {
    id: 'cotiza_sin_fecha',
    aplica: c => ['interesado','cotizando'].includes(c.lifecycle_stage) && !c.tentative_date,
    titulo: 'Cotiza pero no pone fecha',

function leadsParados(){
  const vivos = CONVS.filter(c => !enElOlvido(c)
    && !['cliente','perdido','desinteresado'].includes(c.lifecycle_stage)
    && !c.proactive_blocked_at);
  return REGLAS_LEAD.map(r => ({ regla: r, filas: vivos.filter(r.aplica) })).filter(x => x.filas.length);
}

// Las tarjetas de leads parados que estan abiertas (ven hasta 25 en vez de 6).
const LP_ABIERTAS = new Set();

function pintaMovilizacion(){
  const cont = $('movil'); if (!cont) return;
  const grupos = leadsParados();
  if (!grupos.length) {
    cont.innerHTML = vacioApple('<circle cx="12" cy="12" r="8.600"/><path d="M8.200 12.300l2.600 2.600 5-5.400"/>',
      'Ningún lead está parado', 'Todos tienen categoría, fecha y el siguiente paso claro.');
    return;
  }
  // Una rejilla de tarjetas de la MISMA medida (antes cada regla era un bloque de todo el ancho, con
  // una fila de 1.100 px por contacto y el boton perdido a la derecha). Cada tarjeta ensena seis y
  // se abre para ver hasta 25; el resto se trabaja desde el chat.
  const filaLead = (c, g) => '<div class="lp-fila"><div class="lp-quien"><b>' + esc(nombreDe(c)) + '</b>'
    + '<small>' + esc((c.lifecycle_stage || 'nuevo').replace(/_/g, ' ')) + ' · ' + llevaDormido(c) + ' días'
    + (c.interested_category ? ' · ' + esc(c.interested_category) : '') + '</small></div>'
    + '<div class="lp-acc"><button class="btn-linea" data-mov="' + esc(g.regla.id) + '" data-conv="' + esc(c._id || c.id) + '">'
    +   esc(g.regla.hacer) + '</button>'
    + (g.regla.etapa && c.lifecycle_stage !== g.regla.etapa
      ? '<button class="btn-linea" title="Mover a ' + esc(g.regla.etapa.replace(/_/g, ' ')) + '" data-avanza="' + esc(g.regla.id)
        + '" data-conv="' + esc(c._id || c.id) + '">Avanzar</button>' : '')
    + '</div></div>';
  cont.innerHTML = '<div class="lp-grid">' + grupos.map(g => {
    const abierta = LP_ABIERTAS.has(g.regla.id);
    const tope = abierta ? 25 : 6;
    return '<section class="lp-card"><div class="lp-cab"><b>' + esc(g.regla.titulo) + '</b>'
      + '<span class="lp-num">' + g.filas.length + '</span></div>'
      + '<p class="lp-porque">' + esc(g.regla.porque) + '</p>'
      + g.filas.slice(0, tope).map(c => filaLead(c, g)).join('')
      + (g.filas.length > 6
        ? '<button class="lp-mas" data-lpmas="' + esc(g.regla.id) + '">'
          + (abierta ? 'Ver menos' : 'Ver ' + Math.min(25, g.filas.length) + (g.filas.length > 25 ? ' de ' + g.filas.length : '')) + '</button>' : '')
      + '</section>';
  }).join('') + '</div>';

  cont.onclick = async ev => {
    const mas = ev.target.closest('[data-lpmas]');
    if (mas) {
      const id = mas.dataset.lpmas;
      if (LP_ABIERTAS.has(id)) LP_ABIERTAS.delete(id); else LP_ABIERTAS.add(id);
      return pintaMovilizacion();
    }
    const avanzar = ev.target.closest('[data-avanza]');
    if (avanzar) {
      const c = buscaConv(avanzar.dataset.conv);
      const r = REGLAS_LEAD.find(x => x.id === avanzar.dataset.avanza);
      if (!c || !r?.etapa) return;
      if (!await confirmaAqui('Mover a ' + nombreDe(c) + ' de «' + (c.lifecycle_stage || 'nuevo').replace(/_/g,' ')
        + '» a «' + r.etapa.replace(/_/g,' ') + '».\n\nCriterio: ' + r.porque + '\n\n'
        + 'No se enviará ningún mensaje automáticamente.')) return;
      avanzar.disabled = true;
      const campos = { lifecycle_stage:r.etapa, next_step_suggested:r.siguiente || r.porque };
      const respuesta = await llama({ action:'updateLead', conversation_id:c.id || c._id, fields:campos });
      avanzar.disabled = false;
      if (!respuesta.ok) return avisa('No se pudo avanzar', respuesta.error);
      Object.assign(c, campos);
      avisa('Lead avanzado', 'El siguiente paso quedó documentado; no se envió ningún mensaje.');
      pintaMovilizacion(); pintaChats();
      return;
    }
    const b = ev.target.closest('[data-mov]'); if (!b) return;
    const c = buscaConv(b.dataset.conv);
    const r = REGLAS_LEAD.find(x => x.id === b.dataset.mov);
    if (!c) return;
    // Se abre la conversacion SIEMPRE, aunque haya prompt: hay que ver con quien se
    // habla antes de mandarle nada.
    abre(c);
    ve('conversations');
    if (!r?.prompt) return;
    // Y el prompt se deja preparado en un hilo del asistente de ESE contacto, no se ejecuta solo.
    // Antes caia en Planificacion a secas y valia porque `sel` apuntaba a el; el contacto
    // ahora lo define el hilo.
    setTimeout(() => preguntaAlAsistente(c, r.prompt), 250);
  };
}

/* ---- Limpieza del histórico ---------------------------------------------- */
// El dueño lo dijo claro: los que escribieron al WhatsApp API llevan MESES sin
// interes, no deben contar para nada hasta que demuestren lo contrario, y se les hace
// UN acercamiento -- uno, no una secuencia -- programado para mañana. Si no responden,
// desinteresados.
//
// Dos decisiones deliberadas:
//   · Se excluye el canal de WhatsApp Web, como pidio. Ese numero tiene otra historia.
//   · Nada sale hoy. Se programa. Doscientos mensajes de golpe a gente dormida hace
//     meses es exactamente el patron que hace que Meta degrade el numero.
const DIAS_INACTIVO = 60;

function llevaDormido(c){
  const t = Date.parse(String(c.last_message_at || '')) || 0;
  return t ? Math.floor((Date.now() - t) / 86400000) : 9999;
}
// Un contacto "en el olvido" no cuenta para las metricas del dia a dia. No es lo mismo
// que desinteresado: a este todavia no se le ha preguntado.
function enElOlvido(c){
  if (['cliente','reservado','desinteresado','perdido'].includes(c.lifecycle_stage)) return false;
  if (c.proactive_blocked_at) return false;
  if (canalDe(c) === 'whatsapp_qr') return false;      // el segundo numero queda fuera
  return llevaDormido(c) >= DIAS_INACTIVO;
}

// Las tres herramientas en lote comparten una regla: SIEMPRE se puede simular antes. El
// panel viejo ya lo hacia asi y no es capricho -- estas tres tocan cientos de fichas de una
// vez, y una de ellas escribe a clientes reales. Ver el numero antes de pulsar es la
// diferencia entre una herramienta util y una que da miedo usar.
function cableaLotes(){
  const num = v => Number(v || 0);
  const pintaResumen = (id, r, titulo) => {
    const c = $(id); if (!c) return;
    if (!r.ok) { c.innerHTML = '<p class="bajada">' + esc(r.error || 'No se pudo.') + '</p>'; return; }
    const filas = Object.entries(r).filter(([k, v]) => typeof v === 'number' && v !== 0);
    c.innerHTML = '<div class="dato"><div class="k">' + esc(titulo) + '</div><div class="v">'
      + (filas.length ? filas.map(([k, v]) => esc(k) + ': ' + v).join(' · ') : 'Nada que hacer')
      + '</div></div>'
      + ((r.errors || []).length ? '<p class="bajada">' + r.errors.length + ' con error.</p>' : '');
  };

  // --- Auto bot ---
  const cargaAuto = dry => llama({
    action:'followup', mode:'smart_templates', dry,
    purpose: $('atPurpose').value || 'both',
    min_hours: num($('atMinHoras').value) || 6,
    repeat_days: num($('atRepetir').value) || 3,
    stage: $('atEtapa').value || '', category: $('atCat').value || '', priority: $('atPri').value || '',
  });
  $('atSimular').onclick = async () => {
    const b = $('atSimular'); b.disabled = true;
    pintaResumen('atCuerpo', await cargaAuto(true), 'Simulación · no se envió nada');
    b.disabled = false;
  };
  $('atEnviar').onclick = async () => {
    // Esto escribe a clientes REALES. Se pregunta, y se dice cuantos antes de mandar.
    const previo = await cargaAuto(true);
    if (!previo.ok) return avisa('No se pudo simular', previo.error);
    const cuantos = num(previo.templateSent) + num(previo.textSent) + num(previo.followUps);
    if (!cuantos) return avisa('No hay a quién', 'Con esos filtros no entra nadie.');
    if (!await confirmaAqui('Se va a escribir a ' + cuantos + ' contacto(s) con plantilla aprobada.\n\n'
      + 'Quien pidió la baja no recibe nada. ¿Seguimos?')) return;
    const b = $('atEnviar'); b.disabled = true; b.textContent = 'Enviando…';
    pintaResumen('atCuerpo', await cargaAuto(false), 'Enviado');
    b.disabled = false; b.textContent = 'Enviar de verdad';
  };

  // --- Etiquetas en lote ---
  const cargaEtq = dry => llama({
    action:'followup', mode:'sync_tags', dry,
    limit: Math.min(500, num($('etLimite').value) || 200),
    use_ai: $('etIa').value !== '0',
    stage: $('etEtapa').value || '', category: $('etCat').value || '',
  });
  $('etSimular').onclick = async () => {
    const b = $('etSimular'); b.disabled = true;
    pintaResumen('etCuerpo', await cargaEtq(true), 'Simulación · no se cambió nada');
    b.disabled = false;
  };
  $('etAplicar').onclick = async () => {
    if (!await confirmaAqui('¿Aplicar los cambios de etiqueta a las conversaciones que entren en el filtro?')) return;
    const b = $('etAplicar'); b.disabled = true; b.textContent = 'Aplicando…';
    pintaResumen('etCuerpo', await cargaEtq(false), 'Aplicado');
    b.disabled = false; b.textContent = 'Aplicar';
  };

  // --- Reparar etapas ---
  $('etpRevisar').onclick = async () => {
    const b = $('etpRevisar'); b.disabled = true;
    const r = await llama({ action:'stageRepair', operation:'scan' });
    b.disabled = false;
    const c = $('etpCuerpo');
    if (!r.ok) { c.innerHTML = '<p class="bajada">' + esc(r.error || 'error') + '</p>'; return; }
    const n = num(r.total) || (r.invalidas || []).length;
    // Se ensena QUE se va a cambiar y a QUE, no solo cuantas. Mover fichas a "cliente" las
    // mete en el conteo de ventas: quien pulsa tiene derecho a ver antes si eso cuadra con
    // lo que recuerda, y a reconocer algunos nombres de la lista.
    // Cada etapa rota lleva su propio desplegable. La traduccion por defecto acierta con
    // 'descalificado', pero 'cerrado' NO es obvia: en esta base hay fichas 'cerrado' cuyo
    // estado sigue siendo requiere_humano o abierto, y darlas por vendidas mete ventas que
    // no existen. Eso lo decide quien conoce el negocio, no el que escribio el codigo.
    const porEtapa = Object.entries(r.por_etapa || {})
      .map(([e, k]) => '<div class="campo"><label>' + k + ' con etapa «' + esc(e) + '» pasan a</label>'
        + '<select data-etp-destino="' + esc(e) + '">'
        // Sin traduccion confirmada no se preselecciona nada: una opcion ya elegida se
        // acepta sin mirar, y aqui hay que mirar. Quien repara tiene que decidirlo.
        + (((r.traducciones || {})[e]) ? '' : '<option value="">— elige a dónde —</option>')
        + ETAPAS.map(v => '<option value="' + esc(v) + '"'
            + (((r.traducciones || {})[e] || '') === v ? ' selected' : '') + '>' + esc(v) + '</option>').join('')
        + '</select></div>')
      .join('');
    const muestra = (r.filas || []).slice(0, 8)
      .map(f => '<div class="dato"><div class="k">' + esc(hora(f.last_message_at)) + '</div>'
        + '<div class="v">' + esc(f.name || '') + ' · ' + esc(f.lead_status || 'sin estado') + '</div></div>')
      .join('');
    c.innerHTML = '<div class="dato"><div class="k">Fichas con etapa rota</div><div class="v">' + n + '</div></div>'
      + porEtapa
      + (muestra ? '<div class="seccion" style="margin:14px 0 6px">Las más recientes</div>' + muestra : '');
    // El boton solo se enciende si de verdad hay algo que mover: un boton activo que no
    // hace nada al pulsarlo se lee como que el panel fallo.
    $('etpAplicar').disabled = !n;
  };
  $('etpAplicar').onclick = async () => {
    const elegido = [...document.querySelectorAll('[data-etp-destino]')]
      .map(s => s.dataset.etpDestino + ' → ' + s.value).join('\n');
    if (!await confirmaAqui('Se van a reparar las fichas así:\n\n' + elegido
      + '\n\nSe guarda la etapa original por si hay que revisarlo. ¿Seguimos?')) return;
    const b = $('etpAplicar'); b.disabled = true; b.textContent = 'Moviendo…';
    // Se manda lo que el dueno dejo elegido en los desplegables, no lo que el servidor
    // traduciria por su cuenta. Si la vista previa dice una cosa y el envio hace otra, la
    // vista previa no sirve de nada.
    const destinos = {};
    // Una etapa sin destino elegido se queda como esta y se reporta: el servidor la mete en
    // sin_traduccion y el aviso lo dice. Es preferible a colarla en cualquier sitio.
    document.querySelectorAll('[data-etp-destino]').forEach(s => {
      if (s.value) destinos[s.dataset.etpDestino] = s.value;
    });
    const r = await llama({ action:'stageRepair', operation:'apply', destinos });
    b.textContent = 'Mover a cliente';
    if (!r.ok) { b.disabled = false; return avisa('No se pudo', r.error); }
    const sobran = (r.sin_traduccion || []).length
      ? ' Quedaron ' + r.sin_traduccion.length + ' etapa(s) que nadie sabe traducir: ' + r.sin_traduccion.join(', ') + '.'
      : '';
    avisa('Etapas reparadas', (r.movidas || 0) + ' ficha(s) reparadas.' + sobran);
    $('etpRevisar').click();
  };
}

  const aTocar = olvidados.filter(c => Number(c.followup_attempts || 0) < 2);

// El servidor ya tiene la norma implementada y sabe aplicarla en bloque: scan lista sin
// tocar nada, apply marca todas. Se usa esa, no una copia en el panel: la regla de
// negocio tiene que vivir en un solo sitio o las dos acaban discrepando.
async function escaneaDesinteres(){
  const b = $('recoEscanear');
  b.disabled = true;
  $('recoCuerpo').innerHTML = '<p class="bajada"><span class="cargando"></span> Recorriendo el historial…</p>';
  const r = await llama({ action:'disinterest', operation:'scan' });
  b.disabled = false;
  if (!r.ok) { $('recoCuerpo').innerHTML = ''; return avisa('No se pudo escanear', r.error); }
  // 'candidatas', en femenino y sin traducir. Se leia 'candidates || candidatos || rows' y
  // NINGUNA existe: filas salia siempre vacia, asi que la herramienta contestaba "el
  // historial ya esta al dia" aunque el servidor hubiera encontrado ciento ochenta. Un falso
  // todo-en-orden es peor que un error: el error se investiga, esto se cree.
  const filas = r.candidatas || [];
  // El servidor devuelve la lista RECORTADA a 200, pero 'apply' marca TODAS las que
  // encuentre --barre hasta 2000 conversaciones--. El panel contaba filas.length, asi que con
  // mas de 200 candidatas leias "Marcar los 200", confirmabas "Se marcaran 200 contactos" y
  // se marcaban, por ejemplo, 380. A los 180 que nunca viste se les apaga el marketing y los
  // seguimientos de golpe, y eso no se deshace con un boton.
  //
  // El total venia en la respuesta desde el principio; solo habia que mirarlo.
  const total = Number.isFinite(Number(r.total)) ? Number(r.total) : filas.length;
  const recortada = total > filas.length;
  if (!filas.length) {
    $('recoCuerpo').innerHTML = '<p class="bajada">Ninguno. El historial ya está al día: nadie '
      + 'cumple la norma sin estar marcado.</p>';
    return;
  }
  $('recoCuerpo').innerHTML = '<div class="propuesta" style="max-width:900px">'
    + '<div class="tapa"><b>' + total + ' contacto(s) deberían estar marcados</b></div>'
    + '<div class="cuerpo"><p class="aviso" style="margin:0 0 10px">Recibieron dos seguimientos y no '
    +   'contestaron. Marcarlos apaga marketing y seguimientos; pueden seguir escribiendo y se les '
    +   'puede contestar a mano.</p>'
    + '<div class="destinos">' + filas.slice(0,80).map(f =>
        '<span>' + esc(f.customer_name || f.contact_name || f.wa_phone || f.conversation_id) + '</span>').join('')
    + (total > 80 ? '<span>… y ' + (total-80) + ' más</span>' : '') + '</div></div>'
    + (recortada ? '<p class="aviso" style="margin:0 12px 10px">De los ' + total + ' solo se '
        + 'pueden listar ' + filas.length + ' aquí, pero el botón los marca <b>todos</b>.</p>' : '')
    + '<div class="patas"><button class="btn-solido" id="recoAplicar">Marcar los ' + total + '</button>'
    +   '<button class="btn-linea" id="recoCancelar">Cancelar</button></div></div>';
  $('recoCancelar').onclick = () => { $('recoCuerpo').innerHTML = ''; };
  $('recoAplicar').onclick = async () => {
    if (!await confirmaAqui('Se marcarán ' + total + ' contactos como desinteresados.\n\n'
      + 'Dejan de contar en las métricas y de recibir marketing y seguimientos.\n\n¿Continuar?')) return;
    const ap = $('recoAplicar');
    ap.disabled = true; ap.textContent = 'Marcando…';
    const r2 = await llama({ action:'disinterest', operation:'apply' });
    ap.disabled = false;
    if (!r2.ok) { ap.textContent = 'Marcar los ' + total; return avisa('No se pudo aplicar', r2.error); }
    $('recoCuerpo').innerHTML = '<p class="bajada">Historial reconstruido: '
      + (r2.marcadas ?? total) + ' contacto(s) marcados.</p>';
    avisa('Historial reconstruido', 'Ya no cuentan en las métricas.');
  };
}

async function programaAcercamiento(lista){
  const base = $('limTexto').value.trim();
  if (!base) return avisa('Escribe el mensaje base');
  const mañana = new Date(); mañana.setDate(mañana.getDate() + 1); mañana.setHours(10, 0, 0, 0);
  if (!await confirmaAqui('Se programa UN acercamiento para ' + lista.length + ' contactos, mañana a las 10:00.\n\n'
    + 'No sale nada hoy. Cada mensaje va personalizado y aparecerá en Recordatorios para '
    + 'revisarlo antes de enviarlo.\n\n¿Continuar?')) return;
  const b = $('limProgramar');
  b.disabled = true;
  let hechos = 0; const fallos = [];
  for (const c of lista) {
    b.textContent = 'Programando ' + (hechos + 1) + ' de ' + lista.length + '…';
    const r = await llama({ action:'updateLead', conversation_id: c.id || c._id, fields:{
      follow_up_at: mañana.toISOString(),
      pending_questions: personaliza(base, c),
      next_step_suggested: 'Último acercamiento antes de darlo por desinteresado.',
    }});
    if (r.ok) { hechos++; Object.assign(c, { follow_up_at: mañana.toISOString() }); }
    else fallos.push(nombreDe(c) + ': ' + r.error);
  }
  b.disabled = false;
  avisa('Programados ' + hechos + ' de ' + lista.length,
    fallos.length ? fallos.slice(0,2).join(' · ') : 'Mañana a las 10:00, en Recordatorios.');
  pintaLimpieza();
}

async function descartaOlvidados(lista){
  if (!await confirmaAqui('Se marcan ' + lista.length + ' contactos como desinteresados.\n\n'
    + 'Ya recibieron dos seguimientos sin contestar. Dejan de recibir marketing y '
    + 'seguimientos, y dejan de contar en las métricas. Pueden seguir escribiendo.\n\n'
    + '¿Continuar?')) return;
  const b = $('limDescartar');
  b.disabled = true;
  let hechos = 0;
  for (const c of lista) {
    b.textContent = 'Marcando ' + (hechos + 1) + ' de ' + lista.length + '…';
    const r = await llama({ action:'disinterest', operation:'mark', conversation_id: c.id || c._id,
      reason: 'sin respuesta tras dos seguimientos, más de ' + DIAS_INACTIVO + ' días dormido' });
    if (r.ok) { hechos++; c.lifecycle_stage = 'desinteresado'; }
  }
  b.disabled = false;
  avisa('Marcados ' + hechos + ' de ' + lista.length, 'Ya no cuentan en las métricas.');
  pintaLimpieza();
  pintaChats();
}

// Analiza el CRM cada dia y PROPONE campañas con cifras reales (firebase-functions/src/marketing-agent.js).
// Nunca envia nada: «Preparar» abre el formulario o el compositor de Estados con todo puesto, y ahi

// ---- Agente de marketing: piezas puras
const MK_TIPOS = { seguimiento: 'Seguimiento', conversion: 'A fotografía', reactivacion: 'Reactivación', temporada: 'Temporada', demanda: 'Demanda', fidelizacion: 'Fidelización', plantilla: 'Plantilla de Meta' };
const MK_CANALES = { estado: 'Estado de WhatsApp', plantilla: 'Plantilla aprobada', libre: 'Mensaje libre' };
const MK_PRIORIDADES = { alta: 'Prioridad alta', media: 'Prioridad media', baja: 'Prioridad baja' };
function cuantoHace(iso, ahora = Date.now()){
  const t = Date.parse(String(iso || ''));
  if (!Number.isFinite(t)) return '';
  const min = Math.max(0, Math.round((ahora - t) / 60000));
  if (min < 2) return 'hace un momento';
  if (min < 60) return 'hace ' + min + ' min';
  if (min < 1440) return 'hace ' + Math.round(min / 60) + ' h';
  return 'hace ' + Math.round(min / 1440) + ' d';
}
function nuevasMarketing(propuestas){ return (propuestas || []).filter(p => p.estado === 'nueva').length; }
// El reparto de una audiencia entre las dos lineas: la oficial (API: texto libre dentro de 24 h, plantilla fuera) y el 5644.
function lineasMarketing(a, canal){
  const l = a && a.por_linea; if (!l) return '';
  const o = l.oficial || { total: 0 }, pu = l.puente || { total: 0 };
  return '<div class="mk-lineas">' + (canal === 'estado' ? '<span class="mk-lineas-rot">Si además les escribes directo</span>' : '')
    + '<span class="mk-linea"><b>Número oficial</b> ' + Number(o.total) + (o.total ? '<small>' + Number(o.en_ventana) + ' dentro de 24 h · ' + Number(o.con_plantilla) + ' con plantilla</small>' : '') + '</span>'
    + '<span class="mk-linea"><b>Segundo número (5644)</b> ' + Number(pu.total) + '<small>texto libre, con ritmo</small></span></div>';
}
// Quien queda fuera de la audiencia por lo que dijo, con el motivo de cada uno.
function fueraMarketing(a){
  const d = a && a.descartados; if (!d || !d.total) return '';
  return '<details class="mk-fuera"><summary>' + Number(d.total) + (d.total === 1 ? ' persona queda fuera' : ' personas quedan fuera') + ' por lo que dijeron</summary><ul>'
    + (d.motivos || []).map(m => '<li><b>' + Number(m.n) + '</b> ' + esc(m.motivo) + '</li>').join('')
    + '</ul>' + ((d.ejemplos || []).length ? '<p class="mk-fuera-ej">' + d.ejemplos.slice(0, 4).map(e => esc(e.nombre) + (e.evidencia ? ' («' + esc(e.evidencia) + '»)' : '')).join(' · ') + '</p>' : '')
    + '</details>';
}
function plantillaMarketing(p){
  const t = p.plantilla; if (!t || p.tipo === 'plantilla') return '';
  const e = { aprobada: ['ok', 'Plantilla aprobada: ' + t.nombre], pendiente: ['espera', 'Plantilla en revisión de Meta'], rechazada: ['mal', 'Meta rechazó la plantilla'], falta: ['falta', 'Falta la plantilla en Meta'] }[t.estado];
  return e ? '<span class="mk-tpl ' + e[0] + '">' + esc(e[1]) + '</span>' : '';
}
function tarjetaMarketing(p){
  const nueva = p.estado === 'nueva';
  const ejemplos = (p.audiencia && p.audiencia.ejemplos || []).slice(0, 3);
  return '<article class="mk-card ' + esc(p.prioridad) + (nueva ? '' : ' decidida') + '" data-mk="' + esc(p.id) + '">'
    + '<div class="mk-cab"><span class="mk-prio ' + esc(p.prioridad) + '">' + esc(MK_PRIORIDADES[p.prioridad] || 'Prioridad') + '</span>'
    +   '<span class="mk-tipo">' + esc(MK_TIPOS[p.tipo] || 'Propuesta') + '</span>'
    +   (p.fuente === 'ia' ? '<span class="mk-ia" title="La redacción la mejoró la IA">IA</span>' : '') + '</div>'
    + '<h4>' + esc(p.titulo) + '</h4>'
    + '<p class="mk-motivo">' + esc(p.motivo) + '</p>'
    + (p.tipo === 'plantilla'
      ? '<div class="mk-datos"><span class="mk-aud"><small>' + esc(p.audiencia && p.audiencia.etiqueta || '') + '</small></span><span class="mk-canal">Categoría ' + esc(p.accion && p.accion.category || 'MARKETING') + '</span></div>'
      : '<div class="mk-datos"><span class="mk-aud"><b>' + Number(p.audiencia && p.audiencia.total || 0) + '</b> ' + esc(p.audiencia && p.audiencia.etiqueta || '')
        +   (ejemplos.length ? ' <small>· ' + esc(ejemplos.join(', ')) + '…</small>' : '') + '</span>'
        +   '<span class="mk-canal">' + esc(MK_CANALES[p.canal] || p.canal) + '</span></div>'
        + lineasMarketing(p.audiencia, p.canal) + plantillaMarketing(p))
    + fueraMarketing(p.audiencia)
    + '<blockquote class="mk-texto">' + esc(p.tipo === 'plantilla' && p.accion ? p.accion.body_text : p.texto) + '</blockquote>'
    + (p.tipo === 'plantilla' && p.accion ? '<p class="mk-pie">Pie: ' + esc(p.accion.footer_text) + ' · {{1}} = el nombre. Meta la revisa antes de poder usarla.</p>' : '')
    + '<div class="mk-acc">'
    + (nueva
      ? (p.tipo === 'plantilla'
          ? '<button class="btn-solido" data-mkacc="meta" data-id="' + esc(p.id) + '">Enviar a Meta</button>'
          : '<button class="btn-solido" data-mkacc="preparar" data-id="' + esc(p.id) + '">Preparar</button>'
            + (p.accion && p.accion.tipo === 'campana' && p.audiencia && p.audiencia.por_linea && p.audiencia.por_linea.puente && p.audiencia.por_linea.puente.total
              ? '<button class="btn-linea" data-mkacc="preparar5644" data-id="' + esc(p.id) + '" title="Prepara la campaña para quienes escriben por el segundo número">Preparar por el 5644</button>' : ''))
        + '<button class="btn-linea" data-mkacc="descartar" data-id="' + esc(p.id) + '">Descartar</button>'
      : '<span class="mk-estado">' + (p.estado === 'aceptada' ? 'Preparada' : 'Descartada') + '</span>'
        + '<button class="btn-linea" data-mkacc="reabrir" data-id="' + esc(p.id) + '">Reabrir</button>')
    + '</div></article>';
}
// ---- Agente de marketing: fin de las piezas puras

let MK = { cargado: false, cargando: false, propuestas: [], ultima: null, resumen: '', ia: false, activo: true, error: '', verDecididas: false,
  descartes: { total: 0, items: [] }, preparada: null };

// Las conversaciones que el agente sugiere descartar segun lo que dijeron. Descartar = desinteresado (reversible); Mantener = no se vuelve a sugerir en 30 días.
function bloqueDescartes(d){
  if (!d || !d.total) return '';
  const filas = (d.items || []).slice(0, 8).map(i => '<div class="mk-desc-fila"><span><b>' + esc(i.nombre) + '</b> <small>' + esc(i.linea === 'puente' ? '5644' : 'oficial') + '</small>'
    + '<em>' + esc(i.motivo) + (i.evidencia ? ' · «' + esc(i.evidencia) + '»' : '') + '</em></span>'
    + '<span class="mk-desc-acc"><button class="btn-linea" data-mkacc="desc" data-ids="' + esc(i.id) + '">Descartar</button>'
    + '<button class="btn-linea" data-mkacc="mant" data-ids="' + esc(i.id) + '">Mantener</button></span></div>').join('');
  return '<div class="mk-descartes"><div class="mk-desc-cab"><div><b>' + Number(d.total) + ' conversaciones conviene descartar</b>'
    + '<p>Por lo que dijeron o porque llevan meses sin escribir. Nada se borra: pasan a «desinteresado» y salen de las campañas.</p></div>'
    + '<button class="btn-linea" data-mkacc="descTodos">Descartar las ' + Number(d.total) + '</button></div>' + filas
    + (d.total > 8 ? '<p class="mk-desc-mas">Y ' + (d.total - 8) + ' más; salen al ir decidiendo estas.</p>' : '') + '</div>';
}

function pintaCuentaMarketing(){
  const e = document.querySelector('[data-cuenta="campanas"]');
  if (!e) return;
  const n = nuevasMarketing(MK.propuestas);
  e.textContent = n; e.hidden = n === 0;
}

async function cargaMarketing({ silencioso = false } = {}){
  if (!['admin', 'supervisor'].includes(ROL_ACTUAL) || MK.cargando) return;
  MK.cargando = true;
  const r = await llama({ action: 'marketingList' });
  MK.cargando = false;
  if (!r.ok) { if (!silencioso) { MK.error = r.error || 'No se pudo leer'; pintaMarketing(); } return; }
  MK = { ...MK, cargado: true, propuestas: r.propuestas || [], ultima: r.ultima_pasada_at || null, resumen: r.resumen_ia || '',
    ia: r.ia_usada === true, activo: r.activo !== false, error: '', descartes: r.descartes || { total: 0, items: [] } };
  pintaCuentaMarketing();
  pintaMarketing();
}

function pintaMarketing(){
  const c = $('mkAgente'); if (!c) return;
  if (!['admin', 'supervisor'].includes(ROL_ACTUAL)) { c.innerHTML = ''; return; }
  const nuevas = MK.propuestas.filter(p => p.estado === 'nueva');
  const decididas = MK.propuestas.filter(p => p.estado !== 'nueva');
  const estado = !MK.cargado ? (MK.error ? esc(MK.error) : 'Leyendo…')
    : !MK.activo ? 'Apagado en Configuración'
    : MK.ultima ? 'Analizó ' + esc(cuantoHace(MK.ultima)) + ' · ' + nuevas.length + (nuevas.length === 1 ? ' propuesta' : ' propuestas')
    : 'Todavía no ha analizado nada';
  c.innerHTML = '<section class="mk"><div class="mk-cabecera"><div><h2>Agente de marketing</h2>'
    + '<p>Analiza tus conversaciones y ventas cada mañana y te propone qué campaña hacer. <b>No envía nada</b> hasta que tú lo apruebes.</p>'
    + '<small class="mk-est">' + estado + '</small></div>'
    + '<button class="btn-linea" data-mkacc="analizar"' + (MK.activo ? '' : ' disabled') + '>Analizar ahora</button></div>'
    + (MK.resumen ? '<div class="mk-resumen"><b>Lo que ve la IA</b><p>' + esc(MK.resumen) + '</p></div>' : '')
    + bloqueDescartes(MK.descartes)
    + (nuevas.length ? '<div class="mk-grid">' + nuevas.map(tarjetaMarketing).join('') + '</div>'
      : (MK.cargado && MK.activo ? vacioApple('<path d="M9.800 5c.6 4.200 1.800 5.400 6 6-4.200.6-5.400 1.800-6 6-.6-4.200-1.800-5.400-6-6 4.200-.6 5.400-1.800 6-6z"/>',
        'Nada que proponer por ahora', 'Cuando haya cotizaciones enfriadas, clientes dormidos o una fecha cerca, aparecerá aquí.') : ''))
    + (decididas.length ? '<button class="mk-ver" data-mkacc="ver">' + (MK.verDecididas ? 'Ocultar' : 'Ver') + ' las ya decididas · ' + decididas.length + '</button>'
      + (MK.verDecididas ? '<div class="mk-grid">' + decididas.map(tarjetaMarketing).join('') + '</div>' : '') : '')
    + '</section>';
}

async function decideMarketing(id, decision){
  const r = await llama({ action: 'marketingDecide', id, decision });
  if (!r.ok) { avisa('No se pudo guardar', r.error); return false; }
  const p = MK.propuestas.find(x => x.id === id);
  if (p) p.estado = r.estado;
  pintaCuentaMarketing(); pintaMarketing();
  return true;
}

// Descartar o mantener conversaciones sugeridas. Descartar pasa a desinteresado, y eso ya no se ve en las campañas.
async function decideDescartes(ids, decision){
  const r = await llama({ action: 'marketingDescartes', ids, decision });
  if (!r.ok) { avisa('No se pudo guardar', r.error); return false; }
  avisa(decision === 'descartar' ? 'Descartadas' : 'Se quedan como están', r.hechos + (r.hechos === 1 ? ' conversación' : ' conversaciones'));
  await cargaMarketing({ silencioso: true });
  if (typeof pintaChats === 'function') pintaChats();
  return true;
}

// Preparar = dejar todo puesto y llevar a donde se simula o se confirma. No envia. `linea` = 'puente' prepara la
// campaña para el segundo numero (texto libre, sin plantillas); la propuesta queda ligada para excluir a quien dijo que no.
function preparaPropuesta(p, linea){
  const a = p.accion || {};
  MK.preparada = a.tipo === 'campana' ? { id: p.id, titulo: p.titulo, linea: linea === 'puente' ? 'puente' : 'oficial', etiqueta: a.etiqueta || '' } : null;
  const texto = a.texto || p.texto || '';
  if (a.tipo === 'estado') {
    ST_AUDIENCIA_PENDIENTE = a.audiencia || '';
    stCompositor('texto');
    const area = $('stcTexto');
    if (area) { area.value = texto; area.dispatchEvent(new Event('input')); }
    avisa('Estado preparado', 'Revisa el texto y elige a quién; antes de publicar te dice cuántos lo verán.');
    return;
  }
  const poner = (id, v) => { const e = $(id); if (e) e.value = v; };
  poner('bcProposito', a.proposito || 'followup');
  $('bcProposito')?.dispatchEvent(new Event('change'));
  poner('bcEtapa', a.etapa || '');
  poner('bcCategoria', a.categoria || '');
  const modo = $('bcModo');
  const libre = a.modo !== 'template' || linea === 'puente';
  if (modo) { modo.value = libre ? 'freeform' : 'template'; modo.onchange && modo.onchange(); }
  if (libre) poner('bcTexto', texto);
  const sug = $('bcSugerido');
  if (sug) {
    sug.hidden = false;
    sug.querySelector('.mk-sug-texto').textContent = texto;
    sug.querySelector('.mk-sug-nota').hidden = libre;
  }
  document.querySelector('#vista-campanas .prompt')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  avisa(linea === 'puente' ? 'Campaña del 5644 preparada' : 'Campaña preparada', 'Pulsa «Simular envío»: verás a quién le llegaría antes de que salga nada.');
}

function cableaMarketing(){
  const c = $('mkAgente');
  if (!c || c.dataset.cableado) return;
  c.dataset.cableado = '1';
  c.addEventListener('click', async ev => {
    const b = ev.target.closest('[data-mkacc]'); if (!b) return;
    const acc = b.dataset.mkacc, id = b.dataset.id;
    if (acc === 'desc' || acc === 'mant') { b.disabled = true; await decideDescartes([b.dataset.ids], acc === 'desc' ? 'descartar' : 'mantener'); return; }
    if (acc === 'descTodos') {
      const n = MK.descartes.total;
      if (!await confirmaAqui('Vas a pasar ' + n + ' conversaciones a «desinteresado».\n\nSalen de las métricas y de toda campaña. No se borra nada y se pueden reabrir una a una.\n\n¿Descartarlas?')) return;
      b.disabled = true; await decideDescartes((MK.descartes.items || []).map(i => i.id), 'descartar'); return;
    }
    if (acc === 'ver') { MK.verDecididas = !MK.verDecididas; return pintaMarketing(); }
    if (acc === 'analizar') {
      b.disabled = true; b.textContent = 'Analizando…';
      const r = await llama({ action: 'marketingRun' });
      if (!r.ok) avisa('No se pudo analizar', r.error);
      else if (r.omitida) avisa('Ya se analizó hace un momento', 'Se puede repetir pasados unos minutos.');
      else avisa('Análisis hecho', (r.nuevas || 0) + (r.nuevas === 1 ? ' propuesta nueva' : ' propuestas nuevas'));
      await cargaMarketing();
      return;
    }
    const p = MK.propuestas.find(x => x.id === id);
    if (!p) return;
    if (acc === 'preparar') { if (await decideMarketing(id, 'aceptar')) preparaPropuesta(p); return; }
    if (acc === 'preparar5644') { if (await decideMarketing(id, 'aceptar')) preparaPropuesta(p, 'puente'); return; }
    if (acc === 'meta') {
      const a = p.accion || {};
      b.disabled = true; b.textContent = 'Enviando…';
      const r = await llama({ action: 'templates', operation: 'create', template_name: a.template_name, body_text: a.body_text,
        category: a.category, footer_text: a.footer_text, language_code: a.language_code || 'es', examples: a.examples || [] });
      if (!r.ok) { b.disabled = false; b.textContent = 'Enviar a Meta'; return avisa('Meta la rechazó', r.error); }
      await decideMarketing(id, 'aceptar');
      avisa('Enviada a Meta', r.aviso || 'Espera su aprobación antes de usarla.');
      return;
    }
    if (acc === 'descartar') { await decideMarketing(id, 'descartar'); return; }
    if (acc === 'reabrir') { await decideMarketing(id, 'reabrir'); }
  });
}

// ===== PACK DE ESTADOS =====
// 1080x1920 es el formato de Estado de WhatsApp. Subir una foto normal la recorta el propio
// WhatsApp por donde le parece, y suele cortar cabezas: por eso se prepara antes.
//
// Todo ocurre en el navegador, con canvas. Las fotos NO se suben a ningun servidor, que es
// lo que permite usarlo con una sesion que el cliente todavia no ha visto.
const PK_ANCHO = 1080, PK_ALTO = 1920;
let PK_HECHAS = [];

function pkCubre(ctx, im, escala){
  const s = Math.max(PK_ANCHO / im.width, PK_ALTO / im.height) * (escala || 1);
  const w = im.width * s, h = im.height * s;
  ctx.drawImage(im, (PK_ANCHO - w) / 2, (PK_ALTO - h) / 2, w, h);
}
function pkCabe(ctx, im){
  const s = Math.min(PK_ANCHO / im.width, PK_ALTO / im.height);
  const w = im.width * s, h = im.height * s;
  ctx.drawImage(im, (PK_ANCHO - w) / 2, (PK_ALTO - h) / 2, w, h);
}
function pkAbre(archivo){
  return new Promise((ok, mal) => {
    const u = URL.createObjectURL(archivo);
    const im = new Image();
    im.onload = () => ok({ im, u });
    im.onerror = () => { URL.revokeObjectURL(u); mal(new Error('no es una imagen')); };
    im.src = u;
  });
}
async function pkProcesa(archivo, modo, conMarca){
  const { im, u } = await pkAbre(archivo);
  const cv = document.createElement('canvas');
  cv.width = PK_ANCHO; cv.height = PK_ALTO;
  const ctx = cv.getContext('2d');
  if (modo === 'fill') {
    pkCubre(ctx, im, 1);
  } else {
    // Fondo difuminado y foto entera encima: asi no se recorta al sujeto, que es el fallo
    // que tiene subir la foto tal cual.
    ctx.save(); ctx.filter = 'blur(34px)'; pkCubre(ctx, im, 1.18); ctx.restore();
    ctx.fillStyle = 'rgba(8,10,16,.46)'; ctx.fillRect(0, 0, PK_ANCHO, PK_ALTO);
    pkCabe(ctx, im);
  }
  if (conMarca) {
    const nombre = String(CFG.brandName || '');
    const numero = String(CFG.businessDisplayNumber || CFG.businessNumber || '');
    // Degradado detras del texto: sobre una foto clara, letras blancas a secas no se leen.
    const gr = ctx.createLinearGradient(0, PK_ALTO - 300, 0, PK_ALTO);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.72)');
    ctx.fillStyle = gr; ctx.fillRect(0, PK_ALTO - 300, PK_ANCHO, 300);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    if (nombre) {
      ctx.font = '700 46px system-ui,-apple-system,Segoe UI,sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(nombre, 58, numero ? PK_ALTO - 96 : PK_ALTO - 66);
    }
    if (numero) {
      ctx.font = '500 34px system-ui,-apple-system,Segoe UI,sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.88)';
      ctx.fillText('WhatsApp ' + numero, 58, PK_ALTO - 48);
    }
  }
  URL.revokeObjectURL(u);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9));
  return { blob, url: URL.createObjectURL(blob) };
}

function cableaPackEstados(){
  const ir = $('pkIr'); if (!ir) return;
  ir.onclick = async () => {
    const archivos = [...($('pkFotos').files || [])];
    if (!archivos.length) return avisa('Elige fotos primero');
    // Los object URL anteriores se sueltan: con veinte fotos por pasada, no hacerlo deja
    // la memoria del navegador creciendo hasta que se pone lento.
    PK_HECHAS.forEach(x => URL.revokeObjectURL(x.url));
    PK_HECHAS = [];
    ir.disabled = true; ir.textContent = 'Preparando…';
    const modo = $('pkModo').value, marca = $('pkMarca').checked;
    const fallos = [];
    for (const f of archivos) {
      try { PK_HECHAS.push(await pkProcesa(f, modo, marca)); }
      catch (e) { fallos.push(f.name); }
    }
    ir.disabled = false; ir.textContent = 'Preparar';
    $('pkBajar').disabled = !PK_HECHAS.length;
    $('pkSalida').innerHTML = (PK_HECHAS.length
        ? '<div class="destinos" style="margin-top:10px">'
          + PK_HECHAS.map((x, i) => '<a href="' + x.url + '" download="estado-' + (i + 1) + '.jpg">'
            + '<img src="' + x.url + '" style="width:78px;height:139px;object-fit:cover;'
            + 'border-radius:8px;border:1px solid var(--line2)"></a>').join('')
          + '</div>'
        : '')
      + (fallos.length ? '<p class="bajada">No se pudieron leer: ' + esc(fallos.join(', ')) + '</p>' : '')
      + (PK_HECHAS.length ? '<p class="bajada">' + PK_HECHAS.length + ' lista(s). Pulsa una para bajarla suelta.</p>' : '');
  };
  $('pkBajar').onclick = () => {
    // Una descarga por foto, separadas en el tiempo: lanzarlas de golpe hace que el
    // navegador bloquee todas menos la primera y parezca que no funciona.
    PK_HECHAS.forEach((x, i) => setTimeout(() => {
      const a = document.createElement('a');
      a.href = x.url; a.download = 'estado-' + (i + 1) + '.jpg'; a.click();
    }, i * 350));
  };
}

// ===== PUBLICAR EN ESTADOS =====
// El Pack ya dejaba la foto en formato de Estado; esto la publica sin pasar por el telefono.
//
// Lo publicado no se le puede quitar a quien ya lo vio, asi que el orden importa: se dice a
// cuantos va ANTES de publicar, se pregunta, y la primera opcion de la lista es la prueba a
// los numeros del dueno. La audiencia la arma el servidor (estados-core): aqui solo se elige
// el grupo, nunca los telefonos.
let ES_FOTO = null;
const ES_ETIQUETAS = { prueba:'Solo mis números (prueba)', activos:'Clientes con movimiento',
  todos:'Todos los clientes' };

// Fecha Y hora: en un mismo dia se publica mas de un estado, y '23 sep' no dice cual es cual.
function esCuando(v){
  const t = Date.parse(String(v || ''));
  if (!Number.isFinite(t)) return '';
  return new Date(t).toLocaleString('es-DO', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

function esVentana(){
  return Number(($('esDias') || {}).value) || 180;
}

function esPintaPrevia(){
  const p = $('esPrevia'); if (!p) return;
  p.innerHTML = ES_FOTO
    ? '<div class="destinos" style="margin:4px 0 10px"><img src="' + ES_FOTO.url + '" '
      + 'style="width:78px;height:139px;object-fit:cover;border-radius:8px;'
      + 'border:1px solid var(--line2)"><span class="bajada" style="align-self:center">'
      + esc(ES_FOTO.nombre) + ' · <a href="#" id="esQuita">quitar</a></span></div>'
    : '';
  const q = $('esQuita');
  if (q) q.onclick = (e) => { e.preventDefault(); ES_FOTO = null; esPintaPrevia(); };
}

// A cuantos llega cada opcion. No escribe ni manda nada: se puede pulsar las veces que haga
// falta. Tambien dice si la linea esta lista, que es la otra mitad de por que no sale.
async function esCuenta(silencioso){
  const s = $('esSalida'); if (!s) return null;
  if (!silencioso) s.innerHTML = '<p class="bajada">Contando…</p>';
  const r = await llama({ action:'statusAudience', dias: esVentana() });
  if (!r.ok) { s.innerHTML = '<p class="aviso">' + esc(r.error) + '</p>'; return null; }
  const d = r.data || {};
  const c = d.conteo || {};
  const sel = $('esQuien');
  if (sel) [...sel.options].forEach(o => {
    const n = c[o.value] ? c[o.value].total : 0;
    o.textContent = ES_ETIQUETAS[o.value] + (o.value === 'activos' ? ' (' + (d.dias || 180) + ' días)' : '')
      + ' — ' + n + (n === 1 ? ' contacto' : ' contactos');
  });
  const recorte = c.todos && c.todos.recortado
    ? '<p class="bajada">De « todos » entran los ' + c.todos.total + ' con movimiento más '
      + 'reciente; ' + c.todos.recortado + ' se quedan fuera. Un estado se manda en una sola '
      + 'operación con la lista dentro, y una lista sin tope la paga el número del negocio.</p>'
    : '';
  s.innerHTML = (d.listo
    ? '<p class="bajada">Línea lista: ' + esc(d.linea || '') + '.</p>'
    : '<p class="aviso">No se puede publicar ahora: ' + esc(d.motivo || 'la línea no está lista') + '</p>') + recorte;
  return d;
}

async function esPublicaEstado(){
  const ir = $('esIr');
  const texto = ($('esTexto').value || '').trim();
  if (!texto && !ES_FOTO) return avisa('Falta el estado', 'Escribe un texto o elige una foto.');
  const quien = $('esQuien').value;
  const d = await esCuenta(true);
  if (!d) return;
  if (!d.listo) return avisa('No se puede publicar', d.motivo || 'la línea no está lista');
  const total = d.conteo && d.conteo[quien] ? d.conteo[quien].total : 0;
  if (!total) return avisa('No hay a quién publicárselo', 'Esa opción no alcanza a nadie.');
  // La cifra en la pregunta, no solo en la pantalla: es lo unico que separa una prueba de
  // ensenarselo a todos los clientes del negocio.
  if (!await confirmaAqui('Se va a publicar en Estados para ' + total + ' contacto(s): '
    + ES_ETIQUETAS[quien] + '.' + '\n\n'
    + 'Dura 24 horas y no se le puede quitar a quien ya lo haya visto.'
    + '\n\n' + '¿Publicar?')) return;
  ir.disabled = true; ir.textContent = 'Publicando…';
  const cuerpo = { action:'statusPost', audience: quien, text: texto, dias: esVentana() };
  if (ES_FOTO) {
    try {
      // HD siempre: la foto entera, hasta 4096 px y 7,5 MB. Mas que eso el servidor no la acepta.
      const hd = await comprimeHdPuente(ES_FOTO.blob);
      cuerpo.media_b64 = await leeBase64(hd);
      cuerpo.media_mime = hd.type || ES_FOTO.blob.type || 'image/jpeg';
      // La miniatura se queda en la ficha cuando el archivo de transito se borre: es lo que
      // deja ver despues QUE se publico sin guardar la foto en la nube.
      const mini = await miniaturaParaEnviar(ES_FOTO.blob);
      if (mini) cuerpo.media_thumb_b64 = mini;
    } catch (e) {
      ir.disabled = false; ir.textContent = 'Publicar';
      return avisa('No se pudo leer la foto', String(e && e.message || e));
    }
  }
  const r = await llama(cuerpo);
  ir.disabled = false; ir.textContent = 'Publicar';
  if (!r.ok) return avisa('No se pudo publicar', r.error);
  const res = r.data || {};
  avisa('Estado en camino', 'Sale para ' + res.total + ' contacto(s). Aparece abajo en cuanto el '
    + 'puente lo publique; tarda unos segundos.');
  $('esTexto').value = ''; ES_FOTO = null; esPintaPrevia();
  setTimeout(esHistorialEstados, 3500);
  esHistorialEstados();
}

// Lo ya publicado. Es la unica forma de saber si de verdad salio: el puente publica despues,
// y un fallo suyo no llega al navegador por ningun otro camino.
async function esHistorialEstados(){
  const h = $('esHistorial'); if (!h) return;
  const r = await llama({ action:'statusList' });
  if (!r.ok) { h.innerHTML = ''; return; }
  const filas = r.data || [];
  if (!filas.length) { h.innerHTML = '<p class="bajada">Todavía no se ha publicado ningún estado desde aquí.</p>'; return; }
  const COMO = { pending:'esperando al puente', sending:'saliendo…', sent:'publicado',
    failed:'no salió', expired:'caducó sin publicarse' };
  h.innerHTML = '<div class="seccion" style="margin:26px 0 6px">Últimos estados</div>'
    + filas.map(f => '<div class="cfgc" style="margin:8px 0">'
      + (f.media_thumb ? '<img src="' + esc(f.media_thumb) + '" style="float:left;width:44px;'
        + 'height:78px;object-fit:cover;border-radius:6px;margin:0 10px 6px 0">' : '')
      + '<b>' + esc(COMO[f.status] || f.status) + '</b>'
      + '<p class="bajada" style="margin:4px 0 0">' + esc(f.body || '(sólo foto)') + '</p>'
      + '<p class="bajada" style="margin:2px 0 0">' + esc(ES_ETIQUETAS[f.modo] || f.modo) + ' · '
      + f.total + ' contacto(s) · ' + esc(esCuando(f.sent_at || f.created_at))
      + (f.error ? ' · ' + esc(f.error) : '') + '</p>'
      + '<div style="clear:both"></div></div>').join('');
}

function cableaPublicarEstado(){
  const ir = $('esIr'); if (!ir) return;
  ir.onclick = esPublicaEstado;
  $('esVer').onclick = () => esCuenta(false);
  // Cambiar la ventana cambia la cifra que se acaba de leer: se vuelve a contar sola, que
  // es mas seguro que dejar en pantalla un numero que ya no es el de la opcion elegida.
  $('esDias').onchange = () => esCuenta(true);
  $('esFoto').onchange = async () => {
    const f = ($('esFoto').files || [])[0];
    ES_FOTO = f ? { blob:f, nombre:f.name, url:URL.createObjectURL(f) } : null;
    esPintaPrevia();
  };
  // La del Pack ya viene en 1080x1920 y con la marca del estudio: es la que hay que publicar,
  // no la foto original, que WhatsApp recorta por donde le parece.
  $('esDelPack').onclick = () => {
    const p = PK_HECHAS[0];
    if (!p) return avisa('No hay ninguna preparada', 'Prepara una foto arriba, en Pack de Estados.');
    ES_FOTO = { blob:p.blob, nombre:'estado-1.jpg', url:URL.createObjectURL(p.blob) };
    esPintaPrevia();
  };
  esCuenta(true);
  esHistorialEstados();
}

async function llenaPlantillasBc(){
  const sel2 = $('bcTpl');
  sel2.innerHTML = '<option>Cargando…</option>';
  const lista = await cargaPlantillas(false) || [];
  // Solo las que Meta aprobo Y que llevan salida de baja: el servidor rechaza el resto,
  // y es mejor no ofrecerlas que dejar que el operador elija una que sera rechazada.
  const validas = lista.filter(t => String(t.meta_status||'').toUpperCase() === 'APPROVED'
    && t.contains_opt_out === true && t.active !== false);
  if (!validas.length) {
    sel2.innerHTML = '<option value="">— ninguna disponible —</option>';
    $('bcTplAviso').textContent = 'No hay ninguna plantilla aprobada que incluya opción de baja (STOP). '
      + 'Meta degrada la calidad del número si se difunde sin ella, así que el servidor lo rechaza. '
      + 'Añade la línea de baja a la plantilla en Meta y vuelve a sincronizar.';
    return;
  }
  sel2.innerHTML = validas.map((t,i) =>
    '<option value="' + i + '">' + esc(t.display_name || t.template_name) + '</option>').join('');
  sel2._validas = validas;
  $('bcTplAviso').textContent = validas.length + ' plantilla(s) aptas para difusión.';
}

function filtroBc(){
  const f = {};
  if ($('bcEtapa').value) f.lifecycle_stage = $('bcEtapa').value;
  if ($('bcCategoria').value.trim()) f.interested_category = $('bcCategoria').value.trim();
  // Propuestas por etiqueta (clientes de otros servicios con permiso): el filtro viaja con la propuesta preparada.
  if (MK.preparada && MK.preparada.etiqueta) f.label = MK.preparada.etiqueta;
  return f;
}
function cuerpoBc(dry){
  const modo = $('bcModo').value;
  const c = { action:'broadcast', send_mode:modo, purpose:$('bcProposito').value,
    filter:filtroBc(), dry };
  if (MK.preparada) { c.propuesta_id = MK.preparada.id; if (MK.preparada.linea === 'puente') c.linea = 'puente'; }
  if (modo === 'freeform') c.text = $('bcTexto').value.trim();
  else {
    const v = $('bcTpl')._validas || [];
    const t = v[Number($('bcTpl').value)];
    if (!t) return null;
    c.template = { name:t.template_name, language_code:t.language_code || 'es',
      contains_opt_out:true, parameter_keys:t.parameter_keys || [] };
  }
  return c;
}

async function simulaBroadcast(){
  const cuerpo = cuerpoBc(true);
  if (!cuerpo) return avisa('Elige una plantilla');
  if (cuerpo.send_mode === 'freeform' && !cuerpo.text) return avisa('Escribe el mensaje');
  $('bcSimular').disabled = true;
  $('bcSalida').innerHTML = '<p class="bajada"><span class="cargando"></span> Calculando audiencia…</p>';
  const r = await llama(cuerpo);
  $('bcSimular').disabled = false;
  if (!r.ok) { $('bcSalida').innerHTML = ''; return avisa('No se pudo simular', r.error); }
  AUDIENCIA = r;
  const destinos = r.targets || r.sample || [];
  $('bcSalida').innerHTML = '<div class="propuesta">'
    + '<div class="tapa"><b>' + Number(r.found || 0) + ' contactos recibirían este mensaje</b></div>'
    + '<div class="cuerpo">'
    +   '<div class="cambio"><div class="k">Revisados</div>' + Number(r.scanned || 0) + '</div>'
    +   '<div class="cambio"><div class="k">Excluidos por baja o permiso</div>' + Number(r.skippedOptOut || 0) + '</div>'
    +   (MK.preparada ? '<div class="cambio"><div class="k">Propuesta «' + esc(MK.preparada.titulo) + '»' + (r.linea === 'puente' ? ' · segundo número (5644)' : '') + '</div>'
        + Number(r.excluidosPorContexto || 0) + ' fuera por lo que dijeron en su conversación</div>' : '')
    +   (destinos.length
        ? '<div class="cambio"><div class="k">A quién le llega</div><div class="destinos">'
          + destinos.slice(0,60).map(t => '<span>' + esc(t.name || t.phone) + ' · +' + esc(t.phone) + '</span>').join('')
          + (destinos.length > 60 ? '<span>… y ' + (destinos.length - 60) + ' más</span>' : '')
          + '</div></div>'
        : '<p class="aviso" style="margin:0">Nadie cumple estos filtros. Con «mensaje libre» solo entran '
          + 'quienes escribieron en las últimas 24 horas.</p>')
    + '</div>'
    + (Number(r.found || 0) > 0
      ? '<div class="patas">' + (r.linea === 'puente' ? '' : '<button class="btn-solido" id="bcEnviar">Enviar a ' + Number(r.found) + '</button>')
        // El segundo numero --el puente de WhatsApp Web-- no pasa por la API oficial, asi
        // que no le aplican ni la ventana de 24 h ni las plantillas: puede mandar texto
        // libre. Lo que si le aplica, y con mas motivo, es el anti-baneo, porque ahi el
        // numero es una linea normal y perderla es perder el numero.
        + '<button class="btn-linea" id="bcPuente" title="Manda por el segundo número, con ritmo y variantes">'
        + 'Enviar por el 2º número</button>'
        + '<button class="btn-linea" id="bcCancelar">Cancelar</button></div>'
      : '')
    + '</div>';
  if (Number(r.found || 0) > 0) {
    $('bcCancelar').onclick = () => { AUDIENCIA = null; MK.preparada = null; $('bcSalida').innerHTML = ''; };
    if ($('bcEnviar')) $('bcEnviar').onclick = enviaBroadcast;
    $('bcPuente').onclick = enviaPorPuente;
  }
}

// Campana por el SEGUNDO numero. v2 solo difundia por el oficial, asi que la linea de Fotos
// no tenia forma de hacer campanas desde el panel -- que es justo la que mas las hace.
//
// Se reutiliza la audiencia ya calculada arriba: volver a pedirla podria devolver otra
// lista, y entonces el numero que el dueno acaba de leer y a quien de verdad le llega
// dejarian de ser lo mismo.
async function enviaPorPuente(){
  if (!AUDIENCIA) return avisa('Simula primero');
  const destinos = (AUDIENCIA.targets || [])
    .filter(t => t.phone)
    .map(t => ({ id: t.id, name: t.name || '', phone: String(t.phone) }));
  if (!destinos.length) {
    return avisa('Sin teléfonos', 'La simulación no devolvió números para el segundo canal.');
  }
  if (destinos.length > 5000) return avisa('Demasiados', 'El tope por campaña es 5000.');
  const texto = ($('bcTexto').value || '').trim();
  // Por el puente NO hay plantillas: es texto libre siempre. Mandar aqui una plantilla
  // llegaria con las llaves sin rellenar, y el cliente lo ve.
  if (!texto) return avisa('Escribe el mensaje', 'El segundo número manda texto libre, no plantillas.');

  const previo = await llama({ action:'bridgeBulk', operation:'preview',
    template: texto, targets: destinos, purpose: $('bcProposito').value });
  if (!previo.ok) return avisa('No se pudo preparar', previo.error);
  // El servidor contesta en espanol: elegibles, saltados, motivos. Leyendo 'eligible' y
  // 'reasons' caia al respaldo y se confirmaba el total de la AUDIENCIA, no los que de
  // verdad iban a recibirlo -- y los excluidos no se enseñaban nunca.
  const entran = Number(previo.elegibles ?? destinos.length);
  const fuera = Object.entries(previo.motivos || {})
    .map(([k, v]) => v + ' por ' + k).join(', ');
  if (!await confirmaAqui('Se va a mandar por el segundo número a ' + entran + ' contacto(s).\n\n'
    + (fuera ? 'Quedan fuera: ' + fuera + '.\n\n' : '')
    + 'Sale con ritmo y con variantes del texto, para no quemar la línea. ¿Seguimos?')) return;

  const b = $('bcPuente'); b.disabled = true; b.textContent = 'Encolando…';
  const r = await llama({ action:'bridgeBulk', operation:'send',
    template: texto, targets: destinos, purpose: $('bcProposito').value });
  b.disabled = false; b.textContent = 'Enviar por el 2º número';
  if (!r.ok) return avisa('No se pudo encolar', r.error);
  AUDIENCIA = null; MK.preparada = null; $('bcSalida').innerHTML = '';
  avisa('Campaña encolada', (r.elegibles ?? entran) + ' mensaje(s) salen por el segundo número, '
    + 'repartidos en el tiempo. No hace falta dejar el panel abierto.');
}

// ===== ANTI-BLOQUEO =====
// Esto no es prudencia excesiva. Cuando Meta degrada la calidad de un numero, la
// penalizacion tarda SEMANAS en irse y no hay a quien reclamar: el negocio se queda sin
// su via principal de venta. Las cuatro cosas que mas la disparan son mandar el mismo
// texto a mucha gente, mandar mucho de golpe, mandar a horas raras, y seguir mandando
// cuando ya empezaron a fallar los envios.
const ANTIBLOQUEO = {
  topeDiario: 250,        // por encima de esto un numero nuevo empieza a marcarse
  porMinuto: 12,          // ritmo humano, no rafaga
  horaDesde: 8,           // no se escribe de madrugada: molesta y se reporta
  horaHasta: 21,
  fallosSeguidosParaCortar: 5,
};

function ventanaHorariaOk(){
  const h = new Date().getHours();
  return h >= ANTIBLOQUEO.horaDesde && h < ANTIBLOQUEO.horaHasta;
}

// Personaliza el texto por contacto. Meta no compara textos literalmente, pero mandar
// el MISMO mensaje a doscientas personas es el patron mas facil de detectar y el que
// mas reportes de spam genera.
function personaliza(texto, c){
  const nombre = String(nombreReal(c)).trim().split(/\s+/)[0] || '';
  let t = String(texto || '')
    .replace(/\{nombre\}/gi, nombre)
    .replace(/\{categoria\}/gi, c.interested_category || '')
    .replace(/\{combo\}/gi, c.selected_combo_name || '');
  // Si el texto no trae ningun hueco, se le antepone el saludo con su nombre: sin esto
  // todos recibirian una copia identica.
  if (nombre && !/\{nombre\}/i.test(texto) && !t.toLowerCase().startsWith('hola')) {
    t = 'Hola ' + nombre + ', ' + t.charAt(0).toLowerCase() + t.slice(1);
  }
  return t.replace(/\s{2,}/g, ' ').trim();
}

function avisoAntibloqueo(cuantos){
  const problemas = [];
  if (!ventanaHorariaOk()) problemas.push('Son las ' + new Date().getHours() + 'h. '
    + 'Fuera de ' + ANTIBLOQUEO.horaDesde + '–' + ANTIBLOQUEO.horaHasta + 'h la gente reporta más.');
  if (cuantos > ANTIBLOQUEO.topeDiario) problemas.push(cuantos + ' supera el tope diario de '
    + ANTIBLOQUEO.topeDiario + '. Divídelo en varios días.');
  const minutos = Math.ceil(cuantos / ANTIBLOQUEO.porMinuto);
  return { problemas, minutos };
}

async function enviaBroadcast(){
  if (!AUDIENCIA) return;
  const cuantos = Number(AUDIENCIA.found || 0);
  const { problemas, minutos } = avisoAntibloqueo(cuantos);
  if (problemas.length && !await confirmaAqui('Ojo antes de enviar:\n\n• ' + problemas.join('\n• ')
    + '\n\nUna penalización de Meta tarda semanas en irse.\n\n¿Enviar igualmente?')) return;
  if (!await confirmaAqui('Se enviará a ' + cuantos + ' contactos reales, personalizando cada mensaje.\n'
    + 'Tardará unos ' + minutos + ' minuto(s) para no ir en ráfaga.\n\n'
    + 'Esto no se puede deshacer. ¿Confirmas?')) return;
  const cuerpo = cuerpoBc(false);
  cuerpo.personalizar = true;
  cuerpo.ritmo_por_minuto = ANTIBLOQUEO.porMinuto;
  // Se envia sobre los ids QUE SE ENSEÑARON, no sobre una audiencia recalculada: entre
  // la simulacion y la confirmacion puede haber entrado gente nueva que nadie reviso.
  if (Array.isArray(AUDIENCIA.ids) && AUDIENCIA.ids.length) cuerpo.only_ids = AUDIENCIA.ids;
  $('bcEnviar').disabled = true;
  $('bcEnviar').textContent = 'Enviando…';
  // Por tandas. El servidor procesa lo que cabe en el tiempo de la funcion y devuelve el
  // resto en pendientes_ids. Antes era una sola peticion que moria hacia el contacto 100:
  // error sin cifras, y reintentar le volvia a escribir a los que ya lo tenian.
  const r = { ok:true, sent:0, failed:0, errors:[] };
  let corte = '', errorTanda = '';
  for (let vuelta = 0; vuelta < 60; vuelta++) {
    const t = await llama(cuerpo);
    if (!t.ok) { errorTanda = t.error || 'error'; break; }
    r.sent += Number(t.sent || 0);
    r.failed += Number(t.failed || 0);
    r.errors.push(...(t.errors || []));
    $('bcEnviar').textContent = 'Enviando… ' + (r.sent + r.failed) + ' de ' + cuantos;
    if (t.corte) { corte = t.corte; break; }
    const quedan = Array.isArray(t.pendientes_ids) ? t.pendientes_ids : [];
    if (!quedan.length) break;
    cuerpo.only_ids = quedan;
  }
  if (errorTanda && !(r.sent + r.failed)) {
    $('bcEnviar').disabled = false; $('bcEnviar').textContent = 'Enviar a ' + cuantos;
    return avisa('No se pudo enviar', errorTanda);
  }
  if (errorTanda || corte) {
    r.errors.unshift({ error: corte || ('Se detuvo a mitad: ' + errorTanda + '. Ya salieron ' + r.sent
      + '; no vuelvas a enviar a todos o los repetirás.') });
  }
  AUDIENCIA = null; MK.preparada = null;
  $('bcSalida').innerHTML = '<div class="propuesta"><div class="tapa"><b>Envío terminado</b></div>'
    + '<div class="cuerpo">'
    +   '<div class="cambio"><div class="k">Enviados</div>' + Number(r.sent || 0) + '</div>'
    +   '<div class="cambio"><div class="k">Fallidos</div>' + Number(r.failed || 0) + '</div>'
    +   ((r.errors || []).length
        ? '<div class="cambio"><div class="k">Motivos</div>'
          + (r.errors || []).slice(0,10).map(e => esc(e.error)).join('<br>') + '</div>' : '')
    + '</div></div>';
  avisa('Broadcast enviado', Number(r.sent || 0) + ' de ' + cuantos);
}

/* ---- Acciones en lote ---------------------------------------------------- */
// Apagarle las comunicaciones a cien personas de una vez tiene que ser dificil de
// hacer sin querer y facil de entender: se dice cuantos, que les pasa, y hay que
// escribir la palabra. Y va de uno en uno con su motivo, porque si falla en el 40 hay
// que saber cuales quedaron hechos.
const LOTE = new Set();

function pintaLote(){
  const b = $('barraLote'); if (!b) return;
  b.hidden = LOTE.size === 0;
  if (!LOTE.size) return;
  b.innerHTML = '<span><b>' + LOTE.size + '</b> seleccionado(s)</span>'
    + '<button class="btn-linea" data-lote="etq">Etiquetar</button>'
    + '<button class="btn-linea" data-lote="desinteres">Desinteresado</button>'
    + '<button class="btn-linea" data-lote="analizar">Analizar con IA</button>'
    + '<button class="btn-linea" data-lote="ignorar">Ignorar</button>'
    + '<button class="btn-linea danger" data-lote="apagar">Apagar bot y marketing</button>'
    + '<button class="btn-linea" data-lote="nada">Quitar selección</button>';
}

function cableaLote(){
  const b = $('barraLote'); if (!b) return;
  b.onclick = async ev => {
    const btn = ev.target.closest('[data-lote]'); if (!btn) return;
    const op = btn.dataset.lote;
    const ids = [...LOTE];
    if (op === 'nada') { LOTE.clear(); pintaLote(); pintaChats(); return; }
    // Las dos ensenan antes la lista de a quien afecta; ninguna actua con un clic.
    if (op === 'ignorar') return abreIgnorarLote(ids);
    if (op === 'analizar') return abreAnalisisLote(ids);

    if (op === 'etq') {
      const e = (window.prompt('Etiqueta para los ' + ids.length + ' seleccionados:') || '').trim().toLowerCase();
      if (!e) return;
      return corridaLote(ids, async c => llama({ action:'updateLead', conversation_id:c.id || c._id,
        fields:{ labels: [...new Set([...etiquetasDe(c), e])] } }), 'Etiquetados');
    }

    if (op === 'desinteres') {
      if (!await confirmaAqui('Se marcarán ' + ids.length + ' contactos como desinteresados.\n\n'
        + 'Dejan de recibir marketing, seguimientos y auto-plantillas. Pueden seguir escribiendo '
        + 'y se les puede contestar a mano.\n\n¿Seguro?')) return;
      return corridaLote(ids, async c => llama({ action:'disinterest', operation:'mark',
        conversation_id:c.id || c._id, reason:'marcado en lote desde la lista' }), 'Marcados');
    }

    if (op === 'apagar') {
      // Exclusion permanente: la mas grave de todas, y en lote. Por eso se escribe.
      const frase = 'APAGAR ' + ids.length;
      const escrito = window.prompt('Se apagarán bot, promociones y seguimientos para '
        + ids.length + ' contactos, de forma permanente.\n\n'
        + 'Los mensajes que ellos manden se seguirán recibiendo.\n\n'
        + 'Escribe ' + frase + ' para confirmar:') || '';
      // Sin mayusculas ni espacios, como en el asistente: la frase exacta no protegia mas y
      // un espacio de mas cancelaba sin decir por que.
      if (!fraseCoincide(escrito, frase)) return;
      return corridaLote(ids, async c => llama({ action:'communicationPolicy', operation:'block',
        conversation_id:c.id || c._id, confirmation:'DESACTIVAR CONTACTO',
        reason:'exclusión en lote desde la lista' }), 'Apagados');
    }
  };
}

async function corridaLote(ids, hacer, verbo){
  const b = $('barraLote');
  let hechos = 0; const fallos = [];
  for (const id of ids) {
    const c = buscaConv(id);
    if (!c) continue;
    b.innerHTML = '<span><span class="cargando"></span> ' + verbo.toLowerCase() + ' '
      + (hechos + 1) + ' de ' + ids.length + '…</span>';
    const r = await hacer(c);
    if (r?.ok) hechos++; else fallos.push(nombreDe(c) + ': ' + (r?.error || 'error'));
  }
  LOTE.clear(); pintaLote(); pintaChats();
  // Se dice cuantos salieron y cuantos no. Un "listo" a secas esconde los que fallaron.
  avisa(verbo + ' ' + hechos + ' de ' + ids.length,
    fallos.length ? fallos.slice(0,3).join(' · ') : '');
}

/* ---- Contactos ignorados y analisis con IA ------------------------------ */
// Ignorar saca de la bandeja, de las cifras y de todo lo automatico a quien no es cliente (familia,
// numeros propios, lineas del negocio, colegas) SIN borrar nada. Lo decide y lo escribe el servidor
// (accion 'ignore', con rol y auditoria); aqui solo se pide y se ensena. El analisis con IA (accion
// 'analyze') propone resumen, etiquetas, categoria, etapa e ignorar, y lo que se aplica lo marca
// una persona.
const FUENTE_IGNORAR = { manual:'a mano', lote:'en lote', lista:'por la lista de números',
  nombre_exacto:'por nombre confirmado', propuesta_nombre:'propuesta por nombre', propuesta_ia:'propuesta del análisis',
  contexto:'automático, por lo que dice la conversación' };
const NOMBRE_CAMPO_AN = { resumen:'resumen', etiquetas:'etiquetas', categoria:'categoría', etapa:'etapa', ignorar:'ignorar' };
const TOPE_ANALISIS_LOTE = 20;

function opcionesTipoIgnorar(actual){
  return Object.entries(TIPOS_IGNORAR).map(([k, v]) => '<option value="' + k + '"'
    + (k === actual ? ' selected' : '') + '>' + esc(v) + '</option>').join('');
}
function fechaCorta(v){
  const t = instante(v);
  return Number.isFinite(t) ? new Date(t).toLocaleDateString('es-DO', { day:'numeric', month:'short', year:'numeric' }) : '';

function grupoIgnorarFicha(c){
  if (ignorada(c)) {

      +   (c.ignored_at ? ' desde el ' + esc(fechaCorta(c.ignored_at)) : '')
      +   (FUENTE_IGNORAR[c.ignored_source] ? ' (' + esc(FUENTE_IGNORAR[c.ignored_source]) + ')' : '')
      +   (c.ignored_reason ? ': ' + esc(c.ignored_reason) : '') + '.</p>'

      +   'la limpieza, la prospección y la agenda la saltan. Sus mensajes se siguen guardando y se le puede contestar a mano.</p>'
      + '<label class="cfgsw"><input type="checkbox" id="ignSoloFichaDes"><span><b>Solo esta ficha</b>'
      +   '<i>Las demás del mismo número siguen ignoradas.</i></span></label>'
      + '<button class="btn-linea" id="ignDeshacer" style="margin-top:6px">Dejar de ignorar</button>'

      + esc(s.via === 'ia' ? 'del análisis' : s.via === 'contexto' ? 'por el contexto de la conversación' : 'por nombre') + (s.confianza ? ' · confianza ' + esc(s.confianza) : '')
      + (s.motivo ? '<br>' + esc(s.motivo) : '')
      + (s.con_senales_cliente ? '<br><b style="color:var(--bad)">Tiene señales de cliente: revísala antes.</b>' : '')
      + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"><button class="btn-linea" id="ignConfirmar">Ignorar</button>'
      + '<button class="btn-linea" id="ignEsCliente">Es cliente</button></div></div>'
    : '';
  return '<details class="grupo"' + (propuesta ? ' open' : '') + '><summary>Ignorar en el CRM</summary><div class="dentro">'
    + propuesta
    + '<div class="par"><div class="campo"><label>Tipo</label><select id="ignTipo">' + opcionesTipoIgnorar(s?.kind || 'personal') + '</select></div>'

    + '<p class="aviso" style="margin:7px 0 0">Para familia, números propios y colegas. Se oculta de la bandeja, las cifras, '
    +   'el bot, los seguimientos, las difusiones, la limpieza, la prospección y la agenda. No se borra nada: el filtro '
    +   '«Ignorados» la trae y se deshace desde aquí.</p>'
    + '</div></details>';

function cableaIgnorarFicha(c){
  const id = c.id || c._id;
  const alcance = casilla => ($(casilla)?.checked ? 'ficha' : 'numero');
  const corre = async (btn, cuerpo, texto) => {
    btn.disabled = true;
    const r = await llama(cuerpo);
    btn.disabled = false;
    if (!r.ok) return avisa('No se pudo', r.error);
    if ((r.fallos || []).length && !r.hechas) return avisa('No se pudo', r.fallos[0].error);
    avisa(texto(r));
  };
  const m = $('ignMarcar');
  if (m) m.onclick = () => corre(m, { action:'ignore', operation:'mark', conversation_id:id,
    kind:$('ignTipo').value, reason:$('ignMotivo').value.trim(), alcance:alcance('ignSoloFicha') },
    r => 'Ignorada' + (r.fichas > 1 ? ' en ' + r.fichas + ' fichas del mismo número' : ''));
  const d = $('ignDeshacer');
  if (d) d.onclick = () => corre(d, { action:'ignore', operation:'unmark', conversation_id:id, alcance:alcance('ignSoloFichaDes') },
    r => 'Vuelve a la bandeja' + (r.fichas > 1 ? ' con ' + r.fichas + ' fichas' : ''));
  const cf = $('ignConfirmar');
  if (cf) cf.onclick = () => corre(cf, { action:'ignore', operation:'decide', conversation_ids:[id], decision:'ignorar' }, () => 'Ignorada');
  const ec = $('ignEsCliente');
  if (ec) ec.onclick = () => corre(ec, { action:'ignore', operation:'decide', conversation_ids:[id], decision:'es_cliente' },
    () => 'Anotado: no se volverá a proponer');
}

/* ---- Cliente de caja ------------------------------------------------------ */
// El CRM y la caja llevaban años siendo dos mundos con las mismas personas dentro: 898
// clientes de un lado, 946 conversaciones del otro, y mirando un chat no habia forma de saber
// si esa persona ya habia pasado por el mostrador. Se preguntaba "¿usted ha venido antes?" a
// gente que viene cada mes.
//
// Lo que se enseña aqui son los campos pos_* que escribe el pase de madrugada cruzando por
// telefono. El SALDO no esta a proposito: vive en la caja y solo ahi. Lo que se enseña es lo
// que ya paso --que compro y cuando--, que es historia y no cambia de un dia para otro.
function grupoCajaFicha(c){
  if (ignorada(c)) return '';
  const abierto = c.pos_client_id ? ' open' : '';
  return '<details class="grupo"' + abierto + '><summary>Cliente de caja'
    + (c.pos_client_id ? ' <span class="nota">' + (c.pos_client_folio ? 'folio ' + esc(c.pos_client_folio) : 'vinculado') + '</span>' : '')
    + '</summary><div class="dentro">' + cuerpoCajaFicha(c) + '</div></details>';
}

function cuerpoCajaFicha(c){
  if (!c.pos_client_id) {
    // Sin vinculo no se dice "no es cliente": se dice lo que se comprobo. No es lo mismo "no ha
    // comprado nunca" que "en la caja ese numero no esta escrito", y el arreglo es distinto.
    return '<p class="aviso" style="margin:0 0 9px">Este número no aparece en <b>Clientes de caja</b>. '
      + 'Puede ser que nunca haya comprado, o que en la caja esté con otro número.</p>'
      + '<button class="btn-linea" id="cajaGuardar">Guardarlo como cliente</button>';
  }
  const compras = Number(c.pos_compras || 0);
  const articulos = Array.isArray(c.pos_articulos) ? c.pos_articulos : [];
  return '<div class="dato"><div class="k">En la caja</div><div class="v">'
      + esc(c.pos_client_nombre || 'sin nombre')
      + (c.pos_client_activo === false ? ' · <b>dado de baja</b>' : '') + '</div></div>'
    + (c.pos_client_folio ? '<div class="dato"><div class="k">Folio</div><div class="v">' + esc(c.pos_client_folio) + '</div></div>' : '')
    + (compras
      ? '<div class="dato"><div class="k">Compras</div><div class="v">' + compras
        + ' · ' + pesos(c.pos_total_centavos) + '</div></div>'
        + (c.pos_ultima_compra_at ? '<div class="dato"><div class="k">Última</div><div class="v">'
          + esc(fechaCorta(c.pos_ultima_compra_at)) + '</div></div>' : '')
        + (articulos.length ? '<div class="dato"><div class="k">Se ha llevado</div><div class="v">'
          + articulos.map(esc).join(', ') + '</div></div>' : '')
      // La mayoria de las ventas del mostrador se cobran sin apuntar al cliente. Decir "0
      // compras" seria mentir; lo honesto es decir por que no se sabe.
      : '<p class="aviso" style="margin:8px 0 0">Ninguna venta suya quedó apuntada a su nombre en la '
        + 'caja. Casi todas las ventas del mostrador se cobran sin cliente, así que esto no quiere '
        + 'decir que no haya comprado.</p>')
    + '<p class="aviso" style="margin:9px 0 0">El <b>saldo y el crédito</b> se miran en la caja: '
      + 'el CRM no los copia para que no haya dos cifras distintas de lo que alguien debe.</p>';
}

function cuerpoAnalisisFicha(c){
