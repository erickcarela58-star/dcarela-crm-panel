// Abrir un chat lo marca como leido. Sin esto el globito y el contador del menu no bajan
// nunca: despues de trabajar toda la bandeja sigue diciendo que hay cinco pendientes, y
// el filtro "sin leer" deja de servir para saber que falta.
async function marcaLeido(c){
  if (!Number(c.unread || 0)) return;
  const antes = c.unread;
  c.unread = 0;             // baja ya, para que se sienta inmediato
  pintaCuentas();
  const r = await llama({ action:'updateLead', conversation_id: c.id || c._id, fields:{ unread: 0 } });
  // Si el servidor dijo que no, se devuelve el numero: un contador que miente es peor
  // que uno alto.
  if (!r.ok) { c.unread = antes; pintaCuentas(); pintaChats(); }
}

function cableaChat(c){
  const modo = $('btnModo');
  const pinta = () => { modo.textContent = (sel.mode === 'human' || sel.human_handoff_required)
    ? 'Humano atiende' : 'Bot atiende'; };
  pinta();
  modo.onclick = async () => {
    const chatEnabled = sel?.mode === 'bot';
    const newMode = chatEnabled ? 'human' : 'bot';
    if (!sel.id && sel._id) sel.id = sel._id;
    modo.disabled = true;
    const r = await callFn({ action: 'mode', conversation_id: sel.id, mode: newMode });
    modo.disabled = false;
    if (!r.ok) return avisa('No se pudo cambiar', r.error);
    sel.mode = newMode; pinta();
    avisa(newMode === 'human' ? 'La atiendes tú' : 'Vuelve al bot',
      'El cambio se aplicará únicamente a esta conversación.');
  };
  const mas = $('mas');
  mas.querySelector('button').onclick = ev => { ev.stopPropagation(); mas.classList.toggle('on'); };
  // Antes se añadia un listener de documento en CADA apertura de conversacion, y cada
  // uno quedaba apuntando a un nodo ya destruido. Tras un rato de trabajo eran cientos.
  // Uno solo, delegado, y busca el menu que exista en ese momento.
  if (!cableaChat.cerrarMenu) {
    cableaChat.cerrarMenu = () => document.getElementById('mas')?.classList.remove('on');
    document.addEventListener('click', cableaChat.cerrarMenu);
  }
  mas.querySelector('.menu').onclick = async ev => {
    const b = ev.target.closest('[data-mas]'); if (!b) return;
    mas.classList.remove('on');
    if (b.dataset.mas === 'recordar') return abreRecordatorio(sel);
    if (b.dataset.mas === 'encuesta') { abreEncuesta(sel); } else {
      if (!confirm('¿Cerrar esta conversación?')) return;
      const r = await llama({ action:'updateLead', conversation_id: sel.id || sel._id,
        fields:{ status:'closed', lead_status:'cerrado' } });
      avisa(r.ok ? 'Conversación cerrada' : 'No se pudo cerrar', r.ok ? '' : r.error);
    }
  };
  cableaAdjuntos();
  cancelaCita();
  $('citaX').onclick = cancelaCita;
  const caja = $('texto'), env = $('btnEnviar');
  caja.addEventListener('input', () => {
    caja.style.height = 'auto';
    caja.style.height = Math.min(caja.scrollHeight, 150) + 'px';
  });
  caja.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); env.click(); }
  });
  env.onclick = async () => {
    const t = caja.value.trim();
    if (!t && !COLA.length) return;
    env.disabled = true;
    let fallo = null;
    // Los nombres de estas claves NO son opcionales: uploadMetaMedia lee media_b64 y
    // media_filename (firebase-functions/src/index.js:179-183). Con media_base64 la
    // subida devuelve null, outboundPayload cae a la rama de texto, y con una foto mas
    // texto sale SOLO el texto mientras el panel dice "enviado". Un fallo silencioso
    // hacia un cliente real.
    const conv = sel.id || sel._id;
    // El canal decide POR DONDE sale. Un chat que entro por WhatsApp Web no puede salir
    // por el API oficial: el servidor lo rechaza con "canal incorrecto", que es lo que
    // estaba pasando. Y ese canal todavia no admite archivos, asi que se dice antes de
    // dejar adjuntar, en vez de fallar despues de subirlo.
    const porPuente = canalDe(sel) === 'whatsapp_qr';
    if (porPuente && COLA.length) {
      env.disabled = false;
      return avisa('WhatsApp Web todavía no envía archivos',
        'Ese canal solo admite texto por ahora. Quita el adjunto o escríbele desde el número oficial.');
    }
    if (porPuente) {
      const r = await llama({ action:'bridgeQueue', conversation_id: conv, body: t });
      env.disabled = false;
      if (!r.ok) return avisa('No se pudo enviar', traduceErrorMeta(r.error));
      caja.value = ''; caja.style.height = 'auto';
      cancelaCita();
      return;
    }
    // El audio no admite pie de foto en la API de WhatsApp: si va texto con una nota de
    // voz, el texto se pierde. Por eso el texto viaja con el ultimo adjunto que SI
    // admite pie, y si no hay ninguno se manda aparte.
    const ultimoConPie = COLA.map(a => a.tipo).lastIndexOf('image') >= 0
      ? COLA.map(a => a.tipo).lastIndexOf('image')
      : COLA.map(a => a.tipo).lastIndexOf('document');
    // Los que ya salieron se quitan de la cola SOBRE LA MARCHA. Si el tercero falla y
    // se reintenta sin esto, los dos primeros se le mandan al cliente otra vez.
    let enviados = 0;
    for (let i = 0; i < COLA.length && !fallo; i++) {
      const a = COLA[i];
      const r = await llama({
        action:'send', conversation_id: conv,
        media_kind: a.tipo, media_b64: a.datos, media_filename: a.nombre, media_mime: a.mime,
        body: (t && i === ultimoConPie) ? t : '',
      });
      if (r.ok) enviados++; else fallo = r.error;
    }
    COLA.splice(0, enviados);
    pintaCola();
    const textoYaFue = t && ultimoConPie >= 0 && !fallo;
    if (!fallo && t && !textoYaFue) {
      const cuerpo = { action:'sendText', conversation_id: conv, body:t };
      // La cita se manda con el wamid del original: asi WhatsApp la enlaza de verdad
      // en el telefono del cliente, en vez de pegar el texto citado a mano.
      if (citando?.wamid) {
        cuerpo.reply_to_wamid = citando.wamid;
        cuerpo.reply_snippet = String(citando.body || '').slice(0, 200);
        cuerpo.reply_sender = citando.direction === 'in' ? 'customer' : 'agent';
      }
      const r = await llama(cuerpo);
      if (!r.ok) fallo = r.error;
    }
    if (!fallo) cancelaCita();
    env.disabled = false;
    // La cola ya se vacio de lo que SI salio, arriba. Aqui solo se limpia el texto.
    if (fallo) return avisa('No se pudo enviar', traduceErrorMeta(fallo));
    caja.value = ''; caja.style.height = 'auto';
  };
}

// "Meta rechazo el envio" no le dice a nadie que hacer. Los motivos que de verdad se
// repiten se explican, y con la salida: casi siempre es la ventana de 24 h cerrada,
// que se resuelve con una plantilla.
function traduceErrorMeta(e){
  const t = String(e || '');
  if (/24|window|re-?engagement|131047/i.test(t))
    return 'Pasaron más de 24 h desde su último mensaje. Solo llega con una plantilla aprobada '
      + '(el botón de plantillas del compositor).';
  if (/131026|not.*whatsapp|no existe/i.test(t)) return 'Ese número no tiene WhatsApp.';
  if (/131049|calidad|quality/i.test(t)) return 'Meta está limitando este número por calidad. '
    + 'Revisa Conexión WhatsApp.';
  if (/excluido|blocked/i.test(t)) return 'Este contacto está excluido de comunicaciones.';
  if (/seguimientos|followup_exhausted/i.test(t)) return 'Lleva dos seguimientos sin responder: '
    + 'quedó como desinteresado y no se le insiste más.';
  if (/transport|reconect/i.test(t)) return 'Meta no está conectada al transporte. Mira Canales.';
  if (/canal incorrecto/i.test(t)) return 'Este chat entró por otro canal. Se está enviando por la vía '
    + 'equivocada; mira Canales.';
  if (/modo seguro|desconectado|pausado/i.test(t)) return 'El segundo WhatsApp no está conectado. '
    + 'Conéctalo en Canales.';
  if (/almacenamiento dedicado|bridge_media/i.test(t)) return 'WhatsApp Web todavía no envía archivos, '
    + 'solo texto.';
  return t;
}

/* ---- Adjuntos ------------------------------------------------------------ */
// Cola visible antes de enviar: lo que se manda a un cliente real se ve primero.
const COLA = [];
let modoHd = false;
// El tope real lo pone el servidor: uploadMetaMedia rechaza por encima de 16 MB ya
// decodificado (index.html del backend, linea 180). Poner 30 aqui solo conseguiria que
// el archivo se subiera entero para morir alla, asi que se corta antes.
const LIMITE_MB = () => (modoHd ? 15 : 12);

// Comprime cada imagen de la cola con el modo ACTUAL y actualiza su peso. Se llama al
// adjuntar y cada vez que se pulsa HD, para que el tamaño que se ve sea el que va a
// salir de verdad y no el del original.
async function recalculaCola(){
  for (const a of COLA) {
    if (a.tipo !== 'image' || !a.archivo) {
      if (!a.datos && a.archivo) { a.datos = await leeBase64(a.archivo); a.kb = Math.round(a.archivo.size/1024); }
      continue;
    }
    if (a.hd === modoHd && a.datos) continue;      // ya esta en el modo pedido
    const blob = modoHd ? await comprimeHd(a.archivo) : await comprimeNormal(a.archivo);
    a.datos = await leeBase64(blob);
    a.mime = blob.type || a.archivo.type || 'image/jpeg';
    // Si se reencodeo, el nombre tiene que decir jpg: algunos visores se lian con un
    // .png que por dentro es jpeg.
    a.nombre = blob !== a.archivo
      ? String(a.archivo.name || 'imagen').replace(/\.[^.]+$/, '') + '.jpg'
      : a.archivo.name;
    a.kb = Math.round(blob.size / 1024);
    a.hd = modoHd;
  }
  pintaCola();
}

function pintaCola(){
  const c = $('cola'); if (!c) return;
  c.hidden = !COLA.length;
  // Se ve la foto, no su nombre. Lo que va a salir hacia un cliente real hay que
  // poder mirarlo antes: un nombre de archivo no dice si adjuntaste la que querias.
  c.innerHTML = COLA.map((a,i) => {
    // Iconos dibujados, no emoji: en Windows varias fuentes no traen 🎙 ni 🖼 y sale la
    // cajita vacia del glifo que falta, que es lo que se veia en la cola.
    const ICONO = {
      audio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/></svg>',
      image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
      document: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>',
    };
    const previa = a.tipo === 'image' && a.datos
      ? '<img src="data:' + esc(a.mime || 'image/jpeg') + ';base64,' + a.datos + '" alt="">'
      : '<span class="ico">' + (ICONO[a.tipo] || ICONO.document) + '</span>';
    const peso = a.kb || (a.datos ? Math.round(a.datos.length * 0.75 / 1024) : 0);
    const marca = a.tipo === 'image' ? (a.hd ? ' · HD' : '') : '';
    return '<span class="pieza">' + previa
      + '<span class="pnom">' + esc(a.nombre)
      +   (peso ? '<i>' + peso + ' KB' + marca + '</i>' : '') + '</span>'
      + '<button data-quita="' + i + '" aria-label="Quitar">×</button></span>';
  }).join('');
}
function leeBase64(f){
  return new Promise((res, rej) => {
    const l = new FileReader();
    l.onload = () => res(String(l.result).split(',')[1] || '');
    l.onerror = () => rej(new Error('no se pudo leer ' + f.name));
    l.readAsDataURL(f);
  });
}
// WhatsApp sube imagenes hasta ~5 MB por id, que es el metodo fiable; por encima cae
// al envio por enlace y falla con #131053. Y recomprime a ~2560 px de lado largo de
// todas formas, asi que mandar mas resolucion no mejora nada y arriesga el envio.
//
// HD = la mejor calidad que WhatsApp entrega DE VERDAD: si el JPEG ya cabe se manda
// intacto, y si no se baja hasta que quepa, siempre como imagen y no como documento.
const TOPE_FIABLE = 4.8 * 1024 * 1024;

function cargaImagen(file){
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('no se pudo abrir la imagen'));
    i.src = URL.createObjectURL(file);
  });
}
async function aJpeg(img, lado, calidad){
  const r = Math.min(1, lado / Math.max(img.width, img.height));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(img.width * r));
  cv.height = Math.max(1, Math.round(img.height * r));
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return new Promise(res => cv.toBlob(res, 'image/jpeg', calidad));
}
async function comprimeHd(file){
  if (!file.type?.startsWith('image/')) return file;
  if (/jpe?g/i.test(file.type) && file.size <= TOPE_FIABLE) return file;  // ya cabe: intacta
  try {
    const img = await cargaImagen(file);
    const mayor = Math.max(img.width, img.height);
    for (const lado of [Math.min(mayor, 2560), 2400, 2200, 2000, 1800, 1600]) {
      if (lado > mayor) continue;
      const b = await aJpeg(img, lado, 0.92);
      if (b && b.size <= TOPE_FIABLE) return b;
    }
    return (await aJpeg(img, 1600, 0.85)) || file;
  } catch (e) { return file; }
}
async function comprimeNormal(file){
  if (!file.type?.startsWith('image/')) return file;
  if (file.size <= 1.8 * 1024 * 1024) return file;
  try { return (await aJpeg(await cargaImagen(file), 1600, 0.85)) || file; }
  catch (e) { return file; }
}

async function encola(files, tipo){
  let fuera = 0;
  for (const f of files) {
    // HEIC no lo acepta WhatsApp por esta via y se rechaza aqui, no a mitad del envio.
    if (tipo === 'image' && /heic|heif/i.test(f.type + f.name)) { fuera++; continue; }
    if (f.size > LIMITE_MB() * 1024 * 1024) { fuera++; continue; }
    // Se guarda el ORIGINAL. La compresion se decide al enviar, no al adjuntar: antes,
    // adjuntar y despues pulsar HD no servia de nada porque la foto ya venia comprimida
    // en calidad normal, y no habia forma de darse cuenta.
    COLA.push({ tipo, nombre: f.name, mime: f.type || 'application/octet-stream', archivo: f });
  }
  await recalculaCola();
  if (fuera) avisa(fuera + (fuera === 1 ? ' archivo se omitió' : ' archivos se omitieron'),
    'HEIC o mayor de ' + LIMITE_MB() + ' MB.');
  pintaCola();
}
function cableaAdjuntos(){
  COLA.length = 0; pintaCola();
  $('adjImg').onclick = () => $('fImg').click();
  $('adjDoc').onclick = () => $('fDoc').click();
  $('fImg').onchange = e => { const f = [...e.target.files]; e.target.value = ''; encola(f, 'image'); };
  $('fDoc').onchange = e => { const f = [...e.target.files]; e.target.value = ''; encola(f, 'document'); };
  $('adjHd').onclick = async () => {
    modoHd = !modoHd;
    $('adjHd').setAttribute('aria-pressed', modoHd ? 'true' : 'false');
    $('adjHd').classList.toggle('on', modoHd);
    // Se recomprime lo que YA esta adjuntado. Antes el interruptor solo valia para las
    // fotos que se adjuntaran despues, sin decirlo en ninguna parte.
    if (COLA.some(a => a.tipo === 'image')) {
      $('adjHd').disabled = true;
      await recalculaCola();
      $('adjHd').disabled = false;
    }
    avisa(modoHd ? 'HD activado' : 'HD desactivado',
      modoHd ? 'Máxima calidad que WhatsApp entrega de verdad.' : 'Calidad normal, más ligeras.');
  };
  $('cola').onclick = ev => {
    const b = ev.target.closest('[data-quita]'); if (!b) return;
    COLA.splice(Number(b.dataset.quita), 1); pintaCola();
  };
  cableaMicrofono();
  $('adjTpl').onclick = abrePlantillas;
  $('adjCombo').onclick = abreCombos;
  $('adjRapida').onclick = abreRapidas;
}

// Frases del equipo, guardadas en el servidor y no en el navegador: si viven en
// localStorage, cada persona tiene las suyas y lo que escribe el negocio deja de
// sonar igual segun quien conteste.
let RAPIDAS = null;

async function cargaRapidas(forzar){
  if (RAPIDAS && !forzar) return RAPIDAS;
  const r = await llama({ action:'data', table:'quick_replies', operation:'select',
    order:[{ field:'created_at', ascending:false }], limit: 200 });
  if (!r.ok) { avisa('No se pudieron cargar', r.error); return null; }
  RAPIDAS = r.data || r.rows || [];
  return RAPIDAS;
}

async function abreRapidas(){
  if (!sel) return avisa('Abre una conversación primero');
  abreModal('<div class="mtapa"><b>Respuestas rápidas</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo"><span class="cargando"></span> Cargando…</div>');
  $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });
  const filas = await cargaRapidas(true);
  if (!filas) return cierraModal();
  const cuerpo = $('modal').querySelector('.mcuerpo');
  const pinta = () => {
    cuerpo.innerHTML = (filas.length
        ? filas.map((q,i) => '<div class="rapida"><button data-usar="' + i + '">'
            + '<b>' + esc(q.title || q.name || 'Sin título') + '</b>'
            + '<span>' + esc(String(q.body || q.text || '').slice(0,110)) + '</span></button>'
            + '<button class="rx" data-borrar="' + i + '" aria-label="Borrar">×</button></div>').join('')
        : '<p class="aviso">Todavía no hay ninguna. Escribe la primera abajo.</p>')
      + '<div class="seccion" style="margin:16px 0 8px">Añadir una nueva</div>'
      + '<div class="campo"><label>Título</label><input id="rqT" placeholder="Ej. Horario"></div>'
      + '<div class="campo"><label>Texto</label><textarea id="rqB" rows="3"></textarea></div>'
      + '<button class="btn-solido" id="rqAdd">Guardar</button>';
    $('rqAdd').onclick = async () => {
      const title = $('rqT').value.trim(), body = $('rqB').value.trim();
      if (!title || !body) return avisa('Faltan el título o el texto');
      $('rqAdd').disabled = true;
      const r = await llama({ action:'data', table:'quick_replies', operation:'insert',
        payload:{ title, body, created_at: new Date().toISOString() }, returning:true });
      $('rqAdd').disabled = false;
      if (!r.ok) return avisa('No se pudo guardar', r.error);
      RAPIDAS = null;
      const nuevas = await cargaRapidas(true);
      filas.length = 0; filas.push(...(nuevas || []));
      pinta();
      avisa('Guardada');
    };
  };
  pinta();
  cuerpo.onclick = async ev => {
    const usar = ev.target.closest('[data-usar]');
    if (usar) {
      const q = filas[Number(usar.dataset.usar)];
      const caja = $('texto');
      const t = q.body || q.text || '';
      caja.value = caja.value.trim() ? caja.value.trim() + '\n\n' + t : t;
      caja.dispatchEvent(new Event('input'));
      cierraModal(); caja.focus();
      return;
    }
    const borrar = ev.target.closest('[data-borrar]');
    if (borrar) {
      const q = filas[Number(borrar.dataset.borrar)];
      if (!confirm('¿Borrar «' + (q.title || q.name) + '»?')) return;
      const r = await llama({ action:'data', table:'quick_replies', operation:'delete',
        filters:[{ kind:'eq', field:'id', value:q.id }] });
      if (!r.ok) return avisa('No se pudo borrar', r.error);
      filas.splice(Number(borrar.dataset.borrar), 1);
      RAPIDAS = null; pinta();
    }
  };
}

/* ---- Biblioteca de combos ------------------------------------------------ */
// El catalogo no vive en el CRM: se lee de la pagina publica, que es la que el
// negocio actualiza. Asi el precio que se le manda al cliente es exactamente el que
// ve en la web, sin una segunda lista que se quede vieja sin que nadie lo note.
const COMBO_PAGINA = CFG.publicCatalogUrl || 'https://dcarelacompufoto.com/combos.html';
const COMBO_IMG = 'https://dcarelacompufoto.com/combos-img/';
const COMBO_PDF = 'https://dcarelacompufoto.com/pdf/';
const COMBO_CATEGORIAS = { xv:'XV', infantil:'Infantil', graduacion:'Graduación',
  cumpleanos:'Cumpleaños', embarazadas:'Embarazadas' };
const COMBO_PDFS = [
  { cat:'xv', label:'XV', n:5 }, { cat:'infantil', label:'Infantil', n:8 },
  { cat:'graduacion', label:'Graduación', n:3 }, { cat:'cumpleanos', label:'Cumpleaños', n:15 },
  { cat:'embarazadas', label:'Embarazadas', n:8 },
];
let COMBOS = null;

function combosSlug(cat, nombre){
  return cat + '-' + String(nombre || '').toLowerCase().replace(/[^a-z0-9\s-]/g,'')
    .trim().replace(/\s+/g,'-').replace(/-+/g,'-');
}
async function cargaCombos(forzar){
  if (COMBOS && !forzar) return COMBOS;
  const r = await fetch(COMBO_PAGINA, { cache: forzar ? 'reload' : 'default' });
  if (!r.ok) throw new Error('catálogo HTTP ' + r.status);
  const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
  const filas = [];
  for (const sec of doc.querySelectorAll('section.sec[id]')) {
    const cat = String(sec.id || '').toLowerCase();
    if (!COMBO_CATEGORIAS[cat]) continue;
    for (const card of sec.querySelectorAll('article.combo')) {
      const nombre = String(card.querySelector('.cname')?.textContent || '').trim();
      if (!nombre) continue;
      const precioTxt = String(card.querySelector('.cprice b')?.textContent
        || card.querySelector('.cprice')?.textContent || '').trim();
      filas.push({
        cat, catLabel: COMBO_CATEGORIAS[cat], nombre,
        precio: precioTxt ? (precioTxt.startsWith('RD$') ? precioTxt : 'RD$' + precioTxt) : '',
        digital: String(card.querySelector('.cinc-total')?.textContent || '').trim(),
        items: [...card.querySelectorAll('.cinc li')].map(n => String(n.textContent||'').trim()).filter(Boolean),
        incluyeLabel: String(card.querySelector('.incbox .il')?.textContent || 'Incluye').trim(),
        incluye: String(card.querySelector('.incbox .iv')?.textContent || '').trim(),
        imagenCruda: card.querySelector('.ph')?.dataset.bg
          ? new URL(card.querySelector('.ph').dataset.bg, COMBO_PAGINA).href : '',
        tarjeta: COMBO_IMG + combosSlug(cat, nombre) + '.png',
      });
    }
  }
  COMBOS = filas;
  return filas;
}
function textoDeCombo(c){
  const l = ['Te comparto el combo ' + c.nombre + (c.precio ? ' (' + c.precio + ')' : '') + '.'];
  if (c.digital) l.push('', c.digital + '.');
  if (c.items.length) l.push(...c.items.map(i => '• ' + i));
  if (c.incluye) l.push('', c.incluyeLabel + ': ' + c.incluye + '.');
  l.push('', 'Mira todos los combos e imágenes aquí: ' + COMBO_PAGINA);
  l.push('Si te interesa, dime tu fecha tentativa y te confirmamos disponibilidad.');
  return l.join('\n');
}

async function abreCombos(){
  if (!sel) return avisa('Abre una conversación primero');
  abreModal('<div class="mtapa"><b>Combos</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo"><span class="cargando"></span> Leyendo el catálogo…</div>');
  $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });
  let filas;
  try { filas = await cargaCombos(false); }
  catch (e) {
    $('modal').querySelector('.mcuerpo').innerHTML =
      '<p class="aviso">No se pudo leer el catálogo: ' + esc(e.message) + '</p>';
    return;
  }
  const cuerpo = $('modal').querySelector('.mcuerpo');
  cuerpo.innerHTML = '<div class="campo"><input id="cbBusca" placeholder="Buscar combo…"></div>'
    + '<div class="seccion" style="margin:12px 0 6px">Catálogo en PDF</div>'
    + '<div class="pdfs">' + COMBO_PDFS.map(p =>
        '<button class="tplchip" data-pdf="' + p.cat + '">' + esc(p.label) + ' · ' + p.n + '</button>').join('')
    + '</div>'
    + '<div class="seccion" style="margin:14px 0 6px">Combos con su tarjeta</div><div id="cbLista"></div>';

  const pinta = () => {
    const q = ($('cbBusca').value || '').trim().toLowerCase();
    const vis = filas.filter(c => !q ||
      (c.nombre + ' ' + c.catLabel + ' ' + c.precio + ' ' + c.items.join(' ')).toLowerCase().includes(q));
    $('cbLista').innerHTML = vis.map((c,i) =>
      '<button class="tpl" data-combo="' + filas.indexOf(c) + '"><b>' + esc(c.nombre) + '</b>'
      + '<span class="tplmeta">' + esc(c.catLabel) + (c.precio ? ' · ' + esc(c.precio) : '') + '</span></button>'
    ).join('') || '<p class="aviso">Sin resultados.</p>';
  };
  pinta();
  $('cbBusca').oninput = pinta;

  cuerpo.onclick = async ev => {
    const pdf = ev.target.closest('[data-pdf]');
    if (pdf) return adjuntaPdfCombos(pdf.dataset.pdf, pdf);
    const b = ev.target.closest('[data-combo]');
    if (b) return adjuntaCombo(filas[Number(b.dataset.combo)], b);
  };
}

async function adjuntaCombo(c, boton){
  if (!c) return;
  const antes = boton.innerHTML;
  boton.disabled = true; boton.textContent = 'Preparando…';
  try {
    // Primero la tarjeta oficial; si no existe se cae a la imagen de la web. Mandar
    // el texto sin foto seria peor que no mandar nada: el combo se vende por la imagen.
    let r = await fetch(c.tarjeta, { cache:'force-cache' });
    let url = c.tarjeta;
    if (!r.ok && c.imagenCruda) { r = await fetch(c.imagenCruda, { cache:'force-cache' }); url = c.imagenCruda; }
    if (!r.ok) throw new Error('imagen HTTP ' + r.status);
    const blob = await r.blob();
    const datos = await new Promise((res, rej) => {
      const l = new FileReader();
      l.onload = () => res(String(l.result).split(',')[1] || '');
      // Sin onerror la promesa no se resuelve NUNCA si la lectura falla, y el envio
      // se queda colgado con el boton deshabilitado y sin decir nada.
      l.onerror = () => rej(new Error('no se pudo leer el archivo'));
      l.readAsDataURL(blob);
    });
    COLA.push({ tipo:'image', mime: blob.type || 'image/png',
      nombre: c.nombre + ' - DCarela.' + (url.endsWith('.webp') ? 'webp' : 'png'), datos });
    pintaCola();
    const caja = $('texto');
    const t = textoDeCombo(c);
    caja.value = caja.value.trim() ? caja.value.trim() + '\n\n' + t : t;
    caja.dispatchEvent(new Event('input'));
    cierraModal();
    avisa(c.nombre, 'Imagen y texto listos. Revisa y pulsa enviar.');
  } catch (e) {
    boton.disabled = false; boton.innerHTML = antes;
    avisa('No se pudo preparar ' + c.nombre, e?.message || String(e));
  }
}

async function adjuntaPdfCombos(cat, boton){
  const p = COMBO_PDFS.find(x => x.cat === cat); if (!p) return;
  const antes = boton.textContent;
  boton.disabled = true; boton.textContent = 'Preparando…';
  try {
    const url = COMBO_PDF + 'combos-' + cat + '.pdf';
    const r = await fetch(url, { cache:'force-cache' });
    if (!r.ok) throw new Error('PDF HTTP ' + r.status);
    const blob = await r.blob();
    const datos = await new Promise((res, rej) => {
      const l = new FileReader();
      l.onload = () => res(String(l.result).split(',')[1] || '');
      // Sin onerror la promesa no se resuelve NUNCA si la lectura falla, y el envio
      // se queda colgado con el boton deshabilitado y sin decir nada.
      l.onerror = () => rej(new Error('no se pudo leer el archivo'));
      l.readAsDataURL(blob);
    });
    COLA.push({ tipo:'document', mime:'application/pdf',
      nombre:'Combos ' + p.label + ' - DCarela.pdf', datos });
    pintaCola();
    const caja = $('texto');
    if (!caja.value.trim()) {
      caja.value = 'Te comparto nuestros combos de ' + p.label + '. Cualquier duda me dices, '
        + 'y si te interesa alguno dime tu fecha tentativa para confirmarte disponibilidad.';
      caja.dispatchEvent(new Event('input'));
    }
    cierraModal();
    avisa('Combos ' + p.label, 'PDF listo. Revisa y pulsa enviar.');
  } catch (e) {
    boton.disabled = false; boton.textContent = antes;
    avisa('No se pudo preparar el PDF', e?.message || String(e));
  }
}

/* ---- Plantillas de WhatsApp ---------------------------------------------- */
// Lo unico que WhatsApp entrega con la ventana de 24 h cerrada. Sin esto no se
// puede reactivar a nadie, y por eso es lo primero que necesita una campaña.
//
// El servidor NO resuelve template_id: outboundPayload (transport-core.js:73-87) lee
// template_name, language_code y variables. Mandar el id, como hacia el panel
// anterior, se contesta con "plantilla requerida".
let PLANTILLAS = null;

async function cargaPlantillas(forzar){
  if (PLANTILLAS && !forzar) return PLANTILLAS;
  const r = await llama({ action:'templates', operation:'list',
    business_number: CFG.businessNumber || '' });
  if (!r.ok) { avisa('No se pudieron cargar las plantillas', r.error); return null; }
  PLANTILLAS = (r.templates || r.rows || r.items || []).filter(t => t && t.template_name);
  return PLANTILLAS;
}

function abreModal(html){
  let m = $('modal');
  if (!m) { m = document.createElement('div'); m.id = 'modal'; document.body.appendChild(m); }

/* ---- Audio --------------------------------------------------------------- */
// Portado tal cual del panel anterior, incluida la eleccion de libreria: ver el
// comentario del <script> de opus-recorder arriba. Cambiar esto por MediaRecorder
// hace que los audios "se envien" sin que nadie los reciba.
let grabadora = null, relojT = null, cancelada = false, enviarAlParar = false;

// Aborta y DESCARTA lo grabado. Se llama al cambiar de conversacion: marcar cancelada
// hace que el callback del encoder tire el audio en vez de encolarlo en el chat nuevo.
function abortaGrabacion(){
  if (!grabadora) { paraOndas(); return; }
  cancelada = true; enviarAlParar = false;
  try { grabadora.stop(); } catch (e) {}
  grabadora = null;
  clearInterval(relojT);
  paraOndas();
  const caja = document.getElementById('grabando');
  if (caja) caja.hidden = true;
}
let ctxAudio = null, analizador = null, dibujoT = null, fuenteMic = null;

// Dibuja el nivel REAL del microfono. Una animacion fija mentiria: con el microfono
// silenciado o tomado por otra aplicacion se veria igual de viva, y el audio saldria
// mudo sin que nadie lo notara hasta que el cliente lo dijera.
function arrancaOndas(rec){
  const lienzo = $('ondas'); if (!lienzo) return;
  // Se engancha al AudioContext del PROPIO grabador. La version anterior pedia un
  // segundo micrófono con getUserMedia porque opus-recorder no expone .stream, y abrir
  // una segunda captura mientras el grabador tiene la suya falla en Windows: ese era el
  // error que obligaba a recargar la pagina. Aqui no se abre nada nuevo, solo se
  // escucha el nodo que el grabador ya tiene montado.
  try {
    ctxAudio = rec?.audioContext;
    const nodo = rec?.recordingGainNode || rec?.monitorGainNode;
    if (!ctxAudio || !nodo) return;
    analizador = ctxAudio.createAnalyser();
    analizador.fftSize = 256;
    analizador.smoothingTimeConstant = 0.75;
    nodo.connect(analizador);
    fuenteMic = nodo;
  } catch (e) { analizador = null; return; }

  const datos = new Uint8Array(analizador.frequencyBinCount);
  const g = lienzo.getContext('2d');
  const historia = [];
  const pinta = () => {
    const escala = window.devicePixelRatio || 1;
    const an = lienzo.clientWidth, al = lienzo.clientHeight;
    if (lienzo.width !== an * escala) { lienzo.width = an * escala; lienzo.height = al * escala; }
    g.setTransform(escala, 0, 0, escala, 0, 0);
    g.clearRect(0, 0, an, al);

    analizador.getByteTimeDomainData(datos);
    // Valor eficaz de la onda: sube con la voz y se queda casi plano en silencio.
    let suma = 0;
    for (let i = 0; i < datos.length; i++) { const v = (datos[i] - 128) / 128; suma += v * v; }
    historia.push(Math.min(1, Math.sqrt(suma / datos.length) * 3.2));

    const ancho = 3, hueco = 2, cabe = Math.floor(an / (ancho + hueco));
    while (historia.length > cabe) historia.shift();
    g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--mut').trim() || '#667781';
    historia.forEach((n, i) => {
      const h = Math.max(2, n * (al - 4));
      g.fillRect(i * (ancho + hueco), (al - h) / 2, ancho, h);
    });
    dibujoT = requestAnimationFrame(pinta);
  };
  pinta();
}
function paraOndas(){
  if (dibujoT) cancelAnimationFrame(dibujoT);
  dibujoT = null;
  // Se desconecta SOLO el analizador. El contexto es del grabador, no mio: cerrarlo
  // aqui le cortaria la grabacion por debajo justo cuando esta terminando de codificar.
  try { if (fuenteMic && analizador) fuenteMic.disconnect(analizador); } catch (e) {}
  ctxAudio = analizador = fuenteMic = null;
}

function cableaMicrofono(){
  const caja = $('grabando'), boton = $('adjMic');
  const parar = () => { caja.hidden = true; clearInterval(relojT); grabadora = null; paraOndas(); };

  boton.onclick = async () => {
    if (!sel || !caja.hidden) return;
    if (!window.Recorder) return avisa('La grabación aún no está lista', 'Espera dos segundos y vuelve a tocar.');
    cancelada = false; enviarAlParar = false;
    try {
      grabadora = new Recorder({
        encoderPath:'https://cdn.jsdelivr.net/npm/opus-recorder@8.0.5/dist/encoderWorker.min.js',
        streamPages:false, numberOfChannels:1,
        encoderSampleRate:24000, encoderBitRate:24000,
        recordingGain:1, monitorGain:0,
      });
      grabadora.ondataavailable = async typed => {
        if (cancelada) return;
        const blob = new Blob([typed], { type:'audio/ogg' });
        // Por debajo de este tamaño no hay voz, solo el ruido de pulsar el boton.
        if (blob.size < 800) return avisa('Grabación demasiado corta', 'Vuelve a intentarlo.');
        const datos = await new Promise((res, rej) => {
          const l = new FileReader();
          l.onload = () => res(String(l.result).split(',')[1] || '');
          // Sin onerror la promesa nunca se resuelve y la nota de voz se pierde en
          // silencio: ni se envia ni se avisa.
          l.onerror = () => rej(new Error('no se pudo leer la grabación'));
          l.readAsDataURL(blob);
        }).catch(e => { avisa('No se pudo preparar el audio', e.message); return null; });
        if (!datos) return;
        COLA.push({ tipo:'audio', nombre:'nota-de-voz.ogg', mime:'audio/ogg', datos,
          kb: Math.round(blob.size / 1024) });
        pintaCola();
        // El envio se dispara AQUI, cuando el audio esta listo de verdad. Y va dentro de
        // try: si algo revienta en esta callback, el error queda fuera de cualquier
        // manejador (viene del worker del encoder) y deja el panel colgado hasta
        // recargar, que es justo lo que paso.
        if (enviarAlParar) {
          enviarAlParar = false;
          try { $('btnEnviar')?.click(); }
          catch (e) { avisa('No se pudo enviar la nota', e?.message || String(e)); }
        }
      };
      await grabadora.start();
    } catch (e) {
      // Se suelta la grabadora fallida: si se queda puesta, el siguiente intento cree
      // que hay una grabacion en curso y no arranca.
      grabadora = null;
      paraOndas();
      caja.hidden = true;
      const m = String(e?.message || e);
      return avisa('No se pudo grabar',
        /permission|denied|notallowed/i.test(m)
          ? 'El navegador bloqueó el micrófono. Permítelo en el candado de la barra de direcciones.'
          : m);
    }

    caja.hidden = false;
    // Las ondas salen del contexto del propio grabador. Si en alguna version no
    // estuviera, se graba igual: la onda es ayuda visual, no puede tumbar la grabacion.
    arrancaOndas(grabadora);
    const desde = Date.now();
    $('reloj').textContent = '0:00';
    relojT = setInterval(() => {
      const s = Math.floor((Date.now() - desde) / 1000);
      $('reloj').textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
      if (s >= 300) $('recEnviar').click();   // tope de cinco minutos
    }, 200);
  };

  $('recEnviar').onclick = () => {
    if (!grabadora) return;
    // El encoder termina en asincrono: se marca el envio y lo dispara ondataavailable
    // cuando el audio esta realmente listo. Enviar aqui mandaria un blob vacio.
    enviarAlParar = true;
    try { grabadora.stop(); } catch (e) {}
    parar();
  };
  $('recCancelar').onclick = () => {
    if (grabadora) { cancelada = true; try { grabadora.stop(); } catch (e) {} }
    parar();
  };
}

/* ---- Multimedia dentro del globo ----------------------------------------- */
// El enlace del archivo puede venir en media_url o dentro de attachments, y
// attachments unas veces es objeto, otras un array, y otras una cadena JSON. Se
// normaliza aqui para que el resto no tenga que saberlo.
// Meta no da URL publica del archivo: da un id que hay que canjear con el token del
// negocio, y ese token no puede vivir en el navegador. Se pide a crmMedia con la
// cabecera Authorization y se pinta desde un blob local. La cache evita volver a
// bajarlo cada vez que se repintan los globos, que es en cada mensaje nuevo.
const MEDIOS = new Map();
const BASE_FN = String(CFG.firebaseFunctionsBase || '').replace(/\/$/, '');

async function urlDeMedio(id){
  if (!id) return '';
  if (MEDIOS.has(id)) return MEDIOS.get(id);
  const u = auth.currentUser; if (!u) return '';
  try {
    const token = await u.getIdToken();
    const r = await fetch(BASE_FN + '/crmMedia?id=' + encodeURIComponent(id),
      { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) { MEDIOS.set(id, ''); return ''; }
    const url = URL.createObjectURL(await r.blob());
    MEDIOS.set(id, url);
    return url;
  } catch (e) { MEDIOS.set(id, ''); return ''; }
}

// Se resuelven despues de pintar: el globo sale ya, y la imagen aparece cuando llega.
// Bloquear el pintado hasta tenerlas dejaria el chat en blanco varios segundos.
// ===== Reproductor de notas de voz =====
// Uno solo para todo el hilo: si cada globo tuviera el suyo, empezar una nota dejaria
// sonando la anterior encima.
let audioActivo = null, vozActiva = null;

function cableaVoz(){
  document.querySelectorAll('.voz').forEach(v => {
    if (v.dataset.listo) return;
    v.dataset.listo = '1';
    const play = v.querySelector('.vplay');
    const vel = v.querySelector('.vvel');
    const tiempo = v.querySelector('.vtiempo');
    const prog = v.querySelector('.vprog');

    const pinta = () => {
      const a = audioActivo;
      const sonando = vozActiva === v && a && !a.paused;
      play.textContent = sonando ? '❚❚' : '▶';
      if (vozActiva === v && a) {
        const t = a.currentTime || 0;
        tiempo.textContent = Math.floor(t/60) + ':' + String(Math.floor(t%60)).padStart(2,'0');
        prog.style.width = a.duration ? (t / a.duration * 100) + '%' : '0%';
      }
    };

    play.onclick = async () => {
      if (vozActiva === v && audioActivo) {
        if (audioActivo.paused) { audioActivo.play(); } else { audioActivo.pause(); }
        pinta();
        return;
      }
      if (audioActivo) { audioActivo.pause(); const p = vozActiva?.querySelector('.vplay'); if (p) p.textContent = '▶'; }
      const src = v.dataset.src || (v.dataset.medioAudio ? await urlDeMedio(v.dataset.medioAudio) : '');
      if (!src) return avisa('No se pudo recuperar la nota de voz');
      audioActivo = new Audio(src);
      audioActivo.playbackRate = Number(vel.dataset.v || 1);
      vozActiva = v;
      audioActivo.ontimeupdate = pinta;
      audioActivo.onended = () => { prog.style.width = '0%'; tiempo.textContent = '0:00'; play.textContent = '▶'; };
      audioActivo.onerror = () => avisa('No se pudo reproducir la nota de voz');
      audioActivo.play().then(pinta).catch(() => avisa('No se pudo reproducir'));
    };

    // Velocidad: 1× → 1.5× → 2×. Escuchar una nota de dos minutos al doble es la
    // diferencia entre revisarlas todas o dejarlas sin oir.
    vel.onclick = () => {
      const ciclo = [1, 1.5, 2];
      const actual = Number(vel.dataset.v || 1);
      const siguiente = ciclo[(ciclo.indexOf(actual) + 1) % ciclo.length];
      vel.dataset.v = siguiente;
      vel.textContent = siguiente + '×';
      if (vozActiva === v && audioActivo) audioActivo.playbackRate = siguiente;
    };

    // Pinchar en la onda salta a ese punto.
    v.querySelector('.vonda').onclick = ev => {
      if (vozActiva !== v || !audioActivo?.duration) return;
      const r = ev.currentTarget.getBoundingClientRect();
      audioActivo.currentTime = ((ev.clientX - r.left) / r.width) * audioActivo.duration;
      pinta();
    };
  });
}

async function resuelveMedios(){
  cableaVoz();
  const pendientes = [...document.querySelectorAll('[data-medio]')];
  for (const el of pendientes) {
    const id = el.dataset.medio;
    el.removeAttribute('data-medio');
    const url = await urlDeMedio(id);
    if (!url) { el.replaceWith(Object.assign(document.createElement('div'),
      { className:'marchivo', innerHTML:'<b>Archivo</b><span>no se pudo recuperar de WhatsApp</span>' })); continue; }
    el.src = url;
    if (el.tagName === 'A') { el.href = url; el.removeAttribute('hidden'); }
  }
}

function adjuntoDe(m){
  let bruto = m && m.attachments;
  if (typeof bruto === 'string') { try { bruto = JSON.parse(bruto); } catch (e) { bruto = null; } }
  const a = Array.isArray(bruto) ? (bruto.find(x => x && typeof x === 'object') || {})
    : (bruto && typeof bruto === 'object' ? bruto : {});
  return {
    nombre: a.fileName || a.file_name || a.filename || '',
    mime: a.mimeType || a.mime_type || a.mimetype || '',
    peso: Number(a.size || 0) || 0,
    url: (m && m.media_url) || a.url || '',
  };
}
function pesoLegible(n){
  if (!n) return '';
  const u = ['B','KB','MB','GB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0) + ' ' + u[i];
}
function tarjetaArchivo(a, etiqueta){
  const nombre = a.nombre || etiqueta;
  const detalle = [a.mime, pesoLegible(a.peso)].filter(Boolean).join(' · ');
  // Sin url no se inventa un enlace roto: se dice que el archivo no la trae.
  if (!a.url) return '<div class="marchivo"><b>' + esc(nombre) + '</b>'
    + '<span>' + esc(detalle || 'sin enlace disponible') + '</span></div>';
  return '<div class="marchivo"><b>' + esc(nombre) + '</b>'
    + '<span>' + esc(detalle || 'archivo') + '</span>'
    + '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">Abrir</a></div>';
}
// La onda de una nota de voz. Dibujar la real exigiria descargar y decodificar TODOS
// los audios del hilo solo para pintar barritas, asi que se genera a partir del wamid:
// siempre la misma para el mismo mensaje, distinta entre mensajes, y sin coste. Es
// decoracion honesta -- no pretende representar el sonido, marca el avance.
function ondaFalsa(semilla){
  let h = 0;
  for (let i = 0; i < String(semilla).length; i++) h = (h * 31 + String(semilla).charCodeAt(i)) % 100000;
  let s = '';
  for (let i = 0; i < 34; i++) {
    h = (h * 1103515245 + 12345) % 2147483648;
    s += '<i style="height:' + (22 + (h % 68)) + '%"></i>';
  }
  return s;
}

function cuerpoMensaje(m){
  const t = String(m.msg_type || 'text').toLowerCase();
  const a = adjuntoDe(m);
  const pie = m.body && !/^\[[a-z]+\]$/i.test(m.body) ? '<div class="mpie">' + esc(m.body) + '</div>' : '';
  const id = m.media_id || '';
  // Si hay url directa se usa; si solo hay id, se marca el hueco y lo rellena
  // resuelveMedios() con lo que devuelva crmMedia.
  const medio = (etiqueta, html) => a.url ? html(esc(a.url))
    : id ? html('', true) : tarjetaArchivo(a, etiqueta);

  if (t === 'image') {
    return medio('Imagen', (src, porId) =>
      '<img class="mmedia" alt="imagen" loading="lazy"'
      + (porId ? ' data-medio="' + esc(id) + '"' : ' src="' + src + '"') + '>')
      + (m.image_description ? '<div class="mpie">' + esc(m.image_description) + '</div>' : '') + pie;
  }
  if (t === 'sticker') {
    return medio('Sticker', (src, porId) =>
      '<img class="msticker" alt="sticker" loading="lazy"'
      + (porId ? ' data-medio="' + esc(id) + '"' : ' src="' + src + '"') + '>');
  }
  if (t === 'video') {
    return medio('Video', (src, porId) =>
      '<video class="mmedia" controls preload="none"'
      + (porId ? ' data-medio="' + esc(id) + '"' : ' src="' + src + '"') + '></video>') + pie;
  }
  if (t === 'audio' || t === 'voice') {
    const trans = m.audio_transcript || m.transcription || '';
    // Reproductor propio con la forma de WhatsApp: boton redondo, onda, duracion y
    // velocidad. El <audio controls> del navegador ocupa el doble, cambia de aspecto en
    // cada navegador y dentro de un globo de chat se ve como un parche.
    return medio('Nota de voz', (src, porId) =>
      '<div class="voz"' + (porId ? ' data-medio-audio="' + esc(id) + '"' : ' data-src="' + src + '"') + '>'
      + '<button class="vplay" aria-label="Reproducir">▶</button>'
      + '<div class="vonda">' + ondaFalsa(m.wamid || m.id || '') + '<span class="vprog"></span></div>'
      + '<span class="vtiempo">0:00</span>'
      + '<button class="vvel" aria-label="Velocidad">1×</button>'
      + '</div>')
      + (trans ? '<div class="mpie">“' + esc(trans) + '”</div>' : '');
  }
  if (t === 'document' || t === 'file') {
    if (!a.url && id) return '<div class="marchivo"><b>' + esc(a.nombre || m.media_filename || 'Documento') + '</b>'
      + '<span>' + esc(m.media_mime || a.mime || 'archivo') + '</span>'
      + '<a data-medio="' + esc(id) + '" download="' + esc(a.nombre || m.media_filename || 'archivo') + '" hidden>Descargar</a></div>' + pie;
    return tarjetaArchivo(a, 'Archivo') + pie;
  }

  return esc(m.body || '');
}

function pintaMensajes(){
  const cont = $('mensajes'); if (!cont) return;
  const pegado = cont.scrollHeight - cont.scrollTop - cont.clientHeight < 90;
  let dia = '', antes = '';
  // El borrado es blando: el servidor conserva el mensaje y escribe la marca DENTRO de
  // metadata (index.js:1283), no en el primer nivel. Filtrando por m.deleted_at el
  // mensaje seguia a la vista mientras el panel decia "ocultado".
  const html = MSGS.filter(m => !m.metadata?.deleted && !m.metadata?.deleted_at).map(m => {
    const d = new Date(m.created_at);
    const etiquetaDia = d.toLocaleDateString('es-DO', { day:'numeric', month:'short' });
    let cabeza = '';
    if (etiquetaDia !== dia) { dia = etiquetaDia; cabeza = '<div class="dia">' + esc(etiquetaDia) + '</div>'; antes = ''; }
    const sale = m.direction === 'out';
    const emisor = sale ? (m.sender || 'agent') : 'in';
    const primero = emisor !== antes; antes = emisor;
    // El ternario anterior daba ✓ a TODO lo que no fuera leido o entregado, incluido
    // 'failed'. Un mensaje que Meta rechazo se veia igual que uno que salio bien, que
    // es exactamente cuando hace falta enterarse.
    const ticks = sale ? ({
      read: ' <b class="leido">✓✓</b>', delivered: ' ✓✓', sent: ' ✓',
      failed: ' <b class="fallo">⚠</b>',
    }[String(m.delivery_status || 'sent')] ?? ' ·') : '';
    const autor = (sale && m.sender === 'bot' && primero) ? '<div class="autor">Bot</div>' : '';
    const cita = m.reply_snippet
      ? '<div class="cita"><b>' + esc(m.reply_sender === 'customer' ? nombreDe(sel) : 'Tú') + '</b>'
        + esc(String(m.reply_snippet).slice(0,140)) + '</div>' : '';
    return cabeza + '<div class="globo ' + (sale ? 'sale' : 'entra') + ' ' + (primero ? 'primero' : 'seguido') + '"'
      + ' data-msg="' + esc(m.id || m.wamid || '') + '">'
      + '<button class="gaccion" aria-label="Opciones del mensaje">⌄</button>'
      + autor + cita + cuerpoMensaje(m)
      + '<span class="pie-globo">' + esc(d.toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'})) + ticks + '</span>'
      + '</div>';
  }).join('') || '<div style="margin:auto;color:var(--mut);font-size:13px">Sin mensajes todavía.</div>';

  // Repintado INCREMENTAL. Antes se reconstruia el hilo entero en cada snapshot, y un
  // snapshot llega con cada mensaje nuevo Y con cada cambio de estado de entrega. Eso
  // cortaba la nota de voz que estuvieras escuchando, cerraba el menu de mensaje que
  // tuvieras abierto y hacia volver a pedir todas las imagenes.
  //
  // Se compara el html generado con el anterior; si no cambio, no se toca el DOM. Si
  // cambio, se sustituyen SOLO los globos distintos, y nunca uno con audio sonando.
  if (cont.dataset.firma === html) { resuelveMedios(); return; }
  const previo = cont.dataset.firma;
  cont.dataset.firma = html;

  if (!previo) {
    cont.innerHTML = html;
  } else {
    const nuevo = document.createElement('div');
    nuevo.innerHTML = html;
    const viejos = [...cont.children], nuevos = [...nuevo.children];
    // Si la estructura cambio de largo, se reconstruye; comparar posicion a posicion con
    // longitudes distintas mezclaria mensajes que no se corresponden.
    if (viejos.length !== nuevos.length) {
      const sonando = cont.querySelector('.voz') && audioActivo && !audioActivo.paused;
      if (sonando) {
        // Llego un mensaje mientras se escuchaba una nota: se AÑADE lo que falta al
        // final en vez de rehacer el hilo, para no cortar el audio.
        nuevos.slice(viejos.length).forEach(n => cont.appendChild(n));
      } else {
        cont.innerHTML = html;
      }
    } else {
      viejos.forEach((v, i) => {
        if (v.outerHTML === nuevos[i].outerHTML) return;
        if (v.querySelector?.('.voz') && vozActiva && v.contains(vozActiva)) return;  // suena: no se toca
        v.replaceWith(nuevos[i]);
      });
    }
  }
  if (pegado) cont.scrollTop = cont.scrollHeight;
  resuelveMedios();
}

const opciones = (lista, actual) => lista.map(v =>
  '<option value="' + v + '"' + (actual === v ? ' selected' : '') + '>' + v.replace(/_/g,' ') + '</option>').join('');
const opcionesPares = (lista, actual, vacia = false) =>
  (vacia ? '<option value="">—</option>' : '') + lista.map(([v,l]) =>
    '<option value="' + esc(v) + '"' + (actual === v ? ' selected' : '') + '>' + esc(l) + '</option>').join('');
function fechaLocal(v){
  if (!v) return '';
  const d = new Date(v); if (Number.isNaN(d.getTime())) return '';
  const dos = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + dos(d.getMonth()+1) + '-' + dos(d.getDate())
    + 'T' + dos(d.getHours()) + ':' + dos(d.getMinutes());
}
function valorCampoFicha(el){
  const campo = el.dataset.c;
  if (el.type === 'checkbox') return el.checked;
  if (!el.value) return null;
  if (campo === 'selected_combo_price' || campo === 'makeup_price') {
    const n = Number(el.value); return Number.isFinite(n) ? n : null;
  }
  if (campo === 'scheduled_at' || campo === 'follow_up_at') {
    const d = new Date(el.value); return Number.isNaN(d.getTime()) ? null : d.toISOString();
  }
  return el.value;
}

      + '<div class="seccion">Plantillas sincronizadas y aprobadas por Meta</div>'
      + '<div id="tablaTpl"></div></div>');
    pintaPlantillasPropias();
    $('btnSyncTpl').onclick = async () => {
      $('btnSyncTpl').disabled = true;
      const r = await llama({ action:'templates', operation:'syncMeta',
        business_number: CFG.businessNumber || '' });
      $('btnSyncTpl').disabled = false;
      if (!r.ok) return avisa('No se pudo sincronizar', r.error);
      // El servidor devuelve creadas/actualizadas/retiradas/total, no "synced".
      avisa('Sincronizado con Meta',
        [r.creadas ? r.creadas + ' nuevas' : '', r.actualizadas ? r.actualizadas + ' actualizadas' : '',
         r.retiradas ? r.retiradas + ' retiradas' : ''].filter(Boolean).join(' · ')
        || ((r.total ?? 0) + ' plantillas, sin cambios'));
      pintaTablaTpl(true);
    };
    $('btnRecargaTpl').onclick = () => pintaTablaTpl(true);
  }
  pintaTablaTpl(!PLANTILLAS);
}

function pintaPlantillasPropias(){
  const cont = $('tplPropias'); if (!cont) return;
  cont.innerHTML = PLANTILLAS_PROPIAS.map((p,i) => '<div class="cfgc">'
    + '<h3>' + esc(p[1]) + '</h3><p class="cfgnota">' + esc(p[2]) + '</p>'
    + '<button class="btn-linea" data-tpl-propia="' + i + '">Copiar texto base</button></div>').join('');
  cont.onclick = async ev => {
    const b = ev.target.closest('[data-tpl-propia]'); if (!b) return;
    const p = PLANTILLAS_PROPIAS[Number(b.dataset.tplPropia)];
    try { await navigator.clipboard.writeText(p[2]); avisa('Plantilla copiada', p[1]); }
    catch (e) { avisa('No se pudo copiar', 'Selecciona el texto manualmente.'); }
  };
}

async function pintaTablaTpl(forzar){
  const cont = $('tablaTpl'); if (!cont) return;
  cont.innerHTML = '<p class="bajada"><span class="cargando"></span> Cargando…</p>';
  const lista = await cargaPlantillas(forzar);
  if (!lista) { cont.innerHTML = '<p class="bajada">No se pudieron cargar.</p>'; return; }
  if (!lista.length) {
    cont.innerHTML = '<p class="bajada">Todavía no hay plantillas. Pulsa «Sincronizar con Meta».</p>';
    return;
  }
  cont.innerHTML = '<div class="tabla"><div class="fila cabecera">'
    + '<span>Plantilla</span><span>Estado en Meta</span><span>Variables</span><span>Activa</span></div>'
    + lista.map((t,i) => {
      const estado = String(t.meta_status || '').toUpperCase() || 'DESCONOCIDO';
      const cls = estado === 'APPROVED' ? 'ok' : estado === 'REJECTED' ? 'mal' : 'medio';
      return '<div class="fila">'
        + '<span><b>' + esc(t.display_name || t.template_name) + '</b>'
        +   '<small>' + esc(t.template_name) + ' · ' + esc(t.language_code || 'es') + '</small></span>'
        + '<span><i class="chip ' + cls + '">' + esc(estado) + '</i></span>'
        + '<span>' + ((t.parameter_keys || []).join(', ') || '—') + '</span>'
        + '<span><button class="interruptor' + (t.active !== false ? ' on' : '') + '" data-tpl="' + i + '">'
        +   (t.active !== false ? 'sí' : 'no') + '</button></span>'
        + '</div>';
    }).join('') + '</div>';
  cont.onclick = async ev => {
    const b = ev.target.closest('[data-tpl]'); if (!b) return;
    const t = lista[Number(b.dataset.tpl)], siguiente = !(t.active !== false);
    b.disabled = true;
    const r = await llama({ action:'templates', operation:'update', id:t.id, active:siguiente });
    b.disabled = false;
    if (!r.ok) return avisa('No se pudo cambiar', r.error);
    t.active = siguiente;
    b.classList.toggle('on', siguiente);
    b.textContent = siguiente ? 'sí' : 'no';
  };
}

// Cinco vistas leen una coleccion y la enseñan. En vez de cinco copias de la misma
// pantalla, se declara que columnas tiene cada una y se pinta una sola funcion. Añadir
// otra es una entrada mas aqui, no otra vista que mantener aparte.
const TABLERO = {
  // Los nombres de campo salen del panel anterior, no de mi cabeza: la primera version
  // leia r.phone donde la columna es phone_primary, y r.rating donde son

    bajada: 'Los que ya compraron en el punto de venta. Se sincronizan desde la caja.',

    accion: 'posCustomers',
    queLoLlena: 'Se llena sola desde el punto de venta: cada cliente que compra en caja aparece aquí. Si está vacía, la caja todavía no ha sincronizado con el CRM.',
    orden: [{ field:'last_sale_at', ascending:false }],

    encabezado: pintaScorecard,
    titulo: 'Satisfacción',
    bajada: 'Lo que contestaron los clientes en la encuesta. Se pide desde el menú «⋯» de cada chat.',
    tabla: 'reviews',
    queLoLlena: 'Se llena cuando un cliente contesta la encuesta. La encuesta se pide desde el menú «⋯» de cada chat, o sola al cerrar como cliente si lo activas en Configuración.',
    orden: [{ field:'created_at', ascending:false }],

    queLoLlena: 'Se llena con las búsquedas de prospección, que corren fuera del panel. Si está vacía es que todavía no se ha hecho ninguna búsqueda.',
    orden: [{ field:'created_at', ascending:false }],

      { t:'Categoría', p:(r)=> r.category || '—' },

    ],

};
const TABLEROS_CARGADOS = new Set();

function pesos(centavos){
  const n = Number(centavos || 0);
  if (!n) return 'RD$0';
  return 'RD$' + (n / 100).toLocaleString('es-DO', { maximumFractionDigits: 0 });
}
function estrellas(n){
  const v = Number(n || 0);
  return v ? '★'.repeat(Math.min(5, v)) + '☆'.repeat(Math.max(0, 5 - v)) : '—';
}

// Nota media por persona, con su conteo. La media sin el numero de reseñas engaña: un
// 5 de una sola opinion no es mejor que un 4,6 de treinta.
async function pintaScorecard(filas){
  const equipo = await cargaColaboradores();
  const porPersona = new Map();
  let huerfanas = 0;
  for (const r of filas) {
    const id = r.collaborator_id;
    if (!id) { huerfanas++; continue; }
    const notas = [r.rating_service, r.rating_satisfaction].map(Number).filter(n => n > 0);
    if (!notas.length) continue;
    const media = notas.reduce((a,b) => a+b, 0) / notas.length;
    const p = porPersona.get(id) || { suma:0, n:0 };
    p.suma += media; p.n += 1;
    porPersona.set(id, p);
  }
  const nombreDe2 = id => {
    const x = equipo.find(e => String(e.id) === String(id));
    return x ? (x.name || x.display_name || x.email || 'sin nombre') : 'colaborador ' + String(id).slice(0,6);
  };
  const rank = [...porPersona.entries()]
    .map(([id,p]) => ({ id, nombre: nombreDe2(id), media: p.suma / p.n, n: p.n }))
    .sort((a,b) => b.media - a.media);

  if (!rank.length && !huerfanas) return '';
  return '<div class="pgraf" style="max-width:1000px;margin-bottom:16px">'
    + '<div class="pgcab"><b>Por colaborador</b><span>nota media · nº de opiniones</span></div>'
    + (rank.length
      ? '<div class="barras">' + rank.map(x =>
          '<div class="barra"><span class="be">' + esc(x.nombre) + '</span>'
          + '<span class="bp"><i style="width:' + Math.round(x.media / 5 * 100) + '%"></i></span>'
          + '<span class="bn">' + x.media.toFixed(1) + ' <em style="font-style:normal;color:var(--mut);font-weight:400">('
          + x.n + ')</em></span></div>').join('') + '</div>'
      : '')
    // Se dice cuantas no cuentan y por que. Un ranking incompleto sin avisar hace creer
    // que alguien atiende poco cuando lo que pasa es que no se anoto quien atendio.
    + (huerfanas ? '<p class="cfgnota" style="margin:' + (rank.length ? '12px 0 0' : '0') + '">'
        + huerfanas + ' opinión(es) sin colaborador asignado: no cuentan aquí. '
        + 'Al enviar la encuesta desde el chat, elige quién atendió.</p>' : '')
    + '</div>';
}

async function montaTablero(id){

  if (!montadas.has(id)) {
    montadas.add(id);
    hueco(id, '<div class="hoja"><h1>' + esc(d.titulo) + '</h1>'

      + '<div id="tb-' + id + '"></div></div>');
    document.querySelector('#vista-' + id + ' [data-recarga]').onclick = () => pintaTablero(id);

async function pintaTablero(id){
  const d = TABLERO[id], cont = $('tb-' + id);
  if (!cont) return;
  cont.innerHTML = '<p class="bajada"><span class="cargando"></span> Cargando…</p>';
  const r = d.accion
    ? await llama({ action:d.accion })
    : await llama({ action:'data', table:d.tabla, operation:'select',
        filters: d.filtros || [], order: d.orden || [], limit: 300 });
  if (!r.ok) {
    cont.innerHTML = '<p class="bajada">No se pudo cargar: ' + esc(r.error || 'error') + '</p>';
    return;
  }
  let filas = r.data || r.rows || [];
  TABLEROS_CARGADOS.add(id);
  if (d.soloConRespuesta) filas = filas.filter(f => f.rating_service || f.rating_satisfaction || f.comment);
  if (!filas.length) {
    // Vacio y roto se ven igual si solo se dice "no hay nada". Aqui se explica QUE
    // llena esta tabla, que es lo que permite saber si falta un dato o falta un enlace.
    cont.innerHTML = '<p class="bajada">Todavía no hay nada aquí.<br><br>'
      + esc(d.queLoLlena || 'Se llena desde el propio CRM.') + '</p>';
    return;
  }
  const anchos = d.cols.map(() => 'minmax(0,1fr)').join(' ');
  cont.innerHTML = (d.encabezado ? await d.encabezado(filas) : '')
    + '<div class="tabla" style="max-width:1000px">'
    + '<div class="fila cabecera" style="grid-template-columns:' + anchos + '">'
    +   d.cols.map(c => '<span>' + esc(c.t) + '</span>').join('') + '</div>'
    + filas.map(f => '<div class="fila" style="grid-template-columns:' + anchos + '">'
        + d.cols.map(c => '<span>' + esc(String(c.p(f))) + '</span>').join('') + '</div>').join('')
    + '</div><p class="bajada" style="margin-top:12px">' + filas.length + ' registro(s).</p>';
}
