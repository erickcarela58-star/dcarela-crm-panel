// Etiquetar en lote: la MISMA etiqueta (`labels`) que ya usa «Etiquetar» sobre varios chats
// seleccionados en Conversaciones, y el mismo buscador de siempre la encuentra despues.
async function stEtiquetaAudiencia(aud){
  const [tipo, clave] = aud.includes(':') ? aud.split(':') : [aud, ''];
  const sugerida = clave || tipo;
  const etiqueta = (window.prompt('Etiqueta para este grupo:', sugerida) || '').trim().toLowerCase();
  if (!etiqueta) return;
  const cuerpo = { action:'etiquetaAudienciaFoto', etiqueta, tipo, familia: clave, dias: 120 };
  const r = await llama(cuerpo);
  if (!r.ok) return avisa('No se pudo etiquetar', r.error);
  avisa('Etiquetadas', r.etiquetadas + (r.etiquetadas === 1 ? ' conversación' : ' conversaciones')
    + ' con «' + etiqueta + '».');
}

// ---- La agenda del WhatsApp del negocio ----
// Los clientes que faltan en la agenda del WhatsApp Business se guardan con su nombre (el de la
// caja primero) y se etiquetan. Se hace solo al publicar un Estado, y aquí se puede pedir a mano
// y ver cómo fue. Lo que hace de verdad el puente está en wa-bridge/src/agenda-whatsapp.js.
async function stAgenda(revisar){
  const r = await llama({ action:'agenda', operation: revisar ? 'revisar' : 'estado' });
  if (!r.ok) return avisa('No se pudo leer la agenda', r.error);
  const d = r.data || {};
  const hora = v => v ? new Date(v).toLocaleString('es-DO', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' }) : '';
  let cuerpo;
  if (revisar) cuerpo = '<p>Revisando la agenda en segundo plano. Guarda uno cada pocos segundos: con cientos '
    + 'de clientes tarda unos minutos. Vuelve a abrir esto para ver cómo va.</p>';
  else if (!d.status) cuerpo = '<p>Todavía no se ha revisado nunca.</p>';
  else if (d.status === 'leyendo') cuerpo = '<p>Revisando ahora (empezó ' + esc(hora(d.started_at)) + ').</p>';
  else if (d.status === 'fallo') cuerpo = '<p class="aviso">La última revisión falló: ' + esc(d.error || 'error') + '</p>';
  else cuerpo = '<p><b>' + Number(d.ya_guardados || 0) + '</b> de ' + Number(d.total || 0) + ' clientes ya estaban en la agenda. '
    + 'En la última revisión (' + esc(hora(d.finished_at)) + ') se guardaron <b>' + Number(d.agregados || 0) + '</b> '
    + 'y se etiquetaron <b>' + Number(d.etiquetados || 0) + '</b> chats.</p>'
    + (Number(d.faltan_guardar || 0) + Number(d.faltan_etiquetar || 0)
      ? '<p class="bajada">Quedan ' + Number(d.faltan_guardar || 0) + ' por guardar y ' + Number(d.faltan_etiquetar || 0)
        + ' por etiquetar: se hacen en la próxima revisión.</p>' : '')
    + (Number(d.sin_nombre || 0) ? '<p class="bajada">' + Number(d.sin_nombre) + ' no tienen nombre en el CRM ni en la caja '
      + 'y no se guardan: un número sin nombre en la agenda no sirve.</p>' : '')
    + (d.sin_etiquetas_leidas ? '<p class="aviso">No se pudieron leer las etiquetas de WhatsApp: por seguridad no se '
      + 'crea ninguna (podría renombrar una tuya).</p>' : '');
  abreModal('<div class="mtapa"><b>Agenda del WhatsApp del negocio</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo">' + cuerpo
    + '<p class="bajada">Se guardan con el nombre de la caja (o el del CRM) y con las etiquetas «Cliente D’Carela» y '
    + '«Compró en caja». No se toca a quien ya tenías guardado ni a los ignorados.</p>'
    + '<p class="bajada"><b>Ojo:</b> para que un cliente vea tus estados, <b>él</b> tiene que tener guardado el número '
    + 'del negocio. Guardarlo aquí hace que tú veas los suyos y que su chat salga con nombre.</p></div>'
    + '<div class="mpatas"><button class="btn-linea" data-cerrar>Cerrar</button>'
    + '<button class="btn-solido" id="stAgendaYa">Revisar ahora</button></div>');
  $('stAgendaYa').onclick = () => { cierraModal(); stAgenda(true); };
}

// ---- El visor ----
function stAbreContacto(tel){
  const grupos = stGrupos();
  // El mismo orden en que se ven en la lista: primero lo que falta por ver.
  const orden = [...grupos.filter(g => g.pendientes), ...grupos.filter(g => !g.pendientes)];
  const gi = orden.findIndex(g => g.tel === tel);
  if (gi < 0) return;
  ST.sel = tel;
  const lista = orden[gi].lista;
  const i = lista.findIndex(e => !stVisto(e));
  stVisor({ modo: 'ajenos', grupos: orden, gi, i: i < 0 ? 0 : i });
}

function stAbreMios(){
  const mios = stMios();
  if (!mios.length) return stCompositor('texto');
  escuchaVistasEstados();
  stVisor({ modo: 'mios', grupos: [{ tel: '', lista: mios }], gi: 0, i: 0 });
}

function stActual(){
  const v = ST.visor;
  return v ? v.grupos[v.gi]?.lista[v.i] : null;
}

function stVisor(estado){
  stCierraVisor(true);
  const d = document.createElement('div');
  d.className = 'st-visor'; d.id = 'stVisor';
  d.innerHTML = '<button class="st-ctl st-x" data-st="cerrar" aria-label="Cerrar">' + ST_ICO.cerrar + '</button>'
    + '<button class="st-flecha izq" data-st="ant" aria-label="Anterior">' + ST_ICO.izq + '</button>'
    + '<button class="st-flecha der" data-st="sig" aria-label="Siguiente">' + ST_ICO.der + '</button>'
    + '<div class="st-col"><div class="st-barras" id="stBarras"></div>'
    +   '<div class="st-quien"><button class="st-ctl" data-st="cerrar" aria-label="Volver">' + ST_ICO.atras + '</button>'
    +     '<span id="stQuienAv"></span><span class="st-quien-t"><b id="stQuienN"></b><i id="stQuienT"></i></span>'
    +     '<button class="st-ctl" data-st="pausa" id="stPausa" aria-label="Pausar">' + ST_ICO.pausa + '</button></div>'
    +   '<div class="st-escena" id="stEscena"></div>'
    +   '<div class="st-pie" id="stPie"></div>'
    +   '<div class="st-abajo" id="stAbajo"></div></div>';
  document.body.appendChild(d);
  // El foco pasa al visor. Si se quedaba en la fila de la lista, la barra espaciadora --pausar,
  // como en WhatsApp-- pulsaba esa fila y volvia a abrir el visor desde el principio.
  d.tabIndex = -1;
  d.focus({ preventScroll: true });
  ST.visor = { ...estado, raf: 0, dur: ST_DURACION_MS, pasado: 0, desde: null, pausado: false, hoja: false, arrancado: false };
  d.addEventListener('click', ev => {
    const b = ev.target.closest('[data-st]');
    if (!b) return;
    const q = b.dataset.st;
    if (q === 'cerrar') stCierraVisor();
    else if (q === 'ant') stAnterior();
    else if (q === 'sig') stSiguiente();
    else if (q === 'pausa') stPausa(!ST.visor.pausado);
    else if (q === 'enviar') stResponde();
    else if (q === 'vistas') stHoja(true);
    else if (q === 'cierrahoja') stHoja(false);
  });
  document.addEventListener('keydown', stTeclas);
  stMuestra();
}

function stTeclas(ev){
  if (!ST.visor) return;
  const escribiendo = ev.target && ev.target.id === 'stResp';
  if (ev.key === 'Escape') { ev.preventDefault(); return ST.visor.hoja ? stHoja(false) : stCierraVisor(); }
  if (escribiendo) return;
  if (ev.key === 'ArrowRight') { ev.preventDefault(); stSiguiente(); }
  else if (ev.key === 'ArrowLeft') { ev.preventDefault(); stAnterior(); }
  else if (ev.key === ' ') { ev.preventDefault(); stPausa(!ST.visor.pausado); }
}

function stCierraVisor(silencioso){
  const v = ST.visor;
  if (v) cancelAnimationFrame(v.raf);
  const d = $('stVisor');
  if (d) { d.querySelectorAll('video,audio').forEach(m => { try { m.pause(); } catch (e) {} }); d.remove(); }
  document.removeEventListener('keydown', stTeclas);
  ST.visor = null;
  if (!silencioso) pintaEstados();
}

function stMuestra(){
  const v = ST.visor, e = stActual();
  if (!v || !e) return stCierraVisor();
  cancelAnimationFrame(v.raf);
  v.pasado = 0; v.desde = null; v.dur = ST_DURACION_MS; v.hoja = false; v.arrancado = false;
  const lista = v.grupos[v.gi].lista;
  const mio = v.modo === 'mios';
  $('stBarras').innerHTML = lista.map((x, k) => '<span class="st-b"><i style="width:' + (k < v.i ? 100 : 0) + '%"></i></span>').join('');
  $('stQuienAv').innerHTML = mio ? stAvatarPropio() : stAvatar(v.grupos[v.gi].tel, e);
  $('stQuienN').textContent = mio ? 'Mi estado' : stNombre(v.grupos[v.gi].tel, e);
  $('stQuienT').textContent = stCuando(mio ? e.sent_at : e.posted_at);
  const escena = $('stEscena');
  const pie = $('stPie');
  escena.querySelectorAll('video,audio').forEach(m => { try { m.pause(); } catch (x) {} });
  // Lo que viene despues ya va de camino mientras se mira este: el resto de los de este contacto y
  // el primero sin ver del siguiente. Es lo que hace que pasar de uno a otro no espere al telefono.
  if (!mio) {
    stAdelanta(lista.slice(v.i + 1));
    const siguiente = v.grupos[v.gi + 1];
    if (siguiente) stAdelanta([siguiente.lista.find(x => !stVisto(x)) || siguiente.lista[0]].filter(Boolean));
  }
  const tipo = String(e.kind || '');
  const texto = String(e.body || '');
  pie.textContent = '';
  if (tipo === 'texto' || tipo === 'text') {
    const fondo = /^#[0-9a-f]{6}$/i.test(String(e.bg_color || e.color || '')) ? (e.bg_color || e.color) : ST_PALETA[0];
    const letra = /^#[0-9a-f]{6}$/i.test(String(e.text_color || '')) ? e.text_color : '#ffffff';
    escena.innerHTML = '<div class="st-txt" style="background:' + fondo + ';color:' + letra
      + ';font-family:' + (ST_FUENTES[Number(e.font) || 0] || ST_FUENTES[0]) + '">' + esc(texto) + '</div>';
    stArranca(Math.min(12000, ST_DURACION_MS + texto.length * 30));
  } else if (mio) {
    // Lo tuyo se publicó desde aquí y el archivo no se guardó: queda su miniatura.
    escena.innerHTML = e.media_thumb ? '<img class="st-img" src="' + esc(e.media_thumb) + '" alt="">' : '';
    pie.textContent = texto;
    stArranca(ST_DURACION_MS);
  } else {
    pie.textContent = texto;
    let mini = String(e.media_thumb_b64 || '');
    if (e.media_thumb_b64 === undefined && tipo !== 'audio') {
      // La lista ya no trae las miniaturas: se pide la de este estado y se pone en cuanto llega.
      const pedidoMini = e._id;
      stMini(e).then(m => {
        if (!m || stActual()?._id !== pedidoMini || !ST.visor) return;
        const img = $('stMedio');
        if (img && img.classList.contains('cargando')) img.src = m;
        else if (!img && $('stEscena')?.querySelector('.cargando')) $('stEscena').innerHTML = stImgVisor(m);
        const vid = $('stEscena')?.querySelector('video');
        if (vid && !vid.poster) vid.poster = m;
      });
    }
    if (tipo === 'audio') {
      escena.innerHTML = '<div class="st-audio">' + ST_ICO.micro + '<span>Nota de voz</span></div>';
    } else {
      escena.innerHTML = mini ? stImgVisor(mini) : '<span class="cargando"></span>';
    }
    // El archivo completo se pide al abrirlo, como «Ver» en un mensaje. Mientras llega se ve la
    // miniatura borrosa y la barra no avanza: el tiempo empieza cuando hay algo que mirar.
    // Ya venia de camino (stAdelanta), asi que casi siempre esta listo al instante. Si tarda,
    // a los 5 s empieza el tiempo igual: nadie espera 9 s mirando una foto borrosa.
    const pedido = e._id;
    const espera = setTimeout(() => { if (stActual()?._id === pedido && !v.arrancado) stArranca(ST_DURACION_MS); }, 5000);
    pideMedioCompleto(e._id).then(url => {
      clearTimeout(espera);
      if (!url || stActual()?._id !== pedido || !ST.visor) { if (!url && stActual()?._id === pedido && !v.arrancado) stArranca(ST_DURACION_MS); return; }
      if (tipo === 'video' || tipo === 'audio') {
        const m = document.createElement(tipo === 'video' ? 'video' : 'audio');
        m.src = url; m.autoplay = true; m.playsInline = true;
        // Sin poster, un <video> se ve NEGRO desde que se crea hasta que decodifica su primer
        // fotograma (puede tardar un momento): con esto se ve la misma miniatura borrosa de
        // siempre hasta ese instante, en vez de un salto a negro que parece un estado roto.
        if (tipo === 'video') { m.className = 'st-img'; if (mini) m.poster = mini; }
        m.onloadedmetadata = () => stArranca(Math.min(60000, Math.max(3000, (m.duration || 6) * 1000)));
        m.onerror = () => stArranca(ST_DURACION_MS);
        if (tipo === 'video') escena.innerHTML = '';
        escena.appendChild(m);
        m.play().catch(() => { m.muted = true; m.play().catch(() => {}); });
      } else {
        const img = $('stMedio');
        if (img) { img.src = url; img.classList.remove('cargando'); }
        else escena.innerHTML = '<img class="st-img" src="' + esc(url) + '" alt="">';
        if (!v.arrancado) stArranca(ST_DURACION_MS);
      }
    });
  }
  stPintaAbajo();
  // Visto: el anillo se pone gris en todos los dispositivos y, con la lectura encendida, al
  // autor le llega que lo viste, como con WhatsApp Web.
  if (!mio && !stVisto(e)) {
    ST.vistos.add(e._id);
    llama({ action:'statusSeen', status_id: e._id }).catch(() => {});
  }
}

function stPintaAbajo(){
  const v = ST.visor, e = stActual(), abajo = $('stAbajo');
  if (!v || !e || !abajo) return;
  if (v.modo === 'mios') {
    const vistas = (ST.vistas.get(e.wamid) || []);
    abajo.innerHTML = '<button class="st-ojo" data-st="vistas">' + ST_ICO.ojo + '<span>' + vistas.length + '</span></button>';
    if (v.hoja) stHoja(true);
    return;
  }
  if ($('stResp')) return;
  abajo.innerHTML = '<div class="st-resp"><input id="stResp" placeholder="Escribe una respuesta…" autocomplete="off">'
    + '<button class="st-enviar" data-st="enviar" aria-label="Enviar">' + ST_ICO.enviar + '</button></div>';
  const inp = $('stResp');
  // Escribir pausa, como en WhatsApp: si no, el estado se va mientras se contesta.
  inp.onfocus = () => stPausa(true);
  inp.onblur = () => { if (!inp.value.trim()) stPausa(false); };
  inp.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); stResponde(); } };
}

function stHoja(abrir){
  const v = ST.visor, e = stActual();
  if (!v || !e) return;
  $('stHoja')?.remove();
  v.hoja = !!abrir;
  if (!abrir) return stPausa(false);
  stPausa(true);
  const vistas = (ST.vistas.get(e.wamid) || []).slice()
    .sort((a, b) => String(b.viewed_at || '').localeCompare(String(a.viewed_at || '')));
  const h = document.createElement('div');
  h.className = 'st-hoja'; h.id = 'stHoja';
  h.innerHTML = '<div class="st-hoja-cab"><b>Visto por ' + vistas.length + '</b>'
    + '<button data-st="cierrahoja" aria-label="Cerrar">✕</button></div><div class="st-hoja-lista">'
    + (vistas.length ? vistas.map(x => {
      const tel = soloDigitos(x.wa_phone);
      return '<div class="st-fila">' + stAvatar(tel, null) + '<span class="st-texto"><b>'
        + esc(stNombre(tel, null)) + '</b><i>' + esc(stCuando(x.viewed_at)) + '</i></span></div>';
    }).join('') : '<div class="st-nada">Todavía nadie lo ha visto.</div>')
    + '</div>';
  document.querySelector('#stVisor .st-col').appendChild(h);
  resuelveAvatares();
}

function stArranca(ms){
  const v = ST.visor;
  if (!v) return;
  v.dur = ms; v.pasado = 0; v.arrancado = true; v.desde = v.pausado ? null : performance.now();
  stTick();
}

function stTick(){
  const v = ST.visor;
  if (!v) return;
  cancelAnimationFrame(v.raf);
  const t = v.pasado + (v.desde ? performance.now() - v.desde : 0);
  const barra = $('stBarras')?.children[v.i]?.firstElementChild;
  if (barra) barra.style.width = Math.min(100, (t / v.dur) * 100).toFixed(2) + '%';
  if (v.desde && t >= v.dur) return stSiguiente();
  v.raf = requestAnimationFrame(stTick);
}

function stPausa(pausar){
  const v = ST.visor;
  if (!v || v.pausado === pausar) return;
  if (pausar && v.desde) { v.pasado += performance.now() - v.desde; v.desde = null; }
  v.pausado = pausar;
  // Si el tiempo todavía no había empezado (la foto no ha llegado), reanudar no lo arranca.
  if (!pausar && v.arrancado) v.desde = performance.now();
  const b = $('stPausa');
  if (b) { b.innerHTML = pausar ? ST_ICO.play : ST_ICO.pausa; b.setAttribute('aria-label', pausar ? 'Reanudar' : 'Pausar'); }
  $('stEscena')?.querySelectorAll('video,audio').forEach(m => { try { pausar ? m.pause() : m.play(); } catch (e) {} });
  stTick();
}

function stSiguiente(){
  const v = ST.visor;
  if (!v) return;
  if (v.i + 1 < v.grupos[v.gi].lista.length) { v.i += 1; return stMuestra(); }
  // Al acabar los de un contacto se pasa al siguiente, como en WhatsApp.
  if (v.gi + 1 < v.grupos.length) {
    v.gi += 1;
    const lista = v.grupos[v.gi].lista;
    const i = lista.findIndex(e => !stVisto(e));
    v.i = i < 0 ? 0 : i;
    ST.sel = v.grupos[v.gi].tel;
    return stMuestra();
  }
  stCierraVisor();
}

function stAnterior(){
  const v = ST.visor;
  if (!v) return;
  if (v.i > 0) { v.i -= 1; return stMuestra(); }
  if (v.gi > 0) { v.gi -= 1; v.i = v.grupos[v.gi].lista.length - 1; ST.sel = v.grupos[v.gi].tel; return stMuestra(); }
  stMuestra();
}

async function stResponde(){
  const e = stActual(), inp = $('stResp');
  if (!e || !inp) return;
  const texto = inp.value.trim();
  if (!texto) return;
  inp.disabled = true;
  const r = await llama({ action:'statusReply', status_id: e._id, text: texto });
  inp.disabled = false;
  if (!r.ok) return avisa('No se pudo responder', r.error);
  inp.value = '';
  inp.blur();
  avisa('Respuesta enviada', 'Le llega a ' + stNombre(soloDigitos(e.wa_phone), e) + ' citando su estado.');
}

// ---- El compositor ----
// Texto sobre un color o foto con comentario, como en WhatsApp Web. Lo único que se añade es
// a quién: el CRM publica a una lista, y la cifra sale en la confirmación.
async function stCompositor(tipo){
  $('stComp')?.remove();
  const d = document.createElement('div');
  d.className = 'st-comp'; d.id = 'stComp';
  ST.comp = { tipo, color: 0, fuente: 0, foto: null, conteo: null };
  const barra = '<div class="st-comp-barra">'
    + (tipo === 'texto'
      ? '<button class="st-ctl" data-stc="fuente" title="Tipo de letra" aria-label="Tipo de letra">' + ST_ICO.letra + '</button>'
      + '<button class="st-ctl" data-stc="color" title="Color de fondo" aria-label="Color de fondo">' + ST_ICO.paleta + '</button>'
      : '')
    + '<select id="stcQuien" aria-label="A quién se le publica">'
    +   '<option value="prueba">' + esc(ES_ETIQUETAS.prueba) + '</option>'
    +   '<option value="activos" selected>' + esc(ES_ETIQUETAS.activos) + '</option>'
    +   '<option value="todos">' + esc(ES_ETIQUETAS.todos) + '</option></select>'
    + '<button class="st-enviar" data-stc="enviar" id="stcEnviar" aria-label="Publicar">' + ST_ICO.enviar + '</button></div>';
  d.innerHTML = '<button class="st-ctl st-x" data-stc="cerrar" aria-label="Cerrar">' + ST_ICO.cerrar + '</button>'
    + (tipo === 'texto'
      ? '<div class="st-comp-txt"><textarea id="stcTexto" maxlength="700" placeholder="Escribe un estado"></textarea></div>'
      : '<div class="st-comp-foto"><input type="file" id="stcArchivo" accept="image/*" hidden>'
        + '<div class="st-comp-foto" id="stcPrevia"><button class="btn-linea" data-stc="elegir">Elegir foto</button></div></div>')
    + barra;
  document.body.appendChild(d);
  stcPinta();
  d.addEventListener('click', ev => {
    const b = ev.target.closest('[data-stc]');
    if (!b) return;
    const q = b.dataset.stc;
    if (q === 'cerrar') return stcCierra();
    if (q === 'fuente') { ST.comp.fuente = (ST.comp.fuente + 1) % ST_FUENTES.length; return stcPinta(); }
    if (q === 'color') { ST.comp.color = (ST.comp.color + 1) % ST_PALETA.length; return stcPinta(); }
    if (q === 'elegir') return $('stcArchivo').click();
    if (q === 'enviar') return stcPublica();
  });
  document.addEventListener('keydown', stcTeclas);
  if (tipo === 'texto') {
    // El texto crece con lo que se escribe y queda centrado en la pantalla, como en WhatsApp.
    const area = $('stcTexto');
    const ajusta = () => { area.style.height = 'auto'; area.style.height = Math.min(area.scrollHeight, innerHeight * 0.7) + 'px'; };
    area.addEventListener('input', ajusta);
    ajusta();
    setTimeout(() => area.focus(), 50);
  }
  else {
    $('stcArchivo').onchange = () => {
      const f = ($('stcArchivo').files || [])[0];
      if (!f) return;
      ST.comp.foto = { blob: f, url: URL.createObjectURL(f) };
      // El input del archivo se queda fuera de lo que se repinta: un id repetido en la pagina
      // hace que getElementById devuelva el que no es.
      $('stcPrevia').innerHTML = '<img src="' + ST.comp.foto.url + '" alt="">'
        + '<input type="text" id="stcPie" maxlength="700" placeholder="Añade un comentario…">';
      $('stcPie').focus();
    };
    $('stcArchivo').click();
  }
  // La cifra de cada opción, como en la tarjeta de Difusión.
  const [r, rFoto] = await Promise.all([
    llama({ action:'statusAudience', dias: 180 }),
    llama({ action:'audienciaFoto' }),
  ]);
  if (!$('stComp')) return;
  if (r.ok) {
    ST.comp.conteo = r.data || {};
    const c = ST.comp.conteo.conteo || {};
    [...$('stcQuien').options].forEach(o => {
      const n = c[o.value] ? c[o.value].total : 0;
      o.textContent = ES_ETIQUETAS[o.value] + (o.value === 'activos' ? ' (180 días)' : '') + ' — ' + n
        + (n === 1 ? ' contacto' : ' contactos');
    });
  }
  // Las audiencias de fotografía, aparte de las tres de siempre: quien compró qué, según la
  // caja. Un grupo vacío no se ofrece — mandar «a nadie» no es una opción.
  if (rFoto.ok) {
    ST.comp.audienciaFoto = rFoto.data || {};
    const af = ST.comp.audienciaFoto;
    const opt = (valor, nombre, total) => total
      ? '<option value="' + esc(valor) + '">' + esc(nombre) + ' — ' + total + (total === 1 ? ' contacto' : ' contactos') + '</option>'
      : '';
    const opciones = (af.familias || []).map((f) => opt('familia:' + f.clave, f.nombre, f.total)).join('')
      + opt('dormidos', 'Dormidos (' + (af.dias || 120) + ' días sin comprar)', af.dormidos)
      + opt('mejores', 'Mejores clientes', af.mejores);
    if (opciones) {
      $('stcQuien').insertAdjacentHTML('beforeend', '<optgroup label="Por fotografía">' + opciones + '</optgroup>');
    }
  }
  if (ST_AUDIENCIA_PENDIENTE) {
    if ([...$('stcQuien').options].some((o) => o.value === ST_AUDIENCIA_PENDIENTE)) {
      $('stcQuien').value = ST_AUDIENCIA_PENDIENTE;
    }
    ST_AUDIENCIA_PENDIENTE = '';
  }
}

function stcTeclas(ev){
  if (ev.key === 'Escape' && $('stComp')) { ev.preventDefault(); stcCierra(); }
}

function stcCierra(){
  $('stComp')?.remove();
  if (ST.comp?.foto?.url) URL.revokeObjectURL(ST.comp.foto.url);
  ST.comp = null;
  document.removeEventListener('keydown', stcTeclas);
}

function stcPinta(){
  const d = $('stComp'), c = ST.comp;
  if (!d || !c) return;
  d.style.background = c.tipo === 'texto' ? ST_PALETA[c.color] : 'var(--st-visor)';
  const t = $('stcTexto');
  if (t) t.style.fontFamily = ST_FUENTES[c.fuente];
}

async function stcPublica(){
  const c = ST.comp;
  if (!c) return;
  const texto = c.tipo === 'texto' ? ($('stcTexto')?.value || '').trim() : ($('stcPie')?.value || '').trim();
  if (c.tipo === 'texto' && !texto) return avisa('Falta el estado', 'Escribe algo.');
  if (c.tipo === 'foto' && !c.foto) return avisa('Falta la foto', 'Elige una foto.');
  const quien = $('stcQuien').value;
  const d = c.conteo || (await llama({ action:'statusAudience', dias: 180 })).data || {};
  if (!d.listo) return avisa('No se puede publicar', d.motivo || 'la línea no está lista');
  // 'familia:clave', 'dormidos' o 'mejores' son las audiencias de fotografía; las otras tres
  // son las de siempre. Cada una trae su propia cifra y su propio texto para la pregunta.
  const esFamilia = quien.startsWith('familia:');
  const clave = esFamilia ? quien.slice('familia:'.length) : '';
  const af = c.audienciaFoto || {};
  let total, nombreQuien, cuerpoAudiencia;
  if (esFamilia) {
    const f = (af.familias || []).find((x) => x.clave === clave);
    total = f ? f.total : 0;
    nombreQuien = f ? f.nombre : clave;
    cuerpoAudiencia = { audience:'familia', familia: clave, dias: af.dias };
  } else if (quien === 'dormidos' || quien === 'mejores') {
    total = af[quien] || 0;
    nombreQuien = quien === 'dormidos' ? 'Dormidos (' + (af.dias || 120) + ' días sin comprar)' : 'Mejores clientes';
    cuerpoAudiencia = { audience: quien, dias: af.dias };
  } else {
    total = d.conteo && d.conteo[quien] ? d.conteo[quien].total : 0;
    nombreQuien = ES_ETIQUETAS[quien];
    cuerpoAudiencia = { audience: quien };
  }
  if (!total) return avisa('No hay a quién publicárselo', 'Esa opción no alcanza a nadie.');
  // La misma pregunta que en Difusión, con la cifra dentro.
  if (!await confirmaAqui('Se va a publicar en Estados para ' + total + ' contacto(s): '
    + nombreQuien + '.' + '\n\n'
    + 'Dura 24 horas y no se le puede quitar a quien ya lo haya visto.'
    + '\n\n' + '¿Publicar?')) return;
  const boton = $('stcEnviar');
  boton.disabled = true;
  const cuerpo = { action:'statusPost', text: texto, dias: 180, ...cuerpoAudiencia };
  if (c.tipo === 'texto') { cuerpo.color = ST_PALETA[c.color]; cuerpo.font = c.fuente; }
  else {
    try {
      // HD siempre: la foto entera, hasta 4096 px y 7,5 MB.
      const hd = await comprimeHdPuente(c.foto.blob);
      cuerpo.media_b64 = await leeBase64(hd);
      cuerpo.media_mime = hd.type || c.foto.blob.type || 'image/jpeg';
      const mini = await miniaturaParaEnviar(c.foto.blob);
      if (mini) cuerpo.media_thumb_b64 = mini;
    } catch (e) {
      boton.disabled = false;
      return avisa('No se pudo leer la foto', String(e && e.message || e));
    }
  }
  const r = await llama(cuerpo);
  boton.disabled = false;
  if (!r.ok) return avisa('No se pudo publicar', r.error);
  stcCierra();
  avisa('Estado en camino', 'Sale para ' + (r.data?.total || total) + ' contacto(s). Aparece en «Mi estado» en cuanto se publique.');
  setTimeout(stCargaMios, 4000);
  setTimeout(stCargaMios, 12000);
}

/* ---- Conversaciones ------------------------------------------------------ */
let filtro = 'todos';
function montaConversaciones(){
  if (montadas.has('conversations')) { pintaChats(); return; }
  montadas.add('conversations');
  hueco('conversations',
    '<div class="lista">'
    + '<div class="cabeza"><input id="buscaChat" placeholder="Buscar conversación o mensaje…">'
    +   '<button id="buscaMsgs" title="Buscar dentro de los mensajes" hidden>En los mensajes</button></div>'
    + '<div class="filtros" id="filtros"></div>'
    + '<div class="resbusca" id="resBusca" hidden></div>'
    + '<div class="barra-lote" id="barraLote" hidden></div>'
    + '<div class="chats" id="chats"></div>'
    + '</div>'
    + '<div class="conversacion" id="conversacion" style="display:none"></div>'
    + '<div class="vacio" id="sinChat">Selecciona una conversación para verla.</div>'
    + '<aside class="ficha" id="ficha" style="display:none"></aside>');
  $('buscaChat').addEventListener('input', () => {
    // El boton solo aparece cuando hay algo que buscar: buscar en los mensajes cuesta una
    // lectura por mensaje de la ventana, asi que no se dispara mientras se escribe.
    const t = $('buscaChat').value.trim();
    $('buscaMsgs').hidden = t.length < 3;
    if (!t) cierraBusquedaMensajes();
    pintaChats();
  });
  $('buscaChat').addEventListener('keydown', ev => { if (ev.key === 'Enter') buscaEnLosMensajes(); });
  $('buscaMsgs').onclick = buscaEnLosMensajes;
  $('resBusca').addEventListener('click', ev => {
    const fila = ev.target.closest('[data-resconv]');
    if (!fila) return;
    const c = buscaConv(fila.dataset.resconv);
    if (!c) return avisa('No encuentro ese chat', 'Puede que ya no exista o que se haya archivado.');
    cierraBusquedaMensajes();
    abre(c);
    // Y se salta al mensaje, si esta entre los que carga el hilo.
    const id = fila.dataset.resmsg;
    if (id) setTimeout(() => saltaAlMensaje(id), 400);
  });
  $('filtros').addEventListener('click', async ev => {
    // La x va ANTES que el filtro: esta dentro del boton, asi que sin cortar aqui quitar una
    // etiqueta la seleccionaria de paso, y la barra se repintaria con el filtro puesto en una
    // etiqueta que acaba de desaparecer.
    const x = ev.target.closest('[data-quitaetq]');
    if (x) {
      ev.stopPropagation();
      const fuera = x.dataset.quitaetq;
      // En automatico no hay lista guardada: se fija la que se esta viendo, menos la quitada.
      // Sin esto, quitar una en automatico no guardaria nada y volveria a salir al repintar.
      const quedan = etiquetasEnLaBarra().filter(e => e !== fuera);
      // Si era la ultima, la lista queda vacia y eso significa "automatico", no "ninguna".
      // Se dice, porque volver al automatico no es lo mismo que quedarse sin barra.
      if (!await guardaAjuste('etiquetas_filtro', quedan.join(','))) return;
      if (filtro === 'etq:' + fuera) filtro = 'todos';
      pintaChats();
      avisa('Etiqueta quitada de la barra', quedan.length
        ? 'Sigue en las fichas; solo deja de ocupar sitio arriba.'
        : 'Sin ninguna elegida, la barra vuelve a enseñar sola las más usadas.');
      return;
    }
    if (ev.target.closest('#masEtq')) { abreEtiquetasBarra(); return; }
    const b = ev.target.closest('[data-filtro]');
    if (!b) return;
    filtro = b.dataset.filtro; pintaChats();
  });
  arrastraFiltros($('filtros'));
  $('chats').addEventListener('click', ev => {
    const marca = ev.target.closest('.marcar');
    if (marca) {
      ev.stopPropagation();
      const id = marca.closest('[data-conv]').dataset.conv;
      if (LOTE.has(id)) LOTE.delete(id); else LOTE.add(id);
      pintaLote(); pintaChats();
      return;
    }
    const f = ev.target.closest('[data-conv]');
    if (f) abre(buscaConv(f.dataset.conv));
  });
  cableaLote();
  pintaChats();
}

// Arrastrar con el raton para deslizar los filtros. En tactil ya funciona solo; en
// escritorio no hay gesto y la rueda tampoco desplaza en horizontal, asi que sin esto
// los ultimos filtros son inalcanzables con el raton.
function arrastraFiltros(caja){
  if (!caja) return;
  let activo = false, inicioX = 0, inicioScroll = 0, movido = 0;
  caja.addEventListener('pointerdown', ev => {
    if (ev.pointerType === 'touch') return;   // el tactil ya lo hace el navegador
    activo = true; movido = 0;
    inicioX = ev.clientX; inicioScroll = caja.scrollLeft;
    // NO se captura el puntero. setPointerCapture redirige el click al contenedor, asi
    // que el listener delegado recibia ev.target = #filtros, closest('[data-filtro]')
    // devolvia null y NINGUN filtro se podia pulsar con raton. El arrastre funciona
    // igual sin capturar: pointermove sigue llegando mientras el boton este pulsado, y
    // pointerup en window cierra el gesto aunque se suelte fuera de la caja.
  });
  caja.addEventListener('pointermove', ev => {
    if (!activo) return;
    const d = ev.clientX - inicioX;
    movido = Math.max(movido, Math.abs(d));
    // Solo a partir de 4px se considera arrastre; por debajo es un clic con pulso y
    // bloquear el boton ahi haria que los filtros no se pudieran pulsar.
    if (movido > 4) caja.classList.add('arrastrando');
    caja.scrollLeft = inicioScroll - d;
  });
  const soltar = () => {
    if (!activo) return;
    activo = false;
    setTimeout(() => caja.classList.remove('arrastrando'), 0);
  };
  // En window, no en la caja: si se suelta el raton fuera de los filtros, sin esto el
  // gesto se quedaria pegado y la lista seguiria arrastrandose sola.
  window.addEventListener('pointerup', soltar);
  window.addEventListener('pointercancel', soltar);
  // Un arrastre de verdad no debe contar tambien como click en el filtro que quedo debajo.
  caja.addEventListener('click', ev => {
    if (movido > 4) { ev.stopPropagation(); ev.preventDefault(); }
  }, true);
  // La rueda vertical desplaza en horizontal: es lo que espera cualquiera con raton.
  caja.addEventListener('wheel', ev => {
    if (Math.abs(ev.deltaY) <= Math.abs(ev.deltaX)) return;
    ev.preventDefault();
    caja.scrollLeft += ev.deltaY;
  }, { passive:false });
}

// Estado de la linea de WhatsApp Web. null = todavia no se sabe, y mientras no se sepa no se
// esconde nada: esconder por defecto es peor error que enseñar de mas. El servidor bloquea
// igual los envios que no deben salir.
//
// Antes habia DOS formulas que se contradecian: al entrar solo miraba status (e ignoraba la
// pausa y la PC), y al abrir Canales miraba ademas paused, asi que con los envios en pausa
// desaparecian las 580 fichas de la linea viva. Ninguna miraba el numero, de modo que las 37
// fichas del 18094785620 salian mezcladas con las del 18097575644. Y como bridgeStatus exige
// admin, a un agente no se le escondia nada. Ahora el estado sale de UN sitio, lineaDesdeControl,
// y llega en vivo a cualquier rol por el espejo crm_channel_state/whatsapp_qr.
let LINEA_QR = null;
// Lo ultimo que se leyo y si viene de la escucha en vivo o de una consulta suelta (bridgeStatus).
let LINEA_QR_FUENTE = null;
async function cargaEstadoPuente(){
  // Respaldo cuando el espejo no existe (servidor viejo) o las reglas no dejan leerlo. Solo lo
  // contesta a un admin; a los demas les llega un error y la linea sigue en "no se sabe".
  const r = await llama({ action:'bridgeStatus' });
  if (r.ok) fijaLineaQr(r.bridge || r, { enVivo:false });
}
// Si Instagram y Messenger estan encendidos. El ajuste vive en el servidor --es del negocio, no
// de cada navegador-- y lo devuelve socialStatus, que ya existia para la vista de Canales: no
// hace falta otra proyeccion. Si la llamada falla, se quedan ocultos, que es lo pedido.
async function cargaEstadoRedes(){
  const r = await llama({ action:'socialStatus' });
  if (r.ok) fijaRedesActivas(r.activas === true);
}
function fijaLineaQr(p, { enVivo = false } = {}){
  // Una consulta suelta no pisa a la escucha en vivo: se quedaria congelada diciendo que la PC
  // responde aunque se apague despues.
  if (p && typeof p === 'object' && (enVivo || !LINEA_QR_FUENTE?.enVivo)) {
    LINEA_QR_FUENTE = { p, enVivo, leidoEn: Date.now() };
  }
  if (!LINEA_QR_FUENTE) return;
  // Con la escucha en vivo la edad del latido se mide contra el reloj (si la PC se apaga, el
  // espejo deja de cambiar y envejece). Con una consulta suelta se mide contra cuando se leyo:
  // de lo que pasa despues no se sabe nada, y eso no puede leerse como "la PC dejo de responder".
  const f = LINEA_QR_FUENTE;
  const nueva = lineaDesdeControl(f.p, f.enVivo ? Date.now() : f.leidoEn);
  const firma = l => l ? [l.numero, l.vinculado, l.pausado, l.hostVivo, l.motivoPausa, l.transporte].join('|') : '';
  const cambia = firma(nueva) !== firma(LINEA_QR);
  LINEA_QR = nueva;
  // Canales lleva su propia firma: el progreso y el estado del historial no cambian la linea, y
  // meterlos en la de arriba repintaria las 580 fichas, el Kanban y el Dashboard en cada latido
  // de la importacion. Sin esto, una sincronizacion que arranca sola (nadie pulso "Sincronizar",
  // asi que vigilaPuente no corre) dejaba la tarjeta con el estado viejo hasta el final. No hay
  // bucle: la llamada interna de renderBridgeControlState ve la misma firma y no vuelve.
  const firmaCanales = f.enVivo ? [f.p.history_sync_status, f.p.history_sync_progress].join('|') : '';
  const cambiaCanales = firmaCanales !== fijaLineaQr.firmaCanales;
  fijaLineaQr.firmaCanales = firmaCanales;
  if (!cambia) {
    if (cambiaCanales && f.enVivo && $('bridgePairBtn')) renderBridgeControlState(controlConEspejo(bridgeControlState, f.p), '');
    return;
  }
  recalculaVisibles();
  if (vistaActual === 'conversations') pintaChats();
  if (vistaActual === 'funnel') { pintaKanban(); pintaMovilizacion(); }
  if (vistaActual === 'dashboard') pintaDashboard();
  if (vistaActual === 'hoy') pintaHoy();
  if (vistaActual === 'agenda') pintaAgenda();
  if (vistaActual === 'reminders') pintaRecordatorios();
  pintaCuentas();
  pintaAvisoLinea();
  // Canales se pinta con el mismo estado: asi la pausa, el porcentaje del historial y la PC
  // caida se mueven solos en vez de esperar a que alguien pulse "Actualizar estado". Solo con la
  // escucha en vivo: una consulta suelta ya viene de renderBridgeControlState y volveria sobre
  // sus pasos.
  if (f.enVivo && $('bridgePairBtn')) renderBridgeControlState(controlConEspejo(bridgeControlState, f.p), '');
}
function escuchaLineaQr(){
  if (escuchaLineaQr.para) { escuchaLineaQr.para(); escuchaLineaQr.para = null; }
  let respaldoPedido = false;
  const respaldo = () => { if (!respaldoPedido) { respaldoPedido = true; cargaEstadoPuente(); } };
  try {
    escuchaLineaQr.para = onSnapshot(doc(db, 'crm_channel_state', 'whatsapp_qr'), s => {
      if (!s.exists()) return respaldo();
      fijaLineaQr(s.data(), { enVivo:true });
    }, () => respaldo());
  } catch (e) { respaldo(); }
  // Sin red: cada 30 s se vuelve a mirar la edad del latido. Es lo que esconde las fichas cuando
  // la PC se apaga, porque entonces ya no llega ningun cambio que lo dispare.
  if (!escuchaLineaQr.reloj) escuchaLineaQr.reloj = setInterval(() => fijaLineaQr(null), 30_000);
}

// ---- Funciones puras de la linea (las ejecuta test/v2-linea-qr.test.js) ----
// vinculado cuenta 'connecting' porque la sesion ya esta abierta y comprobandose. La PC se da por
// perdida a los 5 min sin latido: el servidor deja de aceptar envios a los 2, pero esconder 580
// fichas por un reinicio de la PC seria peor que enseñarlas un rato mas.
function lineaDesdeControl(p, ahora = Date.now(), margenMs = 5 * 60_000){
  if (!p || typeof p !== 'object') return null;
  const status = String(p.status || p.state || '').toLowerCase();
  const visto = Date.parse(String(p.host_last_seen_at || ''));
  return {
    numero: soloDigitos(p.connected_phone),
    vinculado: status === 'connected' || status === 'connecting',
    pausado: p.paused === true,
    motivoPausa: String(p.pause_reason || ''),
    transporte: String(p.transport_mode || ''),
    hostVivo: Number.isFinite(visto) ? ahora - visto <= margenMs : true,
  };
}
// El espejo (crm_channel_state) tiene lo que puede ver cualquiera; bridgeStatus, que exige
// admin, tiene ademas el codigo de vinculacion y los contadores del historial. Esto junta las
// dos: lo del espejo manda porque llega en vivo, y lo que solo trae crmApi se conserva.
//
// host_online no viene en el espejo, se deduce del latido. El espejo recorta ese latido al
// minuto --para no escribir una vez cada 10 s-- asi que con menos de 3 minutos de margen una PC
// viva se leeria como caida solo por el redondeo.
const CAMPOS_ESPEJO = ['status', 'connected_phone', 'paused', 'pause_reason', 'transport_mode',
  'link_platform', 'history_sync_status', 'history_sync_progress', 'bot_enabled',
  'last_linked_phone', 'previous_linked_phone', 'line_changed_at', 'host_last_seen_at'];
function controlConEspejo(previo, p, ahora = Date.now(), margenMs = 3 * 60_000){
  if (!p || typeof p !== 'object') return previo || {};
  const copia = {};
  for (const k of CAMPOS_ESPEJO) if (p[k] !== undefined) copia[k] = p[k];
  const visto = Date.parse(String(p.host_last_seen_at || ''));
  if (Number.isFinite(visto)) copia.host_online = ahora - visto <= margenMs;
  return { ...(previo || {}), ...copia };
}
function lineaDe(c){ return soloDigitos(c?.business_number); }
// 'viva' | 'desconocido' | 'sin_puente' | 'otra_linea' | 'pausada'. Solo aplica a WhatsApp Web.
function estadoQr(c, linea){
  if (canalDe(c) !== 'whatsapp_qr') return 'viva';
  if (!linea) return 'desconocido';
  if (!linea.vinculado || !linea.hostVivo) return 'sin_puente';
  // Sin numero conectado o sin numero en la ficha no se puede comparar: no se esconde por eso.
  // El servidor rechaza igual el envio.
  if (linea.numero && lineaDe(c) && lineaDe(c) !== linea.numero) return 'otra_linea';
  if (linea.pausado) return 'pausada';
  return 'viva';
}
// Una conversacion del segundo numero cuya linea no esta conectada esta muerta: por ahi no entra
// ni sale nada, y dejarla en la lista invita a escribirle a alguien que no va a recibirlo. Se
// esconde, pero NO se borra: el filtro de su linea la trae, y reaparece sola al volver a vincular.
// La pausa NO esconde: la linea sigue recibiendo y se reanuda con un boton.
function oculta(c){
  const e = estadoQr(c, LINEA_QR);
  return e === 'otra_linea' || e === 'sin_puente';
}
function claveOculta(c){ return lineaDe(c) || 'sin_numero'; }
// Ignorada: la marca la pone el servidor (accion 'ignore') y es lo unico que se mira. Va antes que
// la linea: una ignorada no cuenta ni como oculta, porque tampoco vuelve al vincular su numero.
function ignorada(c){ return !!c?.ignored_at; }

// --- Instagram y Messenger ocultos ---------------------------------------------------------
//
// Esas dos redes se atienden en la bandeja de Meta, no aqui: la app sigue en modo Desarrollo y
// por el CRM no entra casi nada. Se ESCONDEN, no se borran: no se quita ni una ficha ni una
// linea del codigo de conectarlas, y el interruptor de Configuracion las devuelve enteras.
//
// REDES_ACTIVAS arranca en false a proposito. Mientras el servidor no conteste, lo que el dueno
// pidio es que no esten; al reves --ensenarlas y hacerlas desaparecer un segundo despues-- se
// lee como que el panel pierde conversaciones solo.
//
// Vive aqui, pegado al filtro, y no arriba junto a CONVS porque las pruebas recortan ESTE tramo
// del panel y lo ejecutan de verdad: lo que el filtro lee tiene que estar declarado dentro.
let REDES_ACTIVAS = false;
let CONVS_REDES = [];
// Se compara el source EXACTO y no canalDe: canalDe clasifica por subcadenas ('ig', 'fb'), asi
// que un source raro como 'migration_ig' se escondria sin ser de ninguna red. Ensenar de mas es
// mejor error que esconder de mas.
function redOculta(c){
  if (REDES_ACTIVAS === true) return false;
  const s = String(c?.source || '').toLowerCase();
  return s === 'instagram' || s === 'facebook';
}
function recalculaVisibles(){
  CONVS = CONVS_TODAS.filter(c => !ignorada(c) && !oculta(c) && !redOculta(c));
  CONVS_OCULTAS = CONVS_TODAS.filter(c => !ignorada(c) && oculta(c));
  CONVS_REDES = CONVS_TODAS.filter(c => !ignorada(c) && !oculta(c) && redOculta(c));
  CONVS_IGNORADAS = CONVS_TODAS.filter(ignorada);
}
// El interruptor puede cambiarse en Configuracion o desde otra pestana. Cuando llega distinto, la
// bandeja se rehace sola: tener que recargar para ver aparecer o desaparecer conversaciones es
// justo lo que hace creer que esconder fue borrar.
function fijaRedesActivas(activas){
  const nueva = activas === true;
  if (nueva === REDES_ACTIVAS) return;
  REDES_ACTIVAS = nueva;
  recalculaVisibles();
  if (vistaActual === 'conversations') pintaChats();
  if (vistaActual === 'dashboard') pintaDashboard();
  if (vistaActual === 'hoy') pintaHoy();
  if (vistaActual === 'funnel') { pintaKanban(); pintaMovilizacion(); }
  pintaCuentas();
}
// Las busquedas por id miran tambien las ocultas, las de redes y las ignoradas: desde la Agenda,
// un aviso o la ficha se tiene que poder abrir una conversacion aunque no salga en la bandeja, y
// la ficha de una que se acaba de ignorar tiene que seguir refrescandose.
function buscaConv(id){
  const k = String(id ?? '');
  const igual = x => String(x._id || x.id) === k;
  return CONVS.find(igual) || CONVS_OCULTAS.find(igual)
    || CONVS_REDES.find(igual) || CONVS_IGNORADAS.find(igual);
}

// Abrir un chat concreto desde fuera: ?chat=<id>. Es lo que convierte un recordatorio del
// iPhone --o un enlace pegado en cualquier sitio-- en "llevame a ESA conversacion" en vez de
// "abre el CRM y busca a ver". Sin esto, el recordatorio decia el nombre y tocaba buscarlo a
// mano en una bandeja de 946 chats.
//
// Se intenta en cada llegada de datos, pero solo durante el primer medio minuto: antes no hay
// a quien abrir, y media hora despues seria arrancarle el chat de delante a quien ya esta
// trabajando en otro.
let CHAT_URL_PENDIENTE = (() => {
  try { return new URLSearchParams(location.search).get('chat') || ''; } catch (e) { return ''; }
})();
const CHAT_URL_LIMITE = Date.now() + 30000;
function abreChatDeLaUrl(){
  if (!CHAT_URL_PENDIENTE) return;
  if (Date.now() > CHAT_URL_LIMITE) { CHAT_URL_PENDIENTE = ''; return; }
  // buscaConv mira los cuatro cubos: tambien se llega asi a una oculta o a una ignorada, que es
  // justo cuando mas cuesta encontrarla a mano.
  const c = buscaConv(CHAT_URL_PENDIENTE);
  if (!c) return;
  CHAT_URL_PENDIENTE = '';
  ve('conversations');
  abre(c);
  // Y se quita el parametro de la barra: recargar la pagina dos horas despues no puede volver a
  // saltar al chat de un recordatorio ya atendido.
  try {
    const u = new URL(location.href);
    u.searchParams.delete('chat');
    history.replaceState(null, '', u.pathname + u.search + u.hash);
  } catch (e) { /* si el navegador no deja tocar la barra, el chat ya quedo abierto */ }
}
const MOTIVO_PAUSA = {
  vinculacion: 'Se pausaron solos al vincular la línea y se reanudan cuando la conexión queda estable.',
  manual: 'Los pausó una persona desde el panel.',
  calidad: 'Se pausaron solos porque WhatsApp rechazó varios envíos seguidos: revisa el número antes de reanudar.',
};
// Por que no se puede escribir en este chat, con la causa real. Pura: el compositor y el guard
// del boton de enviar leen lo mismo.
function avisoLineaQr(c, linea){
  const estado = estadoQr(c, linea);
  if (estado === 'otra_linea') return { estado, bloquea:true, titulo:'Línea desvinculada.',
    texto:'Chat de la línea ' + telefonoLegible(lineaDe(c)) + ', que ya no está vinculada (ahora '
      + telefonoLegible(linea.numero) + '). Solo lectura; vuelve a activarse si se vincula ese número.' };
  if (estado === 'sin_puente') return !linea.vinculado
    ? { estado, bloquea:true, titulo:'WhatsApp Web sin vincular.',
        texto:'No hay ninguna línea de WhatsApp Web conectada: por aquí no entra ni sale nada. Vincúlala en Canales.' }
    : { estado, bloquea:true, titulo:'La PC del puente no responde.',
        texto:'Hace más de 5 minutos que el programa del puente no da señales: lo que escribas no saldría. Revisa la PC del negocio.' };
  if (estado === 'pausada') return linea.transporte && linea.transporte !== 'active'
    ? { estado, bloquea:true, titulo:'Envíos en modo seguro.',
        texto:'Esta línea todavía no tiene los envíos activados. Actívalos en Canales («Activar envíos de este número»).' }
    : { estado, bloquea:true, reanudar:true, titulo:'Envíos en pausa.',
        texto:(MOTIVO_PAUSA[linea.motivoPausa] || 'No consta el motivo de la pausa.') + ' Reanudar requiere un administrador.' };
  return { estado, bloquea:false, titulo:'', texto:'' };
}
// Por que no se puede escribir en un chat de una red oculta. Pura, igual que avisoLineaQr: el
// compositor y el guard del boton de enviar leen exactamente lo mismo.
function avisoRedOculta(c){
  if (!redOculta(c)) return { bloquea:false, titulo:'', texto:'' };
  const red = String(c?.source || '').toLowerCase() === 'instagram' ? 'Instagram' : 'Messenger';
  return { bloquea:true, red, titulo: red + ' está oculto en el CRM.',
    texto:'Por aquí no sale nada: se contesta en la bandeja de Meta (menú, debajo de '
      + 'Conversaciones). Para volver a atenderlo desde el CRM, actívalo en Configuración.' };
}

// ---- Buscar un contacto: piezas puras
//
// Un solo criterio para TODOS los buscadores del panel: la bandeja, reenviar, agendar y el
// selector del asistente. Cada uno filtraba a su manera y los cuatro fallaban en lo mismo, que
// es lo que el dueño reportó --«los clientes no me aparecen al buscarlos por nombre o por su
// número»--. Medido en producción el 2026-09-25, sobre 951 fichas:
//
//  - Solo se miraba UN nombre. El nombre con el que el dueño conoce a un cliente es muchas
//    veces el de la CAJA (pos_client_nombre): en 64 de las 98 fichas atadas a la caja ese
//    nombre no estaba en ningún otro campo, y buscarlo no encontraba nada.
//  - Con tildes: «jose» no encontraba a «José» (45 fichas con tilde o ñ).
//  - El número tenía que escribirse como se guarda: «809-478-5620» o «(809) 478 5620» no
//    encontraban a 18094785620.
//  - Las palabras tenían que ir juntas y en orden: «juan perez» no daba con «Juan Carlos Pérez».
//
// Sin dependencias del resto del panel a propósito: se prueba suelto.
function sinTildes(v){
  return String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

// Todos los nombres por los que se puede conocer a alguien. `name` va por las fichas viejas.
function nombresDe(c){
  return [c?.customer_name, c?.contact_name, c?.display_name, c?.pos_client_nombre, c?.name]
    .filter(Boolean).map(String);
}

function coincideContacto(c, q, { conVistaPrevia = false } = {}){
  const bruto = String(q || '').trim();
  if (!bruto) return true;
  const digitos = bruto.replace(/\D/g, '');
  const tel = String(c?.wa_phone || '').replace(/\D/g, '');
  // Por número se compara SOLO por dígitos, se escriba como se escriba. Cuatro como mínimo:
  // con dos o tres casi cualquier teléfono coincide.
  if (digitos.length >= 4 && tel) {
    if (tel.includes(digitos)) return true;
    // Buscado con el 1 del país y guardado sin él: es el mismo.
    if (digitos.length === 11 && digitos.startsWith('1') && tel.includes(digitos.slice(1))) return true;
  }
  if (/^[\d\s+().-]+$/.test(bruto)) {
    // Un número que no es el teléfono puede estar en la vista previa: un precio, un folio.
    return conVistaPrevia && digitos.length >= 3 && String(c?.last_message_preview || '').includes(bruto);
  }
  const pajar = sinTildes([
    ...nombresDe(c),
    ...(Array.isArray(c?.labels) ? c.labels : []), ...(Array.isArray(c?.tags) ? c.tags : []),
    conVistaPrevia ? c?.last_message_preview : '',
  ].join(' | '));
  // Cada palabra en cualquier sitio: «juan perez» encuentra a «Juan Carlos Pérez».
  return sinTildes(bruto).split(/\s+/).filter(Boolean).every(p => pajar.includes(p));
}

// El número como lo guarda el CRM, o '' si no se sabe cuál es. Mismas reglas que el servidor
// (inicia-chat-core.js): diez dígitos que empiezan por 809, 829 u 849 son dominicanos y les
// falta el 1; siete dígitos no se adivinan (podría ser de cualquiera de los tres); otro país
// tiene que venir con su prefijo entero.
function telefonoParaChat(entrada){
  const d = String(entrada || '').replace(/\D/g, '');
  const rd = ['809', '829', '849'];
  if (d.length === 10 && rd.includes(d.slice(0, 3))) return '1' + d;
  if (d.length === 11 && d.startsWith('1') && rd.includes(d.slice(1, 4))) return d;
  if (d.length >= 11 && d.length <= 15 && !d.startsWith('0')) return d;
  return '';
}

// Los teléfonos dominicanos que vienen escritos dentro de un mensaje --«escríbele a mi esposa
// al 809-555-1234»-- se vuelven pulsables. Se aplica sobre el texto YA escapado: la expresión
// solo toca dígitos, espacios, puntos, guiones, paréntesis y el +, que esc() no cambia.
// El primer grupo hace de "lookbehind": que el número no sea la cola de uno más largo.
const RE_TEL_TEXTO = /(^|[^\d+])((?:\+?1[\s.-]?)?\(?(?:809|829|849)\)?[\s.-]?\d{3}[\s.-]?\d{4})(?!\d)/g;
function conTelefonos(html){
  return String(html || '').replace(RE_TEL_TEXTO, (todo, antes, num) => {
    const tel = telefonoParaChat(num);
    return tel ? antes + '<a href="#" class="telmsg" data-tel="' + tel + '" title="Abrir un chat con este número">' + num + '</a>' : todo;
  });
}
// ---- Buscar un contacto: fin de las piezas puras

function filtradas(){
  const t = ($('buscaChat')?.value || '').trim();
  // 'lin:<numero>' es la salida de las ocultas: sin ella esconder seria borrar.
  const lin = filtro.startsWith('lin:') ? filtro.slice(4) : null;
  // Y 'can:instagram' / 'can:facebook' es la salida de las redes ocultas, por lo mismo. El filtro
  // del canal las trae aunque no esten en CONVS, en solo lectura.
  const red = filtro.startsWith('can:') && CONVS_REDES.some(c => canalDe(c) === filtro.slice(4));
  // 'ignorados' es la salida de las ignoradas. Y una busqueda por texto en Todos tambien las
  // encuentra, marcadas: si el dueno busca a alguien por su nombre tiene que ver que esta ignorado
  // (y poder deshacerlo) en vez de creer que esa conversacion no existe.
  //
  // Escribir en el buscador busca en TODAS las conversaciones, no dentro del filtro elegido.
  // Antes, con «Sin leer» o una etiqueta puesta, buscar a un cliente que no estaba en ese
  // filtro decía que no existía; es la primera causa de «no me aparece». Solo las vistas de
  // salida --ignorados, otra línea, una red apagada-- se buscan por dentro, porque ahí lo que
  // se mira es esa lista. Las redes apagadas no entran en la búsqueda general: se apagaron para
  // no verlas.
  const vistaDeSalida = filtro === 'ignorados' || lin !== null || red;
  const buscandoEnTodo = !!t && !vistaDeSalida;
  const base = filtro === 'ignorados' ? CONVS_IGNORADAS
    : lin !== null ? CONVS_OCULTAS.filter(c => claveOculta(c) === lin)
    : red ? CONVS_REDES
    : buscandoEnTodo
      ? [...CONVS, ...CONVS_IGNORADAS, ...CONVS_OCULTAS].sort((a, b) => String(b.last_message_at || '').localeCompare(String(a.last_message_at || '')))
      : CONVS;
  return base.filter(c => {
    if (!buscandoEnTodo) {
      if (filtro === 'sinleer' && !(Number(c.unread || 0) > 0)) return false;
      if (filtro === 'humano' && !(c.mode === 'human' || c.human_handoff_required)) return false;
      if (filtro === 'bot' && c.mode !== 'bot') return false;
      if (filtro.startsWith('etq:') && !etiquetasDe(c).includes(filtro.slice(4))) return false;
      if (filtro.startsWith('can:') && canalDe(c) !== filtro.slice(4)) return false;
    }
    return coincideContacto(c, t, { conVistaPrevia: true });
  })
  // Los anclados arriba, como en WhatsApp. La ordenación es estable: entre los anclados, y
  // entre los demás, se mantiene el orden que ya traían (lo más reciente primero).
  .sort((a, b) => (anclado(b) ? 1 : 0) - (anclado(a) ? 1 : 0));
}
/* ---- Buscar dentro de los mensajes --------------------------------------- */
// El buscador de la bandeja mira nombre, telefono y la ultima vista previa. Con 11.000 mensajes
// eso deja fuera casi todo: "a quien le mande el combo de bodas" no se encontraba de ninguna
// manera, y en WhatsApp Web si. Esto lo resuelve el servidor, porque Firestore no sabe buscar
// "contiene" y hay que leer una ventana de mensajes y filtrarla alli.
function cierraBusquedaMensajes(){
  const c = $('resBusca'); if (!c) return;
  c.hidden = true;
  c.innerHTML = '';
}

async function buscaEnLosMensajes(){
  const texto = ($('buscaChat')?.value || '').trim();
  const caja = $('resBusca'); if (!caja) return;
  if (texto.length < 3) return cierraBusquedaMensajes();
  const boton = $('buscaMsgs');
  if (boton) boton.disabled = true;
  caja.hidden = false;
  caja.innerHTML = '<div class="resvacio"><span class="cargando"></span> Buscando en los mensajes…</div>';
  const r = await llama({ action:'searchMessages', texto });
  if (boton) boton.disabled = false;
  if (!r.ok) { caja.innerHTML = '<div class="resvacio">' + esc(r.error || 'No se pudo buscar') + '</div>'; return; }
  if (!r.resultados || !r.resultados.length) {
    // Se dice CUANTO se miro: "no hay nada" y "no hay nada en los ultimos 6.000" no son lo mismo,
    // y con lo segundo el dueno sabe que el mensaje puede estar mas atras.
    caja.innerHTML = '<div class="resvacio">Sin resultados'
      + (r.mirados ? ' en los últimos ' + r.mirados.toLocaleString('es-DO') + ' mensajes.' : '.') + '</div>';
    return;
  }
  caja.innerHTML = '<div class="rescab">' + r.resultados.length + ' mensaje(s) en '
    + r.conversaciones + ' conversación(es)</div>'
    + r.resultados.map(m => '<button class="resfila" data-resconv="' + esc(m.conversation_id) + '"'
      + (m.id ? ' data-resmsg="' + esc(m.id) + '"' : '') + '>'
      + '<span class="resquien">' + esc(m.contacto || 'Sin nombre')
      +   '<i>' + esc(fechaDelResultado(m.created_at)) + '</i></span>'
      + '<span class="restexto">' + (m.direction === 'out' ? 'Tú: ' : '') + esc(m.texto) + '</span>'
      + '</button>').join('');
}

// Fecha corta para la lista de resultados. Sin ella, cada fila lleva un ISO de 24 caracteres.
//
// NO se llama fechaCorta: ese nombre ya existe mas abajo, y dos declaraciones iguales en el
// mismo modulo son un SyntaxError que deja el panel entero sin ejecutar. Paso de verdad entre
// v118 y v120. Lo vigila test/v2-sintaxis.test.js.
function fechaDelResultado(iso){
  const t = Date.parse(String(iso || ''));
  if (!Number.isFinite(t)) return '';
  return new Date(t).toLocaleDateString('es-DO', { day:'numeric', month:'short', year:'2-digit' });
}

// Saltar al mensaje dentro del hilo, si esta entre los que se cargaron. Si no, no se hace nada:
// el chat ya esta abierto, que es el 90 % de lo que se venia a hacer.
function saltaAlMensaje(id){
  const globo = document.querySelector('.globo[data-msg="' + CSS.escape(String(id)) + '"]');
  if (!globo) return;
  globo.scrollIntoView({ behavior: 'smooth', block: 'center' });
  globo.classList.add('resaltado');
  setTimeout(() => globo.classList.remove('resaltado'), 1400);
}

function pintaChats(){
  const cont = $('chats'); if (!cont) return;
  // Las cuentas cuentan lo MISMO que se ve. Un filtro que dice 12 y abre 8 se lee como
  // que el panel perdio cuatro conversaciones.
  // Si la linea de un filtro 'lin:' ya volvio (se vinculo ese numero), el filtro no tiene nada que
  // ensenar: se vuelve a Todos en vez de dejar la lista vacia sin explicacion.
  if (filtro.startsWith('lin:') && !CONVS_OCULTAS.some(c => claveOculta(c) === filtro.slice(4))) filtro = 'todos';
  // Lo mismo con 'Ignorados' cuando ya no queda ninguna (se deshizo la ultima).
  if (filtro === 'ignorados' && !CONVS_IGNORADAS.length) filtro = 'todos';
  const cuenta = f => CONVS.filter(c =>
    f === 'todos' ? true
    : f === 'sinleer' ? Number(c.unread||0) > 0
    : f === 'humano' ? (c.mode === 'human' || c.human_handoff_required)
    : c.mode === 'bot').length;
  // Las etiquetas se añaden como filtros detras de los fijos: son las que el equipo
  // inventa, y sin poder filtrar por ellas no sirven para nada.
  // Antes entraban TODAS, y con el etiquetado automatico son decenas: la fila de filtros
  // se volvia un scroll interminable donde no se encontraba nada. Se aplica aqui la misma
  // regla que ya rige para los canales, dos lineas mas abajo: una etiqueta que solo marca
  // una conversacion no es un filtro, es ruido. Las raras siguen viendose y poniendose en
  // la ficha del lead; lo que no hacen es competir por el sitio de las que se usan.
  // Si el negocio eligio cuales quiere en la barra, mandan esas y en el orden que las
  // eligio. El automatico solo entra cuando no ha elegido ninguna: acierta a menudo, pero
  // la etiqueta que importa esta semana no tiene por que ser la mas usada del historico.
  const porEtiqueta = etiquetasEnLaBarra().map(e => ['etq:' + e, e]);
  // Solo se ofrecen los canales que de verdad tienen conversaciones: un filtro que
  // siempre devuelve cero es ruido.
  const porCanal = Object.keys(CANALES)
    .filter(k => CONVS.some(c => canalDe(c) === k))
    .map(k => ['can:' + k, CANALES[k].corto]);
  // Una salida por cada linea oculta, con su numero entero y por que no sale en Todos: sin esto,
  // esconder seria borrar. 'desvinculado' si es otro numero que el conectado; 'inactivo' si es
  // la propia linea con el puente caido.
  const ocultasPorLinea = new Map();
  CONVS_OCULTAS.forEach(c => ocultasPorLinea.set(claveOculta(c), (ocultasPorLinea.get(claveOculta(c)) || 0) + 1));
  const porLinea = [...ocultasPorLinea.keys()].map(k => ['lin:' + k, 'WA Web '
    + (k === 'sin_numero' ? 'sin número' : telefonoLegible(k)) + ' · '
    + (LINEA_QR?.numero && k !== LINEA_QR.numero ? 'desvinculado' : 'inactivo')]);
  // Instagram y Messenger ocultos NO ponen chip fijo en la barra: dejarlo ahi seria esconderlos a
  // medias. Pero mientras SU filtro esta puesto --se llega desde Canales-- el chip tiene que
  // verse y decir por que ensena cosas que no salen en Todos, igual que 'WA Web · inactivo'.
  const redesOcultasEnBarra = new Map();
  CONVS_REDES.forEach(c => redesOcultasEnBarra.set(canalDe(c), (redesOcultasEnBarra.get(canalDe(c)) || 0) + 1));
  const porRedOculta = filtro.startsWith('can:') && redesOcultasEnBarra.has(filtro.slice(4))
    ? [[filtro, (CANALES[filtro.slice(4)]?.corto || filtro.slice(4)) + ' · oculto']] : [];
  // La salida de las ignoradas, solo si hay alguna. Dice cuantas tienen mensajes sin leer: una
  // persona ignorada que vuelve a escribir (un colega que ahora quiere contratar) no suena ni
  // cuenta en ningun sitio, y este es el unico lugar donde se ve.
  const ignSinLeer = CONVS_IGNORADAS.filter(c => Number(c.unread || 0) > 0).length;
  const porIgnoradas = CONVS_IGNORADAS.length
    ? [['ignorados', 'Ignorados' + (ignSinLeer ? ' · ' + ignSinLeer + ' sin leer' : '')]] : [];
  $('filtros').innerHTML = [['todos','Todos'],['sinleer','Sin leer'],['humano','Humano'],['bot','Bot'],
      ...porCanal, ...porRedOculta, ...porLinea, ...porIgnoradas, ...porEtiqueta]
    .map(([f,n]) => {
      const n2 = f.startsWith('etq:') ? CONVS.filter(c => etiquetasDe(c).includes(f.slice(4))).length
        : f.startsWith('can:') ? (redesOcultasEnBarra.get(f.slice(4))
            || CONVS.filter(c => canalDe(c) === f.slice(4)).length)
        : f.startsWith('lin:') ? (ocultasPorLinea.get(f.slice(4)) || 0)
        : f === 'ignorados' ? CONVS_IGNORADAS.length
        : cuenta(f);
      // La x va en TODAS las de etiqueta. La primera version solo la ponia cuando ya habia
      // lista elegida, y como en automatico nunca la hay, no aparecia nunca: el dueno paso el
      // cursor por encima y no salio nada. Quitar una en automatico deja fijada la lista
      // actual menos esa, que es exactamente lo que espera quien pulsa la x.
      const quitable = f.startsWith('etq:');
      return '<button class="filtro' + (filtro===f?' on':'') + (f.startsWith('etq:')?' etqf':'')
        + '" data-filtro="' + esc(f) + '">' + esc(n) + '<b>' + n2 + '</b>'
        + (quitable ? '<i class="quitaetq" data-quitaetq="' + esc(f.slice(4))
            + '" title="Quitar de la barra" aria-label="Quitar ' + esc(n) + ' de la barra">×</i>' : '')
        + '</button>';
    }).join('')
    // El + va al final, siempre. Elegir que etiquetas se ven estaba solo en Configuracion,
    // a cuatro clics de donde se usan: quien filtra esta mirando la barra, no los ajustes.
    + '<button class="filtro masetq" id="masEtq" title="Elegir etiquetas de la barra" '
    +   'aria-label="Elegir etiquetas de la barra">+</button>';

  const filas = filtradas();
  const arriba = sugerenciasDeBusqueda();
  if (!filas.length) {
    cont.innerHTML = arriba + '<div style="padding:26px 16px;color:var(--mut);font-size:13px;text-align:center">'
      + ($('buscaChat')?.value.trim() ? 'Ninguna conversación coincide.' : 'No hay conversaciones con este filtro.') + '</div>';
    return;
  }
  cont.innerHTML = arriba + filas.map(c => {
    const n = nombreDe(c), sinLeer = Number(c.unread || 0) > 0;
    const marcas = [];
    if (ignorada(c)) marcas.push('<span class="etiqueta ign">ignorada · ' + esc(TIPOS_IGNORAR[c.ignored_kind] || 'otro') + '</span>');
    if (c.lifecycle_stage) marcas.push('<span class="etiqueta">' + esc(c.lifecycle_stage) + '</span>');
    if (c.proactive_blocked_at) marcas.push('<span class="etiqueta">sin automatización</span>');
    else if (c.mode === 'human' || c.human_handoff_required) marcas.push('<span class="etiqueta">humano</span>');
    if (anclado(c)) marcas.push('<span class="etiqueta">📌 anclado</span>');
    if (silenciado(c)) marcas.push('<span class="etiqueta">🔕 silenciado</span>');
    if (sinLeer) marcas.push('<span class="globito">' + Number(c.unread) + '</span>');
    const canal = CANALES[canalDe(c)];
    const escribeAqui = textoEscribiendoCliente(c);
    return '<div class="chat' + (sel && sel._id === c._id ? ' on' : '') + (sinLeer ? ' sinleer' : '')
      + '" data-conv="' + esc(c._id) + '">'
      + '<button class="marcar' + (LOTE.has(c._id) ? ' on' : '') + '" aria-label="Seleccionar"></button>'
      + '<div class="avwrap">' + avatarDe(c, n)
      +   '<span class="canalpin" title="' + esc(canal.nombre) + '" '
      +     'style="background:' + canal.color + '">' + canal.logo + '</span></div>'
      + '<div class="cuerpo">'
      +   '<div class="fila1"><div class="nom">' + esc(n) + '</div>'
      +     '<div class="hora">' + esc(hora(c.last_message_at)) + '</div></div>'
      // En la lista tambien, como WhatsApp Web: mientras escribe, la vista previa del ultimo
      // mensaje se cambia por el aviso, no se le suma al lado.
      +   (escribeAqui
          ? '<div class="prev escribiendo-cliente">' + esc(escribeAqui) + '</div>'
          : '<div class="prev">' + esc(c.last_message_preview || '') + '</div>')
      +   '<div class="marcas">' + marcas.join('') + '</div>'
      + '</div></div>';
  }).join('');
  resuelveAvatares();
}

// ===== INICIAR UN CHAT CON UN NÚMERO NUEVO =====
//
// Pulsar un número --el que un cliente manda por WhatsApp, el que se escribe en el buscador o
// el de un cliente de la caja que nunca ha escrito-- y que se abra el chat. El servidor
// comprueba antes, por el puente, que el número tenga WhatsApp (acción startChat); la misma
// llamada sirve para preguntar y para ver cómo va, así que aquí solo se repite hasta que hay
// respuesta.

// Los clientes de la caja, para ofrecer los que todavía no tienen chat. Se piden una vez, al
// empezar a buscar, y valen diez minutos: son ~900 filas pequeñas, no hace falta más.
let CLIENTES_CAJA = { filas: null, en: 0, pidiendo: null };
function clientesDeCaja(){
  const fresco = CLIENTES_CAJA.filas && Date.now() - CLIENTES_CAJA.en < 10 * 60000;
  if (fresco || CLIENTES_CAJA.pidiendo) return;
  CLIENTES_CAJA.pidiendo = llama({ action:'posCustomers' }).then(r => {
    if (r.ok && Array.isArray(r.data)) CLIENTES_CAJA = { filas: r.data, en: Date.now(), pidiendo: null };
    else CLIENTES_CAJA.pidiendo = null;
    if ($('buscaChat')?.value.trim()) pintaChats();
  }).catch(() => { CLIENTES_CAJA.pidiendo = null; });
}

// Lo que va ENCIMA de la lista mientras se busca: iniciar un chat con el número escrito, si
// no hay ninguno con él, y los clientes de la caja que coinciden y no tienen chat.
function sugerenciasDeBusqueda(){
  const t = ($('buscaChat')?.value || '').trim();
  if (!t) return '';
  let html = '';
  if (filtro !== 'todos' && !['ignorados'].includes(filtro) && !filtro.startsWith('lin:'))
    html += '<div class="bushint">Buscando en todas las conversaciones, no solo en este filtro.</div>';
  const conChat = new Set(CONVS_TODAS.map(c => soloDigitos(c.wa_phone)).filter(Boolean));
  const tel = telefonoParaChat(t);
  if (tel && !conChat.has(tel)) {
    html += botonIniciar(tel, '', 'Iniciar chat con ' + telefonoLegible(tel), 'Comprueba si tiene WhatsApp y abre la conversación.');
  }
  if (t.length >= 3) {
    clientesDeCaja();
    const caja = (CLIENTES_CAJA.filas || [])
      .map(r => ({ nombre: String(r.name || ''), tel: telefonoParaChat(r.phone) }))
      .filter(r => r.tel && !conChat.has(r.tel) && r.tel !== tel)
      .filter(r => coincideContacto({ pos_client_nombre: r.nombre, wa_phone: r.tel }, t))
      .slice(0, 5);
    for (const r of caja) {
      html += botonIniciar(r.tel, r.nombre, r.nombre || telefonoLegible(r.tel),
        'Cliente de la caja sin chat · ' + telefonoLegible(r.tel) + ' · Iniciar chat');
    }
  }
  return html;
}

function botonIniciar(tel, nombre, titulo, bajada){
  return '<button class="iniciar" data-iniciar="' + esc(tel) + '" data-nombre="' + esc(nombre || '') + '">'
    + '<span class="ico">💬</span><span><b>' + esc(titulo) + '</b><i>' + esc(bajada) + '</i></span></button>';
}

// La ficha nueva llega por el snapshot de conversaciones, que tarda un instante. Se espera a
// que esté para abrirla: abrir un id que el panel todavía no conoce no enseñaría nada.
async function esperaConversacion(id, ms = 8000){
  const hasta = Date.now() + ms;
  while (Date.now() < hasta) {
    const c = buscaConv(id);
    if (c) return c;
    await new Promise(r => setTimeout(r, 300));
  }
  return null;
}

let INICIANDO_CHAT = false;
async function iniciaChat(tel, nombre = ''){
  if (INICIANDO_CHAT) return;
  // Si ya está abierto ese chat no hay nada que iniciar.
  if (sel && soloDigitos(sel.wa_phone) === tel) return avisa('Ya estás en ese chat');
  INICIANDO_CHAT = true;
  avisa('Comprobando si tiene WhatsApp…', telefonoLegible(tel));
  try {
    const hasta = Date.now() + 30000;
    let r;
    for (;;) {
      r = await llama({ action:'startChat', phone: tel, name: nombre || '' });
      if (!r.ok) return avisa('No se pudo abrir el chat', r.error);
      if (r.estado !== 'comprobando') break;
      // El servidor da por perdida una pregunta sin respuesta al minuto; el panel no espera
      // tanto: medio minuto sin noticias es que el puente no está atendiendo.
      if (Date.now() > hasta) return avisa('WhatsApp no contestó a tiempo', 'Inténtalo otra vez en un momento.');
      await new Promise(res => setTimeout(res, 1500));
    }
    if (r.estado === 'sin_whatsapp') return avisa('Ese número no tiene WhatsApp', telefonoLegible(tel));
    if (r.estado === 'fallo') return avisa('No se pudo comprobar el número', 'Inténtalo otra vez en un momento.');
    const c = await esperaConversacion(r.conversation_id);
    if (!c) return avisa('Chat creado', 'Aparecerá en la bandeja en unos segundos.');
    const caja = $('buscaChat');
    if (caja && caja.value) { caja.value = ''; cierraBusquedaMensajes(); pintaChats(); }
    abre(c);
    if (r.nueva) avisa('Chat nuevo abierto', 'Tiene WhatsApp. Ya puedes escribirle.');
  } finally {
    INICIANDO_CHAT = false;
  }
}

// Los dos sitios donde se pulsa un número: la sugerencia del buscador y un número dentro de
// un mensaje. Un solo escuchador en el documento, porque los globos se repintan solos.
document.addEventListener('click', ev => {
  const boton = ev.target.closest('[data-iniciar]');
  if (boton) { ev.preventDefault(); iniciaChat(boton.dataset.iniciar, boton.dataset.nombre || ''); return; }
  const enlace = ev.target.closest('.telmsg[data-tel]');
  if (enlace) { ev.preventDefault(); ev.stopPropagation(); iniciaChat(enlace.dataset.tel); }
});

// ===== «ESCRIBIENDO…» HACIA EL CLIENTE =====
//
// Lo que el cliente nota al dejar WhatsApp Web. Se avisa mientras se teclea --una vez cada
// cuatro segundos, no en cada tecla-- y se apaga al enviar, al vaciar la caja y al cambiar de
// conversacion. Si el navegador se cierra a mitad de una frase no llega ningun apagado, y por
// eso el puente lo apaga solo a los veinte segundos: nadie se queda «escribiendo…» eternamente.
//
// Solo por WhatsApp Web: en Instagram y Messenger esto no existe, y por el numero oficial la
// API no lo permite. El servidor manda de verdad --tiene el interruptor y el estado de la
// linea--; aqui se cortan las llamadas que se sabe que no valen.
const ESCRIBIENDO_CADA_MS = 4000;
let ESCRIBIENDO = { conv:'', en:0 };

function avisaEscribiendo(c, hayTexto){
  const id = c && (c.id || c._id);
  if (!id || canalDe(c) !== 'whatsapp_qr') return;
  if (AJUSTES.escribiendo === 'false') return;
  const ahora = Date.now();
  if (!hayTexto) {
    if (ESCRIBIENDO.conv !== id) return;
    ESCRIBIENDO = { conv:'', en:0 };
    llama({ action:'typing', conversation_id:id, state:'paused' }).catch(() => {});
    return;
  }
  if (ESCRIBIENDO.conv === id && ahora - ESCRIBIENDO.en < ESCRIBIENDO_CADA_MS) return;
  ESCRIBIENDO = { conv:id, en:ahora };
  // Sin avisar de un fallo: es un adorno. Si no llega, el cliente no ve «escribiendo…» y ya;
  // un aviso de error por esto taparia los que si importan.
  llama({ action:'typing', conversation_id:id, state:'composing' }).catch(() => {});
}

// Al dejar un chat se apaga el de ese chat, no el nuevo: si no, el cliente anterior se queda
// viendo «escribiendo…» hasta que el puente lo caduque.
function apagaEscribiendo(){
  const id = ESCRIBIENDO.conv;
  if (!id) return;
  ESCRIBIENDO = { conv:'', en:0 };
  llama({ action:'typing', conversation_id:id, state:'paused' }).catch(() => {});
}

// «Escribiendo…»/«grabando audio…» DEL CLIENTE (lo contrario de ESCRIBIENDO, que es lo que el
// CRM manda hacia el). wa-bridge escribe customer_typing_state/customer_typing_at en la propia
// conversacion cuando le llega la presencia real de WhatsApp; aqui solo se decide si todavia es
// reciente y que texto poner, igual que la cabecera de un chat en WhatsApp Web.
const ESCRIBIENDO_CLIENTE_VENTANA_MS = 10000;
let TIMER_ESCRIBIENDO_CLIENTE = null;
function textoEscribiendoCliente(c){
  const estado = c?.customer_typing_state;
  if (estado !== 'composing' && estado !== 'recording') return '';
  const cuando = Date.parse(String(c?.customer_typing_at || ''));
  if (!Number.isFinite(cuando) || Date.now() - cuando > ESCRIBIENDO_CLIENTE_VENTANA_MS) return '';
  return estado === 'recording' ? 'grabando audio…' : 'escribiendo…';
}
// Solo un WhatsApp de verdad (whatsapp_qr) manda presencia; en los demas canales el campo nunca
// se llena y esto no hace nada.
function subtituloChat(c){
  const escribiendo = textoEscribiendoCliente(c);
  if (escribiendo) return '<span class="escribiendo-cliente">' + esc(escribiendo) + '</span>';
  return '<span>+' + esc(c.wa_phone || '') + ' · ' + esc(CANALES[canalDe(c)].corto) + insigniaAnuncio(c) + '</span>';
}

function abre(c){
  if (!c) return;
  // Si la pagina se abrio directamente en otra vista (Hoy, Funnel, Agenda…), Conversaciones aun no esta montada y sus nodos no existen.
  if (!$('sinChat')) monta('conversations');
  // Cortar la grabacion ANTES de cambiar de chat. El encoder termina en asincrono y su
  // callback empuja el audio a la cola global: si mientras tanto se abrio otra
  // conversacion, la nota de voz sale hacia el cliente equivocado. Lo mismo con la cola
  // de adjuntos y la cita: son de la conversacion que se esta dejando atras.
  abortaGrabacion();
  apagaEscribiendo();
  COLA.length = 0;
  citando = null;
  modoSeleccion = false;
  SEL_MSGS.clear();
  sel = c;
  // El aviso de "escribiendo del cliente" se apaga solo, por tiempo (ver textoEscribiendoCliente):
  // sin un repintado periodico se quedaria pegado si no vuelve a llegar presencia. Uno por chat
  // abierto; el de antes se apaga aqui, no al cerrar sesion, para no tocar ese bloque ajeno.
  if (TIMER_ESCRIBIENDO_CLIENTE) clearInterval(TIMER_ESCRIBIENDO_CLIENTE);
  TIMER_ESCRIBIENDO_CLIENTE = setInterval(() => { if (sel) pintaCabeceraChat(); }, 4000);
  document.body.classList.add('chat-abierto');

    // Agendar es lo que mas se hace desde un chat y estaba escondido dentro del menu de los

    +   '</button></div>'

  // La foto de la cabecera, si es del 2.o numero y aun no esta en cache.
  resuelveAvatares();
  cableaChat(c);
