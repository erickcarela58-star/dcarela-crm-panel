async function pintaTablaTpl(forzar){
  const cont = $('tablaTpl'); if (!cont) return;
  cont.innerHTML = '<p class="bajada"><span class="cargando"></span> Cargando…</p>';
  const lista = await cargaPlantillas(forzar);
  if (!lista) { cont.innerHTML = '<p class="bajada">No se pudieron cargar.</p>'; return; }
  if (!lista.length) {
    cont.innerHTML = '<p class="bajada">Todavía no hay plantillas. Pulsa «Sincronizar con Meta».</p>';
    return;
  }
  cont.innerHTML = '<div class="tabla"><div class="fila cabecera">'
    + '<span>Plantilla</span><span>Estado en Meta</span><span>Variables</span><span>Activa</span></div>'
    + lista.map((t,i) => {
      const estado = String(t.meta_status || '').toUpperCase() || 'DESCONOCIDO';
      const cls = estado === 'APPROVED' ? 'ok' : estado === 'REJECTED' ? 'mal' : 'medio';
      return '<div class="fila">'
        + '<span><b>' + esc(t.display_name || t.template_name) + '</b>'
        +   '<small>' + esc(t.template_name) + ' · ' + esc(t.language_code || 'es') + '</small></span>'
        + '<span><i class="chip ' + cls + '">' + esc(estado) + '</i></span>'
        + '<span>' + ((t.parameter_keys || []).join(', ') || '—') + '</span>'
        + '<span><button class="interruptor' + (t.active !== false ? ' on' : '') + '" data-tpl="' + i + '">'
        +   (t.active !== false ? 'sí' : 'no') + '</button></span>'
        + '</div>';
    }).join('') + '</div>';
  cont.onclick = async ev => {
    const b = ev.target.closest('[data-tpl]'); if (!b) return;
    const t = lista[Number(b.dataset.tpl)], siguiente = !(t.active !== false);
    b.disabled = true;
    const r = await llama({ action:'templates', operation:'update', id:t.id, active:siguiente });
    b.disabled = false;
    if (!r.ok) return avisa('No se pudo cambiar', r.error);
    t.active = siguiente;
    b.classList.toggle('on', siguiente);
    b.textContent = siguiente ? 'sí' : 'no';
  };
}

function pesos(centavos){
  const n = Number(centavos || 0);
  if (!n) return 'RD$0';
  return 'RD$' + (n / 100).toLocaleString('es-DO', { maximumFractionDigits: 0 });
}
function estrellas(n){
  const v = Number(n || 0);
  return v ? '★'.repeat(Math.min(5, v)) + '☆'.repeat(Math.max(0, 5 - v)) : '—';
}

// WhatsApp no deja publicar Estados por API, y los servicios que dicen automatizarlo
// usan metodos no oficiales que BANEAN el numero. Asi que esto no publica: prepara las
// fotos a 1080x1920 con la marca para subirlas a mano. Todo pasa en el navegador; las
// fotos no salen de esta maquina.
function montaEstados(){
  if (montadas.has('estados')) return;
  montadas.add('estados');
  hueco('estados', '<div class="hoja"><h1>Pack de Estados</h1>'
    + '<p class="bajada"><b>WhatsApp no permite publicar Estados por API.</b> Lo que prometa '
    +   'automatizarlo usa métodos no oficiales que banean el número. Aquí se preparan las fotos '
    +   'a formato Estado (1080×1920) con tu marca, y las subes tú a mano.</p>'
    + '<div class="acciones" style="margin-bottom:16px">'
    +   '<button class="btn-solido" id="estElegir">Elegir fotos</button>'
    +   '<input type="file" id="estFile" accept="image/*" multiple hidden></div>'
    + '<div class="estados" id="estLista"></div></div>');
  $('estElegir').onclick = () => $('estFile').click();
  $('estFile').onchange = async e => {
    const files = [...e.target.files]; e.target.value = '';
    const cont = $('estLista');
    for (const f of files) {
      const url = await aFormatoEstado(f);
      if (!url) continue;
      const d = document.createElement('div');
      d.className = 'estado';
      d.innerHTML = '<img src="' + url + '" alt="">'
        + '<a class="btn-linea" download="estado-' + Date.now() + '.jpg" href="' + url + '">Descargar</a>';
      cont.appendChild(d);
    }
    if (files.length) avisa(files.length + ' foto(s) listas', 'Descárgalas y súbelas desde el teléfono.');
  };
}
async function aFormatoEstado(file){
  try {
    const bitmap = await createImageBitmap(file);
    const L = document.createElement('canvas');
    L.width = 1080; L.height = 1920;
    const g = L.getContext('2d');
    // Fondo con la propia foto desenfocada: rellena las bandas sin dejar barras negras
    // ni deformar a nadie recortando la cara.
    const cubre = Math.max(1080 / bitmap.width, 1920 / bitmap.height);
    g.filter = 'blur(28px) brightness(.55)';
    g.drawImage(bitmap, (1080 - bitmap.width*cubre)/2, (1920 - bitmap.height*cubre)/2,
      bitmap.width*cubre, bitmap.height*cubre);
    g.filter = 'none';
    const cabe = Math.min(1080 / bitmap.width, 1780 / bitmap.height);
    g.drawImage(bitmap, (1080 - bitmap.width*cabe)/2, (1920 - bitmap.height*cabe)/2,
      bitmap.width*cabe, bitmap.height*cabe);
    g.fillStyle = 'rgba(255,255,255,.92)';
    g.font = '600 34px -apple-system,Segoe UI,Roboto,sans-serif';
    g.textAlign = 'center';
    g.fillText(CFG.brandName || "D'Carela Compufoto", 540, 1868);
    return await new Promise(res => L.toBlob(b => res(URL.createObjectURL(b)), 'image/jpeg', 0.92));
  } catch (e) { avisa('No se pudo procesar una foto', e?.message || String(e)); return null; }
}

  $('cfgNegocio').innerHTML = '<div style="max-width:520px">'
    + dato('Marca', CFG.brandName) + dato('Número de WhatsApp', CFG.businessDisplayNumber || CFG.businessNumber)
    + dato('Catálogo público', CFG.publicCatalogUrl) + dato('Vista al entrar', CFG.defaultView || 'conversations')
    + '</div>';

  const u = auth.currentUser;
  $('cfgYo').innerHTML = '<div style="max-width:520px">' + dato('Correo', u?.email || '—') + '</div>';
  // whoami devuelve rol_efectivo / activo / pasaria_requireMember, no role/member: los
  // nombres que puse antes daban siempre "—" y "autorizado" aunque no lo estuvieras.
  const quien = await llama({ action:'whoami' });
  if (quien.ok) {
    $('cfgYo').innerHTML = '<div style="max-width:520px">'
      + dato('Correo', quien.email || u?.email || '—')
      + dato('Rol', quien.rol_efectivo || '—')
      + dato('Acceso', quien.pasaria_requireMember ? 'autorizado'
          : !quien.ficha_existe ? 'sin ficha de miembro'
          : !quien.activo ? 'ficha desactivada'
          : !quien.pertenece_al_negocio ? 'no pertenece a este negocio'
          : 'rol sin permisos')
      + '</div>';
  }

  const eq = $('cfgEquipo');
  eq.innerHTML = '<p class="bajada"><span class="cargando"></span> Cargando…</p>';
  const r = await llama({ action:'panelUsers', operation:'list' });
  if (!r.ok) {
    // Un agente no puede listar el equipo: eso no es un fallo, es el permiso haciendo
    // su trabajo. Se dice asi en vez de enseñar un error rojo.
    eq.innerHTML = '<p class="bajada">' + (String(r.error||'').includes('permiso')
      ? 'Tu rol no puede ver ni cambiar el equipo. Eso lo lleva un administrador.'
      : 'No se pudo cargar: ' + esc(r.error || '')) + '</p>';
    return;
  }
  const filas = r.users || r.data || [];
  eq.innerHTML = filas.length
    ? '<div class="tabla" style="max-width:720px">'
      + '<div class="fila cabecera" style="grid-template-columns:minmax(0,2fr) 1fr 1fr"><span>Persona</span><span>Rol</span><span>Estado</span></div>'
      + filas.map(x => '<div class="fila" style="grid-template-columns:minmax(0,2fr) 1fr 1fr">'
        + '<span><b>' + esc(x.display_name || x.email || '—') + '</b><small>' + esc(x.email || '') + '</small></span>'
        + '<span>' + esc(x.role || '—') + '</span>'
        + '<span><i class="chip ' + (x.active === false ? 'mal' : 'ok') + '">'
        +   (x.active === false ? 'inactivo' : 'activo') + '</i></span></div>').join('')
      + '</div>'
    : '<p class="bajada">No hay nadie más en el equipo.</p>';
}

/* ---- Funnel / Kanban ----------------------------------------------------- */
// Arrastrar una tarjeta cambia la etapa del lead de verdad. Por eso la tarjeta vuelve
// a su sitio si el servidor rechaza el cambio: dejarla en la columna nueva la haria
// mentir hasta el siguiente refresco, y quien la movio se iria creyendo que se guardo.
function montaFunnel(){
  if (!montadas.has('funnel')) {
    montadas.add('funnel');
    hueco('funnel', '<div class="hoja"><h1>Funnel</h1>'
      + '<p class="bajada">Arrastra un contacto a otra columna para cambiarle la etapa.</p>'
      + '<div class="kanban" id="kanban"></div></div>');
  }
  pintaKanban();
}

function pintaKanban(){
  const cont = $('kanban'); if (!cont) return;
  cont.innerHTML = ETAPAS.map(e => {
    const filas = CONVS.filter(c => (c.lifecycle_stage || 'nuevo') === e);
    return '<div class="columna" data-etapa="' + e + '">'
      + '<div class="ctitulo">' + esc(e.replace(/_/g,' ')) + '<b>' + filas.length + '</b></div>'
      + '<div class="ccuerpo">'
      + filas.slice(0, 60).map(c => '<div class="ktarjeta" draggable="true" data-conv="' + esc(c._id) + '">'
          + '<b>' + esc(nombreDe(c)) + '</b>'
          + '<span>' + esc(c.last_message_preview || '') + '</span>'
          + '<i>' + esc(hora(c.last_message_at)) + (c.interested_category ? ' · ' + esc(c.interested_category) : '') + '</i>'
        + '</div>').join('')
      + (filas.length > 60 ? '<div class="kmas">… y ' + (filas.length - 60) + ' más</div>' : '')
      + '</div></div>';
  }).join('');

  let arrastrando = null;
  cont.querySelectorAll('.ktarjeta').forEach(t => {
    t.addEventListener('dragstart', ev => {
      arrastrando = t;
      t.classList.add('moviendo');
      // Firefox no inicia el arrastre sin datos en el portapapeles del evento.
      ev.dataTransfer.setData('text/plain', t.dataset.conv);
      ev.dataTransfer.effectAllowed = 'move';
    });
    t.addEventListener('dragend', () => { t.classList.remove('moviendo'); arrastrando = null;
      cont.querySelectorAll('.columna').forEach(c => c.classList.remove('encima')); });
  });
  cont.querySelectorAll('.columna').forEach(col => {
    col.addEventListener('dragover', ev => { ev.preventDefault(); col.classList.add('encima'); });
    col.addEventListener('dragleave', () => col.classList.remove('encima'));
    col.addEventListener('drop', async ev => {
      ev.preventDefault();
      col.classList.remove('encima');
      const id = ev.dataTransfer.getData('text/plain') || arrastrando?.dataset.conv;
      const c = CONVS.find(x => x._id === id);
      const etapa = col.dataset.etapa;
      if (!c || (c.lifecycle_stage || 'nuevo') === etapa) return;
      const anterior = c.lifecycle_stage;
      c.lifecycle_stage = etapa;      // se mueve ya, para que se sienta inmediato
      pintaKanban();
      const r = await llama({ action:'updateLead', conversation_id: c.id || c._id,
        fields:{ lifecycle_stage: etapa } });
      if (!r.ok) {
        c.lifecycle_stage = anterior; // y vuelve si el servidor dijo que no
        pintaKanban();
        return avisa('No se pudo mover', r.error);
      }
      avisa(nombreDe(c), 'ahora está en ' + etapa.replace(/_/g,' '));
      pintaChats();
    });
  });
}

      + '<span class="bn">' + n + '</span></div>';
  }).join('') + '</div>';

/* ---- Broadcast ----------------------------------------------------------- */
// Enviar a mucha gente a la vez es lo mas facil de arruinar de todo el CRM. Por eso
// aqui no hay boton de "enviar" directo: primero se simula (dry) y se ve la lista de
// personas por nombre y telefono, y solo despues se confirma sobre ESOS ids. El
// servidor tambien exige que una plantilla de difusion incluya salida de baja: sin
// eso Meta degrada la calidad del numero, y esa penalizacion tarda semanas en irse.
let AUDIENCIA = null;

function montaBroadcast(){
  if (montadas.has('marketing')) return;
  montadas.add('marketing');
  hueco('marketing',
    '<div class="hoja"><h1>Broadcast</h1>'
    + '<p class="bajada">Escribe una vez y sale a muchos. Primero se simula: verás exactamente '
    +   'a quién le llegaría antes de que salga nada.</p>'
    + '<div class="prompt">'
    +   '<div class="par">'
    +     '<div class="campo"><label>Tipo de envío</label><select id="bcModo">'
    +       '<option value="freeform">Mensaje libre (solo a quien escribió en las últimas 24 h)</option>'
    +       '<option value="template">Plantilla aprobada (llega aunque lleve días callado)</option>'
    +     '</select></div>'
    +     '<div class="campo"><label>Propósito</label><select id="bcProposito">'
    +       '<option value="marketing">Marketing</option>'
    +       '<option value="followup">Seguimiento</option>'
    +       '<option value="session_reminder">Recordatorio de sesión</option>'
    +     '</select></div>'
    +   '</div>'
    +   '<div id="bcLibre">'
    +     '<div class="campo"><label>Mensaje</label>'
    +       '<textarea id="bcTexto" rows="4" placeholder="Lo que le llegará a cada contacto"></textarea></div>'
    +   '</div>'
    +   '<div id="bcPlantilla" hidden><div class="campo"><label>Plantilla</label>'
    +     '<select id="bcTpl"></select></div>'
    +     '<p class="aviso" id="bcTplAviso"></p></div>'
    +   '<div class="par">'
    +     '<div class="campo"><label>Etapa (opcional)</label><select id="bcEtapa">'
    +       '<option value="">Todas</option>' + ETAPAS.map(e => '<option value="' + e + '">' + e.replace(/_/g,' ') + '</option>').join('')
    +     '</select></div>'
    +     '<div class="campo"><label>Categoría (opcional)</label>'
    +       '<input id="bcCategoria" placeholder="xv, boda, infantil…"></div>'
    +   '</div>'
    +   '<div class="acciones"><button class="btn-solido" id="bcSimular">Simular envío</button></div>'
    + '</div><div id="bcSalida"></div></div>');

  $('bcModo').onchange = async () => {
    const plantilla = $('bcModo').value === 'template';
    $('bcLibre').hidden = plantilla;
    $('bcPlantilla').hidden = !plantilla;
    AUDIENCIA = null; $('bcSalida').innerHTML = '';
    if (plantilla) await llenaPlantillasBc();
  };
  $('bcSimular').onclick = simulaBroadcast;
}

async function llenaPlantillasBc(){
  const sel2 = $('bcTpl');
  sel2.innerHTML = '<option>Cargando…</option>';
  const lista = await cargaPlantillas(false) || [];
  // Solo las que Meta aprobo Y que llevan salida de baja: el servidor rechaza el resto,
  // y es mejor no ofrecerlas que dejar que el operador elija una que sera rechazada.
  const validas = lista.filter(t => String(t.meta_status||'').toUpperCase() === 'APPROVED'
    && t.contains_opt_out === true && t.active !== false);
  if (!validas.length) {
    sel2.innerHTML = '<option value="">— ninguna disponible —</option>';
    $('bcTplAviso').textContent = 'No hay ninguna plantilla aprobada que incluya opción de baja (STOP). '
      + 'Meta degrada la calidad del número si se difunde sin ella, así que el servidor lo rechaza. '
      + 'Añade la línea de baja a la plantilla en Meta y vuelve a sincronizar.';
    return;
  }
  sel2.innerHTML = validas.map((t,i) =>
    '<option value="' + i + '">' + esc(t.display_name || t.template_name) + '</option>').join('');
  sel2._validas = validas;
  $('bcTplAviso').textContent = validas.length + ' plantilla(s) aptas para difusión.';
}

function filtroBc(){
  const f = {};
  if ($('bcEtapa').value) f.lifecycle_stage = $('bcEtapa').value;
  if ($('bcCategoria').value.trim()) f.interested_category = $('bcCategoria').value.trim();
  return f;
}
function cuerpoBc(dry){
  const modo = $('bcModo').value;
  const c = { action:'broadcast', send_mode:modo, purpose:$('bcProposito').value,
    filter:filtroBc(), dry };
  if (modo === 'freeform') c.text = $('bcTexto').value.trim();
  else {
    const v = $('bcTpl')._validas || [];
    const t = v[Number($('bcTpl').value)];
    if (!t) return null;
    c.template = { name:t.template_name, language_code:t.language_code || 'es',
      contains_opt_out:true, parameter_keys:t.parameter_keys || [] };
  }
  return c;
}

async function simulaBroadcast(){
  const cuerpo = cuerpoBc(true);
  if (!cuerpo) return avisa('Elige una plantilla');
  if (cuerpo.send_mode === 'freeform' && !cuerpo.text) return avisa('Escribe el mensaje');
  $('bcSimular').disabled = true;
  $('bcSalida').innerHTML = '<p class="bajada"><span class="cargando"></span> Calculando audiencia…</p>';
  const r = await llama(cuerpo);
  $('bcSimular').disabled = false;
  if (!r.ok) { $('bcSalida').innerHTML = ''; return avisa('No se pudo simular', r.error); }
  AUDIENCIA = r;
  const destinos = r.targets || r.sample || [];
  $('bcSalida').innerHTML = '<div class="propuesta">'
    + '<div class="tapa"><b>' + Number(r.found || 0) + ' contactos recibirían este mensaje</b></div>'
    + '<div class="cuerpo">'
    +   '<div class="cambio"><div class="k">Revisados</div>' + Number(r.scanned || 0) + '</div>'
    +   '<div class="cambio"><div class="k">Excluidos por baja o permiso</div>' + Number(r.skippedOptOut || 0) + '</div>'
    +   (destinos.length
        ? '<div class="cambio"><div class="k">A quién le llega</div><div class="destinos">'
          + destinos.slice(0,60).map(t => '<span>' + esc(t.name || t.phone) + ' · +' + esc(t.phone) + '</span>').join('')
          + (destinos.length > 60 ? '<span>… y ' + (destinos.length - 60) + ' más</span>' : '')
          + '</div></div>'
        : '<p class="aviso" style="margin:0">Nadie cumple estos filtros. Con «mensaje libre» solo entran '
          + 'quienes escribieron en las últimas 24 horas.</p>')
    + '</div>'
    + (Number(r.found || 0) > 0
      ? '<div class="patas"><button class="btn-solido" id="bcEnviar">Enviar a ' + Number(r.found) + '</button>'
        + '<button class="btn-linea" id="bcCancelar">Cancelar</button></div>'
      : '')
    + '</div>';
  if (Number(r.found || 0) > 0) {
    $('bcCancelar').onclick = () => { AUDIENCIA = null; $('bcSalida').innerHTML = ''; };
    $('bcEnviar').onclick = enviaBroadcast;
  }
}

async function enviaBroadcast(){
  if (!AUDIENCIA) return;
  const cuantos = Number(AUDIENCIA.found || 0);
  if (!confirm('Se enviará a ' + cuantos + ' contactos reales. Esto no se puede deshacer.\n\n¿Confirmas?')) return;
  const cuerpo = cuerpoBc(false);
  // Se envia sobre los ids QUE SE ENSEÑARON, no sobre una audiencia recalculada: entre
  // la simulacion y la confirmacion puede haber entrado gente nueva que nadie reviso.
  if (Array.isArray(AUDIENCIA.ids) && AUDIENCIA.ids.length) cuerpo.only_ids = AUDIENCIA.ids;
  $('bcEnviar').disabled = true;
  $('bcEnviar').textContent = 'Enviando…';
  const r = await llama(cuerpo);
  if (!r.ok) { $('bcEnviar').disabled = false; $('bcEnviar').textContent = 'Enviar a ' + cuantos;
    return avisa('No se pudo enviar', r.error); }
  AUDIENCIA = null;
  $('bcSalida').innerHTML = '<div class="propuesta"><div class="tapa"><b>Envío terminado</b></div>'
    + '<div class="cuerpo">'
    +   '<div class="cambio"><div class="k">Enviados</div>' + Number(r.sent || 0) + '</div>'
    +   '<div class="cambio"><div class="k">Fallidos</div>' + Number(r.failed || 0) + '</div>'
    +   ((r.errors || []).length
        ? '<div class="cambio"><div class="k">Motivos</div>'
          + (r.errors || []).slice(0,10).map(e => esc(e.error)).join('<br>') + '</div>' : '')
    + '</div></div>';
  avisa('Broadcast enviado', Number(r.sent || 0) + ' de ' + cuantos);
}

/* ---- Planificación: un solo prompt --------------------------------------- */
// Aqui vive TODO lo operativo. El modelo propone, el servidor sanea la propuesta y
// una persona aprueba antes de que nada toque una ficha o salga un mensaje.
const EJEMPLOS = [
  'Resume esta conversación y dime el próximo paso',
  'Prepara la reserva de este contacto',
  'Marca este contacto como pagado y pide el comprobante',
  'Escríbele la ubicación del estudio',
  'Pásale el portafolio de bodas',
  'Márcalo como desinteresado y apaga el marketing',
];
let propuesta = null;
const PLAN_IMGS = [];
let REGLAS = '';

function pintaPlanCola(){
  const c = $('planCola'); if (!c) return;
  c.hidden = !PLAN_IMGS.length;
  c.innerHTML = PLAN_IMGS.map((a,i) => '<span class="pieza">'
    + '<img src="data:' + esc(a.mime) + ';base64,' + a.datos + '" alt="">'
    + '<span class="pnom">' + esc(a.nombre) + '</span>'
    + '<button data-quita="' + i + '" aria-label="Quitar">×</button></span>').join('');
}

// Las reglas viven en el servidor, no en el navegador: son del negocio, no de quien
// esta sentado delante. Si viven en localStorage, cada persona tiene las suyas y el
// asistente contesta distinto segun quien pregunte.
async function cargaReglas(){
  const r = await llama({ action:'data', table:'settings', operation:'select',
    filters:[{ kind:'eq', field:'key', value:'reglas_asistente' }], limit:1 });
  if (!r.ok) return;
  const fila = (r.data || r.rows || [])[0];
  REGLAS = fila?.value || '';
  const caja = $('reglas'); if (caja) caja.value = REGLAS;
  const nota = $('reglasNota');
  if (nota) nota.textContent = REGLAS ? 'Guardadas. Se usan en cada propuesta.' : 'Todavía no hay reglas.';
}
async function guardaReglas(){
  const valor = $('reglas').value.trim();
  $('btnReglas').disabled = true;
  const r = await llama({ action:'data', table:'settings', operation:'upsert',
    payload:{ id:'reglas_asistente', key:'reglas_asistente', value:valor,
      updated_at:new Date().toISOString() }, on_conflict:'id' });
  $('btnReglas').disabled = false;
  if (!r.ok) return avisa('No se pudieron guardar', r.error);
  REGLAS = valor;
  $('reglasNota').textContent = 'Guardadas. Se usan en cada propuesta.';
  avisa('Reglas guardadas', 'El asistente las tendrá en cuenta desde ahora.');
}
function montaPlanificacion(){
  if (montadas.has('planning')) { const c = $('contexto'); if (c) c.textContent = contextoTexto(); return; }
  montadas.add('planning');
  hueco('planning',
    '<div class="hoja"><h1>Planificación</h1>'
    + '<p class="bajada">Escribe lo que necesitas. Se lee la conversación seleccionada, se propone '
    +   'qué hacer, y no se toca nada hasta que lo apruebes.</p>'
    + '<div class="prompt">'
    +   '<textarea id="pedido" placeholder="Ej. prepara la reserva de este contacto y pídele el abono"></textarea>'
    +   '<div class="adjuntos" id="planAdj" style="padding:8px 0 0">'
    +     '<button class="adj" id="planImg" title="Adjuntar imagen">'
    +       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button>'
    +     '<input type="file" id="planFile" accept="image/*" multiple hidden>'
    +     '<span class="quien" id="planAdjNota"></span>'
    +   '</div>'
    +   '<div class="cola" id="planCola" hidden></div>'
    +   '<div class="acciones"><button class="btn-solido" id="btnPedir">Proponer</button>'
    +     '<span class="quien" id="contexto"></span></div>'
    +   '<div class="ejemplos" id="ejemplos">'
    +     EJEMPLOS.map(e => '<button class="ejemplo">' + esc(e) + '</button>').join('')
    +   '</div>'
    + '</div><div id="salida"></div>'
    + '<div class="seccion" style="margin:30px 0 8px">Reglas y contexto del negocio</div>'
    + '<p class="bajada">Lo que escribas aquí se le da al asistente en cada propuesta. '
    +   'Sirve para lo que no está en ninguna ficha: cómo se cobra, qué no se promete, '
    +   'qué fechas están cerradas, cómo se habla.</p>'
    + '<div class="prompt"><textarea id="reglas" rows="8" placeholder="Ej.\n'
    +   '- El abono mínimo es de RD$3,000 y no se devuelve.\n'
    +   '- No trabajamos domingos.\n'
    +   '- Nunca prometer una fecha sin confirmarla con el estudio.\n'
    +   '- Tratar de usted a personas mayores."></textarea>'
    +   '<div class="acciones"><button class="btn-solido" id="btnReglas">Guardar reglas</button>'
    +     '<span class="quien" id="reglasNota"></span></div></div></div>');
  $('ejemplos').addEventListener('click', ev => {
    const b = ev.target.closest('.ejemplo'); if (!b) return;
    $('pedido').value = b.textContent; $('pedido').focus();
  });
  $('btnPedir').onclick = pide;
  // Sin esto el hueco #contexto quedaba vacio y no se sabia sobre QUIEN se estaba
  // pidiendo el plan. Aplicar una propuesta al contacto equivocado no tiene deshacer.
  $('contexto').textContent = contextoTexto();

  // Imagenes para el asistente: un comprobante de pago, la foto de un vestido, una
  // captura de otra cotizacion. Son cosas que el cliente manda y sobre las que hay que
  // decidir, y sin poder enseñarselas el asistente decide a ciegas.
  $('planImg').onclick = () => $('planFile').click();
  $('planFile').onchange = async e => {
    const files = [...e.target.files]; e.target.value = '';
    for (const f of files) {
      if (!f.type?.startsWith('image/')) continue;
      // Se manda comprimida: al asistente no le hace falta la resolucion completa y
      // subir 30 MB en cada pregunta seria lento y caro.
      const blob = await comprimeNormal(f);
      PLAN_IMGS.push({ nombre:f.name, mime: blob.type || 'image/jpeg', datos: await leeBase64(blob) });
    }
    pintaPlanCola();
  };
  $('planCola').onclick = ev => {
    const b = ev.target.closest('[data-quita]'); if (!b) return;
    PLAN_IMGS.splice(Number(b.dataset.quita), 1); pintaPlanCola();
  };

  cargaReglas();
  $('btnReglas').onclick = guardaReglas;
}
function contextoTexto(){
  return sel ? 'Sobre: ' + nombreDe(sel) + ' (+' + (sel.wa_phone||'') + ')'
             : 'Sin conversación seleccionada — se propondrá sobre el negocio en general.';
}
async function pide(){
  const t = $('pedido').value.trim();
  if (!t) return avisa('Escribe qué necesitas');
  $('btnPedir').disabled = true;
  $('salida').innerHTML = '<p class="bajada" style="margin-top:22px"><span class="cargando"></span> Pensando…</p>';
  const cuerpo = { action:'assistantPlan', instruction:t };
  const contexto = [];

  // Las reglas del negocio van SIEMPRE, aunque no haya conversacion abierta: son lo
  // que evita que proponga cosas que el estudio no puede cumplir.
  if (REGLAS) contexto.push('Reglas del negocio, de obligado cumplimiento:\n' + REGLAS);

  // Las normas que ya estan cableadas en el servidor se le dicen tambien. Si no las
  // conoce propone difundir a gente dada de baja, y el servidor lo rechaza despues:
  // mejor que no lo proponga que tener que explicar por que se rechazo.
  contexto.push([
    'Reglas del sistema que NO se pueden saltar:',
    '- Fuera de la ventana de 24 h desde el ultimo mensaje del cliente solo llega una plantilla aprobada.',
    '- Un contacto en etapa desinteresado, o con exclusion permanente, no recibe marketing ni seguimientos.',
    '- Dos seguimientos sin respuesta y el contacto pasa a desinteresado automaticamente.',
    '- Una difusion con plantilla exige que la plantilla incluya salida de baja (STOP).',
    '- Nada se ejecuta sin que una persona lo apruebe.',
  ].join('\n'));

  if (sel) {
    contexto.push('Ficha de este contacto:\n' + [
      ['Nombre', nombreDe(sel)], ['Telefono', sel.wa_phone], ['Etapa', sel.lifecycle_stage],
      ['Estado', sel.lead_status], ['Reserva', sel.reservation_status],
      ['Categoria', sel.interested_category], ['Combo', sel.selected_combo_name],
      ['Fecha tentativa', sel.tentative_date],
      ['Seguimientos sin respuesta', sel.followup_attempts],
      ['Marketing permitido', sel.marketing_opt_in === false ? 'NO' : 'si'],
      ['Excluido permanentemente', sel.proactive_blocked_at ? 'SI' : 'no'],
    ].filter(([,v]) => v !== undefined && v !== null && String(v).trim() !== '')
      .map(([k,v]) => '- ' + k + ': ' + v).join('\n'));
    contexto.push('Ultimos mensajes:\n' + MSGS.slice(-40)
      .map(m => (m.direction === 'out' ? 'Nosotros: ' : 'Cliente: ') + (m.body || '')).join('\n'));
    cuerpo.conversation_id = sel.id || sel._id;
  } else {
    contexto.push('No hay ninguna conversacion abierta: la peticion es sobre el negocio en general.');
  }

  cuerpo.contact_context = contexto.join('\n\n');
  // assistantAttachmentParts lee item.mime (assistant-plan.js:224), no mime_type, y se
  // queda con las tres primeras. Se avisa si se mandan mas, en vez de tirarlas calladas.
  if (PLAN_IMGS.length) {
    cuerpo.attachment_payloads = PLAN_IMGS.slice(0, 3).map(a => ({ mime:a.mime, data:a.datos }));
    if (PLAN_IMGS.length > 3) avisa('Solo van las 3 primeras imágenes', 'Es el máximo que acepta el asistente.');
  }
  const r = await llama(cuerpo);
  $('btnPedir').disabled = false;
  if (!r.ok) { $('salida').innerHTML = ''; return avisa('No se pudo proponer', r.error); }
  propuesta = r.plan || null;
  pintaPropuesta();
}
// Cada herramienta se explica en cristiano ANTES de aprobarla. "create_reservation"
// no le dice nada a nadie; "pasa el lead a pendiente de reserva" sí.
const NOMBRE_HERRAMIENTA = {
  contact_report: 'Leer la conversación y resumirla',
  create_reservation: 'Pasar el lead a pendiente de reserva',
  mark_paid: 'Marcar como pagado y pedir validación humana del comprobante',
  draft_message: 'Preparar un mensaje en el compositor (no lo envía)',
  communication_policy: 'Cambiar la política de comunicación',
  mark_disinterest: 'Marcar desinteresado y apagar el marketing',
  update_lead: 'Cambiar datos de la ficha',
};
const NOMBRE_BORRADOR = {
  receipt: 'pedir el comprobante del abono',
  location: 'enviar la ubicación del estudio',
  portfolio: 'enviar el portafolio',
  privateCombos: 'enviar los combos',
};

function pintaPropuesta(){
  const p = propuesta;
  if (!p) { $('salida').innerHTML = ''; return; }
  const filas = [];
  if (p.objective) filas.push(['Objetivo', p.objective]);
  if (p.rationale) filas.push(['Por qué', p.rationale]);
  if (p.message_text) filas.push(['Mensaje que se prepararía', p.message_text]);
  (p.steps || []).forEach((s,i) => filas.push(['Paso ' + (i+1), s]));
  (p.risks || []).forEach(s => filas.push(['Riesgo', s]));

  const tools = Array.isArray(p.tools) ? p.tools : [];
  const bloqueTools = tools.length
    ? '<div class="seccion" style="margin:14px 0 8px">Se haría esto</div>'
      + tools.map((t,i) => '<div class="cambio"><div class="k">'
        + esc(NOMBRE_HERRAMIENTA[t.name] || t.name) + '</div>'
        + esc(t.preview || '')
        // Los campos exactos que se van a escribir, sin traducir: quien aprueba tiene
        // derecho a ver el cambio literal, no solo el resumen bonito.
        + (t.params?.fields ? '<div class="campos">' + Object.entries(t.params.fields)
            .map(([k,v]) => '<span>' + esc(k) + ' → ' + esc(String(v)) + '</span>').join('') + '</div>' : '')
        + (t.params?.template ? '<div class="campos"><span>' + esc(NOMBRE_BORRADOR[t.params.template] || t.params.template) + '</span></div>' : '')
        + (t.params?.operation ? '<div class="campos"><span>' + esc(t.params.operation) + '</span></div>' : '')
        + '</div>').join('')
    : '';

  const hayQueAplicar = tools.length > 0 || (p.action && p.action !== 'info_only');
  $('salida').innerHTML = '<div class="propuesta">'
    + '<div class="tapa"><b>Propuesta</b>' + (tools.length ? ' · ' + tools.length + ' acción(es)' : ' · solo información') + '</div>'
    + '<div class="cuerpo">'
    +   filas.map(([k,v]) => '<div class="cambio"><div class="k">' + esc(k) + '</div>' + esc(v) + '</div>').join('')
    +   bloqueTools
    +   (filas.length || tools.length ? '' : '<p class="aviso" style="margin:0">Sin detalle devuelto.</p>')
    + '</div>'
    + '<div class="patas">'
    +   (hayQueAplicar ? '<button class="btn-solido" id="btnAprobar">Aprobar y aplicar</button>' : '')
    +   '<button class="btn-linea" id="btnDescartar">Descartar</button>'
    + '</div></div>';
  $('btnDescartar').onclick = () => { propuesta = null; $('salida').innerHTML = ''; };
  if (hayQueAplicar) $('btnAprobar').onclick = aplica;
}

async function aplica(){
  const p = propuesta; if (!p) return;
  const tools = Array.isArray(p.tools) ? p.tools : [];
  const b = $('btnAprobar');
  b.disabled = true; b.textContent = 'Aplicando…';
  const hechas = [], fallos = [];

  for (const t of tools) {
    const conv = t.conversation_id || sel?.id || sel?._id;
    let r = { ok:false, error:'herramienta desconocida' };

    if (t.name === 'mark_disinterest') {
      // Marcar desinteresado NO es escribir tres campos: la accion 'disinterest' del
      // servidor ademas apaga los seguimientos programados y deja el motivo en la
      // auditoria. Hacerlo con updateLead dejaria al contacto marcado por fuera y
      // recibiendo seguimientos por dentro.
      r = await llama({ action:'disinterest', operation:'mark', conversation_id: conv,
        reason: t.preview || 'marcado desde el Planificador' });
    } else if (['create_reservation','mark_paid','update_lead'].includes(t.name)) {
      r = await llama({ action:'updateLead', conversation_id: conv, fields: t.params?.fields || {} });
    } else if (t.name === 'contact_report') {
      r = { ok:true };  // el informe ya es el texto que se esta leyendo
    } else if (t.name === 'draft_message') {
      // Un borrador NO se envia: se deja escrito para que una persona lo lea, lo
      // corrija si hace falta, y pulse enviar. Esa es toda la diferencia entre una
      // ayuda y un bot suelto escribiendo a clientes.
      const texto = t.params?.message_text || textoDeBorrador(t.params?.template);
      if (sel && $('texto')) {
        const caja = $('texto');
        caja.value = caja.value.trim() ? caja.value.trim() + '\n\n' + texto : texto;
        r = { ok:true };
      } else r = { ok:false, error:'abre la conversación para dejar el borrador' };
    } else if (t.name === 'communication_policy') {
      // El servidor exige escribir la frase exacta. Aqui se pide igual: apagarle las
      // comunicaciones a un contacto no puede ser un clic de mas.
      const op = t.params.operation;
      const frase = op === 'block' ? 'DESACTIVAR CONTACTO' : 'REACTIVAR';
      const escrito = window.prompt(
        (op === 'block'
          ? 'Se apagarán bot, promociones y seguimientos para este contacto.'
          : 'Se reactivará la automatización. No concede permiso de marketing.')
        + '\n\nEscribe ' + frase + ' para confirmar:') || '';
      if (escrito !== frase) { fallos.push([t.name, 'cancelado']); continue; }
      r = await llama({ action:'communicationPolicy', operation:op, conversation_id:conv,
        confirmation:escrito, reason:t.params.reason || 'Solicitado desde el Planificador' });
    }

    if (r.ok) hechas.push(NOMBRE_HERRAMIENTA[t.name] || t.name);
    else fallos.push([NOMBRE_HERRAMIENTA[t.name] || t.name, r.error || 'error']);
  }

  b.disabled = false; b.textContent = 'Aprobar y aplicar';
  if (hechas.length && !fallos.length) {
    propuesta = null;
    $('salida').innerHTML = '<div class="propuesta"><div class="tapa"><b>Aplicado</b></div>'
      + '<div class="cuerpo">' + hechas.map(h => '<div class="cambio">' + esc(h) + '</div>').join('') + '</div></div>';
    avisa('Aplicado', hechas.length + ' acción(es)');
  } else {
    avisa(hechas.length ? 'Aplicado a medias' : 'No se pudo aplicar',
      fallos.map(([n,e]) => n + ': ' + e).join(' · ').slice(0,180));
  }
  if (sel) { const f = CONVS.find(c => c._id === sel._id); if (f) pintaFicha(f); }
}

function textoDeBorrador(clave){
  if (clave === 'receipt') return 'Para confirmar tu reserva, envíanos por aquí el comprobante del abono '
    + 'y el nombre de la persona que hizo el pago.';
  if (clave === 'location') return [CFG.addressText || 'Te comparto nuestra ubicación.', CFG.mapsUrl || ''].filter(Boolean).join(' ');
  if (clave === 'portfolio') return 'Puedes ver nuestros combos, imágenes y todo lo que incluye cada opción aquí: '
    + (CFG.publicPortfolioUrl || CFG.publicCatalogUrl || '');
  if (clave === 'privateCombos') return CFG.privateCombosMessage
    || 'Te comparto los combos por aquí. Antes de confirmar disponibilidad necesito categoría, fecha tentativa y nombre.';
  return '';
}

/* ---- Sesión -------------------------------------------------------------- */
$('formAcceso').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = $('errorAcceso'); err.classList.remove('on');
  $('btnEntrar').disabled = true;
  try { await signInWithEmailAndPassword(auth, $('correo').value.trim(), $('clave').value); }
  catch (e) {
    err.textContent = e?.code === 'auth/invalid-credential'
      ? 'Correo o contraseña incorrectos.' : (e?.message || 'No se pudo entrar.');
    err.classList.add('on');
  }
  finally { $('btnEntrar').disabled = false; }
});
$('btnSalir').onclick = () => signOut(auth);

onAuthStateChanged(auth, async u => {
  if (!u) {
    $('acceso').classList.remove('oculto');
    $('app').classList.remove('on');
    if (paraMsgs) { paraMsgs(); paraMsgs = null; }
    return;
  }
  $('acceso').classList.add('oculto');
  $('app').classList.add('on');
  $('quien').textContent = u.email || '';
  // El historial se carga solo al entrar. No hay boton de "actualizar": la escucha
  // en vivo trae los cambios sin que nadie tenga que pedirlos.
  escuchaConversaciones();
  ve(location.hash.slice(1) || CFG.defaultView || 'conversations');
});
</script>
