    +       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>'
    +     '<div class="atitulo"><b id="aTitulo" title="Cambiar el nombre">Asistente</b><div class="actx" id="contexto"></div></div>'
    +     '<div class="aacc"><button class="btn-linea" id="aAbrirChat" hidden>Abrir chat</button>'
    +       '<button class="btn-linea" id="btnReglasAbrir">Reglas del negocio</button></div>'
    +   '</div>'
    +   '<div class="ahilo" id="ahilo" aria-live="polite"></div>'
    +   '<div class="afoco" id="planFoco" hidden></div>'
    +   '<div class="acola" id="planCola" hidden></div>'
    +   '<div class="aentrada">'
    +     '<div class="amas">'
    +       '<button class="adj" id="planMas" title="Herramientas (o escribe /)" aria-label="Herramientas" aria-expanded="false">'
    +         '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>'
    +       '<div class="amenu" id="planMenu"></div>'
    +     '</div>'
    +     '<input type="file" id="planFile" accept="image/*,application/pdf" multiple hidden>'
    +     '<textarea id="pedido" rows="1" placeholder="Escribe al asistente…"></textarea>'
    +     '<button class="enviar" id="btnPedir" aria-label="Enviar">'
    +       '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>'
    +     '</button>'
    +   '</div>'
    + '</section></div>');

  const caja = $('pedido');
  caja.addEventListener('input', () => {
    altoCaja(caja);
    guardaBorradorActual();
  });
  caja.addEventListener('keydown', e => {
    // "/" con la caja vacia abre el mismo menu que el +.
    if (e.key === '/' && !caja.value && !e.isComposing) { e.preventDefault(); abreMenuAsistente(true); return; }
    teclaPedido(e, pide);
  });
  $('btnPedir').onclick = pide;

  // Los menus se cierran al pulsar fuera. Sin esto se quedan abiertos tapando el hilo, que es
  // justo lo que hay que leer para decidir.
  $('planMas').onclick = ev => { ev.stopPropagation(); abreMenuAsistente(!$('planMenu').classList.contains('on')); };
  $('aNuevo').onclick = ev => {
    ev.stopPropagation();
    const abierto = $('aNuevoMenu').classList.toggle('on');
    $('aNuevo').setAttribute('aria-expanded', abierto ? 'true' : 'false');
  };
  document.addEventListener('click', ev => {
    if (!ev.target.closest('.amas')) abreMenuAsistente(false);
    if (!ev.target.closest('.anuevowrap')) { $('aNuevoMenu')?.classList.remove('on'); $('aNuevo')?.setAttribute('aria-expanded', 'false'); }
  });
  $('aNuevoMenu').onclick = async ev => {
    const b = ev.target.closest('[data-nuevo]'); if (!b) return;
    $('aNuevoMenu').classList.remove('on');
    if (b.dataset.nuevo === 'general') return nuevoHilo(null);
    const c = await eligeContacto('Nueva conversación sobre…');
    if (c) nuevoHilo(c);
  };

  // Imagenes o PDF para el asistente: un comprobante, la foto de un vestido, otra cotizacion.
  $('planFile').onchange = async e => {
    const files = [...e.target.files]; e.target.value = '';
    for (const f of files) {
      if (f.type === 'application/pdf') {
        if (f.size > 5 * 1024 * 1024) { avisa('PDF demasiado grande', 'El máximo son 5 MB.'); continue; }
        PLAN_IMGS.push({ nombre:f.name, mime:'application/pdf', datos: await leeBase64(f) });
        continue;
      }
      if (!f.type?.startsWith('image/')) continue;
      const blob = await comprimeNormal(f);   // no le hace falta la resolucion completa
      PLAN_IMGS.push({ nombre:f.name, mime: blob.type || 'image/jpeg', datos: await leeBase64(blob) });
    }
    pintaPlanCola();
  };
  $('planCola').onclick = ev => {
    const b = ev.target.closest('[data-quita]'); if (!b) return;
    PLAN_IMGS.splice(Number(b.dataset.quita), 1); pintaPlanCola();
  };
  $('btnReglasAbrir').onclick = abreReglas;

  $('aHLista').onclick = ev => {
    const menu = ev.target.closest('[data-hmenu]');
    if (menu) { ev.stopPropagation(); return opcionesHilo(menu.dataset.hmenu); }
    if (ev.target.closest('[data-hrecarga]')) return cargaHilos();
    const fila = ev.target.closest('[data-hilo]');
    if (fila) abreHilo(fila.dataset.hilo);
  };
  $('aHLista').onkeydown = ev => {
    const fila = ev.target.closest('[data-hilo]');
    if (fila && (ev.key === 'Enter' || ev.key === ' ') && !ev.target.closest('[data-hmenu]')) { ev.preventDefault(); abreHilo(fila.dataset.hilo); }
  };
  $('aVerArchivados').onclick = () => {
    ASIS.archivados = !ASIS.archivados;
    $('aVerArchivados').textContent = ASIS.archivados ? 'Volver a las activas' : 'Ver archivadas';
    ASIS.cargados = false; ASIS.hilos = [];
    pintaHilos(); cargaHilos();
  };
  $('aAbreHilos').onclick = () => $('asistente').classList.toggle('hilos-on');
  $('aVelo').onclick = cierraCajon;
  $('contexto').onclick = ev => {
    if (ev.target.closest('[data-quitacon]')) return quitaContacto();
    if (ev.target.closest('[data-cambiacon]')) return cambiaContacto();
  };
  $('aTitulo').onclick = () => { if (ASIS.actual?.id) opcionesHilo(ASIS.actual.id); };
  $('aAbrirChat').onclick = () => {
    const c = convPorId(ASIS.actual?.conversation_id);
    if (!c) return avisa('No encuentro ese chat', 'Puede que ya no exista o que su línea no esté conectada.');
    abre(c); ve('conversations');
  };
  $('ahilo').onclick = manejaClicHilo;
  $('ahilo').onkeydown = ev => {
    const w = ev.target.closest('[data-wiz]');
    if (w && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); usaReceta(Number(w.dataset.wiz)); }
  };

  pintaMenuAsistente();
  pintaFoco();
  pintaContexto();
  pintaHilos();
  pintaHilo();
  cargaReglas();
  ASIS.cargaPromesa = cargaHilos();
}

function cierraCajon(){ $('asistente')?.classList.remove('hilos-on'); }

function abreMenuAsistente(abrir){
  const m = $('planMenu'); if (!m) return;
  m.classList.toggle('on', !!abrir);
  $('planMas')?.setAttribute('aria-expanded', abrir ? 'true' : 'false');
}

function pintaMenuAsistente(){
  const m = $('planMenu'); if (!m) return;
  m.innerHTML =
    '<div class="agrupo">Centrar en…</div>'
    + FOCOS_PANEL.map(f => '<button data-foco="' + esc(f.id) + '"'
        + (FOCO === f.id ? ' class="puesto"' : '') + '>'
        + '<b>' + esc(f.n) + '</b><span>' + esc(f.d) + '</span></button>').join('')
    + '<div class="agrupo">Adjuntar</div>'
    + '<button data-adjunta><b>Imagen o PDF</b><span>Un comprobante, un vestido, otra cotización.</span></button>'
    + '<div class="agrupo">Asistentes guiados</div>'
    + WIZARDS.map((w,i) => '<button data-wiz="' + i + '"><b>' + esc(w.n) + '</b></button>').join('');

  m.onclick = ev => {
    const f = ev.target.closest('[data-foco]');
    const w = ev.target.closest('[data-wiz]');
    const a = ev.target.closest('[data-adjunta]');
    if (!f && !w && !a) return;
    abreMenuAsistente(false);
    if (a) return $('planFile').click();
    if (f) {
      // Volver a elegir el mismo foco lo quita: es un interruptor, no una via de un solo
      // sentido. Sin esto habria que buscar la equis para volver al modo normal.
      FOCO = FOCO === f.dataset.foco ? '' : f.dataset.foco;
      pintaFoco(); pintaMenuAsistente();
      $('pedido')?.focus();
      return;
    }
    usaReceta(Number(w.dataset.wiz));
  };
}

async function usaReceta(i){
  const w = WIZARDS[i]; if (!w) return;
  if (w.contacto && ASIS.actual?.scope !== 'contact') {
    const c = await eligeContacto(w.n + ': ¿con qué contacto?');
    if (!c) return;
    nuevoHilo(c);
  }
  ponPedido(w.p);
}

function ponPedido(texto){
  const caja = $('pedido'); if (!caja) return;
  caja.value = texto;
  caja.dispatchEvent(new Event('input'));
  caja.focus();
}

function pintaFoco(){
  const c = $('planFoco'); if (!c) return;
  const f = FOCOS_PANEL.find(x => x.id === FOCO);
  c.hidden = !f;
  const caja = $('pedido');
  if (!f) {
    if (caja) caja.placeholder = 'Escribe al asistente…';
    return;
  }
  c.innerHTML = '<span>Centrado en <b>' + esc(f.n) + '</b></span>'
    + '<button id="quitaFoco" title="Quitar el enfoque" aria-label="Quitar el enfoque">×</button>';
  $('quitaFoco').onclick = () => { FOCO = ''; pintaFoco(); pintaMenuAsistente(); };
  if (caja) caja.placeholder = f.n + ': escribe al asistente…';
}

// Cabecera: titulo del hilo y a quien se refiere. El contacto sale del HILO.
function pintaContexto(){
  const h = ASIS.actual;
  const t = $('aTitulo'); if (t) t.textContent = h?.title || 'Asistente';
  const c = $('contexto'); if (!c) return;
  c.innerHTML = h?.scope === 'contact' && h.conversation_id
    ? '<span class="achip">Sobre: <b>' + esc(h.contact_label || 'contacto') + '</b>'
      + '<button data-quitacon title="Pasar a tarea general" aria-label="Quitar el contacto">×</button></span>'
      + '<button class="alink" data-cambiacon>Cambiar</button>'
    : '<span>' + esc(contextoTexto(h)) + '</span><button class="alink" data-cambiacon>Elegir contacto</button>';
  const abrir = $('aAbrirChat');
  if (abrir) abrir.hidden = !(h?.scope === 'contact' && h.conversation_id);
}

// ---- Hilos ----------------------------------------------------------------
async function cargaHilos(){
  const r = await llama({ action:'assistantThreads', operation:'list', archived: ASIS.archivados });
  ASIS.cargados = true;
  if (!r.ok) { ASIS.errorHilos = traduceErrorAsistente(r); pintaHilos(); return; }
  ASIS.errorHilos = null;
  ASIS.hilos = r.threads || [];
  pintaHilos();
  // Al entrar se reabre el ultimo hilo de este navegador; si no hay, uno nuevo en blanco.
  if (!ASIS.actual && !ASIS.archivados && !ASIS.pendienteDeAbrir) {
    let ultimo = null;
    try { ultimo = localStorage.getItem('crm2_asis_hilo'); } catch (e) { /* sin almacenamiento */ }
    if (ultimo && ASIS.hilos.some(h => h.id === ultimo)) abreHilo(ultimo);
    else nuevoHilo(null);
  }
}

function pintaHilos(){
  const cont = $('aHLista'); if (!cont) return;
  if (ASIS.errorHilos) {
    cont.innerHTML = '<div class="ahvacio">' + esc(ASIS.errorHilos.texto)
      + '<br><button class="btn-linea" data-hrecarga style="margin-top:8px">Reintentar</button></div>';
    return;
  }
  if (!ASIS.cargados) { cont.innerHTML = '<div class="ahvacio"><span class="cargando"></span></div>'; return; }
  if (!ASIS.hilos.length) {
    cont.innerHTML = '<div class="ahvacio">' + (ASIS.archivados ? 'No hay conversaciones archivadas.'
      : 'Todavía no hay conversaciones. Escribe abajo y se crea la primera.') + '</div>';
    return;
  }
  const grupos = {};
  for (const h of ASIS.hilos) (grupos[grupoDeFecha(h.updated_at)] ||= []).push(h);
  cont.innerHTML = ['Hoy', 'Ayer', 'Últimos 7 días', 'Anteriores'].filter(g => grupos[g])
    .map(g => '<div class="ahgrupo">' + g + '</div>' + grupos[g].map(filaHilo).join('')).join('');
}

function filaHilo(h){
  return '<div class="ahfila' + (ASIS.actual?.id === h.id ? ' on' : '') + '" data-hilo="' + esc(h.id) + '" role="button" tabindex="0">'
    + '<div class="ahtexto"><b>' + esc(h.title || 'Nueva tarea') + '</b>'
    + '<span>' + (h.contact_label ? '<i class="ahcon">' + esc(h.contact_label) + '</i> · ' : '') + esc(h.last_preview || '') + '</span></div>'
    + (h.pending_proposals ? '<span class="ahinsignia" title="Propuestas pendientes de aprobar">' + Number(h.pending_proposals) + '</span>' : '')
    + '<button class="ahmenu" data-hmenu="' + esc(h.id) + '" aria-label="Opciones de la conversación">⋯</button>'
    + '</div>';
}

// El servidor manda la version buena del hilo en cada respuesta; aqui solo se sustituye.
function actualizaHilo(h){
  if (!h?.id) return;
  const i = ASIS.hilos.findIndex(x => x.id === h.id);
  const enEstaLista = (h.status === 'archived') === ASIS.archivados;
  if (i >= 0) { if (enEstaLista) ASIS.hilos[i] = { ...ASIS.hilos[i], ...h }; else ASIS.hilos.splice(i, 1); }
  else if (enEstaLista) ASIS.hilos.unshift(h);
  ASIS.hilos.sort((a, b) => String(b.updated_at || '').localeCompare(String(a.updated_at || '')));
  if (ASIS.actual?.id === h.id) ASIS.actual = { ...ASIS.actual, ...h };
}

// Borrador por hilo en este navegador: cambiar de hilo no se come lo que se estaba escribiendo.
function claveBorrador(){ return 'crm2_asis_borrador:' + (ASIS.actual?.id || 'nuevo'); }
function guardaBorradorActual(){
  const caja = $('pedido'); if (!caja || !ASIS.actual) return;
  try {
    if (caja.value.trim()) localStorage.setItem(claveBorrador(), caja.value);
    else localStorage.removeItem(claveBorrador());
  } catch (e) { /* sin almacenamiento: el borrador solo vive en la caja */ }
}
function restauraBorrador(){
  const caja = $('pedido'); if (!caja) return;
  let v = '';
  try { v = localStorage.getItem(claveBorrador()) || ''; } catch (e) { v = ''; }
  caja.value = v;
  altoCaja(caja);
}
function borraBorrador(){ try { localStorage.removeItem(claveBorrador()); } catch (e) { /* nada */ } }
// La caja crece con el texto hasta 160 px. scrollHeight no cuenta el borde y la caja mide con
// el borde dentro: sin sumarlo quedaba 2 px corta y salia una barra de desplazamiento en
// cuanto se escribia una sola letra.
function altoCaja(caja){
  caja.style.height = 'auto';
  if (!caja.value) return;
  caja.style.height = Math.min(caja.scrollHeight + caja.offsetHeight - caja.clientHeight, 160) + 'px';
}

// Hilo nuevo, general o de un contacto. No existe en el servidor hasta el primer mensaje:
// asi "+ Nuevo" no deja hilos vacios en la lista.
function nuevoHilo(c){
  if (planEnCurso) detenAsistente();
  guardaBorradorActual();
  const id = c ? String(c.id || c._id) : null;
  ASIS.actual = {
    id:null, title: c ? 'Sobre ' + nombreDe(c) : 'Nueva tarea', scope: c ? 'contact' : 'general',
    conversation_id: id, contact_label: c ? etiquetaDe(c) : null, status:'active', turn_count:0, pending_proposals:0,
  };
  ASIS.turnos = []; ASIS.local = null; ASIS.hayMas = false; ASIS.errorCarga = null; ASIS.cargandoTurnos = false;
  FOCO = ''; pintaFoco(); pintaMenuAsistente();
  restauraBorrador();
  pintaContexto(); pintaHilo(); pintaHilos(); cierraCajon();
  $('pedido')?.focus();
}

async function abreHilo(id){
  if (!id) return;
  if (planEnCurso) detenAsistente();
  guardaBorradorActual();
  ASIS.actual = ASIS.hilos.find(h => h.id === id) || { id, title:'…' };
  ASIS.turnos = []; ASIS.local = null; ASIS.hayMas = false; ASIS.errorCarga = null; ASIS.cargandoTurnos = true;
  FOCO = ''; pintaFoco(); pintaMenuAsistente();
  restauraBorrador();
  pintaContexto(); pintaHilo(); pintaHilos(); cierraCajon();
  const r = await llama({ action:'assistantThreads', operation:'get', thread_id:id });
  if (ASIS.actual?.id !== id) return;            // se abrio otro mientras tanto
  ASIS.cargandoTurnos = false;
  if (!r.ok) { ASIS.errorCarga = traduceErrorAsistente(r); pintaHilo(); return; }
  ASIS.actual = r.thread; ASIS.turnos = r.turns || []; ASIS.hayMas = r.has_more === true;
  actualizaHilo(r.thread);
  pintaContexto(); pintaHilo(); pintaHilos();
  try { localStorage.setItem('crm2_asis_hilo', id); } catch (e) { /* nada */ }
}

// Quitar el contacto: el hilo pasa a tarea general y el asistente deja de recibir esa ficha.
async function quitaContacto(){
  const h = ASIS.actual; if (!h) return;
  if (!h.id) {
    Object.assign(h, { scope:'general', conversation_id:null, contact_label:null });
    if (/^Sobre /.test(h.title)) h.title = 'Nueva tarea';
    return pintaContexto();
  }
  const r = await llama({ action:'assistantThreads', operation:'set_contact', thread_id:h.id, conversation_id:null });
  if (!r.ok) return avisa('No se pudo quitar el contacto', traduceErrorAsistente(r).texto);
  actualizaHilo(r.thread); pintaContexto(); pintaHilos();
}

// Cambiar de contacto un hilo que ya tiene conversacion abre OTRO hilo: mezclar lo hablado
// de una persona con las propuestas de otra es como se aplicaban cambios a quien no era.
async function cambiaContacto(){
  const c = await eligeContacto('¿Sobre qué contacto?');
  if (!c) return;
  const h = ASIS.actual;
  const id = String(c.id || c._id);
  if (h && !h.id) {
    Object.assign(h, { scope:'contact', conversation_id:id, contact_label:etiquetaDe(c) });
    if (h.title === 'Nueva tarea' || /^Sobre /.test(h.title)) h.title = 'Sobre ' + nombreDe(c);
    return pintaContexto();
  }
  if (h?.id && !h.turn_count) {
    const r = await llama({ action:'assistantThreads', operation:'set_contact', thread_id:h.id, conversation_id:id });
    if (r.ok) { actualizaHilo(r.thread); pintaContexto(); pintaHilos(); return; }
  }
  nuevoHilo(c);
}

function eligeContacto(titulo){
  return new Promise(resolve => {
    let hecho = false;
    const fin = v => { if (hecho) return; hecho = true; cierraModal(); resolve(v); };
    abreModal('<div class="mtapa"><b>' + esc(titulo) + '</b><button class="cerrarm" data-cerrar>×</button></div>'
      + '<div class="mcuerpo"><div class="campo"><input id="aBuscaCon" autocomplete="off" '
      +   'placeholder="Nombre, teléfono, últimos 4 dígitos o etiqueta"></div>'
      +   '<div class="aconlista" id="aConLista"></div></div>');
    const pinta = () => {
      const lista = filtraContactos(CONVS, $('aBuscaCon')?.value || '');
      $('aConLista').innerHTML = lista.length ? lista.map(c => {
        const n = nombreDe(c), k = canalDe(c);
        return '<button class="aconfila" data-con="' + esc(c.id || c._id) + '">' + avatarDe(c, n)
          + '<span><b>' + esc(n) + '</b><i>' + (c.wa_phone ? '+' + esc(c.wa_phone) + ' · ' : '')
          + esc(CANALES[k]?.corto || '') + (c.lifecycle_stage ? ' · ' + esc(String(c.lifecycle_stage).replace(/_/g, ' ')) : '')
          + '</i></span></button>';
      }).join('') : '<div class="ahvacio">Nadie coincide con esa búsqueda.</div>';
      resuelveAvatares();
    };
    $('modal').querySelector('[data-cerrar]').onclick = () => fin(null);
    $('aConLista').onclick = ev => { const f = ev.target.closest('[data-con]'); if (f) fin(convPorId(f.dataset.con)); };
    $('aBuscaCon').oninput = pinta;
    $('aBuscaCon').onkeydown = ev => {
      if (ev.key !== 'Enter') return;
      const primero = $('aConLista').querySelector('[data-con]');
      if (primero) { ev.preventDefault(); fin(convPorId(primero.dataset.con)); }
    };
    pinta();
    $('aBuscaCon').focus();
  });
}

function opcionesHilo(id){
  const h = ASIS.hilos.find(x => x.id === id) || (ASIS.actual?.id === id ? ASIS.actual : null);
  if (!h) return;
  abreModal('<div class="mtapa"><b>Conversación</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo"><div class="campo"><label>Nombre</label>'
    +   '<input id="hNombre" maxlength="80" value="' + esc(h.title || '') + '"></div></div>'
    + '<div class="mpatas"><button class="btn-linea" id="hArchivar">' + (h.status === 'archived' ? 'Desarchivar' : 'Archivar') + '</button>'
    +   '<button class="btn-solido" id="hGuardar">Guardar nombre</button></div>');
  $('modal').querySelector('[data-cerrar]').onclick = cierraModal;
  $('hGuardar').onclick = async () => {
    const title = $('hNombre').value.trim();
    if (!title) return;
    const r = await llama({ action:'assistantThreads', operation:'rename', thread_id:id, title });
    if (!r.ok) return avisa('No se pudo renombrar', traduceErrorAsistente(r).texto);
    cierraModal(); actualizaHilo(r.thread); pintaHilos(); pintaContexto();
  };
  $('hArchivar').onclick = async () => {
    const r = await llama({ action:'assistantThreads', operation: h.status === 'archived' ? 'unarchive' : 'archive', thread_id:id });
    if (!r.ok) return avisa('No se pudo cambiar', traduceErrorAsistente(r).texto);
    cierraModal(); actualizaHilo(r.thread); pintaHilos();
    if (ASIS.actual?.id === id && r.thread.status === 'archived') nuevoHilo(null);
  };
}

// Desde un chat o desde Movilizacion: abre Planificacion en un hilo de ESE contacto (el mas
// reciente que tenga, o uno nuevo). Es la unica via por la que un chat llega al asistente, y
// es explicita: abrir un chat en Conversaciones ya no cambia el contacto de ningun hilo.
async function preguntaAlAsistente(c, texto = ''){
  if (!c) return;
  // Una conversacion ignorada no se le cuenta al asistente: sus mensajes viajan a Google para
  // armar el contexto, y eso es justo lo que el dueño pidio evitar con la familia, sus propios
  // numeros y los colegas. El servidor tambien lo rechaza (409 conversacion_ignorada); aqui se
  // dice antes y con palabras, en vez de enseñar un error.
  if (ignorada(c)) return avisa('Esa conversación está ignorada',
    'El asistente no lee las conversaciones ignoradas. Deja de ignorarla si quieres que la analice.');
  ASIS.pendienteDeAbrir = true;
  ve('planning');
  try { await ASIS.cargaPromesa; } catch (e) { /* la lista mostrara su error */ }
  const id = String(c.id || c._id);
  const h = ASIS.archivados ? null : ASIS.hilos.find(x => x.conversation_id === id);
  if (h) await abreHilo(h.id); else nuevoHilo(c);
  ASIS.pendienteDeAbrir = false;
  if (texto) ponPedido(texto);
}

// ---- El hilo ----------------------------------------------------------------
const ESTADO_PROPUESTA = { pending:'Pendiente de aprobar', applying:'Aplicando…', applied:'Aplicada', failed:'Falló', rejected:'Descartada' };
const CAMPO_LEGIBLE = {
  lifecycle_stage:'Etapa', lead_status:'Estado', reservation_status:'Reserva', priority:'Prioridad',
  interested_category:'Categoría', follow_up_at:'Seguimiento', tentative_date:'Fecha tentativa',
  next_step_suggested:'Siguiente paso', human_handoff_required:'Atención humana', human_handoff_reason:'Motivo de atención',
  auto_template_paused:'Plantillas automáticas pausadas', marketing_opt_in:'Permiso de marketing',
  followups_opt_in:'Permiso de seguimientos', reminders_opt_in:'Permiso de recordatorios',
};
const valorLegible = v => v === true ? 'sí' : v === false ? 'no' : (v === null || v === undefined || v === '') ? '—' : String(v).replace(/_/g, ' ');

function pintaHilo(){
  const cont = $('ahilo'); if (!cont) return;
  const h = ASIS.actual;
  if (ASIS.cargandoTurnos) { cont.innerHTML = '<div class="abienvenida"><span class="cargando"></span></div>'; return; }
  if (ASIS.errorCarga) {
    cont.innerHTML = '<div class="aturno"><div class="aerror" role="alert"><b>' + esc(ASIS.errorCarga.titulo) + '</b>'
      + '<span>' + esc(ASIS.errorCarga.texto) + '</span><button class="btn-linea" data-recarga-hilo>Reintentar</button></div></div>';
    return;
  }
  if (!ASIS.turnos.length && !ASIS.local) {
    cont.innerHTML = '<div class="abienvenida">'
      + '<b>¿En qué te ayudo?</b>'
      + '<p>Pregúntame lo que quieras del negocio o de un contacto. Leo fichas, mensajes y las reglas '
      +   'del negocio; si hay que cambiar algo te lo propongo, y no se toca nada hasta que lo apruebes.</p>'
      + (h?.scope === 'contact' ? '<p>Esta conversación es sobre <b style="display:inline;font-size:inherit">'
          + esc(h.contact_label || 'el contacto') + '</b>.</p>' : '')
      + '<div class="atarjetas">' + WIZARDS.map((w,i) =>
          '<div class="atarjeta" data-wiz="' + i + '" role="button" tabindex="0"><b>' + esc(w.n) + '</b>'
          + '<span>' + esc(w.p.slice(0, 96).replace(/\s+\S*$/, '') + '…') + '</span></div>').join('')
      + '</div></div>';
    return;
  }
  const partes = ASIS.turnos.map((t, i) => cuerpoTurno(t, ASIS.animaUltimo && !ASIS.local && i === ASIS.turnos.length - 1));
  if (ASIS.local) partes.push(turnoLocal(ASIS.local));
  cont.innerHTML = (ASIS.hayMas ? '<div class="amasviejos">Se muestran los últimos mensajes de esta conversación.</div>' : '')
    + partes.join('');
  ASIS.animaUltimo = false;
  cont.scrollTop = cont.scrollHeight;
}

function cuerpoTurno(t, nuevo){
  const clase = nuevo ? ' nuevo' : '';
  if (t.role === 'user') {
    return '<div class="aturno yo' + clase + '"><div class="aburbuja">' + esc(t.text)
      + (t.attachments ? '<span class="aimgs">' + Number(t.attachments) + ' adjunto(s)</span>' : '') + '</div></div>';
  }
  if (t.role === 'result') return '<div class="asistema' + clase + '">' + esc(t.text) + '</div>';
  const lecturas = Array.isArray(t.read_tools) && t.read_tools.length
    ? '<div class="aconsulta">Consultó: ' + esc([...new Set(t.read_tools.map(l => LECTURA_LEGIBLE[l.name] || l.name))].join(', ')) + '</div>' : '';
  const propuestas = (Array.isArray(t.proposals) ? t.proposals : []).map(p => tarjetaPropuesta(t, p)).join('');
  return '<div class="aturno ia' + clase + '"><div class="aav">' + esc(sigla) + '</div><div class="aburbuja">'
    + '<div class="atexto">' + formatoSeguro(t.text) + '</div>' + lecturas + propuestas
    + '<div class="apie"><button data-copiar="' + esc(t.id) + '">Copiar</button></div>'
    + '</div></div>';
}
const LECTURA_LEGIBLE = {
  buscar_contactos:'búsqueda de contactos', leer_ficha:'ficha', leer_mensajes:'mensajes', resumen_negocio:'estado del negocio',
  agenda:'agenda', plantillas_aprobadas:'plantillas', candidatos_desinteres:'candidatos a desinterés', simular_difusion:'simulación de difusión',
};

// Lo que esta en vuelo o fallo. No es parte de la conversacion guardada: si falla, se enseña
// con su salida y la caja conserva el texto.
function turnoLocal(l){
  const yo = '<div class="aturno yo pendiente"><div class="aburbuja">' + esc(l.texto || '(adjunto)')
    + (l.n_adjuntos ? '<span class="aimgs">' + l.n_adjuntos + ' adjunto(s)</span>' : '') + '</div></div>';
  if (l.estado === 'enviando') {
    return yo + '<div class="aturno ia nuevo"><div class="aav">' + esc(sigla) + '</div><div class="aburbuja">'
      + '<span class="apuntos" aria-label="Escribiendo"><i></i><i></i><i></i></span>'
      + '<button class="adetener" data-detener>Detener</button></div></div>';
  }
  const e = l.error || { titulo:'No se pudo responder', texto:'', reintentar:true };
  return yo + '<div class="aturno"><div class="aerror" role="alert"><b>' + esc(e.titulo) + '</b>'
    + (e.texto ? '<span>' + esc(e.texto) + '</span>' : '')
    + (e.reintentar !== false ? '<button class="btn-linea" data-reintentar>Reintentar</button>' : '')
    + '<small>No se guardó en la conversación: tu texto sigue en la caja.</small></div></div>';
}

function tarjetaPropuesta(t, p){
  const clave = esc(t.id) + '|' + esc(p.id);
  const cambios = Object.entries(p.params?.fields || {}).map(([k, v]) => '<div class="acambio"><span class="k">'
    + esc(CAMPO_LEGIBLE[k] || k) + '</span>'
    + (p.before && k in p.before ? '<span class="antes">' + esc(valorLegible(p.before[k])) + '</span><span>→</span>' : '')
    + '<b>' + esc(valorLegible(v)) + '</b></div>').join('');
  const extra = p.name === 'draft_message'
    ? '<div class="amsg"><button class="acopiar" data-copiarb="' + clave + '">Copiar</button>' + esc(p.params?.texto || '') + '</div>'
    : p.name === 'communication_policy'
      ? '<div class="acambio"><span class="k">Comunicaciones</span><b>' + (p.params?.operation === 'block'
          ? 'Apagar bot, promociones y seguimientos (sus mensajes se siguen recibiendo)'
          : 'Reactivar la automatización (no concede permiso de marketing)') + '</b></div>'
      : '';
  const editable = ['update_lead', 'create_reservation', 'draft_message'].includes(p.name);
  let botones = '';
  if (p._enCurso) botones = '<span class="cargando"></span>';
  else if (p.status === 'pending') {
    botones = '<button class="btn-solido" data-aprobar="' + clave + '">' + (p.name === 'draft_message' ? 'Llevar al chat' : 'Aprobar') + '</button>'
      + (editable ? '<button class="btn-linea" data-editar="' + clave + '">Editar</button>' : '')
      + '<button class="btn-linea" data-descartar="' + clave + '">Descartar</button>';
  } else if (p.status === 'failed') {
    botones = '<button class="btn-solido" data-aprobar="' + clave + '">Reintentar</button>'
      + '<button class="btn-linea" data-descartar="' + clave + '">Descartar</button>';
  } else if (p.status === 'applied' && p.name === 'draft_message') {
    botones = '<button class="btn-linea" data-llevar="' + clave + '">Llevar al chat otra vez</button>';
  }
  return '<div class="apropuesta ' + esc(p.status) + '">'
    + '<div class="aptapa"><b>' + esc(NOMBRE_HERRAMIENTA[p.name] || p.name) + '</b>'
    +   '<span class="apestado">' + esc(ESTADO_PROPUESTA[p.status] || p.status) + '</span></div>'
    + '<div class="apcuerpo">' + (p.contact_label ? '<div class="apquien">' + esc(p.contact_label) + '</div>' : '')
    +   (p.preview ? '<p class="apmotivo">' + esc(p.preview) + '</p>' : '') + cambios + extra
    +   (p.status === 'failed' && p.error ? '<div class="aperror">' + esc(p.error.message || p.error) + '</div>' : '')
    +   (p._error ? '<div class="aperror">' + esc(p._error) + '</div>' : '')
    +   (p.decided_by && ['applied', 'rejected'].includes(p.status) ? '<div class="apmotivo" style="margin:8px 0 0">'
          + (p.status === 'applied' ? 'Aprobada' : 'Descartada') + ' por ' + esc(p.decided_by) + '</div>' : '')
    + '</div>' + (botones ? '<div class="appatas">' + botones + '</div>' : '') + '</div>';
}

function manejaClicHilo(ev){
  const w = ev.target.closest('[data-wiz]');
  if (w) return usaReceta(Number(w.dataset.wiz));
  const b = ev.target.closest('button'); if (!b) return;
  if ('reintentar' in b.dataset) return reintentaAsistente();
  if ('detener' in b.dataset) return detenAsistente();
  if ('recargaHilo' in b.dataset) return ASIS.actual?.id && abreHilo(ASIS.actual.id);
  if (b.dataset.copiar) return copiaTurno(b);
  if (b.dataset.copiarb) return copiaBorrador(b);
  const clave = b.dataset.aprobar || b.dataset.descartar || b.dataset.editar || b.dataset.llevar;
  if (!clave) return;
  const [turnId, propId] = clave.split('|');
  if (b.dataset.aprobar) return apruebaPropuesta(turnId, propId);
  if (b.dataset.descartar) return decidePropuesta(turnId, propId, 'reject');
  if (b.dataset.editar) return editaPropuesta(turnId, propId);
  const { p } = localiza(turnId, propId);
  if (p) llevaAlChat(p);
}

// Copiar el borrador es lo que mas se hace con el cuando no se quiere llevar tal cual al chat.
async function copiaBorrador(b){
  const [turnId, propId] = b.dataset.copiarb.split('|');
  const { p } = localiza(turnId, propId); if (!p) return;
  try {
    await navigator.clipboard.writeText(p.params?.texto || '');
    b.textContent = 'Copiado';
    setTimeout(() => { b.textContent = 'Copiar'; }, 1600);
  } catch (e) { avisa('No se pudo copiar', 'Selecciona el texto y cópialo a mano.'); }
}

async function copiaTurno(b){
  const t = ASIS.turnos.find(x => x.id === b.dataset.copiar); if (!t) return;
  try {
    await navigator.clipboard.writeText(t.text || '');
    b.textContent = 'Copiado';
    setTimeout(() => { b.textContent = 'Copiar'; }, 1600);
  } catch (e) { avisa('No se pudo copiar', 'Selecciona el texto y cópialo a mano.'); }
}

// ---- Envio ------------------------------------------------------------------
let planEnCurso = false;
async function pide(){
  const caja = $('pedido');
  const texto = caja?.value.trim() || '';
  if ((!texto && !PLAN_IMGS.length) || planEnCurso) return;
  if (PLAN_IMGS.length > 3) avisa('Solo van los 3 primeros adjuntos', 'Es el máximo que acepta el asistente.');
  // attachment_payloads: assistantAttachmentParts (servidor) lee item.mime y item.data.
  const adjuntos = PLAN_IMGS.slice(0, 3).map(a => ({ mime:a.mime, data:a.datos }));
  await enviaTurno({ texto, ctid: nuevoIdTurno(), adjuntos, n_adjuntos: adjuntos.length, foco: FOCO, estado:'enviando', error:null });
}

// Reintentar reusa el MISMO client_turn_id: si el servidor si llego a contestar (se corto la
// red a la vuelta, se pulso Detener tarde), devuelve esa respuesta en vez de pedir otra.
async function reintentaAsistente(){
  const l = ASIS.local;
  if (!l || l.estado !== 'error' || planEnCurso) return;
  await enviaTurno(l);
}
function detenAsistente(){ try { ASIS.controlador?.abort(); } catch (e) { /* ya parado */ } }

// El hilo se crea en el servidor con el primer mensaje. Uno general NO lleva conversation_id,
// aunque haya un chat abierto en Conversaciones.
async function aseguraHilo(){
  const h = ASIS.actual;
  if (h?.id) return { ok:true };
  const cuerpo = { action:'assistantThreads', operation:'create', scope: h?.scope === 'contact' ? 'contact' : 'general' };
  if (cuerpo.scope === 'contact') cuerpo.conversation_id = h.conversation_id;
  const r = await llama(cuerpo);
  if (!r.ok) return r;
  try { localStorage.removeItem('crm2_asis_borrador:nuevo'); } catch (e) { /* nada */ }
  ASIS.actual = r.thread;
  actualizaHilo(r.thread);
  guardaBorradorActual();
  try { localStorage.setItem('crm2_asis_hilo', r.thread.id); } catch (e) { /* nada */ }
  pintaContexto(); pintaHilos();
  return { ok:true };
}

async function enviaTurno(local){
  planEnCurso = true;
  const boton = $('btnPedir');
  if (boton) { boton.disabled = true; boton.setAttribute('aria-busy', 'true'); }
  local.estado = 'enviando'; local.error = null;
  ASIS.local = local;
  pintaHilo();
  try {
    const creado = await aseguraHilo();
    if (ASIS.local !== local) return;
    if (!creado.ok) return fallaTurno(local, creado);
    const cuerpo = { action:'assistantChat', thread_id: ASIS.actual.id, text: local.texto, client_turn_id: local.ctid };
    if (local.foco) cuerpo.focus = local.foco;
    if (local.adjuntos.length) cuerpo.attachment_payloads = local.adjuntos;
    ASIS.controlador = typeof AbortController === 'function' ? new AbortController() : null;
    const r = await llama(cuerpo, { signal: ASIS.controlador?.signal });
    if (ASIS.local !== local) return;              // se cambio de hilo mientras tanto
    if (!r.ok) return fallaTurno(local, r);
    // Lo que queda es lo que guardo el servidor; el turno local desaparece.
    ASIS.local = null;
    for (const t of [r.user_turn, r.turn]) if (t && !ASIS.turnos.some(x => x.id === t.id)) ASIS.turnos.push(t);
    if (r.thread) actualizaHilo(r.thread);
    const caja = $('pedido');
    if (caja && caja.value.trim() === local.texto) { caja.value = ''; caja.style.height = 'auto'; borraBorrador(); }
    if (local.n_adjuntos) { PLAN_IMGS.splice(0, local.n_adjuntos); pintaPlanCola(); }
    ASIS.animaUltimo = true;
    pintaHilo(); pintaHilos(); pintaContexto();
  } catch (e) {
    if (ASIS.local === local) fallaTurno(local, { ok:false, error: e?.message || String(e) });
  } finally {
    planEnCurso = false;
    ASIS.controlador = null;
    if (boton) { boton.disabled = false; boton.removeAttribute('aria-busy'); }
  }
}

// El fallo se queda SOLO en pantalla: no entra en ASIS.turnos (lo guardado) ni se le manda al
// modelo. El panel viejo lo metia en el hilo como si fuera una respuesta y lo reenviaba como
// contexto en cada pregunta siguiente.
function fallaTurno(local, r){
  local.estado = 'error';
  local.error = traduceErrorAsistente(r);
  pintaHilo();
  return false;
}
// ---- Asistente: fin del envio

// ---- Aprobar, editar, descartar ---------------------------------------------
function localiza(turnId, propId){
  const t = ASIS.turnos.find(x => x.id === turnId);
  const p = (t?.proposals || []).find(x => x.id === propId);
  return { t, p };
}

const FRASE_POLITICA = { block:'DESACTIVAR CONTACTO', restore:'REACTIVAR' };

async function apruebaPropuesta(turnId, propId){
  const { p } = localiza(turnId, propId); if (!p) return;
  if (p.name === 'communication_policy') return confirmaPolitica(turnId, propId);
  const final = await decidePropuesta(turnId, propId, 'approve');
  if (final?.status === 'applied' && final.name === 'draft_message') llevaAlChat(final);
}

// Decidir es del servidor. Aqui solo se pinta el estado mientras tanto y lo que vuelve; un 409
// (otra pestaña o doble clic ya lo decidio) enseña lo guardado en vez de un error.
async function decidePropuesta(turnId, propId, decision, extra = {}){
  const { p } = localiza(turnId, propId);
  if (!p || p._enCurso || !ASIS.actual?.id) return null;
  p._enCurso = true; p._error = null;
  pintaHilo();
  const cuerpo = { action:'assistantDecide', thread_id: ASIS.actual.id, turn_id: turnId, proposal_id: propId, decision };
  if (extra.edits) cuerpo.edits = extra.edits;
  if (extra.confirmation) cuerpo.confirmation = extra.confirmation;
  const r = await llama(cuerpo);
  p._enCurso = false;
  if (!r.ok) {
    if (r.status === 409 && r.detail?.proposal) { Object.assign(p, r.detail.proposal); pintaHilo(); return p; }
    p._error = traduceErrorAsistente(r).texto;
    pintaHilo();
    return null;
  }
  Object.assign(p, r.proposal);
  if (r.result_turn && !ASIS.turnos.some(x => x.id === r.result_turn.id)) ASIS.turnos.push(r.result_turn);
  if (r.thread) actualizaHilo(r.thread);
  pintaHilo(); pintaHilos();
  if (p.status === 'applied' && p.name !== 'draft_message') avisa('Aplicado', (NOMBRE_HERRAMIENTA[p.name] || p.name) + (p.contact_label ? ' · ' + p.contact_label : ''));
  if (p.status === 'failed') avisa('No se pudo aplicar', p.error?.message || '');
  return p;
}

// Apagar o reactivar comunicaciones pide una casilla y la frase escrita. La frase se compara
// sin mayusculas ni espacios (fraseCoincide) y al servidor se manda la EXACTA.
function confirmaPolitica(turnId, propId){
  const { p } = localiza(turnId, propId); if (!p) return;
  const op = p.params?.operation === 'restore' ? 'restore' : 'block';
  const frase = FRASE_POLITICA[op];
  abreModal('<div class="mtapa"><b>' + (op === 'block' ? 'Apagar comunicaciones' : 'Reactivar comunicaciones') + '</b>'
    + '<button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo"><p class="aviso">' + (op === 'block'
        ? 'Se apagarán bot, promociones y seguimientos para <b>' + esc(p.contact_label || 'este contacto') + '</b>. Sus mensajes se seguirán recibiendo.'
        : 'Se reactivará la automatización para <b>' + esc(p.contact_label || 'este contacto') + '</b>. No concede permiso de marketing.') + '</p>'
    + '<label class="achequeo"><input type="checkbox" id="polEntiendo"> Entiendo lo que cambia</label>'
    + '<div class="campo"><label for="polFrase">Escribe ' + frase + ' para confirmar</label>'
    +   '<input id="polFrase" autocomplete="off" spellcheck="false"></div>'
    + '<p class="aviso" style="margin:0">Da igual si va en mayúsculas o minúsculas.</p></div>'
    + '<div class="mpatas"><button class="btn-linea" data-cerrar>Cancelar</button>'
    +   '<button class="btn-solido" id="polOk" disabled>Confirmar</button></div>');
  $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });
  const valida = () => { $('polOk').disabled = !($('polEntiendo').checked && fraseCoincide($('polFrase').value, frase)); };
  $('polEntiendo').onchange = valida;
  $('polFrase').oninput = valida;
  $('polOk').onclick = async () => {
    if (!$('polEntiendo').checked || !fraseCoincide($('polFrase').value, frase)) return;
    cierraModal();
    await decidePropuesta(turnId, propId, 'approve', { confirmation: frase });
  };
  $('polFrase').focus();
}

const OPCIONES_CAMPO = () => ({ lifecycle_stage:ETAPAS, lead_status:ESTADOS, reservation_status:RESERVA, priority:PRIORIDADES, interested_category:CATEGORIAS });

// Editar antes de aprobar. El servidor vuelve a sanear lo editado igual que la propuesta:
// editar no es una puerta para escribir campos que el asistente no podria proponer.
function editaPropuesta(turnId, propId){
  const { p } = localiza(turnId, propId); if (!p) return;
  if (p.name === 'draft_message') {
    abreModal('<div class="mtapa"><b>Borrador para ' + esc(p.contact_label || 'el contacto') + '</b><button class="cerrarm" data-cerrar>×</button></div>'
      + '<div class="mcuerpo"><div class="campo"><textarea id="bTexto" rows="8">' + esc(p.params?.texto || '') + '</textarea></div>'
      + '<p class="aviso" style="margin:0">Se lleva al chat para que lo revises y lo envíes tú. No se envía nada solo.</p></div>'
      + '<div class="mpatas"><button class="btn-linea" data-cerrar>Cancelar</button><button class="btn-solido" id="bLlevar">Llevar al chat</button></div>');
    $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });
    $('bLlevar').onclick = async () => {
      const texto = $('bTexto').value.trim(); if (!texto) return;
      cierraModal();
      const final = await decidePropuesta(turnId, propId, 'approve', { edits:{ texto } });
      if (final?.status === 'applied') llevaAlChat(final);
    };
    return;
  }
  // En una reserva solo se corrigen la fecha y el siguiente paso (el resto son campos fijos de
  // la herramienta), y se ofrecen aunque el asistente no pusiera fecha: es lo que mas se añade.
  const campos = p.name === 'create_reservation'
    ? [['tentative_date', p.params?.fields?.tentative_date || ''], ['next_step_suggested', p.params?.fields?.next_step_suggested || '']]
    : Object.entries(p.params?.fields || {}).filter(() => p.name === 'update_lead');
  const opciones = OPCIONES_CAMPO();
  const control = (k, v) => {
    if (opciones[k]) return '<select data-campo="' + k + '">' + opciones[k].map(o => '<option value="' + esc(o) + '"'
      + (o === v ? ' selected' : '') + '>' + esc(String(o).replace(/_/g, ' ')) + '</option>').join('') + '</select>';
    if (typeof v === 'boolean') return '<select data-campo="' + k + '" data-bool="1"><option value="true"' + (v ? ' selected' : '')
      + '>sí</option><option value="false"' + (!v ? ' selected' : '') + '>no</option></select>';
    if (/_date$|_at$/.test(k)) return '<input type="date" data-campo="' + k + '" value="' + esc(String(v || '').slice(0, 10)) + '">';
    return '<input data-campo="' + k + '" value="' + esc(v ?? '') + '">';
  };
  abreModal('<div class="mtapa"><b>' + esc(NOMBRE_HERRAMIENTA[p.name] || p.name) + '</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo"><p class="aviso">' + esc(p.contact_label || '') + '</p>'
    + (campos.length ? campos.map(([k, v]) => '<div class="campo"><label>' + esc(CAMPO_LEGIBLE[k] || k) + '</label>' + control(k, v) + '</div>').join('')
        : '<p class="aviso">Esta propuesta no tiene campos editables.</p>')
    + '</div><div class="mpatas"><button class="btn-linea" data-cerrar>Cancelar</button>'
    + '<button class="btn-solido" id="eAprobar">Aprobar con estos datos</button></div>');
  $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });
  $('eAprobar').onclick = async () => {
    const fields = {};
    $('modal').querySelectorAll('[data-campo]').forEach(el => {
      fields[el.dataset.campo] = el.dataset.bool ? el.value === 'true' : el.value.trim();
    });
    cierraModal();
    await decidePropuesta(turnId, propId, 'approve', campos.length ? { edits:{ fields } } : {});
  };
}

// Un borrador aprobado se lleva al compositor del chat de ese contacto. NO se envia: una
// persona lo lee, lo corrige si hace falta y pulsa enviar.
function llevaAlChat(p){
  const c = convPorId(p.conversation_id);
  if (!c) return avisa('No encuentro ese chat', 'Puede que ya no exista o que se haya archivado.');
  abre(c); ve('conversations');
  // Por una red oculta no se escribe desde el CRM: el hilo se abre en solo lectura y el
  // compositor esta escondido por CSS, no quitado del DOM. Pegar ahi el borrador dejaria el
  // texto en una caja invisible y un aviso diciendo "pulsa enviar" sin nada que pulsar.
  const red = redSocial(c);
  if (red) return avisa('Ese contacto es de ' + red,
    'Por aquí no se envía: copia el texto y contéstale en Meta Business Suite.\n\n' + (p.params?.texto || ''));
  const caja = $('texto');
  if (!caja) return;
  const texto = p.params?.texto || '';
  caja.value = caja.value.trim() ? caja.value.trim() + '\n\n' + texto : texto;
  caja.dispatchEvent(new Event('input'));
  caja.focus();
  avisa('Borrador en el chat', 'Revísalo y pulsa enviar. Todavía no se envió nada.');
}

// El ejemplo del placeholder NO lleva precios. Llevaba "abono minimo RD$3,000", y esa cifra
// no es de este negocio: hay combos desde RD$1,700, o sea que el ejemplo pedia un abono mayor
// que el precio. Peor todavia, se lee como si fuera la regla vigente -- yo mismo la audite
// como real antes de ver que era el placeholder de un campo vacio.
const EJEMPLO_REGLAS = '- El abono para apartar la fecha es de RD$…\n'
  + '- No trabajamos domingos.\n- Nunca prometer una fecha sin confirmarla con el estudio.\n'
  + '- Tratar de usted a personas mayores.';

// OJO: las reglas se CARGAN aqui, no solo al montar Planificacion. Este dialogo se abre
// tambien desde Configuracion, y alli esa vista puede no haberse montado nunca: el cuadro
// salia vacio, con el ejemplo de fondo, y al pulsar Guardar se escribia esa nada ENCIMA de
// las reglas de verdad. Un borrado silencioso, y desde el boton que dice "Guardar".
//
// Hasta que terminan de cargar, el cuadro y el boton estan bloqueados: sin eso, escribir
// rapido y guardar tendria la misma consecuencia por otra via.
async function abreReglas(){
  abreModal('<div class="mtapa"><b>Reglas del negocio</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo">'
    + '<p class="aviso">Esto se le da al asistente en cada respuesta. Sirve para lo que no está en '
    +   'ninguna ficha: cómo se cobra, qué no se promete, qué fechas están cerradas, cómo se habla.</p>'
    + '<div class="campo"><textarea id="reglas" rows="12" disabled placeholder="' + esc(EJEMPLO_REGLAS) + '">'
    +   esc(REGLAS) + '</textarea></div></div>'
    + '<div class="mpatas"><span class="quien" id="reglasNota">Cargando…</span>'
    +   '<button class="btn-solido" id="btnReglas" disabled>Guardar</button></div>');
  $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });
  // Solo se cierra si de verdad se guardo. Antes cerraba pase lo que pase, asi que un fallo
  // se anunciaba en un aviso de 4 segundos y el dialogo desaparecia como si todo fuera bien.
  $('btnReglas').onclick = async () => { if (await guardaReglas()) cierraModal(); };
  const ok = await cargaReglas();
  const caja = $('reglas'); const boton = $('btnReglas');
  if (!caja || !boton) return;                 // lo cerraron mientras cargaba
  if (!ok) {
    $('reglasNota').textContent = 'No se pudieron leer las reglas. No guardes: escribirías encima.';
    return;
  }
  caja.disabled = false; boton.disabled = false;
}

// A quien se refiere el hilo, en palabras. Sale del HILO: antes salia de `sel`, el ultimo chat
// abierto, y por eso Planificacion se quedaba atada a ese contacto hasta recargar la pagina.
function contextoTexto(h = ASIS.actual){
  return h?.scope === 'contact' && h.conversation_id
    ? 'Sobre: ' + (h.contact_label || 'contacto')
    : 'Tarea general: el asistente busca a quien haga falta.';
}
// Cada herramienta se explica en cristiano ANTES de aprobarla. "create_reservation"
// no le dice nada a nadie; "pasa el lead a pendiente de reserva" sí.
const NOMBRE_HERRAMIENTA = {
  contact_report: 'Leer la conversación y resumirla',
  create_reservation: 'Pasar el lead a pendiente de reserva',
  mark_paid: 'Marcar como pagado y pedir validación humana del comprobante',
  draft_message: 'Borrador de mensaje (no se envía solo)',
  communication_policy: 'Cambiar la política de comunicación',
  mark_disinterest: 'Marcar desinteresado y apagar el marketing',
  update_lead: 'Cambiar datos de la ficha',
};

/* ---- Sesión -------------------------------------------------------------- */
$('formAcceso').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = $('errorAcceso'); err.classList.remove('on');
  $('btnEntrar').disabled = true;
  try { await signInWithEmailAndPassword(auth, $('correo').value.trim(), $('clave').value); }
  catch (e) {
    err.textContent = e?.code === 'auth/invalid-credential'
      ? 'Correo o contraseña incorrectos.' : (e?.message || 'No se pudo entrar.');
    err.classList.add('on');
  }
  finally { $('btnEntrar').disabled = false; }
});
$('btnSalir').onclick = () => signOut(auth);

onAuthStateChanged(auth, async u => {
  if (!u) {
    $('acceso').classList.remove('oculto');
    $('app').classList.remove('on');
    if (paraMsgs) { paraMsgs(); paraMsgs = null; }
    return;
  }
  $('acceso').classList.add('oculto');
  $('app').classList.add('on');
  $('quien').textContent = u.email || '';
  // El historial se carga solo al entrar. No hay boton de "actualizar": la escucha
  // en vivo trae los cambios sin que nadie tenga que pedirlos.
  escuchaConversaciones();
  // El estado de la linea llega en vivo y para cualquier rol. Antes se pedia una vez al entrar,
  // solo le contestaba a un admin, y cambiar algo en el puente obligaba a recargar.
  escuchaLineaQr();
  // Si Instagram y Messenger estan encendidos, hay que saberlo YA: arrancan ocultos a proposito,
  // asi que lo unico que esta llamada puede hacer es traerlos de vuelta, nunca hacerlos
  // desaparecer delante de quien mira. socialStatus lo contesta a cualquier rol.
  cargaEstadoRedes();
  vigilaVersion();
  setInterval(vigilaVersion, 300000);
  ve(location.hash.slice(1) || CFG.defaultView || 'conversations');
});
</script>
