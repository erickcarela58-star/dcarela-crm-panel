<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D'Carela CRM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💬</text></svg>">
<script src="./crm-config.js"></script>
<script src="./firebase-config.js"></script>
<!-- opus-recorder graba OGG/Opus de verdad por WASM. MediaRecorder no sirve aqui: en
     Chrome produce webm o mp4-con-opus, y WhatsApp Cloud descarta los dos EN SILENCIO
     aunque devuelva un wamid. Es decir, el envio parece correcto y el cliente no
     recibe nada. Esta libreria produce el unico formato que acepta. -->
<script src="https://cdn.jsdelivr.net/npm/opus-recorder@8.0.5/dist/recorder.min.js"></script>
<style>
/* =============================================================================
   D' CARELA CRM — hoja de estilo escrita desde cero.
   No se importa ni una linea del panel anterior. Aquel archivo acumulaba cuatro
   capas de CSS de epocas distintas peleandose por especificidad, y cada arreglo
   ganaba en un sitio y rompia en otro. Aqui hay UNA capa: fichas de color arriba,
   y debajo reglas de una sola clase. Si algo hay que cambiar, se cambia la ficha.
   ============================================================================= */

/* --- Fichas de color. Claro por defecto; oscuro solo redefine las fichas. ---- */
:root{
  --bg:#ffffff;        /* fondo de la aplicacion            */
  --panel:#ffffff;     /* superficies: barra, listas, ficha  */
  --wall:#efeae2;      /* pared de la conversacion           */
  --line:#e9edef;      /* divisor fino                       */
  --line2:#d1d7db;     /* borde de control                   */
  --fg:#111b21;        /* texto principal                    */
  --mut:#667781;       /* texto secundario                   */
  --ink:#111b21;       /* tinta: seleccion, botones solidos  */
  --on-ink:#ffffff;    /* texto sobre tinta                  */
  --in:#ffffff;        /* globo entrante                     */
  --out:#d9fdd3;       /* globo saliente                     */
  --meta:rgba(17,27,33,.45);
  --hover:rgba(11,20,26,.04);
  --ok:#0a8f4d;
  --warn:#b26a00;
  --bad:#b21a1a;
  --sombra:0 12px 34px rgba(11,20,26,.14);
  --r:8px;             /* radio base   */
  --r2:12px;           /* radio grande */
}
:root[data-tema="oscuro"]{
  --bg:#111b21; --panel:#111b21; --wall:#0b141a;
  --line:#222d34; --line2:#2a3942;
  --fg:#e9edef; --mut:#8696a0;
  --ink:#e9edef; --on-ink:#111b21;
  --in:#202c33; --out:#005c4b;
  --meta:rgba(233,237,239,.5);
  --hover:rgba(255,255,255,.045);
  --ok:#25d366; --warn:#ffb454; --bad:#ff8e8e;
  --sombra:0 12px 34px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* --- Estructura ------------------------------------------------------------ */
/* Tres columnas fijas y una elastica. La conversacion es lo que se viene a leer,
   asi que es la que crece; los laterales tienen ancho tope. */
#app{display:none;height:100dvh;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
#app.on{display:grid}
.lateral{grid-row:1/3;width:250px;display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--line)}
.barra{grid-column:2;display:flex;align-items:center;gap:14px;height:60px;padding:0 16px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.lienzo{grid-column:2;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}

/* --- Lateral --------------------------------------------------------------- */
.marca{display:flex;align-items:center;gap:11px;padding:15px 14px;border-bottom:1px solid var(--line)}
.marca img,.marca .sigla{width:38px;height:38px;border-radius:50%;flex:0 0 auto;object-fit:cover}
.marca .sigla{display:flex;align-items:center;justify-content:center;
  background:var(--ink);color:var(--on-ink);font-weight:700;font-size:13px}
.marca b{display:block;font-size:14px;font-weight:650;line-height:1.2}
.marca span{display:block;font-size:11.5px;color:var(--mut);line-height:1.3;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.marca div{min-width:0}

.nav{flex:1;overflow-y:auto;padding:10px 8px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:2px;
  border-radius:var(--r2);color:var(--fg);text-decoration:none;font-size:13.5px;font-weight:500}
.nav a:hover{background:var(--hover)}
.nav a.on{background:var(--ink);color:var(--on-ink);font-weight:600}
.nav a svg{width:19px;height:19px;flex:0 0 auto;stroke-width:1.9}
.nav a .cuenta{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:9px;
  background:var(--ok);color:#fff}
.nav a.on .cuenta{background:var(--on-ink);color:var(--ink)}
/* Las secundarias solo aparecen con el menu desplegado. La regla vive aqui, en CSS
   puro, sin depender de que ningun script haya corrido antes: si no hay clase, se
   ven todas. Un menu de mas nunca es tan grave como un menu vacio. */
.nav .secundarias{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
body.menu-abierto .nav .secundarias{display:block}
.nav .rotulo{padding:10px 12px 5px;font-size:9.5px;font-weight:800;letter-spacing:.9px;
  text-transform:uppercase;color:var(--mut)}

.pie{padding:11px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut)}
.pie .estado{display:flex;align-items:center;gap:7px;margin-bottom:9px;line-height:1.3}
.punto{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.punto.mal{background:var(--bad)}
.pie button{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:8px;
  border:1px solid var(--line2);border-radius:var(--r);color:var(--fg);font-size:12.5px}
.pie button:hover{background:var(--hover)}

/* --- Barra superior -------------------------------------------------------- */
.titulo{flex:1;min-width:0;font-size:15px;font-weight:650;letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* flex-shrink:0 en el grupo derecho: sin eso "Manual" se recortaba contra el borde
   cuando el titulo era largo. */
.barra .der{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.btn-linea{padding:8px 13px;border:1px solid var(--line2);border-radius:var(--r);
  font-size:12.5px;font-weight:600;color:var(--fg);text-decoration:none;white-space:nowrap;
  flex:0 0 auto}
.btn-linea:hover{background:var(--hover)}
.quien{font-size:11.5px;color:var(--mut);max-width:190px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

/* --- Vistas ---------------------------------------------------------------- */
.vista{display:none;height:100%;min-height:0}
.vista.on{display:flex}
.hoja{flex:1;min-width:0;overflow-y:auto;padding:26px 30px}
.hoja h1{margin:0 0 4px;font-size:21px;font-weight:700;letter-spacing:-.3px}
.hoja .bajada{margin:0 0 22px;color:var(--mut);font-size:13px;max-width:640px}

/* --- Conversaciones: lista ------------------------------------------------- */
.lista{width:min(330px,30vw);flex:0 0 auto;display:flex;flex-direction:column;
  border-right:1px solid var(--line);background:var(--panel)}
.lista .cabeza{padding:11px 12px 9px;display:flex;flex-direction:column;gap:9px}
.lista .cabeza input,.lista .cabeza select{width:100%;height:36px;padding:0 12px;
  border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);color:var(--fg);outline:0}
/* Envuelven en vez de desplazarse. Con scroll lateral y la barra oculta, el ultimo
   filtro quedaba cortado contra el borde sin ninguna pista de que hubiera mas. */
.filtros{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.filtro{padding:5px 11px;border-radius:14px;background:var(--hover);color:var(--mut);
  font-size:12px;font-weight:600;white-space:nowrap;flex:0 0 auto}
.filtro.on{background:var(--ink);color:var(--on-ink)}
.filtro b{margin-left:5px;opacity:.65;font-weight:700}
.chats{flex:1;overflow-y:auto}

/* Fila de chat: plana, con el divisor arrancando despues del avatar, como WhatsApp.
   Dos lineas de contenido; la etiqueta de etapa comparte linea con el mensaje. */
.chat{display:flex;gap:11px;align-items:center;padding:9px 13px;position:relative;cursor:pointer}
.chat::after{content:"";position:absolute;left:63px;right:0;bottom:0;height:1px;background:var(--line)}
.chat:last-child::after{display:none}
.chat:hover{background:var(--hover)}
.chat.on{background:var(--hover);box-shadow:inset 3px 0 0 var(--ink)}
.av{width:41px;height:41px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;background:var(--line);color:var(--mut);font-size:13px;font-weight:650}
.chat .cuerpo{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;
  align-items:center;column-gap:8px}
.chat .fila1{grid-column:1/3;display:flex;align-items:baseline;gap:8px}
.chat .nom{flex:1;min-width:0;font-size:13.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .hora{font-size:10.5px;color:var(--mut);flex:0 0 auto}
.chat.sinleer .hora{color:var(--ok);font-weight:700}
.chat .prev{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .marcas{display:flex;gap:4px;align-items:center;flex:0 0 auto}
.etiqueta{font-size:8.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  padding:2px 5px;border-radius:4px;background:var(--hover);color:var(--mut);white-space:nowrap}
.globito{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--ok);
  color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* --- Conversaciones: chat -------------------------------------------------- */
.conversacion{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--wall)}
.cabecera{display:flex;align-items:center;gap:11px;padding:9px 16px;min-height:60px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.cabecera .quien-chat{flex:1;min-width:0}
.cabecera .quien-chat b{display:block;font-size:15px;font-weight:600}
.cabecera .quien-chat span{display:block;font-size:12px;color:var(--mut)}
.cabecera .modo{padding:8px 14px;border:1px solid var(--line2);border-radius:var(--r2);
  font-size:12.5px;font-weight:600}
.cabecera .modo:hover{background:var(--hover)}
.mas{position:relative}
.mas>button{width:34px;height:34px;border-radius:50%;color:var(--mut);font-size:19px}
.mas>button:hover{background:var(--hover);color:var(--fg)}
.mas .menu{display:none;position:absolute;right:0;top:38px;z-index:40;min-width:190px;padding:5px;
  flex-direction:column;background:var(--panel);border:1px solid var(--line2);
  border-radius:var(--r2);box-shadow:var(--sombra)}
.mas.on .menu{display:flex}
.mas .menu button{padding:9px 11px;border-radius:var(--r);text-align:left;font-size:13px}
.mas .menu button:hover{background:var(--hover)}

.mensajes{flex:1;overflow-y:auto;padding:18px 6.5%;display:flex;flex-direction:column;
  background-color:var(--wall);
  background-image:radial-gradient(circle at 1px 1px,rgba(17,27,33,.055) 1px,transparent 0);
  background-size:22px 22px}
:root[data-tema="oscuro"] .mensajes{background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0)}
.dia{align-self:center;margin:10px 0;padding:4px 11px;border-radius:var(--r);
  background:var(--panel);color:var(--mut);font-size:11px;font-weight:600;box-shadow:var(--sombra)}
.globo{position:relative;max-width:min(66%,600px);margin-top:2px;padding:6px 9px 5px;
  border-radius:var(--r);font-size:13.5px;line-height:1.42;
  box-shadow:0 1px .5px rgba(11,20,26,.13);white-space:pre-wrap;word-break:break-word}
.globo.primero{margin-top:9px}
.globo.entra{align-self:flex-start;background:var(--in);border-radius:0 var(--r) var(--r) var(--r)}
.globo.sale{align-self:flex-end;background:var(--out);border-radius:var(--r) 0 var(--r) var(--r)}
.globo.seguido{border-radius:var(--r)}
.globo.primero.entra::before{content:"";position:absolute;left:-8px;top:0;
  border-top:8px solid var(--in);border-left:8px solid transparent}
.globo.primero.sale::before{content:"";position:absolute;right:-8px;top:0;
  border-top:8px solid var(--out);border-right:8px solid transparent}
.globo .pie-globo{float:right;margin:6px 0 -2px 10px;font-size:10.5px;line-height:1;
  color:var(--meta);white-space:nowrap;user-select:none}
.globo .pie-globo b{font-weight:400}
.globo .pie-globo .leido{color:#53bdeb}
.globo .pie-globo .fallo{color:var(--bad);font-weight:700}
.globo .autor{font-size:11px;font-weight:700;color:var(--ok);margin-bottom:1px}
.mmedia{display:block;max-width:250px;max-height:320px;width:auto;border-radius:6px;
  margin:1px 0 3px;cursor:zoom-in}
video.mmedia{cursor:default}
.msticker{display:block;max-width:130px;max-height:130px;margin:2px 0}
.maudio{display:block;width:230px;max-width:100%;height:38px;margin:2px 0}
.marchivo{display:flex;flex-direction:column;gap:2px;padding:9px 11px;margin:2px 0 4px;
  border-radius:6px;background:rgba(11,20,26,.06)}
:root[data-tema="oscuro"] .marchivo{background:rgba(255,255,255,.07)}
.marchivo b{font-size:13px;word-break:break-word}
.marchivo span{font-size:11px;color:var(--meta)}
.marchivo a{margin-top:4px;font-size:12px;font-weight:650;color:inherit}
.mpie{margin-top:3px;white-space:pre-wrap;word-break:break-word}
/* El boton de opciones solo aparece al pasar por encima: en reposo el hilo se lee
   limpio, como WhatsApp. En tactil no hay hover, asi que ahi se deja siempre. */
.gaccion{position:absolute;top:2px;right:3px;width:20px;height:18px;border-radius:4px;
  color:var(--meta);font-size:13px;line-height:1;opacity:0;transition:opacity .12s;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.06) 30%)}
.globo:hover .gaccion{opacity:1}
@media(hover:none){.gaccion{opacity:.65}}
.gmenu{position:absolute;top:20px;right:2px;z-index:20;min-width:154px;padding:4px;
  display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);
  border-radius:var(--r);box-shadow:var(--sombra)}
.gmenu button{padding:8px 10px;border-radius:5px;text-align:left;font-size:12.5px;color:var(--fg)}
.gmenu button:hover{background:var(--hover)}
.gmenu button.peligro{color:var(--bad)}
.cita{border-left:3px solid var(--ok);border-radius:4px;padding:4px 8px;margin-bottom:4px;
  background:rgba(11,20,26,.06);font-size:12px;color:var(--meta);line-height:1.35}
:root[data-tema="oscuro"] .cita{background:rgba(255,255,255,.07)}
.cita b{display:block;color:var(--ok);font-size:11px}
.barra-cita{display:flex;align-items:center;gap:9px;padding:8px 14px;
  background:var(--panel);border-top:1px solid var(--line)}
.barra-cita[hidden]{display:none}
.barra-cita .cvertical{width:3px;align-self:stretch;border-radius:2px;background:var(--ok)}
.barra-cita .ctexto{flex:1;min-width:0;font-size:12.5px;color:var(--mut);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra-cita button{width:26px;height:26px;border-radius:50%;color:var(--mut);font-size:16px}
.barra-cita button:hover{background:var(--hover)}
/* Lupa: ver una foto de cerca sin salir del chat ni abrir otra pestaña. */
#lupa{display:none;position:fixed;inset:0;z-index:95;background:rgba(11,20,26,.88);
  align-items:center;justify-content:center;padding:26px;cursor:zoom-out}
#lupa.on{display:flex}
#lupa img{max-width:100%;max-height:100%;border-radius:6px}

.escribir{display:flex;align-items:flex-end;gap:9px;padding:10px 14px;
  background:var(--panel);border-top:1px solid var(--line)}
.escribir textarea{flex:1;min-height:40px;max-height:150px;padding:10px 14px;resize:none;
  border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);color:var(--fg);outline:0}
.escribir textarea:focus{border-color:var(--line2)}
.enviar{width:41px;height:41px;border-radius:50%;flex:0 0 auto;background:var(--ink);
  color:var(--on-ink);display:flex;align-items:center;justify-content:center}
.enviar:disabled{opacity:.4;cursor:not-allowed}
.adjuntos{display:flex;gap:2px;align-items:center;flex:0 0 auto;padding-bottom:2px}
.adj{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--mut);font-size:11px;font-weight:800;letter-spacing:.3px}
.adj svg{width:20px;height:20px}
.adj:hover{background:var(--hover);color:var(--fg)}
.adj.hd{border:1.5px solid var(--line2)}
.adj.hd.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.cola{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 11px;background:var(--panel)}
.pieza{display:inline-flex;align-items:center;gap:8px;max-width:250px;padding:5px 8px 5px 5px;
  border:1px solid var(--line2);border-radius:var(--r);font-size:12px}
.pieza img{width:36px;height:36px;object-fit:cover;border-radius:5px;flex:0 0 auto}
.pieza .ico{width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:5px;background:var(--hover);font-size:17px;flex:0 0 auto}
.pieza .pnom{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pieza .pnom i{display:block;font-style:normal;font-size:10.5px;color:var(--meta)}
.pieza button{color:var(--mut);font-size:15px;line-height:1;flex:0 0 auto}
.pieza button:hover{color:var(--bad)}
/* `display:flex` le gana al atributo hidden (que solo trae display:none de la hoja
   del navegador), asi que la barra de grabacion se veia SIEMPRE: parecia que el panel
   estaba grabando sin parar. La regla de [hidden] va explicita y despues. */
.grabando{display:flex;align-items:center;gap:11px;flex:1;padding:0 4px;font-size:13px;font-weight:600}
.grabando[hidden]{display:none}
.pulso{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:0 0 auto;
  animation:latido 1s infinite}
@keyframes latido{50%{opacity:.25}}
.grabando #reloj{font-variant-numeric:tabular-nums;min-width:38px;flex:0 0 auto}
/* Las ondas son el nivel real del microfono, no una animacion. Si el dibujo se queda
   plano es que no esta entrando sonido, y eso hay que poder verlo antes de enviar. */
#ondas{flex:1;min-width:60px;height:30px;display:block}
/* Mientras se graba se esconde el area de texto y los adjuntos, pero NO el boton de
   enviar: desaparecia justo cuando hacia falta y no habia forma de mandar la nota. */
.escribir:has(.grabando:not([hidden])) textarea{display:none}
.escribir:has(.grabando:not([hidden])) .adjuntos{display:none}
.escribir:has(.grabando:not([hidden])) .enviar{display:none}
.grabando #recEnviar,.grabando #recCancelar{flex:0 0 auto}

.vacio{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;
  color:var(--mut);font-size:13.5px;text-align:center;background:var(--wall)}

/* --- Ficha del lead -------------------------------------------------------- */
/* Sin una sola herramienta suelta. Todo lo operativo se pide por prompt en
   Planificacion; aqui solo se lee el estado y se editan datos. */
.ficha{width:min(320px,26vw);flex:0 0 auto;display:flex;flex-direction:column;
  background:var(--panel);border-left:1px solid var(--line)}
.ficha .cabeza{display:flex;align-items:center;justify-content:space-between;
  padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.ficha .cabeza b{font-size:14px;font-weight:650}
.ficha .cuerpo{flex:1;overflow-y:auto;padding:14px 16px 26px}
.seccion{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
  color:var(--mut);margin:0 0 8px}
.aviso{margin:0 0 16px;font-size:12.5px;line-height:1.5;color:var(--mut)}
.grupo{border:1px solid var(--line);border-radius:var(--r2);margin-bottom:9px;overflow:hidden}
.grupo>summary{list-style:none;cursor:pointer;padding:11px 13px;display:flex;
  align-items:center;justify-content:space-between;gap:8px;
  font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
.grupo>summary::-webkit-details-marker{display:none}
.grupo>summary::after{content:"";width:6px;height:6px;border-right:2px solid var(--mut);
  border-bottom:2px solid var(--mut);transform:rotate(-45deg) translateX(-2px);transition:transform .18s}
.grupo[open]>summary::after{transform:rotate(45deg) translateY(-2px)}
.grupo>summary:hover{background:var(--hover)}
.grupo .dentro{padding:2px 13px 13px}
.grupo .nota{font-size:10.5px;font-weight:600;color:var(--mut);letter-spacing:0;text-transform:none}
.campo{margin-bottom:11px}
.campo label{display:block;font-size:9.5px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.campo input,.campo select,.campo textarea{width:100%;padding:8px 10px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--bg);color:var(--fg);outline:0;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--line2)}
.par{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.dato{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:7px}
.dato .k{font-size:9.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
.dato .v{font-size:13px;margin-top:2px;word-break:break-word}

/* --- Planificacion: el prompt unico ---------------------------------------- */
.prompt{max-width:760px}
.prompt textarea{width:100%;min-height:104px;padding:14px 16px;border:1px solid var(--line2);
  border-radius:var(--r2);background:var(--panel);color:var(--fg);outline:0;resize:vertical;
  font-size:14px;line-height:1.5}
.prompt textarea:focus{border-color:var(--ink)}
.prompt .acciones{display:flex;align-items:center;gap:11px;margin-top:11px;flex-wrap:wrap}
.btn-solido{padding:11px 20px;border-radius:var(--r2);background:var(--ink);color:var(--on-ink);
  font-size:13.5px;font-weight:650}
.btn-solido:disabled{opacity:.45;cursor:not-allowed}
.ejemplos{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.ejemplo{padding:7px 12px;border:1px solid var(--line2);border-radius:16px;
  font-size:12.5px;color:var(--mut);text-align:left}
.ejemplo:hover{background:var(--hover);color:var(--fg)}
.propuesta{margin-top:22px;max-width:760px;border:1px solid var(--line2);
  border-radius:var(--r2);overflow:hidden}
.propuesta .tapa{padding:13px 16px;border-bottom:1px solid var(--line);background:var(--hover)}
.propuesta .tapa b{font-size:13.5px}
.propuesta .cuerpo{padding:15px 16px}
.propuesta .cambio{padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:8px;font-size:13px}
.propuesta .cambio .k{font-size:9.5px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.propuesta .patas{display:flex;gap:9px;padding:13px 16px;border-top:1px solid var(--line)}
/* Los campos exactos que se van a escribir. Quien aprueba tiene derecho a ver el
   cambio literal, no solo el resumen bonito. */
.campos{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.campos span{padding:3px 8px;border-radius:5px;background:var(--hover);
  font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--mut)}
.cargando{display:inline-block;width:15px;height:15px;border:2px solid var(--line2);
  border-top-color:var(--ink);border-radius:50%;animation:giro .7s linear infinite;vertical-align:-3px}
@keyframes giro{to{transform:rotate(360deg)}}

/* --- Modal ----------------------------------------------------------------- */
.modal{display:none;position:fixed;inset:0;z-index:80;background:rgba(11,20,26,.55);
  align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .caja{width:100%;max-width:470px;max-height:84vh;display:flex;flex-direction:column;
  background:var(--panel);border-radius:var(--r2);box-shadow:var(--sombra);overflow:hidden}
.mtapa{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:15px 18px;border-bottom:1px solid var(--line);font-size:14px}
.cerrarm{color:var(--mut);font-size:21px;line-height:1}
.cerrarm:hover{color:var(--fg)}
.mcuerpo{flex:1;overflow-y:auto;padding:15px 18px}
.mpatas{display:flex;justify-content:flex-end;gap:9px;padding:13px 18px;border-top:1px solid var(--line)}
.tpl{display:block;width:100%;text-align:left;padding:11px 13px;margin-bottom:8px;
  border:1px solid var(--line);border-radius:var(--r2)}
.tpl:hover{background:var(--hover);border-color:var(--line2)}
.tpl b{display:block;font-size:13.5px}
.tplmeta{display:block;margin-top:2px;font-size:11px;color:var(--mut)}
.tplprev{display:block;margin-top:6px;font-size:12px;color:var(--mut);line-height:1.4;
  padding-top:6px;border-top:1px dashed var(--line)}
.pdfs{display:flex;flex-wrap:wrap;gap:6px}
.tplchip{padding:7px 12px;border:1px solid var(--line2);border-radius:16px;font-size:12.5px;font-weight:600}
.tplchip:hover{background:var(--hover)}
.tplchip:disabled{opacity:.5}
.rapida{display:flex;align-items:stretch;gap:6px;margin-bottom:7px}
.rapida>button:first-child{flex:1;min-width:0;text-align:left;padding:10px 12px;
  border:1px solid var(--line);border-radius:var(--r2)}
.rapida>button:first-child:hover{background:var(--hover);border-color:var(--line2)}
.rapida b{display:block;font-size:13px}
.rapida span{display:block;margin-top:2px;font-size:11.5px;color:var(--mut);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rx{width:32px;border:1px solid var(--line);border-radius:var(--r);color:var(--mut);font-size:16px;flex:0 0 auto}
.rx:hover{color:var(--bad);border-color:var(--bad)}
.estados{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:940px}
.estado{display:flex;flex-direction:column;gap:7px}
.estado img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:var(--r);border:1px solid var(--line)}
.estado a{text-align:center;text-decoration:none;font-size:12px}

/* --- Tabla ----------------------------------------------------------------- */
.tabla{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;max-width:900px}
.fila{display:grid;grid-template-columns:minmax(0,2fr) 1fr 1fr auto;gap:12px;
  align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
.fila:last-child{border-bottom:0}
.fila.cabecera{background:var(--hover);font-size:9.5px;font-weight:800;
  letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.fila small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.chip{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.4px;
  padding:3px 7px;border-radius:5px;background:var(--hover);color:var(--mut)}
.chip.ok{background:rgba(10,143,77,.13);color:var(--ok)}
.chip.mal{background:rgba(178,26,26,.11);color:var(--bad)}
.chip.medio{background:rgba(178,106,0,.12);color:var(--warn)}
.interruptor{padding:4px 12px;border:1px solid var(--line2);border-radius:11px;
  font-size:11.5px;font-weight:700;color:var(--mut)}
.interruptor.on{background:var(--ok);border-color:var(--ok);color:#fff}
/* La lista de destinatarios se enseña entera y con scroll propio: si no cabe, es
   preferible desplazarse que enviar a ciegas a gente que no se ha visto. */
.destinos{display:flex;flex-direction:column;gap:3px;max-height:230px;overflow-y:auto;
  margin-top:5px;font-size:12px;color:var(--mut)}
.destinos span{padding:3px 0;border-bottom:1px solid var(--line)}
.destinos span:last-child{border-bottom:0}

/* --- Kanban ---------------------------------------------------------------- */
.kanban{display:flex;gap:11px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.columna{flex:0 0 246px;display:flex;flex-direction:column;max-height:calc(100dvh - 230px);
  border:1px solid var(--line);border-radius:var(--r2);background:var(--panel)}
.columna.encima{border-color:var(--ink);background:var(--hover)}
.ctitulo{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;
  border-bottom:1px solid var(--line);font-size:10px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;color:var(--mut)}
.ctitulo b{font-size:11px;color:var(--fg)}
.ccuerpo{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;min-height:70px}
.ktarjeta{padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--bg);cursor:grab}
.ktarjeta:active{cursor:grabbing}
.ktarjeta.moviendo{opacity:.4}
.ktarjeta b{display:block;font-size:13px;font-weight:600}
.ktarjeta span{display:block;font-size:11.5px;color:var(--mut);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ktarjeta i{display:block;font-style:normal;font-size:10.5px;color:var(--meta);margin-top:3px}
.kmas{padding:7px;text-align:center;font-size:11.5px;color:var(--mut)}

/* --- Dashboard ------------------------------------------------------------- */
.cifras{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:11px;max-width:940px}
.cifra{padding:15px 16px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel)}
.cifra b{display:block;font-size:27px;font-weight:700;line-height:1.1;letter-spacing:-.5px}
.cifra span{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.cifra i{display:block;font-style:normal;font-size:10.5px;color:var(--meta);margin-top:2px}
.barras{display:flex;flex-direction:column;gap:7px;max-width:560px}
.barra{display:grid;grid-template-columns:132px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:12.5px}
.barra .be{color:var(--mut);text-transform:capitalize}
.barra .bp{height:8px;border-radius:4px;background:var(--hover);overflow:hidden}
.barra .bp i{display:block;height:100%;background:var(--ink);border-radius:4px}
.barra .bn{text-align:right;font-weight:650}

/* --- Login ----------------------------------------------------------------- */
#acceso{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:22px}
#acceso.oculto{display:none}
.tarjeta-acceso{width:100%;max-width:376px;padding:32px 30px;background:var(--panel);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--sombra)}
.tarjeta-acceso h1{margin:16px 0 4px;font-size:20px;font-weight:700}
.tarjeta-acceso p{margin:0 0 22px;color:var(--mut);font-size:13px}
.tarjeta-acceso .campo{margin-bottom:13px}
.tarjeta-acceso button{width:100%;margin-top:7px;padding:12px;border-radius:var(--r2);
  background:var(--ink);color:var(--on-ink);font-size:14px;font-weight:650}
.error{margin-top:13px;padding:10px 12px;border-radius:var(--r);font-size:12.5px;
  background:rgba(178,26,26,.1);color:var(--bad);display:none}
.error.on{display:block}

/* --- Aviso flotante -------------------------------------------------------- */
/* El aviso se apartaba con translate(-50%,140%): 140% de SU alto, que en un aviso de
   una linea no basta para sacarlo de la pantalla. Quedaba asomando por abajo como un
   punto negro permanente. Ahora se esconde de verdad, y visibility evita ademas que
   siga capturando clicks mientras esta fuera. */
#aviso{position:fixed;left:50%;bottom:26px;transform:translate(-50%,calc(100% + 40px));
  z-index:90;visibility:hidden;pointer-events:none;
  max-width:min(430px,92vw);padding:12px 17px;border-radius:var(--r2);
  background:var(--ink);color:var(--on-ink);font-size:13px;box-shadow:var(--sombra);
  transition:transform .24s ease,visibility 0s linear .24s}
#aviso.on{transform:translate(-50%,0);visibility:visible;transition-delay:0s}
#aviso b{display:block;margin-bottom:2px}

/* --- Estrecho -------------------------------------------------------------- */
@media(max-width:1080px){
  .ficha{position:fixed;right:0;top:60px;bottom:0;width:min(330px,92vw);z-index:30;
    display:none;box-shadow:var(--sombra)}
  .ficha.on{display:flex}
}
@media(max-width:760px){
  .lateral{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);
    transition:transform .2s;box-shadow:var(--sombra)}
  body.menu-abierto .lateral{transform:none}
  #app.on{grid-template-columns:minmax(0,1fr)}
  .barra,.lienzo{grid-column:1}
  .lista{width:100%}
  body.chat-abierto .lista{display:none}
  .conversacion,.vacio{display:none}
  body.chat-abierto .conversacion{display:flex}
  .hoja{padding:18px 16px}
}
</style>
</head>
<body>

<!-- ===================== ACCESO ===================== -->
<div id="acceso">
  <form class="tarjeta-acceso" id="formAcceso">
    <div class="marca" style="padding:0;border:0">
      <div class="sigla" id="siglaAcceso">DC</div>
      <div><b id="marcaAcceso">D'Carela</b><span id="subAcceso">CRM comercial</span></div>
    </div>
    <h1>Entrar al CRM</h1>
    <p>Acceso solo para el equipo autorizado.</p>
    <div class="campo"><label for="correo">Correo</label>
      <input id="correo" type="email" autocomplete="username" required></div>
    <div class="campo"><label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password" required></div>
    <button type="submit" id="btnEntrar">Entrar</button>
    <div class="error" id="errorAcceso"></div>
  </form>
</div>

<!-- ===================== APLICACION ===================== -->
<div id="app">

  <aside class="lateral">
    <div class="marca">
      <div class="sigla" id="sigla">DC</div>
      <div><b id="marca">CRM</b><span id="submarca"></span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="pie">
      <div class="estado"><span class="punto" id="punto"></span><span id="estadoTexto">Conectando…</span></div>
      <button id="btnSalir">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 17l5-5-5-5M21 12H9M13 21H5a2 2 0 01-2-2V5a2 2 0 012-2h8"/></svg>
        Salir
      </button>
    </div>
  </aside>

  <!-- Sin hamburguesa y sin buscador aqui. Habia dos buscadores en pantalla, y el menu
       estaba entero a la vista igualmente: el boton solo servia para esconderlo. -->
  <header class="barra">
    <div class="titulo" id="tituloVista"></div>
    <div class="der">
      <span class="quien" id="quien"></span>
      <button class="btn-linea" id="btnTema">Modo oscuro</button>
      <a class="btn-linea" href="./manual.html" target="_blank" rel="noopener">Manual</a>
    </div>
  </header>

  <main class="lienzo" id="lienzo"></main>
</div>

<div id="aviso"></div>
<div id="lupa"><img alt="imagen ampliada"></div>

<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, query, where, onSnapshot, doc, setDoc, getDocs }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const CFG = window.CRM_CONFIG || window.DCARELA_CRM_CONFIG || {};
const FB  = window.__DCARELA_FIREBASE_CONFIG || {};
const API = String(CFG.firebaseFunctionsBase || '').replace(/\/$/, '') + '/crmApi';
const NEGOCIO = 'dcarela';

const app  = getApps().length ? getApps()[0] : initializeApp(FB);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- Tema ---------------------------------------------------------------- */
// Se guarda por navegador. El boton dice a donde vas, no donde estas.
function aplicaTema(t){
  document.documentElement.setAttribute('data-tema', t);
  $('btnTema').textContent = t === 'oscuro' ? 'Modo claro' : 'Modo oscuro';
  try { localStorage.setItem('crm2_tema', t); } catch (e) {}
}
try { aplicaTema(localStorage.getItem('crm2_tema') || 'claro'); } catch (e) { aplicaTema('claro'); }
$('btnTema').onclick = () =>
  aplicaTema(document.documentElement.getAttribute('data-tema') === 'oscuro' ? 'claro' : 'oscuro');

/* ---- Aviso --------------------------------------------------------------- */
let avisoT;
function avisa(titulo, detalle){
  const a = $('aviso');
  a.innerHTML = '<b>' + esc(titulo) + '</b>' + (detalle ? esc(detalle) : '');
  a.classList.add('on');
  clearTimeout(avisoT);
  avisoT = setTimeout(() => a.classList.remove('on'), 4200);
}

/* ---- Marca --------------------------------------------------------------- */
const sigla = CFG.logoText || 'DC';
['sigla','siglaAcceso'].forEach(id => { $(id).textContent = sigla; });
$('marca').textContent = CFG.productName || 'CRM';
$('submarca').textContent = CFG.subtitle || '';
$('marcaAcceso').textContent = CFG.brandName || "D'Carela";
$('subAcceso').textContent = CFG.subtitle || '';
document.title = CFG.appTitle || "D'Carela CRM";

/* ---- Menu ---------------------------------------------------------------- */
// Tres entradas siempre a la vista y el resto tras la hamburguesa. Ojo: quien
// esconde es CSS puro (.secundarias sin body.menu-abierto), no un script que
// reordene nodos. Si el modulo no arranca, se ven TODAS. Un menu de mas no es
// tan grave como un menu vacio, que es como quedo el panel anterior.
const ico = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
const VISTAS = [
  { id:'planning',      nombre:'Planificación', fija:true,  icono:ico('<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>') },
  { id:'conversations', nombre:'Conversaciones',fija:true,  icono:ico('<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>') },
  { id:'agenda',        nombre:'Agenda',        fija:true,  icono:ico('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>') },
  { id:'dashboard',     nombre:'Dashboard',     icono:ico('<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>') },
  { id:'funnel',        nombre:'Funnel · Kanban', icono:ico('<path d="M22 3H2l8 9.5V19l4 2v-8.5L22 3z"/>') },
  { id:'prospecting',   nombre:'Prospección',   icono:ico('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 7v8M7 11h8"/>') },
  { id:'poscustomers',  nombre:'Clientes de caja', icono:ico('<path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>') },
  { id:'satisfaccion',  nombre:'Satisfacción',  icono:ico('<path d="M12 17.3l-5.5 3 1-6.1L3 9.8l6.1-.9L12 3.3l2.9 5.6 6.1.9-4.5 4.4 1 6.1z"/>') },
  { id:'plantillas',    nombre:'Plantillas',    icono:ico('<rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 11h6M9 15h4"/>') },
  { id:'ads',           nombre:'Estudio de Anuncios', icono:ico('<path d="M3 11v2a2 2 0 002 2h2l4 4V5L7 9H5a2 2 0 00-2 2z"/><path d="M15 9a4 4 0 010 6"/>') },
  { id:'marketing',     nombre:'Marketing y permisos', icono:ico('<circle cx="12" cy="12" r="10"/><path d="M8.5 12l2.2 2.2 4.8-5.1"/>') },
  { id:'estados',       nombre:'Pack de Estados', icono:ico('<rect x="3" y="3" width="13" height="18" rx="2"/><path d="M19 6v13a2 2 0 01-2 2H8"/>') },
  { id:'reminders',     nombre:'Recordatorios', icono:ico('<path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13 21a2 2 0 01-4 0"/>') },
  { id:'bridge',        nombre:'Conexión WhatsApp', icono:ico('<rect x="8" y="2" width="8" height="20" rx="3"/>') },
  { id:'config',        nombre:'Configuración',  icono:ico('<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>') },
];

function pintaMenu(){
  const enlace = v => '<a href="#' + v.id + '" data-vista="' + v.id + '">' + v.icono
    + '<span>' + esc(v.nombre) + '</span><span class="cuenta" data-cuenta="' + v.id + '" hidden></span></a>';
  $('nav').innerHTML =
    VISTAS.filter(v => v.fija).map(enlace).join('')
    + '<div class="secundarias"><div class="rotulo">Todo lo demás</div>'
    + VISTAS.filter(v => !v.fija).map(enlace).join('') + '</div>';
}
pintaMenu();

// El menu se ve entero siempre. Ya no hay nada que desplegar.
document.body.classList.add('menu-abierto');

/* ---- Enrutado ------------------------------------------------------------ */
let vistaActual = null;
function ve(id){
  if (!VISTAS.some(v => v.id === id)) id = CFG.defaultView || 'conversations';
  vistaActual = id;
  // El montaje va PRIMERO. Al reves, la vista se crea despues de repartir la clase
  // que la hace visible y nace sin ella: sale el marco y por dentro nada. Asi quedo
  // la primera version -- "solo esta la fachada" -- y no lo vi porque el orden se lee
  // natural.
  monta(id);

/* ---- Llamadas al servidor ------------------------------------------------ */
// Todo pasa por crmApi con el token de Firebase. Ninguna escritura sale de aqui
// directa a Firestore: el servidor es quien valida permisos y reglas de negocio.
async function llama(cuerpo){
  const u = auth.currentUser;
  if (!u) return { ok:false, error:'sesión no iniciada' };
  const token = await u.getIdToken();
  try {
    const r = await fetch(API, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + token },
      body: JSON.stringify(cuerpo),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) return { ok:false, error: j?.error || ('error ' + r.status) };
    return { ok:true, ...j };
  } catch (e) { return { ok:false, error: e?.message || String(e) }; }
}

function nombreDe(c){
  return c.customer_name || c.contact_name || ('+' + (c.wa_phone || ''));

function iniciales(n){
  return String(n || '?').replace(/[^\p{L}\p{N} ]/gu,'').trim().split(/\s+/)
    .slice(0,2).map(p => p[0] || '').join('').toUpperCase() || '#';
}
function hora(v){
  if (!v) return '';
  const d = new Date(v), hoy = new Date();
  if (d.toDateString() === hoy.toDateString())
    return d.toLocaleTimeString('es-DO', { hour:'2-digit', minute:'2-digit' });
  const ayer = new Date(hoy); ayer.setDate(hoy.getDate() - 1);
  if (d.toDateString() === ayer.toDateString()) return 'ayer';
  return d.toLocaleDateString('es-DO', { day:'numeric', month:'short' });
}

function escuchaMensajes(idConv){
  if (paraMsgs) { paraMsgs(); paraMsgs = null; }

  // Firestore la rechazan sin el, y el rechazo llega por el callback de error. Sin ese
  // callback la conversacion se quedaba en blanco sin decir nada -- pared beige y cero
  // mensajes, indistinguible de un chat vacio de verdad.
  const q = query(collection(db,'crm_messages'),
    where('business_id','==',NEGOCIO), where('conversation_id','==',idConv));

function cableaChat(c){
  const modo = $('btnModo');
  const pinta = () => { modo.textContent = (sel.mode === 'human' || sel.human_handoff_required)
    ? 'Humano atiende' : 'Bot atiende'; };
  pinta();
  modo.onclick = async () => {
    const nuevo = (sel.mode === 'human') ? 'bot' : 'human';
    modo.disabled = true;
    const r = await llama({ action:'mode', conversation_id: sel.id || sel._id, mode:nuevo });
    modo.disabled = false;
    if (!r.ok) return avisa('No se pudo cambiar', r.error);
    sel.mode = nuevo; pinta();
    avisa(nuevo === 'human' ? 'La atiendes tú' : 'Vuelve al bot');
  };
  const mas = $('mas');
  mas.querySelector('button').onclick = ev => { ev.stopPropagation(); mas.classList.toggle('on'); };
  // Antes se añadia un listener de documento en CADA apertura de conversacion, y cada
  // uno quedaba apuntando a un nodo ya destruido. Tras un rato de trabajo eran cientos.
  // Uno solo, delegado, y busca el menu que exista en ese momento.
  if (!cableaChat.cerrarMenu) {
    cableaChat.cerrarMenu = () => document.getElementById('mas')?.classList.remove('on');
    document.addEventListener('click', cableaChat.cerrarMenu);
  }
  mas.querySelector('.menu').onclick = async ev => {
    const b = ev.target.closest('[data-mas]'); if (!b) return;
    mas.classList.remove('on');
    if (b.dataset.mas === 'encuesta') {
      const r = await llama({ action:'surveyInvite', conversation_id: sel.id || sel._id });
      avisa(r.ok ? 'Encuesta enviada' : 'No se pudo enviar', r.ok ? '' : r.error);
    } else {
      if (!confirm('¿Cerrar esta conversación?')) return;
      const r = await llama({ action:'updateLead', conversation_id: sel.id || sel._id,
        fields:{ status:'closed', lead_status:'cerrado' } });
      avisa(r.ok ? 'Conversación cerrada' : 'No se pudo cerrar', r.ok ? '' : r.error);
    }
  };
  cableaAdjuntos();
  cancelaCita();
  $('citaX').onclick = cancelaCita;
  const caja = $('texto'), env = $('btnEnviar');
  caja.addEventListener('input', () => {
    caja.style.height = 'auto';
    caja.style.height = Math.min(caja.scrollHeight, 150) + 'px';
  });
  caja.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); env.click(); }
  });
  env.onclick = async () => {
    const t = caja.value.trim();
    if (!t && !COLA.length) return;
    env.disabled = true;
    let fallo = null;
    // Los nombres de estas claves NO son opcionales: uploadMetaMedia lee media_b64 y
    // media_filename (firebase-functions/src/index.js:179-183). Con media_base64 la
    // subida devuelve null, outboundPayload cae a la rama de texto, y con una foto mas
    // texto sale SOLO el texto mientras el panel dice "enviado". Un fallo silencioso
    // hacia un cliente real.
    const conv = sel.id || sel._id;
    // El audio no admite pie de foto en la API de WhatsApp: si va texto con una nota de
    // voz, el texto se pierde. Por eso el texto viaja con el ultimo adjunto que SI
    // admite pie, y si no hay ninguno se manda aparte.
    const ultimoConPie = COLA.map(a => a.tipo).lastIndexOf('image') >= 0
      ? COLA.map(a => a.tipo).lastIndexOf('image')
      : COLA.map(a => a.tipo).lastIndexOf('document');
    // Los que ya salieron se quitan de la cola SOBRE LA MARCHA. Si el tercero falla y
    // se reintenta sin esto, los dos primeros se le mandan al cliente otra vez.
    let enviados = 0;
    for (let i = 0; i < COLA.length && !fallo; i++) {
      const a = COLA[i];
      const r = await llama({
        action:'send', conversation_id: conv,
        media_kind: a.tipo, media_b64: a.datos, media_filename: a.nombre, media_mime: a.mime,
        body: (t && i === ultimoConPie) ? t : '',
      });
      if (r.ok) enviados++; else fallo = r.error;
    }
    COLA.splice(0, enviados);
    pintaCola();
    const textoYaFue = t && ultimoConPie >= 0 && !fallo;
    if (!fallo && t && !textoYaFue) {
      const cuerpo = { action:'sendText', conversation_id: conv, body:t };
      // La cita se manda con el wamid del original: asi WhatsApp la enlaza de verdad
      // en el telefono del cliente, en vez de pegar el texto citado a mano.
      if (citando?.wamid) {
        cuerpo.reply_to_wamid = citando.wamid;
        cuerpo.reply_snippet = String(citando.body || '').slice(0, 200);
        cuerpo.reply_sender = citando.direction === 'in' ? 'customer' : 'agent';
      }
      const r = await llama(cuerpo);
      if (!r.ok) fallo = r.error;
    }
    if (!fallo) cancelaCita();
    env.disabled = false;
    // La cola ya se vacio de lo que SI salio, arriba. Aqui solo se limpia el texto.
    if (fallo) return avisa('No se pudo enviar', traduceErrorMeta(fallo));
    caja.value = ''; caja.style.height = 'auto';
  };
}

// "Meta rechazo el envio" no le dice a nadie que hacer. Los motivos que de verdad se
// repiten se explican, y con la salida: casi siempre es la ventana de 24 h cerrada,
// que se resuelve con una plantilla.
function traduceErrorMeta(e){
  const t = String(e || '');
  if (/24|window|re-?engagement|131047/i.test(t))
    return 'Pasaron más de 24 h desde su último mensaje. Solo llega con una plantilla aprobada '
      + '(el botón de plantillas del compositor).';
  if (/131026|not.*whatsapp|no existe/i.test(t)) return 'Ese número no tiene WhatsApp.';
  if (/131049|calidad|quality/i.test(t)) return 'Meta está limitando este número por calidad. '
    + 'Revisa Conexión WhatsApp.';
  if (/excluido|blocked/i.test(t)) return 'Este contacto está excluido de comunicaciones.';
  if (/seguimientos|followup_exhausted/i.test(t)) return 'Lleva dos seguimientos sin responder: '
    + 'quedó como desinteresado y no se le insiste más.';
  if (/transport|reconect/i.test(t)) return 'Meta no está conectada al transporte. Mira Conexión WhatsApp.';
  return t;
}

/* ---- Adjuntos ------------------------------------------------------------ */
// Cola visible antes de enviar: lo que se manda a un cliente real se ve primero.
const COLA = [];
let modoHd = false;
// El tope real lo pone el servidor: uploadMetaMedia rechaza por encima de 16 MB ya
// decodificado (index.html del backend, linea 180). Poner 30 aqui solo conseguiria que
// el archivo se subiera entero para morir alla, asi que se corta antes.
const LIMITE_MB = () => (modoHd ? 15 : 12);

// Comprime cada imagen de la cola con el modo ACTUAL y actualiza su peso. Se llama al
// adjuntar y cada vez que se pulsa HD, para que el tamaño que se ve sea el que va a
// salir de verdad y no el del original.
async function recalculaCola(){
  for (const a of COLA) {
    if (a.tipo !== 'image' || !a.archivo) {
      if (!a.datos && a.archivo) { a.datos = await leeBase64(a.archivo); a.kb = Math.round(a.archivo.size/1024); }
      continue;
    }
    if (a.hd === modoHd && a.datos) continue;      // ya esta en el modo pedido
    const blob = modoHd ? await comprimeHd(a.archivo) : await comprimeNormal(a.archivo);
    a.datos = await leeBase64(blob);
    a.mime = blob.type || a.archivo.type || 'image/jpeg';
    // Si se reencodeo, el nombre tiene que decir jpg: algunos visores se lian con un
    // .png que por dentro es jpeg.
    a.nombre = blob !== a.archivo
      ? String(a.archivo.name || 'imagen').replace(/\.[^.]+$/, '') + '.jpg'
      : a.archivo.name;
    a.kb = Math.round(blob.size / 1024);
    a.hd = modoHd;
  }
  pintaCola();
}

function pintaCola(){
  const c = $('cola'); if (!c) return;
  c.hidden = !COLA.length;
  // Se ve la foto, no su nombre. Lo que va a salir hacia un cliente real hay que
  // poder mirarlo antes: un nombre de archivo no dice si adjuntaste la que querias.
  c.innerHTML = COLA.map((a,i) => {
    const previa = a.tipo === 'image' && a.datos
      ? '<img src="data:' + esc(a.mime || 'image/jpeg') + ';base64,' + a.datos + '" alt="">'
      : '<span class="ico">' + (a.tipo === 'audio' ? '🎙' : a.tipo === 'image' ? '🖼' : '📄') + '</span>';
    const peso = a.kb || (a.datos ? Math.round(a.datos.length * 0.75 / 1024) : 0);
    const marca = a.tipo === 'image' ? (a.hd ? ' · HD' : '') : '';
    return '<span class="pieza">' + previa
      + '<span class="pnom">' + esc(a.nombre)
      +   (peso ? '<i>' + peso + ' KB' + marca + '</i>' : '') + '</span>'
      + '<button data-quita="' + i + '" aria-label="Quitar">×</button></span>';
  }).join('');
}
function leeBase64(f){
  return new Promise((res, rej) => {
    const l = new FileReader();
    l.onload = () => res(String(l.result).split(',')[1] || '');
    l.onerror = () => rej(new Error('no se pudo leer ' + f.name));
    l.readAsDataURL(f);
  });
}
// WhatsApp sube imagenes hasta ~5 MB por id, que es el metodo fiable; por encima cae
// al envio por enlace y falla con #131053. Y recomprime a ~2560 px de lado largo de
// todas formas, asi que mandar mas resolucion no mejora nada y arriesga el envio.
//
// HD = la mejor calidad que WhatsApp entrega DE VERDAD: si el JPEG ya cabe se manda
// intacto, y si no se baja hasta que quepa, siempre como imagen y no como documento.
const TOPE_FIABLE = 4.8 * 1024 * 1024;

function cargaImagen(file){
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('no se pudo abrir la imagen'));
    i.src = URL.createObjectURL(file);
  });
}
async function aJpeg(img, lado, calidad){
  const r = Math.min(1, lado / Math.max(img.width, img.height));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(img.width * r));
  cv.height = Math.max(1, Math.round(img.height * r));
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return new Promise(res => cv.toBlob(res, 'image/jpeg', calidad));
}
async function comprimeHd(file){
  if (!file.type?.startsWith('image/')) return file;
  if (/jpe?g/i.test(file.type) && file.size <= TOPE_FIABLE) return file;  // ya cabe: intacta
  try {
    const img = await cargaImagen(file);
    const mayor = Math.max(img.width, img.height);
    for (const lado of [Math.min(mayor, 2560), 2400, 2200, 2000, 1800, 1600]) {
      if (lado > mayor) continue;
      const b = await aJpeg(img, lado, 0.92);
      if (b && b.size <= TOPE_FIABLE) return b;
    }
    return (await aJpeg(img, 1600, 0.85)) || file;
  } catch (e) { return file; }
}
async function comprimeNormal(file){
  if (!file.type?.startsWith('image/')) return file;
  if (file.size <= 1.8 * 1024 * 1024) return file;
  try { return (await aJpeg(await cargaImagen(file), 1600, 0.85)) || file; }
  catch (e) { return file; }
}

async function encola(files, tipo){
  let fuera = 0;
  for (const f of files) {
    // HEIC no lo acepta WhatsApp por esta via y se rechaza aqui, no a mitad del envio.
    if (tipo === 'image' && /heic|heif/i.test(f.type + f.name)) { fuera++; continue; }
    if (f.size > LIMITE_MB() * 1024 * 1024) { fuera++; continue; }
    // Se guarda el ORIGINAL. La compresion se decide al enviar, no al adjuntar: antes,
    // adjuntar y despues pulsar HD no servia de nada porque la foto ya venia comprimida
    // en calidad normal, y no habia forma de darse cuenta.
    COLA.push({ tipo, nombre: f.name, mime: f.type || 'application/octet-stream', archivo: f });
  }
  await recalculaCola();
  if (fuera) avisa(fuera + (fuera === 1 ? ' archivo se omitió' : ' archivos se omitieron'),
    'HEIC o mayor de ' + LIMITE_MB() + ' MB.');
  pintaCola();
}
function cableaAdjuntos(){
  COLA.length = 0; pintaCola();
  $('adjImg').onclick = () => $('fImg').click();
  $('adjDoc').onclick = () => $('fDoc').click();
  $('fImg').onchange = e => { const f = [...e.target.files]; e.target.value = ''; encola(f, 'image'); };
  $('fDoc').onchange = e => { const f = [...e.target.files]; e.target.value = ''; encola(f, 'document'); };
  $('adjHd').onclick = async () => {
    modoHd = !modoHd;
    $('adjHd').setAttribute('aria-pressed', modoHd ? 'true' : 'false');
    $('adjHd').classList.toggle('on', modoHd);
    // Se recomprime lo que YA esta adjuntado. Antes el interruptor solo valia para las
    // fotos que se adjuntaran despues, sin decirlo en ninguna parte.
    if (COLA.some(a => a.tipo === 'image')) {
      $('adjHd').disabled = true;
      await recalculaCola();
      $('adjHd').disabled = false;
    }
    avisa(modoHd ? 'HD activado' : 'HD desactivado',
      modoHd ? 'Máxima calidad que WhatsApp entrega de verdad.' : 'Calidad normal, más ligeras.');
  };
  $('cola').onclick = ev => {
    const b = ev.target.closest('[data-quita]'); if (!b) return;
    COLA.splice(Number(b.dataset.quita), 1); pintaCola();
  };
  cableaMicrofono();
  $('adjTpl').onclick = abrePlantillas;
  $('adjCombo').onclick = abreCombos;
  $('adjRapida').onclick = abreRapidas;
}

        filters:[{ kind:'eq', field:'id', value:q.id }] });

      filas.splice(Number(borrar.dataset.borrar), 1);
      RAPIDAS = null; pinta();
    }
  };
}

/* ---- Biblioteca de combos ------------------------------------------------ */
// El catalogo no vive en el CRM: se lee de la pagina publica, que es la que el
// negocio actualiza. Asi el precio que se le manda al cliente es exactamente el que
// ve en la web, sin una segunda lista que se quede vieja sin que nadie lo note.
const COMBO_PAGINA = CFG.publicCatalogUrl || 'https://dcarelacompufoto.com/combos.html';
const COMBO_IMG = 'https://dcarelacompufoto.com/combos-img/';
const COMBO_PDF = 'https://dcarelacompufoto.com/pdf/';
const COMBO_CATEGORIAS = { xv:'XV', infantil:'Infantil', graduacion:'Graduación',
  cumpleanos:'Cumpleaños', embarazadas:'Embarazadas' };
const COMBO_PDFS = [
  { cat:'xv', label:'XV', n:5 }, { cat:'infantil', label:'Infantil', n:8 },
  { cat:'graduacion', label:'Graduación', n:3 }, { cat:'cumpleanos', label:'Cumpleaños', n:15 },
  { cat:'embarazadas', label:'Embarazadas', n:8 },
];
let COMBOS = null;

function combosSlug(cat, nombre){
  return cat + '-' + String(nombre || '').toLowerCase().replace(/[^a-z0-9\s-]/g,'')
    .trim().replace(/\s+/g,'-').replace(/-+/g,'-');
}
async function cargaCombos(forzar){
  if (COMBOS && !forzar) return COMBOS;
  const r = await fetch(COMBO_PAGINA, { cache: forzar ? 'reload' : 'default' });
  if (!r.ok) throw new Error('catálogo HTTP ' + r.status);
  const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
  const filas = [];
  for (const sec of doc.querySelectorAll('section.sec[id]')) {
    const cat = String(sec.id || '').toLowerCase();
    if (!COMBO_CATEGORIAS[cat]) continue;
    for (const card of sec.querySelectorAll('article.combo')) {
      const nombre = String(card.querySelector('.cname')?.textContent || '').trim();
      if (!nombre) continue;
      const precioTxt = String(card.querySelector('.cprice b')?.textContent
        || card.querySelector('.cprice')?.textContent || '').trim();
      filas.push({
        cat, catLabel: COMBO_CATEGORIAS[cat], nombre,
        precio: precioTxt ? (precioTxt.startsWith('RD$') ? precioTxt : 'RD$' + precioTxt) : '',
        digital: String(card.querySelector('.cinc-total')?.textContent || '').trim(),
        items: [...card.querySelectorAll('.cinc li')].map(n => String(n.textContent||'').trim()).filter(Boolean),
        incluyeLabel: String(card.querySelector('.incbox .il')?.textContent || 'Incluye').trim(),
        incluye: String(card.querySelector('.incbox .iv')?.textContent || '').trim(),
        imagenCruda: card.querySelector('.ph')?.dataset.bg
          ? new URL(card.querySelector('.ph').dataset.bg, COMBO_PAGINA).href : '',
        tarjeta: COMBO_IMG + combosSlug(cat, nombre) + '.png',
      });
    }
  }
  COMBOS = filas;
  return filas;
}
function textoDeCombo(c){
  const l = ['Te comparto el combo ' + c.nombre + (c.precio ? ' (' + c.precio + ')' : '') + '.'];
  if (c.digital) l.push('', c.digital + '.');
  if (c.items.length) l.push(...c.items.map(i => '• ' + i));
  if (c.incluye) l.push('', c.incluyeLabel + ': ' + c.incluye + '.');
  l.push('', 'Mira todos los combos e imágenes aquí: ' + COMBO_PAGINA);
  l.push('Si te interesa, dime tu fecha tentativa y te confirmamos disponibilidad.');
  return l.join('\n');
}

async function abreCombos(){
  if (!sel) return avisa('Abre una conversación primero');
  abreModal('<div class="mtapa"><b>Combos</b><button class="cerrarm" data-cerrar>×</button></div>'

  pinta();

    if (pdf) return adjuntaPdfCombos(pdf.dataset.pdf, pdf);
    const b = ev.target.closest('[data-combo]');
    if (b) return adjuntaCombo(filas[Number(b.dataset.combo)], b);

async function adjuntaCombo(c, boton){
  if (!c) return;
  const antes = boton.innerHTML;
  boton.disabled = true; boton.textContent = 'Preparando…';
  try {
    // Primero la tarjeta oficial; si no existe se cae a la imagen de la web. Mandar
    // el texto sin foto seria peor que no mandar nada: el combo se vende por la imagen.
    let r = await fetch(c.tarjeta, { cache:'force-cache' });
    let url = c.tarjeta;
    if (!r.ok && c.imagenCruda) { r = await fetch(c.imagenCruda, { cache:'force-cache' }); url = c.imagenCruda; }
    if (!r.ok) throw new Error('imagen HTTP ' + r.status);
    const blob = await r.blob();
    const datos = await new Promise((res, rej) => {
      const l = new FileReader();
      l.onload = () => res(String(l.result).split(',')[1] || '');
      // Sin onerror la promesa no se resuelve NUNCA si la lectura falla, y el envio
      // se queda colgado con el boton deshabilitado y sin decir nada.
      l.onerror = () => rej(new Error('no se pudo leer el archivo'));
      l.readAsDataURL(blob);
    });
    COLA.push({ tipo:'image', mime: blob.type || 'image/png',
      nombre: c.nombre + ' - DCarela.' + (url.endsWith('.webp') ? 'webp' : 'png'), datos });
    pintaCola();
    const caja = $('texto');
    const t = textoDeCombo(c);
    caja.value = caja.value.trim() ? caja.value.trim() + '\n\n' + t : t;
    caja.dispatchEvent(new Event('input'));
    cierraModal();
    avisa(c.nombre, 'Imagen y texto listos. Revisa y pulsa enviar.');
  } catch (e) {
    boton.disabled = false; boton.innerHTML = antes;
    avisa('No se pudo preparar ' + c.nombre, e?.message || String(e));
  }
}

async function adjuntaPdfCombos(cat, boton){
  const p = COMBO_PDFS.find(x => x.cat === cat); if (!p) return;
  const antes = boton.textContent;
  boton.disabled = true; boton.textContent = 'Preparando…';
  try {
    const url = COMBO_PDF + 'combos-' + cat + '.pdf';
    const r = await fetch(url, { cache:'force-cache' });
    if (!r.ok) throw new Error('PDF HTTP ' + r.status);
    const blob = await r.blob();
    const datos = await new Promise((res, rej) => {
      const l = new FileReader();
      l.onload = () => res(String(l.result).split(',')[1] || '');
      // Sin onerror la promesa no se resuelve NUNCA si la lectura falla, y el envio
      // se queda colgado con el boton deshabilitado y sin decir nada.
      l.onerror = () => rej(new Error('no se pudo leer el archivo'));
      l.readAsDataURL(blob);
    });
    COLA.push({ tipo:'document', mime:'application/pdf',
      nombre:'Combos ' + p.label + ' - DCarela.pdf', datos });
    pintaCola();
    const caja = $('texto');
    if (!caja.value.trim()) {
      caja.value = 'Te comparto nuestros combos de ' + p.label + '. Cualquier duda me dices, '
        + 'y si te interesa alguno dime tu fecha tentativa para confirmarte disponibilidad.';
      caja.dispatchEvent(new Event('input'));
    }
    cierraModal();
    avisa('Combos ' + p.label, 'PDF listo. Revisa y pulsa enviar.');
  } catch (e) {
    boton.disabled = false; boton.textContent = antes;
    avisa('No se pudo preparar el PDF', e?.message || String(e));
  }
}

// El servidor NO resuelve template_id: outboundPayload (transport-core.js:73-87) lee

async function cargaPlantillas(forzar){

function pideVariables(t){

  // Se rellena de la ficha lo que se pueda: el agente corrige, no teclea de cero.

      cliente: sel.customer_name || sel.contact_name || '',

      fecha: sel.tentative_date || '',
      categoria: sel.interested_category || '',
    };

    +   '<button class="btn-solido" id="btnEnviarTpl">Enviar plantilla</button></div>');

  $('btnEnviarTpl').onclick = async () => {

/* ---- Audio --------------------------------------------------------------- */
// Portado tal cual del panel anterior, incluida la eleccion de libreria: ver el
// comentario del <script> de opus-recorder arriba. Cambiar esto por MediaRecorder
// hace que los audios "se envien" sin que nadie los reciba.
let grabadora = null, relojT = null, cancelada = false, enviarAlParar = false;

// Aborta y DESCARTA lo grabado. Se llama al cambiar de conversacion: marcar cancelada
// hace que el callback del encoder tire el audio en vez de encolarlo en el chat nuevo.
function abortaGrabacion(){
  if (!grabadora) { paraOndas(); return; }
  cancelada = true; enviarAlParar = false;
  try { grabadora.stop(); } catch (e) {}
  grabadora = null;
  clearInterval(relojT);
  paraOndas();
  const caja = document.getElementById('grabando');
  if (caja) caja.hidden = true;
}
let ctxAudio = null, analizador = null, dibujoT = null, fuenteMic = null;

// Dibuja el nivel REAL del microfono. Una animacion fija mentiria: con el microfono
// silenciado o tomado por otra aplicacion se veria igual de viva, y el audio saldria
// mudo sin que nadie lo notara hasta que el cliente lo dijera.
function arrancaOndas(stream){
  const lienzo = $('ondas'); if (!lienzo || !stream) return;
  try {
    ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
    fuenteMic = ctxAudio.createMediaStreamSource(stream);
    analizador = ctxAudio.createAnalyser();
    analizador.fftSize = 256;
    analizador.smoothingTimeConstant = 0.75;
    fuenteMic.connect(analizador);
  } catch (e) { return; }

  const datos = new Uint8Array(analizador.frequencyBinCount);
  const g = lienzo.getContext('2d');
  const historia = [];
  const pinta = () => {
    const escala = window.devicePixelRatio || 1;
    const an = lienzo.clientWidth, al = lienzo.clientHeight;
    if (lienzo.width !== an * escala) { lienzo.width = an * escala; lienzo.height = al * escala; }
    g.setTransform(escala, 0, 0, escala, 0, 0);
    g.clearRect(0, 0, an, al);

    analizador.getByteTimeDomainData(datos);
    // Valor eficaz de la onda: sube con la voz y se queda casi plano en silencio.
    let suma = 0;
    for (let i = 0; i < datos.length; i++) { const v = (datos[i] - 128) / 128; suma += v * v; }
    historia.push(Math.min(1, Math.sqrt(suma / datos.length) * 3.2));

    const ancho = 3, hueco = 2, cabe = Math.floor(an / (ancho + hueco));
    while (historia.length > cabe) historia.shift();
    g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--mut').trim() || '#667781';
    historia.forEach((n, i) => {
      const h = Math.max(2, n * (al - 4));
      g.fillRect(i * (ancho + hueco), (al - h) / 2, ancho, h);
    });
    dibujoT = requestAnimationFrame(pinta);
  };
  pinta();
}
function paraOndas(){
  if (dibujoT) cancelAnimationFrame(dibujoT);
  dibujoT = null;
  try { fuenteMic?.disconnect(); } catch (e) {}
  // Cerrar el contexto suelta el indicador de microfono del navegador. Dejarlo abierto
  // deja al usuario creyendo que se le sigue escuchando.
  try { ctxAudio?.close(); } catch (e) {}
  ctxAudio = analizador = fuenteMic = null;
}

function cableaMicrofono(){
  const caja = $('grabando'), boton = $('adjMic');
  const parar = () => { caja.hidden = true; clearInterval(relojT); grabadora = null; paraOndas(); };

  boton.onclick = async () => {
    if (!sel || !caja.hidden) return;
    if (!window.Recorder) return avisa('La grabación aún no está lista', 'Espera dos segundos y vuelve a tocar.');
    cancelada = false; enviarAlParar = false;
    try {
      grabadora = new Recorder({
        encoderPath:'https://cdn.jsdelivr.net/npm/opus-recorder@8.0.5/dist/encoderWorker.min.js',
        streamPages:false, numberOfChannels:1,
        encoderSampleRate:24000, encoderBitRate:24000,
        recordingGain:1, monitorGain:0,
      });
      grabadora.ondataavailable = async typed => {
        if (cancelada) return;
        const blob = new Blob([typed], { type:'audio/ogg' });
        // Por debajo de este tamaño no hay voz, solo el ruido de pulsar el boton.
        if (blob.size < 800) return avisa('Grabación demasiado corta', 'Vuelve a intentarlo.');
        const datos = await new Promise((res, rej) => {
          const l = new FileReader();
          l.onload = () => res(String(l.result).split(',')[1] || '');
          // Sin onerror la promesa nunca se resuelve y la nota de voz se pierde en
          // silencio: ni se envia ni se avisa.
          l.onerror = () => rej(new Error('no se pudo leer la grabación'));
          l.readAsDataURL(blob);
        }).catch(e => { avisa('No se pudo preparar el audio', e.message); return null; });
        if (!datos) return;
        COLA.push({ tipo:'audio', nombre:'nota-de-voz.ogg', mime:'audio/ogg', datos,
          kb: Math.round(blob.size / 1024) });
        pintaCola();
        // El envio se dispara AQUI, cuando el audio esta listo de verdad. Y va dentro de
        // try: si algo revienta en esta callback, el error queda fuera de cualquier
        // manejador (viene del worker del encoder) y deja el panel colgado hasta
        // recargar, que es justo lo que paso.
        if (enviarAlParar) {
          enviarAlParar = false;
          try { $('btnEnviar')?.click(); }
          catch (e) { avisa('No se pudo enviar la nota', e?.message || String(e)); }
        }
      };
      await grabadora.start();
    } catch (e) { return avisa('No se pudo grabar', e?.message || String(e)); }

    caja.hidden = false;
    // opus-recorder guarda el stream del microfono; de ahi salen las ondas. Si en
    // alguna version no lo expone, se pide uno propio antes que quedarse sin dibujo.
    if (grabadora.stream) arrancaOndas(grabadora.stream);
    else navigator.mediaDevices?.getUserMedia({ audio:true }).then(arrancaOndas).catch(() => {});
    const desde = Date.now();
    $('reloj').textContent = '0:00';
    relojT = setInterval(() => {
      const s = Math.floor((Date.now() - desde) / 1000);
      $('reloj').textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
      if (s >= 300) $('recEnviar').click();   // tope de cinco minutos
    }, 200);
  };

  $('recEnviar').onclick = () => {
    if (!grabadora) return;
    // El encoder termina en asincrono: se marca el envio y lo dispara ondataavailable
    // cuando el audio esta realmente listo. Enviar aqui mandaria un blob vacio.
    enviarAlParar = true;
    try { grabadora.stop(); } catch (e) {}
    parar();
  };
  $('recCancelar').onclick = () => {
    if (grabadora) { cancelada = true; try { grabadora.stop(); } catch (e) {} }
    parar();
  };
}

let citando = null;

function pintaCita(){
  const barra = $('barraCita'); if (!barra) return;

function cancelaCita(){ citando = null; pintaCita(); }

// Delegado en el documento: los globos se repintan con cada mensaje nuevo, y un
// manejador puesto sobre cada boton se perderia en el siguiente repintado.
document.addEventListener('click', async ev => {
  const b = ev.target.closest('.gaccion');
  if (!b) { document.querySelectorAll('.gmenu').forEach(m => m.remove()); return; }
  ev.stopPropagation();
  document.querySelectorAll('.gmenu').forEach(m => m.remove());
  const globo = b.closest('[data-msg]');
  const m = MSGS.find(x => (x.id || x.wamid) === globo.dataset.msg);
  if (!m) return;
  const menu = document.createElement('div');
  menu.className = 'gmenu';
  menu.innerHTML = '<button data-op="citar">Responder</button>'
    + '<button data-op="reenviar">Reenviar</button>'
    + '<button data-op="copiar">Copiar texto</button>'
    + '<button data-op="borrar" class="peligro">Borrar</button>';
  globo.appendChild(menu);
  menu.onclick = async e2 => {
    e2.stopPropagation();
    const op = e2.target.closest('[data-op]')?.dataset.op;
    menu.remove();
    if (op === 'citar') { citando = m; pintaCita(); $('texto')?.focus(); }
    else if (op === 'copiar') {
      try { await navigator.clipboard.writeText(m.body || ''); avisa('Copiado'); }
      catch (e) { avisa('No se pudo copiar'); }
    }
    else if (op === 'reenviar') abreReenviar(m);
    else if (op === 'borrar') {
      // Borrado blando: WhatsApp no permite quitarlo del telefono del cliente, asi
      // que se dice claro que solo desaparece de aqui.
      if (!confirm('Se ocultará de este panel. El cliente lo seguirá viendo en su WhatsApp.\n\n¿Borrar?')) return;
      const r = await llama({ action:'deleteMsg', message_id: m.id });
      avisa(r.ok ? 'Mensaje ocultado' : 'No se pudo borrar', r.ok ? '' : r.error);
    }
  };
});

function abreReenviar(m){

/* ---- Multimedia dentro del globo ----------------------------------------- */
// El enlace del archivo puede venir en media_url o dentro de attachments, y
// attachments unas veces es objeto, otras un array, y otras una cadena JSON. Se
// normaliza aqui para que el resto no tenga que saberlo.
// Meta no da URL publica del archivo: da un id que hay que canjear con el token del
// negocio, y ese token no puede vivir en el navegador. Se pide a crmMedia con la
// cabecera Authorization y se pinta desde un blob local. La cache evita volver a
// bajarlo cada vez que se repintan los globos, que es en cada mensaje nuevo.
const MEDIOS = new Map();
const BASE_FN = String(CFG.firebaseFunctionsBase || '').replace(/\/$/, '');

async function urlDeMedio(id){
  if (!id) return '';
  if (MEDIOS.has(id)) return MEDIOS.get(id);
  const u = auth.currentUser; if (!u) return '';
  try {
    const token = await u.getIdToken();
    const r = await fetch(BASE_FN + '/crmMedia?id=' + encodeURIComponent(id),
      { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) { MEDIOS.set(id, ''); return ''; }
    const url = URL.createObjectURL(await r.blob());
    MEDIOS.set(id, url);
    return url;
  } catch (e) { MEDIOS.set(id, ''); return ''; }
}

// Se resuelven despues de pintar: el globo sale ya, y la imagen aparece cuando llega.
// Bloquear el pintado hasta tenerlas dejaria el chat en blanco varios segundos.
async function resuelveMedios(){
  const pendientes = [...document.querySelectorAll('[data-medio]')];
  for (const el of pendientes) {
    const id = el.dataset.medio;
    el.removeAttribute('data-medio');
    const url = await urlDeMedio(id);
    if (!url) { el.replaceWith(Object.assign(document.createElement('div'),
      { className:'marchivo', innerHTML:'<b>Archivo</b><span>no se pudo recuperar de WhatsApp</span>' })); continue; }
    el.src = url;
    if (el.tagName === 'A') { el.href = url; el.removeAttribute('hidden'); }
  }
}

function adjuntoDe(m){
  let bruto = m && m.attachments;
  if (typeof bruto === 'string') { try { bruto = JSON.parse(bruto); } catch (e) { bruto = null; } }
  const a = Array.isArray(bruto) ? (bruto.find(x => x && typeof x === 'object') || {})
    : (bruto && typeof bruto === 'object' ? bruto : {});
  return {
    nombre: a.fileName || a.file_name || a.filename || '',
    mime: a.mimeType || a.mime_type || a.mimetype || '',
    peso: Number(a.size || 0) || 0,
    url: (m && m.media_url) || a.url || '',
  };
}
function pesoLegible(n){
  if (!n) return '';
  const u = ['B','KB','MB','GB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0) + ' ' + u[i];
}
function tarjetaArchivo(a, etiqueta){
  const nombre = a.nombre || etiqueta;
  const detalle = [a.mime, pesoLegible(a.peso)].filter(Boolean).join(' · ');
  // Sin url no se inventa un enlace roto: se dice que el archivo no la trae.
  if (!a.url) return '<div class="marchivo"><b>' + esc(nombre) + '</b>'
    + '<span>' + esc(detalle || 'sin enlace disponible') + '</span></div>';
  return '<div class="marchivo"><b>' + esc(nombre) + '</b>'
    + '<span>' + esc(detalle || 'archivo') + '</span>'
    + '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">Abrir</a></div>';
}
function cuerpoMensaje(m){
  const t = String(m.msg_type || 'text').toLowerCase();
  const a = adjuntoDe(m);
  const pie = m.body && !/^\[[a-z]+\]$/i.test(m.body) ? '<div class="mpie">' + esc(m.body) + '</div>' : '';
  const id = m.media_id || '';
  // Si hay url directa se usa; si solo hay id, se marca el hueco y lo rellena
  // resuelveMedios() con lo que devuelva crmMedia.
  const medio = (etiqueta, html) => a.url ? html(esc(a.url))
    : id ? html('', true) : tarjetaArchivo(a, etiqueta);

  if (t === 'image') {
    return medio('Imagen', (src, porId) =>
      '<img class="mmedia" alt="imagen" loading="lazy"'
      + (porId ? ' data-medio="' + esc(id) + '"' : ' src="' + src + '"') + '>')
      + (m.image_description ? '<div class="mpie">' + esc(m.image_description) + '</div>' : '') + pie;
  }
  if (t === 'sticker') {
    return medio('Sticker', (src, porId) =>
      '<img class="msticker" alt="sticker" loading="lazy"'
      + (porId ? ' data-medio="' + esc(id) + '"' : ' src="' + src + '"') + '>');
  }
  if (t === 'video') {
    return medio('Video', (src, porId) =>
      '<video class="mmedia" controls preload="none"'
      + (porId ? ' data-medio="' + esc(id) + '"' : ' src="' + src + '"') + '></video>') + pie;
  }
  if (t === 'audio' || t === 'voice') {
    const trans = m.audio_transcript || m.transcription || '';
    return medio('Nota de voz', (src, porId) =>
      '<audio class="maudio" controls preload="metadata"'
      + (porId ? ' data-medio="' + esc(id) + '"' : ' src="' + src + '"') + '></audio>')
      + (trans ? '<div class="mpie">“' + esc(trans) + '”</div>' : '');
  }
  if (t === 'document' || t === 'file') {
    if (!a.url && id) return '<div class="marchivo"><b>' + esc(a.nombre || m.media_filename || 'Documento') + '</b>'
      + '<span>' + esc(m.media_mime || a.mime || 'archivo') + '</span>'
      + '<a data-medio="' + esc(id) + '" download="' + esc(a.nombre || m.media_filename || 'archivo') + '" hidden>Descargar</a></div>' + pie;
    return tarjetaArchivo(a, 'Archivo') + pie;
  }

  return esc(m.body || '');
}

function pintaMensajes(){
  const cont = $('mensajes'); if (!cont) return;
  const pegado = cont.scrollHeight - cont.scrollTop - cont.clientHeight < 90;
  let dia = '', antes = '';
  // El borrado es blando: el servidor conserva el mensaje y escribe la marca DENTRO de
  // metadata (index.js:1283), no en el primer nivel. Filtrando por m.deleted_at el
  // mensaje seguia a la vista mientras el panel decia "ocultado".
  cont.innerHTML = MSGS.filter(m => !m.metadata?.deleted && !m.metadata?.deleted_at).map(m => {
    const d = new Date(m.created_at);
    const etiquetaDia = d.toLocaleDateString('es-DO', { day:'numeric', month:'short' });
    let cabeza = '';
    if (etiquetaDia !== dia) { dia = etiquetaDia; cabeza = '<div class="dia">' + esc(etiquetaDia) + '</div>'; antes = ''; }
    const sale = m.direction === 'out';
    const emisor = sale ? (m.sender || 'agent') : 'in';
    const primero = emisor !== antes; antes = emisor;
    // El ternario anterior daba ✓ a TODO lo que no fuera leido o entregado, incluido
    // 'failed'. Un mensaje que Meta rechazo se veia igual que uno que salio bien, que
    // es exactamente cuando hace falta enterarse.
    const ticks = sale ? ({
      read: ' <b class="leido">✓✓</b>', delivered: ' ✓✓', sent: ' ✓',
      failed: ' <b class="fallo">⚠</b>',
    }[String(m.delivery_status || 'sent')] ?? ' ·') : '';
    const autor = (sale && m.sender === 'bot' && primero) ? '<div class="autor">Bot</div>' : '';
    const cita = m.reply_snippet
      ? '<div class="cita"><b>' + esc(m.reply_sender === 'customer' ? nombreDe(sel) : 'Tú') + '</b>'
        + esc(String(m.reply_snippet).slice(0,140)) + '</div>' : '';
    return cabeza + '<div class="globo ' + (sale ? 'sale' : 'entra') + ' ' + (primero ? 'primero' : 'seguido') + '"'
      + ' data-msg="' + esc(m.id || m.wamid || '') + '">'
      + '<button class="gaccion" aria-label="Opciones del mensaje">⌄</button>'
      + autor + cita + cuerpoMensaje(m)
      + '<span class="pie-globo">' + esc(d.toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'})) + ticks + '</span>'
      + '</div>';
  }).join('') || '<div style="margin:auto;color:var(--mut);font-size:13px">Sin mensajes todavía.</div>';
  if (pegado) cont.scrollTop = cont.scrollHeight;
  resuelveMedios();
}

function pintaFicha(c){

    + '</div></details>'

  $('ficha').querySelectorAll('[data-c]').forEach(el => {
