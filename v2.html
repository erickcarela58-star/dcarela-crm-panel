<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>D'Carela CRM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💬</text></svg>">
<script src="./crm-config.js"></script>
<script src="./firebase-config.js"></script>
<!-- opus-recorder graba OGG/Opus de verdad por WASM. MediaRecorder no sirve aqui: en
     Chrome produce webm o mp4-con-opus, y WhatsApp Cloud descarta los dos EN SILENCIO
     aunque devuelva un wamid. Es decir, el envio parece correcto y el cliente no
     recibe nada. Esta libreria produce el unico formato que acepta. -->
<script src="https://cdn.jsdelivr.net/npm/opus-recorder@8.0.5/dist/recorder.min.js"></script>
<style>
/* =============================================================================
   D' CARELA CRM — hoja de estilo escrita desde cero.
   No se importa ni una linea del panel anterior. Aquel archivo acumulaba cuatro
   capas de CSS de epocas distintas peleandose por especificidad, y cada arreglo
   ganaba en un sitio y rompia en otro. Aqui hay UNA capa: fichas de color arriba,
   y debajo reglas de una sola clase. Si algo hay que cambiar, se cambia la ficha.
   ============================================================================= */

/* --- Fichas de color. Claro por defecto; oscuro solo redefine las fichas. ---- */
:root{
  --bg:#ffffff;        /* fondo de la aplicacion            */
  --panel:#ffffff;     /* superficies: barra, listas, ficha  */
  --wall:#efeae2;      /* pared de la conversacion           */
  --line:#e9edef;      /* divisor fino                       */
  --line2:#d1d7db;     /* borde de control                   */
  --fg:#111b21;        /* texto principal                    */
  --mut:#667781;       /* texto secundario                   */
  --ink:#111b21;       /* tinta: seleccion, botones solidos  */
  --on-ink:#ffffff;    /* texto sobre tinta                  */
  --in:#ffffff;        /* globo entrante                     */
  --out:#d9fdd3;       /* globo saliente                     */
  --meta:rgba(17,27,33,.45);
  --hover:rgba(11,20,26,.04);
  --ok:#0a8f4d;
  --warn:#b26a00;
  --bad:#b21a1a;
  --sombra:0 12px 34px rgba(11,20,26,.14);
  --alto-barra:60px;   /* alto de la barra superior; la ficha se cuelga de el */
  --r:8px;             /* radio base   */
  --r2:12px;           /* radio grande */
}
:root[data-tema="oscuro"]{
  --bg:#111b21; --panel:#111b21; --wall:#0b141a;
  --line:#222d34; --line2:#2a3942;
  --fg:#e9edef; --mut:#8696a0;
  --ink:#e9edef; --on-ink:#111b21;
  --in:#202c33; --out:#005c4b;
  --meta:rgba(233,237,239,.5);
  --hover:rgba(255,255,255,.045);
  --ok:#25d366; --warn:#ffb454; --bad:#ff8e8e;
  --sombra:0 12px 34px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* --- Estructura ------------------------------------------------------------ */
/* Tres columnas fijas y una elastica. La conversacion es lo que se viene a leer,
   asi que es la que crece; los laterales tienen ancho tope. */
#app{display:none;height:100dvh;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
#app.on{display:grid}
.lateral{grid-row:1/3;width:250px;display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--line)}
header.barra{grid-column:2;display:flex;align-items:center;gap:14px;height:var(--alto-barra);padding:0 16px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.lienzo{grid-column:2;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}

/* --- Lateral --------------------------------------------------------------- */
.marca{display:flex;align-items:center;gap:11px;padding:15px 14px;border-bottom:1px solid var(--line)}
.marca img,.marca .sigla{width:38px;height:38px;border-radius:50%;flex:0 0 auto;object-fit:cover}
.marca .sigla{display:flex;align-items:center;justify-content:center;
  background:var(--ink);color:var(--on-ink);font-weight:700;font-size:13px}
.marca b{display:block;font-size:14px;font-weight:650;line-height:1.2}
.marca span{display:block;font-size:11.5px;color:var(--mut);line-height:1.3;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.marca div{min-width:0}

.nav{flex:1;overflow-y:auto;padding:10px 8px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:2px;
  border-radius:var(--r2);color:var(--fg);text-decoration:none;font-size:13.5px;font-weight:500}
.nav a:hover{background:var(--hover)}
.nav a.on{background:var(--ink);color:var(--on-ink);font-weight:600}
.nav a svg{width:19px;height:19px;flex:0 0 auto;stroke-width:1.9}
.nav a .cuenta{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:9px;
  background:var(--ok);color:#fff}
.nav a.on .cuenta{background:var(--on-ink);color:var(--ink)}
/* Las secundarias solo aparecen con el menu desplegado. La regla vive aqui, en CSS
   puro, sin depender de que ningun script haya corrido antes: si no hay clase, se
   ven todas. Un menu de mas nunca es tan grave como un menu vacio. */
.nav .secundarias{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
/* Las secundarias YA NO dependen de que el cajon este abierto. Iban atadas a
   body.menu-abierto, y como el cajon del movil usa esa misma clase, "ensenar el menu entero"
   y "tener el cajon abierto" eran la misma cosa: por eso el movil nacia con el cajon abierto
   y sin forma de cerrarlo. Se ven siempre, que es lo que se queria. */
.nav .secundarias{display:block}
.nav .rotulo{padding:10px 12px 5px;font-size:9.5px;font-weight:800;letter-spacing:.9px;
  text-transform:uppercase;color:var(--mut)}
/* Los accesos a la bandeja de Meta cuelgan de Conversaciones: sangrados y mas pequenos, para
   que se lean como "lo mismo, pero fuera" y no compitan con las vistas del panel. */
.nav .accesos{margin:0 0 6px}
.nav .accesos a{padding:6px 12px 6px 34px;font-size:12.5px;font-weight:500;color:var(--mut)}
.nav .accesos a svg{width:15px;height:15px}
.nav .accesos a .ext{margin-left:auto;font-size:11px;opacity:.6}

.pie{padding:11px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut)}
.pie .estado{display:flex;align-items:center;gap:7px;margin-bottom:9px;line-height:1.3}
.punto{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.punto.mal{background:var(--bad)}
.pie button{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:8px;
  border:1px solid var(--line2);border-radius:var(--r);color:var(--fg);font-size:12.5px}
.pie button:hover{background:var(--hover)}

/* --- Barra superior -------------------------------------------------------- */
.titulo{flex:1;min-width:0;font-size:15px;font-weight:650;letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* flex-shrink:0 en el grupo derecho: sin eso "Manual" se recortaba contra el borde
   cuando el titulo era largo. */
.barra .der{display:flex;align-items:center;gap:9px;flex:0 0 auto}
/* La hamburguesa NO vuelve al escritorio: alli el menu se ve entero y el boton solo servia
   para esconderlo, que es por lo que se quito. Aparece solo por debajo de 760px, donde el
   menu es un cajon que tapa la aplicacion y sin boton no hay manera de cerrarlo. */
.hamb{display:none;align-items:center;justify-content:center;background:none;
  border:1px solid var(--line2);border-radius:var(--r);cursor:pointer;
  color:var(--fg);flex:0 0 auto;width:36px;height:34px;padding:0}
.hamb:hover{background:var(--hover)}
.velo{display:none;position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.45)}
body.menu-abierto .velo{display:block}
.btn-linea{padding:8px 13px;border:1px solid var(--line2);border-radius:var(--r);
  font-size:12.5px;font-weight:600;color:var(--fg);text-decoration:none;white-space:nowrap;
  flex:0 0 auto}
.btn-linea:hover:not(:disabled){background:var(--hover)}
/* .btn-linea era la unica clase de boton sin estado deshabilitado --las otras tres, .enviar,
   .btn-solido y .tplchip, si lo tenian-- y es justo la de los botones del puente en Canales,
   que se apagan solos cuando el segundo numero no esta en linea. Se pintaban identicos a uno
   vivo: el dueno los pulsaba, no pasaba nada, y la lectura era "el panel esta roto". El
   :hover tambien delataba lo contrario de la verdad, porque seguia iluminando un boton
   muerto; por eso ahora lleva :not(:disabled). */
.btn-linea:disabled{opacity:.45;cursor:not-allowed}
/* El campo del numero a vincular va en la misma fila que los botones del puente, asi que
   comparte alto y borde con ellos: si no, se ve como un injerto. */
/* La x aparece al pasar el cursor. Visible siempre ocuparia sitio en una barra que ya va
   justa, y en tactil no hay hover: por eso en pantallas sin puntero se queda fija. */
.filtro .quitaetq{display:none;margin-left:6px;font-style:normal;opacity:.55;font-size:13px;
  line-height:1}
.filtro:hover .quitaetq,.filtro:focus-within .quitaetq{display:inline}
.filtro .quitaetq:hover{opacity:1;color:var(--bad)}
@media(hover:none){.filtro .quitaetq{display:inline}}
.filtro.masetq{font-weight:700;padding-left:11px;padding-right:11px}
.etqlista{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;
  max-height:340px;overflow-y:auto}
.etqop{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);
  border-radius:var(--r);font-size:12.5px;cursor:pointer}
.etqop:hover{background:var(--hover)}
.etqop span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.etqop b{color:var(--mut);font-weight:600}
.entrada-linea{padding:8px 12px;border:1px solid var(--line2);border-radius:var(--r);
  background:var(--panel);color:var(--fg);font-size:12.5px;width:150px;flex:0 0 auto}
.entrada-linea:focus{outline:2px solid var(--ink);outline-offset:-1px}
.quien{font-size:11.5px;color:var(--mut);max-width:190px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

/* --- Vistas ---------------------------------------------------------------- */
.vista{display:none;height:100%;min-height:0}
.vista.on{display:flex}
.hoja{flex:1;min-width:0;overflow-y:auto;padding:26px 30px}
.hoja h1{margin:0 0 4px;font-size:21px;font-weight:700;letter-spacing:-.3px}
.hoja .bajada{margin:0 0 22px;color:var(--mut);font-size:13px;max-width:640px}

/* --- Agenda mensual ------------------------------------------------------- */
.agbarra{display:flex;align-items:center;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.agbarra strong{min-width:180px;text-align:center;text-transform:capitalize;font-size:15px}
.agbarra .ag-suscribe{margin-left:auto}
/* Aqui vivia un calendario anterior, y sus restos seguian pesando sobre el de ahora:
   .agscroll no aparece ni una vez en el marcado --era el contenedor con scroll lateral que
   justificaba el min-width-- y .agdia hoy significa otra cosa, el grupo de un dia en la
   lista (linea ~3972), no una celda del mes. Las celdas son .agcel.

   Lo que hacian esos restos:
     - .agcal{min-width:760px} forzaba el calendario a 760px dentro de una columna de ~343
       en el telefono. Como ya no habia .agscroll que lo envolviera, se salia por el lado y
       los nombres de los dias no cuadraban con sus columnas. La Agenda abre en vista
       calendario por defecto, asi que era lo primero que se veia.
     - .agdia{min-height:116px;border-right;border-bottom} le ponia 116px de alto minimo y
       dos bordes sueltos a CADA grupo de dia de la lista, y .agdia:nth-child(7n), .fuera y
       .hoy no coinciden ya con nada.

   Se quedan .agnum y .agevento, que el marcado de ahora si usa. El tamano del calendario lo
   fija la regla de mas abajo: repeat(7,1fr) con max-width 820. */
.agsem{padding:9px 8px;border-bottom:1px solid var(--line);color:var(--mut);font-size:10.5px;
  font-weight:750;text-transform:uppercase;letter-spacing:.5px;text-align:center}
.agnum{display:block;margin-bottom:6px;font-size:11.5px;font-weight:700}
.agevento{display:block;width:100%;padding:5px 6px;margin:0 0 4px;border-radius:6px;text-align:left;
  background:var(--ink);color:var(--on-ink);font-size:10.5px;line-height:1.25;overflow:hidden}
.agevento.tentativo{background:var(--hover);color:var(--fg);border:1px dashed var(--line2)}
.agevento b,.agevento small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agevento small{opacity:.72;font-size:9.5px;margin-top:1px}
.agproximas{margin-top:18px;max-width:920px}

/* --- Conversaciones: lista ------------------------------------------------- */
.lista{width:min(330px,30vw);flex:0 0 auto;display:flex;flex-direction:column;
  border-right:1px solid var(--line);background:var(--panel)}
.lista .cabeza{padding:11px 12px 9px;display:flex;flex-direction:column;gap:9px}
.lista .cabeza input,.lista .cabeza select{width:100%;height:36px;padding:0 12px;
  border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);color:var(--fg);outline:0}
/* Una sola fila que se desliza. Envolvia en dos lineas y comia alto de la lista; con
   scroll a secas el ultimo quedaba cortado sin pista de que hubiera mas, asi que se
   arrastra con el raton (ver arrastraFiltros) y se difumina el borde para que se vea
   que sigue. */
.filtros{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none;
  cursor:grab;scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);
  mask-image:linear-gradient(90deg,#000 88%,transparent)}
.filtros::-webkit-scrollbar{display:none}
.filtros.arrastrando{cursor:grabbing;scroll-behavior:auto}
.filtros.arrastrando .filtro{pointer-events:none}
.filtro{padding:5px 11px;border-radius:14px;background:var(--hover);color:var(--mut);
  font-size:12px;font-weight:600;white-space:nowrap;flex:0 0 auto}
.filtro.on{background:var(--ink);color:var(--on-ink)}
.filtro.etqf{border:1px dashed var(--line2);background:transparent}
.filtro.etqf.on{background:var(--ink);border-style:solid}
.etiquetas{display:flex;flex-wrap:wrap;gap:5px}
.etq{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:13px;
  font-size:11.5px;font-weight:600}
.etq.puesta{background:var(--ink);color:var(--on-ink)}
.etq.puesta button{color:inherit;opacity:.65;font-size:13px;line-height:1}
.etq.puesta button:hover{opacity:1}
.etq.sug{border:1px dashed var(--line2);color:var(--mut)}
.etq.sug:hover{border-style:solid;color:var(--fg)}

/* --- Canal ------------------------------------------------------------------ */
/* El distintivo va pegado al avatar, arriba a la derecha: se ve por donde escribe sin
   tener que abrir el chat, que es cuando importa saberlo. */
.avwrap{position:relative;flex:0 0 auto;line-height:0}
img.av{object-fit:cover}
.canalpin{position:absolute;top:-2px;right:-3px;width:17px;height:17px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;line-height:1;color:#fff;
  border:2px solid var(--panel)}
.canalpin svg{width:10px;height:10px;display:block}
/* La casilla solo aparece al pasar por encima o si ya hay algo seleccionado: en reposo
   la lista se lee limpia y no parece un formulario. */
.marcar{width:17px;height:17px;flex:0 0 auto;border:1.5px solid var(--line2);border-radius:5px;
  opacity:0;transition:opacity .12s}
.chat:hover .marcar,.marcar.on{opacity:1}
.marcar.on{background:var(--ink);border-color:var(--ink);position:relative}
.marcar.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;color:var(--on-ink);font-size:11px;font-weight:700}
@media(hover:none){.marcar{opacity:.5}}
.barra-lote{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 12px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--hover);
  font-size:12.5px}
.barra-lote[hidden]{display:none}
.barra-lote .btn-linea{padding:5px 10px;font-size:11.5px}

.canal{max-width:760px;margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r2);
  background:var(--panel);overflow:hidden}
.cabecera-canal{display:flex;align-items:center;gap:12px;padding:14px 16px}
.clogo svg{width:20px;height:20px}
.clogo{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex:0 0 auto}
.cinfo{flex:1;min-width:0}
.cinfo b{display:block;font-size:14px}
.cinfo span{display:block;font-size:11.5px;color:var(--mut);margin-top:1px}
.cdetalle{margin:0;padding:0 16px 14px;font-size:12.5px;line-height:1.5;color:var(--mut)}
.cdetalle code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
  padding:1px 5px;border-radius:4px;background:var(--hover)}
.cacciones{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 14px}
.cacciones a.btn-linea{text-decoration:none;display:inline-flex;align-items:center}
.btn-linea.danger{border-color:var(--bad);color:var(--bad)}
/* La conexion de Instagram y Messenger, plegada mientras estan ocultos: no se quita, se guarda.
   Quien la necesite la abre; quien no, no la ve invitandole a atender por ahi. */
.plegado{max-width:760px;margin-bottom:12px}
.plegado > summary{padding:9px 12px;border:1px dashed var(--line2);border-radius:var(--r2);
  font-size:12.5px;color:var(--mut);cursor:pointer;list-style:revert}
.plegado[open] > summary{margin-bottom:10px}
.codigo{margin-top:10px;padding:18px;border-radius:var(--r2);background:var(--hover);
  text-align:center;font-size:27px;font-weight:700;letter-spacing:5px;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.bridge-tools{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.bridge-code-panel{display:none;width:100%;padding:12px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--hover)}
.bridge-code-panel.on{display:block}
.bridge-code-panel .codigo{margin:0 0 9px;background:var(--panel)}
.bridge-meta{width:100%;margin:0;color:var(--mut);font-size:11.5px;line-height:1.45}
.bridge-meta.mal{color:var(--bad)}
.filtro b{margin-left:5px;opacity:.65;font-weight:700}
.chats{flex:1;overflow-y:auto}

/* Fila de chat: plana, con el divisor arrancando despues del avatar, como WhatsApp.
   Dos lineas de contenido; la etiqueta de etapa comparte linea con el mensaje. */
.chat{display:flex;gap:11px;align-items:center;padding:9px 13px;position:relative;cursor:pointer}
.chat::after{content:"";position:absolute;left:63px;right:0;bottom:0;height:1px;background:var(--line)}
.chat:last-child::after{display:none}
.chat:hover{background:var(--hover)}
.chat.on{background:var(--hover);box-shadow:inset 3px 0 0 var(--ink)}
.av{width:41px;height:41px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;background:var(--line);color:var(--mut);font-size:13px;font-weight:650}
.chat .cuerpo{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;
  align-items:center;column-gap:8px}
.chat .fila1{grid-column:1/3;display:flex;align-items:baseline;gap:8px}
.chat .nom{flex:1;min-width:0;font-size:13.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .hora{font-size:10.5px;color:var(--mut);flex:0 0 auto}
.chat.sinleer .hora{color:var(--ok);font-weight:700}
.chat .prev{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .marcas{display:flex;gap:4px;align-items:center;flex:0 0 auto}
.etiqueta{font-size:8.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  padding:2px 5px;border-radius:4px;background:var(--hover);color:var(--mut);white-space:nowrap}
.etiqueta.ign{background:rgba(178,106,0,.12);color:var(--warn)}
.globito{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--ok);
  color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* --- Conversaciones: chat -------------------------------------------------- */
.conversacion{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--wall)}
.cabecera{display:flex;align-items:center;gap:11px;padding:9px 16px;min-height:60px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.cabecera .quien-chat{flex:1;min-width:0}
.cabecera .quien-chat b{display:block;font-size:15px;font-weight:600}
.cabecera .quien-chat span{display:block;font-size:12px;color:var(--mut)}
/* Distintivo del anuncio de origen: se lee de un vistazo sin robarle sitio al nombre. */
.insig-anuncio{display:inline-block;padding:1px 7px;border-radius:999px;
  background:rgba(37,99,235,.14);color:#60a5fa;font-weight:600;font-size:11px;
  vertical-align:baseline;max-width:210px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.cabecera .modo{padding:8px 14px;border:1px solid var(--line2);border-radius:var(--r2);
  font-size:12.5px;font-weight:600}
.cabecera .modo:hover{background:var(--hover)}
.mas{position:relative}
.mas>button{width:34px;height:34px;border-radius:50%;color:var(--mut);font-size:19px}
.mas>button:hover{background:var(--hover);color:var(--fg)}
.mas .menu{display:none;position:absolute;right:0;top:38px;z-index:40;min-width:190px;padding:5px;
  flex-direction:column;background:var(--panel);border:1px solid var(--line2);
  border-radius:var(--r2);box-shadow:var(--sombra)}
.mas.on .menu{display:flex}
.mas .menu button{padding:9px 11px;border-radius:var(--r);text-align:left;font-size:13px}
.mas .menu button:hover{background:var(--hover)}

.mensajes{flex:1;overflow-y:auto;padding:18px 6.5%;display:flex;flex-direction:column;
  background-color:var(--wall);
  background-image:radial-gradient(circle at 1px 1px,rgba(17,27,33,.055) 1px,transparent 0);
  background-size:22px 22px}
:root[data-tema="oscuro"] .mensajes{background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0)}
.dia{align-self:center;margin:10px 0;padding:4px 11px;border-radius:var(--r);
  background:var(--panel);color:var(--mut);font-size:11px;font-weight:600;box-shadow:var(--sombra)}
.globo{position:relative;max-width:min(66%,600px);margin-top:2px;padding:6px 9px 5px;
  border-radius:var(--r);font-size:13.5px;line-height:1.42;
  box-shadow:0 1px .5px rgba(11,20,26,.13);white-space:pre-wrap;word-break:break-word}
.globo.primero{margin-top:9px}
.globo.entra{align-self:flex-start;background:var(--in);border-radius:0 var(--r) var(--r) var(--r)}
.globo.sale{align-self:flex-end;background:var(--out);border-radius:var(--r) 0 var(--r) var(--r)}
.globo.seguido{border-radius:var(--r)}
.globo.primero.entra::before{content:"";position:absolute;left:-8px;top:0;
  border-top:8px solid var(--in);border-left:8px solid transparent}
.globo.primero.sale::before{content:"";position:absolute;right:-8px;top:0;
  border-top:8px solid var(--out);border-right:8px solid transparent}
.globo .pie-globo{float:right;margin:6px 0 -2px 10px;font-size:10.5px;line-height:1;
  color:var(--meta);white-space:nowrap;user-select:none}
.globo .pie-globo b{font-weight:400}
.globo .pie-globo .leido{color:#53bdeb}
.globo .pie-globo .fallo{color:var(--bad);font-weight:700}
.globo .autor{font-size:11px;font-weight:700;color:var(--ok);margin-bottom:1px}
.mmedia{display:block;max-width:250px;max-height:320px;width:auto;border-radius:6px;
  margin:1px 0 3px;cursor:zoom-in}
video.mmedia{cursor:default}
.msticker{display:block;max-width:130px;max-height:130px;margin:2px 0}
/* El hueco de un archivo guardado que todavia no se ha pedido. Solo se pide lo que entra en
   pantalla (resuelveMedios), y un <img> sin src mide cero: sin este alto, todas las fotos del
   hilo cabrian a la vez en la pantalla y se pedirian de golpe, que es lo que se quiso quitar. */
.mmedia[data-medio]{width:220px;height:160px;background:rgba(11,20,26,.06);color:transparent;font-size:0}
/* Chrome pinta el icono de "imagen rota" en un <img> sin src: mientras espera, un GIF vacio. */
img.mmedia[data-medio]:not([src]),img.msticker[data-medio]:not([src]){
  content:url("data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7")}
.msticker[data-medio]{width:110px;height:110px}
:root[data-tema="oscuro"] .mmedia[data-medio]{background:rgba(255,255,255,.07)}
/* Nota de voz con la forma de WhatsApp. El <audio controls> del navegador ocupa el
   doble, cambia de aspecto en cada navegador y dentro de un globo se ve como un parche. */
.voz{display:flex;align-items:center;gap:9px;width:250px;max-width:100%;margin:2px 0 4px}
.vplay{width:33px;height:33px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;font-size:12px;background:rgba(11,20,26,.09);color:inherit}
:root[data-tema="oscuro"] .vplay{background:rgba(255,255,255,.13)}
.vplay:hover{background:rgba(11,20,26,.16)}
.vonda{flex:1;min-width:0;height:26px;display:flex;align-items:center;gap:2px;
  position:relative;cursor:pointer}
.vonda i{flex:1;min-width:1px;border-radius:1px;background:currentColor;opacity:.32}
.vprog{position:absolute;left:0;top:0;bottom:0;width:0;background:currentColor;
  opacity:.14;border-radius:2px;pointer-events:none}
.vtiempo{font-size:10.5px;color:var(--meta);font-variant-numeric:tabular-nums;flex:0 0 auto}
.vvel{font-size:10px;font-weight:700;padding:2px 6px;border-radius:9px;flex:0 0 auto;
  background:rgba(11,20,26,.09);color:inherit}
:root[data-tema="oscuro"] .vvel{background:rgba(255,255,255,.13)}
.marchivo{display:flex;flex-direction:column;gap:2px;padding:9px 11px;margin:2px 0 4px;
  border-radius:6px;background:rgba(11,20,26,.06)}
:root[data-tema="oscuro"] .marchivo{background:rgba(255,255,255,.07)}
.marchivo b{font-size:13px;word-break:break-word}
.marchivo span{font-size:11px;color:var(--meta)}
.marchivo a{margin-top:4px;font-size:12px;font-weight:650;color:inherit}
.marchivo button{margin-top:5px;align-self:flex-start;font-size:12px;font-weight:650;
  padding:4px 10px;border-radius:9px;background:rgba(11,20,26,.09);color:inherit}
:root[data-tema="oscuro"] .marchivo button{background:rgba(255,255,255,.13)}
/* Miniatura de un archivo que NO esta guardado en la nube. Lo que se ve al instante es la
   vista previa que manda WhatsApp dentro del propio mensaje (unos pocos KB); el archivo
   entero se le pide al telefono solo si alguien pulsa Ver, y se borra a las horas. */
.mthumb{position:relative;display:block;padding:0;border-radius:6px;overflow:hidden;
  max-width:250px;margin:1px 0 3px;cursor:pointer;background:rgba(11,20,26,.06)}
:root[data-tema="oscuro"] .mthumb{background:rgba(255,255,255,.07)}
.mthumb img{display:block;width:100%;max-height:320px;object-fit:cover}
.mthumb .vertag{position:absolute;right:6px;bottom:6px;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:9px;background:rgba(11,20,26,.72);color:#fff}
.mthumb.pidiendo .vertag{opacity:.75}
/* Registro de llamada. Desde el CRM no se atiende una llamada, pero una perdida es tan
   pendiente como un mensaje sin contestar: por eso se pinta, y por eso la perdida se
   distingue de la contestada sin tener que leer. */
.mllamada{display:flex;align-items:center;gap:9px;padding:7px 10px;margin:2px 0 4px;
  border-radius:6px;background:rgba(11,20,26,.06);font-size:12.5px}
:root[data-tema="oscuro"] .mllamada{background:rgba(255,255,255,.07)}
.mllamada svg{width:17px;height:17px;flex:0 0 auto;stroke-width:1.9}
.mllamada.perdida{color:var(--bad)}
.mpie{margin-top:3px;white-space:pre-wrap;word-break:break-word}
/* Botones de accion tal como los ve el cliente: separados del texto por una linea y
   repartidos en filas. No son pulsables desde aqui -- los pulsa el, no nosotros. */
/* Previo de plantilla: se pinta como un globo de WhatsApp a proposito. Lo que hay que
   juzgar antes de enviar no es una ficha tecnica, es el mensaje tal como le va a llegar. */
.tplprevio{margin:2px 0 14px;padding:10px 12px;border-radius:10px;background:var(--out);
  /* var(--fg), no un negro fijo. Con #111b21 el previo era legible en claro y de 2,19:1 en
     oscuro --por debajo del minimo incluso para texto grande--, o sea una mancha verde. Y
     este recuadro es justo el que dice "Asi le va a llegar": es lo unico que hay para revisar
     el mensaje literal antes de gastar una plantilla en un cliente real. El globo de verdad
     del chat (.globo.sale) ya heredaba var(--fg); solo estos dos previos clavaban el color. */
  color:var(--fg);font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;
  border:1px solid rgba(0,0,0,.06)}
.tplprevio .hueco{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad);
  border-radius:3px;padding:0 3px;font-weight:600}
.tplprevio-t{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:var(--mut);margin:10px 0 5px}
.mbotones{margin:6px -9px -6px;display:flex;flex-wrap:wrap}
.mbotones span{flex:1 1 100%;text-align:center;padding:8px 6px;font-size:13.5px;
  color:var(--mut);border-top:1px solid var(--line2)}
/* Aviso de ventana de 24 h. Va pegado al compositor porque es donde se decide escribir.
   El ambar se fija en rgba y no en una ficha de color: tiene que leerse igual en claro y
   en oscuro, y es el unico aviso del panel que avisa de algo que aun se puede evitar. */
.ventana24{margin:0 12px 6px;padding:9px 12px;border-radius:var(--r);display:flex;gap:10px;
  align-items:flex-start;background:rgba(255,180,84,.14);border:1px solid rgba(255,180,84,.45);
  color:var(--fg);font-size:12.5px;line-height:1.45}
.ventana24 b{display:block;margin-bottom:2px;font-size:13px;color:var(--warn)}
.ventana24 button{margin-left:auto;flex:none;align-self:center;background:var(--ink);
  color:var(--on-ink);border:0;border-radius:6px;padding:7px 12px;font:inherit;
  font-weight:600;cursor:pointer;white-space:nowrap}
.ventana24 a.btn-linea{margin-left:auto;flex:none;align-self:center;white-space:nowrap;
  text-decoration:none;padding:7px 12px}
/* Chat de una red oculta: el historial entero se sigue viendo y el compositor no. Lo esconde el
   CSS y no el HTML porque cableaChat cablea esos nodos al abrir; quitarlos rompe la apertura. */
.conversacion.sin-envio .escribir{display:none}
.conversacion.sin-envio .cola{display:none}
/* El boton de opciones solo aparece al pasar por encima: en reposo el hilo se lee
   limpio, como WhatsApp. En tactil no hay hover, asi que ahi se deja siempre. */
.gaccion{position:absolute;top:2px;right:3px;width:20px;height:18px;border-radius:4px;
  color:var(--meta);font-size:13px;line-height:1;opacity:0;transition:opacity .12s;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.06) 30%)}
.globo:hover .gaccion{opacity:1}
@media(hover:none){.gaccion{opacity:.65}}
.gmenu{position:absolute;top:20px;right:2px;z-index:20;min-width:154px;padding:4px;
  display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);
  border-radius:var(--r);box-shadow:var(--sombra)}
.gmenu button{padding:8px 10px;border-radius:5px;text-align:left;font-size:12.5px;color:var(--fg)}
.gmenu button:hover{background:var(--hover)}
.gmenu button.peligro{color:var(--bad)}
.cita{border-left:3px solid var(--ok);border-radius:4px;padding:4px 8px;margin-bottom:4px;
  background:rgba(11,20,26,.06);font-size:12px;color:var(--meta);line-height:1.35}
:root[data-tema="oscuro"] .cita{background:rgba(255,255,255,.07)}
.cita b{display:block;color:var(--ok);font-size:11px}
.barra-cita{display:flex;align-items:center;gap:9px;padding:8px 14px;
  background:var(--panel);border-top:1px solid var(--line)}
.barra-cita[hidden]{display:none}
.barra-cita .cvertical{width:3px;align-self:stretch;border-radius:2px;background:var(--ok)}
.barra-cita .ctexto{flex:1;min-width:0;font-size:12.5px;color:var(--mut);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra-cita button{width:26px;height:26px;border-radius:50%;color:var(--mut);font-size:16px}
.barra-cita button:hover{background:var(--hover)}
/* Lupa: ver una foto de cerca sin salir del chat ni abrir otra pestaña. */
#lupa{display:none;position:fixed;inset:0;z-index:95;background:rgba(11,20,26,.88);
  align-items:center;justify-content:center;padding:26px;cursor:zoom-out}
#lupa.on{display:flex}
#lupa img{max-width:100%;max-height:100%;border-radius:6px}

/* El compositor se envuelve cuando no cabe. Con siete botones de adjuntar en una fila
   rigida y la ventana estrecha, la caja de texto se quedaba con cuarenta pixeles y
   escribia una letra por linea: seguia funcionando, pero era inservible. */
/* Una linea, no una tarjeta. .pie button lleva borde y radio, y gana en especificidad
   a una regla de una sola clase: el numero de version salia dentro de un recuadro como
   si fuera un boton mas del menu. */
/* Buscador de prospectos. Se envuelve: son dos campos y un boton, y en pantalla estrecha
   quedaban aplastados igual que le paso al compositor. */
.buscaprospectos{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;max-width:760px}
.buscaprospectos input{flex:1 1 200px;min-width:150px;padding:10px 13px;border:1px solid var(--line2);
  border-radius:var(--r);background:var(--bg);color:var(--fg);font:inherit;outline:0}
.buscaprospectos input:focus{border-color:var(--ink)}
.buscaprospectos button{flex:0 0 auto}
.pie .version{display:block;width:100%;text-align:left;padding:6px 0 0;border:0;
  border-radius:0;background:none;font:inherit;font-size:10px;line-height:1.35;
  color:var(--mut);cursor:default;opacity:.72;letter-spacing:.1px}
.pie .version:hover{background:none}
.pie .version.hay{color:var(--warn);font-weight:700;opacity:1;cursor:pointer;
  text-decoration:underline;text-underline-offset:2px}
.escribir{display:flex;align-items:flex-end;gap:9px;padding:10px 14px;flex-wrap:wrap;
  background:var(--panel);border-top:1px solid var(--line)}
.escribir textarea{flex:1 1 180px;min-width:150px;min-height:40px;max-height:150px;
  padding:10px 14px;resize:none;
  border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);color:var(--fg);outline:0}
.escribir textarea:focus{border-color:var(--line2)}
.enviar{width:41px;height:41px;border-radius:50%;flex:0 0 auto;background:var(--ink);
  color:var(--on-ink);display:flex;align-items:center;justify-content:center}
.enviar:disabled{opacity:.4;cursor:not-allowed}
.adjuntos{display:flex;gap:2px;align-items:center;flex:0 0 auto;padding-bottom:2px}
.adj{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--mut);font-size:11px;font-weight:800;letter-spacing:.3px}
.adj svg{width:20px;height:20px}
.adj:hover{background:var(--hover);color:var(--fg)}
.adj.hd{border:1.5px solid var(--line2)}
.adj.hd.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.cola{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 11px;background:var(--panel)}
.pieza{display:inline-flex;align-items:center;gap:8px;max-width:250px;padding:5px 8px 5px 5px;
  border:1px solid var(--line2);border-radius:var(--r);font-size:12px}
.pieza img{width:36px;height:36px;object-fit:cover;border-radius:5px;flex:0 0 auto}
.pieza .ico{width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:5px;background:var(--hover);color:var(--mut);flex:0 0 auto}
.pieza .ico svg{width:19px;height:19px}
.pieza .pnom{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pieza .pnom i{display:block;font-style:normal;font-size:10.5px;color:var(--meta)}
.pieza button{color:var(--mut);font-size:15px;line-height:1;flex:0 0 auto}
.pieza button:hover{color:var(--bad)}
/* `display:flex` le gana al atributo hidden (que solo trae display:none de la hoja
   del navegador), asi que la barra de grabacion se veia SIEMPRE: parecia que el panel
   estaba grabando sin parar. La regla de [hidden] va explicita y despues. */
.grabando{display:flex;align-items:center;gap:11px;flex:1;padding:0 4px;font-size:13px;font-weight:600}
.grabando[hidden]{display:none}
.pulso{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:0 0 auto;
  animation:latido 1s infinite}
@keyframes latido{50%{opacity:.25}}
.grabando{flex-wrap:nowrap;overflow:hidden}
.grabando #reloj{font-variant-numeric:tabular-nums;min-width:38px;flex:0 0 auto}
/* Las ondas son el nivel real del microfono, no una animacion. Si el dibujo se queda
   plano es que no esta entrando sonido, y eso hay que poder verlo antes de enviar.
   min-width:0 y width:0 NO son adorno: un <canvas> mide 300x150 por defecto y como
   elemento flex se niega a encogerse por debajo de eso, empujando fuera de la barra los
   botones de Enviar y Cancelar. Justo lo que pasaba. */
#ondas{flex:1 1 0;min-width:0;width:0;height:30px;display:block}
/* Y los botones no se encogen ni se salen pase lo que pase: sin ellos no hay forma de
   mandar la nota que se acaba de grabar. */
.grabando #recEnviar,.grabando #recCancelar{flex:0 0 auto;white-space:nowrap}
/* Mientras se graba se esconde el area de texto y los adjuntos, pero NO el boton de
   enviar: desaparecia justo cuando hacia falta y no habia forma de mandar la nota. */
.escribir:has(.grabando:not([hidden])) textarea{display:none}
.escribir:has(.grabando:not([hidden])) .adjuntos{display:none}
.escribir:has(.grabando:not([hidden])) .enviar{display:none}
.grabando #recEnviar,.grabando #recCancelar{flex:0 0 auto}

.vacio{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;
  color:var(--mut);font-size:13.5px;text-align:center;background:var(--wall)}

/* --- Ficha del lead -------------------------------------------------------- */
/* Sin una sola herramienta suelta. Todo lo operativo se pide por prompt en
   Planificacion; aqui solo se lee el estado y se editan datos. */
.ficha{width:min(320px,26vw);flex:0 0 auto;display:flex;flex-direction:column;
  background:var(--panel);border-left:1px solid var(--line)}
.ficha .cabeza{display:flex;align-items:center;justify-content:space-between;
  padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.ficha .cabeza b{font-size:14px;font-weight:650}
.ficha .cuerpo{flex:1;overflow-y:auto;padding:14px 16px 26px}
.seccion{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
  color:var(--mut);margin:0 0 8px}
.aviso{margin:0 0 16px;font-size:12.5px;line-height:1.5;color:var(--mut)}
.grupo{border:1px solid var(--line);border-radius:var(--r2);margin-bottom:9px;overflow:hidden}
.grupo>summary{list-style:none;cursor:pointer;padding:11px 13px;display:flex;
  align-items:center;justify-content:space-between;gap:8px;
  font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
.grupo>summary::-webkit-details-marker{display:none}
.grupo>summary::after{content:"";width:6px;height:6px;border-right:2px solid var(--mut);
  border-bottom:2px solid var(--mut);transform:rotate(-45deg) translateX(-2px);transition:transform .18s}
.grupo[open]>summary::after{transform:rotate(45deg) translateY(-2px)}
.grupo>summary:hover{background:var(--hover)}
.grupo .dentro{padding:2px 13px 13px}
.grupo .nota{font-size:10.5px;font-weight:600;color:var(--mut);letter-spacing:0;text-transform:none}
.campo{margin-bottom:11px}
.campo label{display:block;font-size:9.5px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.campo input,.campo select,.campo textarea{width:100%;padding:8px 10px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--bg);color:var(--fg);outline:0;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--line2)}
.par{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.dato{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:7px}
.dato .k{font-size:9.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
.dato .v{font-size:13px;margin-top:2px;word-break:break-word}

/* --- Planificacion: el prompt unico ---------------------------------------- */
.prompt{max-width:760px}
.prompt textarea{width:100%;min-height:104px;padding:14px 16px;border:1px solid var(--line2);
  border-radius:var(--r2);background:var(--panel);color:var(--fg);outline:0;resize:vertical;
  font-size:14px;line-height:1.5}
.prompt textarea:focus{border-color:var(--ink)}
.prompt .acciones{display:flex;align-items:center;gap:11px;margin-top:11px;flex-wrap:wrap}
.btn-solido{padding:11px 20px;border-radius:var(--r2);background:var(--ink);color:var(--on-ink);
  font-size:13.5px;font-weight:650}
.btn-solido:disabled{opacity:.45;cursor:not-allowed}
.ejemplos{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.ejemplo{padding:7px 12px;border:1px solid var(--line2);border-radius:16px;
  font-size:12.5px;color:var(--mut);text-align:left}
.ejemplo:hover{background:var(--hover);color:var(--fg)}
.propuesta{margin-top:22px;max-width:760px;border:1px solid var(--line2);
  border-radius:var(--r2);overflow:hidden}
.propuesta .tapa{padding:13px 16px;border-bottom:1px solid var(--line);background:var(--hover)}
.propuesta .tapa b{font-size:13.5px}
.propuesta .cuerpo{padding:15px 16px}
.propuesta .cambio{padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:8px;font-size:13px}
.propuesta .cambio .k{font-size:9.5px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.propuesta .patas{display:flex;gap:9px;padding:13px 16px;border-top:1px solid var(--line)}
/* Los campos exactos que se van a escribir. Quien aprueba tiene derecho a ver el
   cambio literal, no solo el resumen bonito. */
.campos{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.campos span{padding:3px 8px;border-radius:5px;background:var(--hover);
  font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--mut)}
.cargando{display:inline-block;width:15px;height:15px;border:2px solid var(--line2);
  border-top-color:var(--ink);border-radius:50%;animation:giro .7s linear infinite;vertical-align:-3px}
@keyframes giro{to{transform:rotate(360deg)}}

/* --- Asistente de planificación --------------------------------------------- */
/* Dos columnas, como un chat: a la izquierda los hilos de esta persona, a la derecha el hilo
   abierto con su cabecera fija, la conversacion que crece y la caja de escribir abajo. En el
   telefono la columna de hilos es un cajon que se abre desde la cabecera. */
.asistente{flex:1;min-width:0;min-height:0;display:flex;height:100%;overflow:hidden;background:var(--bg);position:relative}
.ahilos{width:280px;flex:0 0 280px;min-height:0;display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--line)}
.ahtapa{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:13px 14px;border-bottom:1px solid var(--line)}
.ahtapa b{font-size:13.5px}
.anuevowrap{position:relative}
.anuevo{padding:7px 13px;font-size:12.5px}
.anuevomenu{position:absolute;right:0;top:calc(100% + 6px);width:250px;z-index:60;display:none;
  background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);box-shadow:var(--sombra);padding:6px}
.anuevomenu.on{display:block;animation:aentra .14s ease-out}
.anuevomenu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:var(--r)}
.anuevomenu button:hover{background:var(--hover)}
.anuevomenu b{display:block;font-size:13px;font-weight:600}
.anuevomenu span{display:block;font-size:11.5px;color:var(--mut);margin-top:1px}
.ahlista{flex:1;min-height:0;overflow-y:auto;padding:4px 6px}
.ahgrupo{font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);padding:12px 8px 5px}
.ahfila{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:var(--r);cursor:pointer}
.ahfila:hover{background:var(--hover)}
.ahfila.on{background:var(--hover);box-shadow:inset 3px 0 0 var(--ink)}
.ahtexto{flex:1;min-width:0}
.ahtexto b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ahtexto span{display:block;font-size:11.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ahcon{font-style:normal;color:var(--fg)}
/* Propuestas esperando a alguien: se ven desde la lista, sin abrir el hilo. */
.ahinsignia{min-width:19px;height:19px;padding:0 5px;border-radius:10px;flex:0 0 auto;background:var(--warn);
  color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ahmenu{width:26px;height:26px;border-radius:6px;flex:0 0 auto;color:var(--mut);opacity:0}
.ahfila:hover .ahmenu,.ahfila.on .ahmenu,.ahmenu:focus{opacity:1}
.ahmenu:hover{background:var(--hover);color:var(--fg)}
@media(hover:none){.ahmenu{opacity:1}}
.ahvacio{padding:18px 10px;font-size:12.5px;color:var(--mut);text-align:center;line-height:1.5}
.ahver{margin:4px 10px 12px;padding:7px;font-size:12px;color:var(--mut);border-radius:var(--r)}
.ahver:hover{background:var(--hover);color:var(--fg)}
.avelo{display:none}

.aconv{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.acab{display:flex;align-items:center;gap:12px;
  padding:12px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.ahamb{display:none}
.atitulo{flex:1;min-width:0}
.atitulo b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.actx{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:3px;font-size:11.5px;color:var(--mut)}
/* El contacto del hilo, con su equis. Quitarlo pasa el hilo a tarea general; ya no depende
   del ultimo chat que se abrio en Conversaciones. */
.achip{display:inline-flex;align-items:center;gap:5px;padding:1px 3px 1px 9px;border:1px solid var(--line2);
  border-radius:14px;color:var(--fg);max-width:100%}
.achip b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.achip button{width:18px;height:18px;border-radius:50%;color:var(--mut);line-height:1;font-size:14px;flex:0 0 auto}
.achip button:hover{background:var(--hover);color:var(--fg)}
.alink{font-size:11.5px;color:var(--fg);text-decoration:underline}
.aacc{display:flex;gap:8px;flex:0 0 auto}

/* El hilo tiene ancho de lectura. Un parrafo de 1200 px obliga a barrer la cabeza de un
   lado a otro en cada linea y se lee peor que uno de 720. */
.ahilo{flex:1;min-height:0;overflow-y:auto;padding:26px 22px 10px;display:flex;flex-direction:column;gap:20px}
.aturno{display:flex;gap:12px;width:100%;max-width:820px;margin:0 auto}
.aturno.yo{justify-content:flex-end}
/* El turno del asistente NO va en globo: ocupa el ancho de lectura con su avatar al lado,
   como un chat moderno. */
.aav{width:28px;height:28px;border-radius:8px;flex:0 0 auto;background:var(--ink);
  color:var(--on-ink);display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:800;letter-spacing:.3px;margin-top:2px}
.aburbuja{min-width:0;font-size:14px;line-height:1.62;word-break:break-word}
.aturno.yo .aburbuja{max-width:min(78%,600px);padding:11px 16px;border-radius:18px 18px 4px 18px;
  background:var(--ink);color:var(--on-ink);white-space:pre-wrap;font-size:13.5px;line-height:1.5}
.aturno.yo.pendiente .aburbuja{opacity:.62}
.aturno.ia .aburbuja{flex:1;white-space:normal;color:var(--fg)}
.aimgs{display:block;margin-top:5px;font-size:11px;opacity:.7}
.atexto p{margin:0 0 9px}
.atexto p:last-child{margin-bottom:0}
.atexto ul,.atexto ol{margin:2px 0 10px;padding-left:20px}
.atexto li{margin:3px 0}
/* Lo que leyo para contestar, en una linea tenue: se sabe de donde sale la respuesta. */
.aconsulta{margin-top:8px;font-size:11.5px;color:var(--mut)}
.apie{display:flex;gap:12px;margin-top:6px}
.apie button{font-size:11.5px;color:var(--mut)}
.apie button:hover{color:var(--fg)}
/* Lo que se hizo al aprobar o descartar: registro del panel, no voz del asistente. */
.asistema{width:100%;max-width:820px;margin:0 auto;padding:2px 12px;font-size:12px;color:var(--mut);text-align:center}
/* Un error es un aviso de sistema con salida, no un globo del asistente: no se guarda en el
   hilo y no se le manda al modelo. */
.aerror{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 14px;
  border:1px solid var(--bad);border-radius:var(--r2);background:rgba(178,26,26,.05);font-size:13px}
.aerror b{color:var(--bad)}
.aerror small{color:var(--mut);font-size:11.5px}
.adetener{margin-left:12px;font-size:12px;color:var(--mut);text-decoration:underline}
.amasviejos{max-width:820px;margin:0 auto;font-size:11.5px;color:var(--mut)}

/* Propuesta: lo unico que cambia datos. Nombre legible, a quien, antes y despues, y botones. */
.apropuesta{margin-top:14px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel);overflow:hidden}
.aptapa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:var(--hover);font-size:13px}
.apestado{flex:0 0 auto;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.apropuesta.pending .apestado{color:var(--warn)}
.apropuesta.applied .apestado{color:var(--ok)}
.apropuesta.failed{border-color:var(--bad)}
.apropuesta.failed .apestado{color:var(--bad)}
.apropuesta.rejected{opacity:.7}
.apcuerpo{padding:11px 14px}
.apquien{font-weight:650;font-size:13px}
.apmotivo{margin:3px 0 8px;font-size:12.5px;color:var(--mut);line-height:1.45}
.acambio{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
.acambio .k{min-width:120px;color:var(--mut)}
.acambio .antes{color:var(--mut);text-decoration:line-through}
.aperror{margin-top:8px;font-size:12px;color:var(--bad)}
.appatas{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.appatas .btn-solido{padding:8px 16px;font-size:13px}
.appatas .btn-linea{padding:7px 12px;font-size:12.5px}
/* El borrador se ve como el globo que va a ser, no como una cita. */
.amsg{position:relative;margin-top:6px;padding:11px 14px;border-radius:10px;background:var(--out);
  color:var(--fg);font-size:13.5px;line-height:1.5;white-space:pre-wrap;border:1px solid rgba(0,0,0,.06)}
/* Copiar el borrador. Este boton SI lleva un negro fijo: va sobre su propio fondo blanco
   translucido, no sobre var(--out). */
.amsg{padding-right:74px}
.acopiar{position:absolute;top:7px;right:7px;padding:3px 9px;border-radius:6px;
  border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.75);color:#111b21;
  font-size:11px;font-weight:600;cursor:pointer}
.acopiar:hover{background:#fff}

.abienvenida{margin:auto;max-width:560px;text-align:center;color:var(--mut)}
.abienvenida b{display:block;font-size:17px;color:var(--fg);margin-bottom:6px}
.abienvenida p{margin:0 0 14px;font-size:13px;line-height:1.5}
/* Estado vacio: tarjetas con lo que hace cada receta, no pildoras de una linea. */
.atarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;
  margin-top:18px;text-align:left}
.atarjeta{padding:13px 15px;border:1px solid var(--line);border-radius:var(--r2);
  background:var(--panel);cursor:pointer;transition:border-color .15s,transform .15s}
.atarjeta:hover{border-color:var(--line2);transform:translateY(-2px)}
.atarjeta b{display:block;font-size:13px;color:var(--fg);margin-bottom:3px}
.atarjeta span{display:block;font-size:11.5px;color:var(--mut);line-height:1.42}

/* Cada turno nuevo entra desde abajo. Solo el ultimo lleva la clase, asi que al repintar el
   hilo entero no se anima toda la conversacion de golpe. */
@keyframes aentra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.aturno.nuevo{animation:aentra .2s ease-out}

/* Puntos de "escribiendo", como en un chat de verdad. */
.apuntos{display:inline-flex;gap:4px;align-items:center;height:18px}
.apuntos i{width:6px;height:6px;border-radius:50%;background:var(--mut);
  animation:asalto 1.05s ease-in-out infinite}
.apuntos i:nth-child(2){animation-delay:.16s}
.apuntos i:nth-child(3){animation-delay:.32s}
@keyframes asalto{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* Menu + de la caja: centrar en una herramienta, adjuntar y asistentes guiados. */
.amas{position:relative}
.amenu{position:absolute;bottom:calc(100% + 8px);left:0;width:330px;max-height:min(62vh,470px);
  overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);
  box-shadow:var(--sombra);padding:6px;z-index:60;display:none}
.amenu.on{display:block;animation:aentra .14s ease-out}
.amenu .agrupo{font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  color:var(--mut);padding:10px 10px 5px}
.amenu button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;
  background:none;border-radius:var(--r);cursor:pointer;font:inherit;color:var(--fg)}
.amenu button:hover{background:var(--hover)}
.amenu button b{display:block;font-size:13px;font-weight:600}
.amenu button span{display:block;font-size:11.5px;color:var(--mut);margin-top:1px;line-height:1.4}
.amenu button.puesto{background:var(--hover)}
.amenu button.puesto b::after{content:' ✓';color:var(--ok)}

/* Etiqueta del foco activo. Va pegada a la caja de escribir porque cambia lo que pasa al
   escribir, no es un ajuste de otra pantalla. */
.afoco{display:flex;align-items:center;gap:8px;margin:0 22px 8px;padding:7px 10px;
  border:1px solid var(--line2);border-radius:20px;width:fit-content;font-size:12px;
  background:var(--hover)}
.afoco b{font-weight:700}
.afoco button{border:0;background:none;cursor:pointer;font-size:15px;line-height:1;
  color:var(--mut);padding:0 2px}
.afoco button:hover{color:var(--fg)}
.acola{display:flex;flex-wrap:wrap;gap:6px;padding:0 22px 8px}
/* display:flex le gana al atributo hidden: sin esto, sin foco ni adjuntos quedaba una pildora
   vacia encima de la caja de escribir. */
.afoco[hidden],.acola[hidden]{display:none}
.pdoc{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  background:var(--hover);font-size:9.5px;font-weight:800;color:var(--mut)}
.aentrada{display:flex;flex-shrink:0;align-items:flex-end;gap:9px;padding:12px 22px 18px;
  border-top:1px solid var(--line);background:var(--panel)}
.aentrada textarea{flex:1;min-width:0;min-height:42px;max-height:160px;padding:11px 15px;resize:none;
  border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);color:var(--fg);outline:0}
.aentrada textarea:focus{border-color:var(--line2)}

/* Selector de contacto: busca en las conversaciones que ya estan en memoria y en vivo. */
.aconlista{display:flex;flex-direction:column;gap:2px;max-height:52vh;overflow-y:auto}
.aconfila{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:var(--r);text-align:left}
.aconfila:hover{background:var(--hover)}
.aconfila .av{width:34px;height:34px;font-size:12px}
.aconfila b{display:block;font-size:13px}
.aconfila i{display:block;font-style:normal;font-size:11.5px;color:var(--mut)}
.achequeo{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:13px}

@media (max-width:760px){
  /* Cajon: fuera de la pantalla hasta que se pide, y nunca mas ancho que el telefono. */
  .ahilos{position:absolute;left:0;top:0;bottom:0;z-index:40;width:min(300px,86vw);flex-basis:auto;
    transform:translateX(-102%);transition:transform .2s ease}
  /* La sombra solo con el cajon abierto: cerrado asomaba por el borde izquierdo. */
  .asistente.hilos-on .ahilos{transform:none;box-shadow:var(--sombra)}
  .asistente.hilos-on .avelo{display:block;position:absolute;inset:0;z-index:35;background:rgba(11,20,26,.35)}
  .ahamb{display:flex}
  .acab{padding:10px 12px;gap:8px;flex-wrap:wrap}
  /* Titulo y contacto ocupan la primera fila; los botones bajan a la segunda. Si no, en 400 px
     el contacto del hilo quedaba reducido a "Sobre: Juan …". */
  .atitulo{flex:1 1 calc(100% - 52px)}
  .aacc{margin-left:44px}
  .acambio .k{min-width:92px}
  .acab .btn-linea{padding:6px 9px;font-size:12px}
  .ahilo{padding:18px 12px 8px}
  .aentrada{padding:10px 12px 14px}
  .afoco{margin:0 12px 8px}
  .acola{padding:0 12px 8px}
  .amenu{width:min(330px,calc(100vw - 32px))}
}
@media (prefers-reduced-motion:reduce){
  .aturno.nuevo,.amenu.on,.anuevomenu.on{animation:none}
  .ahilos{transition:none}
  .atarjeta{transition:none}
}

/* --- Modal ----------------------------------------------------------------- */
.modal{display:none;position:fixed;inset:0;z-index:80;background:rgba(11,20,26,.55);
  align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .caja{width:100%;max-width:470px;max-height:84vh;display:flex;flex-direction:column;
  background:var(--panel);border-radius:var(--r2);box-shadow:var(--sombra);overflow:hidden}
.mtapa{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:15px 18px;border-bottom:1px solid var(--line);font-size:14px}
.cerrarm{color:var(--mut);font-size:21px;line-height:1}
.cerrarm:hover{color:var(--fg)}
.mcuerpo{flex:1;overflow-y:auto;padding:15px 18px}
.mpatas{display:flex;justify-content:flex-end;gap:9px;padding:13px 18px;border-top:1px solid var(--line)}
.tpl{display:block;width:100%;text-align:left;padding:11px 13px;margin-bottom:8px;
  border:1px solid var(--line);border-radius:var(--r2)}
.tpl:hover{background:var(--hover);border-color:var(--line2)}
.tpl b{display:block;font-size:13.5px}
.tplmeta{display:block;margin-top:2px;font-size:11px;color:var(--mut)}
.tplprev{display:block;margin-top:6px;font-size:12px;color:var(--mut);line-height:1.4;
  padding-top:6px;border-top:1px dashed var(--line)}
.pdfs{display:flex;flex-wrap:wrap;gap:6px}
.tplchip{padding:7px 12px;border:1px solid var(--line2);border-radius:16px;font-size:12.5px;font-weight:600}
.tplchip:hover{background:var(--hover)}
.tplchip:disabled{opacity:.5}
.rapida{display:flex;align-items:stretch;gap:6px;margin-bottom:7px}
.rapida>button:first-child{flex:1;min-width:0;text-align:left;padding:10px 12px;
  border:1px solid var(--line);border-radius:var(--r2)}
.rapida>button:first-child:hover{background:var(--hover);border-color:var(--line2)}
.rapida b{display:block;font-size:13px}
.rapida span{display:block;margin-top:2px;font-size:11.5px;color:var(--mut);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rx{width:32px;border:1px solid var(--line);border-radius:var(--r);color:var(--mut);font-size:16px;flex:0 0 auto}
.rx:hover{color:var(--bad);border-color:var(--bad)}
.estados{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:940px}
.estado{display:flex;flex-direction:column;gap:7px}
.estado img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:var(--r);border:1px solid var(--line)}
.estado a{text-align:center;text-decoration:none;font-size:12px}

/* --- Tabla ----------------------------------------------------------------- */
.tabla{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;max-width:900px}
.fila{display:grid;grid-template-columns:minmax(0,2fr) 1fr 1fr auto;gap:12px;
  align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
.fila:last-child{border-bottom:0}
.fila.cabecera{background:var(--hover);font-size:9.5px;font-weight:800;
  letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.fila small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.chip{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.4px;
  padding:3px 7px;border-radius:5px;background:var(--hover);color:var(--mut)}
.chip.ok{background:rgba(10,143,77,.13);color:var(--ok)}
.chip.mal{background:rgba(178,26,26,.11);color:var(--bad)}
.chip.medio{background:rgba(178,106,0,.12);color:var(--warn)}
.interruptor{padding:4px 12px;border:1px solid var(--line2);border-radius:11px;
  font-size:11.5px;font-weight:700;color:var(--mut)}
.interruptor.on{background:var(--ok);border-color:var(--ok);color:#fff}
/* La lista de destinatarios se enseña entera y con scroll propio: si no cabe, es
   preferible desplazarse que enviar a ciegas a gente que no se ha visto. */
.destinos{display:flex;flex-direction:column;gap:3px;max-height:230px;overflow-y:auto;
  margin-top:5px;font-size:12px;color:var(--mut)}
.destinos span{padding:3px 0;border-bottom:1px solid var(--line)}
.destinos span:last-child{border-bottom:0}

/* --- Agenda ------------------------------------------------------------------ */
.agbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.agtog{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.agtog button{padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--mut)}
.agtog button.on{background:var(--ink);color:var(--on-ink)}
.agfil{display:flex;gap:6px}
.agnav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.agnav b{flex:1;font-size:14px;text-transform:capitalize}
.agnav .btn-linea{padding:6px 12px}
.agsem{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:820px;margin-bottom:5px}
.agsem span{text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.6px;
  text-transform:uppercase;color:var(--mut)}
.agcal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:820px}
.agcel{min-height:62px;padding:6px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel);display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.agcel:hover{border-color:var(--line2);background:var(--hover)}
.agcel.fuera{opacity:.35}
.agcel.hoy{border-color:var(--ink)}
.agcel.sel{background:var(--ink)}
.agcel.sel .agnum{color:var(--on-ink)}
.agnum{font-size:12px;font-weight:600}
.agpuntos{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.agpuntos i{width:6px;height:6px;border-radius:50%}
.agpuntos i.firme{background:var(--ok)}
.agpuntos i.tent{background:var(--warn)}
/* Azul de Google: en el mes hay que distinguir de un vistazo lo que es del CRM --y se puede
   abrir-- de lo que solo esta apuntado en el calendario del dueño. */
.agpuntos i.gcal{background:#1a73e8}
.agpuntos em{font-style:normal;font-size:9px;color:var(--mut)}
.agpanel{margin-top:18px;max-width:820px}
.agdia{margin-bottom:18px;max-width:820px}
.agdcab{display:flex;justify-content:space-between;align-items:baseline;padding:0 0 7px;
  border-bottom:1px solid var(--line);margin-bottom:7px;font-size:12.5px;font-weight:650;
  text-transform:capitalize}
.agdcab b{font-size:11px;color:var(--mut)}
.agcita{display:flex;align-items:center;gap:12px;width:100%;padding:9px 11px;margin-bottom:5px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);cursor:pointer;text-align:left}
.agcita:hover{border-color:var(--line2);background:var(--hover)}
/* Un evento de Google no abre ninguna conversacion: no se puede pinchar y se dice con el
   cursor, no solo con el color. */
.agcita.aggoogle{border-left:3px solid #1a73e8;cursor:default}
.chip.gcal{background:rgba(26,115,232,.12);color:#1a73e8}
.agestado{font-size:11.5px;color:var(--mut)}
.agh{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:42px}
.agn{flex:1;min-width:0}
.agn b{display:block;font-size:13px}
.agn small{display:block;font-size:11px;color:var(--mut);margin-top:1px}

/* --- Configuración ----------------------------------------------------------- */
.cfggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;
  max-width:1180px;align-items:start}
.cfgc{padding:16px 18px 18px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel)}
.cfgc h3{margin:0 0 6px;font-size:13.5px;font-weight:650}
.cfgnota{margin:0 0 12px;font-size:12px;line-height:1.5;color:var(--mut)}
.cfgc .dato{margin-bottom:6px}
/* El interruptor lleva su explicacion al lado: uno suelto no dice que pasa al
   encenderlo, y estos cambian lo que se le manda a clientes reales. */
.cfgsw{display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:8px 0}
.cfgsw input{width:17px;height:17px;flex:0 0 auto;margin-top:2px;accent-color:var(--ink)}
.cfgsw b{display:block;font-size:13px;font-weight:600}
.cfgsw i{display:block;font-style:normal;font-size:11.5px;color:var(--mut);margin-top:2px}
.cfgc .tabla{max-width:none}
.cfgc select{padding:5px 7px;border:1px solid var(--line);border-radius:6px;
  background:var(--bg);color:var(--fg);font-size:12px}

/* --- Kanban ---------------------------------------------------------------- */
.kanban{display:flex;gap:11px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.columna{flex:0 0 246px;display:flex;flex-direction:column;max-height:calc(100dvh - 230px);
  border:1px solid var(--line);border-radius:var(--r2);background:var(--panel)}
.columna.encima{border-color:var(--ink);background:var(--hover)}
.ctitulo{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;
  border-bottom:1px solid var(--line);font-size:10px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;color:var(--mut)}
.ctitulo b{font-size:11px;color:var(--fg)}
.ccuerpo{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;min-height:70px}
.ktarjeta{padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--bg);cursor:grab}
.ktarjeta:active{cursor:grabbing}
.ktarjeta.moviendo{opacity:.4}
.ktarjeta b{display:block;font-size:13px;font-weight:600}
.ktarjeta span{display:block;font-size:11.5px;color:var(--mut);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ktarjeta i{display:block;font-style:normal;font-size:10.5px;color:var(--meta);margin-top:3px}
.kmas{padding:7px;text-align:center;font-size:11.5px;color:var(--mut)}

/* --- Dashboard ------------------------------------------------------------- */
.cifras{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:11px;max-width:1180px}
.cifra{padding:15px 16px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);
  text-align:left;width:100%}
.cifra:hover{border-color:var(--line2);background:var(--hover)}
/* Solo se marcan las cifras que piden accion. Si todo grita, nada grita. */
.cifra.ojo b{color:var(--warn)}
.cifra.mal b{color:var(--bad)}
.cifra.bien b{color:var(--ok)}

/* --- Graficas --------------------------------------------------------------- */
.tablero{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;
  max-width:1180px;margin-top:22px}
.pgraf{padding:16px 18px 18px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel)}
.pgcab{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.pgcab b{font-size:13.5px}
.pgcab span{font-size:11px;color:var(--mut)}
.graf{width:100%;height:170px;overflow:visible}
.gguia{stroke:var(--line);stroke-width:1}
.gnum{fill:var(--mut);font-size:9px}
.garea{fill:var(--ink);opacity:.08}
.glinea{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.gpunto{fill:var(--panel);stroke:var(--ink);stroke-width:1.6}
.ganillo{fill:none;stroke-width:16;transform:rotate(-90deg);transform-origin:70px 70px}
.gtot{fill:var(--fg);font-size:21px;font-weight:700}
.anillo{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.anillo svg{width:140px;height:140px;flex:0 0 auto}
.leyenda{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mut)}
.leyenda span{display:flex;align-items:center;gap:7px}
.leyenda i{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.leyenda b{color:var(--fg)}
.embudo{display:flex;flex-direction:column;gap:9px}
.epaso{display:grid;grid-template-columns:118px minmax(0,1fr) 74px;gap:10px;align-items:center;font-size:12.5px}
.epaso .en{color:var(--mut);text-transform:capitalize}
.epaso .eb{height:20px;border-radius:5px;background:var(--hover);overflow:hidden}
.epaso .eb i{display:block;height:100%;background:var(--ink);opacity:.85}
.epaso .ev{text-align:right;font-weight:650}
.epaso .ev em{font-style:normal;font-weight:500;color:var(--mut);font-size:11px}
.cifra b{display:block;font-size:27px;font-weight:700;line-height:1.1;letter-spacing:-.5px}
.cifra span{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.cifra i{display:block;font-style:normal;font-size:10.5px;color:var(--meta);margin-top:2px}
.barras{display:flex;flex-direction:column;gap:7px;max-width:560px}
.barra{display:grid;grid-template-columns:132px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:12.5px}
.barra .be{color:var(--mut);text-transform:capitalize}
.barra .bp{height:8px;border-radius:4px;background:var(--hover);overflow:hidden}
.barra .bp i{display:block;height:100%;background:var(--ink);border-radius:4px}
.barra .bn{text-align:right;font-weight:650}

/* --- Login ----------------------------------------------------------------- */
#acceso{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:22px}
#acceso.oculto{display:none}
.tarjeta-acceso{width:100%;max-width:376px;padding:32px 30px;background:var(--panel);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--sombra)}
.tarjeta-acceso h1{margin:16px 0 4px;font-size:20px;font-weight:700}
.tarjeta-acceso p{margin:0 0 22px;color:var(--mut);font-size:13px}
.tarjeta-acceso .campo{margin-bottom:13px}
.tarjeta-acceso button{width:100%;margin-top:7px;padding:12px;border-radius:var(--r2);
  background:var(--ink);color:var(--on-ink);font-size:14px;font-weight:650}
.error{margin-top:13px;padding:10px 12px;border-radius:var(--r);font-size:12.5px;
  background:rgba(178,26,26,.1);color:var(--bad);display:none}
.error.on{display:block}

/* --- Aviso flotante -------------------------------------------------------- */
/* El aviso se apartaba con translate(-50%,140%): 140% de SU alto, que en un aviso de
   una linea no basta para sacarlo de la pantalla. Quedaba asomando por abajo como un
   punto negro permanente. Ahora se esconde de verdad, y visibility evita ademas que
   siga capturando clicks mientras esta fuera. */
#aviso{position:fixed;left:50%;bottom:26px;transform:translate(-50%,calc(100% + 40px));
  z-index:90;visibility:hidden;pointer-events:none;
  max-width:min(430px,92vw);padding:12px 17px;border-radius:var(--r2);
  background:var(--ink);color:var(--on-ink);font-size:13px;box-shadow:var(--sombra);
  transition:transform .24s ease,visibility 0s linear .24s}
#aviso.on{transform:translate(-50%,0);visibility:visible;transition-delay:0s}
#aviso b{display:block;margin-bottom:2px}

/* --- Estrecho -------------------------------------------------------------- */
@media(max-width:1080px){
  /* La ficha se cuelga de la altura REAL de la barra, no de un 60 escrito a mano. Al
     hacer que la barra crezca a dos filas en el telefono, este 60px la dejaba metida
     30px por debajo del borde: la cabecera del contacto quedaba tapada por la barra. */
  .ficha{position:fixed;right:0;top:var(--alto-barra);bottom:0;width:min(330px,92vw);z-index:30;
    display:none;box-shadow:var(--sombra)}
  .ficha.on{display:flex}
}
@media(max-width:760px){
  .lateral{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);
    transition:transform .2s;box-shadow:var(--sombra)}
  body.menu-abierto .lateral{transform:none}
  .hamb{display:flex}
  /* La barra crece en vez de recortarse. A 375px no caben hamburguesa, titulo, "Modo
     oscuro" y "Manual" en una fila, y como .der lleva flex:0 0 auto a proposito --para que
     "Manual" no se recorte cuando el titulo es largo-- lo que sobra no encogia: se salia de
     la pantalla, y esos dos botones no se podian ni leer ni pulsar. Ya pasaba antes de tocar
     el menu. */
  /* 'header.barra', no '.barra' a secas: esa clase la usa TAMBIEN cada barra de nota del
     panel de colaboradores (v2.html:3551 y 5248, dentro de .barras). Sin acotar, estas
     reglas les cambiaban el hueco y el relleno, y la de mas abajo les rompia la rejilla
     de tres columnas. */
  header.barra{gap:8px;padding:0 10px;min-width:0}
  header.barra .quien{display:none}
  header.barra .der{margin-left:auto;min-width:0}
  /* Estas nueve reglas son el movil de toda la vida: una sola columna, la lista a pantalla
     completa y el chat encima al abrirlo. Estuvieron un dia dentro del bloque de 430px por
     una llave que cerre de mas al anadirlo, asi que entre 431 y 760 --tablets pequenas y
     telefonos grandes en horizontal-- el panel se quedaba con la rejilla de escritorio y
     abrir un chat no ocultaba la lista. */
  #app.on{grid-template-columns:minmax(0,1fr)}
  header.barra,.lienzo{grid-column:1}
  .lista{width:100%}
  body.chat-abierto .lista{display:none}
  .conversacion,.vacio{display:none}
  body.chat-abierto .conversacion{display:flex}
  .hoja{padding:18px 16px}
  .agbarra strong{order:-1;width:100%;text-align:left}
  .agbarra .ag-suscribe{margin-left:0}
}
@media(max-width:430px){
  /* Solo aqui, y solo la barra. Con grid en vez de flex: envolver con flex no basta porque
     el titulo lleva flex:1 --base 0-- asi que la suma de las bases siempre cabe y la fila
     nunca se parte; lo que se salia era el reparto del sobrante, con la fila ya cerrada. En
     grid la segunda fila esta declarada, no deducida. */
  /* Dos filas, asi que la barra mide mas: se dice aqui para que la ficha la siga. */
  :root{--alto-barra:90px}
  header.barra{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;
    height:var(--alto-barra);padding:8px 10px;row-gap:8px;column-gap:8px}
  header.barra .der{grid-column:1/-1;justify-content:flex-end;margin-left:0}
}
</style>
</head>
<body>

<!-- ===================== ACCESO ===================== -->
<div id="acceso">
  <form class="tarjeta-acceso" id="formAcceso">
    <div class="marca" style="padding:0;border:0">
      <div class="sigla" id="siglaAcceso">DC</div>
      <div><b id="marcaAcceso">D'Carela</b><span id="subAcceso">CRM comercial</span></div>
    </div>
    <h1>Entrar al CRM</h1>
    <p>Acceso solo para el equipo autorizado.</p>
    <div class="campo"><label for="correo">Correo</label>
      <input id="correo" type="email" autocomplete="username" required></div>
    <div class="campo"><label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password" required></div>
    <button type="submit" id="btnEntrar">Entrar</button>
    <div class="error" id="errorAcceso"></div>
  </form>
</div>

<!-- ===================== APLICACION ===================== -->
<div id="app">

  <aside class="lateral">
    <div class="marca">
      <div class="sigla" id="sigla">DC</div>
      <div><b id="marca">CRM</b><span id="submarca"></span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="pie">
      <div class="estado"><span class="punto" id="punto"></span><span id="estadoTexto">Conectando…</span></div>
      <button class="version" id="version" hidden></button>
      <button id="btnSalir">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 17l5-5-5-5M21 12H9M13 21H5a2 2 0 01-2-2V5a2 2 0 012-2h8"/></svg>
        Salir
      </button>
    </div>
  </aside>

  <!-- Sin hamburguesa y sin buscador aqui. Habia dos buscadores en pantalla, y el menu
       estaba entero a la vista igualmente: el boton solo servia para esconderlo. -->
  <div class="velo" id="velo"></div>

  <header class="barra">
    <button class="hamb" id="hamb" aria-label="Abrir menu" aria-expanded="false">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="titulo" id="tituloVista"></div>
    <div class="der">
      <span class="quien" id="quien"></span>
      <button class="btn-linea" id="btnAvisos" hidden>Activar avisos</button>
      <button class="btn-linea" id="btnTema">Modo oscuro</button>
      <a class="btn-linea" href="./manual-v2.html" target="_blank" rel="noopener">Manual</a>
    </div>
  </header>

  <main class="lienzo" id="lienzo"></main>
</div>

<div id="aviso"></div>
<div id="lupa"><img alt="imagen ampliada"></div>

<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, query, where, onSnapshot, doc, setDoc, getDocs, limit, orderBy }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const CFG = window.CRM_CONFIG || window.DCARELA_CRM_CONFIG || {};
const FB  = window.__DCARELA_FIREBASE_CONFIG || {};
const API = String(CFG.firebaseFunctionsBase || '').replace(/\/$/, '') + '/crmApi';
const NEGOCIO = 'dcarela';

const app  = getApps().length ? getApps()[0] : initializeApp(FB);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- Tema ---------------------------------------------------------------- */
// Se guarda por navegador. El boton dice a donde vas, no donde estas.
function aplicaTema(t){
  document.documentElement.setAttribute('data-tema', t);
  $('btnTema').textContent = t === 'oscuro' ? 'Modo claro' : 'Modo oscuro';
  try { localStorage.setItem('crm2_tema', t); } catch (e) {}
}
try { aplicaTema(localStorage.getItem('crm2_tema') || 'claro'); } catch (e) { aplicaTema('claro'); }
$('btnTema').onclick = () =>
  aplicaTema(document.documentElement.getAttribute('data-tema') === 'oscuro' ? 'claro' : 'oscuro');

/* ---- Aviso --------------------------------------------------------------- */
let avisoT;
function avisa(titulo, detalle){
  const a = $('aviso');
  a.innerHTML = '<b>' + esc(titulo) + '</b>' + (detalle ? esc(detalle) : '');
  a.classList.add('on');
  clearTimeout(avisoT);
  avisoT = setTimeout(() => a.classList.remove('on'), 4200);
}

/* ---- Marca --------------------------------------------------------------- */
const sigla = CFG.logoText || 'DC';
const CANAL_FOTOS = CFG.lockNumFilter === true || CFG.defaultNumFilter === 'qr';
