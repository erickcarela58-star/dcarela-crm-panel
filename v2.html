    const mini = await aJpeg(await cargaImagen(blob), 96, 0.5);
    if (!mini) return '';
    const uri = 'data:image/jpeg;base64,' + await leeBase64(mini);
    return uri.length <= 12 * 1024 ? uri : '';
  } catch (e) { return ''; }
}

function pintaCola(){
  const c = $('cola'); if (!c) return;
  c.hidden = !COLA.length;
  // Se ve la foto, no su nombre. Lo que va a salir hacia un cliente real hay que
  // poder mirarlo antes: un nombre de archivo no dice si adjuntaste la que querias.
  c.innerHTML = COLA.map((a,i) => {
    // Iconos dibujados, no emoji: en Windows varias fuentes no traen 🎙 ni 🖼 y sale la
    // cajita vacia del glifo que falta, que es lo que se veia en la cola.
    const ICONO = {
      audio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/></svg>',
      image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
      document: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>',
    };
    const previa = a.tipo === 'image' && a.datos
      ? '<img src="data:' + esc(a.mime || 'image/jpeg') + ';base64,' + a.datos + '" alt="">'
      : '<span class="ico">' + (ICONO[a.tipo] || ICONO.document) + '</span>';
    const peso = a.kb || (a.datos ? Math.round(a.datos.length * 0.75 / 1024) : 0);
    const marca = a.tipo === 'image' ? (a.hd ? ' · HD' : '') : '';
    return '<span class="pieza">' + previa
      + '<span class="pnom">' + esc(a.nombre)
      +   (peso ? '<i>' + peso + ' KB' + marca + '</i>' : '') + '</span>'
      + '<button data-quita="' + i + '" aria-label="Quitar">×</button></span>';
  }).join('');
}
function leeBase64(f){
  return new Promise((res, rej) => {
    const l = new FileReader();
    l.onload = () => res(String(l.result).split(',')[1] || '');
    l.onerror = () => rej(new Error('no se pudo leer ' + f.name));
    l.readAsDataURL(f);
  });
}
// WhatsApp sube imagenes hasta ~5 MB por id, que es el metodo fiable; por encima cae
// al envio por enlace y falla con #131053. Y recomprime a ~2560 px de lado largo de
// todas formas, asi que mandar mas resolucion no mejora nada y arriesga el envio.
//
// HD = la mejor calidad que WhatsApp entrega DE VERDAD: si el JPEG ya cabe se manda
// intacto, y si no se baja hasta que quepa, siempre como imagen y no como documento.
const TOPE_FIABLE = 4.8 * 1024 * 1024;

function cargaImagen(file){
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('no se pudo abrir la imagen'));
    i.src = URL.createObjectURL(file);
  });
}
async function aJpeg(img, lado, calidad){
  const r = Math.min(1, lado / Math.max(img.width, img.height));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(img.width * r));
  cv.height = Math.max(1, Math.round(img.height * r));
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return new Promise(res => cv.toBlob(res, 'image/jpeg', calidad));
}
async function comprimeHd(file){
  if (!file.type?.startsWith('image/')) return file;
  if (/jpe?g/i.test(file.type) && file.size <= TOPE_FIABLE) return file;  // ya cabe: intacta
  try {
    const img = await cargaImagen(file);
    const mayor = Math.max(img.width, img.height);
    for (const lado of [Math.min(mayor, 2560), 2400, 2200, 2000, 1800, 1600]) {
      if (lado > mayor) continue;
      const b = await aJpeg(img, lado, 0.92);
      if (b && b.size <= TOPE_FIABLE) return b;
    }
    return (await aJpeg(img, 1600, 0.85)) || file;
  } catch (e) { return file; }
}
async function comprimeNormal(file){
  if (!file.type?.startsWith('image/')) return file;
  if (file.size <= 1.8 * 1024 * 1024) return file;
  try { return (await aJpeg(await cargaImagen(file), 1600, 0.85)) || file; }
  catch (e) { return file; }
}

async function encola(files, tipo){
  let fuera = 0;
  for (const f of files) {
    // HEIC no lo acepta WhatsApp por esta via y se rechaza aqui, no a mitad del envio.
    if (tipo === 'image' && /heic|heif/i.test(f.type + f.name)) { fuera++; continue; }
    if (f.size > LIMITE_MB() * 1024 * 1024) { fuera++; continue; }
    // Se guarda el ORIGINAL. La compresion se decide al enviar, no al adjuntar: antes,
    // adjuntar y despues pulsar HD no servia de nada porque la foto ya venia comprimida
    // en calidad normal, y no habia forma de darse cuenta.
    COLA.push({ tipo, nombre: f.name, mime: f.type || 'application/octet-stream', archivo: f });
  }
  await recalculaCola();
  if (fuera) avisa(fuera + (fuera === 1 ? ' archivo se omitió' : ' archivos se omitieron'),
    'HEIC o mayor de ' + LIMITE_MB() + ' MB.');
  pintaCola();
}
function cableaAdjuntos(){
  COLA.length = 0; pintaCola();
  $('adjImg').onclick = () => $('fImg').click();
  $('adjDoc').onclick = () => $('fDoc').click();
  $('fImg').onchange = e => { const f = [...e.target.files]; e.target.value = ''; encola(f, 'image'); };
  $('fDoc').onchange = e => { const f = [...e.target.files]; e.target.value = ''; encola(f, 'document'); };
  $('adjHd').onclick = async () => {
    modoHd = !modoHd;
    $('adjHd').setAttribute('aria-pressed', modoHd ? 'true' : 'false');
    $('adjHd').classList.toggle('on', modoHd);
    // Se recomprime lo que YA esta adjuntado. Antes el interruptor solo valia para las
    // fotos que se adjuntaran despues, sin decirlo en ninguna parte.
    if (COLA.some(a => a.tipo === 'image')) {
      $('adjHd').disabled = true;
      await recalculaCola();
      $('adjHd').disabled = false;
    }
    avisa(modoHd ? 'HD activado' : 'HD desactivado',
      modoHd ? 'Máxima calidad que WhatsApp entrega de verdad.' : 'Calidad normal, más ligeras.');
  };
  $('cola').onclick = ev => {
    const b = ev.target.closest('[data-quita]'); if (!b) return;
    COLA.splice(Number(b.dataset.quita), 1); pintaCola();
  };
  cableaMicrofono();
  // Solo existe en el chat del numero oficial (ver esOficial).
  if ($('adjTpl')) $('adjTpl').onclick = abrePlantillas;
  $('adjCombo').onclick = abreCombos;
  $('adjRapida').onclick = abreRapidas;
}

/* ---- De que anuncio viene quien escribe ---------------------------------- */
// Meta manda el anuncio solo en el primer mensaje; el servidor lo guarda en la ficha.
// Aqui solo se pinta: sin esto, quien atiende no sabe si contesta a graduacion o a XV.
const CAT_ANUNCIO = { xv:'XV', infantil:'Infantil', graduacion:'Graduación',
  cumpleanos:'Cumpleaños', embarazadas:'Maternidad' };

function insigniaAnuncio(c){
  if (!c || !(c.anuncio_id || c.anuncio_clid || c.anuncio_titular)) return '';
  const cat = CAT_ANUNCIO[String(c.anuncio_categoria || '').toLowerCase()] || '';
  const etiqueta = c.anuncio_titular || (c.anuncio_id ? 'Anuncio ' + c.anuncio_id : 'Anuncio');
  const detalle = [etiqueta, c.anuncio_id ? 'id ' + c.anuncio_id : '', c.anuncio_visto_en ? 'visto ' + c.anuncio_visto_en.slice(0,10) : '']
    .filter(Boolean).join(' · ');
  return ' · <span class="insig-anuncio" title="' + esc(detalle) + '">📣 '
    + esc(cat || etiqueta.slice(0, 28)) + '</span>';
}

/* ---- Respuestas rapidas -------------------------------------------------- */
// Frases del equipo, guardadas en el servidor y no en el navegador: si viven en
// localStorage, cada persona tiene las suyas y lo que escribe el negocio deja de
// sonar igual segun quien conteste.
let RAPIDAS = null;

async function cargaRapidas(forzar){
  if (RAPIDAS && !forzar) return RAPIDAS;
  const r = await llama({ action:'data', table:'quick_replies', operation:'select',
    order:[{ field:'created_at', ascending:false }], limit: 200 });
  if (!r.ok) { avisa('No se pudieron cargar', r.error); return null; }
  RAPIDAS = r.data || r.rows || [];
  return RAPIDAS;
}

async function abreRapidas(){
  if (!sel) return avisa('Abre una conversación primero');
  abreModal('<div class="mtapa"><b>Respuestas rápidas</b><button class="cerrarm" data-cerrar>×</button></div>'
    + '<div class="mcuerpo"><span class="cargando"></span> Cargando…</div>');
  $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });
  const todas = await cargaRapidas(true);
  if (!todas) return cierraModal();
  // Si la persona llego por un anuncio, primero las frases de esa categoria. Quien
  // atiende no deberia tener que buscar la respuesta de graduacion entre las de bodas.
  const catSel = String((sel && sel.anuncio_categoria) || '').toLowerCase();
  const filas = !catSel ? todas : todas.slice().sort((a, b) => {
    const ca = String(a.categoria || '').toLowerCase() === catSel ? 0 : 1;
    const cb = String(b.categoria || '').toLowerCase() === catSel ? 0 : 1;
    return ca - cb;
  });
  if (catSel) {
    const cuantas = filas.filter(q => String(q.categoria || '').toLowerCase() === catSel).length;
    if (cuantas) avisa('Vino de ' + (CAT_ANUNCIO[catSel] || catSel), cuantas + ' respuesta(s) de esa categoría, primero');
  }
  const cuerpo = $('modal').querySelector('.mcuerpo');
  const pinta = () => {
    cuerpo.innerHTML = (!filas.length
        ? '<p class="aviso">Todavía no hay ninguna. Puedes escribir la tuya abajo, o '
          + '<button class="btn-linea" id="rqSemilla" style="padding:4px 10px;margin-left:4px">'
          + 'empezar con seis frases habituales</button></p>'
        : '')
      + (filas.length
        ? filas.map((q,i) => {
            const cq = String(q.categoria || '').toLowerCase();
            return '<div class="rapida"><button data-usar="' + i + '">'
            + '<b>' + esc(q.title || q.name || 'Sin título')
            + (cq && CAT_ANUNCIO[cq] ? ' <span class="insig-anuncio">' + esc(CAT_ANUNCIO[cq]) + '</span>' : '') + '</b>'
            + '<span>' + esc(String(q.body || q.text || '').slice(0,110)) + '</span></button>'
            + '<button class="rx" data-borrar="' + i + '" aria-label="Borrar">×</button></div>';
          }).join('')
        : '')
      + '<div class="seccion" style="margin:16px 0 8px">Añadir una nueva</div>'
      + '<div class="campo"><label>Título</label><input id="rqT" placeholder="Ej. Horario"></div>'
      + '<div class="campo"><label>Categoría</label><select id="rqCat">'
      +   '<option value="">Para cualquier sesión</option>'
      +   Object.keys(CAT_ANUNCIO).map(k => '<option value="' + k + '"'
          + (catSel === k ? ' selected' : '') + '>' + esc(CAT_ANUNCIO[k]) + '</option>').join('')
      + '</select></div>'
      + '<div class="campo"><label>Texto</label><textarea id="rqB" rows="3"></textarea></div>'
      + '<button class="btn-solido" id="rqAdd">Guardar</button>';
    // Seis frases que se repiten veinte veces al dia en un estudio fotografico. Son un
    // punto de partida editable, no una imposicion: se guardan como cualquier otra y se
    // borran igual.
    const semilla = $('rqSemilla');
    if (semilla) semilla.onclick = async () => {
      semilla.disabled = true;
      const base = [
        ['Horario', 'Estamos de lunes a sábado, de 9:00 a 6:00. Los domingos no trabajamos.'],
        ['Ubicación', (CFG.addressText || '') + ' ' + (CFG.mapsUrl || '')],
        ['Abono', 'Para apartar la fecha se deja un abono. El resto se paga el día de la sesión.'],
        ['Pedir comprobante', 'Cuando hagas el abono mándame el comprobante por aquí y el nombre de quien pagó, y te confirmo la fecha.'],
        ['Entrega', 'Las fotos editadas se entregan en unos días y te aviso por aquí en cuanto estén listas.'],
        ['Confirmar fecha', 'Déjame revisar la disponibilidad real de ese día y te confirmo enseguida.'],
      ];
      // Se cuenta lo que de verdad se guardo. Un agente no tiene permiso de escritura aqui, y
      // antes fallaban las seis y el panel decia igual "Seis respuestas creadas".
      let creadas = 0, motivo = '';
      for (const [title, body] of base) {
        const r = await llama({ action:'data', table:'quick_replies', operation:'insert',
          payload:{ title, body: body.trim(), created_at: new Date().toISOString() } });
        if (r.ok) creadas++; else motivo = r.error || motivo;
      }
      semilla.disabled = false;
      RAPIDAS = null;
      const nuevas = await cargaRapidas(true);
      filas.length = 0; filas.push(...(nuevas || []));
      pinta();
      if (!creadas) return avisa('No se creó ninguna', motivo || 'No tienes permiso para crear respuestas rápidas.');
      avisa(creadas === base.length ? 'Seis respuestas creadas' : creadas + ' de ' + base.length + ' creadas',
        creadas === base.length ? 'Edítalas o bórralas como quieras.' : (motivo || 'Algunas no se pudieron guardar.'));
    };
    $('rqAdd').onclick = async () => {
      const title = $('rqT').value.trim(), body = $('rqB').value.trim();
      if (!title || !body) return avisa('Faltan el título o el texto');
      $('rqAdd').disabled = true;
      const categoria = ($('rqCat') && $('rqCat').value) || '';
      const r = await llama({ action:'data', table:'quick_replies', operation:'insert',
        payload:{ title, body, categoria: categoria || null, created_at: new Date().toISOString() }, returning:true });
      $('rqAdd').disabled = false;
      if (!r.ok) return avisa('No se pudo guardar', r.error);
      RAPIDAS = null;
      const nuevas = await cargaRapidas(true);
      filas.length = 0; filas.push(...(nuevas || []));
      pinta();
      avisa('Guardada');
    };
  };
  pinta();
  cuerpo.onclick = async ev => {
    const usar = ev.target.closest('[data-usar]');
    if (usar) {
      const q = filas[Number(usar.dataset.usar)];
      const caja = $('texto');
      const t = q.body || q.text || '';
      caja.value = caja.value.trim() ? caja.value.trim() + '\n\n' + t : t;
      caja.dispatchEvent(new Event('input'));
      cierraModal(); caja.focus();
      return;
    }
    const borrar = ev.target.closest('[data-borrar]');
    if (borrar) {
      const q = filas[Number(borrar.dataset.borrar)];
      if (!confirm('¿Borrar «' + (q.title || q.name) + '»?')) return;
      const r = await llama({ action:'data', table:'quick_replies', operation:'delete',
        filters:[{ kind:'eq', field:'id', value:q.id }] });
      if (!r.ok) return avisa('No se pudo borrar', r.error);
      filas.splice(Number(borrar.dataset.borrar), 1);
      RAPIDAS = null; pinta();
    }
  };
}

/* ---- Biblioteca de combos ------------------------------------------------ */
// El catalogo no vive en el CRM: se lee de la pagina publica, que es la que el
// negocio actualiza. Asi el precio que se le manda al cliente es exactamente el que
// ve en la web, sin una segunda lista que se quede vieja sin que nadie lo note.
const COMBO_PAGINA = CFG.publicCatalogUrl || 'https://dcarelacompufoto.com/combos.html';
const COMBO_IMG = 'https://dcarelacompufoto.com/combos-img/';
const COMBO_PDF = 'https://dcarelacompufoto.com/pdf/';
const COMBO_CATEGORIAS = { xv:'XV', infantil:'Infantil', graduacion:'Graduación',
  cumpleanos:'Cumpleaños', embarazadas:'Embarazadas' };
const COMBO_PDFS = [
  { cat:'xv', label:'XV', n:5 }, { cat:'infantil', label:'Infantil', n:8 },
  { cat:'graduacion', label:'Graduación', n:3 }, { cat:'cumpleanos', label:'Cumpleaños', n:15 },
  { cat:'embarazadas', label:'Embarazadas', n:8 },
];
let COMBOS = null;

function combosSlug(cat, nombre){
  return cat + '-' + String(nombre || '').toLowerCase().replace(/[^a-z0-9\s-]/g,'')
    .trim().replace(/\s+/g,'-').replace(/-+/g,'-');
}
async function cargaCombos(forzar){
  if (COMBOS && !forzar) return COMBOS;
  const r = await fetch(COMBO_PAGINA, { cache: forzar ? 'reload' : 'default' });
  if (!r.ok) throw new Error('catálogo HTTP ' + r.status);
  const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
  const filas = [];
  for (const sec of doc.querySelectorAll('section.sec[id]')) {
    const cat = String(sec.id || '').toLowerCase();
    if (!COMBO_CATEGORIAS[cat]) continue;
    for (const card of sec.querySelectorAll('article.combo')) {
      const nombre = String(card.querySelector('.cname')?.textContent || '').trim();
      if (!nombre) continue;
      const precioTxt = String(card.querySelector('.cprice b')?.textContent
        || card.querySelector('.cprice')?.textContent || '').trim();
      filas.push({
        cat, catLabel: COMBO_CATEGORIAS[cat], nombre,
        precio: precioTxt ? (precioTxt.startsWith('RD$') ? precioTxt : 'RD$' + precioTxt) : '',
        digital: String(card.querySelector('.cinc-total')?.textContent || '').trim(),
        items: [...card.querySelectorAll('.cinc li')].map(n => String(n.textContent||'').trim()).filter(Boolean),
        incluyeLabel: String(card.querySelector('.incbox .il')?.textContent || 'Incluye').trim(),
        incluye: String(card.querySelector('.incbox .iv')?.textContent || '').trim(),
        acento: String(card.dataset.accent || '').trim(),
        insignia: String(card.querySelector('.badge')?.textContent || '').trim(),
        nota: String(card.querySelector('.cinc-note')?.textContent || '').trim(),
        imagenCruda: card.querySelector('.ph')?.dataset.bg
          ? new URL(card.querySelector('.ph').dataset.bg, COMBO_PAGINA).href : '',
        tarjeta: COMBO_IMG + combosSlug(cat, nombre) + '.png',
      });
    }
  }
  COMBOS = filas;
  return filas;
}
/* ---- Tarjeta del combo y vestidos ---------------------------------------- */
// La tarjeta NO se dibuja aqui: se extrae de la web, que ya publica una por combo en
// /combos-img/<slug>.png. Son las buenas -- 1080x1350, con la marca, el precio y el
// ITBIS. Van sin telefono a proposito: la tarjeta se manda DENTRO de este chat, donde
// quien la recibe ya esta escribiendo al estudio, y el numero grabado en 39 PNG caduca
// solo (ya paso una vez).
//
// Las genera carela-compufoto-publish/scripts/generar_tarjetas_combo.mjs leyendo el MISMO
// combos.html que lee esta funcion, y catalog-v33.test.js exige que exista una tarjeta
// para cada uno de los 39 nombres usando este mismo combosSlug(). Si se cambia la regla
// del slug de aqui abajo, esa prueba y el generador avisan.
//
// El panel de texto de la tarjeta va encajado abajo y su alto lo decide el contenido: se
// eligio asi para no taparle la cara ni el vestuario al sujeto, que es lo que vende.
//
// Redibujarlas aqui seria mantener un segundo diseño que se separa del real en cuanto
// alguien toque la web.

// Los vestidos viven en la misma pagina, en .dress-block. Son la pregunta que mas repite
// una clienta de XV despues de ver el precio, y hasta ahora habia que buscarlos a mano.
let VESTIDOS = null;
async function cargaVestidos(forzar){
  if (VESTIDOS && !forzar) return VESTIDOS;
  const r = await fetch(COMBO_PAGINA, { cache: forzar ? 'reload' : 'default' });
  if (!r.ok) throw new Error('catálogo HTTP ' + r.status);
  const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
  VESTIDOS = [...doc.querySelectorAll('.dress-block .dcard img')].map(img => ({
    nombre: String(img.getAttribute('alt') || 'Vestido').trim(),
    url: new URL(img.getAttribute('src'), COMBO_PAGINA).href,
  })).filter(v => v.url);
  return VESTIDOS;
}

// Adjunta los vestidos como album. Se mandan comprimidos: son siete imagenes y el limite
// fiable de subida a Meta esta cerca de 5 MB por archivo -- pasarse devuelve el error
// #131053 despues de haber tardado en subir.
async function adjuntaVestidos(boton){
  const antes = boton ? boton.innerHTML : '';
  if (boton) { boton.disabled = true; boton.textContent = 'Preparando…'; }
  try {
    const lista = await cargaVestidos(false);
    if (!lista.length) throw new Error('el catálogo no trae vestidos');
    for (const v of lista) {
      const r = await fetch(v.url, { cache:'no-cache' });
      if (!r.ok) continue;
      const bruto = new File([await r.blob()], v.nombre + '.webp', { type:'image/webp' });
      // A JPEG siempre: los vestidos se publican en WebP y WhatsApp no acepta WebP como imagen.
      const blob = (await aJpeg(await cargaImagen(bruto), 1600, 0.88)) || bruto;
      COLA.push({ tipo:'image', mime: blob.type || 'image/jpeg',
        nombre: v.nombre + ' - DCarela.jpg', datos: await leeBase64(blob) });
    }
    pintaCola();
    const caja = $('texto');
    const t = 'Estos son los vestidos disponibles para la sesión. '
      + 'Dime cuál te gusta y lo reservamos para tu fecha.';
    caja.value = caja.value.trim() ? caja.value.trim() + '\n\n' + t : t;
    caja.dispatchEvent(new Event('input'));
    cierraModal();
    avisa('Vestidos listos', lista.length + ' imágenes en la cola. Revisa y pulsa enviar.');
  } catch (e) {
    if (boton) { boton.disabled = false; boton.innerHTML = antes; }
    avisa('No se pudieron preparar los vestidos', e?.message || String(e));
  }
}

// El pie de la tarjeta. Cuando va la tarjeta, el detalle YA esta dibujado dentro de la
// imagen: repetirlo aqui le llena la pantalla al cliente con la misma lista dos veces.
//
// Y no lleva URL. El dueño lo pidio explicito: si se manda la imagen, no se manda el
// enlace. Ademas la unica URL que llego a salir por aqui fue una vieja de netlify que el
// bot copio del historial, asi que cuanto menos enlace suelto ande por los mensajes, mejor.
function textoDeCombo(c, conTarjeta){
  const l = ['Te comparto el combo ' + c.nombre + (c.precio ? ' — ' + c.precio : '') + '.'];
  if (!conTarjeta) {
    if (c.digital) l.push('', c.digital + '.');
    if (c.items.length) l.push(...c.items.map(i => '• ' + i));
    if (c.incluye) l.push('', c.incluyeLabel + ': ' + c.incluye + '.');
  } else if (c.digital) {
    l.push('', c.digital + '. Todo el detalle está en la tarjeta.');
  }
  l.push('', 'Si te interesa, dime tu fecha tentativa y te confirmamos disponibilidad.');
  return l.join('\n');
}

async function adjuntaCombo(c, boton){
  if (!c) return;
  const antes = boton.innerHTML;
  boton.disabled = true; boton.textContent = 'Preparando…';
  try {
    // La tarjeta publicada del combo. Si por lo que sea no esta, se cae a la foto del
    // catalogo antes que dejar al agente sin nada que mandar -- pero se avisa, porque una
    // foto suelta no lleva el precio ni lo que incluye.
    let url = c.tarjeta, r = await fetch(url, { cache:'no-cache' });
    if (!r.ok && c.imagenCruda) {
      url = c.imagenCruda; r = await fetch(url, { cache:'no-cache' });
      if (r.ok) avisa('Sin tarjeta publicada', 'Va la foto del catálogo, sin el detalle del combo.');
    }
    if (!r.ok) throw new Error('imagen HTTP ' + r.status);
    const blob = await r.blob();
    const ext = url.split('.').pop().split('?')[0] || 'png';
    const datos = await leeBase64(blob);
    // Los combos salen con botones: el cliente toca en vez de escribir, y su respuesta
    // vuelve identificada -- se sabe QUE combo le intereso, no un "si" suelto que hay
    // que ir a buscar tres mensajes mas arriba.
    //
    // WhatsApp admite TRES botones como maximo, asi que se eligen segun el combo: los
    // vestidos son de sesiones XV, y ofrecerlos en un combo de graduacion seria prometer
    // algo que no existe.
    const esXV = c.cat === 'xv';
    COLA.push({ tipo:'image', mime: blob.type || 'image/jpeg',
      nombre: c.nombre + ' - DCarela.' + ext,
      datos,
      botones: [
        { id: 'combo_interesa:' + c.cat, titulo: 'Me interesa' },
        esXV ? { id: 'combo_vestidos', titulo: 'Ver vestidos' }
             : { id: 'combo_fecha:' + c.cat, titulo: 'Ver disponibilidad' },
        { id: 'combo_otros',             titulo: 'Ver otros combos' },
      ] });
    pintaCola();
    const caja = $('texto');
    const t = textoDeCombo(c, true);
    caja.value = caja.value.trim() ? caja.value.trim() + '\n\n' + t : t;
    caja.dispatchEvent(new Event('input'));
    cierraModal();
    avisa(c.nombre, 'Imagen y texto listos. Revisa y pulsa enviar.');
  } catch (e) {
    boton.disabled = false; boton.innerHTML = antes;
    avisa('No se pudo preparar ' + c.nombre, e?.message || String(e));
  }
}

async function adjuntaPdfCombos(cat, boton){
  const p = COMBO_PDFS.find(x => x.cat === cat); if (!p) return;
  const antes = boton.textContent;
  boton.disabled = true; boton.textContent = 'Preparando…';
  try {
    const url = COMBO_PDF + 'combos-' + cat + '.pdf';
    const r = await fetch(url, { cache:'force-cache' });
    if (!r.ok) throw new Error('PDF HTTP ' + r.status);
    const blob = await r.blob();
    const datos = await new Promise((res, rej) => {
      const l = new FileReader();
      l.onload = () => res(String(l.result).split(',')[1] || '');
      // Sin onerror la promesa no se resuelve NUNCA si la lectura falla, y el envio
      // se queda colgado con el boton deshabilitado y sin decir nada.
      l.onerror = () => rej(new Error('no se pudo leer el archivo'));
      l.readAsDataURL(blob);
    });
    COLA.push({ tipo:'document', mime:'application/pdf',
      nombre:'Combos ' + p.label + ' - DCarela.pdf', datos });
    pintaCola();
    const caja = $('texto');
    if (!caja.value.trim()) {
      caja.value = 'Te comparto nuestros combos de ' + p.label + '. Cualquier duda me dices, '
        + 'y si te interesa alguno dime tu fecha tentativa para confirmarte disponibilidad.';
      caja.dispatchEvent(new Event('input'));
    }
    cierraModal();
    avisa('Combos ' + p.label, 'PDF listo. Revisa y pulsa enviar.');
  } catch (e) {
    boton.disabled = false; boton.textContent = antes;
    avisa('No se pudo preparar el PDF', e?.message || String(e));
  }
}

/* ---- Plantillas de WhatsApp ---------------------------------------------- */
// Lo unico que WhatsApp entrega con la ventana de 24 h cerrada. Sin esto no se
// puede reactivar a nadie, y por eso es lo primero que necesita una campaña.
//
// El servidor NO resuelve template_id: outboundPayload (transport-core.js:73-87) lee
// template_name, language_code y variables. Mandar el id, como hacia el panel
// anterior, se contesta con "plantilla requerida".
let PLANTILLAS = null;

async function cargaPlantillas(forzar){
  if (PLANTILLAS && !forzar) return PLANTILLAS;
  const r = await llama({ action:'templates', operation:'list',
    business_number: CFG.businessNumber || '' });
  if (!r.ok) { avisa('No se pudieron cargar las plantillas', r.error); return null; }
  PLANTILLAS = (r.templates || r.rows || r.items || []).filter(t => t && t.template_name);
  return PLANTILLAS;
}

function abreModal(html){
  let m = $('modal');
  if (!m) { m = document.createElement('div'); m.id = 'modal'; document.body.appendChild(m); }
  m.className = 'modal on';
  m.innerHTML = '<div class="caja">' + html + '</div>';
  m.onclick = ev => { if (ev.target === m) cierraModal(); };
  return m;
}
function cierraModal(){ const m = $('modal'); if (m) m.className = 'modal'; }
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { cierraModal(); cierraLupa(); } });

/* ---- Lupa de imagenes ---------------------------------------------------- */
function cierraLupa(){ $('lupa').classList.remove('on'); $('lupa').querySelector('img').src = ''; }
$('lupa').onclick = cierraLupa;
// Delegado en el documento: los globos se repintan en cada mensaje nuevo y un

document.addEventListener('click', ev => {

async function abrePlantillas(){

  if (!esOficial(sel)) return avisa('Aquí no hacen falta plantillas',

  const cuerpo = $('modal').querySelector('.mcuerpo');
  if (!activas.length) {

    + '</button>').join('');
