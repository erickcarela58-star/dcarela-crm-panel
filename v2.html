const soloDigitos = value => String(value || '').replace(/\D/g, '');
const NUMERO_FOTOS = soloDigitos(CFG.bridgeBusinessNumber || CFG.bridgeBusinessDisplayNumber);
// Dos numeros de la casa terminan en 5620 (el oficial 18495245620 y la linea vieja de WhatsApp
// Web). "***5620" no dice cual es, asi que los numeros de linea se ensenan siempre enteros.
const telefonoLegible = value => { const d = soloDigitos(value); const m = d.match(/^1(\d{3})(\d{3})(\d{4})$/); return m ? m[1] + '-' + m[2] + '-' + m[3] : d; };
// El numero de la linea de WhatsApp Web ya NO va escrito aqui. Era 18094785620 de respaldo, y al
// vincular el 18097575644 el campo de vinculacion seguia proponiendo la linea vieja. Desde el
// 09/09/2026 el dueno vincula el que le conviene: el campo sale con el numero conectado (o el
// pedido), y esto solo cuenta si crm-config.js declara uno a proposito.
const TELEFONO_PUENTE = NUMERO_FOTOS;
function perteneceAlCanal(c){
  const fuente = String(c?.source || '').toLowerCase();
  const numero = soloDigitos(c?.business_number);
  const esFotos = fuente === 'whatsapp_qr' || fuente === 'photos'
    || (NUMERO_FOTOS && numero === NUMERO_FOTOS);
  // El panel de Fotos atiende SOLO su linea: ahi el filtro sigue siendo excluyente.
  //
  // Este, el comercial, enseña LOS DOS numeros. Antes excluia el del puente, y por eso se
  // podia vincular y sincronizar el historial desde aqui sin que apareciera un solo mensaje:
  // la barra llegaba al 100% y la pantalla seguia vacia. El dueño lo quiere en este CRM, con
  // sus frenos anti-bloqueo, asi que aqui no se esconde nada.
  return CANAL_FOTOS ? esFotos : true;
}
['sigla','siglaAcceso'].forEach(id => { $(id).textContent = sigla; });
$('marca').textContent = CFG.productName || 'CRM';
$('submarca').textContent = CFG.subtitle || '';
$('marcaAcceso').textContent = CFG.brandName || "D'Carela";
$('subAcceso').textContent = CFG.subtitle || '';
// Se guarda aparte porque pintaCuentas le antepone el numero de conversaciones sin leer.
const TITULO_BASE = CFG.appTitle || "D'Carela CRM";
document.title = TITULO_BASE;

/* ---- Menu ---------------------------------------------------------------- */
// Tres entradas siempre a la vista y el resto tras la hamburguesa. Ojo: quien
// esconde es CSS puro (.secundarias sin body.menu-abierto), no un script que
// reordene nodos. Si el modulo no arranca, se ven TODAS. Un menu de mas no es
// tan grave como un menu vacio, que es como quedo el panel anterior.
const ico = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
const VISTAS = [

// Todo pasa por crmApi con el token de Firebase. Ninguna escritura sale de aqui
// directa a Firestore: el servidor es quien valida permisos y reglas de negocio.
async function llama(cuerpo, opciones = {}){
  const u = auth.currentUser;
  if (!u) return { ok:false, error:'sesión no iniciada', status:401 };
  let token;
  try { token = await u.getIdToken(); }
  catch (e) { return { ok:false, error: e?.message || String(e), status:401 }; }
  let r;
  try {
    r = await fetch(API, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + token },
      body: JSON.stringify(cuerpo),
      signal: senalDeLlamada(cuerpo, opciones.signal),
    });
  } catch (e) {
    // Tres fallos distintos que antes se veian iguales: lo paro la persona (Detener), se
    // agoto el tope de tiempo, o no hubo red. El asistente dice cual fue y ofrece reintentar.
    const nombre = e?.name || '';
    return { ok:false, error: e?.message || String(e), abortado: nombre === 'AbortError',
      tiempo: nombre === 'TimeoutError', red: nombre !== 'AbortError' && nombre !== 'TimeoutError' };
  }
  const j = await r.json().catch(() => ({}));
  // El codigo viaja con el error: los rechazos del puente se distinguen por el (otra linea,
  // desconectado, PC sin latido, pausa, modo seguro), no por el texto. El asistente usa ademas
  // el estado HTTP, el codigo del proveedor de IA y si el servidor dice que se puede reintentar.
  if (!r.ok) return { ok:false, error: j?.error || ('error ' + r.status), code: j?.code || null,
    status: r.status, provider_code: j?.provider_code || null, retryable: j?.retryable ?? null, detail: j?.detail || null };
  return { ok:true, ...j };
}
// Las llamadas a la IA tienen tope de 90 s; las del asistente ademas se pueden detener, asi
// que su señal se combina con ese tope.
const LLAMADAS_LENTAS = new Set(['assistantPlan', 'assistantChat']);
function senalDeLlamada(cuerpo, propia){
  const tope = LLAMADAS_LENTAS.has(cuerpo.action) ? AbortSignal.timeout(90000) : null;
  if (!propia) return tope || undefined;
  if (!tope) return propia;
  return typeof AbortSignal.any === 'function' ? AbortSignal.any([propia, tope]) : propia;
}
const callFn = cuerpo => llama(cuerpo);

// Lo que dejo la ultima importacion de cada red, para que no se pierda con el aviso.

/* ---- Datos en vivo ------------------------------------------------------- */
// CONVS son las conversaciones VIVAS: de ahi leen la bandeja, los contadores, los avisos, el
// Dashboard, el Kanban, Limpieza y el asistente. CONVS_TODAS es todo lo que llega de Firestore, y
// CONVS_OCULTAS lo que sale de la bandeja porque su linea de WhatsApp Web no esta conectada. Se
// esconde, no se borra: el filtro de la linea las trae y vuelven solas si ese numero se vincula.
// CONVS_IGNORADAS son las que el dueno saco del CRM (familia, numeros propios, colegas): fuera de
// CONVS y de CONVS_OCULTAS, asi que ninguna vista ni contador las cuenta; el chip 'Ignorados' las
// trae y desde ahi se deshace.
let CONVS = [], CONVS_TODAS = [], CONVS_OCULTAS = [], CONVS_IGNORADAS = [], MSGS = [], sel = null, paraMsgs = null;
// Los mismos tipos que firebase-functions/src/ignore-core.js (TIPOS): solo dicen POR QUE se ignora.
const TIPOS_IGNORAR = { propio:'número propio', linea_negocio:'línea del negocio', familia:'familia',
  fotografo:'fotógrafo', delivery:'delivery', personal:'personal', proveedor:'proveedor', otro:'otro' };
// Globos de lo que el servidor ya acepto y el puente todavia no ha mandado. Ver apuntaEnviando.
let ENVIANDO = [];

function nombreDe(c){
  if (c.customer_name || c.contact_name) return c.customer_name || c.contact_name;
  // Instagram y Messenger no traen telefono. Sin este respaldo salia un '+' suelto, IGUAL
  // en todas, y diez conversaciones distintas se veian como diez filas identicas. Se
  // ensenan los ultimos digitos del id para poder distinguirlas mientras no haya nombre.
  if (c.wa_phone) return '+' + c.wa_phone;
  const id = String(c.social_id || '');
  return id ? 'Sin nombre · ' + id.slice(-6) : 'Sin nombre';
}
// Foto de perfil si el canal la trae; si no, las iniciales.
//
// La API de WhatsApp Cloud (numero oficial) no manda la foto del cliente en el webhook, asi
// que ahi sale la inicial y no hay de donde sacar otra cosa. Instagram y Messenger SI la
// exponen como URL directa (profile_pic_url), y esa manda siempre.
//
// El 2.o numero (whatsapp_qr) si la tiene: el puente la pide a WhatsApp con calma, guarda los
// bytes en bridge-media y deja en la ficha profile_pic_media_id. Ese id no es una URL: se pide
// a crmMedia con la sesion, igual que las fotos de los mensajes, y un <img src> no puede
// llevar la cabecera Authorization. Por eso sale primero con iniciales y data-avatar, y
// resuelveAvatares cambia el circulo por la foto cuando llega. NO usa data-medio: resuelveMedios
// convierte los fallos en la tarjeta "Archivo · no se pudo recuperar", que en un avatar romperia
// la fila; aqui un fallo deja las iniciales.
//
// referrerpolicy no-referrer porque los CDN de Meta rechazan la peticion si ven el
// origen, y sin eso saldria un hueco roto en vez de las iniciales.
function avatarDe(c, n){
  const url = c?.profile_pic_url || c?.avatar_url || c?.metadata?.profile_pic_url || '';
  const ini = esc(iniciales(n));
  const vuelveAIniciales = 'onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),'
    + '{className:\'av\',textContent:this.dataset.ini}))" data-ini="' + ini + '"';
  if (url) return '<img class="av" src="' + esc(url) + '" alt="" loading="lazy" '
    + 'referrerpolicy="no-referrer" ' + vuelveAIniciales + '>';
  const medio = String(c?.profile_pic_media_id || '');
  if (medio.startsWith('fbs:')) {
    const yaBajada = MEDIOS.get(medio);
    // Ya en cache: se pinta directa, sin parpadeo, en cada snapshot que repinta la lista.
    if (yaBajada) return '<img class="av" src="' + esc(yaBajada) + '" alt="" ' + vuelveAIniciales + '>';
    // No se ha intentado todavia, o el fallo anterior ya toca reintentarlo. Un 404 o un corte de
    // red dejaban las iniciales para toda la sesion, y solo recargar la pagina las arreglaba.
    if (yaBajada !== '' || medioReintentable(medio))
      return '<div class="av" data-avatar="' + esc(medio) + '" data-avconv="'
        + esc(c?._id || c?.id || '') + '" data-ini="' + ini + '">' + ini + '</div>';
  }
  // Ficha de WhatsApp Web que todavia no tiene foto guardada. Se marca para pedirsela al puente
  // cuando de verdad se vea en pantalla: es lo que hace que la bandeja recien vinculada tenga
  // caras en segundos en vez de esperar dias al ritmo de fondo. 'sin_foto' y 'privada' son
  // respuestas definitivas de WhatsApp y no se vuelven a pedir.
  if (String(c?.source || '') === 'whatsapp_qr' && !medio
    && !['sin_foto', 'privada'].includes(String(c?.profile_pic_status || ''))) {
    return '<div class="av" data-avpend="' + esc(c?._id || c?.id || '') + '">' + ini + '</div>';
  }
  return '<div class="av">' + ini + '</div>';
}

function iniciales(n){
  return String(n || '?').replace(/[^\p{L}\p{N} ]/gu,'').trim().split(/\s+/)
    .slice(0,2).map(p => p[0] || '').join('').toUpperCase() || '#';
}
// Instante de un valor de fecha, en milisegundos, o NaN si no se puede leer. Acepta la cadena
// ISO que escriben casi todos los caminos, el Timestamp de Firestore y un numero.
function instante(v){
  if (v == null || v === '') return NaN;
  if (typeof v === 'number') return v < 10_000_000_000 ? v * 1000 : v;
  if (typeof v === 'object' && typeof v.seconds === 'number') return v.seconds * 1000;
  return Date.parse(String(v));
}
// Un mensaje sin fecha legible se ordena AL FINAL, no al principio. Llego sin ella porque
// alguien lo acababa de escribir -- ese era el caso real: los envios del 2.o numero -- asi
// que el final es donde casi seguro va. Al principio lo dejaba el orden por texto, y ahi
// parecia un mensaje de hace meses.
function instanteMsg(m){
  for (const v of [m.created_at, m.synced_at, m.delivery_updated_at, m.updated_at]) {
    const t = instante(v);
    if (Number.isFinite(t)) return t;
  }
  return Number.MAX_SAFE_INTEGER;
}

function hora(v){
  if (!v) return '';
  if (!Number.isFinite(instante(v))) return '';
  const d = new Date(instante(v)), hoy = new Date();
  if (d.toDateString() === hoy.toDateString())
    return d.toLocaleTimeString('es-DO', { hour:'2-digit', minute:'2-digit' });
  const ayer = new Date(hoy); ayer.setDate(hoy.getDate() - 1);
  if (d.toDateString() === ayer.toDateString()) return 'ayer';
  return d.toLocaleDateString('es-DO', { day:'numeric', month:'short' });
}

function escuchaConversaciones(){
  const q = query(collection(db,'crm_conversations'), where('business_id','==',NEGOCIO));
  onSnapshot(q, s => {
    CONVS_TODAS = s.docs.map(d => ({ ...d.data(), _id:d.id })).filter(perteneceAlCanal)
      .sort((a,b) => String(b.last_message_at||'').localeCompare(String(a.last_message_at||'')));
    // Un unico punto donde se separa lo vivo de lo oculto. Asi cada vista y cada contador cuenta
    // lo mismo que se ve, sin repetir el filtro en veinte sitios (y olvidarlo en alguno).
    recalculaVisibles();
    // La conversacion abierta es una copia: sin esto, la foto de perfil que acaba de guardar el
    // puente, el nombre corregido o el paso a atencion humana no se veian hasta cambiar de chat.
    refrescaSeleccion();
    marcaEstado(true, 'Datos sincronizados · en vivo');
    if (vistaActual === 'conversations') pintaChats();
    if (vistaActual === 'funnel') { pintaKanban(); pintaMovilizacion(); }
    if (vistaActual === 'dashboard') pintaDashboard();
    if (vistaActual === 'agenda') pintaAgenda();
    if (vistaActual === 'reminders') pintaRecordatorios();
    pintaCuentas();
    avisaMensajesNuevos();
  }, err => marcaEstado(false, 'Sin datos en vivo: ' + (err?.code || 'error')));
}
function escuchaMensajes(idConv){
  if (paraMsgs) { paraMsgs(); paraMsgs = null; }
  MSGS = [];
  // Los globos de "enviando" son de la conversacion que se deja: al cambiar de chat ya no hay
  // MSGS con que confirmarlos, y arrastrarlos seria enseñar un reloj que no se apaga nunca.
  ENVIANDO = [];
  // business_id va SIEMPRE en la consulta, no solo conversation_id: las reglas de
  // Firestore la rechazan sin el, y el rechazo llega por el callback de error. Sin ese
  // callback la conversacion se quedaba en blanco sin decir nada -- pared beige y cero
  // mensajes, indistinguible de un chat vacio de verdad.
  // Con limit: sin el se descarga la conversacion entera, y hay chats con miles de
  // mensajes. Se traen los ultimos 400, que es mas de lo que nadie sube a leer.
  //
  // Con orderBy. Sin el, limit(400) NO trae los ultimos 400: Firestore ordena por id de
  // documento, y los ids son hashes del wamid, asi que devolvia 400 mensajes al azar de toda
  // la historia. En un chat de mas de 400 mensajes, un mensaje nuevo cuyo hash cayera fuera
  // del corte no aparecia nunca en el hilo, aunque la bandeja si enseñara su vista previa.
  //
  // Esa consulta necesita un indice compuesto. Si todavia no existe, Firestore responde
  // failed-precondition y se cae a la consulta vieja: peor orden, pero el chat se ve.
  const base = [where('business_id','==',NEGOCIO), where('conversation_id','==',idConv)];
  const esEste = () => sel && (sel.id === idConv || sel._id === idConv);
  const escucha = (q, esRespaldo) => onSnapshot(q, s => {
    // Se ordena por instante, no por el texto de created_at: un mensaje sin fecha tenia la
    // cadena vacia y la cadena vacia va antes que cualquier otra.
    MSGS = s.docs.map(d => d.data())
      .sort((a,b) => instanteMsg(a) - instanteMsg(b));
    if (esEste()) pintaMensajes();
  }, err => {
    if (!esRespaldo && err?.code === 'failed-precondition' && esEste()) {
      paraMsgs = escucha(query(collection(db,'crm_messages'), ...base, limit(400)), true);
      return;
    }
    const cont = $('mensajes');
    if (cont) cont.innerHTML = '<div style="margin:auto;max-width:340px;text-align:center;color:var(--mut);font-size:13px">'
      + 'No se pudieron cargar los mensajes.<br><b>' + esc(err?.code || 'error') + '</b></div>';
  });
  paraMsgs = escucha(query(collection(db,'crm_messages'), ...base, orderBy('created_at','desc'), limit(400)), false);
}
// Version cargada y aviso de que hay otra publicada.
//
// El panel se sirve desde GitHub Pages con Cache-Control: max-age=600, asi que una
// pestaña abierta puede quedarse horas con el HTML viejo. Desde fuera eso es
// indistinguible de un despliegue que fallo: el dueño mira, no ve el cambio, y no hay
// forma de saber cual de las dos cosas paso. Las metaetiquetas del <head> evitan que
// vuelva a cachearse; esto ademas avisa cuando ya hay algo mas nuevo publicado.
let VERSION_CARGADA = '';
async function vigilaVersion(){
  const e = $('version'); if (!e) return;
  let publicada = '';
  try {
    const r = await fetch('./app-version.json?t=' + Date.now(), { cache:'no-store' });
    if (r.ok) publicada = String((await r.json()).version || '');
  } catch (err) { return; }
  if (!publicada) return;
  if (!VERSION_CARGADA) VERSION_CARGADA = publicada;
  e.hidden = false;
  if (publicada === VERSION_CARGADA) {
    e.className = 'version';
    e.textContent = 'v ' + VERSION_CARGADA;
    e.onclick = null;
    return;
  }
  // Recarga saltandose la cache: sin el parametro, el navegador puede devolver el mismo
  // HTML viejo y el aviso se quedaria puesto para siempre.
  e.className = 'version hay';
  e.textContent = 'Hay una versión nueva · pulsa para actualizar';
  e.onclick = () => { location.replace(location.pathname + '?v=' + Date.now() + location.hash); };
}

}

/* ---- Avisos de mensaje nuevo --------------------------------------------- */
// Ultima respuesta del cliente ya conocida, por conversacion: es lo que distingue "ha
// entrado un mensaje" de "la lista se ha repintado", que pasa constantemente.
const VISTO_ENTRANTE = new Map();
let primerVistazo = true;

function avisaMensajesNuevos(){
  const nuevos = [];
  // Se toma nota de TODAS, tambien las ocultas: si no, al volver a vincular una linea sus fichas
  // aparecerian como "nunca vistas" y soltarian un aviso por cada chat viejo.
  for (const c of CONVS_TODAS) {
    const id = c.id || c._id;
    const t = String(c.last_customer_reply_at || '');
    if (!t) continue;
    const antes = VISTO_ENTRANTE.get(id);
    VISTO_ENTRANTE.set(id, t);
    // Y solo lo RECIENTE. Una importacion de historial escribe la fecha del ultimo mensaje del
    // cliente --de hace meses o anos-- en fichas que el panel ve por primera vez, y para el
    // bucle eso es indistinguible de un mensaje nuevo: sincronizar el historial con el CRM
    // abierto soltaria una rafaga de avisos de conversaciones muertas. Hasta ahora no pasaba
    // por accidente, porque el puente no escribia ese campo; en cuanto lo escribe, hace falta
    // decirlo aqui. Una fecha ilegible (NaN) no se silencia: ante la duda, se avisa.
    if (Date.now() - Date.parse(t) > 15 * 60000) continue;
    // De una ignorada no se avisa ni suena nada: es la familia o un colega. Se toma nota igual
    // (arriba), para que al dejar de ignorarla no suelte avisos de mensajes viejos.
    if (ignorada(c)) continue;
    // En el primer vistazo solo se toma nota. Avisar aqui soltaria una notificacion por cada
    // conversacion pendiente que ya existiera, cada vez que se abre el panel.
    if (primerVistazo) continue;
    // Y OJO: 'antes === undefined' significa conversacion NUEVA, no "nada que avisar". Al
    // saltarla se perdia justo el aviso que mas importa -- el primer mensaje de alguien que
    // nunca habia escrito, que es un cliente nuevo llamando a la puerta. Solo se salta
    // cuando ya se conocia y no ha entrado nada mas nuevo.
    if (antes !== undefined && t <= antes) continue;
    // De una linea que ya no esta vinculada no se avisa: no se le puede contestar. Con el puente
    // caido si, porque es la linea que atiende y vuelve en cuanto la PC responda.
    if (estadoQr(c, LINEA_QR) === 'otra_linea') continue;
    nuevos.push(c);
  }
  primerVistazo = false;
  if (!nuevos.length) return;
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  // Del chat que se esta mirando no se avisa: ya se ve.
  const idSel = sel ? (sel.id || sel._id) : null;
  for (const c of nuevos.slice(0, 3)) {
    if (!document.hidden && (c.id || c._id) === idSel) continue;
    try {
      const n = new Notification(nombreDe(c), {
        body: String(c.last_inbound_preview || c.last_message_preview || 'Mensaje nuevo').slice(0, 140),
        // Una etiqueta por conversacion: si alguien manda cinco mensajes seguidos se
        // reemplaza el aviso en vez de apilar cinco.
        tag: 'crm-' + (c.id || c._id),
      });
      n.onclick = () => {
        window.focus();
        // Primero la vista, despues el chat. abre() toca $('sinChat') y $('conversacion'),
        // que solo existen con Conversaciones montada: pulsando el aviso desde Kanban, la
        // Agenda o Configuracion saltaba un TypeError, el chat no se abria, y el mensaje
        // quedaba marcado como leido sin que nadie lo hubiera visto.
        if (vistaActual !== 'conversations') ve('conversations');
        abre(c);
        n.close();
      };
    } catch (error) { /* si el navegador lo bloquea, quedan el titulo y el globito */ }
  }
}

// Arrastrar con el raton para deslizar los filtros. En tactil ya funciona solo; en
// escritorio no hay gesto y la rueda tampoco desplaza en horizontal, asi que sin esto
// los ultimos filtros son inalcanzables con el raton.
function arrastraFiltros(caja){
  if (!caja) return;
  let activo = false, inicioX = 0, inicioScroll = 0, movido = 0;
  caja.addEventListener('pointerdown', ev => {
    if (ev.pointerType === 'touch') return;   // el tactil ya lo hace el navegador
    activo = true; movido = 0;
    inicioX = ev.clientX; inicioScroll = caja.scrollLeft;
    // NO se captura el puntero. setPointerCapture redirige el click al contenedor, asi
    // que el listener delegado recibia ev.target = #filtros, closest('[data-filtro]')
    // devolvia null y NINGUN filtro se podia pulsar con raton. El arrastre funciona
    // igual sin capturar: pointermove sigue llegando mientras el boton este pulsado, y
    // pointerup en window cierra el gesto aunque se suelte fuera de la caja.
  });
  caja.addEventListener('pointermove', ev => {
    if (!activo) return;
    const d = ev.clientX - inicioX;
    movido = Math.max(movido, Math.abs(d));
    // Solo a partir de 4px se considera arrastre; por debajo es un clic con pulso y
    // bloquear el boton ahi haria que los filtros no se pudieran pulsar.
    if (movido > 4) caja.classList.add('arrastrando');
    caja.scrollLeft = inicioScroll - d;
  });
  const soltar = () => {
    if (!activo) return;
    activo = false;
    setTimeout(() => caja.classList.remove('arrastrando'), 0);
  };
  // En window, no en la caja: si se suelta el raton fuera de los filtros, sin esto el
  // gesto se quedaria pegado y la lista seguiria arrastrandose sola.
  window.addEventListener('pointerup', soltar);
  window.addEventListener('pointercancel', soltar);
  // Un arrastre de verdad no debe contar tambien como click en el filtro que quedo debajo.
  caja.addEventListener('click', ev => {
    if (movido > 4) { ev.stopPropagation(); ev.preventDefault(); }
  }, true);
  // La rueda vertical desplaza en horizontal: es lo que espera cualquiera con raton.
  caja.addEventListener('wheel', ev => {
    if (Math.abs(ev.deltaY) <= Math.abs(ev.deltaX)) return;
    ev.preventDefault();
    caja.scrollLeft += ev.deltaY;
  }, { passive:false });
}

// Estado de la linea de WhatsApp Web. null = todavia no se sabe, y mientras no se sepa no se
// esconde nada: esconder por defecto es peor error que enseñar de mas. El servidor bloquea
// igual los envios que no deben salir.
//
// Antes habia DOS formulas que se contradecian: al entrar solo miraba status (e ignoraba la
// pausa y la PC), y al abrir Canales miraba ademas paused, asi que con los envios en pausa
// desaparecian las 580 fichas de la linea viva. Ninguna miraba el numero, de modo que las 37
// fichas del 18094785620 salian mezcladas con las del 18097575644. Y como bridgeStatus exige
// admin, a un agente no se le escondia nada. Ahora el estado sale de UN sitio, lineaDesdeControl,
// y llega en vivo a cualquier rol por el espejo crm_channel_state/whatsapp_qr.
let LINEA_QR = null;
// Lo ultimo que se leyo y si viene de la escucha en vivo o de una consulta suelta (bridgeStatus).
let LINEA_QR_FUENTE = null;
async function cargaEstadoPuente(){
  // Respaldo cuando el espejo no existe (servidor viejo) o las reglas no dejan leerlo. Solo lo
  // contesta a un admin; a los demas les llega un error y la linea sigue en "no se sabe".
  const r = await llama({ action:'bridgeStatus' });
  if (r.ok) fijaLineaQr(r.bridge || r, { enVivo:false });
}
// Si Instagram y Messenger estan encendidos. El ajuste vive en el servidor --es del negocio, no
// de cada navegador-- y lo devuelve socialStatus, que ya existia para la vista de Canales: no
// hace falta otra proyeccion. Si la llamada falla, se quedan ocultos, que es lo pedido.
async function cargaEstadoRedes(){
  const r = await llama({ action:'socialStatus' });
  if (r.ok) fijaRedesActivas(r.activas === true);
}
function fijaLineaQr(p, { enVivo = false } = {}){
  // Una consulta suelta no pisa a la escucha en vivo: se quedaria congelada diciendo que la PC
  // responde aunque se apague despues.
  if (p && typeof p === 'object' && (enVivo || !LINEA_QR_FUENTE?.enVivo)) {
    LINEA_QR_FUENTE = { p, enVivo, leidoEn: Date.now() };
  }
  if (!LINEA_QR_FUENTE) return;
  // Con la escucha en vivo la edad del latido se mide contra el reloj (si la PC se apaga, el
  // espejo deja de cambiar y envejece). Con una consulta suelta se mide contra cuando se leyo:
  // de lo que pasa despues no se sabe nada, y eso no puede leerse como "la PC dejo de responder".
  const f = LINEA_QR_FUENTE;
  const nueva = lineaDesdeControl(f.p, f.enVivo ? Date.now() : f.leidoEn);
  const firma = l => l ? [l.numero, l.vinculado, l.pausado, l.hostVivo, l.motivoPausa, l.transporte].join('|') : '';
  const cambia = firma(nueva) !== firma(LINEA_QR);
  LINEA_QR = nueva;
  // Canales lleva su propia firma: el progreso y el estado del historial no cambian la linea, y
  // meterlos en la de arriba repintaria las 580 fichas, el Kanban y el Dashboard en cada latido
  // de la importacion. Sin esto, una sincronizacion que arranca sola (nadie pulso "Sincronizar",
  // asi que vigilaPuente no corre) dejaba la tarjeta con el estado viejo hasta el final. No hay
  // bucle: la llamada interna de renderBridgeControlState ve la misma firma y no vuelve.
  const firmaCanales = f.enVivo ? [f.p.history_sync_status, f.p.history_sync_progress].join('|') : '';
  const cambiaCanales = firmaCanales !== fijaLineaQr.firmaCanales;
  fijaLineaQr.firmaCanales = firmaCanales;
  if (!cambia) {
    if (cambiaCanales && f.enVivo && $('bridgePairBtn')) renderBridgeControlState(controlConEspejo(bridgeControlState, f.p), '');
    return;
  }
  recalculaVisibles();
  if (vistaActual === 'conversations') pintaChats();
  if (vistaActual === 'funnel') { pintaKanban(); pintaMovilizacion(); }
  if (vistaActual === 'dashboard') pintaDashboard();
  if (vistaActual === 'agenda') pintaAgenda();
  if (vistaActual === 'reminders') pintaRecordatorios();
  pintaCuentas();
  pintaAvisoLinea();
  // Canales se pinta con el mismo estado: asi la pausa, el porcentaje del historial y la PC
  // caida se mueven solos en vez de esperar a que alguien pulse "Actualizar estado". Solo con la
  // escucha en vivo: una consulta suelta ya viene de renderBridgeControlState y volveria sobre
  // sus pasos.
  if (f.enVivo && $('bridgePairBtn')) renderBridgeControlState(controlConEspejo(bridgeControlState, f.p), '');
}
function escuchaLineaQr(){
  if (escuchaLineaQr.para) { escuchaLineaQr.para(); escuchaLineaQr.para = null; }
  let respaldoPedido = false;
  const respaldo = () => { if (!respaldoPedido) { respaldoPedido = true; cargaEstadoPuente(); } };
  try {
    escuchaLineaQr.para = onSnapshot(doc(db, 'crm_channel_state', 'whatsapp_qr'), s => {
      if (!s.exists()) return respaldo();
      fijaLineaQr(s.data(), { enVivo:true });
    }, () => respaldo());
  } catch (e) { respaldo(); }
  // Sin red: cada 30 s se vuelve a mirar la edad del latido. Es lo que esconde las fichas cuando
  // la PC se apaga, porque entonces ya no llega ningun cambio que lo dispare.
  if (!escuchaLineaQr.reloj) escuchaLineaQr.reloj = setInterval(() => fijaLineaQr(null), 30_000);
}

// ---- Funciones puras de la linea (las ejecuta test/v2-linea-qr.test.js) ----
// vinculado cuenta 'connecting' porque la sesion ya esta abierta y comprobandose. La PC se da por
// perdida a los 5 min sin latido: el servidor deja de aceptar envios a los 2, pero esconder 580
// fichas por un reinicio de la PC seria peor que enseñarlas un rato mas.
function lineaDesdeControl(p, ahora = Date.now(), margenMs = 5 * 60_000){
  if (!p || typeof p !== 'object') return null;
  const status = String(p.status || p.state || '').toLowerCase();
  const visto = Date.parse(String(p.host_last_seen_at || ''));
  return {
    numero: soloDigitos(p.connected_phone),
    vinculado: status === 'connected' || status === 'connecting',
    pausado: p.paused === true,
    motivoPausa: String(p.pause_reason || ''),
    transporte: String(p.transport_mode || ''),
    hostVivo: Number.isFinite(visto) ? ahora - visto <= margenMs : true,
  };
}
// El espejo (crm_channel_state) tiene lo que puede ver cualquiera; bridgeStatus, que exige
// admin, tiene ademas el codigo de vinculacion y los contadores del historial. Esto junta las
// dos: lo del espejo manda porque llega en vivo, y lo que solo trae crmApi se conserva.
//
// host_online no viene en el espejo, se deduce del latido. El espejo recorta ese latido al
// minuto --para no escribir una vez cada 10 s-- asi que con menos de 3 minutos de margen una PC
// viva se leeria como caida solo por el redondeo.
const CAMPOS_ESPEJO = ['status', 'connected_phone', 'paused', 'pause_reason', 'transport_mode',
  'link_platform', 'history_sync_status', 'history_sync_progress', 'bot_enabled',
  'last_linked_phone', 'previous_linked_phone', 'line_changed_at', 'host_last_seen_at'];
function controlConEspejo(previo, p, ahora = Date.now(), margenMs = 3 * 60_000){
  if (!p || typeof p !== 'object') return previo || {};
  const copia = {};
  for (const k of CAMPOS_ESPEJO) if (p[k] !== undefined) copia[k] = p[k];
  const visto = Date.parse(String(p.host_last_seen_at || ''));
  if (Number.isFinite(visto)) copia.host_online = ahora - visto <= margenMs;
  return { ...(previo || {}), ...copia };
}
function lineaDe(c){ return soloDigitos(c?.business_number); }
// 'viva' | 'desconocido' | 'sin_puente' | 'otra_linea' | 'pausada'. Solo aplica a WhatsApp Web.
function estadoQr(c, linea){
  if (canalDe(c) !== 'whatsapp_qr') return 'viva';
  if (!linea) return 'desconocido';
  if (!linea.vinculado || !linea.hostVivo) return 'sin_puente';
  // Sin numero conectado o sin numero en la ficha no se puede comparar: no se esconde por eso.
  // El servidor rechaza igual el envio.
  if (linea.numero && lineaDe(c) && lineaDe(c) !== linea.numero) return 'otra_linea';
  if (linea.pausado) return 'pausada';
  return 'viva';
}
// Una conversacion del segundo numero cuya linea no esta conectada esta muerta: por ahi no entra
// ni sale nada, y dejarla en la lista invita a escribirle a alguien que no va a recibirlo. Se
// esconde, pero NO se borra: el filtro de su linea la trae, y reaparece sola al volver a vincular.
// La pausa NO esconde: la linea sigue recibiendo y se reanuda con un boton.
function oculta(c){
  const e = estadoQr(c, LINEA_QR);
  return e === 'otra_linea' || e === 'sin_puente';
}
function claveOculta(c){ return lineaDe(c) || 'sin_numero'; }
// Ignorada: la marca la pone el servidor (accion 'ignore') y es lo unico que se mira. Va antes que
// la linea: una ignorada no cuenta ni como oculta, porque tampoco vuelve al vincular su numero.
function ignorada(c){ return !!c?.ignored_at; }

// --- Instagram y Messenger ocultos ---------------------------------------------------------
//
// Esas dos redes se atienden en la bandeja de Meta, no aqui: la app sigue en modo Desarrollo y
// por el CRM no entra casi nada. Se ESCONDEN, no se borran: no se quita ni una ficha ni una
// linea del codigo de conectarlas, y el interruptor de Configuracion las devuelve enteras.
//
// REDES_ACTIVAS arranca en false a proposito. Mientras el servidor no conteste, lo que el dueno
// pidio es que no esten; al reves --ensenarlas y hacerlas desaparecer un segundo despues-- se
// lee como que el panel pierde conversaciones solo.
//
// Vive aqui, pegado al filtro, y no arriba junto a CONVS porque las pruebas recortan ESTE tramo
// del panel y lo ejecutan de verdad: lo que el filtro lee tiene que estar declarado dentro.
let REDES_ACTIVAS = false;
let CONVS_REDES = [];
// Se compara el source EXACTO y no canalDe: canalDe clasifica por subcadenas ('ig', 'fb'), asi
// que un source raro como 'migration_ig' se escondria sin ser de ninguna red. Ensenar de mas es
// mejor error que esconder de mas.
function redOculta(c){
  if (REDES_ACTIVAS === true) return false;
  const s = String(c?.source || '').toLowerCase();
  return s === 'instagram' || s === 'facebook';
}
function recalculaVisibles(){
  CONVS = CONVS_TODAS.filter(c => !ignorada(c) && !oculta(c) && !redOculta(c));
  CONVS_OCULTAS = CONVS_TODAS.filter(c => !ignorada(c) && oculta(c));
  CONVS_REDES = CONVS_TODAS.filter(c => !ignorada(c) && !oculta(c) && redOculta(c));
  CONVS_IGNORADAS = CONVS_TODAS.filter(ignorada);
}
// El interruptor puede cambiarse en Configuracion o desde otra pestana. Cuando llega distinto, la
// bandeja se rehace sola: tener que recargar para ver aparecer o desaparecer conversaciones es
// justo lo que hace creer que esconder fue borrar.
function fijaRedesActivas(activas){
  const nueva = activas === true;
  if (nueva === REDES_ACTIVAS) return;
  REDES_ACTIVAS = nueva;
  recalculaVisibles();
  if (vistaActual === 'conversations') pintaChats();
  if (vistaActual === 'dashboard') pintaDashboard();
  if (vistaActual === 'funnel') { pintaKanban(); pintaMovilizacion(); }
  pintaCuentas();
}
// Las busquedas por id miran tambien las ocultas, las de redes y las ignoradas: desde la Agenda,
// un aviso o la ficha se tiene que poder abrir una conversacion aunque no salga en la bandeja, y
// la ficha de una que se acaba de ignorar tiene que seguir refrescandose.
function buscaConv(id){
  const k = String(id ?? '');
  const igual = x => String(x._id || x.id) === k;
  return CONVS.find(igual) || CONVS_OCULTAS.find(igual)
    || CONVS_REDES.find(igual) || CONVS_IGNORADAS.find(igual);
}
const MOTIVO_PAUSA = {
  vinculacion: 'Se pausaron solos al vincular la línea y se reanudan cuando la conexión queda estable.',
  manual: 'Los pausó una persona desde el panel.',
  calidad: 'Se pausaron solos porque WhatsApp rechazó varios envíos seguidos: revisa el número antes de reanudar.',
};
// Por que no se puede escribir en este chat, con la causa real. Pura: el compositor y el guard
// del boton de enviar leen lo mismo.
function avisoLineaQr(c, linea){
  const estado = estadoQr(c, linea);
  if (estado === 'otra_linea') return { estado, bloquea:true, titulo:'Línea desvinculada.',
    texto:'Chat de la línea ' + telefonoLegible(lineaDe(c)) + ', que ya no está vinculada (ahora '
      + telefonoLegible(linea.numero) + '). Solo lectura; vuelve a activarse si se vincula ese número.' };
  if (estado === 'sin_puente') return !linea.vinculado
    ? { estado, bloquea:true, titulo:'WhatsApp Web sin vincular.',
        texto:'No hay ninguna línea de WhatsApp Web conectada: por aquí no entra ni sale nada. Vincúlala en Canales.' }
    : { estado, bloquea:true, titulo:'La PC del puente no responde.',
        texto:'Hace más de 5 minutos que el programa del puente no da señales: lo que escribas no saldría. Revisa la PC del negocio.' };
  if (estado === 'pausada') return linea.transporte && linea.transporte !== 'active'
    ? { estado, bloquea:true, titulo:'Envíos en modo seguro.',
        texto:'Esta línea todavía no tiene los envíos activados. Actívalos en Canales («Activar envíos de este número»).' }
    : { estado, bloquea:true, reanudar:true, titulo:'Envíos en pausa.',
        texto:(MOTIVO_PAUSA[linea.motivoPausa] || 'No consta el motivo de la pausa.') + ' Reanudar requiere un administrador.' };
  return { estado, bloquea:false, titulo:'', texto:'' };
}
// Por que no se puede escribir en un chat de una red oculta. Pura, igual que avisoLineaQr: el
// compositor y el guard del boton de enviar leen exactamente lo mismo.
function avisoRedOculta(c){
  if (!redOculta(c)) return { bloquea:false, titulo:'', texto:'' };
  const red = String(c?.source || '').toLowerCase() === 'instagram' ? 'Instagram' : 'Messenger';
  return { bloquea:true, red, titulo: red + ' está oculto en el CRM.',
    texto:'Por aquí no sale nada: se contesta en la bandeja de Meta (menú, debajo de '
      + 'Conversaciones). Para volver a atenderlo desde el CRM, actívalo en Configuración.' };
}

function filtradas(){
  const t = ($('buscaChat')?.value || '').trim().toLowerCase();
  // 'lin:<numero>' es la salida de las ocultas: sin ella esconder seria borrar.
  const lin = filtro.startsWith('lin:') ? filtro.slice(4) : null;
  // Y 'can:instagram' / 'can:facebook' es la salida de las redes ocultas, por lo mismo. El filtro
  // del canal las trae aunque no esten en CONVS, en solo lectura.
  const red = filtro.startsWith('can:') && CONVS_REDES.some(c => canalDe(c) === filtro.slice(4));
  // 'ignorados' es la salida de las ignoradas. Y una busqueda por texto en Todos tambien las
  // encuentra, marcadas: si el dueno busca a alguien por su nombre tiene que ver que esta ignorado
  // (y poder deshacerlo) en vez de creer que esa conversacion no existe.
  const base = filtro === 'ignorados' ? CONVS_IGNORADAS
    : lin !== null ? CONVS_OCULTAS.filter(c => claveOculta(c) === lin)
    : red ? CONVS_REDES
    : t && filtro === 'todos'
      ? [...CONVS, ...CONVS_IGNORADAS].sort((a, b) => String(b.last_message_at || '').localeCompare(String(a.last_message_at || '')))
      : CONVS;
  return base.filter(c => {
    if (filtro === 'sinleer' && !(Number(c.unread || 0) > 0)) return false;
    if (filtro === 'humano' && !(c.mode === 'human' || c.human_handoff_required)) return false;
    if (filtro === 'bot' && c.mode !== 'bot') return false;
    if (filtro.startsWith('etq:') && !etiquetasDe(c).includes(filtro.slice(4))) return false;
    if (filtro.startsWith('can:') && canalDe(c) !== filtro.slice(4)) return false;
    if (!t) return true;
    return (nombreDe(c) + ' ' + (c.wa_phone||'') + ' ' + (c.last_message_preview||'')).toLowerCase().includes(t);
  });
}
function pintaChats(){
  const cont = $('chats'); if (!cont) return;
  // Las cuentas cuentan lo MISMO que se ve. Un filtro que dice 12 y abre 8 se lee como
  // que el panel perdio cuatro conversaciones.
  // Si la linea de un filtro 'lin:' ya volvio (se vinculo ese numero), el filtro no tiene nada que
  // ensenar: se vuelve a Todos en vez de dejar la lista vacia sin explicacion.
  if (filtro.startsWith('lin:') && !CONVS_OCULTAS.some(c => claveOculta(c) === filtro.slice(4))) filtro = 'todos';
  // Lo mismo con 'Ignorados' cuando ya no queda ninguna (se deshizo la ultima).
  if (filtro === 'ignorados' && !CONVS_IGNORADAS.length) filtro = 'todos';
  const cuenta = f => CONVS.filter(c =>
    f === 'todos' ? true
    : f === 'sinleer' ? Number(c.unread||0) > 0
    : f === 'humano' ? (c.mode === 'human' || c.human_handoff_required)
    : c.mode === 'bot').length;
  // Las etiquetas se añaden como filtros detras de los fijos: son las que el equipo
  // inventa, y sin poder filtrar por ellas no sirven para nada.
  // Antes entraban TODAS, y con el etiquetado automatico son decenas: la fila de filtros
  // se volvia un scroll interminable donde no se encontraba nada. Se aplica aqui la misma
  // regla que ya rige para los canales, dos lineas mas abajo: una etiqueta que solo marca
  // una conversacion no es un filtro, es ruido. Las raras siguen viendose y poniendose en
  // la ficha del lead; lo que no hacen es competir por el sitio de las que se usan.
  // Si el negocio eligio cuales quiere en la barra, mandan esas y en el orden que las
  // eligio. El automatico solo entra cuando no ha elegido ninguna: acierta a menudo, pero
  // la etiqueta que importa esta semana no tiene por que ser la mas usada del historico.
  const porEtiqueta = etiquetasEnLaBarra().map(e => ['etq:' + e, e]);
  // Solo se ofrecen los canales que de verdad tienen conversaciones: un filtro que
  // siempre devuelve cero es ruido.
  const porCanal = Object.keys(CANALES)
    .filter(k => CONVS.some(c => canalDe(c) === k))
    .map(k => ['can:' + k, CANALES[k].corto]);
  // Una salida por cada linea oculta, con su numero entero y por que no sale en Todos: sin esto,
  // esconder seria borrar. 'desvinculado' si es otro numero que el conectado; 'inactivo' si es
  // la propia linea con el puente caido.
  const ocultasPorLinea = new Map();
  CONVS_OCULTAS.forEach(c => ocultasPorLinea.set(claveOculta(c), (ocultasPorLinea.get(claveOculta(c)) || 0) + 1));
  const porLinea = [...ocultasPorLinea.keys()].map(k => ['lin:' + k, 'WA Web '
    + (k === 'sin_numero' ? 'sin número' : telefonoLegible(k)) + ' · '
    + (LINEA_QR?.numero && k !== LINEA_QR.numero ? 'desvinculado' : 'inactivo')]);
  // Instagram y Messenger ocultos NO ponen chip fijo en la barra: dejarlo ahi seria esconderlos a
  // medias. Pero mientras SU filtro esta puesto --se llega desde Canales-- el chip tiene que
  // verse y decir por que ensena cosas que no salen en Todos, igual que 'WA Web · inactivo'.
  const redesOcultasEnBarra = new Map();
  CONVS_REDES.forEach(c => redesOcultasEnBarra.set(canalDe(c), (redesOcultasEnBarra.get(canalDe(c)) || 0) + 1));
  const porRedOculta = filtro.startsWith('can:') && redesOcultasEnBarra.has(filtro.slice(4))
    ? [[filtro, (CANALES[filtro.slice(4)]?.corto || filtro.slice(4)) + ' · oculto']] : [];
  // La salida de las ignoradas, solo si hay alguna. Dice cuantas tienen mensajes sin leer: una
  // persona ignorada que vuelve a escribir (un colega que ahora quiere contratar) no suena ni
  // cuenta en ningun sitio, y este es el unico lugar donde se ve.
  const ignSinLeer = CONVS_IGNORADAS.filter(c => Number(c.unread || 0) > 0).length;
  const porIgnoradas = CONVS_IGNORADAS.length
    ? [['ignorados', 'Ignorados' + (ignSinLeer ? ' · ' + ignSinLeer + ' sin leer' : '')]] : [];
  $('filtros').innerHTML = [['todos','Todos'],['sinleer','Sin leer'],['humano','Humano'],['bot','Bot'],
      ...porCanal, ...porRedOculta, ...porLinea, ...porIgnoradas, ...porEtiqueta]
    .map(([f,n]) => {
      const n2 = f.startsWith('etq:') ? CONVS.filter(c => etiquetasDe(c).includes(f.slice(4))).length
        : f.startsWith('can:') ? (redesOcultasEnBarra.get(f.slice(4))
            || CONVS.filter(c => canalDe(c) === f.slice(4)).length)
        : f.startsWith('lin:') ? (ocultasPorLinea.get(f.slice(4)) || 0)
        : f === 'ignorados' ? CONVS_IGNORADAS.length
        : cuenta(f);
      // La x va en TODAS las de etiqueta. La primera version solo la ponia cuando ya habia
      // lista elegida, y como en automatico nunca la hay, no aparecia nunca: el dueno paso el
      // cursor por encima y no salio nada. Quitar una en automatico deja fijada la lista
      // actual menos esa, que es exactamente lo que espera quien pulsa la x.
      const quitable = f.startsWith('etq:');
      return '<button class="filtro' + (filtro===f?' on':'') + (f.startsWith('etq:')?' etqf':'')
        + '" data-filtro="' + esc(f) + '">' + esc(n) + '<b>' + n2 + '</b>'
        + (quitable ? '<i class="quitaetq" data-quitaetq="' + esc(f.slice(4))
            + '" title="Quitar de la barra" aria-label="Quitar ' + esc(n) + ' de la barra">×</i>' : '')
        + '</button>';
    }).join('')
    // El + va al final, siempre. Elegir que etiquetas se ven estaba solo en Configuracion,
    // a cuatro clics de donde se usan: quien filtra esta mirando la barra, no los ajustes.
    + '<button class="filtro masetq" id="masEtq" title="Elegir etiquetas de la barra" '
    +   'aria-label="Elegir etiquetas de la barra">+</button>';

  const filas = filtradas();
  if (!filas.length) {
    cont.innerHTML = '<div style="padding:26px 16px;color:var(--mut);font-size:13px;text-align:center">'
      + 'No hay conversaciones con este filtro.</div>';
    return;
  }
  cont.innerHTML = filas.map(c => {
    const n = nombreDe(c), sinLeer = Number(c.unread || 0) > 0;
    const marcas = [];
    if (ignorada(c)) marcas.push('<span class="etiqueta ign">ignorada · ' + esc(TIPOS_IGNORAR[c.ignored_kind] || 'otro') + '</span>');
    if (c.lifecycle_stage) marcas.push('<span class="etiqueta">' + esc(c.lifecycle_stage) + '</span>');
    if (c.proactive_blocked_at) marcas.push('<span class="etiqueta">sin automatización</span>');
    else if (c.mode === 'human' || c.human_handoff_required) marcas.push('<span class="etiqueta">humano</span>');
    if (sinLeer) marcas.push('<span class="globito">' + Number(c.unread) + '</span>');
    const canal = CANALES[canalDe(c)];
    return '<div class="chat' + (sel && sel._id === c._id ? ' on' : '') + (sinLeer ? ' sinleer' : '')
      + '" data-conv="' + esc(c._id) + '">'
      + '<button class="marcar' + (LOTE.has(c._id) ? ' on' : '') + '" aria-label="Seleccionar"></button>'
      + '<div class="avwrap">' + avatarDe(c, n)
      +   '<span class="canalpin" title="' + esc(canal.nombre) + '" '
      +     'style="background:' + canal.color + '">' + canal.logo + '</span></div>'
      + '<div class="cuerpo">'
      +   '<div class="fila1"><div class="nom">' + esc(n) + '</div>'
      +     '<div class="hora">' + esc(hora(c.last_message_at)) + '</div></div>'
      +   '<div class="prev">' + esc(c.last_message_preview || '') + '</div>'
      +   '<div class="marcas">' + marcas.join('') + '</div>'
      + '</div></div>';
  }).join('');
  resuelveAvatares();
}

function abre(c){
  if (!c) return;
  // Cortar la grabacion ANTES de cambiar de chat. El encoder termina en asincrono y su
  // callback empuja el audio a la cola global: si mientras tanto se abrio otra
  // conversacion, la nota de voz sale hacia el cliente equivocado. Lo mismo con la cola
  // de adjuntos y la cita: son de la conversacion que se esta dejando atras.
  abortaGrabacion();
  COLA.length = 0;
  citando = null;
  sel = c;
  document.body.classList.add('chat-abierto');
  $('sinChat').style.display = 'none';
  $('conversacion').style.display = 'flex';
  // Un chat de una red oculta se abre en SOLO LECTURA: el historial entero sigue a la vista y el
  // compositor no. No se quita del HTML --cableaChat cablea esos nodos-- sino que lo esconde el
  // CSS, y pintaAvisoLinea pinta la razon con el enlace a la bandeja de Meta.
  $('conversacion').classList.toggle('sin-envio', redOculta(c));
  // En pantalla estrecha la ficha es un panel superpuesto que taparia el chat entero:
  // ahi arranca cerrada y se abre con el boton de la cabecera.
  const anchaBastante = window.innerWidth > 1080;
  $('ficha').style.display = anchaBastante ? 'flex' : 'none';
  $('ficha').classList.toggle('on', anchaBastante);
  const n = nombreDe(c);
  $('conversacion').innerHTML =
    '<div class="cabecera">'
    + '<div class="avwrap">' + avatarDe(c, n)
    +   '<span class="canalpin" title="' + esc(CANALES[canalDe(c)].nombre) + '" '
    +     'style="background:' + CANALES[canalDe(c)].color + '">' + CANALES[canalDe(c)].logo + '</span></div>'
    + '<div class="quien-chat"><b>' + esc(n) + '</b><span>+' + esc(c.wa_phone || '')
    +   ' · ' + esc(CANALES[canalDe(c)].corto) + insigniaAnuncio(c) + '</span></div>'
    + (c.human_handoff_notification_status ? '<span class="etiqueta" data-aviso-handoff="1" title="Aviso interno al teléfono de avisos (Configuración), por la línea de WhatsApp Web conectada. Enviado no significa leído.">'
      + esc(({pending:'Aviso pendiente',sent:'Aviso enviado',failed:'Aviso fallido',skipped:'Aviso no enviado'})[c.human_handoff_notification_status] || 'Aviso pendiente') + '</span>' : '')
    + '<button class="modo" id="btnModo"></button>'
    + '<button class="adj" id="verFicha" title="Ficha del lead" aria-label="Ficha del lead">'
    +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v.01M11 12h1v4h1"/></svg></button>'
    + '<div class="mas" id="mas"><button aria-label="Más opciones">⋯</button>'
    +   '<div class="menu"><button data-mas="recordar">Añadir recordatorio</button>'
    +   '<button data-mas="encuesta">Enviar encuesta</button>'
    +   '<button data-mas="asistente">Preguntar al asistente</button>'
    +   '<button data-mas="cerrar">Cerrar conversación</button></div></div>'
    + '</div>'
    + '<div class="mensajes" id="mensajes"></div>'
    + '<div class="ventana24" id="ventana24" hidden></div>'
    + '<div class="ventana24" id="avisoLinea" hidden></div>'
    + '<div class="barra-cita" id="barraCita" hidden>'
    +   '<div class="cvertical"></div><div class="ctexto"></div>'
    +   '<button id="citaX" aria-label="Quitar la cita">×</button></div>'
    + '<div class="escribir">'
    +   '<div class="adjuntos">'
    +     '<button class="adj" id="adjImg" title="Enviar imágenes" aria-label="Enviar imágenes">'
    +       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button>'
    +     '<button class="adj hd" id="adjHd" title="HD: envía la imagen sin comprimir" aria-pressed="false">HD</button>'
    +     '<button class="adj" id="adjDoc" title="Enviar documento" aria-label="Enviar documento">'
    +       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg></button>'
    +     '<button class="adj" id="adjRapida" title="Respuestas rápidas" aria-label="Respuestas rápidas">'
    +       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2L4.5 13H11l-1 9 8.5-11H12l1-9z"/></svg></button>'
    +     '<button class="adj" id="adjCombo" title="Combos por categoría" aria-label="Combos">'
    +       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7l-8-4-8 4 8 4 8-4z"/><path d="M4 12l8 4 8-4M4 17l8 4 8-4"/></svg></button>'
    +     (esOficial(c)
        ? '<button class="adj" id="adjTpl" title="Plantillas de WhatsApp" aria-label="Plantillas">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg></button>'
        : '')
    +     '<button class="adj" id="adjMic" title="Grabar audio" aria-label="Grabar audio">'
    +       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/></svg></button>'
    +     '<input type="file" id="fImg" accept="image/*" multiple hidden>'
    +     '<input type="file" id="fDoc" multiple hidden>'
    +   '</div>'
    +   '<div class="grabando" id="grabando" hidden>'
    +     '<span class="pulso"></span><span id="reloj">0:00</span>'
    +     '<canvas id="ondas" aria-hidden="true"></canvas>'
    +     '<button id="recEnviar" class="btn-solido" style="padding:6px 14px">Enviar</button>'
    +     '<button id="recCancelar" class="btn-linea" style="padding:6px 12px">Cancelar</button>'
    +   '</div>'
    +   '<textarea id="texto" rows="1" placeholder="Escribe tu respuesta…"></textarea>'
    +   '<button class="enviar" id="btnEnviar" aria-label="Enviar">'
    +   '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>'
    +   '</button></div>'
    + '<div class="cola" id="cola" hidden></div>';
  // La foto de la cabecera, si es del 2.o numero y aun no esta en cache.
  resuelveAvatares();
  cableaChat(c);
  pintaAvisoLinea();
  pintaFicha(c);
  escuchaMensajes(c.id || c._id);
  marcaLeido(c);
  pintaChats();
}

// La cabecera del chat abierto, repintada sin volver a montarlo. `sel` es una copia de la ficha
// tomada al abrir y ningun snapshot la tocaba: la foto de perfil que el puente acababa de
// guardar, el nombre corregido desde la ficha o el aviso de atencion humana solo aparecian al
// cambiar de chat y volver. Se repinta SOLO lo que cambia, no el chat entero: rehacerlo perderia
// el texto a medio escribir, los adjuntos en cola y la posicion del hilo.
function pintaCabeceraChat(){
  const cab = $('conversacion')?.querySelector('.cabecera');
  if (!cab || !sel) return;
  const n = nombreDe(sel), k = canalDe(sel);
  const av = cab.querySelector('.avwrap');
  if (av) av.innerHTML = avatarDe(sel, n)
    + '<span class="canalpin" title="' + esc(CANALES[k].nombre) + '" '
    + 'style="background:' + CANALES[k].color + '">' + CANALES[k].logo + '</span>';
  const quien = cab.querySelector('.quien-chat');
  if (quien) quien.innerHTML = '<b>' + esc(n) + '</b><span>+' + esc(sel.wa_phone || '')
    + ' · ' + esc(CANALES[k].corto) + insigniaAnuncio(sel) + '</span>';
  const previo = cab.querySelector('[data-aviso-handoff]');
  const estado = sel.human_handoff_notification_status;
  if (!estado) { if (previo) previo.remove(); }
  else {
    const et = previo || document.createElement('span');
    et.className = 'etiqueta';
    et.dataset.avisoHandoff = '1';
    et.title = 'Aviso interno al teléfono de avisos (Configuración), por la línea de WhatsApp Web conectada. Enviado no significa leído.';
    et.textContent = ({pending:'Aviso pendiente',sent:'Aviso enviado',failed:'Aviso fallido',skipped:'Aviso no enviado'})[estado] || 'Aviso pendiente';
    if (!previo && quien) quien.after(et);
  }
  // La foto nueva se pide en cuanto se ve, igual que en la lista.
  resuelveAvatares();
}

// El boton de modo dice quien atiende. Lo pinta el chat al abrirse y tambien el snapshot: si el
// servidor pasa la conversacion a humano --lo hace solo cuando el cliente pide una persona-- el
// boton seguia diciendo "Bot atiende", y pulsarlo la devolvia al bot, que es lo contrario de lo
// que esperaba quien lo pulso.
function pintaModoChat(){
  const modo = $('btnModo');
  if (!modo || !sel) return;
  modo.textContent = (sel.mode === 'human' || sel.human_handoff_required) ? 'Humano atiende' : 'Bot atiende';
}

// Lo que cambia en la conversacion abierta, sin recargar y sin volver a montar el chat. Se llama
// desde el snapshot de conversaciones.
//
// No se repinta en cada snapshot: la lista se repinta constantemente (cada vista previa, cada
// contador) y repintar la ficha en cada una tiraria el desplegable abierto. Se compara una firma
// de los campos que se VEN, sin los que cambian por cualquier mensaje.
const CAMPOS_VOLATILES = new Set(['last_message_at', 'last_message_preview', 'last_inbound_preview',
  'updated_at', 'unread']);
function firmaConv(c){
  return JSON.stringify(Object.keys(c || {}).filter(k => !CAMPOS_VOLATILES.has(k)).sort()
    .map(k => [k, c[k]]));
}
function refrescaSeleccion(){
  if (!sel) return;
  const fresco = buscaConv(sel._id || sel.id);
  if (!fresco || fresco === sel) return;
  const cambia = firmaConv(fresco) !== firmaConv(sel);
  // El panel baja el "sin leer" al abrir el chat y el servidor lo confirma despues: sin esto, el
  // primer snapshot devolveria el globito que ya se habia apagado.
  const leido = !Number(sel.unread || 0);
  // El MISMO objeto, para que los cierres del compositor y del boton de modo sigan valiendo.
  Object.assign(sel, fresco);
  if (leido) sel.unread = 0;
  if (!cambia) return;
  pintaCabeceraChat();
  pintaModoChat();
  pintaVentana24();
  pintaAvisoLinea();
  // La ficha NO se repinta mientras alguien escribe en ella: le borraria lo tecleado a media
  // frase. Queda pendiente y se repinta al salir del campo.
  const ficha = $('ficha');
  if (ficha && ficha.contains(document.activeElement)) {
    if (!refrescaSeleccion.esperando) {
      refrescaSeleccion.esperando = true;
      ficha.addEventListener('focusout', () => {
        refrescaSeleccion.esperando = false;
        if (sel) pintaFicha(sel);
      }, { once: true });
    }
    return;
  }
  pintaFicha(sel);
}

// El compositor dice por que no se puede escribir en este chat y no deja intentarlo. Antes se
// pintaba siempre, se escribia, y el rechazo llegaba despues traducido por "pulsa Reanudar",
// tambien en fichas de una linea que ya no esta vinculada, donde Reanudar no arregla nada.
// Se repinta sola cuando cambia la linea (fijaLineaQr).
function pintaAvisoLinea(){
  const caja = $('avisoLinea'); if (!caja || !sel) return;
  // La red oculta manda ANTES que la linea: un chat de Instagram no tiene linea de WhatsApp Web
  // que mirar, y avisoLineaQr diria que todo esta bien.
  const red = avisoRedOculta(sel);
  const av = red.bloquea ? red : avisoLineaQr(sel, LINEA_QR);
  for (const id of ['texto', 'btnEnviar', 'adjImg', 'adjHd', 'adjDoc', 'adjRapida', 'adjCombo', 'adjTpl', 'adjMic']) {
    const e = $(id); if (e) e.disabled = av.bloquea;
  }
  if (!av.bloquea) { caja.hidden = true; caja.innerHTML = ''; return; }
  caja.hidden = false;
  caja.innerHTML = '<div><b>' + esc(av.titulo) + '</b> ' + esc(av.texto) + '</div>'
    // El enlace a la bandeja de Meta va en el mismo aviso: decir "contesta en Meta" sin dar la
    // puerta obliga a buscarla, y quien busca acaba escribiendo por donde no debe.
    + (av.red ? enlaceMeta(av.red === 'Instagram' ? 'ig' : 'fb', 'Abrir ' + av.red + ' en Meta') : '')
    + (av.reanudar ? '<button id="avisoLineaReanudar">Reanudar envíos</button>' : '');
  const b = $('avisoLineaReanudar');
  if (b) b.onclick = async () => {
    b.disabled = true;
    const r = await llama({ action:'resumeBridge' });
    b.disabled = false;
    if (!r.ok) return avisa('No se pudo reanudar', r.error);
    if (r.bridge) fijaLineaQr(r.bridge, { enVivo:false });
    avisa('Envíos reanudados', 'Ya se puede escribir por esta línea.');
  };
}

// Abrir un chat lo marca como leido. Sin esto el globito y el contador del menu no bajan
// nunca: despues de trabajar toda la bandeja sigue diciendo que hay cinco pendientes, y
// el filtro "sin leer" deja de servir para saber que falta.
async function marcaLeido(c){
  if (!Number(c.unread || 0)) return;
  const antes = c.unread;
  c.unread = 0;             // baja ya, para que se sienta inmediato
  pintaCuentas();
  const r = await llama({ action:'updateLead', conversation_id: c.id || c._id, fields:{ unread: 0 } });
  // Si el servidor dijo que no, se devuelve el numero: un contador que miente es peor
  // que uno alto.
  if (!r.ok) { c.unread = antes; pintaCuentas(); pintaChats(); }
}

function cableaChat(c){
  const modo = $('btnModo');
  pintaModoChat();
  modo.onclick = async () => {
    const chatEnabled = sel?.mode === 'bot';
    const newMode = chatEnabled ? 'human' : 'bot';
    if (!sel.id && sel._id) sel.id = sel._id;
    modo.disabled = true;
    const r = await callFn({ action: 'mode', conversation_id: sel.id, mode: newMode });
    modo.disabled = false;
    if (!r.ok) return avisa('No se pudo cambiar', r.error);
    sel.mode = newMode; pintaModoChat();
    avisa(newMode === 'human' ? 'La atiendes tú' : 'Vuelve al bot',
      'El cambio se aplicará únicamente a esta conversación.');
  };
  const mas = $('mas');
  mas.querySelector('button').onclick = ev => { ev.stopPropagation(); mas.classList.toggle('on'); };
  // Antes se añadia un listener de documento en CADA apertura de conversacion, y cada
  // uno quedaba apuntando a un nodo ya destruido. Tras un rato de trabajo eran cientos.
  // Uno solo, delegado, y busca el menu que exista en ese momento.
  if (!cableaChat.cerrarMenu) {
    cableaChat.cerrarMenu = () => document.getElementById('mas')?.classList.remove('on');
    document.addEventListener('click', cableaChat.cerrarMenu);
  }
  mas.querySelector('.menu').onclick = async ev => {
    const b = ev.target.closest('[data-mas]'); if (!b) return;
    mas.classList.remove('on');
    if (b.dataset.mas === 'recordar') return abreRecordatorio(sel);
    // Abre un hilo del asistente sobre ESTE contacto. Es la unica forma en que el chat abierto
    // llega a Planificacion: abrir un chat ya no cambia el contacto de ningun hilo.
    if (b.dataset.mas === 'asistente') return preguntaAlAsistente(sel);
    if (b.dataset.mas === 'encuesta') { abreEncuesta(sel); } else {
      if (!confirm('¿Cerrar esta conversación?')) return;
      const r = await llama({ action:'updateLead', conversation_id: sel.id || sel._id,
        fields:{ status:'closed', lead_status:'cerrado' } });
      avisa(r.ok ? 'Conversación cerrada' : 'No se pudo cerrar', r.ok ? '' : r.error);
    }
  };
  cableaAdjuntos();
  cancelaCita();
  $('citaX').onclick = cancelaCita;
  const caja = $('texto'), env = $('btnEnviar');
  caja.addEventListener('input', () => {
    caja.style.height = 'auto';
    caja.style.height = Math.min(caja.scrollHeight, 150) + 'px';
  });
  caja.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); env.click(); }
  });
  env.onclick = async () => {
    const t = caja.value.trim();
    if (!t && !COLA.length) return;
    // La linea manda antes que nada: si por este chat no puede salir nada, se dice la causa real
    // y no se llama al servidor. El servidor lo rechazaria igual, con su propio codigo.
    const lineaChat = avisoLineaQr(sel, LINEA_QR);
    if (lineaChat.bloquea) return avisa('No se puede enviar', lineaChat.texto);
    // Lo mismo con Instagram y Messenger mientras esten ocultos: por ahi no sale nada. El
    // servidor lo rechaza igual con un 409 'social_oculto', pero enterarse despues de pulsar
    // Enviar es exactamente lo que ya paso con la linea desvinculada.
    const redChat = avisoRedOculta(sel);
    if (redChat.bloquea) return avisa('No se puede enviar', redChat.texto);
    // Fuera de la ventana de 24 h el envio no falla aqui: Meta lo acepta y lo rechaza
    // despues. Preguntar cuesta un clic; no preguntar costo cuatro mensajes que el
    // dueño creyo enviados. La plantilla es la unica via que si llega.
    if (canalDe(sel) !== 'whatsapp_qr' && (() => {
      const u = ultimoDelCliente();
      return !u || (Date.now() - u) / 3600000 >= 24;
    })()) {
      // El aviso tiene que hablar del canal que se esta usando. Decia "WhatsApp" y mandaba
      // al boton de Plantillas estando en un chat de Instagram, donde las plantillas NO
      // EXISTEN: son un producto de WhatsApp. Quien lo leia probaba la plantilla, no
      // funcionaba, y el CRM parecia roto cuando lo que fallaba era el consejo.
      const nombreRed = redSocial(sel);
      if (!confirm(nombreRed
        ? 'Han pasado más de 24 horas desde su último mensaje.'+'\n\n'
          + 'En ' + nombreRed + ' no hay plantillas. Se intentará por la vía de atención '
          + 'humana, que Meta permite hasta 7 días; con más tiempo lo va a rechazar.'
          + '\n\n'+'¿Intentarlo?'
        : 'Han pasado más de 24 horas desde su último mensaje.'+'\n\n'
          + 'WhatsApp no le va a entregar esto: saldrá con ⚠. Solo llega una plantilla '
          + 'aprobada (botón de Plantillas).'+'\n\n'+'¿Enviarlo de todas formas?')) {
        return;
      }
    }
    env.disabled = true;
    let fallo = null;
    // Los nombres de estas claves NO son opcionales: uploadMetaMedia lee media_b64 y
    // media_filename (firebase-functions/src/index.js:179-183). Con media_base64 la
    // subida devuelve null, outboundPayload cae a la rama de texto, y con una foto mas
    // texto sale SOLO el texto mientras el panel dice "enviado". Un fallo silencioso
    // hacia un cliente real.
    const conv = sel.id || sel._id;
    // El canal decide POR DONDE sale. Un chat que entro por WhatsApp Web no puede salir
    // por el API oficial: el servidor lo rechaza con "canal incorrecto".
    //
    // Y ya manda archivos. Este bloque decia "WhatsApp Web todavía no envía archivos" y
    // cortaba el envio, pero el puente sabia mandar imagen, audio y documento desde hacia
    // tiempo, y el almacenamiento existe desde el 09/09: el bloqueo se habia quedado solo.
    // Van por la misma cola, uno por mensaje, con el texto como pie del ultimo que lo admite.
    const porPuente = canalDe(sel) === 'whatsapp_qr';
    if (porPuente) {
      const pieEnQr = COLA.map(a => a.tipo).lastIndexOf('image') >= 0
        ? COLA.map(a => a.tipo).lastIndexOf('image')
        : COLA.map(a => a.tipo).lastIndexOf('document');
      let salieronQr = 0, falloQr = null;
      for (let i = 0; i < COLA.length && !falloQr; i++) {
        const a = COLA[i];
        const r = await llama({
          action:'bridgeQueue', conversation_id: conv,
          media_kind: a.tipo, media_b64: a.datos, media_filename: a.nombre, media_mime: a.mime,
          // Se manda la vista previa junto al archivo: el archivo se borra al enviarse y esto
          // es lo que deja el mensaje visible en el hilo. Ver miniaturaParaEnviar.
          ...(a.thumb ? { media_thumb_b64: a.thumb } : {}),
          body: (t && i === pieEnQr) ? t : '',
        });
        if (r.ok) {
          salieronQr++;
          // El servidor ya lo acepto: el globo se pinta AHORA, con reloj, en vez de esperar
          // a que el puente lo mande y lo guarde.
          apuntaEnviando({ conv, tipo: a.tipo, body: (t && i === pieEnQr) ? t : '', mime: a.mime, datos: a.datos });
        } else falloQr = r;
      }
      // Los que ya salieron se quitan, igual que en el oficial: reintentar no los repite.
      COLA.splice(0, salieronQr);
      pintaCola();
      if (!falloQr && t && pieEnQr < 0) {
        const r = await llama({ action:'bridgeQueue', conversation_id: conv, body: t });
        if (!r.ok) falloQr = r; else apuntaEnviando({ conv, tipo:'text', body: t });
      }
      env.disabled = false;
      // Con el codigo: el servidor dice si es otra linea, la PC, la pausa o el modo seguro.
      if (falloQr) return avisa('No se pudo enviar', traduceErrorMeta(falloQr.error, falloQr.code));
      caja.value = ''; caja.style.height = 'auto';
      cancelaCita();
      return;
    }
    // Instagram y Messenger ya reciben archivos: el servidor los guarda y le da a Meta un enlace
    // temporal para que los descargue. Lo que la red NO admite se dice ANTES de subir nada --el
    // servidor tambien lo rechaza, pero descubrirlo despues de esperar la subida es peor--, con
    // la misma tabla que usa el servidor (FORMATOS_RED).
    const claveRed = redSocial(sel) ? canalDe(sel) : null;
    if (claveRed) {
      const pega = COLA.map(a => problemaAdjuntoRed(claveRed, a)).find(Boolean);
      if (pega) {
        env.disabled = false;
        return avisa('No se puede enviar por ' + redSocial(sel), pega);
      }
    }
    // Por esas dos redes no salen botones (el servidor los rechaza con social_sin_botones), y
    // los combos los llevan. Perderlos sin decirlo es lo que ya se quito una vez: las opciones
    // se escriben al final del texto, que el cliente si recibe.
    const botonesRed = claveRed ? COLA.flatMap(a => Array.isArray(a.botones) ? a.botones : []) : [];
    const opcionesRed = [...new Set(botonesRed.map(b => String(b?.titulo || '').trim()).filter(Boolean))];
    const texto = opcionesRed.length
      ? [t, 'Responde: ' + opcionesRed.join(' / ')].filter(Boolean).join('\n\n')
      : t;
    // El audio no admite pie de foto en la API de WhatsApp: si va texto con una nota de
    // voz, el texto se pierde. Por eso el texto viaja con el ultimo adjunto que SI
    // admite pie, y si no hay ninguno se manda aparte.
    //
    // En Instagram y Messenger el archivo y el texto no pueden ir juntos: Meta no los admite en
    // el mismo mensaje. Con -1 todos los adjuntos salen sin pie ni botones, y el texto va
    // despues, aparte, por sendText.
    const ultimoConPie = claveRed ? -1 : (COLA.map(a => a.tipo).lastIndexOf('image') >= 0
      ? COLA.map(a => a.tipo).lastIndexOf('image')
      : COLA.map(a => a.tipo).lastIndexOf('document'));
    // Los que ya salieron se quitan de la cola SOBRE LA MARCHA. Si el tercero falla y
    // se reintenta sin esto, los dos primeros se le mandan al cliente otra vez.
    let enviados = 0;
    for (let i = 0; i < COLA.length && !fallo; i++) {
      const a = COLA[i];
      const r = await llama({
        action:'send', conversation_id: conv,
        media_kind: a.tipo, media_b64: a.datos, media_filename: a.nombre, media_mime: a.mime,
        body: (t && i === ultimoConPie) ? t : '',
        // Los botones exigen texto: si el pie fue a otro adjunto, este va sin nada que
        // decir y Meta rechazaria el mensaje entero. En ese caso se manda sin botones.
        ...(a.botones && t && i === ultimoConPie ? { botones: a.botones } : {}),
      });
      if (r.ok) enviados++; else fallo = r.error;
    }
    COLA.splice(0, enviados);
    pintaCola();
    const textoYaFue = t && ultimoConPie >= 0 && !fallo;
    if (!fallo && texto && !textoYaFue) {
      const cuerpo = { action:'sendText', conversation_id: conv, body:texto };
      // La cita se manda con el wamid del original: asi WhatsApp la enlaza de verdad
      // en el telefono del cliente, en vez de pegar el texto citado a mano.
      if (citando?.wamid) {
        cuerpo.reply_to_wamid = citando.wamid;
        cuerpo.reply_snippet = String(citando.body || '').slice(0, 200);
        cuerpo.reply_sender = citando.direction === 'in' ? 'customer' : 'agent';
      }
      const r = await llama(cuerpo);
      if (!r.ok) fallo = r.error;
    }
    if (!fallo) cancelaCita();
    env.disabled = false;
    // La cola ya se vacio de lo que SI salio, arriba. Aqui solo se limpia el texto.
    //
    // Los errores de Instagram y Messenger ya vienen explicados por el servidor, en español.
    // traduceErrorMeta convierte cualquier texto con "24" en el consejo de las plantillas de
    // WhatsApp, que en esas redes no existen.
    if (fallo) return avisa('No se pudo enviar', claveRed ? fallo : traduceErrorMeta(fallo));
    caja.value = ''; caja.style.height = 'auto';
  };
}

// "Meta rechazo el envio" no le dice a nadie que hacer. Los motivos que de verdad se
// repiten se explican, y con la salida: casi siempre es la ventana de 24 h cerrada,
// que se resuelve con una plantilla.
function traduceErrorMeta(e, codigo){
  const t = String(e || '');
  // Los rechazos del puente van PRIMERO y por codigo. Antes caian en /pausado|modo seguro/ y todos
  // decian "pulsa Reanudar", tambien con la ficha de otra linea o con la PC apagada. Y el filtro
  // de las 24 h de abajo se come cualquier texto con un "24" (el 849-524-5620, por ejemplo).
  const puente = /^bridge_/.test(String(codigo || '')) ? String(codigo)
    : (t.match(/\bbridge_(?:other_number|host_offline|disconnected|paused|reconnect_only)\b/) || [''])[0];
  if (puente === 'bridge_other_number') return /l[ií]nea/i.test(t)
    ? t : 'Esta conversación es de otra línea de WhatsApp Web, que ya no está vinculada: por aquí no se le puede contestar.';
  if (puente === 'bridge_host_offline') return 'La PC del puente no responde: el mensaje saldría tarde, así que no '
    + 'se envió. Revisa que el programa del puente esté abierto en la PC del negocio.';
  if (puente === 'bridge_disconnected') return 'El WhatsApp Web no está conectado. Vincúlalo en Canales.';
  if (puente === 'bridge_paused') return 'Los envíos del WhatsApp Web están en pausa. Pulsa "Reanudar envíos" en Canales.';
  if (puente === 'bridge_reconnect_only') return 'El WhatsApp Web sigue en modo seguro: activa los envíos de este número en Canales.';
  // El 409 de una red oculta llega con su codigo y con un texto ya claro. Va aqui arriba para que
  // no lo pise la regla de las 24 h de mas abajo, que se queda con cualquier texto que lleve
  // un "24" y recomienda una plantilla donde no existen las plantillas.
  if (String(codigo || '') === 'social_oculto') return t
    || 'Esa red está oculta en el CRM: se contesta desde la bandeja de Meta.';
  // 'conversacion ... no existe' es del CRM, no de Meta. Con /no existe/ en la regla de abajo se
  // leia como "ese numero no tiene WhatsApp", que manda a dudar del cliente en vez de recargar.
  if (/conversaci[oó]n[\s\S]*no existe/i.test(t)) return 'Esta conversación ya no existe en el CRM. '
    + 'Recarga la lista: puede que se haya cerrado o fusionado.';
  // La ventana de 24 h es del API oficial. Antes bastaba un "24" en cualquier parte del texto
  // --el propio numero oficial, 18495245620, lo lleva-- para que el panel recomendara una
  // plantilla en un chat donde no hay ni ventana ni plantillas.
  if (/131047|re-?engagement|\b24\s?-?\s?(?:h|horas?|hours?)\b|ventana de 24/i.test(t))
    return 'Pasaron más de 24 h desde su último mensaje. Solo llega con una plantilla aprobada '
      + '(el botón de plantillas del compositor, en el número oficial).';
  if (/131026|not.*whatsapp/i.test(t)) return 'Ese número no tiene WhatsApp.';
  if (/131049|calidad|quality/i.test(t)) return 'Meta está limitando este número por calidad. '
    + 'Revisa Conexión WhatsApp.';
  if (/excluido|blocked/i.test(t)) return 'Este contacto está excluido de comunicaciones.';
  if (/seguimientos|followup_exhausted/i.test(t)) return 'Lleva dos seguimientos sin responder: '
    + 'quedó como desinteresado y no se le insiste más.';
  if (/transport|reconect/i.test(t)) return 'Meta no está conectada al transporte. Mira Canales.';
  if (/canal incorrecto/i.test(t)) return 'Este chat entró por otro canal. Se está enviando por la vía '
    + 'equivocada; mira Canales.';
  // "Pausado" y "desconectado" NO son lo mismo, y decirlo mal manda a arreglar lo que ya
  // funciona. Vinculado y en pausa se ve exactamente igual que sin vincular, y la salida es
  // distinta: uno se reanuda con un boton, el otro hay que volver a vincularlo entero.
  if (/pausado|modo seguro/i.test(t)) return 'El segundo WhatsApp está vinculado pero con los '
    + 'envíos en pausa. Pulsa "Reanudar envíos" en Canales.';
  if (/desconectado/i.test(t)) return 'El segundo WhatsApp no está conectado. Conéctalo en Canales.';
  if (/almacenamiento dedicado|bridge_media/i.test(t)) return 'WhatsApp Web todavía no envía archivos, '
    + 'solo texto.';
  return t;
}

/* ---- Adjuntos ------------------------------------------------------------ */
// Cola visible antes de enviar: lo que se manda a un cliente real se ve primero.
const COLA = [];
let modoHd = false;
// El tope real lo pone el servidor: uploadMetaMedia rechaza por encima de 16 MB ya
// decodificado (index.html del backend, linea 180). Poner 30 aqui solo conseguiria que
// el archivo se subiera entero para morir alla, asi que se corta antes.
const LIMITE_MB = () => (modoHd ? 15 : 12);

// Lo que admite cada red social. Es una COPIA de FORMATOS_SOCIAL
// (firebase-functions/src/transport-core.js): decide el servidor, y esto solo sirve para avisar
// antes de subir el archivo entero. Va en JSON estricto porque test/v2-adjuntos-redes.test.js
// la lee y exige que sea igual a la del servidor: si cambias una, cambia la otra.
//
// El tope de las redes es 8 MB, no LIMITE_MB: es donde corta Storage, y un archivo de 9 a 15 MB
// se subiria entero para acabar en un 413.
const TOPE_ADJUNTO_RED = 8 * 1024 * 1024;
const FORMATOS_RED = {
  "instagram": {
    "image": ["image/jpeg", "image/png"],
    "video": ["video/mp4", "video/quicktime", "video/webm", "video/ogg", "video/x-msvideo"],
    "audio": ["audio/aac", "audio/mp4", "audio/m4a", "audio/x-m4a", "audio/wav", "audio/x-wav", "audio/wave"],
    "document": ["application/pdf"]
  },
  "facebook": {
    "image": ["image/jpeg", "image/png", "image/gif"],
    "video": ["video/mp4", "video/quicktime", "video/webm"],
    "audio": ["audio/aac", "audio/mp4", "audio/m4a", "audio/x-m4a", "audio/wav", "audio/x-wav", "audio/wave", "audio/mpeg"],
    "document": []
  }
};

// Por que un adjunto de la cola NO puede salir por esa red, o '' si puede. Mismas reglas que
// adjuntoSocial en el servidor: un video o audio que entra por "documento" sale como lo que es,
// y Messenger manda como archivo lo que no reconoce (asi le llega la nota de voz OGG).
function problemaAdjuntoRed(red, a){
  const tabla = FORMATOS_RED[red];
  if (!tabla) return '';
  const nombre = red === 'instagram' ? 'Instagram' : 'Messenger';
  const peso = a.datos ? Math.floor(String(a.datos).length * 3 / 4) : Number(a.archivo?.size || 0);
  if (peso > TOPE_ADJUNTO_RED) return (a.nombre || 'El archivo') + ' pesa más de 8 MB, el máximo por ' + nombre + '.';
  const mime = String(a.mime || '').split(';')[0].trim().toLowerCase();
  const lista = tabla[a.tipo];
  if (!lista) return nombre + ' no admite ese tipo de archivo.';
  if (lista.includes(mime)) return '';
  if (a.tipo === 'document' && ['image', 'video', 'audio'].some(k => tabla[k].includes(mime))) return '';
  if (red === 'facebook') return '';
  if (a.tipo === 'audio') return 'Instagram no acepta las notas de voz grabadas aquí (son OGG). '
    + 'Grábala desde la app de Instagram, o adjunta un audio M4A, AAC o WAV.';
  return 'Instagram no acepta ' + (a.nombre || 'ese archivo') + ': solo imágenes JPEG o PNG, vídeo MP4, '
    + 'MOV o WEBM, audio M4A, AAC o WAV y documentos PDF.';
}

// Comprime cada imagen de la cola con el modo ACTUAL y actualiza su peso. Se llama al
// adjuntar y cada vez que se pulsa HD, para que el tamaño que se ve sea el que va a
// salir de verdad y no el del original.
async function recalculaCola(){
  for (const a of COLA) {
    if (a.tipo !== 'image' || !a.archivo) {
      if (!a.datos && a.archivo) { a.datos = await leeBase64(a.archivo); a.kb = Math.round(a.archivo.size/1024); }
      continue;
    }
    if (a.hd === modoHd && a.datos) continue;      // ya esta en el modo pedido
    let blob = modoHd ? await comprimeHd(a.archivo) : await comprimeNormal(a.archivo);
    // WhatsApp Cloud API solo acepta JPEG y PNG como imagen. Una WebP pequeña pasaba sin
    // recomprimir y Meta rechazaba el mensaje: asi salian los vestidos del catalogo, que la
    // web publica en WebP, y la clienta no veia ninguno.
    if (!/^image\/(jpe?g|png)$/i.test(blob.type || '')) {
      blob = (await aJpeg(await cargaImagen(blob), modoHd ? 2560 : 1600, 0.9)) || blob;
    }
    a.datos = await leeBase64(blob);
    a.mime = blob.type || a.archivo.type || 'image/jpeg';
    // Si se reencodeo, el nombre tiene que decir jpg: algunos visores se lian con un
    // .png que por dentro es jpeg.
    a.nombre = blob !== a.archivo
      ? String(a.archivo.name || 'imagen').replace(/\.[^.]+$/, '') + '.jpg'
      : a.archivo.name;
    a.kb = Math.round(blob.size / 1024);
    // La vista previa que se guarda con el mensaje enviado. El archivo que sale del CRM se
    // borra en cuanto el cliente lo recibe --no se guarda nada en la nube-- asi que sin esta
    // miniatura el hilo ensenaria una tarjeta sin imagen de lo que uno mismo acaba de mandar.
    // Baileys genera la suya al enviar si la PC tiene sharp; esta es el respaldo.
    a.thumb = await miniaturaParaEnviar(blob);
    a.hd = modoHd;
  }
  pintaCola();
}

// 96 px de lado largo y calidad media: unos 3-6 KB, que es lo que puede viajar en cada
// mensaje sin engordar el hilo (el panel escucha los ultimos 400). El tope se mide sobre el
// data URI entero, que es lo que se guarda y lo que miden el puente y el servidor: 12 KB de
// JPEG son 16 KB en base64, y el servidor los descartaria sin decir nada.
async function miniaturaParaEnviar(blob){
  try {
