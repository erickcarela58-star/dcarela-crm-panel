// Tarjeta unica de Instagram y Messenger mientras estan ocultos. Dice lo que hay GUARDADO --que no
// se borro nada--, por donde se atienden ahora y como traerlos de vuelta. Los recuentos salen de
// CONVS_REDES, que es exactamente lo que se escondio por ser de una red: esta tarjeta es el unico
// sitio del panel donde se ve que hay ahi dentro.
function notaRedesOcultas(){
  const resumen = clave => {
    const todas = CONVS_REDES.filter(c => canalDe(c) === clave);
    if (!todas.length) return null;
    const sinLeer = todas.filter(c => Number(c.unread || 0) > 0).length;
    const fechas = todas.map(c => String(c.last_customer_reply_at || '')).filter(Boolean).sort();
    const ultima = fechas[fechas.length - 1];
    const dias = ultima ? Math.floor((Date.now() - Date.parse(ultima)) / 86400000) : NaN;
    return { clave, total: todas.length, sinLeer,
      cuando: Number.isFinite(dias) ? (dias <= 0 ? 'hoy' : dias === 1 ? 'ayer' : 'hace ' + dias + ' días') : '' };
  };
  const filas = ['instagram', 'facebook'].map(resumen).filter(Boolean);
  // Que se guarde en silencio algo que nadie mira es el riesgo de esconder: por eso el "sin leer"
  // y el "último recibido" se dicen aqui, aunque no suenen en ningun otro sitio.
  const detalle = filas.length
    ? filas.map(f => '<b>' + esc(CANALES[f.clave].nombre) + ':</b> ' + f.total + ' conversación(es) guardadas'
        + (f.sinLeer ? ', ' + f.sinLeer + ' sin leer' : '')
        + (f.cuando ? ' · último recibido ' + esc(f.cuando) : '')
        + ' <button class="btn-linea" data-ver-ocultas="' + esc(f.clave) + '">Ver las ' + f.total + '</button>').join('<br>')
    : 'No hay ninguna conversación guardada de estas dos redes.';
  return '<div class="canal">'
    + '<div class="cabecera-canal">'
    +   '<span class="clogo" style="background:' + CANALES.instagram.color + '22;color:'
    +     CANALES.instagram.color + '">' + CANALES.instagram.logo + '</span>'
    +   '<div class="cinfo"><b>Instagram y Messenger</b><span>Se atienden en la bandeja de Meta</span></div>'
    +   '<i class="chip medio">ocultos</i>'
    + '</div>'
    + '<p class="cdetalle">' + detalle
    + '<br><b>No se borró nada.</b> Sus chats siguen guardados; lo que se quitó es la bandeja, los '
    + 'filtros, los contadores, el Dashboard y el poder escribir por ahí. La importación cada 6 h '
    + 'también está en pausa, así que al reactivarlos hay que pulsar «Importar historial».'
    + '<br>Para volver a atenderlos desde el CRM: <b>Configuración → Instagram y Messenger dentro '
    + 'del CRM</b>.</p>'
    + '<div class="cacciones">'
    +   ACCESOS_META.filter(a => a.id !== 'mp')
          .map(a => '<a class="btn-linea" href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">'
            + 'Abrir ' + esc(a.nombre) + ' en Meta ↗</a>').join('')
    // Las rutas de la bandeja de Business Suite no estan documentadas por Meta y pueden cambiar.
    // Si alguna deja de abrir donde debe, esto es la salida sin tener que publicar nada.
    +   (ACCESOS_META.length
          ? '<a class="btn-linea" href="' + esc(BANDEJA_META) + '" target="_blank" rel="noopener noreferrer">'
            + '¿No abrió la bandeja correcta? Bandeja general ↗</a>' : '')
    + '</div></div>';
}

async function pintaCanales(){
  const cont = $('canalesLista'); if (!cont) return;
  cont.innerHTML = '<p class="bajada"><span class="cargando"></span> Comprobando…</p>';

  const [estado, puente] = await Promise.all([
    llama({ action:'transportStatus' }),
    llama({ action:'bridgeStatus' }),
  ]);
  const t = estado.ok ? (estado.transport || estado) : {};
  const p = puente.ok ? (puente.bridge || puente) : {};
  bridgeControlState = p;
  // Esta vista ya sabe como esta la linea: se comparte con la bandeja por la MISMA formula que usa
  // la escucha en vivo. Antes aqui habia otra (con la pausa), que escondia las 580 fichas del
  // numero conectado solo por tener los envios en pausa.
  if (puente.ok) fijaLineaQr(p, { enVivo:false });

  // Las cuentas incluyen las ocultas: esta tarjeta es donde se mira que hay en cada canal.
  const cuenta = clave => CONVS_TODAS.filter(c => canalDe(c) === clave).length;
  // WhatsApp Web se cuenta por linea: "580 de 809-757-5644 · 37 ocultas de 809-478-5620". Junto,
  // un 617 no dice que 37 son de un numero que ya no esta vinculado.
  const resumenCuenta = clave => {
    if (clave !== 'whatsapp_qr' || !cuenta(clave)) return cuenta(clave) + ' conversación(es)';
    const agrupa = lista => {
      const m = new Map();
      lista.filter(c => canalDe(c) === clave).forEach(c => m.set(claveOculta(c), (m.get(claveOculta(c)) || 0) + 1));
      return [...m.entries()];
    };
    const nombre = k => k === 'sin_numero' ? 'sin número' : telefonoLegible(k);
    return [...agrupa(CONVS).map(([k, n]) => n + ' de ' + nombre(k)),
      ...agrupa(CONVS_OCULTAS).map(([k, n]) => n + ' ocultas de ' + nombre(k))].join(' · ');
  };
  // "Conectado" no quiere decir que llegue nada. Una red puede estar suscrita, con su token
  // vivo y su historial importado, y aun asi no entregar un solo mensaje nuevo -- que es
  // exactamente lo que pasa con Instagram y Messenger mientras la app siga sin publicar en
  // Meta. La tarjeta se veia en verde igual, y eso hace creer que el canal esta atendiendo
  // clientes cuando lleva meses mudo.
  //
  // La fecha del ultimo mensaje ENTRANTE no se puede discutir ni se queda vieja: si hoy
  // entra uno, se actualiza sola. Vale para los cuatro canales, no solo para las redes: un
  // WhatsApp callado tres semanas tambien es algo que hay que ver.
  const ultimoEntrante = (clave) => {
    const fechas = CONVS.filter(c => canalDe(c) === clave)
      .map(c => String(c.last_customer_reply_at || '')).filter(Boolean).sort();
    const ultima = fechas[fechas.length - 1];
    if (!ultima) return '';
    const dias = Math.floor((Date.now() - Date.parse(ultima)) / 86400000);
    if (!Number.isFinite(dias)) return '';
    return ' · último recibido ' + (dias <= 0 ? 'hoy' : dias === 1 ? 'ayer' : 'hace ' + dias + ' días');
  };

  // 'etiqueta' permite un cuarto estado cuando 'conectado / sin conectar / sin usar' no
  // alcanza. El caso real: vinculado pero en pausa, que salia como "sin conectar" -- y por eso
  // se volvia a vincular una y otra vez algo que solo necesitaba pulsar Reanudar.
  const tarjeta = (clave, listo, detalle, acciones, etiqueta) => {
    const d = CANALES[clave];
    return '<div class="canal">'
      + '<div class="cabecera-canal">'
      +   '<span class="clogo" style="background:' + d.color + '22;color:' + d.color + '">' + d.logo + '</span>'
      +   '<div class="cinfo"><b>' + esc(d.nombre) + '</b>'
      +     '<span>' + esc(resumenCuenta(clave)) + ultimoEntrante(clave) + '</span></div>'
      +   '<i class="chip ' + (etiqueta ? etiqueta.clase
      :     (listo === true ? 'ok' : listo === false ? 'mal' : 'medio')) + '">'
      +     (etiqueta ? esc(etiqueta.texto)
      :     (listo === true ? 'conectado' : listo === false ? 'sin conectar' : 'sin usar')) + '</i>'
      + '</div>'
      + '<p class="cdetalle">' + detalle + '</p>'
      + (acciones ? '<div class="cacciones">' + acciones + '</div>' : '')
      + '</div>';
  };

  // El estado de una red no es "hay conversaciones": es si la pagina esta suscrita. Sin
  // suscripcion Meta no manda un solo webhook, y la tarjeta decia "conectado" igual.
  // El estado viene de socialStatus, que devuelve solo lo que se puede enseñar. Los
  // tokens de usuario y de pagina se quedan en el servidor: sacarlos por la via generica
  // de datos habria puesto dos credenciales en el navegador.
  const est = await llama({ action:'socialStatus' });
  const redes = est.ok ? (est.redes || {}) : {};
  // El mismo interruptor que ve la bandeja. Si alguien lo cambio en otra pestana, entrar aqui lo
  // trae y la lista se rehace sola, igual que hace fijaLineaQr con el puente.
  if (est.ok) fijaRedesActivas(est.activas === true);
  // El resultado de una importacion vivia SOLO en un aviso que se borra a los 4,2 segundos,
  // y la importacion tarda unos veinte. O sea que quien pulsa el boton, mira a otro lado
  // mientras espera --que es lo que se hace-- y vuelve, no encuentra el resultado en ninguna
  // parte. Y si no entro ningun mensaje, la pantalla queda exactamente igual que antes: la
  // unica lectura posible es "no hizo nada". Paso de verdad, tres veces seguidas.
  //
  // Ahora el resultado se queda escrito en la tarjeta del canal hasta la siguiente.
  const tarjetaRed = (clave, estadoGuardado, detalle) => {
    const hay = cuenta(clave);
    const suscrita = estadoGuardado?.suscrita === true;
    const conectada = estadoGuardado?.conectado === true;
    const listo = suscrita ? true : (conectada || hay ? false : null);
    return tarjeta(clave, listo,
      detalle
      + (conectada && !suscrita
          ? '<br><b>Conectado pero sin suscribir:</b> Meta no va a mandar mensajes hasta que '
            + 'la página quede suscrita. Vuelve a iniciar sesión.'
          : suscrita
            ? '<br>Página <b>' + esc(estadoGuardado.page_name || estadoGuardado.page_id || '') + '</b> suscrita.'
              + (estadoGuardado.ultimo_sync_at
                  ? ' Último historial importado: ' + esc(String(estadoGuardado.ultimo_sync_at).slice(0,16).replace('T',' ')) + '.'
                  : ' Todavía no se ha importado el historial.')
              + (ULTIMA_IMPORTACION[clave] ? '<br>' + ULTIMA_IMPORTACION[clave] : '')
            : ''),
      '<button class="btn-linea" data-conecta="' + clave + '">'
      + (conectada ? 'Volver a iniciar sesión' : 'Iniciar sesión y dar permisos') + '</button>'
      + (conectada ? '<button class="btn-linea" data-sync="' + clave + '">Importar historial</button>' : ''));
  };

  const oficialListo = t.ready === true || t.state === 'ready';
  const estadoPuente = String(p.state || p.status || '').toLowerCase();
  const puenteVinculado = (p.connected === true || estadoPuente === 'connected' || estadoPuente === 'ready')
    && p.host_online !== false;
  const puenteVinculadoEnPausa = puenteVinculado && p.paused === true;
  const puenteListo = puenteVinculado && p.paused !== true;

  cont.innerHTML =
    tarjeta('whatsapp_cloud', oficialListo,
      oficialListo
        ? 'Número ' + esc(CFG.businessDisplayNumber || CFG.businessNumber || '') + '. Entregando mensajes.'
        : 'Meta no está conectada al transporte' + (t.last_error_code ? ' (error ' + esc(String(t.last_error_code)) + ')' : '')
          + '. Reconectar exige el App Secret y se hace con scripts/conectar_meta_firebase.ps1, no desde aquí.',
      '<button class="btn-linea" data-canal-bot="official">Bot de este canal: '
        + (estado.bot_enabled ? 'encendido' : 'apagado') + '</button>')

    // Vinculado-pero-en-pausa salia como "sin conectar", igual que sin vincular. El dueno
    // cerraba sesion y volvia a vincular una y otra vez para arreglar algo que solo necesitaba
    // un boton. Se distingue.
    + tarjeta('whatsapp_qr', puenteListo ? true : (cuenta('whatsapp_qr') ? false : null),
      (puenteListo
        ? 'Segundo número conectado por WhatsApp Web. <b>No hay ventana de 24 h ni plantillas</b>: '
          + 'se escribe como desde el teléfono, a cualquier contacto y en cualquier momento.'
        : puenteVinculadoEnPausa
        // El motivo lo guarda quien pausa (pause_reason). Sin el, la pausa de vincular --que se
        // levanta sola al quedar estable-- se veia igual que una por calidad, que no debe quitarse
        // sin revisar el numero.
        ? '<b>Vinculado, pero con los envíos en pausa.</b> '
          + esc(MOTIVO_PAUSA[p.pause_reason] || 'No consta el motivo: la pausa es de antes de que se guardara.') + ' '
          + 'Pulsa <b>Reanudar envíos</b> y ya se puede escribir por este número.'
        // Decia "no admite difusiones, solo conversacion dentro de la ventana normal". Las
        // dos cosas eran falsas y se contradecian con los frenos de difusion de dos lineas
        // mas abajo: WhatsApp Web SI hace envios masivos (wa-bridge/src/bulk.js) y NO tiene
        // ventana de 24 h -- esa es una regla del API oficial, no de WhatsApp Web. Quien lo
        // leia daba por hecho que no podia escribirle a un cliente de hace un mes.
        : 'Sin sesión activa. Este canal usa WhatsApp Web, no el API: <b>no hay ventana de '
          + '24 h ni plantillas</b>, se escribe como desde el teléfono.')
      // Los frenos no son un detalle: son la diferencia entre una campana y un numero
      // bloqueado. Se dicen aqui porque es donde se decide usar este canal.
      + '<br>Sus conversaciones <b>sí</b> se ven aquí, junto a las del número oficial. '
      + 'En envíos masivos va con freno: <b>40 a 120 s entre mensajes</b>, pausa de '
      + '<b>10 min cada 20</b>, tope de <b>80 al día</b>, texto variado por destinatario y '
      + 'solo a quien ya te escribió y no se dio de baja.',
      bridgeControlsHtml(p),
      puenteVinculadoEnPausa ? { clase: 'medio', texto: 'en pausa' } : null)

    // Con las redes ocultas, en vez de dos tarjetas abiertas --que invitan a atender por ahi--
    // va una sola nota con lo guardado y la conexion tecnica PLEGADA debajo. Las dos llamadas a
    // tarjetaRed no se tocan ni se borran: siguen ahi, a un clic, con sus botones de iniciar
    // sesion e importar historial intactos para el dia que se reactiven.
    + (REDES_ACTIVAS === true ? '' : notaRedesOcultas()
        + '<details class="plegado"><summary>Conexión técnica de Instagram y Messenger</summary>')

    + tarjetaRed('instagram', redes.instagram,
      'Se conecta iniciando sesión con Facebook y aceptando los permisos de la cuenta: '
      + '<code>instagram_manage_messages</code> y <code>pages_manage_metadata</code>. '
      + 'La cuenta de Instagram tiene que ser profesional y estar enlazada a la página.')

    + tarjetaRed('facebook', redes.facebook,
      'Mismo inicio de sesión que Instagram, con <code>pages_messaging</code>.')

    + (REDES_ACTIVAS === true ? '' : '</details>');

  cont.onclick = async ev => {
    // La salida de las redes ocultas: pone su filtro de canal y abre Conversaciones. Sin esto,
    // esconder seria borrar -- no quedaria ninguna forma de llegar a esos chats desde el panel.
    const verOcultas = ev.target.closest('[data-ver-ocultas]');
    if (verOcultas) {
      filtro = 'can:' + verOcultas.dataset.verOcultas;
      ve('conversations');
      return;
    }
    const sinc = ev.target.closest('[data-sync]');
    if (sinc) {
      const antes = sinc.textContent;
      sinc.disabled = true; sinc.textContent = 'Importando…';
      // Con el contador corriendo se ve que sigue viva. Una importacion de Instagram tarda
      // unos veinte segundos --Meta responde despacio y hay que reintentar-- y un boton que
      // dice "Importando…" sin moverse durante ese rato es indistinguible de uno colgado.
      // Pulsarlo otra vez es lo natural, y es justo lo peor: Meta ya esta limitando.
      let seg = 0;
      const reloj = setInterval(() => { seg += 1; sinc.textContent = 'Importando… ' + seg + ' s'; }, 1000);
      const r = await llama({ action:'syncSocial', red: sinc.dataset.sync, paginas: 25 });
      clearInterval(reloj);
      sinc.disabled = false; sinc.textContent = antes;
      if (!r.ok) return avisa('No se pudo importar', r.error);
      // Se dicen los dos numeros: si hay hilos pero cero mensajes nuevos, es que ya
      // estaban importados, no que la importacion fallara.
      //
      // Y se dice lo que NO se pudo traer. El servidor ya lo calculaba --corto, errores,
      // fallidos-- y el panel lo tiraba: quien importaba 250 de 400 leia "250
      // conversación(es)" y se quedaba pensando que ya estaban todas. Una importacion
      // incompleta que se anuncia como completa es peor que una que falla.
      const pegas = [];
      if (r.corto) pegas.push('quedaron más sin traer: vuelve a pulsar para seguir');
      if (r.errores?.length) pegas.push('Meta falló en: ' + r.errores.map(e => e.folder).join(', '));
      if (r.fallidos) pegas.push(r.fallidos + ' conversación(es) no se pudieron leer');
      if (r.truncados) pegas.push(r.truncados + ' conversación(es) son tan largas que se '
        + 'trajeron solo sus últimos mensajes');
      // Cuando NO falta nada, hay que decirlo con todas las letras. El mensaje anterior
      // solo daba un numero, y un numero pequeno se lee como fallo: se importaban las 3
      // conversaciones que Meta expone de Instagram y la conclusion era "el CRM no sube los
      // mensajes". No lo era -- comprobado contra la API el 04/09/2026: Instagram devuelve 3
      // hilos y Messenger 47, que es exactamente lo que hay en el CRM. Lo que faltaba era
      // decir de quien es el limite.
      const limite = pegas.length ? '' : ' Meta no tiene más que enseñar por su API: esto es '
        + 'todo lo que deja ver de este canal.'
        + (sinc.dataset.sync === 'instagram'
          // La ruta lleva un nivel mas del que se puso al principio: "Controles de mensajes"
          // va entre medias, y sin ese paso no aparece "Herramientas conectadas". Verificado
          // contra la ayuda de Meta el 05/09/2026, despues de que el dueno no la encontrara.
          ? ' Si en el teléfono ves más chats, quien no los comparte es la app de Instagram: '
            + 'Configuración y privacidad → Mensajes y respuestas a historias → Controles de '
            + 'mensajes → Herramientas conectadas → Permitir acceso a los mensajes. '
            // Y aunque se active, hay una parte que no volvera nunca: conviene saberlo antes
            // de dar por hecho que el CRM esta roto.
            + 'Aun así, los mensajes de la carpeta Solicitudes con más de 30 días Meta no los '
            + 'devuelve nunca, por mucho que se active el permiso.'
          : ' Los chats de Marketplace que vendes desde tu perfil personal no pasan por aquí: '
            + 'Meta retiró hace años el permiso que los leía. Solo entran los de Marketplace '
            + 'vendidos desde la página.');
      const red = sinc.dataset.sync;
      const cuando = new Date().toLocaleTimeString('es-DO', { hour:'2-digit', minute:'2-digit' });
      // "0 mensajes nuevos" NO es un fallo, y hay que decirlo con esas palabras: significa
      // que ya estaban todos. Sin eso se lee como que la importacion no funciono.
      const resumen = r.mensajes === 0
        ? '<b>' + cuando + ':</b> ' + r.hilos + ' conversación(es), ninguna novedad — ya estaban '
          + 'todas importadas.'
        : '<b>' + cuando + ':</b> ' + r.hilos + ' conversación(es), ' + r.mensajes + ' mensaje(s) nuevo(s).';
      ULTIMA_IMPORTACION[red] = resumen
        + (pegas.length ? ' ' + esc(pegas.join('. ')) + '.' : '')
        // El tope de Meta se repite aqui porque es donde se mira despues, no en el aviso.
        + (!pegas.length && red === 'instagram'
            ? ' Instagram no expone más: volver a pulsar no va a traer nada.' : '');
      avisa(pegas.length ? 'Historial importado a medias' : 'Historial importado',
        r.hilos + ' conversación(es), ' + r.mensajes + ' mensaje(s) nuevo(s).'
        + (pegas.length ? ' ' + pegas.join('. ') + '.' : limite));
      return pintaCanales();
    }
    const bot = ev.target.closest('[data-canal-bot]');
    if (bot) {
      // El bot se enciende y se apaga POR CANAL. Antes era un interruptor unico: apagarlo
      // para el segundo numero apagaba tambien el oficial, y al reves.
      const cual = bot.dataset.canalBot;
      const encendido = /encendido/.test(bot.textContent);
      if (!confirm((encendido ? 'Apagar' : 'Encender') + ' el bot SOLO en '
        + (cual === 'official' ? 'WhatsApp oficial' : 'WhatsApp Web') + '.\n\n¿Seguro?')) return;
      bot.disabled = true;
      // Encender el bot del puente exige la frase exacta (index.js:1710). Sin ella el
      // interruptor era de una sola direccion: apagaba y no volvia a encender nunca.
      const r = cual === 'official'
        ? await llama({ action:'setOfficialBot', enabled: !encendido })
        : await llama({ action:'setPhotoBot', enabled: !encendido,
            ...(encendido ? {} : { confirmation: 'ACTIVAR BOT FOTOS' }) });
      bot.disabled = false;
      if (!r.ok) return avisa('No se pudo cambiar', r.error);
      avisa('Bot ' + (encendido ? 'apagado' : 'encendido'),
        'Solo en ' + (cual === 'official' ? 'WhatsApp oficial' : 'WhatsApp Web') + '.');
      pintaCanales();
      return;
    }
    if (ev.target.closest('[data-desconecta-puente]')) {
      if (!confirm('Se cerrará la sesión de WhatsApp Web del segundo número.\n\n'
        + 'Los chats que entraron por ahí se conservan, pero dejarás de recibir mensajes nuevos '
        + 'por ese número hasta volver a conectarlo.\n\n¿Desconectar?')) return;
      const r = await llama({ action:'logoutBridge' });
      avisa(r.ok ? 'WhatsApp Web desconectado' : 'No se pudo desconectar', r.ok ? '' : r.error);
      pintaCanales();
      return;
    }
    const red = ev.target.closest('[data-conecta]');
    if (red) {
      // El inicio de sesion de Meta se abre en su propia ventana y devuelve el permiso
      // a la funcion, que es donde vive el App Secret. La clave nunca pasa por aqui: el
      // panel solo abre la ventana y espera a que la funcion diga que quedo conectado.
      const cual = red.dataset.conecta;
      // La ventana se abre AQUI MISMO, antes de cualquier await.
      //
      // Esto no es un detalle de estilo: el navegador solo deja abrir una ventana mientras
      // dura el gesto del usuario, y ese permiso se consume en el primer await. Al pedir
      // el pase primero y abrir despues, Chrome bloqueaba la ventana -- o la abria en
      // blanco sin navegar nunca. Desde fuera se ve como "se quedó cargando", que es
      // exactamente lo que paso. La funcion no llego a recibir ni una peticion.
      // Se intenta la ventana aparte, que es mas comodo: el panel se queda donde estaba.
      // Pero NO se depende de ella. Si el navegador la bloquea -- y con este flujo la
      // bloquea a menudo -- se navega la pestaña actual, que no hay bloqueador que lo
      // impida. Antes ahi terminaba el camino y el dueño se quedaba mirando una ventana
      // que no iba a cargar nunca.
      const w = window.open('', 'conectar_' + cual, 'width=620,height=740');
      // Algo en la ventana mientras se pide el pase: una ventana en blanco es
      // indistinguible de una que se colgo.
      if (w) {
        // Algo en la ventana mientras se pide el pase: una ventana en blanco es
        // indistinguible de una colgada.
        try {
          w.document.write('<!doctype html><meta charset="utf-8">'
            + '<title>Conectando…</title><body style="margin:0;display:flex;align-items:center;'
            + 'justify-content:center;height:100vh;font:15px system-ui;color:#111b21">'
            + 'Abriendo el inicio de sesión de Meta…</body>');
        } catch (e) { /* si el navegador no deja escribir, la ventana sigue sirviendo */ }
      }

      // El pase es de un solo uso: crmOauth no arranca sin el, asi que la conexion solo
      // la puede iniciar alguien con sesion en el panel.
      const p = await llama({ action:'oauthPase', red: cual });
      if (!p.ok) { try { if (w) w.close(); } catch (e) {} return avisa('No se pudo iniciar la conexión', p.error); }
      const base = String(CFG.firebaseFunctionsBase || '').replace(/\/$/, '');
      // 'red' sigue viajando aqui porque esta es NUESTRA url de arranque, no el
      // redirect_uri que Meta compara. El pase tambien la lleva, por si acaso.
      const url = base + '/crmOauth?red=' + encodeURIComponent(cual)
        + '&pase=' + encodeURIComponent(p.pase)
        // A donde volver cuando Meta termine. Sin esto la persona acaba en una pagina
        // suelta de Cloud Functions sin forma de regresar al panel.
        + '&volver=' + encodeURIComponent(location.origin + location.pathname + '#canales');
      let enVentana = false;
      if (w) { try { w.location.href = url; enVentana = true; } catch (e) { try { w.close(); } catch (e2) {} } }
      if (enVentana) {
        avisa('Inicia sesión en la ventana', 'Acepta los permisos y vuelve aquí.');
      } else {
        // Sin ventana: va la pestaña entera. Es menos comodo, pero funciona siempre, y
        // crmOauth trae de vuelta al panel al terminar.
        avisa('Abriendo el inicio de sesión de Meta', 'Al aceptar los permisos vuelves aquí solo.');
        location.href = url;
        return;
      }
      // Se refresca al cerrarse la ventana: es cuando el permiso ya esta dado o no.
      const vigila = setInterval(() => {
        if (!w.closed) return;
        clearInterval(vigila);
        pintaCanales();
      }, 1200);
      return;
    }
    if (ev.target.closest('[data-conecta-puente]')) {
      // El servidor exige el numero. Iba 18094785620 escrito a mano, asi que con otra linea
      // vinculada este boton pedia el codigo para el telefono equivocado. Sale del estado del
      // puente: el conectado, el ultimo pedido o el ultimo que estuvo vinculado.
      const phone = soloDigitos(bridgeControlState.connected_phone || bridgeControlState.requested_phone
        || bridgeControlState.last_linked_phone || TELEFONO_PUENTE);
      if (!/^[1-9][0-9]{7,14}$/.test(phone)) {
        return avisa('Falta el número', 'Escribe el número a vincular en el campo de la tarjeta de WhatsApp Web.');
      }
      const r = await llama({ action:'requestBridgePairing', phone });
      if (!r.ok) return avisa('No se pudo pedir el código', r.error);
      abreModal('<div class="mtapa"><b>Conectar WhatsApp Web</b><button class="cerrarm" data-cerrar>×</button></div>'
        + '<div class="mcuerpo"><p class="aviso">En el teléfono del segundo número: '
        + 'WhatsApp → Dispositivos vinculados → Vincular con número de teléfono.</p>'
        + '<div class="codigo" id="codPuente"><span class="cargando"></span></div>'
        + '<p class="cfgnota" id="codNota">Pidiendo el código al puente…</p></div>');
      $('modal').querySelectorAll('[data-cerrar]').forEach(b => { b.onclick = cierraModal; });
      // El codigo no viene en esta respuesta: el anfitrion lo escribe despues, y llega
      // anidado en bridge.pairing_code. Se sondea hasta que aparezca en vez de pintar un
      // guion y quedarse ahi.
      let intentos = 0;
      const reloj = setInterval(async () => {
        if (!document.getElementById('codPuente')) return clearInterval(reloj);
        const e = await llama({ action:'bridgeStatus' });
        const cod = e.ok ? (e.bridge?.pairing_code || e.pairing_code) : null;
        if (cod) {
          clearInterval(reloj);
          $('codPuente').textContent = cod;
          $('codNota').textContent = 'Escríbelo en el teléfono. Caduca en unos minutos.';
        } else if (++intentos > 40) {
          clearInterval(reloj);
          $('codPuente').textContent = '—';
          $('codNota').textContent = 'El puente no devolvió código. Comprueba que el servicio '
            + 'del segundo número está corriendo en la máquina del negocio.';
        }
      }, 3000);
    }
  };
  renderBridgeControlState(p);
  bindBridgeControls();
}

/* ---- Configuración ------------------------------------------------------- */
// Doce tarjetas, las mismas que tenia el panel anterior. Se releyo su vista de
// configuracion una a una para no dejarse ninguna fuera; la primera version de v2 solo
// enseñaba el rol y el equipo.
//
// Los ajustes viven en la tabla settings del servidor, no en el navegador: son del
// negocio. Si viven en localStorage, cada persona tiene los suyos y el CRM se comporta
// distinto segun quien lo abra.
const AJUSTES = {};

async function cargaAjustes(){
  const r = await llama({ action:'data', table:'settings', operation:'select', limit: 200 });
  if (!r.ok) return false;
  (r.data || r.rows || []).forEach(f => { if (f?.key) AJUSTES[f.key] = f.value; });
  return true;
}
async function guardaAjuste(clave, valor){
  const r = await llama({ action:'data', table:'settings', operation:'upsert',
    payload:{ id: clave, key: clave, value: String(valor), updated_at: new Date().toISOString() },
    on_conflict:'id' });
  if (!r.ok) { avisa('No se pudo guardar', r.error); return false; }
  AJUSTES[clave] = String(valor);
  return true;
}

function tarjetaCfg(titulo, nota, cuerpo){
  return '<div class="cfgc"><h3>' + esc(titulo) + '</h3>'
    + (nota ? '<p class="cfgnota">' + nota + '</p>' : '') + cuerpo + '</div>';
}
// Interruptor con su explicacion al lado. Un interruptor suelto no dice que pasa al
// encenderlo, y estos cambian lo que se le manda a clientes reales.
function interruptorCfg(clave, etiqueta, explica, pordefecto){
  const on = AJUSTES[clave] !== undefined ? AJUSTES[clave] === 'true' : !!pordefecto;
  return '<label class="cfgsw"><input type="checkbox" data-sw="' + esc(clave) + '"'
    + (on ? ' checked' : '') + '><span><b>' + esc(etiqueta) + '</b>'
    + '<i>' + explica + '</i></span></label>';
}
// Se ensena el numero de conversaciones al lado: sin el no hay forma de saber cual de dos
// etiquetas parecidas es la que se usa de verdad.
function etiquetasFiltroCfg(){
  const todas = etiquetasContadas();
  if (!todas.length) return '<p class="cfgnota">Todavia no hay ninguna etiqueta puesta en ninguna conversacion.</p>';
  const elegidas = etiquetasElegidas();
  return '<div class="etiquetas">'
    + todas.map(([e, n]) => '<label class="etq sug" style="cursor:pointer">'
        + '<input type="checkbox" data-etqf="' + esc(e) + '"'
        + (elegidas.includes(e) ? ' checked' : '') + ' style="margin-right:6px;vertical-align:middle">'
        + esc(e) + ' <b style="opacity:.6">' + n + '</b></label>').join('')
    + '</div>';
}
function campoCfg(clave, etiqueta, marcador){
  return '<div class="campo"><label>' + esc(etiqueta) + '</label>'
    + '<input data-cfg="' + esc(clave) + '" value="' + esc(AJUSTES[clave] || '')
    + '" placeholder="' + esc(marcador || '') + '"></div>';
}

// El enlace del calendario LLEVA SU LLAVE, y esa es toda la historia de por que la agenda
// nunca aparecio en Google. crmAgenda exige ?key= y contesta 401 sin ella; el panel ensenaba
// la URL pelada, se pegaba en Google, Google recibia un 401 y se quedaba callado. Desde
// fuera: "el calendario no conecta".
function urlAgenda(){
  const base = CFG.firebaseAgendaUrl || '';
  const llave = AJUSTES.agenda_feed_key || '';
  if (!base || !llave) return '';
  return base + (base.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(llave);
}
// La llave viaja dentro de una URL que se pega en Google, o sea que no puede ser adivinable:
// quien la acierte ve la agenda entera --nombre del cliente, telefono y notas--. 32 bytes del
// generador del navegador, en hexadecimal.
function nuevaLlaveAgenda(){
  const bytes = new Uint8Array(32);
  crypto.getRandomValues(bytes);
  return [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
}
// La otra puerta con llave: la del Atajo del iPhone. Es DISTINTA de la del calendario a
// proposito --cambiar una no puede dejar muda a la otra-- y se guarda en los ajustes del CRM,
// no en crm-config.js, que es publico. Si algun dia crmRecordatorios responde 404 en la base
// de funciones, se pone su URL propia en crm-config.js (firebaseRecordatoriosUrl), como hubo
// que hacer con el calendario.
function urlRecordatoriosIphone(){
  const base = String(CFG.firebaseRecordatoriosUrl
    || (CFG.firebaseFunctionsBase ? String(CFG.firebaseFunctionsBase).replace(/\/$/, '') + '/crmRecordatorios' : ''));
  const llave = AJUSTES.iphone_tasks_key || '';
  if (!base || !llave) return '';
  return base + (base.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(llave);
}

      if (el.dataset.sw === 'redes_sociales_activas') fijaRedesActivas(el.checked);
      avisa('Guardado', el.checked ? 'Activado' : 'Desactivado');
    };
  });
  // Se guarda la lista entera en cada cambio, no la etiqueta suelta: asi el orden de la
  // barra es el orden en que aparecen aqui, y no depende de en que orden se fueron pulsando.
  g.querySelectorAll('[data-etqf]').forEach(el => {
    el.onchange = async () => {

  const ag = $('cfgAgendaGoogle');
  if (ag) ag.onclick = () => {
    const u = urlAgenda(); if (!u) return;
    const webcal = u.replace(/^https?:\/\//, 'webcal://');
    window.open('https://calendar.google.com/calendar/r?cid=' + encodeURIComponent(webcal), '_blank', 'noopener');
  };
  const ar = $('cfgAgendaRota');
  if (ar) ar.onclick = async () => {
    if (!confirm('Se genera un enlace nuevo y el anterior deja de funcionar.\n\n'
      + 'Los calendarios que ya lo tengan añadido --el tuyo incluido-- dejarán de '
      + 'actualizarse hasta que se añada el nuevo.\n\n¿Cambiarlo?')) return;
    ar.disabled = true;
    const ok = await guardaAjuste('agenda_feed_key', nuevaLlaveAgenda());
    if (!ok) { ar.disabled = false; return; }
    avisa('Enlace cambiado', 'Hay que volver a añadirlo en Google Calendar.');
    pintaConfig();
  };
  // La puerta del iPhone. Llave propia: rotar la del calendario no puede dejar mudo el
  // teléfono, ni al revés.
  const ia = $('cfgIphoneActivar');
  if (ia) ia.onclick = async () => {
    ia.disabled = true;
    const ok = await guardaAjuste('iphone_tasks_key', nuevaLlaveAgenda());
    if (!ok) { ia.disabled = false; return; }
    avisa('Conexión activada', 'Ya se puede montar el Atajo en el iPhone.');
    pintaConfig();
  };
  const ic2 = $('cfgIphoneCopia');
  if (ic2) ic2.onclick = async () => {
    try { await navigator.clipboard.writeText(urlRecordatoriosIphone()); avisa('Dirección copiada'); }
    catch (e) { avisa('No se pudo copiar'); }
  };
  // Probar con GET, que NO escribe nada: es solo para saber si la llave y la dirección sirven
  // antes de pelearse con Atajos. Un 401 aquí explica en un segundo lo que en el iPhone son
  // veinte minutos de "no pasa nada".
  const ip = $('cfgIphoneProbar');
  if (ip) ip.onclick = async () => {
    const u = urlRecordatoriosIphone(); if (!u) return;
    ip.disabled = true;
    try {
      const r = await fetch(u, { method:'GET' });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) {
        avisa('La dirección no contestó bien', r.status === 401
          ? 'La llave no es la que tiene el servidor. Pulsa «Cambiar la llave» y vuelve a probar.'
          : 'Respondió ' + r.status + '. Si es 404, falta desplegar crmRecordatorios.');
      } else {
        avisa('Funciona', (d.pendientes || []).length + ' por mandar al iPhone, '
          + (d.completadas || []).length + ' por marcar hechos.');
      }
    } catch (e) { avisa('No se pudo probar', 'No hubo respuesta desde este navegador.'); }
    ip.disabled = false;
  };
  const ir = $('cfgIphoneRota');
  if (ir) ir.onclick = async () => {
    if (!confirm('Se genera una llave nueva y la anterior deja de funcionar.\n\n'
      + 'El Atajo del iPhone dejará de sincronizar hasta que le pegues la dirección nueva.\n\n'
      + 'Nada de lo ya sincronizado se borra.\n\n¿Cambiarla?')) return;
    ir.disabled = true;
    const ok = await guardaAjuste('iphone_tasks_key', nuevaLlaveAgenda());
    if (!ok) { ir.disabled = false; return; }
    avisa('Llave cambiada', 'Copia la dirección nueva en el Atajo del iPhone.');
    pintaConfig();
  };
  // El id del calendario de la vista incrustada. NO es la dirección privada --esa vive en el
  // servidor-- y por eso sí puede guardarse en los ajustes del CRM.
  const gg = $('cfgGuardaGoogleCal');
  if (gg) gg.onclick = async () => {
    gg.disabled = true;
    for (const clave of ['google_calendar_embed_id', 'google_calendar_embed_extra_id']) {
      const el = g.querySelector('[data-cfg="' + clave + '"]');
      if (!el) continue;
      const v = String(el.value || '').trim();
      if (v && !ID_CAL_GOOGLE.test(v)) {
        gg.disabled = false;
        return avisa('Id no válido', 'Tiene la forma algo@group.calendar.google.com.');
      }
      if (!(await guardaAjuste(clave, v))) { gg.disabled = false; return; }
    }
    gg.disabled = false;
    avisa('Guardado', 'La pestaña «Google» de la Agenda ya usa este calendario.');
  };
  // El telefono de avisos se valida aqui: uno mal escrito haria que el servidor volviera en
  // silencio al de por defecto, y se creeria que los avisos van a otro sitio.
  const ga = $('cfgGuardaAviso');
  if (ga) ga.onclick = async () => {
    const tel = soloDigitos($('cfgAvisoTel')?.value);
    if (tel && !/^[1-9][0-9]{7,14}$/.test(tel)) {
      return avisa('Teléfono no válido', 'Código de país y solo dígitos, por ejemplo 18091234567.');
    }
    ga.disabled = true;
    const ok = await guardaAjuste('handoff_notify_phone', tel);
    ga.disabled = false;
    if (ok) avisa('Guardado', tel ? 'Los avisos irán al ' + telefonoLegible(tel) + '.' : 'Vuelve al teléfono por defecto.');
  };
  const cr = $('cfgReglas2'); if (cr) cr.onclick = abreReglas;
  const ic = $('cfgIrCanales'); if (ic) ic.onclick = () => ve('canales');
  cableaIgnoradosCfg();
  cableaAnalisisCfg();
  if (esAdmin) cableaUsuarios();
  pintaUsuarios(esAdmin);
}

      + '<span><b>' + esc(x.display_name || x.email || '—') + '</b><small>' + esc(x.email || '') + '</small></span>'
      + '<span>' + (esAdmin
          ? '<select data-rol="' + esc(x.user_id || x.uid || x.id || '') + '">'
            + ['agent','supervisor','admin'].map(rr => '<option value="' + rr + '"'
              + (x.role === rr ? ' selected' : '') + '>' + rr + '</option>').join('') + '</select>'
          : esc(x.role || '—')) + '</span>'
      + '<span><button class="interruptor' + (x.active === false ? '' : ' on') + '"'
      +   (esAdmin ? ' data-activo="' + esc(x.user_id || x.uid || x.id || '') + '"' : ' disabled')
      +   '>' + (x.active === false ? 'inactivo' : 'activo') + '</button>'
      // Sin esto, quien pierde la clave se queda fuera y no habia boton para nada: habia
      // que entrar a la consola de Firebase, que es justo lo que este panel evita.
      +   (esAdmin ? '<button class="btn-linea" data-clave="' + esc(x.user_id || x.uid || x.id || '') + '"'
            + ' style="margin-left:6px">clave</button>' : '')
      +   '</span></div>').join('')
    + '</div>';

  if (!esAdmin) return;
  cont.onchange = async ev => {
    const s = ev.target.closest('[data-rol]'); if (!s) return;
    const r2 = await llama({ action:'panelUsers', operation:'update', user_id:s.dataset.rol, role:s.value });
    avisa(r2.ok ? 'Rol cambiado' : 'No se pudo cambiar', r2.ok ? s.value : r2.error);
  };
  cont.onclick = async ev => {
    const clave = ev.target.closest('[data-clave]');
    if (clave) {
      const nueva = prompt('Clave temporal para esa cuenta (mínimo 10 caracteres).\n\n'
        + 'Tendrá que cambiarla al entrar.');
      if (nueva === null) return;
      if (String(nueva).length < 10) return avisa('Clave muy corta', 'Mínimo 10 caracteres.');
      clave.disabled = true;
      const r2 = await llama({ action:'panelUsers', operation:'reset_password',
        user_id: clave.dataset.clave, temporary_password: nueva });
      clave.disabled = false;
      return avisa(r2.ok ? 'Clave cambiada' : 'No se pudo cambiar', r2.ok ? 'Pásasela y que la cambie.' : r2.error);
    }

    b.classList.toggle('on', activar);
    b.textContent = activar ? 'activo' : 'inactivo';
  };
}

// Quien hizo que y cuando. En un panel donde se puede apagar un bot, difundir a cientos y
// mover fichas en lote, no poder mirar atras es un agujero: cuando algo sale raro, la
// primera pregunta es siempre quien lo toco.
// Alta y baja de colaboradores. v2 solo LEIA la lista para el desplegable de la encuesta:
// en cuanto entraba alguien nuevo al equipo, sus resenas no contaban para nadie y no habia
// forma de arreglarlo desde el panel.
async function cableaEquipo(){
  const c = $('cfgEquipo'); if (!c) return;
  const pinta = async () => {
    COLABORADORES = null;                       // se relee: acabamos de cambiarla
    const equipo = await cargaColaboradores();
    // null es "no se pudo leer", [] es "no hay nadie". Tratarlos igual decia "Todavia no hay
    // nadie dado de alta" cuando el equipo estaba entero, y ademas equipo.length sobre null
    // tiraba una excepcion DENTRO del await de mas abajo: el cableado del boton "Dar de alta"
    // no llegaba a ejecutarse y quedaba muerto el resto de la sesion.
    if (equipo === null) {
      c.innerHTML = '<p class="cfgnota">No se pudo leer el equipo. '
        + '<button class="btn-linea" id="cfgEquipoReintentar">Reintentar</button></p>';
      const rp = $('cfgEquipoReintentar'); if (rp) rp.onclick = () => pinta();
      return;
    }
    c.innerHTML = equipo.length
      ? equipo.map(e => '<div class="dato"><div class="k">' + esc(e.role || e.puesto || '—') + '</div>'
          + '<div class="v">' + esc(e.name || e.display_name || e.email || 'sin nombre') + '</div>'
          + '<button class="btn-linea" data-col-activo="' + esc(e.id) + '">'
          + (e.active === false ? 'inactivo' : 'activo') + '</button></div>').join('')
      : '<p class="cfgnota">Todavía no hay nadie dado de alta.</p>';
  };
  await pinta();
  $('colAdd').onclick = async () => {
    const nombre = ($('colNombre').value || '').trim();
    if (!nombre) return $('colNombre').focus();
    const b = $('colAdd'); b.disabled = true;
    const r = await llama({ action:'data', table:'collaborators', operation:'insert',
      payload:{ name: nombre, role: ($('colPuesto').value || '').trim() || null, active: true } });
    b.disabled = false;
    if (!r.ok) return avisa('No se pudo dar de alta', r.error);
    $('colNombre').value = ''; $('colPuesto').value = '';
    await pinta(); avisa('Alta hecha', nombre + ' ya sale en la encuesta.');
  };
  c.onclick = async ev => {
    const b = ev.target.closest('[data-col-activo]'); if (!b) return;
    const activar = b.textContent.trim() === 'inactivo';
    b.disabled = true;
    const r = await llama({ action:'data', table:'collaborators', operation:'update',
      // kind/field, que es lo unico que acepta el servidor. Con column/operator respondia 400
      // "filtro invalido" y ningun colaborador se podia activar ni dar de baja.
      payload:{ active: activar }, filters:[{ kind:'eq', field:'id', value: b.dataset.colActivo }] });
    b.disabled = false;
    if (!r.ok) return avisa('No se pudo cambiar', r.error);
    await pinta();
  };
}

// Dar de baja por etiqueta. Se calcula SIEMPRE antes: esto apaga marketing y automatismos a
// una lista entera de golpe, y equivocarse de etiqueta se nota semanas despues, cuando
// alguien pregunta por que dejo de llegarle nada.
function cableaBajaLista(){
  const calc = $('bajaCalcular'); if (!calc) return;

  calc.onclick = async () => {
    if (!etiquetas()) return avisa('Escribe al menos una etiqueta');
    calc.disabled = true;
    const r = await llama({ action:'communicationPolicyBulk', tags: etiquetas(), dry: true });
    calc.disabled = false;
    const c = $('bajaCuerpo');
    if (!r.ok) { c.innerHTML = '<p class="cfgnota">' + esc(r.error || 'error') + '</p>'; return; }
    const n = Number(r.matched || 0);
    c.innerHTML = '<div class="dato"><div class="k">A cuántos afecta</div><div class="v">' + n + '</div></div>'
      + ((r.sample || []).length ? '<p class="cfgnota">Por ejemplo: ' + esc(r.sample.slice(0,6).join(', ')) + '</p>' : '');
    $('bajaAplicar').disabled = !n;

  $('bajaAplicar').onclick = async () => {

    const frase = prompt('Esto apaga marketing y automatismos a toda la lista.\n\n'
      + 'Escribe DESACTIVAR LISTA para confirmar:');

    if (!r.ok) { b.disabled = false; return avisa('No se pudo', r.error); }
    avisa('Lista dada de baja', (r.updated || r.matched || 0) + ' contacto(s) fuera de marketing.');
    $('bajaCalcular').click();
  };
}

/* ---- Funnel / Kanban ----------------------------------------------------- */
// Arrastrar una tarjeta cambia la etapa del lead de verdad. Por eso la tarjeta vuelve
// a su sitio si el servidor rechaza el cambio: dejarla en la columna nueva la haria
// mentir hasta el siguiente refresco, y quien la movio se iria creyendo que se guardo.
function montaFunnel(){
  if (!montadas.has('funnel')) {
    montadas.add('funnel');
    hueco('funnel', '<div class="hoja"><h1>Funnel</h1>'
      + '<p class="bajada">Arrastra un contacto a otra columna para cambiarle la etapa.</p>'
      + '<div class="kanban" id="kanban"></div>'
      + '<div class="seccion" style="margin:30px 0 4px">Leads parados</div>'
      + '<p class="bajada">Por qué no avanzan y qué hacer con cada uno. Nada se mueve solo: '
      +   'cambiar de etapa cambia lo que el sistema le mandará después.</p>'
      + '<div id="movil"></div></div>');
  }
  pintaKanban();
  pintaMovilizacion();
}

function pintaKanban(){
  const cont = $('kanban'); if (!cont) return;
  cont.innerHTML = ETAPAS.map(e => {
    const filas = CONVS.filter(c => (c.lifecycle_stage || 'nuevo') === e);
    return '<div class="columna" data-etapa="' + e + '">'
      + '<div class="ctitulo">' + esc(e.replace(/_/g,' ')) + '<b>' + filas.length + '</b></div>'
      + '<div class="ccuerpo">'
      + filas.slice(0, 60).map(c => '<div class="ktarjeta" draggable="true" data-conv="' + esc(c._id) + '">'
          + '<b>' + esc(nombreDe(c)) + '</b>'
          + '<span>' + esc(c.last_message_preview || '') + '</span>'
          + '<i>' + esc(hora(c.last_message_at)) + (c.interested_category ? ' · ' + esc(c.interested_category) : '') + '</i>'
        + '</div>').join('')
      + (filas.length > 60 ? '<div class="kmas">… y ' + (filas.length - 60) + ' más</div>' : '')
      + '</div></div>';
  }).join('');

  let arrastrando = null;
  cont.querySelectorAll('.ktarjeta').forEach(t => {
    t.addEventListener('dragstart', ev => {
      arrastrando = t;
      t.classList.add('moviendo');
      // Firefox no inicia el arrastre sin datos en el portapapeles del evento.
      ev.dataTransfer.setData('text/plain', t.dataset.conv);
      ev.dataTransfer.effectAllowed = 'move';
    });
    t.addEventListener('dragend', () => { t.classList.remove('moviendo'); arrastrando = null;
      cont.querySelectorAll('.columna').forEach(c => c.classList.remove('encima')); });
  });
  cont.querySelectorAll('.columna').forEach(col => {
    col.addEventListener('dragover', ev => { ev.preventDefault(); col.classList.add('encima'); });
    col.addEventListener('dragleave', () => col.classList.remove('encima'));
    col.addEventListener('drop', async ev => {
      ev.preventDefault();
      col.classList.remove('encima');
      const id = ev.dataTransfer.getData('text/plain') || arrastrando?.dataset.conv;
      const c = buscaConv(id);
      const etapa = col.dataset.etapa;
      if (!c || (c.lifecycle_stage || 'nuevo') === etapa) return;
      const anterior = c.lifecycle_stage;
      c.lifecycle_stage = etapa;      // se mueve ya, para que se sienta inmediato
      pintaKanban();
      const r = await llama({ action:'updateLead', conversation_id: c.id || c._id,
        fields:{ lifecycle_stage: etapa } });
      if (!r.ok) {
        c.lifecycle_stage = anterior; // y vuelve si el servidor dijo que no
        pintaKanban();
        return avisa('No se pudo mover', r.error);
      }
      avisa(nombreDe(c), 'ahora está en ' + etapa.replace(/_/g,' '));
      pintaChats();
    });
  });
}

function diasAtras(n){
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - n); return d;
}

// --- Piezas de dibujo -------------------------------------------------------
function grafArea(puntos, etiquetas){
  const an = 640, al = 170, pad = { i:34, d:10, s:14, b:24 };
  const max = Math.max(1, ...puntos);
  const x = i => pad.i + i * (an - pad.i - pad.d) / Math.max(1, puntos.length - 1);
  const y = v => pad.s + (1 - v / max) * (al - pad.s - pad.b);
  const linea = puntos.map((v,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const area = linea + ' L' + x(puntos.length-1).toFixed(1) + ' ' + (al-pad.b) + ' L' + x(0) + ' ' + (al-pad.b) + ' Z';
  // Tres lineas de referencia, no diez: mas rayas no ayudan a leer, estorban.
  const guias = [0, .5, 1].map(p => {
    const v = Math.round(max * p);
    return '<line x1="' + pad.i + '" x2="' + (an-pad.d) + '" y1="' + y(v) + '" y2="' + y(v) + '" class="gguia"/>'
      + '<text x="' + (pad.i-7) + '" y="' + (y(v)+3.5) + '" class="gnum" text-anchor="end">' + v + '</text>';
  }).join('');
  const marcas = puntos.map((v,i) => (i % 3 === 0 || i === puntos.length-1)
    ? '<text x="' + x(i) + '" y="' + (al-7) + '" class="gnum" text-anchor="middle">' + esc(etiquetas[i]) + '</text>' : '').join('');
  const picos = puntos.map((v,i) => '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="2.5" class="gpunto">'
    + '<title>' + esc(etiquetas[i]) + ': ' + v + '</title></circle>').join('');
  return '<svg viewBox="0 0 ' + an + ' ' + al + '" class="graf" preserveAspectRatio="none">'
    + guias + '<path d="' + area + '" class="garea"/><path d="' + linea + '" class="glinea"/>'
    + picos + marcas + '</svg>';
}

function grafBarras(filas){
  const max = Math.max(1, ...filas.map(f => f.v));
  return '<div class="barras">' + filas.map(f =>
    '<div class="barra"><span class="be">' + esc(f.n) + '</span>'
    + '<span class="bp"><i style="width:' + Math.round(f.v / max * 100) + '%"></i></span>'
    + '<span class="bn">' + f.v + '</span></div>').join('') + '</div>';
}

function grafAnillo(filas){
  const total = filas.reduce((a,f) => a + f.v, 0) || 1;
  const R = 54, C = 2 * Math.PI * R;
  let acumulado = 0;
  const arcos = filas.filter(f => f.v).map(f => {
    const trozo = f.v / total * C;
    const el = '<circle cx="70" cy="70" r="' + R + '" class="ganillo" stroke="' + f.c + '" '
      + 'stroke-dasharray="' + trozo.toFixed(2) + ' ' + (C - trozo).toFixed(2) + '" '
      + 'stroke-dashoffset="' + (-acumulado).toFixed(2) + '"><title>' + esc(f.n) + ': ' + f.v + '</title></circle>';
    acumulado += trozo;
    return el;
  }).join('');
  return '<div class="anillo"><svg viewBox="0 0 140 140">' + arcos
    + '<text x="70" y="66" class="gtot" text-anchor="middle">' + total + '</text>'
    + '<text x="70" y="84" class="gnum" text-anchor="middle">total</text></svg>'
    + '<div class="leyenda">' + filas.filter(f => f.v).map(f =>
        '<span><i style="background:' + f.c + '"></i>' + esc(f.n) + ' <b>' + f.v + '</b></span>').join('')
    + '</div></div>';
}

function panel(titulo, nota, cuerpo){
  return '<div class="pgraf"><div class="pgcab"><b>' + esc(titulo) + '</b>'
    + (nota ? '<span>' + esc(nota) + '</span>' : '') + '</div>' + cuerpo + '</div>';
}

// --- Pintado ----------------------------------------------------------------
function pintaDashboard(){
  const c = $('cifras'); if (!c) return;
  const hoy = new Date().toDateString();
  const sinLeer = CONVS.filter(x => Number(x.unread||0) > 0).length;
  const humano = CONVS.filter(x => x.mode === 'human' || x.human_handoff_required).length;
  const deHoy = CONVS.filter(x => new Date(x.last_message_at || 0).toDateString() === hoy).length;
  const clientes = CONVS.filter(x => x.lifecycle_stage === 'cliente').length;
  const desint = CONVS.filter(x => x.lifecycle_stage === 'desinteresado').length;
  const excluidos = CONVS.filter(x => x.proactive_blocked_at).length;
  const vencidos = CONVS.filter(x => x.follow_up_at && new Date(x.follow_up_at) <= new Date()
    && !['cerrado','perdido','desinteresado'].includes(x.lifecycle_stage)).length;

  // Las cifras que piden accion se marcan; el resto es contexto. Si todo grita, nada grita.
  const cifra = (n, t, nota, tono) => '<button class="cifra' + (tono ? ' ' + tono : '')
    + '" data-ir="' + esc(t) + '"><b>' + n + '</b><span>' + esc(t) + '</span>'
    + (nota ? '<i>' + esc(nota) + '</i>' : '') + '</button>';

  // Los dormidos se cuentan aparte. Meterlos en "Conversaciones" infla el numero con
  // gente que lleva meses sin escribir y hace parecer que hay mas trabajo del que hay.
  const dormidos = CONVS.filter(enElOlvido).length;
  const vivas = CONVS.length - dormidos;

  c.innerHTML = cifra(vivas, 'Conversaciones', dormidos ? dormidos + ' dormidas aparte' : 'en total')
    + cifra(sinLeer, 'Sin leer', sinLeer ? 'esperando respuesta' : 'al día', sinLeer ? 'ojo' : '')
    + cifra(vencidos, 'Seguimientos vencidos', vencidos ? 'ya tocaba' : 'ninguno', vencidos ? 'mal' : '')
    + cifra(humano, 'Esperando a una persona')
    + cifra(deHoy, 'Activas hoy')
    + cifra(clientes, 'Clientes', 'ya compraron', clientes ? 'bien' : '')
    + cifra(desint + excluidos, 'Fuera de marketing', desint + ' desinteresados · ' + excluidos + ' excluidos')
    + cifra(dormidos, 'Dormidos', dormidos ? 'más de ' + DIAS_INACTIVO + ' días · pendientes de limpiar' : 'ninguno',
        dormidos ? 'ojo' : '')
    // Aparte y sin sumar en ninguna otra: familia, numeros propios y colegas no son negocio.
    + (CONVS_IGNORADAS.length ? cifra(CONVS_IGNORADAS.length, 'Ignoradas', 'fuera de todas las cifras') : '');

  // Pulsar una cifra lleva a verla, no solo la enseña. Un numero sin a donde ir obliga
  // a rehacer el filtro a mano en la otra pantalla.
  c.onclick = ev => {
    const b = ev.target.closest('[data-ir]'); if (!b) return;
    const a = b.dataset.ir;
    if (a === 'Seguimientos vencidos') return ve('reminders');
    if (a === 'Clientes') { filtro = 'todos'; ve('funnel'); return; }
    if (a === 'Sin leer') { filtro = 'sinleer'; ve('conversations'); pintaChats(); return; }
    if (a === 'Esperando a una persona') { filtro = 'humano'; ve('conversations'); pintaChats(); return; }
    if (a === 'Dormidos') return ve('limpieza');
    if (a === 'Ignoradas') { filtro = 'ignorados'; ve('conversations'); pintaChats(); return; }
    ve('conversations');
  };

  // --- Actividad de los ultimos 14 dias
  const dias = [], etiq = [];
  for (let i = 13; i >= 0; i--) {
    const d = diasAtras(i), sig = diasAtras(i-1);
    dias.push(CONVS.filter(x => {
      const t = new Date(x.last_message_at || 0);
      return t >= d && t < sig;
    }).length);
    etiq.push(d.getDate() + '/' + (d.getMonth()+1));
  }

  const porEtapa = ETAPAS.map(e => ({ n: e.replace(/_/g,' '),
    v: CONVS.filter(x => (x.lifecycle_stage || 'nuevo') === e).length }));

  const porCanal = Object.keys(CANALES)
    .map(k => ({ n: CANALES[k].corto, v: CONVS.filter(x => canalDe(x) === k).length, c: CANALES[k].color }))
    .filter(f => f.v);

  // Embudo: cada etapa como porcentaje de las que llegaron a la anterior. Es la unica
  // cifra que dice DONDE se pierde la gente, que es lo que se quiere arreglar.
  const orden = ['nuevo','interesado','cotizando','pendiente_reserva','reservado','cliente'];
  const cuentaEtapa = e => CONVS.filter(x => (x.lifecycle_stage || 'nuevo') === e).length;
  const acumulado = orden.map((e,i) => orden.slice(i).reduce((a,x) => a + cuentaEtapa(x), 0));
  const embudo = orden.map((e,i) => {
    const de = acumulado[i], antes = i ? acumulado[i-1] : de;
    return { n: e.replace(/_/g,' '), v: de, pct: antes ? Math.round(de / antes * 100) : 100 };
  });

  $('tablero').innerHTML =
    panel('Actividad', 'últimos 14 días', grafArea(dias, etiq))
    + panel('Por etapa', CONVS.length + ' contactos', grafBarras(porEtapa))
    + panel('Por canal', 'de dónde escriben', grafAnillo(porCanal))
    + panel('Embudo', 'cuánta gente pasa de una etapa a la siguiente',
        '<div class="embudo">' + embudo.map((f,i) =>
          '<div class="epaso"><span class="en">' + esc(f.n) + '</span>'
          + '<span class="eb"><i style="width:' + (embudo[0].v ? Math.round(f.v / embudo[0].v * 100) : 0) + '%"></i></span>'
          + '<span class="ev">' + f.v + (i ? ' <em>' + f.pct + '%</em>' : '') + '</span></div>').join('')
        + '</div>');
}

function leadsParados(){

    && !['cliente','perdido','desinteresado'].includes(c.lifecycle_stage)
    && !c.proactive_blocked_at);

function pintaMovilizacion(){
  const cont = $('movil'); if (!cont) return;
  const grupos = leadsParados();
  if (!grupos.length) {

  }

    + '<p class="cfgnota">' + esc(g.regla.porque) + '</p>'

    + g.filas.slice(0, 25).map(c => '<div class="fila" style="grid-template-columns:minmax(0,2fr) 1fr auto">'
      + '<span><b>' + esc(nombreDe(c)) + '</b><small>' + esc((c.lifecycle_stage||'nuevo').replace(/_/g,' '))
      +   ' · ' + llevaDormido(c) + ' días</small></span>'
      + '<span>' + esc(c.interested_category || '—') + '</span>'
      + '<span><button class="btn-linea" data-mov="' + esc(g.regla.id) + '" data-conv="' + esc(c._id || c.id) + '">'
      +   esc(g.regla.hacer) + '</button>'
      + (g.regla.etapa && c.lifecycle_stage !== g.regla.etapa
        ? '<button class="btn-linea" style="margin-left:6px" data-avanza="' + esc(g.regla.id)
          + '" data-conv="' + esc(c._id || c.id) + '">Avanzar a ' + esc(g.regla.etapa.replace(/_/g,' ')) + '</button>' : '')

    const avanzar = ev.target.closest('[data-avanza]');

      if (!c || !r?.etapa) return;
      if (!confirm('Mover a ' + nombreDe(c) + ' de «' + (c.lifecycle_stage || 'nuevo').replace(/_/g,' ')

      const campos = { lifecycle_stage:r.etapa, next_step_suggested:r.siguiente || r.porque };
      const respuesta = await llama({ action:'updateLead', conversation_id:c.id || c._id, fields:campos });
      avanzar.disabled = false;
      if (!respuesta.ok) return avisa('No se pudo avanzar', respuesta.error);
      Object.assign(c, campos);
      avisa('Lead avanzado', 'El siguiente paso quedó documentado; no se envió ningún mensaje.');
      pintaMovilizacion(); pintaChats();
      return;
    }
    const b = ev.target.closest('[data-mov]'); if (!b) return;
    const c = buscaConv(b.dataset.conv);
    const r = REGLAS_LEAD.find(x => x.id === b.dataset.mov);
    if (!c) return;
    // Se abre la conversacion SIEMPRE, aunque haya prompt: hay que ver con quien se
    // habla antes de mandarle nada.
    abre(c);
    ve('conversations');
    if (!r?.prompt) return;
    // Y el prompt se deja preparado en un hilo del asistente de ESE contacto, no se ejecuta solo.
    // Antes caia en Planificacion a secas y valia porque `sel` apuntaba a el; el contacto
    // ahora lo define el hilo.
    setTimeout(() => preguntaAlAsistente(c, r.prompt), 250);
  };
}

// Las metricas se leen en el servidor: hacen falta el token y el id de la cuenta, y

// Se enseña lo que decide si una campaña merece seguir viva: gasto, conversaciones

    +   '<span>Campaña</span><span>Gasto</span><span>Conversaciones</span>'

/* ---- Limpieza del histórico ---------------------------------------------- */
// El dueño lo dijo claro: los que escribieron al WhatsApp API llevan MESES sin
// interes, no deben contar para nada hasta que demuestren lo contrario, y se les hace
// UN acercamiento -- uno, no una secuencia -- programado para mañana. Si no responden,
// desinteresados.
//
// Dos decisiones deliberadas:
//   · Se excluye el canal de WhatsApp Web, como pidio. Ese numero tiene otra historia.
//   · Nada sale hoy. Se programa. Doscientos mensajes de golpe a gente dormida hace
//     meses es exactamente el patron que hace que Meta degrade el numero.
const DIAS_INACTIVO = 60;

function llevaDormido(c){
  const t = Date.parse(String(c.last_message_at || '')) || 0;
  return t ? Math.floor((Date.now() - t) / 86400000) : 9999;
}
// Un contacto "en el olvido" no cuenta para las metricas del dia a dia. No es lo mismo
// que desinteresado: a este todavia no se le ha preguntado.
function enElOlvido(c){
  if (['cliente','reservado','desinteresado','perdido'].includes(c.lifecycle_stage)) return false;
  if (c.proactive_blocked_at) return false;
  if (canalDe(c) === 'whatsapp_qr') return false;      // el segundo numero queda fuera
  return llevaDormido(c) >= DIAS_INACTIVO;
}

// Las tres herramientas en lote comparten una regla: SIEMPRE se puede simular antes. El
// panel viejo ya lo hacia asi y no es capricho -- estas tres tocan cientos de fichas de una
// vez, y una de ellas escribe a clientes reales. Ver el numero antes de pulsar es la
// diferencia entre una herramienta util y una que da miedo usar.
function cableaLotes(){
  const num = v => Number(v || 0);
  const pintaResumen = (id, r, titulo) => {
    const c = $(id); if (!c) return;
    if (!r.ok) { c.innerHTML = '<p class="bajada">' + esc(r.error || 'No se pudo.') + '</p>'; return; }
    const filas = Object.entries(r).filter(([k, v]) => typeof v === 'number' && v !== 0);
    c.innerHTML = '<div class="dato"><div class="k">' + esc(titulo) + '</div><div class="v">'
      + (filas.length ? filas.map(([k, v]) => esc(k) + ': ' + v).join(' · ') : 'Nada que hacer')
      + '</div></div>'
      + ((r.errors || []).length ? '<p class="bajada">' + r.errors.length + ' con error.</p>' : '');
  };

  // --- Auto bot ---
  const cargaAuto = dry => llama({
    action:'followup', mode:'smart_templates', dry,
    purpose: $('atPurpose').value || 'both',
    min_hours: num($('atMinHoras').value) || 6,
    repeat_days: num($('atRepetir').value) || 3,
    stage: $('atEtapa').value || '', category: $('atCat').value || '', priority: $('atPri').value || '',
  });
  $('atSimular').onclick = async () => {
    const b = $('atSimular'); b.disabled = true;
    pintaResumen('atCuerpo', await cargaAuto(true), 'Simulación · no se envió nada');
    b.disabled = false;
  };
  $('atEnviar').onclick = async () => {
    // Esto escribe a clientes REALES. Se pregunta, y se dice cuantos antes de mandar.
    const previo = await cargaAuto(true);
    if (!previo.ok) return avisa('No se pudo simular', previo.error);
    const cuantos = num(previo.templateSent) + num(previo.textSent) + num(previo.followUps);
    if (!cuantos) return avisa('No hay a quién', 'Con esos filtros no entra nadie.');
    if (!confirm('Se va a escribir a ' + cuantos + ' contacto(s) con plantilla aprobada.\n\n'
      + 'Quien pidió la baja no recibe nada. ¿Seguimos?')) return;
    const b = $('atEnviar'); b.disabled = true; b.textContent = 'Enviando…';
    pintaResumen('atCuerpo', await cargaAuto(false), 'Enviado');
    b.disabled = false; b.textContent = 'Enviar de verdad';
  };

  // --- Etiquetas en lote ---
  const cargaEtq = dry => llama({
    action:'followup', mode:'sync_tags', dry,
    limit: Math.min(500, num($('etLimite').value) || 200),
    use_ai: $('etIa').value !== '0',
    stage: $('etEtapa').value || '', category: $('etCat').value || '',
  });
  $('etSimular').onclick = async () => {
    const b = $('etSimular'); b.disabled = true;
    pintaResumen('etCuerpo', await cargaEtq(true), 'Simulación · no se cambió nada');
    b.disabled = false;
  };
  $('etAplicar').onclick = async () => {
    if (!confirm('¿Aplicar los cambios de etiqueta a las conversaciones que entren en el filtro?')) return;
    const b = $('etAplicar'); b.disabled = true; b.textContent = 'Aplicando…';
    pintaResumen('etCuerpo', await cargaEtq(false), 'Aplicado');
    b.disabled = false; b.textContent = 'Aplicar';
  };

  // --- Reparar etapas ---
  $('etpRevisar').onclick = async () => {
    const b = $('etpRevisar'); b.disabled = true;
    const r = await llama({ action:'stageRepair', operation:'scan' });
    b.disabled = false;
    const c = $('etpCuerpo');
    if (!r.ok) { c.innerHTML = '<p class="bajada">' + esc(r.error || 'error') + '</p>'; return; }
    const n = num(r.total) || (r.invalidas || []).length;
    // Se ensena QUE se va a cambiar y a QUE, no solo cuantas. Mover fichas a "cliente" las
    // mete en el conteo de ventas: quien pulsa tiene derecho a ver antes si eso cuadra con
    // lo que recuerda, y a reconocer algunos nombres de la lista.
    // Cada etapa rota lleva su propio desplegable. La traduccion por defecto acierta con
    // 'descalificado', pero 'cerrado' NO es obvia: en esta base hay fichas 'cerrado' cuyo
    // estado sigue siendo requiere_humano o abierto, y darlas por vendidas mete ventas que
    // no existen. Eso lo decide quien conoce el negocio, no el que escribio el codigo.
    const porEtapa = Object.entries(r.por_etapa || {})
      .map(([e, k]) => '<div class="campo"><label>' + k + ' con etapa «' + esc(e) + '» pasan a</label>'
        + '<select data-etp-destino="' + esc(e) + '">'
        // Sin traduccion confirmada no se preselecciona nada: una opcion ya elegida se
        // acepta sin mirar, y aqui hay que mirar. Quien repara tiene que decidirlo.
        + (((r.traducciones || {})[e]) ? '' : '<option value="">— elige a dónde —</option>')
        + ETAPAS.map(v => '<option value="' + esc(v) + '"'
            + (((r.traducciones || {})[e] || '') === v ? ' selected' : '') + '>' + esc(v) + '</option>').join('')
        + '</select></div>')
      .join('');
    const muestra = (r.filas || []).slice(0, 8)
      .map(f => '<div class="dato"><div class="k">' + esc(hora(f.last_message_at)) + '</div>'
        + '<div class="v">' + esc(f.name || '') + ' · ' + esc(f.lead_status || 'sin estado') + '</div></div>')
      .join('');
    c.innerHTML = '<div class="dato"><div class="k">Fichas con etapa rota</div><div class="v">' + n + '</div></div>'
      + porEtapa
      + (muestra ? '<div class="seccion" style="margin:14px 0 6px">Las más recientes</div>' + muestra : '');
    // El boton solo se enciende si de verdad hay algo que mover: un boton activo que no
    // hace nada al pulsarlo se lee como que el panel fallo.
    $('etpAplicar').disabled = !n;
  };
  $('etpAplicar').onclick = async () => {
    const elegido = [...document.querySelectorAll('[data-etp-destino]')]
      .map(s => s.dataset.etpDestino + ' → ' + s.value).join('\n');
    if (!confirm('Se van a reparar las fichas así:\n\n' + elegido
      + '\n\nSe guarda la etapa original por si hay que revisarlo. ¿Seguimos?')) return;
    const b = $('etpAplicar'); b.disabled = true; b.textContent = 'Moviendo…';
    // Se manda lo que el dueno dejo elegido en los desplegables, no lo que el servidor
    // traduciria por su cuenta. Si la vista previa dice una cosa y el envio hace otra, la
    // vista previa no sirve de nada.
    const destinos = {};
    // Una etapa sin destino elegido se queda como esta y se reporta: el servidor la mete en
    // sin_traduccion y el aviso lo dice. Es preferible a colarla en cualquier sitio.
    document.querySelectorAll('[data-etp-destino]').forEach(s => {
      if (s.value) destinos[s.dataset.etpDestino] = s.value;
    });
    const r = await llama({ action:'stageRepair', operation:'apply', destinos });
    b.textContent = 'Mover a cliente';
    if (!r.ok) { b.disabled = false; return avisa('No se pudo', r.error); }
    const sobran = (r.sin_traduccion || []).length
      ? ' Quedaron ' + r.sin_traduccion.length + ' etapa(s) que nadie sabe traducir: ' + r.sin_traduccion.join(', ') + '.'
      : '';
    avisa('Etapas reparadas', (r.movidas || 0) + ' ficha(s) reparadas.' + sobran);
    $('etpRevisar').click();
  };
}

// El servidor ya tiene la norma implementada y sabe aplicarla en bloque: scan lista sin
// tocar nada, apply marca todas. Se usa esa, no una copia en el panel: la regla de
// negocio tiene que vivir en un solo sitio o las dos acaban discrepando.
async function escaneaDesinteres(){
  const b = $('recoEscanear');
  b.disabled = true;
  $('recoCuerpo').innerHTML = '<p class="bajada"><span class="cargando"></span> Recorriendo el historial…</p>';
  const r = await llama({ action:'disinterest', operation:'scan' });
  b.disabled = false;
  if (!r.ok) { $('recoCuerpo').innerHTML = ''; return avisa('No se pudo escanear', r.error); }
  // 'candidatas', en femenino y sin traducir. Se leia 'candidates || candidatos || rows' y
  // NINGUNA existe: filas salia siempre vacia, asi que la herramienta contestaba "el
  // historial ya esta al dia" aunque el servidor hubiera encontrado ciento ochenta. Un falso
  // todo-en-orden es peor que un error: el error se investiga, esto se cree.
  const filas = r.candidatas || [];
  // El servidor devuelve la lista RECORTADA a 200, pero 'apply' marca TODAS las que
  // encuentre --barre hasta 2000 conversaciones--. El panel contaba filas.length, asi que con
  // mas de 200 candidatas leias "Marcar los 200", confirmabas "Se marcaran 200 contactos" y
  // se marcaban, por ejemplo, 380. A los 180 que nunca viste se les apaga el marketing y los
  // seguimientos de golpe, y eso no se deshace con un boton.
  //
  // El total venia en la respuesta desde el principio; solo habia que mirarlo.
  const total = Number.isFinite(Number(r.total)) ? Number(r.total) : filas.length;
  const recortada = total > filas.length;
  if (!filas.length) {
    $('recoCuerpo').innerHTML = '<p class="bajada">Ninguno. El historial ya está al día: nadie '
      + 'cumple la norma sin estar marcado.</p>';
    return;
  }
  $('recoCuerpo').innerHTML = '<div class="propuesta" style="max-width:900px">'
    + '<div class="tapa"><b>' + total + ' contacto(s) deberían estar marcados</b></div>'
    + '<div class="cuerpo"><p class="aviso" style="margin:0 0 10px">Recibieron dos seguimientos y no '
    +   'contestaron. Marcarlos apaga marketing y seguimientos; pueden seguir escribiendo y se les '
    +   'puede contestar a mano.</p>'
    + '<div class="destinos">' + filas.slice(0,80).map(f =>
        '<span>' + esc(f.customer_name || f.contact_name || f.wa_phone || f.conversation_id) + '</span>').join('')
    + (total > 80 ? '<span>… y ' + (total-80) + ' más</span>' : '') + '</div></div>'
    + (recortada ? '<p class="aviso" style="margin:0 12px 10px">De los ' + total + ' solo se '
        + 'pueden listar ' + filas.length + ' aquí, pero el botón los marca <b>todos</b>.</p>' : '')
    + '<div class="patas"><button class="btn-solido" id="recoAplicar">Marcar los ' + total + '</button>'
    +   '<button class="btn-linea" id="recoCancelar">Cancelar</button></div></div>';
  $('recoCancelar').onclick = () => { $('recoCuerpo').innerHTML = ''; };
  $('recoAplicar').onclick = async () => {
    if (!confirm('Se marcarán ' + total + ' contactos como desinteresados.\n\n'
      + 'Dejan de contar en las métricas y de recibir marketing y seguimientos.\n\n¿Continuar?')) return;
    const ap = $('recoAplicar');
    ap.disabled = true; ap.textContent = 'Marcando…';
    const r2 = await llama({ action:'disinterest', operation:'apply' });
    ap.disabled = false;
    if (!r2.ok) { ap.textContent = 'Marcar los ' + total; return avisa('No se pudo aplicar', r2.error); }
    $('recoCuerpo').innerHTML = '<p class="bajada">Historial reconstruido: '
      + (r2.marcadas ?? total) + ' contacto(s) marcados.</p>';
    avisa('Historial reconstruido', 'Ya no cuentan en las métricas.');
  };
}

async function programaAcercamiento(lista){
  const base = $('limTexto').value.trim();
  if (!base) return avisa('Escribe el mensaje base');
  const mañana = new Date(); mañana.setDate(mañana.getDate() + 1); mañana.setHours(10, 0, 0, 0);
  if (!confirm('Se programa UN acercamiento para ' + lista.length + ' contactos, mañana a las 10:00.\n\n'
    + 'No sale nada hoy. Cada mensaje va personalizado y aparecerá en Recordatorios para '
    + 'revisarlo antes de enviarlo.\n\n¿Continuar?')) return;
  const b = $('limProgramar');
  b.disabled = true;
  let hechos = 0; const fallos = [];
  for (const c of lista) {
    b.textContent = 'Programando ' + (hechos + 1) + ' de ' + lista.length + '…';
    const r = await llama({ action:'updateLead', conversation_id: c.id || c._id, fields:{
      follow_up_at: mañana.toISOString(),
      pending_questions: personaliza(base, c),
      next_step_suggested: 'Último acercamiento antes de darlo por desinteresado.',
    }});
    if (r.ok) { hechos++; Object.assign(c, { follow_up_at: mañana.toISOString() }); }
    else fallos.push(nombreDe(c) + ': ' + r.error);
  }
  b.disabled = false;
  avisa('Programados ' + hechos + ' de ' + lista.length,
    fallos.length ? fallos.slice(0,2).join(' · ') : 'Mañana a las 10:00, en Recordatorios.');
  pintaLimpieza();
}

async function descartaOlvidados(lista){
  if (!confirm('Se marcan ' + lista.length + ' contactos como desinteresados.\n\n'
    + 'Ya recibieron dos seguimientos sin contestar. Dejan de recibir marketing y '
    + 'seguimientos, y dejan de contar en las métricas. Pueden seguir escribiendo.\n\n'
    + '¿Continuar?')) return;
  const b = $('limDescartar');
  b.disabled = true;
  let hechos = 0;
  for (const c of lista) {
    b.textContent = 'Marcando ' + (hechos + 1) + ' de ' + lista.length + '…';
    const r = await llama({ action:'disinterest', operation:'mark', conversation_id: c.id || c._id,
      reason: 'sin respuesta tras dos seguimientos, más de ' + DIAS_INACTIVO + ' días dormido' });
    if (r.ok) { hechos++; c.lifecycle_stage = 'desinteresado'; }
  }
  b.disabled = false;
  avisa('Marcados ' + hechos + ' de ' + lista.length, 'Ya no cuentan en las métricas.');
  pintaLimpieza();
  pintaChats();
}

// ===== PACK DE ESTADOS =====
// 1080x1920 es el formato de Estado de WhatsApp. Subir una foto normal la recorta el propio
// WhatsApp por donde le parece, y suele cortar cabezas: por eso se prepara antes.
//
// Todo ocurre en el navegador, con canvas. Las fotos NO se suben a ningun servidor, que es
// lo que permite usarlo con una sesion que el cliente todavia no ha visto.
const PK_ANCHO = 1080, PK_ALTO = 1920;
let PK_HECHAS = [];

function pkCubre(ctx, im, escala){
  const s = Math.max(PK_ANCHO / im.width, PK_ALTO / im.height) * (escala || 1);
  const w = im.width * s, h = im.height * s;
  ctx.drawImage(im, (PK_ANCHO - w) / 2, (PK_ALTO - h) / 2, w, h);
}
function pkCabe(ctx, im){
  const s = Math.min(PK_ANCHO / im.width, PK_ALTO / im.height);
  const w = im.width * s, h = im.height * s;
  ctx.drawImage(im, (PK_ANCHO - w) / 2, (PK_ALTO - h) / 2, w, h);
}
function pkAbre(archivo){
  return new Promise((ok, mal) => {
    const u = URL.createObjectURL(archivo);
    const im = new Image();
    im.onload = () => ok({ im, u });
    im.onerror = () => { URL.revokeObjectURL(u); mal(new Error('no es una imagen')); };
    im.src = u;
  });
}
async function pkProcesa(archivo, modo, conMarca){
  const { im, u } = await pkAbre(archivo);
  const cv = document.createElement('canvas');
  cv.width = PK_ANCHO; cv.height = PK_ALTO;
  const ctx = cv.getContext('2d');
  if (modo === 'fill') {
    pkCubre(ctx, im, 1);
  } else {
    // Fondo difuminado y foto entera encima: asi no se recorta al sujeto, que es el fallo
    // que tiene subir la foto tal cual.
    ctx.save(); ctx.filter = 'blur(34px)'; pkCubre(ctx, im, 1.18); ctx.restore();
    ctx.fillStyle = 'rgba(8,10,16,.46)'; ctx.fillRect(0, 0, PK_ANCHO, PK_ALTO);
    pkCabe(ctx, im);
  }
  if (conMarca) {
    const nombre = String(CFG.brandName || '');
    const numero = String(CFG.businessDisplayNumber || CFG.businessNumber || '');
    // Degradado detras del texto: sobre una foto clara, letras blancas a secas no se leen.
    const gr = ctx.createLinearGradient(0, PK_ALTO - 300, 0, PK_ALTO);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.72)');
    ctx.fillStyle = gr; ctx.fillRect(0, PK_ALTO - 300, PK_ANCHO, 300);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    if (nombre) {
      ctx.font = '700 46px system-ui,-apple-system,Segoe UI,sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(nombre, 58, numero ? PK_ALTO - 96 : PK_ALTO - 66);
    }
    if (numero) {
      ctx.font = '500 34px system-ui,-apple-system,Segoe UI,sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.88)';
      ctx.fillText('WhatsApp ' + numero, 58, PK_ALTO - 48);
    }
  }
  URL.revokeObjectURL(u);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9));
  return { blob, url: URL.createObjectURL(blob) };
}

function cableaPackEstados(){
  const ir = $('pkIr'); if (!ir) return;
  ir.onclick = async () => {
    const archivos = [...($('pkFotos').files || [])];
    if (!archivos.length) return avisa('Elige fotos primero');
    // Los object URL anteriores se sueltan: con veinte fotos por pasada, no hacerlo deja
    // la memoria del navegador creciendo hasta que se pone lento.
    PK_HECHAS.forEach(x => URL.revokeObjectURL(x.url));
    PK_HECHAS = [];
    ir.disabled = true; ir.textContent = 'Preparando…';
    const modo = $('pkModo').value, marca = $('pkMarca').checked;
    const fallos = [];
    for (const f of archivos) {
      try { PK_HECHAS.push(await pkProcesa(f, modo, marca)); }
      catch (e) { fallos.push(f.name); }
    }
    ir.disabled = false; ir.textContent = 'Preparar';
    $('pkBajar').disabled = !PK_HECHAS.length;
    $('pkSalida').innerHTML = (PK_HECHAS.length
        ? '<div class="destinos" style="margin-top:10px">'
          + PK_HECHAS.map((x, i) => '<a href="' + x.url + '" download="estado-' + (i + 1) + '.jpg">'
            + '<img src="' + x.url + '" style="width:78px;height:139px;object-fit:cover;'
            + 'border-radius:8px;border:1px solid var(--line2)"></a>').join('')
          + '</div>'
        : '')
      + (fallos.length ? '<p class="bajada">No se pudieron leer: ' + esc(fallos.join(', ')) + '</p>' : '')
      + (PK_HECHAS.length ? '<p class="bajada">' + PK_HECHAS.length + ' lista(s). Pulsa una para bajarla suelta.</p>' : '');
  };
  $('pkBajar').onclick = () => {
    // Una descarga por foto, separadas en el tiempo: lanzarlas de golpe hace que el
    // navegador bloquee todas menos la primera y parezca que no funciona.
    PK_HECHAS.forEach((x, i) => setTimeout(() => {
      const a = document.createElement('a');
      a.href = x.url; a.download = 'estado-' + (i + 1) + '.jpg'; a.click();
    }, i * 350));
  };
}

async function llenaPlantillasBc(){
  const sel2 = $('bcTpl');
  sel2.innerHTML = '<option>Cargando…</option>';
